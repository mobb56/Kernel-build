            grep -q '[[:space:]]__versions[[:space:]]'; then
            echo "ERROR: stock qca_cld3_wlan.ko has no __versions section."
            exit 1
          fi

          echo "PASS: stock module contains __versions."

          echo
          echo "=== Verify custom __versions section ==="

          if ! "${LLVM_BIN}/llvm-readelf" -S -W "${CUSTOM_WLAN}" |
            grep -q '[[:space:]]__versions[[:space:]]'; then
            echo "ERROR: custom wlan.ko has no __versions section."
            exit 1
          fi

          echo "PASS: custom module contains __versions."

          echo
          echo "=== Extract stock __versions ==="

          rm -f "${STOCK_VERSIONS}"

          "${LLVM_BIN}/llvm-objcopy" \
            --dump-section "__versions=${STOCK_VERSIONS}" \
            "${STOCK_WLAN}"

