ock qca_cld3_wlan.ko has no __versions section.\"\n  exit 1\nfi\n\necho \"PASS:stock module contains __versions.\"\necho\necho \"=== Verify custom __versions section ===\"\n\nif ! \"${LLVM_BIN}/llvm-readelf\" -S -W \"${CUSTOM_WLAN}\" |\n  grep -q '[[:space:]]__versions[[:space:]]'; then\n  echo \"ERROR:custom wlan.ko has no __versions section.\"\n  exit 1\nfi\n\necho \"PASS:custom module contains __versions.\"\n\necho\necho \"=== Extract stock __versions ===\"\n\nrm -f \"${STOCK_VERSIONS}\"\n\n\"${LLVM_BIN}/llvm-objcopy\" \\\n  --dump-section \"__versions=${STOCK_VERSIONS}\" \\\n  \"${STOCK_WLAN}\"\n\ntest -s \"${STOCK_VERSIONS}\"\n\necho \"Stock __versions:\"\nstat -c '%s bytes' \"${STOCK_VERSIONS}\"\n\necho\necho \"=== Extract custom __versions ===\"\n\nrm -f \"${CUSTOM_VERSIONS}\"\n\n\"${LLVM_BIN}/llvm-objcopy\" \\\n  --dump-section \"__versions=${CUSTOM_VERSIONS}\" \\\n  \"${CUSTOM_WLAN}\"\n\ntest -s \"${CUSTOM_VERSIONS}\"\n\necho \"Custom __versions:\"\nstat -c '%s bytes' \"${CUSTOM_VERSIONS}\"\n\necho\necho \"=== Direct stock/custom CRC comparison ===\"\n\nSTOCK_VERSIONS=\"${STOCK_VERSIONS}\" \\\nCUSTOM_VERSIONS=\"${CUSTOM_VERSIONS}\" \\\nSYMVERS=\"${SYMVERS}\" \\\nREPORT=\"${REPORT}\" \\\npython3 - <<'PY'\nimport os\nimport struct\nimport sys\n\nstock_path = os.environ[\"STOCK_VERSIONS\"]\ncustom_path = os.environ[\"CUSTOM_VERSIONS\"]\nsymvers_path = os.environ[\"SYMVERS\"]\nreport_path = os.environ[\"REPORT\"]\n\nREQUIRED = {\n    \"module_layout\",\n    \"cfg80211_unlink_bss\",\n    \"cfg80211_get_bss\",\n    \"cfg80211_inform_bss_frame_data\",\n    \"cfg80211_sched_scan_results\",\n}\n\nRECORD_SIZE = 64\nNAME_OFFSET = 8\nNAME_SIZE = 56\n\ndef parse_versions(path):\n    with open(path, \"rb\") as f:\n        data = f.read()\n\n    if not data:\n        raise RuntimeError(\n            f\"{path}: empty __versions section\"\n        )\n\n    if len(data) % RECORD_SIZE != 0:\n        raise RuntimeError(\n            f\"{path}: {len(data)} bytes is not \"\n            f\"divisible by {RECORD_SIZE}\"\n        )\n\n    result = {}\n\n    for offset in range(\n        0,\n        len(data),\n        RECORD_SIZE\n    ):\n        crc = struct.unpack_from(\n            \"<Q\",\n            data,\n            offset\n        )[0] & 0xffffffff\n\n        raw_name = data[\n            offset + NAME_OFFSET:\n            offset + NAME_OFFSET + NAME_SIZE\n        ]\n\n        name = raw_name.split(\n            b\"\\0\",\n            1\n        )[0].decode(\n            \"ascii\",\n            errors=\"strict\"\n        )\n\n        if name:\n            result[name] = crc\n\n    return result, len(data)\n\ndef parse_symvers(path):\n    result = {}\n\n    with open(\n        path,\n        \"r\",\n        encoding=\"utf-8\",\n        errors=\"replace\"\n    ) as f:\n        for line in f:\n            fields = line.rstrip(\"\\n\").split()\n\n            if len(fields) < 2:\n                continue\n\n            try:\n                crc = int(\n                    fields[0],\n                    16\n                ) & 0xffffffff\n            except ValueError:\n                continue\n\n            result[fields[1]] = crc\n\n    return result\n\nstock, stock_size = parse_versions(\n    stock_path\n)\n\ncustom, custom_size = parse_versions(\n    custom_path\n)\n\nsymvers = parse_symvers(\n    symvers_path\n)\n\nprint()\nprint(\"=\" * 78)\nprint(\"QCACLD3 DIRECT STOCK VS CUSTOM ABI\")\nprint(\"=\" * 78)\n\nprint(\n    f\"Stock __versions : {stock_size} bytes\"\n)\n\nprint(\n    f\"Custom __versions: {custom_size} bytes\"\n)\n\nprint(\n    f\"Stock symbols    : {len(stock)}\"\n)\n\nprint(\n    f\"Custom symbols   : {len(custom)}\"\n)\n\nprint(\n    f\"Module.symvers   : {len(symvers)}\"\n)\n\nfailed = False\n\nprint()\nprint(\"-\" * 78)\nprint(\"REQUIRED SYMBOLS\")\nprint(\"-\" * 78)\n\nreport = []\n\nfor symbol in sorted(REQUIRED):\n\n    s = stock.get(symbol)\n    c = custom.get(symbol)\n    v = symvers.get(symbol)\n\n    if s is