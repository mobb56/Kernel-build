name: Moto G9 Power cebu NetHunter

on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "Run the kernel compilation after all static audits pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  KERNEL_BRANCH: lineage-23.2

  NETHUNTER_REPO: https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git
  NETHUNTER_BRANCH: nethunter-lineage-23.2

  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out

  # Stock kernel metadata shows Clang/LLVM 21.
  LLVM_DIR: /usr/lib/llvm-21

jobs:
  build:
    name: Build cebu NetHunter kernel
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT THIS WORKFLOW REPOSITORY
      # ============================================================

      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL BASE BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libssl-dev \
            curl \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 3. INSTALL LLVM / CLANG 21
      # ============================================================

      - name: Install Android LLVM clang-r563880c
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="r29"
          NDK_ARCHIVE="android-ndk-r29-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/${NDK_ARCHIVE}"
          NDK_SHA1="87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b"

          NDK_ROOT="${GITHUB_WORKSPACE}/android-ndk-r29"
          ANDROID_LLVM_DIR="${GITHUB_WORKSPACE}/android-llvm"
          NDK_ZIP="${RUNNER_TEMP}/${NDK_ARCHIVE}"

          echo "============================================================"
          echo "ANDROID NDK r29 / CLANG-r563880c"
          echo "============================================================"

          rm -rf "${NDK_ROOT}"
          rm -rf "${ANDROID_LLVM_DIR}"
          rm -f "${NDK_ZIP}"

          echo
          echo "=== Downloading official Google Android NDK r29 ==="

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -o "${NDK_ZIP}" \
            "${NDK_URL}"

          test -s "${NDK_ZIP}"

          echo
          echo "=== Verifying NDK SHA-1 ==="

          echo "${NDK_SHA1}  ${NDK_ZIP}" | sha1sum -c -

          echo
          echo "NDK archive verified."

          echo
          echo "=== Extracting Android NDK r29 ==="

          unzip -q "${NDK_ZIP}" -d "${GITHUB_WORKSPACE}"

          test -d "${NDK_ROOT}"

          echo
          echo "=== Selecting LLVM toolchain ==="

          LLVM_SOURCE="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"

          test -d "${LLVM_SOURCE}"

          cp -a "${LLVM_SOURCE}" "${ANDROID_LLVM_DIR}"

          test -x "${ANDROID_LLVM_DIR}/bin/clang"
          test -x "${ANDROID_LLVM_DIR}/bin/ld.lld"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-ar"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-nm"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-objcopy"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-strip"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-readelf"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-objdump"

          echo
          echo "=== Verify clang version ==="

          "${ANDROID_LLVM_DIR}/bin/clang" --version

          "${ANDROID_LLVM_DIR}/bin/clang" --version \
            | grep -q -F "clang version 21.0.0"

             echo
             echo "=== Verify clang source revision ==="

             echo "Checking compiler identity..."

             CLANG_VERSION="$("${ANDROID_LLVM_DIR}/bin/clang" --version)"

              echo "${CLANG_VERSION}"

               echo
               echo "=== Verify clang-r563880c ==="

               echo "${CLANG_VERSION}" | grep -F "clang version 21.0.0"
               echo "${CLANG_VERSION}" | grep -F "based on r563880c"

                echo
                echo "Android clang-r563880c source revision verified."
      # ============================================================
      # 4. PREPARE DETERMINISTIC LLVM TOOLCHAIN
      # ============================================================

         
      - name: Prepare Android LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_LLVM_DIR="${GITHUB_WORKSPACE}/android-llvm"
          LLVM_BIN="${ANDROID_LLVM_DIR}/bin"

          test -x "${ANDROID_LLVM_DIR}/bin/clang"
          test -x "${ANDROID_LLVM_DIR}/bin/ld.lld"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-ar"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-nm"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-objcopy"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-strip"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-readelf"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-objdump"

          echo "=== Android LLVM toolchain selected ==="

          echo "LLVM_DIR=${ANDROID_LLVM_DIR}" >> "${GITHUB_ENV}"
          echo "LLVM_BIN=${LLVM_BIN}" >> "${GITHUB_ENV}"
          echo "PATH=${LLVM_BIN}:${PATH}" >> "${GITHUB_ENV}"

          echo
          echo "=== Verify Android Clang directly ==="

          "${ANDROID_LLVM_DIR}/bin/clang" --version
          "${ANDROID_LLVM_DIR}/bin/ld.lld" --version

          "${ANDROID_LLVM_DIR}/bin/clang" --version \
            | grep -q -F 'clang version 21.0.0'

          echo
          echo "Android LLVM toolchain prepared successfully."
      # ============================================================
      # 5. VERIFY THAT CLANG 21 IS ACTUALLY SELECTED
      # ============================================================

      - name: Verify Android Clang 21.0.0 toolchain
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="${LLVM_BIN}:${PATH}"

          echo "clang:"
          command -v clang
          clang --version

          echo
          echo "ld.lld:"
          command -v ld.lld
          ld.lld --version

          echo
          echo "llvm-ar:"
          command -v llvm-ar
          llvm-ar --version

          echo
          echo "llvm-nm:"
          command -v llvm-nm
          llvm-nm --version

          echo
          echo "llvm-objcopy:"
          command -v llvm-objcopy

          echo
          echo "llvm-strip:"
          command -v llvm-strip

          echo
          echo "llvm-readelf:"
          command -v llvm-readelf

          echo
          echo "Checking compiler generation..."

          "${LLVM_BIN}/clang" --version |
          grep -q -F 'clang version 21.0.0'

          echo
          echo "Android Clang 21.0.0 toolchain verification PASSED."

      # ============================================================
      # 6. VERIFY THE STOCK CONFIGURATION FILE EXISTS
      #
      # This file is the authoritative cebu hardware baseline.
      # ============================================================

      - name: Verify stock cebu configuration
        shell: bash
        run: |
          set -euxo pipefail

          test -f cebu-stock.config
          test -s cebu-stock.config

          echo "Stock configuration:"
          ls -lh cebu-stock.config

          echo
          echo "Configuration line count:"
          wc -l cebu-stock.config

          echo
          echo "First configuration lines:"
          head -n 10 cebu-stock.config

          echo
          echo "Stock cebu configuration is present."


      # ============================================================
      # 7. CLONE CEBU KERNEL SOURCE
      # ============================================================

      - name: Clone cebu kernel source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf kernel

           git clone \
             --branch "${KERNEL_BRANCH}" \
             --single-branch \
              "${KERNEL_REPO}" \
               kernel

               cd kernel

            git checkout 39bcecd5c63df849923b1faadc9cde482648a1a1

          echo
          echo "============================================================"
          echo "CEBU KERNEL SOURCE IDENTITY"
          echo "============================================================"

          CURRENT_COMMIT="$(git rev-parse HEAD)"
          CURRENT_SHORT="$(git rev-parse --short=12 HEAD)"

          echo
          echo "Repository:"
          git remote get-url origin

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Current HEAD:"
          echo "${CURRENT_COMMIT}"

          echo
          echo "Current 12-character commit:"
          echo "${CURRENT_SHORT}"

          test -n "${CURRENT_COMMIT}"
          test -n "${CURRENT_SHORT}"

          echo
          echo "Kernel source successfully cloned."

      # ============================================================
      # 8. VERIFY CORRECT KERNEL BRANCH
      # ============================================================
  
  
      - name: Verify cebu kernel source
        working-directory: kernel
        shell: bash
        run: |
         set -euo pipefail

         echo "============================================================"
         echo "CEBU KERNEL SOURCE VERIFIED"
         echo "============================================================"
         
           EXPECTED_COMMIT="39bcecd5c63df849923b1faadc9cde482648a1a1"
           
          CURRENT_BRANCH="$(git branch --show-current)"
          CURRENT_COMMIT="$(git rev-parse HEAD)"
          CURRENT_SHORT="$(git rev-parse --short=12 HEAD)"

           echo
           echo "Branch:"
           echo "${CURRENT_BRANCH}"

           echo
           echo "Commit:"
           echo "${CURRENT_COMMIT}"

           echo
           echo "12-character commit:"
           echo "${CURRENT_SHORT}"

           echo
           echo "Expected stock source revision:"
           echo "${EXPECTED_COMMIT}"

            test "${CURRENT_COMMIT}" = "${EXPECTED_COMMIT}"

           test -f Makefile
           test -d arch/arm64
           test -d drivers
          test -f arch/arm64/configs/vendor/bengal-perf_defconfig

           echo
           echo "Defconfig:"
           echo "arch/arm64/configs/vendor/bengal-perf_defconfig"

           echo
           echo "Correct cebu kernel source verified."
      

      # ============================================================
      # 9. VERIFY QCACLD3 SOURCE TREE
      #
      # We do not modify it yet.
      # ============================================================

      - name: Verify QCACLD3 source tree
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../artifacts/source-audit

          echo "=== QCACLD3 source tree ==="

          test -d drivers/staging/qcacld-3.0
          test -f drivers/staging/qcacld-3.0/Kbuild

          echo "QCACLD3 root:"
          find drivers/staging/qcacld-3.0 \
            -maxdepth 3 \
            -type f \
            \( -name 'wlan_hdd_main.c' -o -name 'wlan_hdd_main.h' \) \
            -print

          HDD_MAIN_C="$(
            find drivers/staging/qcacld-3.0 \
              -type f \
              -name 'wlan_hdd_main.c' \
              -print -quit
          )"

          HDD_MAIN_H="$(
            find drivers/staging/qcacld-3.0 \
              -type f \
              -name 'wlan_hdd_main.h' \
              -print -quit
          )"

          if [ -z "${HDD_MAIN_C}" ]; then
            echo "ERROR: wlan_hdd_main.c was not found anywhere in QCACLD3."
            exit 1
          fi

          if [ -z "${HDD_MAIN_H}" ]; then
            echo "ERROR: wlan_hdd_main.h was not found anywhere in QCACLD3."
            exit 1
          fi

          echo "wlan_hdd_main.c: ${HDD_MAIN_C}"
          echo "wlan_hdd_main.h: ${HDD_MAIN_H}"

          {
            echo "QCACLD3_ROOT=drivers/staging/qcacld-3.0"
            echo "WLAN_HDD_MAIN_C=${HDD_MAIN_C}"
            echo "WLAN_HDD_MAIN_H=${HDD_MAIN_H}"
          } > ../artifacts/source-audit/qcacld3-paths.txt

          echo "QCACLD3 source tree verified."
      # ============================================================
      # 10. CLONE NETHUNTER REFERENCE
      # ============================================================

      - name: Clone NetHunter reference
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf nethunter-reference

          git clone \
            --depth=1 \
            --branch "${NETHUNTER_BRANCH}" \
            "${NETHUNTER_REPO}" \
            nethunter-reference

          cd nethunter-reference

          echo
          echo "NetHunter reference:"
          git remote -v

          echo
          echo "NetHunter branch:"
          git branch --show-current

          echo
          echo "NetHunter commit:"
          git rev-parse HEAD


      - name: Inspect Cesium userspace injection interface
        run: |
          echo "=== SEARCHING NETHUNTER REFERENCE FOR CESIUM USERSPACE ==="

          grep -RniE \
            --exclude-dir=.git \
            --exclude='*.ko' \
            --exclude='*.o' \
            --exclude='*.a' \
            'WLAN_NLINK_CESIUM|NETLINK_CESIUM|cesium_pid|cesium_nl_srv_sock|inject_events|FRAME_INJECT_CMD|SIOCDEVPRIVATE.*10|hdd_frame_inject_ioctl' \
            nethunter-reference 2>/dev/null | head -300 || true

          echo
          echo "=== SEARCHING FOR CESIUM-RELATED SOURCE FILES ==="

          find nethunter-reference \
            -type f \
            \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.cc' -o -name '*.py' -o -name '*.sh' -o -name 'Makefile' \) \
            -print 2>/dev/null |
          while read -r f; do
            grep -IlE 'cesium|WLAN_NLINK_CESIUM|inject_events|FRAME_INJECT' "$f" 2>/dev/null || true
          done | head -200

          echo
          echo "=== CESIUM PID ASSIGNMENT ==="

          grep -RniE \
            --exclude-dir=.git \
            'cesium_pid[[:space:]]*=|cesium_pid' \
            nethunter-reference 2>/dev/null | head -100 || true



      - name: Locate frame injection implementation
        run: |
           echo "=== LOCATING FRAME INJECTION DEBUG SOURCE ==="

              find nethunter-reference \
              -type f \
               -name 'wlan_hdd_frame_inject_debug.c' \
                -print 2>/dev/null || true

            echo
            echo "=== LOCATING FRAME INJECTION HEADER ==="

             find nethunter-reference \
             -type f \
             -name 'wlan_hdd_frame_inject_debug.h' \
              -print 2>/dev/null || true
 
               echo
             echo "=== LOCATING IOCTL SOURCE ==="

             find nethunter-reference \
             -type f \
             -name 'wlan_hdd_ioctl.c' \
             -print 2>/dev/null || true

           echo
           echo "=== KOBJECT CREATE CALLS ==="

             grep -RniE \
               --include='*.c' \
              'kobject_create_and_add|g_injection_sysfs_kobj' \
               nethunter-reference 2>/dev/null | head -100 || true

              echo
              echo "=== SYSFS INITIALIZATION FUNCTIONS ==="

                grep -RniE \
                --include='*.c' \
              'hdd_injection_init_debug_interfaces|hdd_injection_deinit_debug_interfaces|global_enable' \
                 nethunter-reference 2>/dev/null | head -150 || true

               echo
               echo "=== CESIUM PID ASSIGNMENT CONTEXT ==="

                grep -RniE \
              --include='*.c' \
              --include='*.h' \
              'cesium_pid[[:space:]]*=' \
               nethunter-reference 2>/dev/null | head -100 || true
 
             echo
             echo "=== CESIUM NETLINK DEFINITIONS ==="

                 grep -RniE \
                --include='*.c' \
                --include='*.h' \
              'WLAN_NLINK_CESIUM|NETLINK_CESIUM' \
               nethunter-reference 2>/dev/null | head -100 || true



      - name: Inspect exact injection sysfs implementation
        run: |
            echo "=== EXACT FRAME INJECTION SYSFS CODE ==="

             sed -n '600,670p' \
                     nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c

                   echo
                   echo "=== INJECTION SYSFS ATTRIBUTE DEFINITIONS ==="

                     sed -n '470,545p' \
                     nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c

                    echo
                    echo "=== INJECTION INITIALIZATION CALLER ==="

                      sed -n '15535,15575p' \
                     nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c

                     echo
                      echo "=== ALL INJECTION DEBUG RETURN CODES ==="

                    grep -n -B8 -A15 \
                 'hdd_injection_init_debug_interfaces' \
                    nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c \
                     2>/dev/null || true





      
      - name: Trace injection debug interface callers
        run: |
          echo "=== hdd_init_frame_injection ==="
          grep -RniE \
            --include='*.c' \
            'hdd_init_frame_injection[[:space:]]*\(' \
            nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src \
            2>/dev/null || true

          echo
          echo "=== hdd_injection_create_debugfs_entries ==="
          grep -RniE \
            --include='*.c' \
            'hdd_injection_create_debugfs_entries[[:space:]]*\(' \
            nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src \
            2>/dev/null || true

          echo
          echo "=== hdd_injection_init_debug_interfaces ==="
          grep -RniE \
            --include='*.c' \
            'hdd_injection_init_debug_interfaces[[:space:]]*\(' \
            nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src \
            2>/dev/null || true

          echo
          echo "=== ALL FEATURE_FRAME_INJECTION_SUPPORT CALL SITES ==="
          grep -RniE \
            --include='*.c' \
            '#ifdef FEATURE_FRAME_INJECTION_SUPPORT|hdd_injection_init_debug_interfaces|hdd_injection_create_debugfs_entries' \
            nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src \
            2>/dev/null || true 




      - name: Inspect injection initialization call contexts
        run: |
          echo "=== CALLER A: hdd_init_frame_injection ==="
          sed -n '6535,6600p' \
            nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c

          echo
          echo "=== CALLER B: hdd_injection_init_debug_interfaces ==="
          sed -n '15515,15580p' \
            nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c

          echo
          echo "=== DEBUG INTERFACE FUNCTION ==="
          sed -n '45,82p' \
            nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c



      - name: Trace hdd_init runtime call path
        run: |
          echo "=== ALL hdd_init CALL SITES ==="
          grep -RniE \
            --include='*.c' \
            --include='*.h' \
            'hdd_init[[:space:]]*\(' \
            nethunter-reference/drivers/staging/qcacld-3.0/core/hdd \
            2>/dev/null || true

          echo
          echo "=== WLAN MODULE INIT FUNCTIONS ==="
          grep -RniE \
            --include='*.c' \
            'module_init|module_exit|qdf_module|hdd_init[[:space:]]*\(' \
            nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src \
            2>/dev/null || true

          echo
          echo "=== hdd_init DEBUG INTERFACE BLOCK ==="
          sed -n '90,142p' \
            nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c




      - name: Verify injection feature guards and Kbuild flags
        run: |
           echo "=== KBUILD FRAME INJECTION DEFINITIONS ==="
           grep -RniE \
           --include='Kbuild' \
           --include='Makefile' \
           'FEATURE_FRAME_INJECTION_SUPPORT|wlan_hdd_frame_inject|wlan_hdd_frame_inject_debug|wma_frame_inject' \
            kernel/drivers/staging/qcacld-3.0 \
            nethunter-reference/drivers/staging/qcacld-3.0 2>/dev/null || true

            echo
            echo "=== CREATE DEBUGFS SOURCE ==="
            sed -n '185,225p' \
            nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c

             echo
             echo "=== SYSFS INITIALIZER SOURCE ==="
             sed -n '608,650p' \
             nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c

              echo
              echo "=== CALLERS IN SOURCE ==="
               grep -RniE \
               --include='*.c' \
                'hdd_injection_init_debug_interfaces[[:space:]]*\(' \
                 nethunter-reference/drivers/staging/qcacld-3.0 2>/dev/null || true

              echo
               echo "=== FRAME INJECTION CPPFLAGS ==="
               grep -RniE \
               --include='Kbuild' \
                --include='Makefile' \
                 'cppflags-y.*FEATURE_FRAME_INJECTION_SUPPORT|CFLAGS.*FEATURE_FRAME_INJECTION_SUPPORT' \
                kernel/drivers/staging/qcacld-3.0 2>/dev/null || true




      - name: Compare compiled tree injection implementation
        run: |
          echo "=== ACTUAL KERNEL TREE KBUILD ==="
           grep -n -B3 -A8 \
          'FEATURE_FRAME_INJECTION_SUPPORT\|wlan_hdd_frame_inject_debug' \
            kernel/drivers/staging/qcacld-3.0/Kbuild 2>/dev/null || true

             echo
             echo "=== ACTUAL KERNEL TREE SYSFS INITIALIZER CALLERS ==="
              grep -RniE \
             --include='*.c' \
              'hdd_injection_init_debug_interfaces[[:space:]]*\(' \
               kernel/drivers/staging/qcacld-3.0 2>/dev/null || true

            echo
            echo "=== ACTUAL CREATE-DEBUGFS FUNCTION ==="
            grep -n -B10 -A35 \
             'hdd_injection_create_debugfs_entries' \
               kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c \
               2>/dev/null || true

              echo
              echo "=== ACTUAL SYSFS INITIALIZER ==="
              grep -n -B5 -A45 \
             'QDF_STATUS hdd_injection_init_debug_interfaces' \
              kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c \
                2>/dev/null || true

           echo
           echo "=== REFERENCE CREATE-DEBUGFS FUNCTION ==="
             grep -n -B10 -A35 \
             'hdd_injection_create_debugfs_entries' \
             nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c \
             2>/dev/null || true

                echo
               echo "=== SOURCE CHECKSUMS ==="
              sha256sum \
               kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c \
              nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c \
              2>/dev/null || true



      - name: Compare actual and reference debug interface call
        run: |
            echo "=== ACTUAL create_debugfs_entries ==="
            grep -n -B20 -A60 \
             'QDF_STATUS hdd_injection_create_debugfs_entries' \
            kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c \
             || true

            echo
            echo "=== ACTUAL initializer references ==="
            grep -n -B10 -A20 \
             'hdd_injection_init_debug_interfaces' \
             kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c \
             || true

            echo
            echo "=== REFERENCE create_debugfs_entries ==="
            grep -n -B20 -A70 \
             'QDF_STATUS hdd_injection_create_debugfs_entries' \
            nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c \
             || true

            echo
             echo "=== REFERENCE initializer references ==="
            grep -n -B10 -A20 \
            'hdd_injection_init_debug_interfaces' \
            nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c \
              || true

             echo
             echo "=== EXACT DIFF ==="
             diff -u \
