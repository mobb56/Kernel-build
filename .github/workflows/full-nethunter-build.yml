          HDD_SRC="drivers/staging/qcacld-3.0/core/hdd/src"
          WMA_SRC="drivers/staging/qcacld-3.0/core/wma/src"
          HDD_MAIN="$HDD_SRC/wlan_hdd_main.c"
          HDD_FRAME="$HDD_SRC/wlan_hdd_frame_inject.c"
          WMA_FRAME="$WMA_SRC/wma_frame_inject.c"

          echo "=== VERIFYING SOURCE INTEGRATION BEFORE BUILD ==="

          test -f "$HDD_MAIN"
          test -f "$HDD_FRAME"
          test -f "$WMA_FRAME"

          echo
          echo "=== Verifying injected source files ==="

          for f in \
            "$HDD_FRAME" \
            "$HDD_SRC/wlan_hdd_frame_validate.c" \
            "$HDD_SRC/wlan_hdd_inject_security.c" \
            "$HDD_SRC/wlan_hdd_frame_inject_debug.c" \
            "$WMA_FRAME"
          do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing injected source: $f"
              exit 1
            fi
            echo "OK: $f"
          done

          echo "Injection source files verified."

          echo
          echo "=== Verifying HDD injection header ==="

          HEADER_FOUND=0

          awk '
          /wlan_hdd_frame_inject\.h/ {
              print "OK:", FILENAME, ":", NR, ":", $0
              found = 1
          }
          END {
              if (!found)
                  exit 1
          }
          ' "$HDD_MAIN"

          HEADER_FOUND=1

          if [ "$HEADER_FOUND" -ne 1 ]; then
            echo "ERROR: HDD injection header include missing."
            exit 1
          fi

          echo "HDD injection header include verified."

          echo
          echo "=== Verifying frame-injection initialization/integration ==="

          INIT_OK=0

          awk '
          BEGIN {
              found_ctx = 0
              found_init = 0
              found_api = 0
          }

          /frame[_-]?inject/ ||
          /injection[_-]?ctx/ ||
          /inject[_-]?ctx/ {
              print FILENAME ":" NR ":" $0
              found_ctx = 1
          }

          /wlan_hdd_frame_inject/ ||
          /hdd_frame_inject/ ||
          /hdd_inject/ {
              found_api = 1
          }

          /init/ &&
          (/inject/ || /injection/ || /frame/) {
              found_init = 1
          }

          END {
              if (found_ctx && found_api)
                  exit 0

              exit 1
          }
          ' "$HDD_MAIN" "$HDD_FRAME" "$WMA_FRAME" || true

          if awk '
          /frame[_-]?inject/ ||
          /injection[_-]?ctx/ ||
          /inject[_-]?ctx/ {
              ctx = 1
          }

          /wlan_hdd_frame_inject/ ||
          /hdd_frame_inject/ ||
          /hdd_inject/ {
              api = 1
          }

          END {
              if (ctx && api)
                  exit 0
              exit 1
          }
          ' "$HDD_MAIN" "$HDD_FRAME" "$WMA_FRAME"
          then
            INIT_OK=1
          fi

          if [ "$INIT_OK" -ne 1 ]; then
            echo "ERROR: No usable frame-injection integration context found."
            exit 1
          fi

          echo "Frame-injection integration context verified."

          echo
          echo "=== Verifying WMA injection implementation ==="

          awk '
          /wma.*inject/ ||
          /inject.*wma/ ||
          /INJECTION.*DESC/ ||
          /inject.*desc/ {
              print "OK:", FILENAME, ":", NR, ":", $0
              found = 1
          }

          END {
              if (!found)
                  exit 1
          }
          ' "$WMA_FRAME"

          echo "WMA injection implementation verified."

          echo
          echo "=== Verifying injection completion routing ==="

          awk '
