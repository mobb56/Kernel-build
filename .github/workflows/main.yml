name: Build Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      OUT_DIR: ${{ github.workspace }}/kernel-out

    steps:

      # ------------------------------------------------------------
      # 1. Install build dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            lld \
            llvm \
            llvm-14 \
            lld-14 \
            clang-14 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            zip \
            unzip \
            curl \
            wget \
            python3 \
            python3-pip

          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # 2. Checkout kernel source
      # ------------------------------------------------------------
      - name: Clone LineageOS kernel
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo "Kernel commit:"
          git rev-parse HEAD

          echo "Kernel branch:"
          git branch --show-current

          echo "Initial source-tree status:"
          git status --short

      # ------------------------------------------------------------
      # 3. Prepare clean output directory
      # ------------------------------------------------------------
      - name: Prepare build directories
        run: |
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          cd "$KERNEL_DIR"

          make mrproper

          mkdir -p "$OUT_DIR"

      # ------------------------------------------------------------
      # 4. Locate cebu default config
      # ------------------------------------------------------------
      - name: Verify cebu kernel configuration
        run: |
          CEBU_CONFIG="$KERNEL_DIR/vendor/ext_config/cebu-default.config"

          if [ ! -f "$CEBU_CONFIG" ]; then
            echo "ERROR: cebu-default.config was not found:"
            echo "$CEBU_CONFIG"
            exit 1
          fi

          echo "Found:"
          echo "$CEBU_CONFIG"

          echo
          echo "First lines:"
          head -40 "$CEBU_CONFIG"

      # ------------------------------------------------------------
      # 5. Create NetHunter configuration OUTSIDE source tree
      # ------------------------------------------------------------
      - name: Create NetHunter configuration
        run: |
          NH_CONFIG="$GITHUB_WORKSPACE/nethunter.config"

          cat > "$NH_CONFIG" <<'EOF'

          # ==========================================================
          # NetHunter / Bluetooth
          # ==========================================================

          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_RFCOMM=m
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_HIDP=m
          CONFIG_BT_HCIVHCI=m
          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y


          # ==========================================================
          # USB gadget / HID / networking
          # ==========================================================

          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_NCM=y

          CONFIG_USB_GADGET=y
          CONFIG_USB_LIBCOMPOSITE=y

          CONFIG_INPUT_UINPUT=m

          CONFIG_TUN=y
          CONFIG_VETH=m


          # ==========================================================
          # Wireless framework
          # ==========================================================

          CONFIG_CFG80211=y
          CONFIG_RFKILL=y
          CONFIG_NL80211_TESTMODE=y


          # ==========================================================
          # Motorola sensor module dependency
          #
          # dts201a_mmi.ko and abov_sar_mmi_overlay.ko reference
          # sensors_classdev_register/unregister.
          # ==========================================================

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m

          EOF

          echo "NetHunter fragment:"
          cat "$NH_CONFIG"

          echo
          echo "Location:"
          echo "$NH_CONFIG"

          echo
          echo "Confirming fragment is NOT inside kernel Git tree:"
          case "$NH_CONFIG" in
            "$KERNEL_DIR"/*)
              echo "ERROR: NetHunter config is inside kernel source tree!"
              exit 1
              ;;
            *)
              echo "OK"
              ;;
          esac

      # ------------------------------------------------------------
      # 6. Configure kernel
      # ------------------------------------------------------------
      - name: Configure kernel
        run: |
          cd "$KERNEL_DIR"

          CEBU_CONFIG="$KERNEL_DIR/vendor/ext_config/cebu-default.config"
          NH_CONFIG="$GITHUB_WORKSPACE/nethunter.config"

          echo "Generating base cebu configuration..."

          make O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          echo
          echo "Merging cebu configuration..."
          
          scripts/kconfig/merge_config.sh \
            -m \
            -O "$OUT_DIR" \
            "$OUT_DIR/.config" \
            "$CEBU_CONFIG"

          echo
          echo "Merging NetHunter configuration..."

          scripts/kconfig/merge_config.sh \
            -m \
            -O "$OUT_DIR" \
            "$OUT_DIR/.config" \
            "$NH_CONFIG"

          echo
          echo "Running olddefconfig..."

          make O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      # ------------------------------------------------------------
      # 7. Verify requested configuration
      # ------------------------------------------------------------
      - name: Verify NetHunter configuration
        run: |
          CONFIG="$OUT_DIR/.config"

          echo "=================================================="
          echo "NetHunter configuration verification"
          echo "=================================================="

          REQUIRED_CONFIGS=(
            "CONFIG_BT=y"
            "CONFIG_BT_BREDR=y"
            "CONFIG_BT_RFCOMM=m"
            "CONFIG_BT_RFCOMM_TTY=y"
            "CONFIG_BT_HIDP=m"
            "CONFIG_BT_HCIVHCI=m"
            "CONFIG_BT_HCIUART=m"
            "CONFIG_BT_HCIUART_H4=y"

            "CONFIG_USB_CONFIGFS=y"
            "CONFIG_USB_CONFIGFS_F_HID=y"
            "CONFIG_USB_CONFIGFS_NCM=y"
            "CONFIG_USB_GADGET=y"
            "CONFIG_USB_LIBCOMPOSITE=y"

            "CONFIG_INPUT_UINPUT=m"

            "CONFIG_TUN=y"
            "CONFIG_VETH=m"

            "CONFIG_CFG80211=y"
            "CONFIG_RFKILL=y"
            "CONFIG_NL80211_TESTMODE=y"

            "CONFIG_SENSORS_SSC=y"
            "CONFIG_SENSORS_CLASS=m"
          )

          FAILED=0

          for REQUIRED in "${REQUIRED_CONFIGS[@]}"; do
            if grep -qx "$REQUIRED" "$CONFIG"; then
              echo "[OK]   $REQUIRED"
            else
              echo "[FAIL] $REQUIRED"
              FAILED=1
            fi
          done

          echo

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: One or more required configuration options were not enabled."
            exit 1
          fi

          echo "All required NetHunter options are present."

      # ------------------------------------------------------------
      # 8. Verify source tree is CLEAN
      #
      # This is the important fix for the previous "-dirty" release.
      # ------------------------------------------------------------
      - name: Verify clean kernel source tree
        run: |
          cd "$KERNEL_DIR"

          echo "Kernel source tree status:"
          git status --short

          if [ -n "$(git status --porcelain)" ]; then
            echo
            echo "ERROR: Kernel source tree is dirty."
            echo "A dirty tree can cause '-dirty' to be appended to"
            echo "the kernel release string."
            echo
            git status --short
            exit 1
          fi

          echo
          echo "Kernel source tree is CLEAN."

      # ------------------------------------------------------------
      # 9. Verify kernel release BEFORE compiling
      # ------------------------------------------------------------
      - name: Verify kernel release
        run: |
          cd "$KERNEL_DIR"

          EXPECTED_RELEASE="4.19.325-cip135-st19-perf-g39bcecd5c63"

          ACTUAL_RELEASE="$(
            make -s O="$OUT_DIR" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              kernelrelease
          )"

          echo "Expected:"
          echo "$EXPECTED_RELEASE"

          echo
          echo "Actual:"
          echo "$ACTUAL_RELEASE"

          if [ "$ACTUAL_RELEASE" != "$EXPECTED_RELEASE" ]; then
            echo
            echo "ERROR: Kernel release mismatch."
            echo "The build must not continue."
            exit 1
          fi

          echo
          echo "Kernel release matches the phone."

      # ------------------------------------------------------------
      # 10. Save final configuration
      # ------------------------------------------------------------
      - name: Save final kernel config
        run: |
          cp "$OUT_DIR/.config" \
            "$OUT_DIR/kernel.config"

          echo "Final config saved."

      # ------------------------------------------------------------
      # 11. Build Image
      # ------------------------------------------------------------
      - name: Build kernel Image
        run: |
          cd "$KERNEL_DIR"

          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

      # ------------------------------------------------------------
      # 12. Build kernel modules
      # ------------------------------------------------------------
      - name: Build kernel modules
        run: |
          cd "$KERNEL_DIR"

          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules

      # ------------------------------------------------------------
      # 13. Verify Image
      # ------------------------------------------------------------
      - name: Verify kernel Image
        run: |
          IMAGE="$OUT_DIR/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image was not produced."
            exit 1
          fi

          echo "Image:"
          ls -lh "$IMAGE"

          echo
          echo "Kernel release:"
          "$KERNEL_DIR/scripts/extract-vmlinux" "$IMAGE" >/dev/null 2>&1 || true

      # ------------------------------------------------------------
      # 14. Install modules into staging directory
      # ------------------------------------------------------------
      - name: Install kernel modules
        run: |
          MODULE_DIR="$GITHUB_WORKSPACE/modules"

          rm -rf "$MODULE_DIR"
          mkdir -p "$MODULE_DIR"

          cd "$KERNEL_DIR"

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$MODULE_DIR" \
            modules_install

          echo
          echo "Installed modules:"
          find "$MODULE_DIR" -type f -name '*.ko' | sort

      # ------------------------------------------------------------
      # 15. Verify sensors_class.ko
      # ------------------------------------------------------------
      - name: Verify sensor module
        run: |
          SENSOR="$GITHUB_WORKSPACE/modules/vendor/lib/modules/sensors_class.ko"

          if [ ! -f "$SENSOR" ]; then
            echo "ERROR: sensors_class.ko was not generated."
            echo
            find "$GITHUB_WORKSPACE/modules" -type f -name '*sensor*.ko' -o -name 'sensors_class.ko'
            exit 1
          fi

          echo "Found:"
          ls -lh "$SENSOR"

          echo
          echo "Module information:"
          modinfo "$SENSOR" 2>/dev/null || true

      # ------------------------------------------------------------
      # 16. Verify module vermagic matches kernel release
      # ------------------------------------------------------------
      - name: Verify module vermagic
        run: |
          EXPECTED_RELEASE="4.19.325-cip135-st19-perf-g39bcecd5c63"

          SENSOR="$GITHUB_WORKSPACE/modules/vendor/lib/modules/sensors_class.ko"

          VERMAGIC="$(modinfo -F vermagic "$SENSOR" 2>/dev/null || true)"

          echo "Expected kernel release:"
          echo "$EXPECTED_RELEASE"

          echo
          echo "Module vermagic:"
          echo "$VERMAGIC"

          case "$VERMAGIC" in
            "$EXPECTED_RELEASE "*)
              echo
              echo "Module vermagic matches kernel release."
              ;;
            *)
              echo
              echo "ERROR: Module vermagic does not match kernel release."
              exit 1
              ;;
          esac

      # ------------------------------------------------------------
      # 17. Prepare AnyKernel3
      # ------------------------------------------------------------
      - name: Prepare AnyKernel3
        run: |
          AK3="$GITHUB_WORKSPACE/AnyKernel3"

          rm -rf "$AK3"

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            "$AK3"

          rm -rf "$AK3/modules"

          mkdir -p "$AK3/modules"

          cp "$OUT_DIR/arch/arm64/boot/Image" \
            "$AK3/Image"

          cp -a "$GITHUB_WORKSPACE/modules/." \
            "$AK3/modules/"

          echo "AnyKernel3 prepared."

      # ------------------------------------------------------------
      # 18. Configure AnyKernel3
      # ------------------------------------------------------------
      - name: Configure AnyKernel3
        run: |
          AK3="$GITHUB_WORKSPACE/AnyKernel3"

          cat > "$AK3/anykernel.sh" <<'EOF'
          # AnyKernel3 Ramdisk Mod Script

          properties() { '
          kernel.string=Moto G9 Power cebu NetHunter Kernel

          do.devicecheck=1
          do.modules=1
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=cebu
          device.name2=

          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot
          IS_SLOT_DEVICE=auto
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto

          . tools/ak3-core.sh

          dump_boot
          write_boot
          EOF

          chmod 755 "$AK3/anykernel.sh"

          echo "AnyKernel configuration:"
          cat "$AK3/anykernel.sh"

      # ------------------------------------------------------------
      # 19. Verify AnyKernel contents
      # ------------------------------------------------------------
      - name: Verify AnyKernel package
        run: |
          AK3="$GITHUB_WORKSPACE/AnyKernel3"

          echo "Image:"
          ls -lh "$AK3/Image"

          echo
          echo "sensors_class.ko:"
          ls -lh "$AK3/modules/vendor/lib/modules/sensors_class.ko"

          echo
          echo "AnyKernel script:"
          grep -E \
            'device.name1|do.modules|BLOCK=|IS_SLOT_DEVICE=' \
            "$AK3/anykernel.sh"

      # ------------------------------------------------------------
      # 20. Create flashable ZIP
      # ------------------------------------------------------------
      - name: Create flashable ZIP
        run: |
          AK3="$GITHUB_WORKSPACE/AnyKernel3"

          ZIP_FILE="$GITHUB_WORKSPACE/moto-g9-power-cebu-nethunter-flashable.zip"

          rm -f "$ZIP_FILE"

          cd "$AK3"

          zip -r9 "$ZIP_FILE" . \
            -x '.git/*' \
            -x '.github/*'

          echo
          echo "Created:"
          ls -lh "$ZIP_FILE"

          echo
          echo "Testing ZIP..."

          unzip -t "$ZIP_FILE"

      # ------------------------------------------------------------
      # 21. Final release verification
      # ------------------------------------------------------------
      - name: Final verification
        run: |
          EXPECTED_RELEASE="4.19.325-cip135-st19-perf-g39bcecd5c63"

          echo "=============================================="
          echo "FINAL BUILD VERIFICATION"
          echo "=============================================="

          echo
          echo "Expected kernel:"
          echo "$EXPECTED_RELEASE"

          echo
          echo "Kernel source:"
          git -C "$KERNEL_DIR" status --short

          if [ -n "$(git -C "$KERNEL_DIR" status --porcelain)" ]; then
            echo "ERROR: Source tree became dirty."
            exit 1
          fi

          echo
          echo "Final kernel release:"
          make -s \
            -C "$KERNEL_DIR" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            kernelrelease

          echo
          echo "Final ZIP:"
          ls -lh "$GITHUB_WORKSPACE/moto-g9-power-cebu-nethunter-flashable.zip"

          echo
          echo "Final sensors module:"
          ls -lh \
            "$GITHUB_WORKSPACE/modules/vendor/lib/modules/sensors_class.ko"

          echo
          echo "=============================================="
          echo "BUILD COMPLETE"
          echo "=============================================="

      # ------------------------------------------------------------
      # 22. Upload flashable kernel
      # ------------------------------------------------------------
      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-flashable
          path: moto-g9-power-cebu-nethunter-flashable.zip
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 23. Upload raw kernel + config + modules
      # ------------------------------------------------------------
      - name: Collect raw kernel artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/raw-kernel"

          cp "$OUT_DIR/arch/arm64/boot/Image" \
            "$GITHUB_WORKSPACE/raw-kernel/Image"

          cp "$OUT_DIR/kernel.config" \
            "$GITHUB_WORKSPACE/raw-kernel/kernel.config"

          cp "$GITHUB_WORKSPACE/nethunter.config" \
            "$GITHUB_WORKSPACE/raw-kernel/nethunter.config"

          cp "$GITHUB_WORKSPACE/modules/vendor/lib/modules/sensors_class.ko" \
            "$GITHUB_WORKSPACE/raw-kernel/sensors_class.ko"

          echo "Raw kernel artifact:"
          find "$GITHUB_WORKSPACE/raw-kernel" -type f -exec ls -lh {} \;

      - name: Upload raw kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          path: raw-kernel/
          if-no-files-found: error
          retention-days: 30
