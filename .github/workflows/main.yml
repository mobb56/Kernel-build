name: Build Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # 1. Install build dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang-14 \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ---------------------------------------------------------
      # 2. Checkout Motorola SM6225 kernel
      # ---------------------------------------------------------
      - name: Checkout LineageOS kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6225
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      # ---------------------------------------------------------
      # 3. Checkout cebu device tree
      # ---------------------------------------------------------
      - name: Checkout cebu device tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_cebu
          ref: lineage-23.2
          path: device/motorola/cebu
          fetch-depth: 1

      # ---------------------------------------------------------
      # 4. Checkout SM6225 common device tree
      # ---------------------------------------------------------
      - name: Checkout SM6225 common tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_sm6225-common
          ref: lineage-23.2
          path: device/motorola/sm6225-common
          fetch-depth: 1

      # ---------------------------------------------------------
      # 5. Verify the source trees
      # ---------------------------------------------------------
      - name: Verify source
        run: |
          echo "Kernel:"
          git -C kernel rev-parse --short HEAD

          echo "Device:"
          git -C device/motorola/cebu rev-parse --short HEAD

          echo "Common:"
          git -C device/motorola/sm6225-common rev-parse --short HEAD

          echo
          echo "Kernel Makefile:"
          test -f kernel/Makefile

          echo
          echo "Bengal defconfig:"
          test -f kernel/arch/arm64/configs/vendor/bengal-perf_defconfig

          echo
          echo "Kernel configuration:"
          grep -n "TARGET_KERNEL_CONFIG" \
            device/motorola/cebu/BoardConfig.mk || true

          grep -n "TARGET_KERNEL_CONFIG" \
            device/motorola/sm6225-common/BoardConfigCommon.mk || true

      # ---------------------------------------------------------
      # 6. Create NetHunter configuration fragment
      # ---------------------------------------------------------
      - name: Create NetHunter config
        run: |
          cat > kernel/nethunter.config <<'EOF'

          #
          # Bluetooth HID / VHCI
          #
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HCIVHCI=y

          #
          # Bluetooth HCI UART
          #
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y

          #
          # USB Gadget
          #
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y

          #
          # USB networking
          #
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_F_FS=y

          #
          # Input / userspace HID
          #
          CONFIG_INPUT_EVDEV=y
          CONFIG_INPUT_UINPUT=y
          CONFIG_UHID=y
          CONFIG_HIDRAW=y

          #
          # Networking
          #
          CONFIG_PACKET=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_TUN=y
          CONFIG_VETH=y

          #
          # Wireless framework
          #
          CONFIG_CFG80211=y
          CONFIG_RFKILL=y

          EOF

          echo "NetHunter fragment:"
          cat kernel/nethunter.config

      # ---------------------------------------------------------
      # 7. Configure kernel
      # ---------------------------------------------------------
      - name: Configure kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          echo
          echo "Applying NetHunter configuration..."

          scripts/kconfig/merge_config.sh \
            -m \
            out/.config \
            nethunter.config

          echo
          echo "Running olddefconfig..."

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      # ---------------------------------------------------------
      # 8. Verify important options
      # ---------------------------------------------------------
      - name: Verify kernel configuration
        working-directory: kernel
        run: |
          echo "===== Bluetooth ====="
          grep -E \
            'CONFIG_BT=|CONFIG_BT_BREDR=|CONFIG_BT_RFCOMM=|CONFIG_BT_HIDP=|CONFIG_BT_HCIVHCI=' \
            out/.config || true

          echo
          echo "===== USB HID ====="
          grep -E \
            'CONFIG_USB_GADGET=|CONFIG_USB_CONFIGFS=|CONFIG_USB_CONFIGFS_F_HID=' \
            out/.config || true

          echo
          echo "===== Networking ====="
          grep -E \
            'CONFIG_PACKET=|CONFIG_NETFILTER=|CONFIG_TUN=|CONFIG_VETH=' \
            out/.config || true

          echo
          echo "===== Wireless ====="
          grep -E \
            'CONFIG_CFG80211=|CONFIG_RFKILL=' \
            out/.config || true

          echo
          echo "===== Qualcomm WLAN ====="
          grep -E \
            'CONFIG_CLD_LL_CORE=|CONFIG_CNSS_GENL=|CONFIG_ICNSS=' \
            out/.config || true

      # ---------------------------------------------------------
      # 9. Build kernel
      # ---------------------------------------------------------
      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image \
            dtbs \
            modules

      # ---------------------------------------------------------
      # 10. Collect output
      # ---------------------------------------------------------
      - name: Collect kernel artifacts
        run: |
          mkdir -p artifacts

          cp kernel/out/arch/arm64/boot/Image \
            artifacts/Image

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz \
              artifacts/Image.gz
          fi

          find kernel/out/arch/arm64/boot/dts \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp {} artifacts/ \; || true

          cp kernel/out/.config \
            artifacts/kernel.config

          cp kernel/nethunter.config \
            artifacts/nethunter.config

          echo
          echo "===== ARTIFACTS ====="
          ls -lh artifacts

      # ---------------------------------------------------------
      # 11. Upload build
      # ---------------------------------------------------------
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          path: artifacts/
          if-no-files-found: error
