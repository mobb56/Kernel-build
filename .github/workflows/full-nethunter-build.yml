name: Moto G9 Power cebu NetHunter

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  KERNEL_BRANCH: lineage-23.2

  NETHUNTER_REPO: https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git
  NETHUNTER_BRANCH: nethunter-lineage-23.2

  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_BRANCH: master

  LLVM_DIR: /usr/lib/llvm-14
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out

jobs:
  build:
    name: Moto G9 Power cebu NetHunter
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      #
      # IMPORTANT:
      # llvm-14 installs unversioned tools under /usr/lib/llvm-14/bin.
      # Put that directory into GITHUB_PATH so EVERY later GitHub
      # Actions step sees llvm-ar, llvm-nm, llvm-objcopy, etc.
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang-14 \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            zip

          # Make LLVM 14 tools globally available to ALL later steps.
          echo "/usr/lib/llvm-14/bin" >> "${GITHUB_PATH}"

          # Also expose standard LLVM/Clang versioned binaries.
          echo "/usr/lib/llvm-14/lib" >> "${GITHUB_PATH}"

          export PATH="/usr/lib/llvm-14/bin:${PATH}"

          echo
          echo "LLVM tools:"
          echo

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-strip
          command -v llvm-readelf

          echo
          clang --version
          echo
          ld.lld --version
          echo
          llvm-ar --version
          echo
          llvm-nm --version
          echo
          llvm-objcopy --version
          echo

          echo "AArch64 compiler:"
          command -v aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version

      # ============================================================
      # VERIFY BUILD TOOLCHAIN
      # ============================================================

      - name: Verify build toolchain
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="${LLVM_DIR}/bin:${PATH}"

          tools=(
            clang
            ld.lld
            llvm-ar
            llvm-nm
            llvm-objcopy
            llvm-strip
            llvm-readelf
            aarch64-linux-gnu-gcc
            make
            bc
            flex
            bison
            python3
            git
            zip
            unzip
          )

          for tool in "${tools[@]}"; do
            command -v "${tool}" >/dev/null || {
              echo "ERROR: missing tool: ${tool}"
              exit 1
            }

            echo "OK: ${tool} -> $(command -v "${tool}")"
          done

          echo
          echo "Toolchain verification passed."

      # ============================================================
      # CLONE MOTOROLA KERNEL
      # ============================================================

      - name: Clone Motorola kernel
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          git -C kernel rev-parse HEAD
          git -C kernel status --short

      # ============================================================
      # CLONE NETHUNTER QCACLD3 REFERENCE
      # ============================================================

      - name: Clone NetHunter QCACLD3 reference
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${NETHUNTER_BRANCH}" \
            "${NETHUNTER_REPO}" \
            nethunter-reference

          R="nethunter-reference/drivers/staging/qcacld-3.0"

          files=(
            "${R}/core/hdd/src/wlan_hdd_frame_inject.c"
            "${R}/core/hdd/src/wlan_hdd_frame_validate.c"
            "${R}/core/hdd/src/wlan_hdd_inject_security.c"
            "${R}/core/hdd/src/wlan_hdd_frame_inject_debug.c"
            "${R}/core/wma/src/wma_frame_inject.c"

            "${R}/core/hdd/inc/wlan_hdd_frame_inject.h"
            "${R}/core/hdd/inc/wlan_hdd_frame_validate.h"
            "${R}/core/hdd/inc/wlan_hdd_inject_security.h"
            "${R}/core/hdd/inc/wlan_hdd_frame_inject_debug.h"
            "${R}/core/wma/inc/wma_frame_inject.h"
          )

          for file in "${files[@]}"; do
            test -f "${file}" || {
              echo "ERROR: missing reference file:"
              echo "${file}"
              exit 1
            }
          done

          echo "QCACLD3 reference verified."

      # ============================================================
      # CLONE ANYKERNEL3
      # ============================================================

      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${ANYKERNEL_BRANCH}" \
            "${ANYKERNEL_REPO}" \
            AnyKernel3

          test -f AnyKernel3/anykernel.sh
          test -f AnyKernel3/tools/ak3-core.sh

      # ============================================================
      # VERIFY MOTOROLA SOURCE
      # ============================================================

      - name: Verify source trees
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            kernel/arch/arm64/configs/vendor/bengal-perf_defconfig

          test -f \
            kernel/drivers/staging/qcacld-3.0/Kbuild

          test -f \
            kernel/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h

          test -f \
            kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c

          echo "Motorola SM6225 kernel source verified."

      # ============================================================
      # PREPARE OUTPUT
      # ============================================================

      - name: Prepare output
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          rm -rf "${OUT_DIR}"

          mkdir -p "${OUT_DIR}"

      # ============================================================
      # GENERATE CLEAN BASE CONFIG
      #
      # Capture the clean release BEFORE modifying the source tree.
      # ============================================================

      - name: Generate base configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            vendor/bengal-perf_defconfig

          CLEAN_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          test -n "${CLEAN_RELEASE}"

          case "${CLEAN_RELEASE}" in
            *-dirty)
              echo "ERROR: clean source already reports dirty."
              exit 1
              ;;
          esac

          echo "CLEAN_RELEASE=${CLEAN_RELEASE}" >> "${GITHUB_ENV}"

          echo
          echo "Clean kernel release:"
          echo "${CLEAN_RELEASE}"

      # ============================================================
      # CREATE NETHUNTER CONFIG
      # ============================================================

      - name: Create NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p kernel/nethunter-config

          cat > kernel/nethunter-config/cebu-nethunter.config <<'EOF'
          # ============================================================
          # Moto G9 Power cebu NetHunter
          # ============================================================

          # ------------------------------------------------------------
          # HID
          # ------------------------------------------------------------

          CONFIG_HIDRAW=y
          CONFIG_UHID=y

          # ------------------------------------------------------------
          # Bluetooth
          # ------------------------------------------------------------

          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y

          CONFIG_BT_RFCOMM=m
          CONFIG_BT_RFCOMM_TTY=y

          CONFIG_BT_BNEP=m
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y

          CONFIG_BT_HIDP=m

          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIUART_BCM=y
          CONFIG_BT_HCIUART_RTL=y

          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y

          CONFIG_BT_HCIVHCI=m

          # ------------------------------------------------------------
          # USB gadget
          # ------------------------------------------------------------

          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y

          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_EEM=y

          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y

          # ------------------------------------------------------------
          # USB serial / networking
          # ------------------------------------------------------------

          CONFIG_USB_ACM=m
          CONFIG_USB_SERIAL=m
          CONFIG_USB_SERIAL_GENERIC=y

          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_NET_RNDIS_HOST=m

          CONFIG_USB_RTL8150=m
          CONFIG_USB_RTL8152=m

          # ------------------------------------------------------------
          # Sensors
          # ------------------------------------------------------------

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m

          # ------------------------------------------------------------
          # Qualcomm WLAN
          # ------------------------------------------------------------

          CONFIG_QCA_CLD_WLAN=m

          # ------------------------------------------------------------
          # Networking
          # ------------------------------------------------------------

          CONFIG_PACKET=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y

          EOF

          test -s \
            kernel/nethunter-config/cebu-nethunter.config

          echo "NetHunter configuration created."

      # ============================================================
      # MERGE CONFIGURATION
      #
      # There is intentionally NO olddefconfig after LOCALVERSION
      # is disabled.
      # ============================================================

      - name: Merge NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          scripts/kconfig/merge_config.sh \
            -m \
            -O "${OUT_DIR}" \
            "${OUT_DIR}/.config" \
            nethunter-config/cebu-nethunter.config

          # Final Kconfig resolution.
          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig

          BASE_VERSION="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelversion
          )"

          RELEASE_SUFFIX="${CLEAN_RELEASE#${BASE_VERSION}}"

          echo "Base version:   ${BASE_VERSION}"
          echo "Clean release:  ${CLEAN_RELEASE}"
          echo "Release suffix: ${RELEASE_SUFFIX}"

          # IMPORTANT:
          # These are deliberately done AFTER olddefconfig.
          scripts/config \
            --file "${OUT_DIR}/.config" \
            --disable LOCALVERSION_AUTO

          scripts/config \
            --file "${OUT_DIR}/.config" \
            --set-str LOCALVERSION "${RELEASE_SUFFIX}"

          # Do NOT run olddefconfig again.

          grep -Fxq \
            "CONFIG_LOCALVERSION_AUTO=n" \
            "${OUT_DIR}/.config"

          grep -Fxq \
            "CONFIG_LOCALVERSION=\"${RELEASE_SUFFIX}\"" \
            "${OUT_DIR}/.config"

          CONFIG_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          echo "Configured release: ${CONFIG_RELEASE}"

          test "${CONFIG_RELEASE}" = "${CLEAN_RELEASE}"

      # ============================================================
      # VERIFY CONFIGURATION
      # ============================================================

      - name: Verify important configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          required=(
            "CONFIG_HIDRAW=y"
            "CONFIG_UHID=y"

            "CONFIG_BT=y"
            "CONFIG_BT_BREDR=y"
            "CONFIG_BT_LE=y"
            "CONFIG_BT_RFCOMM=m"
            "CONFIG_BT_BNEP=m"
            "CONFIG_BT_HIDP=m"
            "CONFIG_BT_HCIUART=m"
            "CONFIG_BT_HCIVHCI=m"

            "CONFIG_USB_GADGET=y"
            "CONFIG_USB_CONFIGFS=y"
            "CONFIG_USB_CONFIGFS_NCM=y"
            "CONFIG_USB_CONFIGFS_RNDIS=y"
            "CONFIG_USB_CONFIGFS_ECM=y"
            "CONFIG_USB_CONFIGFS_EEM=y"
            "CONFIG_USB_CONFIGFS_F_HID=y"

            "CONFIG_USB_ACM=m"
            "CONFIG_USB_SERIAL=m"
            "CONFIG_USB_SERIAL_GENERIC=y"
            "CONFIG_USB_USBNET=y"

            "CONFIG_SENSORS_SSC=y"
            "CONFIG_SENSORS_CLASS=m"

            "CONFIG_QCA_CLD_WLAN=m"
          )

          for item in "${required[@]}"; do
            grep -Fxq "${item}" "${CONFIG}" || {
              echo "ERROR: missing configuration:"
              echo "${item}"
              exit 1
            }
          done

          grep -Fxq \
            "CONFIG_LOCALVERSION_AUTO=n" \
            "${CONFIG}"

          # These are NOT kernel .config symbols.
          if grep -Eq \
            '^CONFIG_FEATURE_(MONITOR_MODE_SUPPORT|FRAME_INJECTION_SUPPORT)=' \
            "${CONFIG}"; then

            echo "ERROR: QCACLD3 feature variable incorrectly entered into .config."
            exit 1
          fi

          echo "Configuration verification passed."

      # ============================================================
      # IMPORT QCACLD3 INJECTION SOURCES
      # ============================================================

      - name: Import QCACLD3 injection framework
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0"
          R="nethunter-reference/drivers/staging/qcacld-3.0"

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_inject.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_validate.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_inject_security.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/wma/src/wma_frame_inject.c" \
            "${K}/core/wma/src/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_validate.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_inject_security.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject_debug.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/wma/inc/wma_frame_inject.h" \
            "${K}/core/wma/inc/"

          echo "QCACLD3 injection framework imported."

      # ============================================================
      # ADD INJECTION CONTEXT
      # ============================================================

      - name: Add injection context to Motorola HDD
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/core/hdd/inc/"
              "wlan_hdd_main.h"
          )

          text = path.read_text()

          if "struct hdd_injection_ctx;" not in text:
              marker = "struct hdd_adapter {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: struct hdd_adapter marker not found"
                  )

              text = text.replace(
                  marker,
                  "struct hdd_injection_ctx;\n\n" + marker,
                  1
              )

          if "struct hdd_injection_ctx *injection_ctx;" not in text:
              marker = (
                  "\tqdf_atomic_t net_dev_hold_ref_count"
                  "[NET_DEV_HOLD_ID_MAX];\n"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: injection context anchor not found"
                  )

              replacement = (
                  marker +
                  "\n"
                  "#ifdef FEATURE_FRAME_INJECTION_SUPPORT\n"
                  "\tstruct hdd_injection_ctx *injection_ctx;\n"
                  "#endif\n"
              )

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          path.write_text(text)

          print("Injection context added.")
          PY

      # ============================================================
      # FIX get_task_cred FOR MOTOROLA 4.19
      # ============================================================

      - name: Fix 4.19 credential compatibility
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/core/hdd/src/"
              "wlan_hdd_inject_security.c"
          )

          text = path.read_text()

          pattern = re.compile(
              r"""
              QDF_STATUS
              \s+
              hdd_check_injection_capability
              \s*
              \(
                  \s*struct\s+task_struct\s*\*\s*task\s*
              \)
              \s*
              \{
              .*?
              \n\}
              """,
              re.S | re.X,
          )

          replacement = r'''QDF_STATUS hdd_check_injection_capability(
              struct task_struct *task)
          {
              bool has_capability;

              hdd_security_debug(
                  "Checking injection capabilities");

              if (!task)
                  task = current;

              /*
               * Motorola's 4.19 kernel does not export
               * get_task_cred() to this loadable module.
               *
               * Retain the CAP_NET_RAW authorization check.
               */
              has_capability = capable(CAP_NET_RAW);

              if (!has_capability) {
                  hdd_security_err(
                      "Process lacks CAP_NET_RAW capability");

                  return QDF_STATUS_E_PERM;
              }

              hdd_security_debug(
                  "Process has CAP_NET_RAW capability");

              return QDF_STATUS_SUCCESS;
          }'''

          new_text, count = pattern.subn(
              replacement,
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: hdd_check_injection_capability() "
                  "was not replaced"
              )

          if "get_task_cred(" in new_text:
              raise SystemExit(
                  "ERROR: get_task_cred() remains"
              )

          if "capable(CAP_NET_RAW)" not in new_text:
              raise SystemExit(
                  "ERROR: CAP_NET_RAW check disappeared"
              )

          path.write_text(new_text)

          print("4.19 credential compatibility fixed.")
          PY

      # ============================================================
      # INTEGRATE INJECTION LIFECYCLE
      # ============================================================

      - name: Integrate injection lifecycle
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/core/hdd/src/"
              "wlan_hdd_main.c"
          )

          text = path.read_text()

          # ----------------------------------------------------------
          # Include
          # ----------------------------------------------------------

          if '#include "wlan_hdd_frame_inject.h"' not in text:

              marker = '#include "wlan_hdd_rx_monitor.h"\n'

              if marker not in text:
                  raise SystemExit(
                      "ERROR: RX monitor include marker not found"
                  )

              replacement = (
                  '#include "wlan_hdd_rx_monitor.h"\n'
                  '#ifdef FEATURE_FRAME_INJECTION_SUPPORT\n'
                  '#include "wlan_hdd_frame_inject.h"\n'
                  '#endif\n'
              )

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          # ----------------------------------------------------------
          # Initialization
          # ----------------------------------------------------------

          if "hdd_init_frame_injection(adapter)" not in text:

              marker = (
                  "\thdd_periodic_sta_stats_init(adapter);\n"
                  "\n"
                  "\treturn adapter;"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: adapter initialization marker not found"
                  )

              replacement = """\thdd_periodic_sta_stats_init(adapter);

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              if (QDF_STATUS_SUCCESS !=
                  hdd_init_frame_injection(adapter)) {
                  hdd_err(
                      "Failed to initialize frame injection for adapter");
              }
          #endif

              return adapter;"""

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          # ----------------------------------------------------------
          # Cleanup
          # ----------------------------------------------------------

          if "hdd_deinit_frame_injection(adapter)" not in text:

              marker = (
                  "\thdd_adapter_feature_update_work_deinit(adapter);\n"
                  "\thdd_cleanup_adapter(hdd_ctx, adapter, rtnl_held);"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: adapter cleanup marker not found"
                  )

              replacement = """\thdd_adapter_feature_update_work_deinit(adapter);

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              hdd_deinit_frame_injection(adapter);
          #endif

              hdd_cleanup_adapter(hdd_ctx, adapter, rtnl_held);"""

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          path.write_text(text)

          print("Injection lifecycle integrated.")
          PY

      # ============================================================
      # PATCH QCACLD3 KBUILD
      #
      # Feature variables are Kbuild variables, not .config entries.
      # ============================================================

      - name: Patch QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/Kbuild"
          )

          text = path.read_text()

          # ----------------------------------------------------------
          # HDD objects
          # ----------------------------------------------------------

          if "wlan_hdd_frame_inject.o" not in text:

              anchor = "\t\t$(HDD_SRC_DIR)/wlan_hdd_wowl.o"

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: HDD Kbuild anchor not found"
                  )

              replacement = """\t\t$(HDD_SRC_DIR)/wlan_hdd_wowl.o

          # NetHunter QCACLD3 frame injection
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o"""

              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          # ----------------------------------------------------------
          # WMA object
          # ----------------------------------------------------------

          if "wma_frame_inject.o" not in text:

              anchor = "\t\t$(WMA_NDP_OBJS)"

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: WMA Kbuild anchor not found"
                  )

              replacement = """\t\t$(WMA_NDP_OBJS)

          # NetHunter QCACLD3 frame injection
          WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o"""

              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          # ----------------------------------------------------------
          # Feature defines
          # ----------------------------------------------------------

          if "cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT" not in text:

              marker = "ccflags-y += $(INCS)"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: ccflags-y marker not found"
                  )

              feature = """# NetHunter QCACLD3 frame injection
          CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y
          CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y

          cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT
          cppflags-y += -DFEATURE_MONITOR_MODE_SUPPORT

          """

              text = text.replace(
                  marker,
                  feature + marker,
                  1
              )

          path.write_text(text)

          print("QCACLD3 Kbuild patched.")
          PY

      # ============================================================
      # VERIFY KBUILD
      # ============================================================

      - name: Verify QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0/Kbuild"

          checks=(
            'CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y'
            'CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y'
            'cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT'
            'cppflags-y += -DFEATURE_MONITOR_MODE_SUPPORT'
            'wlan_hdd_frame_inject.o'
            'wlan_hdd_frame_validate.o'
            'wlan_hdd_inject_security.o'
            'wlan_hdd_frame_inject_debug.o'
            'wma_frame_inject.o'
          )

          for item in "${checks[@]}"; do
            grep -Fq "${item}" "${K}" || {
              echo "ERROR: missing Kbuild entry:"
              echo "${item}"
              exit 1
            }
          done

          echo "QCACLD3 Kbuild verification passed."

      # ============================================================
      # VERIFY SOURCE ADAPTATION
      # ============================================================

      - name: Verify source adaptation
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0"

          sources=(
            "${K}/core/hdd/src/wlan_hdd_frame_inject.c"
            "${K}/core/hdd/src/wlan_hdd_frame_validate.c"
            "${K}/core/hdd/src/wlan_hdd_inject_security.c"
            "${K}/core/hdd/src/wlan_hdd_frame_inject_debug.c"
            "${K}/core/wma/src/wma_frame_inject.c"

            "${K}/core/hdd/inc/wlan_hdd_frame_inject.h"
            "${K}/core/hdd/inc/wlan_hdd_frame_validate.h"
            "${K}/core/hdd/inc/wlan_hdd_inject_security.h"
            "${K}/core/hdd/inc/wlan_hdd_frame_inject_debug.h"
            "${K}/core/wma/inc/wma_frame_inject.h"
          )

          for file in "${sources[@]}"; do
            test -f "${file}" || {
              echo "ERROR: missing:"
              echo "${file}"
              exit 1
            }
          done

          grep -Fq \
            'struct hdd_injection_ctx *injection_ctx;' \
            "${K}/core/hdd/inc/wlan_hdd_main.h"

          grep -Fq \
            'hdd_init_frame_injection(adapter)' \
            "${K}/core/hdd/src/wlan_hdd_main.c"

          grep -Fq \
            'hdd_deinit_frame_injection(adapter)' \
            "${K}/core/hdd/src/wlan_hdd_main.c"

          grep -Fq \
            'capable(CAP_NET_RAW)' \
            "${K}/core/hdd/src/wlan_hdd_inject_security.c"

          if grep -Fq \
            'get_task_cred(' \
            "${K}/core/hdd/src/wlan_hdd_inject_security.c"; then

            echo "ERROR: get_task_cred remains"
            exit 1
          fi

          echo "Source adaptation passed."

      # ============================================================
      # BUILD KERNEL + MODULES
      # ============================================================

      - name: Build kernel and modules
        shell: bash
        run: |
          set -o pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          BUILD_LOG="${GITHUB_WORKSPACE}/kernel-build.log"

          make -j2 \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            Image \
            modules \
            2>&1 | tee "${BUILD_LOG}"

          status="${PIPESTATUS[0]}"

          if [ "${status}" -ne 0 ]; then
            echo "Kernel compilation failed."
            exit "${status}"
          fi

      # ============================================================
      # VERIFY RELEASE
      # ============================================================

      - name: Verify kernel release
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          BUILT_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          echo "Expected: ${CLEAN_RELEASE}"
          echo "Built:    ${BUILT_RELEASE}"

          test "${BUILT_RELEASE}" = "${CLEAN_RELEASE}"

          case "${BUILT_RELEASE}" in
            *-dirty)
              echo "ERROR: dirty kernel release"
              exit 1
              ;;
          esac

          echo "Kernel release verified."

      # ============================================================
      # VERIFY IMAGE
      # ============================================================

      - name: Verify Image
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="kernel/out/arch/arm64/boot/Image"

          test -f "${IMAGE}"

          SIZE="$(stat -c%s "${IMAGE}")"

          echo "Image size: ${SIZE}"

          test "${SIZE}" -gt 10000000

          file "${IMAGE}"

      # ============================================================
      # INSTALL MODULES
      # ============================================================

      - name: Install modules
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          rm -rf \
            "${GITHUB_WORKSPACE}/module-install"

          mkdir -p \
            "${GITHUB_WORKSPACE}/module-install"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            INSTALL_MOD_PATH="${GITHUB_WORKSPACE}/module-install" \
            modules_install

          find \
            "${GITHUB_WORKSPACE}/module-install" \
            -type f \
            -name '*.ko' \
            -print

      # ============================================================
      # VERIFY WLAN
      # ============================================================

      - name: Verify wlan.ko
        shell: bash
        run: |
          set -euxo pipefail

          WLAN_MODULE="$(
            find module-install \
              -type f \
              -name 'wlan.ko' \
              -print -quit
          )"

          test -n "${WLAN_MODULE}"

          echo "WLAN module:"
          echo "${WLAN_MODULE}"

          VERMAGIC="$(
            modinfo -F vermagic \
              "${WLAN_MODULE}"
          )"

          echo "WLAN vermagic:"
          echo "${VERMAGIC}"

          echo "${VERMAGIC}" | \
            grep -Fq "${CLEAN_RELEASE}"

      # ============================================================
      # VERIFY NETHUNTER MODULES
      # ============================================================

      - name: Verify NetHunter modules
        shell: bash
        run: |
          set -euxo pipefail

          required_modules=(
            hci_vhci.ko
            hci_uart.ko
            hidp.ko
            rfcomm.ko
            bnep.ko
          )

          for module in "${required_modules[@]}"; do

            found="$(
              find module-install \
                -type f \
                -name "${module}" \
                -print -quit
            )"

            test -n "${found}" || {
              echo "ERROR: missing ${module}"
              exit 1
            }

            echo "Found ${module}: ${found}"
          done

      # ============================================================
      # MODPOST CHECK
      # ============================================================

      - name: Check WLAN undefined symbols
        shell: bash
        run: |
          set -euxo pipefail

          if grep -E \
            'ERROR: "[^"]+" \[[^]]*wlan\.ko\] undefined!' \
            kernel-build.log; then

            echo "ERROR: wlan.ko has undefined symbols."
            exit 1
          fi

          if grep -E \
            'undefined!$' \
            kernel-build.log; then

            echo "ERROR: undefined symbol detected."
            exit 1
          fi

          grep -Fq \
            "LD [M] drivers/staging/qcacld-3.0/wlan.ko" \
            kernel-build.log || {

            echo "ERROR: wlan.ko was not linked."
            exit 1
          }

          echo "MODPOST verification passed."

      # ============================================================
      # STAGE MODULES
      # ============================================================

      - name: Prepare NetHunter modules
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf module-stage

          mkdir -p \
            module-stage/vendor/lib/modules

          WLAN_MODULE="$(
            find module-install \
              -type f \
              -name 'wlan.ko' \
              -print -quit
          )"

          test -n "${WLAN_MODULE}"

          # Stock cebu WLAN module name.
          cp \
            "${WLAN_MODULE}" \
            module-stage/vendor/lib/modules/qca_cld3_wlan.ko

          # Bluetooth/HID.
          for name in \
            bluetooth.ko \
            hci_uart.ko \
            hci_vhci.ko \
            hidp.ko \
            rfcomm.ko \
            bnep.ko \
            hid.ko \
            hid_generic.ko
          do

            found="$(
              find module-install \
                -type f \
                -name "${name}" \
                -print -quit
            )"

            if [ -n "${found}" ]; then
              cp \
                "${found}" \
                module-stage/vendor/lib/modules/
            fi
          done

          # USB/network.
          for name in \
            cdc_acm.ko \
            usbserial.ko \
            usbserial_generic.ko \
            cdc_ether.ko \
            cdc_ncm.ko \
            rndis_host.ko \
            r8150.ko \
            r8152.ko
          do

            found="$(
              find module-install \
                -type f \
                -name "${name}" \
                -print -quit
            )"

            if [ -n "${found}" ]; then
              cp \
                "${found}" \
                module-stage/vendor/lib/modules/
            fi
          done

          # Sensor class.
          found="$(
            find module-install \
              -type f \
              -name 'sensors_class.ko' \
              -print -quit
          )"

          if [ -n "${found}" ]; then
            cp \
              "${found}" \
              module-stage/vendor/lib/modules/
          fi

          test -f \
            module-stage/vendor/lib/modules/qca_cld3_wlan.ko

          test -f \
            module-stage/vendor/lib/modules/hci_vhci.ko

          test -f \
            module-stage/vendor/lib/modules/hidp.ko

          echo "Staged modules:"
          find \
            module-stage/vendor/lib/modules \
            -type f \
            -name '*.ko' \
            -printf '%f\n' | sort

      # ============================================================
      # SAVE BUILD INFORMATION
      # ============================================================

      - name: Save build information
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            kernel/out/.config \
            final-kernel.config

          cp \
            kernel/nethunter-config/cebu-nethunter.config \
            nethunter-config-used.config

          cat > build-manifest.txt <<EOF
          Device: Motorola Moto G9 Power
          Codename: cebu
          ROM: LineageOS 23.2
          Kernel branch: ${KERNEL_BRANCH}
          Kernel release: ${CLEAN_RELEASE}
          Architecture: ${ARCH}
          LLVM: 14
          QCACLD3 injection framework: imported
          QCACLD3 injection Kbuild: enabled
          HID: enabled
          Bluetooth HID/VHCI: enabled
          USB gadget/networking: enabled
          Sensor compatibility: enabled
          EOF

          cat build-manifest.txt

      # ============================================================
      # PREPARE ANYKERNEL3
      # ============================================================

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            kernel/out/arch/arm64/boot/Image \
            AnyKernel3/Image

          rm -rf AnyKernel3/modules

          mkdir -p AnyKernel3/modules

          cp -a \
            module-stage/vendor \
            AnyKernel3/modules/

          test -f \
            AnyKernel3/Image

          test -f \
            AnyKernel3/modules/vendor/lib/modules/qca_cld3_wlan.ko

      # ============================================================
      # ANYKERNEL
      # ============================================================

      - name: Configure AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cat > AnyKernel3/anykernel.sh <<'EOF'
          #!/sbin/sh

          properties() { '
          kernel.string=Moto G9 Power cebu NetHunter
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=cebu
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          attributes() {
          set_perm_recursive 0 0 755 644 $ramdisk/*;
          }

          block=/dev/block/bootdevice/by-name/boot;

          is_slot_device=1;

          ramdisk_compression=auto;

          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh && attributes;

          dump_boot;

          write_boot;
          EOF

          chmod 0755 \
            AnyKernel3/anykernel.sh

          grep -Fq \
            "device.name1=cebu" \
            AnyKernel3/anykernel.sh

          grep -Fq \
            "is_slot_device=1" \
            AnyKernel3/anykernel.sh

      # ============================================================
      # BUILD ZIP
      # ============================================================

      - name: Build AnyKernel3 ZIP
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          cd AnyKernel3

          rm -f \
            ../artifacts/moto-g9-power-cebu-nethunter-flashable.zip

          zip -r9 \
            ../artifacts/moto-g9-power-cebu-nethunter-flashable.zip \
            . \
            -x ".git/*" \
            -x "README.md" \
            -x "*placeholder"

          cd ..

          test -s \
            artifacts/moto-g9-power-cebu-nethunter-flashable.zip

          unzip -t \
            artifacts/moto-g9-power-cebu-nethunter-flashable.zip

      # ============================================================
      # FINAL PACKAGE VERIFICATION
      # ============================================================

      - name: Verify final package
        shell: bash
        run: |
          set -euxo pipefail

          ZIP="artifacts/moto-g9-power-cebu-nethunter-flashable.zip"

          unzip -l "${ZIP}"

          unzip -l "${ZIP}" | \
            grep -Fq "Image"

          unzip -l "${ZIP}" | \
            grep -Fq \
            "modules/vendor/lib/modules/qca_cld3_wlan.ko"

          unzip -l "${ZIP}" | \
            grep -Fq \
            "modules/vendor/lib/modules/hci_vhci.ko"

          unzip -l "${ZIP}" | \
            grep -Fq \
            "modules/vendor/lib/modules/hidp.ko"

          echo "Final package verification passed."

      # ============================================================
      # CHECKSUMS
      # ============================================================

      - name: Generate checksums
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum \
            artifacts/moto-g9-power-cebu-nethunter-flashable.zip \
            kernel/out/arch/arm64/boot/Image \
            final-kernel.config \
            nethunter-config-used.config \
            > artifacts/SHA256SUMS.txt

          cat artifacts/SHA256SUMS.txt

      # ============================================================
      # DEBUG ARTIFACTS
      # ============================================================

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            kernel/out/arch/arm64/boot/Image \
            artifacts/Image

          cp \
            final-kernel.config \
            artifacts/final-kernel.config

          cp \
            nethunter-config-used.config \
            artifacts/nethunter-config-used.config

          cp \
            kernel-build.log \
            artifacts/kernel-build.log

          cp \
            build-manifest.txt \
            artifacts/build-manifest.txt

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Complete build
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "=================================================="
          echo "Moto G9 Power cebu NetHunter build complete"
          echo "=================================================="
          echo
          echo "Kernel release:"
          echo "${CLEAN_RELEASE}"
          echo
          echo "Flashable package:"
          echo "moto-g9-power-cebu-nethunter-flashable.zip"
          echo
          echo "=================================================="
