        run: |
          set -euxo pipefail

          WLAN_MODULE="$(
            find \
              "${GITHUB_WORKSPACE}/module-install" \
              -type f \
              -name "wlan.ko" \
              -print \
              -quit
          )"

          test -n "${WLAN_MODULE}"
          test -s "${WLAN_MODULE}"

          echo "Checking WLAN injection symbols..."

          REQUIRED_SYMBOLS=(
            hdd_init_frame_injection
            hdd_deinit_frame_injection
            hdd_frame_inject_ioctl
            hdd_frame_inject_netlink
            hdd_process_frame_injection
            hdd_check_injection_capability
            hdd_validate_injection_permissions
            hdd_injection_init_debug_interfaces
            hdd_injection_sysfs_global_enable_show
            wma_process_injection_queue_work
            wma_injection_ensure_tx_vdev
          )

          SYMBOLS="$(
            nm -n "${WLAN_MODULE}" 2>/dev/null || true
          )"

          for symbol in "${REQUIRED_SYMBOLS[@]}"; do

            echo "Checking symbol: ${symbol}"

            if ! printf '%s\n' "${SYMBOLS}" |
              grep -Eq \
                "[[:space:]]${symbol}$"; then

              echo "ERROR: required injection symbol missing:"
              echo "${symbol}"
              exit 1
            fi

          done

          echo "WLAN injection symbol verification passed."


      - name: Verify module undefined symbols
        shell: bash
        run: |
          set -euxo pipefail

          MODULE_DIR="${GITHUB_WORKSPACE}/module-install"

          echo "Checking module metadata..."

          while IFS= read -r module; do

            echo "Checking:"
            echo "${module}"

            modinfo \
              "${module}" \
              >/dev/null

          done < <(
            find \
              "${MODULE_DIR}" \
              -type f \
              -name "*.ko"
          )

          echo "Module metadata verification passed."


                - name: Prepare final NetHunter modules
        shell: bash
        run: |
          set -euxo pipefail

          MODULE_INSTALL_DIR="${GITHUB_WORKSPACE}/module-install"
          STAGE_DIR="${GITHUB_WORKSPACE}/kernel/module-stage"
          STAGE_MODULE_DIR="${STAGE_DIR}/vendor/lib/modules"

          test -d "${MODULE_INSTALL_DIR}"

          rm -rf "${STAGE_DIR}"

          mkdir -p "${STAGE_MODULE_DIR}"

          echo "Copying built kernel modules..."

          find \
            "${MODULE_INSTALL_DIR}" \
            -type f \
            -name "*.ko" \
            -exec cp {} "${STAGE_MODULE_DIR}/" \;

          echo "Checking WLAN module..."

          test -f \
            "${STAGE_MODULE_DIR}/wlan.ko"

          mv \
            "${STAGE_MODULE_DIR}/wlan.ko" \
            "${STAGE_MODULE_DIR}/qca_cld3_wlan.ko"

          echo "WLAN module staged as qca_cld3_wlan.ko."

          # RFCOMM is built into the kernel.
          # It must not be packaged as rfcomm.ko.

          rm -f \
            "${STAGE_MODULE_DIR}/rfcomm.ko"

          echo "Checking required NetHunter modules..."

          test -s \
            "${STAGE_MODULE_DIR}/qca_cld3_wlan.ko"

          test -s \
            "${STAGE_MODULE_DIR}/hci_vhci.ko"

          test -s \
            "${STAGE_MODULE_DIR}/hci_uart.ko"

          test -s \
            "${STAGE_MODULE_DIR}/hidp.ko"

          test -s \
            "${STAGE_MODULE_DIR}/bnep.ko"

          echo "Final staged modules:"

          find \
            "${STAGE_MODULE_DIR}" \
            -type f \
            -name "*.ko" \
            -printf "%f\n" \
            | sort

          echo "NetHunter module staging passed."


      - name: Save final kernel configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          test -s \
            "${OUT_DIR}/.config"

          cp \
            "${OUT_DIR}/.config" \
            "${GITHUB_WORKSPACE}/final-kernel.config"

          cp \
            nethunter-config/cebu-nethunter.config \
            "${GITHUB_WORKSPACE}/nethunter-config-used.config"

          test -s \
            "${GITHUB_WORKSPACE}/final-kernel.config"

          test -s \
            "${GITHUB_WORKSPACE}/nethunter-config-used.config"

          echo "Final configuration files saved."


      - name: Prepare safe kernel artifacts
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          IMAGE="${GITHUB_WORKSPACE}/kernel/${OUT_DIR}/arch/arm64/boot/Image"

          test -s "${IMAGE}"

          cp \
            "${IMAGE}" \
            artifacts/Image

          test -s \
            artifacts/Image

          tar \
            -C "${GITHUB_WORKSPACE}/kernel/module-stage" \
            -czf \
            artifacts/cebu-nethunter-modules.tar.gz \
            vendor

          test -s \
            artifacts/cebu-nethunter-modules.tar.gz

          cp \
            "${GITHUB_WORKSPACE}/final-kernel.config" \
            artifacts/final-kernel.config

          cp \
            "${GITHUB_WORKSPACE}/nethunter-config-used.config" \
            artifacts/nethunter-config-used.config

          echo "Safe kernel artifacts prepared."


      - name: Verify final artifact contents
        shell: bash
        run: |
          set -euxo pipefail

          test -s artifacts/Image

          test -s \
            artifacts/cebu-nethunter-modules.tar.gz

          test -s \
            artifacts/final-kernel.config

          test -s \
            artifacts/nethunter-config-used.config

          echo "Checking module archive..."

          tar -tzf \
            artifacts/cebu-nethunter-modules.tar.gz \
            | grep -Fq \
            "vendor/lib/modules/qca_cld3_wlan.ko"

          tar -tzf \
            artifacts/cebu-nethunter-modules.tar.gz \
            | grep -Fq \
            "vendor/lib/modules/hci_vhci.ko"

          tar -tzf \
            artifacts/cebu-nethunter-modules.tar.gz \
            | grep -Fq \
            "vendor/lib/modules/hci_uart.ko"

          tar -tzf \
            artifacts/cebu-nethunter-modules.tar.gz \
            | grep -Fq \
            "vendor/lib/modules/hidp.ko"

          tar -tzf \
            artifacts/cebu-nethunter-modules.tar.gz \
            | grep -Fq \
            "vendor/lib/modules/bnep.ko"

          if tar -tzf \
            artifacts/cebu-nethunter-modules.tar.gz \
            | grep -Eq \
            '(^|/)rfcomm\.ko$'; then

            echo "ERROR: rfcomm.ko was packaged even though RFCOMM is built-in."
            exit 1
          fi

          echo "Final artifact contents verified."


      - name: Verify final Image hash
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="artifacts/Image"

          test -s "${IMAGE}"

          echo "Final Image SHA256:"
          sha256sum "${IMAGE}"

          echo "Final Image size:"
          stat -c '%s bytes' "${IMAGE}"


      - name: Create build manifest
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE_SIZE="$(
            stat \
              -c '%s' \
              artifacts/Image
          )"

          MODULE_ARCHIVE_SIZE="$(
            stat \
              -c '%s' \
              artifacts/cebu-nethunter-modules.tar.gz
          )"

          IMAGE_SHA256="$(
            sha256sum \
              artifacts/Image \
              | awk '{print $1}'
          )"

          MODULE_SHA256="$(
            sha256sum \
              artifacts/cebu-nethunter-modules.tar.gz \
              | awk '{print $1}'
          )"

          cat > artifacts/build-manifest.txt <<EOF
          Device: Motorola Moto G9 Power
          Codename: cebu
          ROM baseline: LineageOS 23.2 / Android 16

          Kernel repository:
          ${KERNEL_REPO}

          Kernel branch:
          ${KERNEL_BRANCH}

          NetHunter reference:
          ${NETHUNTER_REPO}

          NetHunter branch:
          ${NETHUNTER_BRANCH}

          Architecture:
          ${ARCH}

          LLVM:
          14

          Kernel release:
          ${CLEAN_RELEASE}

          Kernel Image size:
          ${IMAGE_SIZE}

          Kernel Image SHA256:
          ${IMAGE_SHA256}

          Module archive size:
          ${MODULE_ARCHIVE_SIZE}

          Module archive SHA256:
          ${MODULE_SHA256}

          HID/HIDRAW/UHID:
          enabled

          Bluetooth:
          RFCOMM built-in
          BNEP enabled
          HIDP enabled
          HCI UART enabled
          VHCI enabled

          USB gadget/configfs:
          enabled

          USB HID:
          enabled

          USB networking:
          enabled

          Qualcomm WLAN:
          enabled

          QCACLD3 monitor-mode Kbuild support:
          enabled

          QCACLD3 frame-injection Kbuild support:
          enabled

          CAP_NET_RAW injection authorization:
          enabled

          Stock cebu touchscreen drivers:
          preserved and verified

          Stock cebu fingerprint drivers:
          preserved and verified

          Stock QCOM cellular/RMNET/IPA configuration:
          preserved and verified

          Debug information:
          disabled

          AnyKernel3 flashable ZIP:
          intentionally not produced

          Kernel flashing:
          not performed by this workflow
          EOF

          cat artifacts/build-manifest.txt


      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum \
            artifacts/Image \
            artifacts/cebu-nethunter-modules.tar.gz \
            artifacts/final-kernel.config \
            artifacts/nethunter-config-used.config \
            artifacts/build-manifest.txt \
            > artifacts/SHA256SUMS.txt

          echo "SHA256 checksums:"
          cat artifacts/SHA256SUMS.txt


      - name: Verify checksums
        shell: bash
        run: |
          set -euxo pipefail

          cd artifacts

          sha256sum \
            -c \
            SHA256SUMS.txt

          echo "Checksum verification passed."


      - name: Upload NetHunter build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-verified
          path: |
            artifacts/Image
            artifacts/cebu-nethunter-modules.tar.gz
            artifacts/final-kernel.config
            artifacts/nethunter-config-used.config
            artifacts/build-manifest.txt
            artifacts/SHA256SUMS.txt
            kernel-build.log
          if-no-files-found: error
          retention-days: 30


      - name: Build completed
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "MOTO G9 POWER cebu NETHUNTER BUILD COMPLETED"
          echo "============================================================"

          echo
          echo "No kernel partition was flashed."
          echo "No reboot was performed."
          echo
          echo "Download the GitHub Actions artifact:"
          echo
          echo "moto-g9-power-cebu-nethunter-verified"
          echo
          echo "The artifact contains:"
          echo "  Image"
          echo "  cebu-nethunter-modules.tar.gz"
          echo "  final-kernel.config"
          echo "  nethunter-config-used.config"
          echo "  build-manifest.txt"
          echo "  SHA256SUMS.txt"
          echo
          echo "============================================================"


          

          

          
          

          

          
          

          


          
