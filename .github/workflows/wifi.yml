        WMA_INJECT_H="drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h"

        fail=0

        check_file() {
          local file="$1"

          if [ -f "$file" ]; then
            echo "PASS: file exists: $file"
          else
            echo "FAIL: missing file: $file"
            fail=1
          fi
        }
        
            check_grep() {
            local pattern="$1"
            shift
            local found=0
            local file

            for file in "$@"; do
              if grep -Fq -- "$pattern" "$file" 2>/dev/null; then
                echo "PASS: [$pattern] found in $file"
                found=1
                break
              fi
            done

            if [ "$found" -eq 0 ]; then
              echo "FAIL: [$pattern] not found in:"
              for file in "$@"; do
                echo "      $file"
              done
              fail=1
            fi
          }

        echo
