name: Build Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # Dependencies
      # =========================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang-14 \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # =========================================================
      # LLVM
      # =========================================================
      - name: Setup LLVM
        run: |
          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

          echo "===== CLANG ====="
          /usr/lib/llvm-14/bin/clang --version

          echo
          echo "===== LLD ====="
          /usr/lib/llvm-14/bin/ld.lld --version

      # =========================================================
      # Kernel source
      # =========================================================
      - name: Checkout LineageOS kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6225
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      # =========================================================
      # Cebu device tree
      # =========================================================
      - name: Checkout cebu device tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_cebu
          ref: lineage-23.2
          path: device/motorola/cebu
          fetch-depth: 1

      # =========================================================
      # Common device tree
      # =========================================================
      - name: Checkout SM6225 common tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_sm6225-common
          ref: lineage-23.2
          path: device/motorola/sm6225-common
          fetch-depth: 1

      # =========================================================
      # Verify source
      # =========================================================
      - name: Verify source
        run: |
          echo "Kernel:"
          git -C kernel rev-parse --short HEAD

          echo
          echo "Cebu:"
          git -C device/motorola/cebu rev-parse --short HEAD

          echo
          echo "Common:"
          git -C device/motorola/sm6225-common rev-parse --short HEAD

          echo
          echo "Checking Bengal defconfig..."

          test -f \
            kernel/arch/arm64/configs/vendor/bengal-perf_defconfig

          echo "FOUND"

          echo
          echo "Checking Qualcomm trace header..."

          test -f \
            kernel/drivers/clk/qcom/trace.h

          echo "FOUND"

          echo
          echo "Cebu kernel configuration:"
          grep -n \
            "TARGET_KERNEL_CONFIG" \
            device/motorola/cebu/BoardConfig.mk || true

      # =========================================================
      # Clean source
      # =========================================================
      - name: Clean kernel source
        working-directory: kernel
        run: |
          make mrproper
          rm -rf out

          rm -rf include/config
          rm -rf include/generated
          rm -rf arch/arm64/include/generated

          echo "Source tree clean."

      # =========================================================
      # Find cebu config
      # =========================================================
      - name: Locate cebu configuration
        run: |
          echo "Searching for cebu-default.config..."

          CEBU_CONFIG="$(find \
            "$GITHUB_WORKSPACE" \
            -type f \
            -name "cebu-default.config" \
            -print -quit)"

          if [ -n "$CEBU_CONFIG" ]; then
            echo "CEBU_CONFIG=$CEBU_CONFIG" >> "$GITHUB_ENV"
            echo "Found:"
            echo "$CEBU_CONFIG"
          else
            echo "CEBU_CONFIG=" >> "$GITHUB_ENV"
            echo "cebu-default.config was not found."
            echo "Continuing with Bengal base configuration."
          fi

      # =========================================================
      # NetHunter configuration
      # =========================================================
      - name: Create NetHunter config
        working-directory: kernel
        run: |
          cat > nethunter.config <<'EOF'

          # Bluetooth
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y

          # USB Gadget / HID
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y

          # USB networking
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_F_FS=y

          # HID / input
          CONFIG_INPUT_EVDEV=y
          CONFIG_INPUT_UINPUT=y
          CONFIG_UHID=y
          CONFIG_HIDRAW=y

          # Networking
          CONFIG_PACKET=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_TUN=y
          CONFIG_VETH=y

          # Wireless framework
          CONFIG_CFG80211=y
          CONFIG_RFKILL=y

          EOF

          cat nethunter.config

      # =========================================================
      # Base configuration
      # =========================================================
      - name: Configure base kernel
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          test -f out/.config

      # =========================================================
      # Cebu configuration
      # =========================================================
      - name: Apply cebu configuration
        working-directory: kernel
        run: |
          if [ -n "$CEBU_CONFIG" ]; then

            echo "Applying cebu configuration:"
            echo "$CEBU_CONFIG"

            scripts/kconfig/merge_config.sh \
              -m \
              out/.config \
              "$CEBU_CONFIG"

          else

            echo "No cebu-default.config found."
            echo "Using Bengal configuration."

          fi

      # =========================================================
      # NetHunter configuration
      # =========================================================
      - name: Apply NetHunter configuration
        working-directory: kernel
        run: |
          scripts/kconfig/merge_config.sh \
            -m \
            out/.config \
            nethunter.config

      # =========================================================
      # Finalize configuration
      # =========================================================
      - name: Finalize configuration
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          test -f out/.config

          echo "Final configuration generated."

      # =========================================================
      # CRITICAL FIX
      #
      # Kbuild 4.19 refuses O=out builds when configuration
      # generated files remain in the source tree.
      # =========================================================
      - name: Clean generated source files before build
        working-directory: kernel
        run: |
          echo "Removing generated files from source tree..."

          rm -f .config
          rm -rf include/config
          rm -rf include/generated
          rm -rf arch/arm64/include/generated

          echo
          echo "Checking source tree..."

          if [ -f .config ]; then
            echo "ERROR: .config still exists"
            exit 1
          fi

          if [ -d include/config ]; then
            echo "ERROR: include/config still exists"
            exit 1
          fi

          if [ -d arch/arm64/include/generated ]; then
            echo "ERROR: arch/arm64/include/generated still exists"
            exit 1
          fi

          echo
          echo "SOURCE TREE CLEAN."

          echo
          echo "Output configuration:"
          ls -lh out/.config

      # =========================================================
      # Verify NetHunter options
      # =========================================================
      - name: Verify configuration
        working-directory: kernel
        run: |
          echo "===== BLUETOOTH ====="

          grep -E \
            'CONFIG_BT=|CONFIG_BT_BREDR=|CONFIG_BT_RFCOMM=|CONFIG_BT_HIDP=|CONFIG_BT_HCIVHCI=|CONFIG_BT_HCIUART=' \
            out/.config || true

          echo
          echo "===== USB HID ====="

          grep -E \
            'CONFIG_USB_GADGET=|CONFIG_USB_CONFIGFS=|CONFIG_USB_CONFIGFS_F_HID=' \
            out/.config || true

          echo
          echo "===== NETWORKING ====="

          grep -E \
            'CONFIG_PACKET=|CONFIG_NETFILTER=|CONFIG_NF_CONNTRACK=|CONFIG_TUN=|CONFIG_VETH=' \
            out/.config || true

          echo
          echo "===== WIRELESS ====="

          grep -E \
            'CONFIG_CFG80211=|CONFIG_RFKILL=' \
            out/.config || true

      # =========================================================
      # Build ONLY kernel Image
      #
      # NO dtbs target here.
      # =========================================================
      - name: Build kernel Image
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          echo "========================================"
          echo "BUILDING KERNEL IMAGE"
          echo "========================================"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

          echo
          echo "Checking Image..."

          test -f \
            out/arch/arm64/boot/Image

          ls -lh \
            out/arch/arm64/boot/Image

      # =========================================================
      # Build modules separately
      # =========================================================
      - name: Build kernel modules
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules

      # =========================================================
      # Collect artifacts
      # =========================================================
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          mkdir -p artifacts/modules

          cp \
            kernel/out/arch/arm64/boot/Image \
            artifacts/Image

          cp \
            kernel/out/.config \
            artifacts/kernel.config

          cp \
            kernel/nethunter.config \
            artifacts/nethunter.config

          find kernel/out \
            -type f \
            -name "*.ko" \
            -exec cp {} artifacts/modules/ \; || true

          echo
          echo "========================================"
          echo "FINAL ARTIFACTS"
          echo "========================================"

          find artifacts -type f -exec ls -lh {} \;

      # =========================================================
      # Upload
      # =========================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          path: artifacts/
          if-no-files-found: error
