name: Moto G9 Power cebu NetHunter

on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "Run the kernel compilation after all static audits pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  KERNEL_BRANCH: lineage-23.2

  NETHUNTER_REPO: https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git
  NETHUNTER_BRANCH: nethunter-lineage-23.2

  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out

  # Stock kernel metadata shows Clang/LLVM 21.
  LLVM_DIR: /usr/lib/llvm-21

jobs:
  build:
    name: Build cebu NetHunter kernel
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT THIS WORKFLOW REPOSITORY
      # ============================================================

      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL BASE BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libssl-dev \
            curl \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 3. INSTALL LLVM / CLANG 21
      # ============================================================

      - name: Install Android LLVM clang-r563880c
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="r29"
          NDK_ARCHIVE="android-ndk-r29-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/${NDK_ARCHIVE}"
          NDK_SHA1="87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b"

          NDK_ROOT="${GITHUB_WORKSPACE}/android-ndk-r29"
          ANDROID_LLVM_DIR="${GITHUB_WORKSPACE}/android-llvm"
          NDK_ZIP="${RUNNER_TEMP}/${NDK_ARCHIVE}"

          echo "============================================================"
          echo "ANDROID NDK r29 / CLANG-r563880c"
          echo "============================================================"

          rm -rf "${NDK_ROOT}"
          rm -rf "${ANDROID_LLVM_DIR}"
          rm -f "${NDK_ZIP}"

          echo
          echo "=== Downloading official Google Android NDK r29 ==="

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -o "${NDK_ZIP}" \
            "${NDK_URL}"

          test -s "${NDK_ZIP}"

          echo
          echo "=== Verifying NDK SHA-1 ==="

          echo "${NDK_SHA1}  ${NDK_ZIP}" | sha1sum -c -

          echo
          echo "NDK archive verified."

          echo
          echo "=== Extracting Android NDK r29 ==="

          unzip -q "${NDK_ZIP}" -d "${GITHUB_WORKSPACE}"

          test -d "${NDK_ROOT}"

          echo
          echo "=== Selecting LLVM toolchain ==="

          LLVM_SOURCE="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"

          test -d "${LLVM_SOURCE}"

          cp -a "${LLVM_SOURCE}" "${ANDROID_LLVM_DIR}"

          test -x "${ANDROID_LLVM_DIR}/bin/clang"
          test -x "${ANDROID_LLVM_DIR}/bin/ld.lld"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-ar"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-nm"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-objcopy"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-strip"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-readelf"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-objdump"

          echo
          echo "=== Verify clang version ==="

          "${ANDROID_LLVM_DIR}/bin/clang" --version

          "${ANDROID_LLVM_DIR}/bin/clang" --version \
            | grep -q -F "clang version 21.0.0"

             echo
             echo "=== Verify clang source revision ==="

             echo "Checking compiler identity..."

             CLANG_VERSION="$("${ANDROID_LLVM_DIR}/bin/clang" --version)"

              echo "${CLANG_VERSION}"

               echo
               echo "=== Verify clang-r563880c ==="

               echo "${CLANG_VERSION}" | grep -F "clang version 21.0.0"
               echo "${CLANG_VERSION}" | grep -F "based on r563880c"

                echo
                echo "Android clang-r563880c source revision verified."
      # ============================================================
      # 4. PREPARE DETERMINISTIC LLVM TOOLCHAIN
      # ============================================================

         
      - name: Prepare Android LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_LLVM_DIR="${GITHUB_WORKSPACE}/android-llvm"
          LLVM_BIN="${ANDROID_LLVM_DIR}/bin"

          test -x "${ANDROID_LLVM_DIR}/bin/clang"
          test -x "${ANDROID_LLVM_DIR}/bin/ld.lld"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-ar"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-nm"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-objcopy"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-strip"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-readelf"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-objdump"

          echo "=== Android LLVM toolchain selected ==="

          echo "LLVM_DIR=${ANDROID_LLVM_DIR}" >> "${GITHUB_ENV}"
          echo "LLVM_BIN=${LLVM_BIN}" >> "${GITHUB_ENV}"
          echo "PATH=${LLVM_BIN}:${PATH}" >> "${GITHUB_ENV}"

          echo
          echo "=== Verify Android Clang directly ==="

          "${ANDROID_LLVM_DIR}/bin/clang" --version
          "${ANDROID_LLVM_DIR}/bin/ld.lld" --version

          "${ANDROID_LLVM_DIR}/bin/clang" --version \
            | grep -q -F 'clang version 21.0.0'

          echo
          echo "Android LLVM toolchain prepared successfully."
      # ============================================================
      # 5. VERIFY THAT CLANG 21 IS ACTUALLY SELECTED
      # ============================================================

      - name: Verify Android Clang 21.0.0 toolchain
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="${LLVM_BIN}:${PATH}"

          echo "clang:"
          command -v clang
          clang --version

          echo
          echo "ld.lld:"
          command -v ld.lld
          ld.lld --version

          echo
          echo "llvm-ar:"
          command -v llvm-ar
          llvm-ar --version

          echo
          echo "llvm-nm:"
          command -v llvm-nm
          llvm-nm --version

          echo
          echo "llvm-objcopy:"
          command -v llvm-objcopy

          echo
          echo "llvm-strip:"
          command -v llvm-strip

          echo
          echo "llvm-readelf:"
          command -v llvm-readelf

          echo
          echo "Checking compiler generation..."

          "${LLVM_BIN}/clang" --version |
          grep -q -F 'clang version 21.0.0'

          echo
          echo "Android Clang 21.0.0 toolchain verification PASSED."

      # ============================================================
      # 6. VERIFY THE STOCK CONFIGURATION FILE EXISTS
      #
      # This file is the authoritative cebu hardware baseline.
      # ============================================================

      - name: Verify stock cebu configuration
        shell: bash
        run: |
          set -euxo pipefail

          test -f cebu-stock.config
          test -s cebu-stock.config

          echo "Stock configuration:"
          ls -lh cebu-stock.config

          echo
          echo "Configuration line count:"
          wc -l cebu-stock.config

          echo
          echo "First configuration lines:"
          head -n 10 cebu-stock.config

          echo
          echo "Stock cebu configuration is present."


      # ============================================================
      # 7. CLONE CEBU KERNEL SOURCE
      # ============================================================

      - name: Clone cebu kernel source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf kernel

           git clone \
             --branch "${KERNEL_BRANCH}" \
             --single-branch \
              "${KERNEL_REPO}" \
               kernel

               cd kernel

            git checkout 39bcecd5c63df849923b1faadc9cde482648a1a1

          echo
          echo "============================================================"
          echo "CEBU KERNEL SOURCE IDENTITY"
          echo "============================================================"

          CURRENT_COMMIT="$(git rev-parse HEAD)"
          CURRENT_SHORT="$(git rev-parse --short=12 HEAD)"

          echo
          echo "Repository:"
          git remote get-url origin

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Current HEAD:"
          echo "${CURRENT_COMMIT}"

          echo
          echo "Current 12-character commit:"
          echo "${CURRENT_SHORT}"

          test -n "${CURRENT_COMMIT}"
          test -n "${CURRENT_SHORT}"

          echo
          echo "Kernel source successfully cloned."

      # ============================================================
      # 8. VERIFY CORRECT KERNEL BRANCH
      # ============================================================
  
  
      - name: Verify cebu kernel source
        working-directory: kernel
        shell: bash
        run: |
         set -euo pipefail

         echo "============================================================"
         echo "CEBU KERNEL SOURCE VERIFIED"
         echo "============================================================"
         
           EXPECTED_COMMIT="39bcecd5c63df849923b1faadc9cde482648a1a1"
           
          CURRENT_BRANCH="$(git branch --show-current)"
          CURRENT_COMMIT="$(git rev-parse HEAD)"
          CURRENT_SHORT="$(git rev-parse --short=12 HEAD)"

           echo
           echo "Branch:"
           echo "${CURRENT_BRANCH}"

           echo
           echo "Commit:"
           echo "${CURRENT_COMMIT}"

           echo
           echo "12-character commit:"
           echo "${CURRENT_SHORT}"

           echo
           echo "Expected stock source revision:"
           echo "${EXPECTED_COMMIT}"

            test "${CURRENT_COMMIT}" = "${EXPECTED_COMMIT}"

           test -f Makefile
           test -d arch/arm64
           test -d drivers
          test -f arch/arm64/configs/vendor/bengal-perf_defconfig

           echo
           echo "Defconfig:"
           echo "arch/arm64/configs/vendor/bengal-perf_defconfig"

           echo
           echo "Correct cebu kernel source verified."


 
      - name: Locate actual monitor VDEV-UP implementation
        shell: bash
        run: |
          set +e
          SRC="drivers/staging/qcacld-3.0"

          echo "=== monitor VDEV-UP ==="
          grep -Rns --include='*.c' --include='*.h' \
          -E "monitor.*vdev.*up|vdev.*up.*monitor|monitor_mode_vdev_up" \
          "$SRC" 2>/dev/null | head -n 80

          echo
          echo "=== MLME VDEV-UP ==="
          grep -Rns --include='*.c' --include='*.h' \
           -E "sta_mlme_vdev_up_send|vdev_up_send|vdev_start_continue" \
           "$SRC" 2>/dev/null | head -n 80

          echo
          echo "=== VDEV START RESPONSE ==="
            grep -Rns --include='*.c' --include='*.h' \
          -E "VDEV_START_RESP|VDEV_START.*RESP|START_RESP_EVENT" \
          "$SRC" 2>/dev/null | head -n 80

          echo
          echo "=== WMI EVENT REGISTRATION ==="
            grep -Rns --include='*.c' --include='*.h' \
            -E "register_event_handler.*(VDEV|START)|wmi_unified_register_event_handler.*(VDEV|START)" \
           "$SRC" 2>/dev/null | head -n 80

      # ============================================================
      # 9. VERIFY QCACLD3 SOURCE TREE
      #
      # We do not modify it yet.
      # ============================================================

      - name: Verify QCACLD3 source tree
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../artifacts/source-audit

          echo "=== QCACLD3 source tree ==="

          test -d drivers/staging/qcacld-3.0
          test -f drivers/staging/qcacld-3.0/Kbuild

          echo "QCACLD3 root:"
          find drivers/staging/qcacld-3.0 \
            -maxdepth 3 \
            -type f \
            \( -name 'wlan_hdd_main.c' -o -name 'wlan_hdd_main.h' \) \
            -print

          HDD_MAIN_C="$(
            find drivers/staging/qcacld-3.0 \
              -type f \
              -name 'wlan_hdd_main.c' \
              -print -quit
          )"

          HDD_MAIN_H="$(
            find drivers/staging/qcacld-3.0 \
              -type f \
              -name 'wlan_hdd_main.h' \
              -print -quit
          )"

          if [ -z "${HDD_MAIN_C}" ]; then
            echo "ERROR: wlan_hdd_main.c was not found anywhere in QCACLD3."
            exit 1
          fi

          if [ -z "${HDD_MAIN_H}" ]; then
            echo "ERROR: wlan_hdd_main.h was not found anywhere in QCACLD3."
            exit 1
          fi

          echo "wlan_hdd_main.c: ${HDD_MAIN_C}"
          echo "wlan_hdd_main.h: ${HDD_MAIN_H}"

          {
            echo "QCACLD3_ROOT=drivers/staging/qcacld-3.0"
            echo "WLAN_HDD_MAIN_C=${HDD_MAIN_C}"
            echo "WLAN_HDD_MAIN_H=${HDD_MAIN_H}"
          } > ../artifacts/source-audit/qcacld3-paths.txt

          echo "QCACLD3 source tree verified."


       


      # ============================================================
      # 9A. AUDIT MONITOR VDEV / POLICY-MANAGER LIFECYCLE
      # ============================================================

      - name: Audit monitor VDEV policy-manager lifecycle
        working-directory: kernel
        shell: bash
        run: |
          set -u

          echo "============================================================"
          echo "MONITOR VDEV / POLICY-MANAGER SOURCE AUDIT"
          echo "============================================================"

          EXPECTED_COMMIT="39bcecd5c63df849923b1faadc9cde482648a1a1"
          CURRENT_COMMIT="$(git rev-parse HEAD)"

          echo
          echo "Current commit:"
          echo "${CURRENT_COMMIT}"

          if [ "${CURRENT_COMMIT}" != "${EXPECTED_COMMIT}" ]; then
            echo "ERROR: unexpected kernel revision"
            exit 1
          fi

          QCACLD="drivers/staging/qcacld-3.0"
          AUDIT="../artifacts/source-audit"

          mkdir -p "${AUDIT}"

          echo
          echo "=== Locating relevant source files ==="

          HDD_MAIN="$(
            find "${QCACLD}" \
              -type f \
              -name 'wlan_hdd_main.c' \
              -print -quit
          )"

          POLICY_SRC="$(
            grep -RIl \
              --include='*.c' \
              'policy_mgr_update_connection_info' \
              "${QCACLD}" 2>/dev/null \
              | head -n 1 || true
          )"

          SME_SRC="$(
            grep -RIl \
              --include='*.c' \
              'sme_process_monitor_mode_vdev_up_evt' \
              "${QCACLD}" 2>/dev/null \
              | head -n 1 || true
          )"

          echo "HDD_MAIN=${HDD_MAIN}"
          echo "POLICY_SRC=${POLICY_SRC}"
          echo "SME_SRC=${SME_SRC}"

          test -n "${HDD_MAIN}"
          test -n "${POLICY_SRC}"
          test -n "${SME_SRC}"

          echo
          echo "=== MONITOR VDEV FUNCTIONS ==="

          grep -RniE \
            --include='*.c' \
            'hdd_open_adapters_for_monitor_mode|hdd_monitor_mode_vdev_status|sme_process_monitor_mode_vdev_up_evt' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/monitor-functions.txt" || true

          cat "${AUDIT}/monitor-functions.txt" || true

          echo
          echo "=== POLICY-MANAGER FUNCTIONS ==="

          grep -RniE \
            --include='*.c' \
            'policy_mgr_vdev_obj_create_cb|policy_mgr_vdev_obj_status_cb|policy_mgr_update_connection_info|pm_conc_connection_list' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/policy-functions.txt" || true

          cat "${AUDIT}/policy-functions.txt" || true

          echo
          echo "=== VDEV CREATE CALLBACK CONTEXT ==="

          grep -RniE \
            --include='*.c' \
            -B20 \
            -A45 \
            'policy_mgr_vdev_obj_create_cb' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/vdev-create-context.txt" || true

          cat "${AUDIT}/vdev-create-context.txt" || true

          echo
          echo "=== VDEV STATUS CALLBACK CONTEXT ==="

          grep -RniE \
            --include='*.c' \
            -B20 \
            -A45 \
            'policy_mgr_vdev_obj_status_cb' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/vdev-status-context.txt" || true

          cat "${AUDIT}/vdev-status-context.txt" || true

          echo
          echo "=== POLICY UPDATE CONNECTION CONTEXT ==="

          grep -RniE \
            --include='*.c' \
            -B25 \
            -A60 \
            'policy_mgr_update_connection_info' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/policy-update-context.txt" || true

          cat "${AUDIT}/policy-update-context.txt" || true

          echo
          echo "=== MONITOR OPEN-ADAPTER CONTEXT ==="

          grep -RniE \
            --include='*.c' \
            -B30 \
            -A80 \
            'hdd_open_adapters_for_monitor_mode' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/monitor-open-context.txt" || true

          cat "${AUDIT}/monitor-open-context.txt" || true

          echo
          echo "=== MONITOR VDEV STATUS CONTEXT ==="

          grep -RniE \
            --include='*.c' \
            -B30 \
            -A80 \
            'hdd_monitor_mode_vdev_status' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/monitor-status-context.txt" || true

          cat "${AUDIT}/monitor-status-context.txt" || true

          echo
          echo "=== SME MONITOR VDEV-UP CONTEXT ==="

          grep -RniE \
            --include='*.c' \
            -B30 \
            -A80 \
            'sme_process_monitor_mode_vdev_up_evt' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/sme-monitor-up-context.txt" || true

          cat "${AUDIT}/sme-monitor-up-context.txt" || true

          echo
          echo "=== VDEV START COMMAND PATH ==="

          grep -RniE \
            --include='*.c' \
            -B20 \
            -A40 \
            'send_vdev_start_cmd_tlv|vdev_start' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/vdev-start-context.txt" || true

          cat "${AUDIT}/vdev-start-context.txt" || true

          echo
          echo "=== PM CONNECTION LIST DECLARATION ==="

          grep -RniE \
            --include='*.c' \
            --include='*.h' \
            'pm_conc_connection_list' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/pm-connection-list.txt" || true

          cat "${AUDIT}/pm-connection-list.txt" || true

          echo
          echo "=== SOURCE CHECKSUMS ==="

          sha256sum \
            "${HDD_MAIN}" \
            "${POLICY_SRC}" \
            "${SME_SRC}" \
            > "${AUDIT}/monitor-vdev-source.sha256"

          cat "${AUDIT}/monitor-vdev-source.sha256"

          echo
          echo "============================================================"
          echo "MONITOR VDEV SOURCE AUDIT COMPLETE"
          echo "============================================================"

          echo
          echo "No source modification was performed."
          echo "The collected contexts are now available in the Actions log."




          echo
          echo "=== SME MONITOR VDEV-UP EVENT DISPATCH ==="

          grep -RniE \
            --include='*.c' \
            --include='*.h' \
            -B20 \
            -A40 \
            'sme_process_monitor_mode_vdev_up_evt' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/sme-monitor-up-dispatch.txt" || true

          cat "${AUDIT}/sme-monitor-up-dispatch.txt" || true

          echo
          echo "=== ALL SME MONITOR CALLBACK REGISTRATION ==="

          grep -RniE \
            --include='*.c' \
            --include='*.h' \
            -B15 \
            -A25 \
            'sme_set_monitor_mode_cb|monitor_mode_cb' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/sme-monitor-callback-registration.txt" || true

          cat "${AUDIT}/sme-monitor-callback-registration.txt" || true

          echo
          echo "=== HDD MONITOR CALLBACK IMPLEMENTATION ==="

          grep -RniE \
            --include='*.c' \
            --include='*.h' \
            -B25 \
            -A45 \
            'hdd_sme_monitor_mode_callback|qdf_monitor_mode_vdev_up_event|monitor_mode_vdev_up_in_progress' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/hdd-monitor-callback.txt" || true

          cat "${AUDIT}/hdd-monitor-callback.txt" || true

          echo
          echo "=== SME PROCESS-MESSAGE REFERENCES ==="

          grep -RniE \
            --include='*.c' \
            --include='*.h' \
            -B15 \
            -A30 \
            'sme_process_msg|SME_MSG|monitor_mode_vdev_up' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/sme-message-dispatch.txt" || true

          cat "${AUDIT}/sme-message-dispatch.txt" || true

          echo
          echo "=== WMI MONITOR/VDEV-UP EVENT REGISTRATION ==="

          grep -RniE \
            --include='*.c' \
            --include='*.h' \
            -B20 \
            -A35 \
            'wmi_unified_register_event_handler|register_event_handler|MONITOR.*VDEV|VDEV.*UP|VDEV_START' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/wmi-monitor-vdev-event-registration.txt" || true

          cat "${AUDIT}/wmi-monitor-vdev-event-registration.txt" || true

          echo
          echo "=== ALL REFERENCES TO MONITOR VDEV-UP EVENT ==="

          grep -RniE \
            --include='*.c' \
            --include='*.h' \
            'monitor_mode_vdev_up|monitor.*vdev.*up|vdev.*up.*monitor' \
            "${QCACLD}" \
            2>/dev/null \
            > "${AUDIT}/all-monitor-vdev-up-references.txt" || true

          cat "${AUDIT}/all-monitor-vdev-up-references.txt" || true





      # ============================================================
      # 9B. TRACE SME MONITOR VDEV-UP EVENT PRODUCER
      # ============================================================

      - name: Trace monitor VDEV-up event producer
        working-directory: kernel
        shell: bash
        run: |
          set -u

          QCACLD="drivers/staging/qcacld-3.0"
          AUDIT="../artifacts/source-audit"

          mkdir -p "$AUDIT"

          echo "============================================================"
          echo "SME MONITOR VDEV-UP EVENT PRODUCER AUDIT"
          echo "============================================================"

          echo
          echo "=== 1. SME EVENT SYMBOL ==="

          grep -RniE \
            --include='*.c' \
            --include='*.h' \
            -B20 \
            -A30 \
            'eWNI_SME_MONITOR_MODE_VDEV_UP' \
            "$QCACLD" \
            2>/dev/null \
            > "$AUDIT/sme-monitor-event-symbol.txt" || true

          cat "$AUDIT/sme-monitor-event-symbol.txt" || true


          echo
          echo "=== 2. SME EVENT HANDLER ==="

          grep -RniE \
            --include='*.c' \
            -B30 \
            -A50 \
            'sme_process_monitor_mode_vdev_up_evt' \
            "$QCACLD" \
            2>/dev/null \
            > "$AUDIT/sme-monitor-event-handler.txt" || true

          cat "$AUDIT/sme-monitor-event-handler.txt" || true


          echo
          echo "=== 3. SME MESSAGE POSTING / PRODUCER ==="

          grep -RniE \
            --include='*.c' \
            --include='*.h' \
            -B30 \
            -A50 \
            'eWNI_SME_MONITOR_MODE_VDEV_UP|sme_post_pe_message|post.*MONITOR_MODE|MONITOR_MODE.*post' \
            "$QCACLD" \
            2>/dev/null \
            > "$AUDIT/sme-monitor-event-producer.txt" || true

          cat "$AUDIT/sme-monitor-event-producer.txt" || true


          echo
          echo "=== 4. SME DISPATCHER ==="

          grep -RniE \
            --include='*.c' \
            -B35 \
            -A45 \
            'eWNI_SME_MONITOR_MODE_VDEV_UP|sme_process_msg|sme_mc_process_handler' \
            "$QCACLD/core/sme" \
            "$QCACLD/components" \
            2>/dev/null \
            > "$AUDIT/sme-monitor-dispatch.txt" || true

