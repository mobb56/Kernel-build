name: QCACLD3 In-Tree Injection Prototype v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            python3 \
            rsync \
            ripgrep

      - name: Clone LineageOS SM6225 kernel
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            kernel

      - name: Clone NetHunter reference
        run: |
          git clone --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            reference

      - name: Verify integrated WLAN trees
        run: |
          set -e

          test -d kernel/drivers/staging/qcacld-3.0
          test -d kernel/drivers/staging/qca-wifi-host-cmn
          test -d kernel/drivers/staging/fw-api

          test -f \
            kernel/drivers/staging/qca-wifi-host-cmn/qdf/inc/qdf_nbuf.h

          test -f \
            kernel/drivers/staging/fw-api/fw/athdefs.h

          echo "QCACLD3: OK"
          echo "QDF: OK"
          echo "FW API: OK"

      - name: Create output directory
        run: |
          mkdir -p out
          mkdir -p report

      - name: Generate kernel configuration
        run: |
          set -e

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

      - name: Synchronize kernel configuration
        run: |
          set -e

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      - name: Prepare kernel
        run: |
          set -e

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            prepare

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules_prepare

      - name: Verify generated kernel configuration
        run: |
          set -e

          echo "=== Checking auto.conf ==="

          test -f out/include/config/auto.conf
          test -f out/include/config/auto.conf.cmd

          ls -lh \
            out/include/config/auto.conf \
            out/include/config/auto.conf.cmd

          echo
          echo "Kernel configuration is valid."

      - name: Copy minimal injection prototype
        run: |
          set -e

          KERNEL_QCACLD="$PWD/kernel/drivers/staging/qcacld-3.0"
          REF="$PWD/reference/drivers/staging/qcacld-3.0"

          mkdir -p \
            "$KERNEL_QCACLD/core/wma/inc" \
            "$KERNEL_QCACLD/core/wma/src" \
            "$KERNEL_QCACLD/core/hdd/inc" \
            "$KERNEL_QCACLD/core/hdd/src"

          cp \
            "$REF/core/wma/inc/wma_frame_inject.h" \
            "$KERNEL_QCACLD/core/wma/inc/"

          cp \
            "$REF/core/wma/src/wma_frame_inject.c" \
            "$KERNEL_QCACLD/core/wma/src/"

          cp \
            "$REF/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "$KERNEL_QCACLD/core/hdd/inc/"

          cp \
            "$REF/core/hdd/src/wlan_hdd_frame_inject.c" \
            "$KERNEL_QCACLD/core/hdd/src/"

          cp \
            "$REF/core/hdd/inc/wlan_hdd_frame_validate.h" \
            "$KERNEL_QCACLD/core/hdd/inc/"

          cp \
            "$REF/core/hdd/src/wlan_hdd_frame_validate.c" \
            "$KERNEL_QCACLD/core/hdd/src/"

      - name: Verify prototype files
        run: |
          set -e

          find kernel/drivers/staging/qcacld-3.0/core \
            \( \
              -name 'wma_frame_inject.*' \
              -o -name 'wlan_hdd_frame_inject.*' \
              -o -name 'wlan_hdd_frame_validate.*' \
            \) \
            -print

      - name: Enable prototype objects
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "kernel/drivers/staging/qcacld-3.0/Kbuild"
          )

          text = p.read_text()

          additions = []

          if "wma_frame_inject.o" not in text:
              additions.append(
                  "wma_frame_inject.o"
              )

          if "wlan_hdd_frame_inject.o" not in text:
              additions.append(
                  "wlan_hdd_frame_inject.o"
              )

          if "wlan_hdd_frame_validate.o" not in text:
              additions.append(
                  "wlan_hdd_frame_validate.o"
              )

          # Locate object-list assignments and append the
          # prototype objects to the existing lists.
          lines = text.splitlines()

          out = []

          for line in lines:
              out.append(line)

              if (
                  "WMA_SRC_DIR)" in line
                  and "wlan_qct_wma_legacy.o" in line
                  and "wma_frame_inject.o" not in text
              ):
                  out.append(
                      "\t\t$(WMA_SRC_DIR)/wma_frame_inject.o \\"
                  )

              if (
                  "HDD_SRC_DIR)" in line
                  and "wlan_hdd_wowl.o" in line
                  and "wlan_hdd_frame_inject.o" not in text
              ):
                  out.append(
                      "\t\t$(HDD_SRC_DIR)/wlan_hdd_frame_inject.o \\"
                  )
                  out.append(
                      "\t\t$(HDD_SRC_DIR)/wlan_hdd_frame_validate.o \\"
                  )

          p.write_text("\n".join(out) + "\n")

          print("Kbuild modified.")
          print("Prototype objects requested:")
          for x in additions:
              print("  ", x)
          PY

      - name: Verify Kbuild prototype objects
        run: |
          set -e

          rg -n --text \
            'wma_frame_inject\.o|wlan_hdd_frame_inject\.o|wlan_hdd_frame_validate\.o' \
            kernel/drivers/staging/qcacld-3.0/Kbuild

      - name: Build QCACLD3 in-tree
        id: qcacld_build
        continue-on-error: true
        run: |
          set -o pipefail

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            M=drivers/staging/qcacld-3.0 \
            V=1 \
            modules \
            2>&1 | tee report/qcacld3-build.log

      - name: Capture diagnostics
        if: always()
        run: |
          {
            echo "=== Fatal errors ==="
            grep -n -C 6 \
              "fatal error" \
              report/qcacld3-build.log || true

            echo
            echo "=== Compiler errors ==="
            grep -n -C 5 \
              "error:" \
              report/qcacld3-build.log || true

            echo
            echo "=== Missing headers ==="
            grep -n \
              "file not found" \
              report/qcacld3-build.log || true

            echo
            echo "=== Undefined symbols ==="
            grep -n -E \
              "undefined|UNDEFINED" \
              report/qcacld3-build.log || true
          } > report/compiler-diagnostics.txt

      - name: Find generated modules
        if: always()
        run: |
          {
            echo "=== qca_cld3_wlan.ko ==="

            find kernel out \
              -type f \
              -name 'qca_cld3_wlan.ko' \
              -print || true

            echo
            echo "=== wlan.ko ==="

            find kernel out \
              -type f \
              -name 'wlan.ko' \
              -print || true

            echo
            echo "=== All KO files ==="

            find kernel out \
              -type f \
              -name '*.ko' \
              -print || true
          } > report/generated-modules.txt

      - name: Find injection objects
        if: always()
        run: |
          {
            find kernel out \
              -type f \
              \( \
                -name 'wma_frame_inject.o' \
                -o -name 'wlan_hdd_frame_inject.o' \
                -o -name 'wlan_hdd_frame_validate.o' \
              \) \
              -print || true
          } > report/injection-objects.txt

      - name: Final conclusion
        if: always()
        run: |
          {
            echo "=== Result ==="
            echo

            if find kernel out \
              -type f \
              -name 'qca_cld3_wlan.ko' \
              | grep -q .; then

              echo "QCACLD3 MODULE GENERATED"

            elif find kernel out \
              -type f \
              -name 'wlan.ko' \
              | grep -q .; then

              echo "WLAN MODULE GENERATED"

            else

              echo "NO WLAN MODULE GENERATED"

            fi

            echo
            echo "=== auto.conf ==="

            if test -f out/include/config/auto.conf; then
              echo "PRESENT"
            else
              echo "MISSING"
            fi

            echo
            echo "=== Injection objects ==="

            find kernel out \
              -type f \
              \( \
                -name 'wma_frame_inject.o' \
                -o -name 'wlan_hdd_frame_inject.o' \
                -o -name 'wlan_hdd_frame_validate.o' \
              \) \
              -print || true

          } > report/CONCLUSION.txt

      - name: Package report
        if: always()
        run: |
          mkdir -p artifact
          cp -r report artifact/

          cd artifact
          zip -r ../qcacld3-in-tree-injection-v2.zip .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-in-tree-injection-v2
          path: qcacld3-in-tree-injection-v2.zip
          if-no-files-found: error
