          echo
          echo "=== Duplicate injection helper fix passed ==="
          
      # ============================================================
      # 29. ADD INJECTION CONTEXT TO wlan_hdd_main.h
      #
      # Do this only if the current kernel source does not already
      # contain the integration.
      # ============================================================

      - name: Integrate injection context into HDD
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          MAIN_H="drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h"

          test -f "${MAIN_H}"

          echo "=== Inspecting wlan_hdd_main.h ==="

          sed -n '110,180p' "${MAIN_H}"

          echo
          echo "=== Checking for existing injection context declaration ==="

          if grep -Fq 'struct hdd_injection_ctx;' "${MAIN_H}"; then
            echo "Injection context forward declaration already exists."
          else
            echo "Injection context forward declaration is not present."

            TMP_H="${MAIN_H}.tmp"

            awk '
              {
                lines[NR] = $0
              }
              END {
                inserted = 0

                for (i = 1; i <= NR; i++) {
                  if (!inserted && lines[i] ~ /^[[:space:]]*#endif[[:space:]]*$/) {
                    print ""
                    print "#ifdef FEATURE_FRAME_INJECTION_SUPPORT"
                    print "struct hdd_injection_ctx;"
                    print "#endif"
                    print ""
                    inserted = 1
                  }

                  print lines[i]
                }

                if (!inserted) {
                  exit 1
                }
              }
            ' "${MAIN_H}" > "${TMP_H}"

            test -s "${TMP_H}"

            mv "${TMP_H}" "${MAIN_H}"

            echo "Injection context forward declaration inserted."
          fi

          echo
          echo "=== Verifying injection context declaration ==="

          grep -F -A2 -B1 \
            'struct hdd_injection_ctx;' \
            "${MAIN_H}"

          echo
          echo "=== HDD header integration passed ==="

      # ============================================================
      # 30. INCLUDE FRAME-INJECTION API IN wlan_hdd_main.c
      # ============================================================

      - name: Integrate injection API into HDD main
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          MAIN_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"
          INJECT_H="drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject.h"

          test -f "${MAIN_C}"
          test -f "${INJECT_H}"

