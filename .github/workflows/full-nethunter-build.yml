          #
          # Those ABI/security/compiler settings come from stock.
          #
          # QCACLD3 FEATURE_* variables are Kbuild variables and do
          # NOT belong in this file.
          # ============================================================


          # ============================================================
          # HID
          # ============================================================

          CONFIG_HID=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y


          # ============================================================
