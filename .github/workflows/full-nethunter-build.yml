name: Moto G9 Power cebu NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build cebu NetHunter kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      KERNEL: ${{ github.workspace }}/kernel
      OUT: ${{ github.workspace }}/out
      REF: ${{ github.workspace }}/reference
      AK3: ${{ github.workspace }}/AnyKernel3

      ARCH: arm64
      LLVM: 1
      LLVM_IAS: 1
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:

      # ============================================================
      # HOST TOOLS
      # ============================================================

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            zip \
            unzip \
            bc \
            bison \
            flex \
            python3 \
            cpio \
            rsync \
            file \
            libssl-dev \
            libelf-dev \
            dwarves \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang-14 \
            llvm-14 \
            lld-14

          clang-14 --version
          ld.lld-14 --version
          aarch64-linux-gnu-gcc --version

      # ============================================================
      # SOURCE
      # ============================================================

      - name: Clone Motorola LineageOS kernel
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$KERNEL"

      - name: Clone NetHunter QCACLD3 reference
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            "$REF"

      - name: Clone AnyKernel3
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            "$AK3"

      # ============================================================
      # SOURCE VERIFICATION
      # ============================================================

      - name: Verify source trees
        run: |
          set -eux

          echo "===== MOTOROLA SOURCE ====="

          test -f "$KERNEL/Makefile"
          test -f "$KERNEL/arch/arm64/Makefile"

          test -f \
            "$KERNEL/arch/arm64/configs/vendor/bengal-perf_defconfig"

          test -f \
            "$KERNEL/drivers/staging/qcacld-3.0/Kbuild"

          test -f \
            "$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h"

          test -f \
            "$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_includes.h"

          test -f \
            "$KERNEL/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"

          echo "Motorola source OK."

          echo
          echo "===== NETHUNTER REFERENCE ====="

          for FILE in \
            drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c \
            drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_validate.c \
            drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c \
            drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c \
            drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c \
            drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject.h \
            drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_validate.h \
            drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_inject_security.h \
            drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject_debug.h \
            drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h
          do
            test -f "$REF/$FILE"
          done

          echo "NetHunter reference OK."

          echo
          echo "========================================"
          echo "SOURCE VERIFICATION PASSED"
          echo "========================================"

      # ============================================================
      # LLVM
      # ============================================================

      - name: Configure LLVM 14
        run: |
          set -eux

          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

      # ============================================================
      # CLEAN OUT-OF-TREE BUILD
      # ============================================================

      - name: Prepare clean output
        run: |
          set -eux

          rm -rf "$OUT"

          mkdir -p "$OUT"

      # ============================================================
      # BASE DEFCONFIG
      # ============================================================

      - name: Generate Motorola base configuration
        run: |
          set -eux

          cd "$KERNEL"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            vendor/bengal-perf_defconfig

      # ============================================================
      # NETHUNTER CONFIG
      # ============================================================

      - name: Create NetHunter config
        run: |
          set -eux

          cat > "$GITHUB_WORKSPACE/nethunter.config" <<'EOF'

          # --------------------------------------------------------
          # MODULE SUPPORT
          # --------------------------------------------------------

          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y

          # --------------------------------------------------------
          # HID
          # --------------------------------------------------------

          CONFIG_HIDRAW=y
          CONFIG_UHID=y

          # --------------------------------------------------------
          # BLUETOOTH
          # --------------------------------------------------------

          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y

          CONFIG_BT_RFCOMM=m
          CONFIG_BT_RFCOMM_TTY=y

          CONFIG_BT_BNEP=m
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y

          CONFIG_BT_HIDP=m

          CONFIG_BT_HCIVHCI=m

          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y

          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y

          # --------------------------------------------------------
          # USB GADGET
          # --------------------------------------------------------

          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y

          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_ECM_SUBSET=y
          CONFIG_USB_CONFIGFS_EEM=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y

          # --------------------------------------------------------
          # USB SERIAL
          # --------------------------------------------------------

          CONFIG_USB_ACM=m
          CONFIG_USB_SERIAL=m
          CONFIG_USB_SERIAL_GENERIC=m

          # --------------------------------------------------------
          # USB NETWORKING
          # --------------------------------------------------------

          CONFIG_USB_NET_DRIVERS=m
          CONFIG_USB_NET_CDCETHER=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_NET_RNDIS_HOST=m

          CONFIG_USB_RTL8150=y
          CONFIG_USB_RTL8152=y

          # --------------------------------------------------------
          # PACKET / NETWORK
          # --------------------------------------------------------

          CONFIG_PACKET=y
          CONFIG_UNIX=y

          # --------------------------------------------------------
          # MONITOR MODE
          # --------------------------------------------------------

          CONFIG_FEATURE_MONITOR_MODE_SUPPORT=y

          # --------------------------------------------------------
          # QCACLD3
          # --------------------------------------------------------

          CONFIG_QCA_CLD_WLAN=m

          # --------------------------------------------------------
          # SENSOR COMPATIBILITY
          # --------------------------------------------------------

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m

          EOF

      # ============================================================
      # MERGE CONFIG
      # ============================================================

      - name: Merge NetHunter configuration
        run: |
          set -eux

          cd "$KERNEL"

          scripts/kconfig/merge_config.sh \
            -m \
            -O "$OUT" \
            "$OUT/.config" \
            "$GITHUB_WORKSPACE/nethunter.config"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            olddefconfig

      # ============================================================
      # CONFIG CHECK
      # ============================================================

      - name: Verify final kernel configuration
        run: |
          set -eux

          echo "===== FINAL CONFIGURATION ====="

          for CONFIG in \
            CONFIG_MODULES \
            CONFIG_MODULE_UNLOAD \
            CONFIG_MODVERSIONS \
            CONFIG_HIDRAW \
            CONFIG_UHID \
            CONFIG_BT \
            CONFIG_BT_RFCOMM \
            CONFIG_BT_BNEP \
            CONFIG_BT_HIDP \
            CONFIG_BT_HCIVHCI \
            CONFIG_BT_HCIUART \
            CONFIG_BT_HCIUART_H4 \
            CONFIG_BT_HCIBTUSB \
            CONFIG_USB_GADGET \
            CONFIG_USB_CONFIGFS \
            CONFIG_USB_CONFIGFS_NCM \
            CONFIG_USB_CONFIGFS_F_HID \
            CONFIG_USB_CONFIGFS_F_FS \
            CONFIG_USB_RTL8150 \
            CONFIG_USB_RTL8152 \
            CONFIG_QCA_CLD_WLAN \
            CONFIG_FEATURE_MONITOR_MODE_SUPPORT \
            CONFIG_SENSORS_SSC \
            CONFIG_SENSORS_CLASS
          do
            grep "^${CONFIG}=" "$OUT/.config" || true
          done

      # ============================================================
      # IMPORT NETHUNTER INJECTION SOURCES
      # ============================================================

      - name: Import QCACLD3 injection framework
        run: |
          set -eux

          HDD_SRC="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/src"
          HDD_INC="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc"

          WMA_SRC="$KERNEL/drivers/staging/qcacld-3.0/core/wma/src"
          WMA_INC="$KERNEL/drivers/staging/qcacld-3.0/core/wma/inc"

          REF_HDD_SRC="$REF/drivers/staging/qcacld-3.0/core/hdd/src"
          REF_HDD_INC="$REF/drivers/staging/qcacld-3.0/core/hdd/inc"

          REF_WMA_SRC="$REF/drivers/staging/qcacld-3.0/core/wma/src"
          REF_WMA_INC="$REF/drivers/staging/qcacld-3.0/core/wma/inc"

          mkdir -p \
            "$HDD_SRC" \
            "$HDD_INC" \
            "$WMA_SRC" \
            "$WMA_INC"

          cp \
            "$REF_HDD_SRC/wlan_hdd_frame_inject.c" \
            "$HDD_SRC/"

          cp \
            "$REF_HDD_SRC/wlan_hdd_frame_validate.c" \
            "$HDD_SRC/"

          cp \
            "$REF_HDD_SRC/wlan_hdd_inject_security.c" \
            "$HDD_SRC/"

          cp \
            "$REF_HDD_SRC/wlan_hdd_frame_inject_debug.c" \
            "$HDD_SRC/"

          cp \
            "$REF_WMA_SRC/wma_frame_inject.c" \
            "$WMA_SRC/"

          cp \
            "$REF_HDD_INC/wlan_hdd_frame_inject.h" \
            "$HDD_INC/"

          cp \
            "$REF_HDD_INC/wlan_hdd_frame_validate.h" \
            "$HDD_INC/"

          cp \
            "$REF_HDD_INC/wlan_hdd_inject_security.h" \
            "$HDD_INC/"

          cp \
            "$REF_HDD_INC/wlan_hdd_frame_inject_debug.h" \
            "$HDD_INC/"

          cp \
            "$REF_WMA_INC/wma_frame_inject.h" \
            "$WMA_INC/"

          echo "Injection framework imported."

      # ============================================================
      # ADD INJECTION CONTEXT TO MOTOROLA HDD ADAPTER
      # ============================================================

      - name: Adapt Motorola HDD adapter
        run: |
          set -eux

          MAIN="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h"

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          field = "struct hdd_injection_ctx *injection_ctx;"

          if field in s:
              print("injection_ctx already present")
              raise SystemExit(0)

          marker = "\tqdf_atomic_t net_dev_hold_ref_count[NET_DEV_HOLD_ID_MAX];"

          if marker not in s:
              raise SystemExit(
                  "Motorola HDD adapter marker not found"
              )

          replacement = marker + """

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
          \tstruct hdd_injection_ctx *injection_ctx;
          #endif"""

          s = s.replace(marker, replacement, 1)

          p.write_text(s)

          print("injection_ctx added.")
          PY

      # ============================================================
      # FIX get_task_cred
      # ============================================================

      - name: Fix QCACLD3 credential compatibility
        run: |
          set -eux

          SECURITY="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c"

          python3 - "$SECURITY" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          old = """\tconst struct cred *cred;
          \tbool has_capability = false;

          \thdd_security_debug("Checking injection capabilities");
          \t/* Use current task if none specified */
          \tif (!task)
          \t\ttask = current;

          \t/* Get task credentials */
          \tcred = get_task_cred(task);
          \tif (!cred) {
          \t\thdd_security_err("Failed to get task credentials");
          \t\treturn QDF_STATUS_E_FAILURE;
          \t}

          \t/* Check for CAP_NET_RAW capability */
          \thas_capability = capable(CAP_NET_RAW);

          \tput_cred(cred);"""

          new = """\tbool has_capability = false;

          \thdd_security_debug("Checking injection capabilities");

          \t/* Use current task if none specified */
          \tif (!task)
          \t\ttask = current;

          /*
           * Motorola's 4.19 kernel does not export get_task_cred()
           * for loadable modules.
           *
           * The reference implementation performs the actual
           * authorization check with capable(CAP_NET_RAW).
           * The current caller passes NULL, so current is used.
           */
          \thas_capability = capable(CAP_NET_RAW);"""

          if "get_task_cred(" not in s:
              print("get_task_cred already absent.")
              raise SystemExit(0)

          if old not in s:
              raise SystemExit(
                  "Expected get_task_cred block was not found."
              )

          s = s.replace(old, new, 1)

          if "get_task_cred(" in s:
              raise SystemExit(
                  "get_task_cred remains after patch."
              )

          p.write_text(s)

          print("get_task_cred compatibility fix applied.")
          PY

      # ============================================================
      # PATCH HDD MAIN.C
      # ============================================================

      - name: Integrate injection lifecycle into HDD
        run: |
          set -eux

          MAIN="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # --------------------------------------------------------
          # Include wma_frame_inject.h
          # --------------------------------------------------------

          if '#include "wma_frame_inject.h"' not in s:
              marker = '#include "wma.h"'

              if marker not in s:
                  raise SystemExit(
                      "Could not find wma.h include"
                  )

              s = s.replace(
                  marker,
                  marker + '\n#include "wma_frame_inject.h"',
                  1
              )

          # --------------------------------------------------------
          # Include frame injection API
          # --------------------------------------------------------

          if '#include "wlan_hdd_frame_inject.h"' not in s:
              marker = '#include "wlan_hdd_rx_monitor.h"'

              if marker not in s:
                  raise SystemExit(
                      "Could not find wlan_hdd_rx_monitor.h"
                  )

              block = '''#include "wlan_hdd_rx_monitor.h"
          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
          #include "wlan_hdd_frame_inject.h"
          #include "wlan_hdd_frame_inject_debug.h"
          #endif'''

              s = s.replace(marker, block, 1)

          # --------------------------------------------------------
          # Initialize injection when adapter is created
          # --------------------------------------------------------

          init_marker = """\thdd_periodic_sta_stats_init(adapter);

          \treturn adapter;"""

          init_replacement = """\thdd_periodic_sta_stats_init(adapter);

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
          \t/* Initialize frame injection for this adapter. */
          \tif (QDF_STATUS_SUCCESS != hdd_init_frame_injection(adapter))
          \t\thdd_err("Failed to initialize frame injection");
          #endif

          \treturn adapter;"""

          if "hdd_init_frame_injection(adapter)" not in s:
              if init_marker not in s:
                  raise SystemExit(
                      "Could not find HDD adapter initialization marker"
                  )

              s = s.replace(
                  init_marker,
                  init_replacement,
                  1
              )

          # --------------------------------------------------------
          # Deinitialize injection before adapter cleanup
          # --------------------------------------------------------

          close_marker = """\thdd_adapter_feature_update_work_deinit(adapter);
          \thdd_cleanup_adapter(hdd_ctx, adapter, rtnl_held);"""

          close_replacement = """\thdd_adapter_feature_update_work_deinit(adapter);

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
          \t/* Cleanup frame injection before destroying adapter. */
          \thdd_deinit_frame_injection(adapter);
          #endif

          \thdd_cleanup_adapter(hdd_ctx, adapter, rtnl_held);"""

          if "hdd_deinit_frame_injection(adapter)" not in s:
              if close_marker not in s:
                  raise SystemExit(
                      "Could not find HDD adapter cleanup marker"
                  )

              s = s.replace(
                  close_marker,
                  close_replacement,
                  1
              )

          p.write_text(s)

          print("HDD injection lifecycle integrated.")
          PY

          echo
          echo "===== VERIFY HDD MAIN ====="

          grep -n \
            -E \
            "wma_frame_inject|wlan_hdd_frame_inject|hdd_init_frame_injection|hdd_deinit_frame_injection" \
            "$MAIN"

      # ============================================================
      # PATCH QCACLD3 KBUILD
      # ============================================================

      - name: Enable QCACLD3 injection objects
        run: |
          set -eux

          KBUILD="$KERNEL/drivers/staging/qcacld-3.0/Kbuild"

          python3 - "$KBUILD" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # --------------------------------------------------------
          # HDD injection objects
          # --------------------------------------------------------

          hdd_marker = """ifeq ($(CONFIG_LITHIUM), y)
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_rx_monitor.o
          endif"""

          hdd_block = """ifeq ($(CONFIG_LITHIUM), y)
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_rx_monitor.o
          endif

          # NetHunter frame injection
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o"""

          if "HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o" not in s:
              if hdd_marker not in s:
                  raise SystemExit(
                      "Motorola HDD Kbuild marker not found"
                  )

              s = s.replace(
                  hdd_marker,
                  hdd_block,
                  1
              )

          # --------------------------------------------------------
          # WMA injection object
          # --------------------------------------------------------

          wma_marker = """WMA_OBJS :=\t$(WMA_SRC_DIR)/wma_main.o \
          \t\t$(WMA_SRC_DIR)/wma_scan_roam.o \
          \t\t$(WMA_SRC_DIR)/wma_dev_if.o \
          \t\t$(WMA_SRC_DIR)/wma_mgmt.o \
          \t\t$(WMA_SRC_DIR)/wma_power.o \
          \t\t$(WMA_SRC_DIR)/wma_data.o \
          \t\t$(WMA_SRC_DIR)/wma_utils.o \
          \t\t$(WMA_SRC_DIR)/wma_features.o \
          \t\t$(WMA_SRC_DIR)/wlan_qct_wma_legacy.o\\
          \t\t$(WMA_NDP_OBJS)"""

          if "WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o" not in s:
              if wma_marker not in s:
                  raise SystemExit(
                      "Motorola WMA Kbuild marker not found"
                  )

              s = s.replace(
                  wma_marker,
                  wma_marker + """

          # NetHunter frame injection
          WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o""",
                  1
              )

          # --------------------------------------------------------
          # Injection include directories
          # --------------------------------------------------------

          if "INCS += $(HDD_INC)" not in s:
              marker = "INCS +=\t\t$(UMAC_DBR_INC)"

              if marker not in s:
                  raise SystemExit(
                      "Motorola INCS insertion marker not found"
                  )

              s = s.replace(
                  marker,
                  marker + """

          # NetHunter injection include paths
          INCS += $(HDD_INC)
          INCS += $(WMA_INC)""",
                  1
              )

          # --------------------------------------------------------
          # Injection preprocessor define
          # --------------------------------------------------------

          if "-DFEATURE_FRAME_INJECTION_SUPPORT" not in s:
              marker = "ccflags-y += $(INCS)"

              if marker not in s:
                  raise SystemExit(
                      "ccflags-y INCS marker not found"
                  )

              s = s.replace(
                  marker,
                  """# NetHunter frame injection feature
          cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT

          """ + marker,
                  1
              )

          p.write_text(s)

          print("QCACLD3 Kbuild injection support enabled.")
          PY

          echo
          echo "===== KBUILD INJECTION CHECK ====="

          grep -n \
            -E \
            "wlan_hdd_frame_inject|wlan_hdd_frame_validate|wlan_hdd_inject_security|wlan_hdd_frame_inject_debug|wma_frame_inject|HDD_INC|WMA_INC|FEATURE_FRAME_INJECTION_SUPPORT" \
            "$KBUILD"

      # ============================================================
      # ADAPTATION VERIFICATION
      # ============================================================

      - name: Verify all source adaptations
        run: |
          set -eux

          BASE="$KERNEL/drivers/staging/qcacld-3.0"

          test -f \
            "$BASE/core/hdd/src/wlan_hdd_frame_inject.c"

          test -f \
            "$BASE/core/hdd/src/wlan_hdd_frame_validate.c"

          test -f \
            "$BASE/core/hdd/src/wlan_hdd_inject_security.c"

          test -f \
            "$BASE/core/hdd/src/wlan_hdd_frame_inject_debug.c"

          test -f \
            "$BASE/core/wma/src/wma_frame_inject.c"

          test -f \
            "$BASE/core/hdd/inc/wlan_hdd_frame_inject.h"

          test -f \
            "$BASE/core/hdd/inc/wlan_hdd_frame_validate.h"

          test -f \
            "$BASE/core/hdd/inc/wlan_hdd_inject_security.h"

          test -f \
            "$BASE/core/hdd/inc/wlan_hdd_frame_inject_debug.h"

          test -f \
            "$BASE/core/wma/inc/wma_frame_inject.h"

          if grep -R \
            "get_task_cred(" \
            "$BASE/core/hdd/src"
          then
            echo "ERROR: get_task_cred remains"
            exit 1
          fi

          MAIN_H="$BASE/core/hdd/inc/wlan_hdd_main.h"
          MAIN_C="$BASE/core/hdd/src/wlan_hdd_main.c"
          KBUILD="$BASE/Kbuild"

          grep -q \
            "struct hdd_injection_ctx \*injection_ctx;" \
            "$MAIN_H"

          grep -q \
            "hdd_init_frame_injection(adapter)" \
            "$MAIN_C"

          grep -q \
            "hdd_deinit_frame_injection(adapter)" \
            "$MAIN_C"

          grep -q \
            "wlan_hdd_frame_inject.o" \
            "$KBUILD"

          grep -q \
            "wma_frame_inject.o" \
            "$KBUILD"

          grep -q \
            "FEATURE_FRAME_INJECTION_SUPPORT" \
            "$KBUILD"

          echo
          echo "========================================"
          echo "SOURCE ADAPTATION VERIFICATION PASSED"
          echo "========================================"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build kernel and modules
        run: |
          set -eux

          cd "$KERNEL"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            -j"$(nproc)" \
            Image \
            modules

      # ============================================================
      # RELEASE
      # ============================================================

      - name: Verify kernel release
        run: |
          set -eux

          cd "$KERNEL"

          RELEASE="$(
            make -s \
              O="$OUT" \
              ARCH="$ARCH" \
              LLVM="$LLVM" \
              LLVM_IAS="$LLVM_IAS" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              kernelrelease
          )"

          echo "Kernel release: $RELEASE"

          case "$RELEASE" in
            *-dirty)
              echo "ERROR: dirty kernel"
              exit 1
              ;;
          esac

          printf '%s\n' "$RELEASE" \
            > "$GITHUB_WORKSPACE/kernel-release.txt"

      # ============================================================
      # IMAGE
      # ============================================================

      - name: Verify kernel Image
        run: |
          set -eux

          IMAGE="$OUT/arch/arm64/boot/Image"

          test -f "$IMAGE"

          ls -lh "$IMAGE"

          sha256sum "$IMAGE"

      # ============================================================
      # MODULE INSTALL
      # ============================================================

      - name: Install modules
        run: |
          set -eux

          rm -rf "$GITHUB_WORKSPACE/modules-staging"

          mkdir -p "$GITHUB_WORKSPACE/modules-staging"

          cd "$KERNEL"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules-staging" \
            modules_install

          echo "===== MODULES ====="

          find \
            "$GITHUB_WORKSPACE/modules-staging" \
            -type f \
            -name '*.ko' \
            -print \
            | sort

      # ============================================================
      # VERIFY WLAN
      # ============================================================

      - name: Verify wlan.ko
        run: |
          set -eux

          WLAN="$(
            find \
              "$GITHUB_WORKSPACE/modules-staging" \
              -type f \
              -name wlan.ko \
              -print -quit
          )"

          test -n "$WLAN"
          test -f "$WLAN"

          echo "WLAN: $WLAN"

          ls -lh "$WLAN"

          sha256sum "$WLAN"

          echo
          echo "===== MODINFO ====="

          modinfo "$WLAN" || true

      # ============================================================
      # VERIFY HID / BLUETOOTH / USB
      # ============================================================

      - name: Verify NetHunter modules
        run: |
          set -eux

          ROOT="$GITHUB_WORKSPACE/modules-staging"

          echo "===== NetHunter-related modules ====="

          for MOD in \
            rfcomm.ko \
            bnep.ko \
            hidp.ko \
            hci_uart.ko \
            hci_vhci.ko \
            btusb.ko \
            usbnet.ko \
            cdc_ether.ko \
            cdc_ncm.ko \
            rndis_host.ko \
            r8152.ko
          do
            RESULT="$(
              find "$ROOT" \
                -type f \
                -name "$MOD" \
                -print \
                | head -n 1
            )"

            if [ -n "$RESULT" ]; then
              echo "FOUND: $MOD"
            else
              echo "NOT MODULAR: $MOD"
            fi
          done

      # ============================================================
      # WLAN UNDEFINED SYMBOL CHECK
      # ============================================================

      - name: Verify WLAN symbols
        run: |
          set -eux

          WLAN="$(
            find \
              "$GITHUB_WORKSPACE/modules-staging" \
              -type f \
              -name wlan.ko \
              -print -quit
          )"

          test -n "$WLAN"

          readelf -Ws "$WLAN" \
            | awk '$4 == "UND" {print $8}' \
            | sort -u \
            | tee \
              "$GITHUB_WORKSPACE/wlan-undefined-symbols.txt"

          if grep -Fxq \
            "get_task_cred" \
            "$GITHUB_WORKSPACE/wlan-undefined-symbols.txt"
          then
            echo "ERROR: get_task_cred unresolved"
            exit 1
          fi

          echo
          echo "get_task_cred: PASS"

      # ============================================================
      # VERIMAGIC
      # ============================================================

      - name: Verify WLAN vermagic
        run: |
          set -eux

          WLAN="$(
            find \
              "$GITHUB_WORKSPACE/modules-staging" \
              -type f \
              -name wlan.ko \
              -print -quit
          )"

          test -n "$WLAN"

          echo "===== WLAN VERIMAGIC ====="

          modinfo "$WLAN" \
            | grep '^vermagic:' \
            || true

          echo
          echo "===== KERNEL RELEASE ====="

          cat "$GITHUB_WORKSPACE/kernel-release.txt"

      # ============================================================
      # SAVE CONFIG
      # ============================================================

      - name: Save final configuration
        run: |
          set -eux

          cp \
            "$OUT/.config" \
            "$GITHUB_WORKSPACE/final-kernel.config"

      # ============================================================
      # BUILD REPORT
      # ============================================================

      - name: Generate build report
        run: |
          set -eux

          {
            echo "Moto G9 Power / cebu"
            echo "Android 16"
            echo "LineageOS 23.2"
            echo
            echo "Kernel release:"
            cat "$GITHUB_WORKSPACE/kernel-release.txt"
            echo
            echo "Kernel Image:"
            ls -lh "$OUT/arch/arm64/boot/Image"
            echo
            echo "WLAN module:"
            find \
              "$GITHUB_WORKSPACE/modules-staging" \
              -name wlan.ko \
              -print
            echo
            echo "Undefined WLAN symbols:"
            cat "$GITHUB_WORKSPACE/wlan-undefined-symbols.txt"
            echo
            echo "Injection objects:"
            echo "wlan_hdd_frame_inject.o"
            echo "wlan_hdd_frame_validate.o"
            echo "wlan_hdd_inject_security.o"
            echo "wlan_hdd_frame_inject_debug.o"
            echo "wma_frame_inject.o"
          } > "$GITHUB_WORKSPACE/build-report.txt"

          cat "$GITHUB_WORKSPACE/build-report.txt"

      # ============================================================
      # ANYKERNEL3
      # ============================================================

      - name: Prepare AnyKernel3
        run: |
          set -eux

          cd "$AK3"

          rm -rf \
            modules/system \
            modules/vendor \
            modules/product \
            modules/system_ext

          mkdir -p \
            modules/vendor/lib/modules

          cp \
            "$OUT/arch/arm64/boot/Image" \
            "$AK3/Image"

          # Moto's existing WLAN modules live under vendor/lib/modules.
          # Put the newly-built modules there so AK3 installs them to
          # the same logical Android location.

          find \
            "$GITHUB_WORKSPACE/modules-staging" \
            -type f \
            -name '*.ko' \
            -exec cp {} \
              "$AK3/modules/vendor/lib/modules/" \;

          echo "===== AK3 MODULES ====="

          find \
            "$AK3/modules/vendor/lib/modules" \
            -type f \
            -name '*.ko' \
            -printf '%f\n' \
            | sort

      # ============================================================
      # ANYKERNEL SCRIPT
      # ============================================================

      - name: Configure AnyKernel3
        run: |
          set -eux

          cat > "$AK3/anykernel.sh" <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script

          properties() { '
          kernel.string=Moto G9 Power cebu NetHunter Kernel
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=cebu
          supported.versions=16
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;

          write_boot;
          EOF

          chmod 755 "$AK3/anykernel.sh"

          echo "===== ANYKERNEL SCRIPT ====="

          cat "$AK3/anykernel.sh"

      # ============================================================
      # CREATE ZIP
      # ============================================================

      - name: Build flashable AnyKernel3 ZIP
        run: |
          set -eux

          RELEASE="$(
            cat "$GITHUB_WORKSPACE/kernel-release.txt"
          )"

          ZIP="$GITHUB_WORKSPACE/moto-g9-power-cebu-nethunter-${RELEASE}.zip"

          cd "$AK3"

          rm -f "$ZIP"

          zip -r9 \
            "$ZIP" \
            . \
            -x '.git/*' \
            -x 'README.md' \
            -x '*placeholder'

          test -f "$ZIP"

          echo "===== FINAL ZIP ====="

          ls -lh "$ZIP"

          sha256sum "$ZIP" \
            | tee \
              "$GITHUB_WORKSPACE/kernel-zip.sha256"

      # ============================================================
      # MANIFEST
      # ============================================================

      - name: Create manifest
        run: |
          set -eux

          {
            echo "Moto G9 Power / cebu"
            echo
            echo "Android: 16"
            echo "LineageOS: 23.2"
            echo
            echo "Kernel:"
            cat "$GITHUB_WORKSPACE/kernel-release.txt"
            echo
            echo "ZIP:"
            ls -lh "$GITHUB_WORKSPACE"/*.zip
            echo
            echo "SHA256:"
            cat "$GITHUB_WORKSPACE/kernel-zip.sha256"
            echo
            echo "Modules:"
            find \
              "$AK3/modules/vendor/lib/modules" \
              -type f \
              -name '*.ko' \
              -printf '%f\n' \
              | sort
          } > "$GITHUB_WORKSPACE/manifest.txt"

          cat "$GITHUB_WORKSPACE/manifest.txt"

      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/kernel-release.txt
            ${{ github.workspace }}/kernel-zip.sha256
            ${{ github.workspace }}/manifest.txt
            ${{ github.workspace }}/build-report.txt
            ${{ github.workspace }}/final-kernel.config
            ${{ github.workspace }}/wlan-undefined-symbols.txt
            ${{ github.workspace }}/modules-staging/**/*.ko
