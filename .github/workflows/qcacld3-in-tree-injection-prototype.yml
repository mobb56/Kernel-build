name: QCACLD3 Injection Prototype v16

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync

      # ============================================================
      # CLONE KERNEL + NETHUNTER REFERENCE
      # ============================================================

      - name: Clone source trees
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$GITHUB_WORKSPACE/Kernel-Build"

          mkdir -p "$GITHUB_WORKSPACE/Kernel-Build"

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$GITHUB_WORKSPACE/Kernel-Build/kernel"

          git clone \
            --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            "$GITHUB_WORKSPACE/Kernel-Build/reference"

      # ============================================================
      # PATHS
      # ============================================================

      - name: Set paths
        shell: bash
        run: |
          set -euxo pipefail

          KERNEL="$GITHUB_WORKSPACE/Kernel-Build/kernel"
          REF="$GITHUB_WORKSPACE/Kernel-Build/reference"

          # IMPORTANT:
          # Generated kernel output stays OUTSIDE the Git tree.
          OUT="$GITHUB_WORKSPACE/Kernel-Build/kernel-out"

          WLAN="$KERNEL/drivers/staging/qcacld-3.0"

          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "WLAN=$WLAN" >> "$GITHUB_ENV"

      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify source trees
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL"

          test -f "$WLAN/Kbuild"

          test -d \
            "$KERNEL/drivers/staging/qca-wifi-host-cmn"

          test -d \
            "$KERNEL/drivers/staging/fw-api"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c"

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: fresh kernel tree is dirty."
            git status --short
            exit 1
          fi

          echo "Source trees verified."

      # ============================================================
      # CONFIGURE
      # ============================================================

      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL"

          export PATH="/usr/lib/llvm-14/bin:$PATH"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          echo "=== DEFCONFIG ==="

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          echo "=== ENABLE QCACLD3 MODULE ==="

          ./scripts/config \
            --file "$OUT/.config" \
            --module CONFIG_QCA_CLD_WLAN

          echo "=== OLDDEFCONFIG ==="

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "=== PREPARE ==="

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            prepare

          echo "=== MODULES PREPARE ==="

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_prepare

          test -f "$OUT/.config"
          test -f "$OUT/include/config/auto.conf"

          grep '^CONFIG_QCA_CLD_WLAN=' \
            "$OUT/.config"

          echo "Kernel preparation successful."

      # ============================================================
      # VERIFY SOURCE IS STILL CLEAN
      # ============================================================

      - name: Verify clean kernel tree
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL"

          test ! -f ".config"
          test ! -d "out"

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: kernel source is dirty."

            git status --short

            exit 1
          fi

          echo "Kernel source is clean."

      # ============================================================
      # BACKUP KBUILD
      # ============================================================

      - name: Backup Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            "$WLAN/Kbuild" \
            "$WLAN/Kbuild.original"

      # ============================================================
      # IMPORT PRODUCTION INJECTION HEADERS
      # ============================================================

      - name: Import injection headers
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            "$WLAN/core/hdd/inc" \
            "$WLAN/core/hdd/src" \
            "$WLAN/core/wma/inc" \
            "$WLAN/core/wma/src"

          HEADERS=(
            "core/hdd/inc/wlan_hdd_frame_inject.h"
            "core/hdd/inc/wlan_hdd_frame_inject_debug.h"
            "core/hdd/inc/wlan_hdd_frame_inject_integration.h"
            "core/hdd/inc/wlan_hdd_frame_validate.h"
            "core/hdd/inc/wlan_hdd_inject_security.h"
            "core/wma/inc/wma_frame_inject.h"
          )

          for f in "${HEADERS[@]}"; do
            echo "IMPORT: $f"

            cp \
              "$REF/drivers/staging/qcacld-3.0/$f" \
              "$WLAN/$f"
          done

      # ============================================================
      # IMPORT PRODUCTION INJECTION SOURCES
      # ============================================================

      - name: Import injection sources
        shell: bash
        run: |
          set -euxo pipefail

          SOURCES=(
            "core/hdd/src/wlan_hdd_frame_inject.c"
            "core/hdd/src/wlan_hdd_frame_inject_debug.c"
            "core/hdd/src/wlan_hdd_frame_inject_integration.c"
            "core/hdd/src/wlan_hdd_frame_validate.c"
            "core/hdd/src/wlan_hdd_inject_security.c"
            "core/wma/src/wma_frame_inject.c"
          )

          for f in "${SOURCES[@]}"; do
            echo "IMPORT: $f"

            cp \
              "$REF/drivers/staging/qcacld-3.0/$f" \
              "$WLAN/$f"
          done

      # ============================================================
      # VERIFY IMPORT
      # ============================================================

      - name: Verify injection files
        shell: bash
        run: |
          set -euxo pipefail

          missing=0

          FILES=(
            "core/hdd/inc/wlan_hdd_frame_inject.h"
            "core/hdd/inc/wlan_hdd_frame_inject_debug.h"
            "core/hdd/inc/wlan_hdd_frame_inject_integration.h"
            "core/hdd/inc/wlan_hdd_frame_validate.h"
            "core/hdd/inc/wlan_hdd_inject_security.h"
            "core/wma/inc/wma_frame_inject.h"

            "core/hdd/src/wlan_hdd_frame_inject.c"
            "core/hdd/src/wlan_hdd_frame_inject_debug.c"
            "core/hdd/src/wlan_hdd_frame_inject_integration.c"
            "core/hdd/src/wlan_hdd_frame_validate.c"
            "core/hdd/src/wlan_hdd_inject_security.c"
            "core/wma/src/wma_frame_inject.c"
          )

          for f in "${FILES[@]}"; do
            if [ -f "$WLAN/$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # ============================================================
      # PATCH KBUILD
      #
      # Motorola's Kbuild already knows how to locate:
      #
      #   qca-wifi-host-cmn
      #   fw-api
      #   qcacld3
      #
      # when it runs in KERNEL_BUILD=y mode.
      #
      # We therefore add only the injection-specific objects and
      # headers.
      # ============================================================

      - name: Patch QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "Kernel-Build/kernel/drivers/staging/qcacld-3.0/Kbuild"
          )

          text = path.read_text()

          marker = "$(MODNAME)-y := $(OBJS)"

          if marker not in text:
              raise SystemExit(
                  "ERROR: $(MODNAME)-y := $(OBJS) not found"
              )

          if "NetHunter QCACLD3 injection prototype v16" in text:
              raise SystemExit(
                  "ERROR: Kbuild already patched"
              )

          block = r'''
          # ==========================================================
          # NetHunter QCACLD3 injection prototype v16
          # ==========================================================

          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_integration.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o

          ccflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT

          ccflags-y += -I$(srctree)/drivers/staging/qcacld-3.0/core/hdd/inc
          ccflags-y += -I$(srctree)/drivers/staging/qcacld-3.0/core/hdd/src
          ccflags-y += -I$(srctree)/drivers/staging/qcacld-3.0/core/wma/inc

          # QDF include roots.
          ccflags-y += -I$(srctree)/drivers/staging/qca-wifi-host-cmn/qdf/inc
          ccflags-y += -I$(srctree)/drivers/staging/qca-wifi-host-cmn/qdf/linux/src

          # Qualcomm common utility headers.
          ccflags-y += -I$(srctree)/drivers/staging/qca-wifi-host-cmn/utils/sys

          '''

          text = text.replace(
              marker,
              block + marker,
              1
          )

          path.write_text(text)
          PY

          echo "=== PATCHED KBUILD ==="

          grep -n \
            -A30 \
            -B3 \
            "NetHunter QCACLD3 injection prototype v16" \
            "$WLAN/Kbuild"

      # ============================================================
      # VERIFY KBUILD
      # ============================================================

      - name: Verify Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          REQUIRED=(
            "wlan_hdd_frame_inject.o"
            "wlan_hdd_frame_inject_debug.o"
            "wlan_hdd_frame_inject_integration.o"
            "wlan_hdd_frame_validate.o"
            "wlan_hdd_inject_security.o"
            "wma_frame_inject.o"
            "FEATURE_FRAME_INJECTION_SUPPORT"
            "qca-wifi-host-cmn/qdf/inc"
            "qca-wifi-host-cmn/qdf/linux/src"
            "qca-wifi-host-cmn/utils/sys"
          )

          for item in "${REQUIRED[@]}"; do
            grep -q "$item" "$WLAN/Kbuild"
          done

          echo "Kbuild verified."

      # ============================================================
      # VERIFY QDF DEPENDENCIES
      # ============================================================

      - name: Verify QDF dependency tree
        shell: bash
        run: |
          set -euxo pipefail

          QDF="$KERNEL/drivers/staging/qca-wifi-host-cmn"

          test -f "$QDF/qdf/inc/qdf_nbuf.h"
          test -f "$QDF/qdf/linux/src/i_qdf_mem.h"
          test -f "$QDF/utils/sys/queue.h"

          echo "QDF headers verified."

          echo
          echo "qdf_nbuf.h:"
          readlink -f "$QDF/qdf/inc/qdf_nbuf.h"

          echo
          echo "i_qdf_mem.h:"
          readlink -f "$QDF/qdf/linux/src/i_qdf_mem.h"

          echo
          echo "queue.h:"
          readlink -f "$QDF/utils/sys/queue.h"

      # ============================================================
      # BUILD QCACLD3
      #
      # IMPORTANT:
      #
      # NO MODNAME
      # NO WLAN_ROOT
      # NO WLAN_COMMON_ROOT
      # NO WLAN_FW_API
      #
      # This allows Motorola's Kbuild to enter KERNEL_BUILD=y mode
      # and establish its own internal paths.
      # ============================================================

      - name: Build QCACLD3
        shell: bash
        run: |
          set +e

          cd "$KERNEL"

          export PATH="/usr/lib/llvm-14/bin:$PATH"

          mkdir -p "$GITHUB_WORKSPACE/reports"

          echo "=== BUILDING QCACLD3 IN KERNEL CONTEXT ==="

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            V=1 \
            M=drivers/staging/qcacld-3.0 \
            modules \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/reports/build.log"

          RC=${PIPESTATUS[0]}

          echo "$RC" > \
            "$GITHUB_WORKSPACE/reports/build-exit-code.txt"

          echo
          echo "QCACLD3 build exit code: $RC"

          exit 0

      # ============================================================
      # EXTRACT ACTUAL COMPILATION
      # ============================================================

      - name: Extract injection compilation
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          {
            echo "=== INJECTION COMPILATION COMMANDS ==="
            echo

            if [ -f reports/build.log ]; then

              grep -E \
                'wlan_hdd_frame_inject\.o|wlan_hdd_frame_inject_debug\.o|wlan_hdd_frame_inject_integration\.o|wlan_hdd_frame_validate\.o|wlan_hdd_inject_security\.o|wma_frame_inject\.o' \
                reports/build.log || true

              echo
              echo "=== COMPILER ERRORS ==="

              grep -E \
                'fatal error:|error:|undefined reference|No rule to make|recipe for target' \
                reports/build.log || true

            else
              echo "build.log not found."
            fi

          } | tee reports/injection-compile-results.txt

      # ============================================================
      # VERIFY OBJECTS
      # ============================================================

      - name: Verify injection objects
        if: always()
        shell: bash
        run: |
          set +e

          {
            echo "=== INJECTION OBJECTS ==="
            echo

            OBJECTS=(
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.o"
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.o"
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_integration.o"
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_validate.o"
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.o"
              "$OUT/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.o"
            )

            for f in "${OBJECTS[@]}"; do
              if [ -f "$f" ]; then
                echo "BUILT: $f"
              else
                echo "NOT BUILT: $f"
              fi
            done

            echo
            echo "=== WLAN MODULE ==="

            MOD="$OUT/drivers/staging/qcacld-3.0/wlan.ko"

            if [ -f "$MOD" ]; then
              echo "BUILT: wlan.ko"
              ls -lh "$MOD"
              file "$MOD"
            else
              echo "NOT BUILT: wlan.ko"
            fi

          } | tee reports/object-verification.txt

          exit 0

      # ============================================================
      # MODULE SYMBOLS
      # ============================================================

      - name: Inspect WLAN module
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p reports

          MOD="$OUT/drivers/staging/qcacld-3.0/wlan.ko"

          {
            echo "=== MODULE INSPECTION ==="
            echo

            if [ -f "$MOD" ]; then

              file "$MOD"

              echo
              echo "=== MODINFO ==="

              modinfo "$MOD" 2>/dev/null || true

              echo
              echo "=== INJECTION SYMBOLS ==="

              llvm-nm "$MOD" 2>/dev/null | \
                grep -E \
                'wlan_hdd_frame_inject|wlan_hdd_frame_validate|wma_frame_inject|injection' \
                || true

            else
              echo "wlan.ko not generated."
            fi

          } | tee reports/module-symbols.txt

      # ============================================================
      # CONCLUSION
      # ============================================================

      - name: Generate conclusion
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          RC="unknown"

          if [ -f reports/build-exit-code.txt ]; then
            RC="$(cat reports/build-exit-code.txt)"
          fi

          {
            echo "QCACLD3 Injection Prototype v16"
            echo "================================"
            echo
            echo "Build exit code: $RC"
            echo
            echo "Target:"
            echo "LineageOS android_kernel_motorola_sm6225"
            echo "branch: lineage-23.2"
            echo
            echo "Reference:"
            echo "V0lk3n/nethunter_kernel_oneplus_sm8150"
            echo "branch: nethunter-lineage-23.2"
            echo
            echo "Build mode:"
            echo "Motorola QCACLD3 kernel-build context"
            echo
            echo "External MODNAME/WLAN_ROOT overrides:"
            echo "DISABLED"
            echo
            echo "Injected production components:"
            echo "  wlan_hdd_frame_inject"
            echo "  wlan_hdd_frame_inject_debug"
            echo "  wlan_hdd_frame_inject_integration"
            echo "  wlan_hdd_frame_validate"
            echo "  wlan_hdd_inject_security"
            echo "  wma_frame_inject"
            echo
            echo "QDF include roots:"
            echo "  qdf/inc"
            echo "  qdf/linux/src"
            echo "  utils/sys"
            echo
            echo "This is a source compatibility test."
            echo "It does not establish firmware-level packet injection."
          } | tee reports/conclusion.txt

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package report
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf prototype-report

          mkdir -p \
            prototype-report \
            prototype-report/imported-source \
            prototype-report/imported-headers

          cp -a \
            reports/. \
            prototype-report/ \
            2>/dev/null || true

          cp \
            "$WLAN/Kbuild.original" \
            prototype-report/Kbuild.original \
            2>/dev/null || true

          cp \
            "$WLAN/Kbuild" \
            prototype-report/Kbuild.patched \
            2>/dev/null || true

          for f in \
            wlan_hdd_frame_inject.c \
            wlan_hdd_frame_inject_debug.c \
            wlan_hdd_frame_inject_integration.c \
            wlan_hdd_frame_validate.c \
            wlan_hdd_inject_security.c
          do
            cp \
              "$WLAN/core/hdd/src/$f" \
              prototype-report/imported-source/ \
              2>/dev/null || true
          done

          cp \
            "$WLAN/core/wma/src/wma_frame_inject.c" \
            prototype-report/imported-source/ \
            2>/dev/null || true

          cp \
            "$WLAN/core/hdd/inc/"*.h \
            prototype-report/imported-headers/ \
            2>/dev/null || true

          cp \
            "$WLAN/core/wma/inc/wma_frame_inject.h" \
            prototype-report/imported-headers/ \
            2>/dev/null || true

          cd prototype-report

          zip -r \
            ../qcacld3-injection-prototype-v16.zip \
            . >/dev/null

          ls -lh \
            ../qcacld3-injection-prototype-v16.zip

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-injection-prototype-v16
          path: qcacld3-injection-prototype-v16.zip
          if-no-files-found: error
