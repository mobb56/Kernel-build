name: Build cebu NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Moto G9 Power cebu NetHunter
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      KERNEL: ${{ github.workspace }}/kernel
      OUT: ${{ github.workspace }}/out
      REF: ${{ github.workspace }}/reference
      AK3: ${{ github.workspace }}/AnyKernel3

      ARCH: arm64
      LLVM: 1
      LLVM_IAS: 1
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:

      # ============================================================
      # 1. DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            zip \
            unzip \
            bc \
            bison \
            flex \
            python3 \
            cpio \
            rsync \
            file \
            libssl-dev \
            libelf-dev \
            dwarves \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang-14 \
            llvm-14 \
            lld-14

          clang-14 --version
          ld.lld-14 --version
          aarch64-linux-gnu-gcc --version

      # ============================================================
      # 2. MOTOROLA / LINEAGEOS KERNEL
      # ============================================================

      - name: Clone Motorola kernel
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$KERNEL"

      # ============================================================
      # 3. NETHUNTER REFERENCE
      # ============================================================

      - name: Clone NetHunter QCACLD3 reference
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            "$REF"

      # ============================================================
      # 4. ANYKERNEL3
      # ============================================================

      - name: Clone AnyKernel3
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            "$AK3"

      # ============================================================
      # 5. VERIFY SOURCES
      # ============================================================

      - name: Verify source trees
        run: |
          set -eux

          echo "===== MOTOROLA SOURCE ====="

          test -f "$KERNEL/Makefile"

          test -f \
            "$KERNEL/arch/arm64/configs/vendor/bengal-perf_defconfig"

          test -f \
            "$KERNEL/drivers/staging/qcacld-3.0/Kbuild"

          test -f \
            "$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h"

          test -f \
            "$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_includes.h"

          test -f \
            "$KERNEL/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"

          echo "Motorola source OK."

          echo
          echo "===== NETHUNTER REFERENCE ====="

          for FILE in \
            drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c \
            drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_validate.c \
            drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c \
            drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c \
            drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c \
            drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject.h \
            drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_validate.h \
            drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_inject_security.h \
            drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject_debug.h \
            drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h
          do
            test -f "$REF/$FILE"
          done

          echo "NetHunter reference OK."

      # ============================================================
      # 6. LLVM
      # ============================================================

      - name: Configure LLVM 14
        run: |
          set -eux

          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 7. CLEAN BUILD OUTPUT
      # ============================================================

      - name: Prepare output
        run: |
          set -eux

          rm -rf "$OUT"

          mkdir -p "$OUT"

      # ============================================================
      # 8. BASE CONFIGURATION
      # ============================================================

      - name: Generate base configuration
        run: |
          set -eux

          cd "$KERNEL"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            vendor/bengal-perf_defconfig

      # ============================================================
      # 9. NETHUNTER CONFIG
      # ============================================================

      - name: Create NetHunter configuration
        run: |
          set -eux

          cat > "$GITHUB_WORKSPACE/nethunter.config" <<'EOF'

          # ========================================================
          # MODULES
          # ========================================================

          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y

          # ========================================================
          # HID
          # ========================================================

          CONFIG_HIDRAW=y
          CONFIG_UHID=y

          # ========================================================
          # BLUETOOTH
          # ========================================================

          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y

          CONFIG_BT_RFCOMM=m
          CONFIG_BT_RFCOMM_TTY=y

          CONFIG_BT_BNEP=m
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y

          CONFIG_BT_HIDP=m

          CONFIG_BT_HCIVHCI=m

          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y

          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y

          # ========================================================
          # USB GADGET
          # ========================================================

          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y

          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_ECM_SUBSET=y
          CONFIG_USB_CONFIGFS_EEM=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y

          # ========================================================
          # USB SERIAL
          # ========================================================

          CONFIG_USB_ACM=m
          CONFIG_USB_SERIAL=m
          CONFIG_USB_SERIAL_GENERIC=m

          # ========================================================
          # USB NETWORKING
          # ========================================================

          CONFIG_USB_NET_DRIVERS=m
          CONFIG_USB_NET_CDCETHER=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_NET_RNDIS_HOST=m

          CONFIG_USB_RTL8150=y
          CONFIG_USB_RTL8152=y

          # ========================================================
          # NETWORK
          # ========================================================

          CONFIG_PACKET=y
          CONFIG_UNIX=y

          # ========================================================
          # WLAN
          # ========================================================

          CONFIG_QCA_CLD_WLAN=m

          # Existing Motorola monitor-mode support
          CONFIG_FEATURE_MONITOR_MODE_SUPPORT=y

          # ========================================================
          # SENSOR COMPATIBILITY
          # ========================================================

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m

          EOF

      # ============================================================
      # 10. MERGE CONFIG
      # ============================================================

      - name: Merge NetHunter configuration
        run: |
          set -eux

          cd "$KERNEL"

          scripts/kconfig/merge_config.sh \
            -m \
            -O "$OUT" \
            "$OUT/.config" \
            "$GITHUB_WORKSPACE/nethunter.config"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            olddefconfig

      # ============================================================
      # 11. VERIFY CONFIG
      # ============================================================

      - name: Verify important configuration
        run: |
          set -eux

          echo "===== CONFIGURATION ====="

          for CONFIG in \
            CONFIG_MODULES \
            CONFIG_MODULE_UNLOAD \
            CONFIG_MODVERSIONS \
            CONFIG_HIDRAW \
            CONFIG_UHID \
            CONFIG_BT \
            CONFIG_BT_RFCOMM \
            CONFIG_BT_BNEP \
            CONFIG_BT_HIDP \
            CONFIG_BT_HCIVHCI \
            CONFIG_BT_HCIUART \
            CONFIG_BT_HCIUART_H4 \
            CONFIG_BT_HCIBTUSB \
            CONFIG_USB_GADGET \
            CONFIG_USB_CONFIGFS \
            CONFIG_USB_CONFIGFS_NCM \
            CONFIG_USB_CONFIGFS_RNDIS \
            CONFIG_USB_CONFIGFS_ECM \
            CONFIG_USB_CONFIGFS_F_HID \
            CONFIG_USB_CONFIGFS_F_FS \
            CONFIG_USB_RTL8150 \
            CONFIG_USB_RTL8152 \
            CONFIG_USB_SERIAL \
            CONFIG_QCA_CLD_WLAN \
            CONFIG_FEATURE_MONITOR_MODE_SUPPORT \
            CONFIG_SENSORS_SSC \
            CONFIG_SENSORS_CLASS
          do
            grep "^${CONFIG}=" "$OUT/.config" || true
          done

      # ============================================================
      # 12. IMPORT INJECTION SOURCES
      # ============================================================

      - name: Import QCACLD3 injection framework
        run: |
          set -eux

          HDD_SRC="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/src"
          HDD_INC="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc"

          WMA_SRC="$KERNEL/drivers/staging/qcacld-3.0/core/wma/src"
          WMA_INC="$KERNEL/drivers/staging/qcacld-3.0/core/wma/inc"

          REF_HDD_SRC="$REF/drivers/staging/qcacld-3.0/core/hdd/src"
          REF_HDD_INC="$REF/drivers/staging/qcacld-3.0/core/hdd/inc"

          REF_WMA_SRC="$REF/drivers/staging/qcacld-3.0/core/wma/src"
          REF_WMA_INC="$REF/drivers/staging/qcacld-3.0/core/wma/inc"

          mkdir -p \
            "$HDD_SRC" \
            "$HDD_INC" \
            "$WMA_SRC" \
            "$WMA_INC"

          cp \
            "$REF_HDD_SRC/wlan_hdd_frame_inject.c" \
            "$HDD_SRC/"

          cp \
            "$REF_HDD_SRC/wlan_hdd_frame_validate.c" \
            "$HDD_SRC/"

          cp \
            "$REF_HDD_SRC/wlan_hdd_inject_security.c" \
            "$HDD_SRC/"

          cp \
            "$REF_HDD_SRC/wlan_hdd_frame_inject_debug.c" \
            "$HDD_SRC/"

          cp \
            "$REF_WMA_SRC/wma_frame_inject.c" \
            "$WMA_SRC/"

          cp \
            "$REF_HDD_INC/wlan_hdd_frame_inject.h" \
            "$HDD_INC/"

          cp \
            "$REF_HDD_INC/wlan_hdd_frame_validate.h" \
            "$HDD_INC/"

          cp \
            "$REF_HDD_INC/wlan_hdd_inject_security.h" \
            "$HDD_INC/"

          cp \
            "$REF_HDD_INC/wlan_hdd_frame_inject_debug.h" \
            "$HDD_INC/"

          cp \
            "$REF_WMA_INC/wma_frame_inject.h" \
            "$WMA_INC/"

          echo "Injection sources imported."

      # ============================================================
      # 13. ADD injection_ctx
      # ============================================================

      - name: Add injection context to Motorola HDD
        run: |
          set -eux

          MAIN="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h"

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          field = "struct hdd_injection_ctx *injection_ctx;"

          if field in s:
              print("injection_ctx already present")
              raise SystemExit(0)

          marker = "\tqdf_atomic_t net_dev_hold_ref_count[NET_DEV_HOLD_ID_MAX];"

          if marker not in s:
              raise SystemExit(
                  "Motorola HDD adapter marker not found"
              )

          replacement = marker + """

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
          \tstruct hdd_injection_ctx *injection_ctx;
          #endif"""

          s = s.replace(marker, replacement, 1)

          p.write_text(s)

          print("injection_ctx added.")
          PY

      # ============================================================
      # 14. ROBUST get_task_cred FIX
      # ============================================================

      - name: Fix get_task_cred compatibility
        run: |
          set -eux

          SECURITY="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c"

          python3 - "$SECURITY" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if "get_task_cred(" not in s:
              print("get_task_cred is already absent.")
              raise SystemExit(0)

          # Remove the credential declaration.
          s, n1 = re.subn(
              r'^[ \t]*const[ \t]+struct[ \t]+cred[ \t]+\*[ \t]*cred[ \t]*;[ \t]*\n',
              '',
              s,
              count=1,
              flags=re.MULTILINE
          )

          # Remove the get_task_cred() acquisition block.
          s, n2 = re.subn(
              r'[ \t]*/\*[ \t]*Get task credentials[ \t]*\*/[ \t]*\n'
              r'[ \t]*cred[ \t]*=[ \t]*get_task_cred\(task\);[ \t]*\n'
              r'[ \t]*if[ \t]*\(!cred\)[ \t]*\{[ \t]*\n'
              r'[ \t]*hdd_security_err\("Failed to get task credentials"\);[ \t]*\n'
              r'[ \t]*return[ \t]+QDF_STATUS_E_FAILURE;[ \t]*\n'
              r'[ \t]*\}[ \t]*\n',
              '',
              s,
              count=1
          )

          # Remove the matching put_cred().
          s, n3 = re.subn(
              r'^[ \t]*put_cred\(cred\);[ \t]*\n',
              '',
              s,
              count=1,
              flags=re.MULTILINE
          )

          if n1 != 1:
              raise SystemExit(
                  "Could not remove cred declaration."
              )

          if n2 != 1:
              raise SystemExit(
                  "Could not remove get_task_cred block."
              )

          if n3 != 1:
              raise SystemExit(
                  "Could not remove put_cred."
              )

          if "get_task_cred(" in s:
              raise SystemExit(
                  "get_task_cred still remains."
              )

          if "capable(CAP_NET_RAW)" not in s:
              raise SystemExit(
                  "CAP_NET_RAW check disappeared unexpectedly."
              )

          p.write_text(s)

          print("get_task_cred compatibility fix applied.")
          PY

          echo
          echo "===== SECURITY CHECK ====="

          grep -n \
            -A30 \
            -B5 \
            "hdd_check_injection_capability" \
            "$SECURITY"

          if grep -n \
            "get_task_cred(" \
            "$SECURITY"
          then
            echo "ERROR: get_task_cred remains"
            exit 1
          fi

          echo "PASS: get_task_cred removed."

      # ============================================================
      # 15. INTEGRATE INJECTION INTO wlan_hdd_main.c
      # ============================================================

      - name: Integrate injection lifecycle
        run: |
          set -eux

          MAIN="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # --------------------------------------------------------
          # Include injection header after existing RX monitor header.
          # --------------------------------------------------------

          include_marker = '#include "wlan_hdd_rx_monitor.h"'
          include_line = '#include "wlan_hdd_frame_inject.h"'

          if include_line not in s:
              if include_marker not in s:
                  raise SystemExit(
                      "wlan_hdd_rx_monitor.h include not found"
                  )

              s = s.replace(
                  include_marker,
                  include_marker +
                  '\n#ifdef FEATURE_FRAME_INJECTION_SUPPORT\n' +
                  include_line +
                  '\n#endif',
                  1
              )

          # --------------------------------------------------------
          # Initialize injection.
          # --------------------------------------------------------

          init_marker = "\thdd_periodic_sta_stats_init(adapter);\n\n\treturn adapter;"

          init_block = """\thdd_periodic_sta_stats_init(adapter);

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
          \tif (QDF_STATUS_SUCCESS != hdd_init_frame_injection(adapter))
          \t\thdd_err("Failed to initialize frame injection");
          #endif

          \treturn adapter;"""

          if "hdd_init_frame_injection(adapter)" not in s:
              if init_marker not in s:
                  raise SystemExit(
                      "HDD adapter initialization marker not found"
                  )

              s = s.replace(
                  init_marker,
                  init_block,
                  1
              )

          # --------------------------------------------------------
          # Deinitialize injection.
          # --------------------------------------------------------

          close_marker = """\thdd_adapter_feature_update_work_deinit(adapter);
          \thdd_cleanup_adapter(hdd_ctx, adapter, rtnl_held);"""

          close_block = """\thdd_adapter_feature_update_work_deinit(adapter);

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
          \thdd_deinit_frame_injection(adapter);
          #endif

          \thdd_cleanup_adapter(hdd_ctx, adapter, rtnl_held);"""

          if "hdd_deinit_frame_injection(adapter)" not in s:
              if close_marker not in s:
                  raise SystemExit(
                      "HDD adapter cleanup marker not found"
                  )

              s = s.replace(
                  close_marker,
                  close_block,
                  1
              )

          p.write_text(s)

          print("Injection lifecycle integrated.")
          PY

          echo
          echo "===== LIFECYCLE CHECK ====="

          grep -n \
            -E \
            "wlan_hdd_frame_inject|hdd_init_frame_injection|hdd_deinit_frame_injection" \
            "$MAIN"

      # ============================================================
      # 16. PATCH QCACLD3 KBUILD
      # ============================================================

      - name: Add injection objects to QCACLD3 Kbuild
        run: |
          set -eux

          KBUILD="$KERNEL/drivers/staging/qcacld-3.0/Kbuild"

          python3 - "$KBUILD" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # ========================================================
          # HDD OBJECTS
          # ========================================================

          if "wlan_hdd_frame_inject.o" not in s:

              marker = "$(HDD_SRC_DIR)/wlan_hdd_wowl.o"

              if marker not in s:
                  raise SystemExit(
                      "HDD object list marker not found"
                  )

              s = s.replace(
                  marker,
                  marker + """ \\
          \t\t$(HDD_SRC_DIR)/wlan_hdd_frame_inject.o \\
          \t\t$(HDD_SRC_DIR)/wlan_hdd_frame_validate.o \\
          \t\t$(HDD_SRC_DIR)/wlan_hdd_inject_security.o \\
          \t\t$(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o""",
                  1
              )

          # ========================================================
          # WMA OBJECT
          # ========================================================

          if "wma_frame_inject.o" not in s:

              marker = "\t\t$(WMA_NDP_OBJS)"

              if marker not in s:
                  raise SystemExit(
                      "WMA object list marker not found"
                  )

              s = s.replace(
                  marker,
                  marker + """ \\
          \t\t$(WMA_SRC_DIR)/wma_frame_inject.o""",
                  1
              )

          # ========================================================
          # INCLUDE PATHS
          # ========================================================

          if "INCS += $(HDD_INC)" not in s:

              marker = "INCS := -I $(srctree)/$(WLAN_ROOT)/inc \\"

              if marker not in s:
                  raise SystemExit(
                      "INCS marker not found"
                  )

              # Add after the initial INCS block using the
              # existing CMN_SYS_INC entry as a stable anchor.
              cmn_marker = "\t\t$(CMN_SYS_INC)"

              if cmn_marker not in s:
                  raise SystemExit(
                      "CMN_SYS_INC marker not found"
                  )

              s = s.replace(
                  cmn_marker,
                  cmn_marker + """

          # NetHunter injection headers
          INCS += $(HDD_INC)
          INCS += $(WMA_INC)""",
                  1
              )

          # ========================================================
          # FEATURE DEFINE
          # ========================================================

          if "cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT" not in s:

              marker = "ccflags-y += $(INCS)"

              if marker not in s:
                  raise SystemExit(
                      "ccflags-y marker not found"
                  )

              s = s.replace(
                  marker,
                  """cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT

          """ + marker,
                  1
              )

          p.write_text(s)

          print("QCACLD3 Kbuild patched.")
          PY

          echo
          echo "===== KBUILD CHECK ====="

          grep -n \
            -E \
            "wlan_hdd_frame_inject|wlan_hdd_frame_validate|wlan_hdd_inject_security|wlan_hdd_frame_inject_debug|wma_frame_inject|INCS.*HDD_INC|INCS.*WMA_INC|FEATURE_FRAME_INJECTION_SUPPORT" \
            "$KBUILD"

      # ============================================================
      # 17. VERIFY ADAPTATION
      # ============================================================

      - name: Verify source adaptation
        run: |
          set -eux

          BASE="$KERNEL/drivers/staging/qcacld-3.0"

          for FILE in \
            "$BASE/core/hdd/src/wlan_hdd_frame_inject.c" \
            "$BASE/core/hdd/src/wlan_hdd_frame_validate.c" \
            "$BASE/core/hdd/src/wlan_hdd_inject_security.c" \
            "$BASE/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
            "$BASE/core/wma/src/wma_frame_inject.c" \
            "$BASE/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "$BASE/core/hdd/inc/wlan_hdd_frame_validate.h" \
            "$BASE/core/hdd/inc/wlan_hdd_inject_security.h" \
            "$BASE/core/hdd/inc/wlan_hdd_frame_inject_debug.h" \
            "$BASE/core/wma/inc/wma_frame_inject.h"
          do
            test -f "$FILE"
          done

          grep -q \
            "struct hdd_injection_ctx \*injection_ctx;" \
            "$BASE/core/hdd/inc/wlan_hdd_main.h"

          grep -q \
            "hdd_init_frame_injection(adapter)" \
            "$BASE/core/hdd/src/wlan_hdd_main.c"

          grep -q \
            "hdd_deinit_frame_injection(adapter)" \
            "$BASE/core/hdd/src/wlan_hdd_main.c"

          grep -q \
            "wlan_hdd_frame_inject.o" \
            "$BASE/Kbuild"

          grep -q \
            "wlan_hdd_frame_validate.o" \
            "$BASE/Kbuild"

          grep -q \
            "wlan_hdd_inject_security.o" \
            "$BASE/Kbuild"

          grep -q \
            "wlan_hdd_frame_inject_debug.o" \
            "$BASE/Kbuild"

          grep -q \
            "wma_frame_inject.o" \
            "$BASE/Kbuild"

          grep -q \
            "FEATURE_FRAME_INJECTION_SUPPORT" \
            "$BASE/Kbuild"

          if grep -R \
            "get_task_cred(" \
            "$BASE/core/hdd/src"
          then
            echo "ERROR: get_task_cred remains"
            exit 1
          fi

          echo
          echo "========================================"
          echo "SOURCE ADAPTATION PASSED"
          echo "========================================"

      # ============================================================
      # 18. BUILD
      # ============================================================

      - name: Build kernel and modules
        run: |
          set -eux

          cd "$KERNEL"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            -j"$(nproc)" \
            Image \
            modules

      # ============================================================
      # 19. KERNEL RELEASE
      # ============================================================

      - name: Verify kernel release
        run: |
          set -eux

          cd "$KERNEL"

          RELEASE="$(
            make -s \
              O="$OUT" \
              ARCH="$ARCH" \
              LLVM="$LLVM" \
              LLVM_IAS="$LLVM_IAS" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              kernelrelease
          )"

          echo "$RELEASE"

          case "$RELEASE" in
            *-dirty)
              echo "ERROR: dirty kernel"
              exit 1
              ;;
          esac

          printf '%s\n' "$RELEASE" \
            > "$GITHUB_WORKSPACE/kernel-release.txt"

      # ============================================================
      # 20. IMAGE
      # ============================================================

      - name: Verify Image
        run: |
          set -eux

          IMAGE="$OUT/arch/arm64/boot/Image"

          test -f "$IMAGE"

          ls -lh "$IMAGE"

          sha256sum "$IMAGE"

      # ============================================================
      # 21. INSTALL MODULES
      # ============================================================

      - name: Install modules
        run: |
          set -eux

          rm -rf \
            "$GITHUB_WORKSPACE/modules-staging"

          mkdir -p \
            "$GITHUB_WORKSPACE/modules-staging"

          cd "$KERNEL"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules-staging" \
            modules_install

          echo "===== MODULES ====="

          find \
            "$GITHUB_WORKSPACE/modules-staging" \
            -type f \
            -name '*.ko' \
            -print \
            | sort

      # ============================================================
      # 22. VERIFY WLAN
      # ============================================================

      - name: Verify wlan.ko
        run: |
          set -eux

          WLAN="$(
            find \
              "$GITHUB_WORKSPACE/modules-staging" \
              -type f \
              -name wlan.ko \
              -print -quit
          )"

          test -n "$WLAN"
          test -f "$WLAN"

          echo "WLAN:"
          echo "$WLAN"

          ls -lh "$WLAN"

          sha256sum "$WLAN"

          echo
          echo "===== MODINFO ====="

          modinfo "$WLAN" || true

      # ============================================================
      # 23. VERIFY BLUETOOTH / HID / USB
      # ============================================================

      - name: Verify NetHunter modules
        run: |
          set -eux

          ROOT="$GITHUB_WORKSPACE/modules-staging"

          for MOD in \
            rfcomm.ko \
            bnep.ko \
            hidp.ko \
            hci_uart.ko \
            hci_vhci.ko \
            btusb.ko \
            usbnet.ko \
            cdc_ether.ko \
            cdc_ncm.ko \
            rndis_host.ko \
            r8152.ko
          do

            RESULT="$(
              find "$ROOT" \
                -type f \
                -name "$MOD" \
                -print \
                | head -n 1
            )"

            if [ -n "$RESULT" ]; then
              echo "FOUND: $MOD"
            else
              echo "NOT MODULAR: $MOD"
            fi

          done

      # ============================================================
      # 24. WLAN UNDEFINED SYMBOLS
      # ============================================================

      - name: Check WLAN undefined symbols
        run: |
          set -eux

          WLAN="$(
            find \
              "$GITHUB_WORKSPACE/modules-staging" \
              -type f \
              -name wlan.ko \
              -print -quit
          )"

          test -n "$WLAN"

          readelf -Ws "$WLAN" \
            | awk '$4 == "UND" {print $8}' \
            | sort -u \
            | tee \
              "$GITHUB_WORKSPACE/wlan-undefined-symbols.txt"

          if grep -Fxq \
            "get_task_cred" \
            "$GITHUB_WORKSPACE/wlan-undefined-symbols.txt"
          then
            echo "ERROR: get_task_cred unresolved"
            exit 1
          fi

          echo
          echo "get_task_cred: PASS"

      # ============================================================
      # 25. VERIMAGIC
      # ============================================================

      - name: Verify WLAN vermagic
        run: |
          set -eux

          WLAN="$(
            find \
              "$GITHUB_WORKSPACE/modules-staging" \
              -type f \
              -name wlan.ko \
              -print -quit
          )"

          test -n "$WLAN"

          modinfo "$WLAN" \
            | grep '^vermagic:' \
            || true

          echo
          echo "Kernel release:"
          cat "$GITHUB_WORKSPACE/kernel-release.txt"

      # ============================================================
      # 26. SAVE CONFIG
      # ============================================================

      - name: Save final config
        run: |
          set -eux

          cp \
            "$OUT/.config" \
            "$GITHUB_WORKSPACE/final-kernel.config"

      # ============================================================
      # 27. BUILD REPORT
      # ============================================================

      - name: Generate build report
        run: |
          set -eux

          {
            echo "Moto G9 Power / cebu"
            echo "Android 16"
            echo "LineageOS 23.2"
            echo
            echo "Kernel release:"
            cat "$GITHUB_WORKSPACE/kernel-release.txt"
            echo
            echo "Kernel Image:"
            ls -lh "$OUT/arch/arm64/boot/Image"
            echo
            echo "WLAN:"
            find \
              "$GITHUB_WORKSPACE/modules-staging" \
              -name wlan.ko \
              -print
            echo
            echo "Undefined WLAN symbols:"
            cat "$GITHUB_WORKSPACE/wlan-undefined-symbols.txt"
            echo
            echo "Injection objects:"
            echo "wlan_hdd_frame_inject.o"
            echo "wlan_hdd_frame_validate.o"
            echo "wlan_hdd_inject_security.o"
            echo "wlan_hdd_frame_inject_debug.o"
            echo "wma_frame_inject.o"
          } > "$GITHUB_WORKSPACE/build-report.txt"

          cat "$GITHUB_WORKSPACE/build-report.txt"

      # ============================================================
      # 28. PREPARE ANYKERNEL3
      # ============================================================

      - name: Prepare AnyKernel3
        run: |
          set -eux

          cd "$AK3"

          rm -rf \
            modules/system \
            modules/vendor \
            modules/product \
            modules/system_ext

          mkdir -p \
            modules/vendor/lib/modules

          cp \
            "$OUT/arch/arm64/boot/Image" \
            "$AK3/Image"

          find \
            "$GITHUB_WORKSPACE/modules-staging" \
            -type f \
            -name '*.ko' \
            -exec cp {} \
              "$AK3/modules/vendor/lib/modules/" \;

          echo "===== MODULE PACKAGE ====="

          find \
            "$AK3/modules/vendor/lib/modules" \
            -type f \
            -name '*.ko' \
            -printf '%f\n' \
            | sort

      # ============================================================
      # 29. ANYKERNEL3 SCRIPT
      # ============================================================

      - name: Configure AnyKernel3
        run: |
          set -eux

          cat > "$AK3/anykernel.sh" <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script

          properties() { '
          kernel.string=Moto G9 Power cebu NetHunter Kernel
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=cebu
          supported.versions=16
          '; }

          block=/dev/block/bootdevice/by-name/boot;

          is_slot_device=1;

          ramdisk_compression=auto;

          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;

          write_boot;
          EOF

          chmod 755 \
            "$AK3/anykernel.sh"

          cat "$AK3/anykernel.sh"

      # ============================================================
      # 30. CREATE ZIP
      # ============================================================

      - name: Build AnyKernel3 ZIP
        run: |
          set -eux

          RELEASE="$(
            cat "$GITHUB_WORKSPACE/kernel-release.txt"
          )"

          ZIP="$GITHUB_WORKSPACE/moto-g9-power-cebu-nethunter-${RELEASE}.zip"

          cd "$AK3"

          rm -f "$ZIP"

          zip -r9 \
            "$ZIP" \
            . \
            -x '.git/*' \
            -x 'README.md' \
            -x '*placeholder'

          test -f "$ZIP"

          ls -lh "$ZIP"

          sha256sum "$ZIP" \
            | tee \
              "$GITHUB_WORKSPACE/kernel-zip.sha256"

      # ============================================================
      # 31. MANIFEST
      # ============================================================

      - name: Create manifest
        run: |
          set -eux

          {
            echo "Moto G9 Power / cebu"
            echo "Android 16"
            echo "LineageOS 23.2"
            echo
            echo "Kernel:"
            cat "$GITHUB_WORKSPACE/kernel-release.txt"
            echo
            echo "ZIP:"
            ls -lh "$GITHUB_WORKSPACE"/*.zip
            echo
            echo "SHA256:"
            cat "$GITHUB_WORKSPACE/kernel-zip.sha256"
            echo
            echo "Modules:"
            find \
              "$AK3/modules/vendor/lib/modules" \
              -type f \
              -name '*.ko' \
              -printf '%f\n' \
              | sort
          } > "$GITHUB_WORKSPACE/manifest.txt"

          cat "$GITHUB_WORKSPACE/manifest.txt"

      # ============================================================
      # 32. UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/kernel-release.txt
            ${{ github.workspace }}/kernel-zip.sha256
            ${{ github.workspace }}/manifest.txt
            ${{ github.workspace }}/build-report.txt
            ${{ github.workspace }}/final-kernel.config
            ${{ github.workspace }}/wlan-undefined-symbols.txt
            ${{ github.workspace }}/modules-staging/**/*.ko
