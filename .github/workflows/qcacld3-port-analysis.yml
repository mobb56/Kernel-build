name: QCACLD3 Injection Port Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # MOTOROLA QCACLD-3.0
      # ============================================================

      - name: Clone Motorola QCACLD3
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p vendor/qcom/opensource/wlan

          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qcacld-3.0.git \
            vendor/qcom/opensource/wlan/qcacld-3.0


      # ============================================================
      # MOTOROLA HOST COMMON
      # ============================================================

      - name: Clone Motorola QCA host common
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qca-wifi-host-cmn.git \
            vendor/qcom/opensource/wlan/qca-wifi-host-cmn


      # ============================================================
      # MOTOROLA FW API
      # ============================================================

      - name: Clone Motorola FW API
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-fw-api.git \
            vendor/qcom/opensource/wlan/fw-api


      # ============================================================
      # CLONE REFERENCE KERNEL
      # ============================================================

      - name: Clone NetHunter reference kernel
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reference

          git clone \
            --depth=1 \
            https://github.com/Loukious/android_kernel_xiaomi_sm8150.git \
            reference/android_kernel_xiaomi_sm8150

          echo
          echo "Reference repository:"
          git -C reference/android_kernel_xiaomi_sm8150 remote get-url origin

          echo
          echo "Reference commit:"
          git -C reference/android_kernel_xiaomi_sm8150 rev-parse HEAD


      # ============================================================
      # DIRECTLY DOWNLOAD PATCH
      #
      # This avoids the path/branch problem from the previous run.
      # ============================================================

      - name: Download NetHunter injection patch
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p patches

          PATCH_URL="https://raw.githubusercontent.com/Loukious/android_kernel_xiaomi_sm8150/patches/patches/nethunter/07_packet_injection.patch"

          echo "Downloading:"
          echo "$PATCH_URL"

          curl \
            --location \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 120 \
            "$PATCH_URL" \
            --output patches/07_packet_injection.patch

          test -s patches/07_packet_injection.patch

          echo
          echo "PATCH DOWNLOADED SUCCESSFULLY"
          echo "============================="

          ls -lh patches/07_packet_injection.patch

          echo
          echo "SHA256:"
          sha256sum patches/07_packet_injection.patch

          echo
          echo "Lines:"
          wc -l patches/07_packet_injection.patch


      # ============================================================
      # VERIFY PATCH
      # ============================================================

      - name: Verify patch contents
        shell: bash
        run: |
          set -euxo pipefail

          PATCH="patches/07_packet_injection.patch"

          echo
          echo "PATCH HEADER"
          echo "============"

          sed -n '1,75p' "$PATCH"

          echo
          echo "FILES MODIFIED"
          echo "=============="

          grep '^diff --git ' "$PATCH"

          echo
          echo "INJECTION CONFIG"
          echo "================"

          grep -n \
            -E \
            'FEATURE_FRAME_INJECTION|FRAME_INJECTION|INJECTION' \
            "$PATCH" \
            | head -200 \
            || true


      # ============================================================
      # CREATE ISOLATED MOTOROLA TREE
      # ============================================================

      - name: Create isolated Motorola tree
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/motorola-qcacld3

          mkdir -p /tmp/motorola-qcacld3/drivers/staging

          cp -a \
            vendor/qcom/opensource/wlan/qcacld-3.0 \
            /tmp/motorola-qcacld3/drivers/staging/qcacld-3.0

          cp -a \
            vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
            /tmp/motorola-qcacld3/drivers/staging/qca-wifi-host-cmn

          cd /tmp/motorola-qcacld3

          git init

          git config user.name "QCACLD3 Analysis"

          git config user.email "analysis@example.invalid"

          git add .

          git commit \
            -m "Motorola QCACLD3 analysis baseline"


      # ============================================================
      # TEST PATCH WITHOUT STOPPING AT FIRST CONFLICT
      # ============================================================

      - name: Generate patch rejection files
        shell: bash
        run: |
          set +e

          cd /tmp/motorola-qcacld3

          git apply \
            --reject \
            --whitespace=nowarn \
            "$GITHUB_WORKSPACE/patches/07_packet_injection.patch" \
            > "$GITHUB_WORKSPACE/patch-apply-output.txt" \
            2>&1

          STATUS=$?

          echo "Patch apply exit code: $STATUS"

          find . \
            -name '*.rej' \
            -type f \
            | sort \
            > "$GITHUB_WORKSPACE/rejection-files.txt"

          echo
          echo "REJECTION FILES"
          echo "==============="

          cat "$GITHUB_WORKSPACE/rejection-files.txt"

          echo
          echo "PATCH OUTPUT"
          echo "============"

          cat "$GITHUB_WORKSPACE/patch-apply-output.txt"

          echo "$STATUS" \
            > "$GITHUB_WORKSPACE/patch-status.txt"

          exit 0


      # ============================================================
      # ANALYZE REJECTED HUNKS
      # ============================================================

      - name: Analyze rejected hunks
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/rejected-hunks.txt"

          {
            echo "QCACLD3 REJECTED HUNKS"
            echo "======================"
            echo

            while IFS= read -r FILE
            do
              [ -z "$FILE" ] && continue

              echo
              echo "=============================================="
              echo "REJECTION: $FILE"
              echo "=============================================="

              cat "/tmp/motorola-qcacld3/$FILE" \
                2>/dev/null \
                || true

            done < "$GITHUB_WORKSPACE/rejection-files.txt"

          } > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # EXTRACT PATCH SYMBOLS
      # ============================================================

      - name: Extract patch symbols
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/patch-symbols.txt"

          {
            echo "PATCH WLAN SYMBOLS"
            echo "=================="
            echo

            grep -E \
              -o \
              '\b(wlan_[A-Za-z0-9_]+|wma_[A-Za-z0-9_]+|ol_[A-Za-z0-9_]+|qdf_[A-Za-z0-9_]+|wmi_[A-Za-z0-9_]+)\b' \
              patches/07_packet_injection.patch \
              | sort -u \
              | head -1500 \
              || true

          } > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # MAP PATCH SYMBOLS INTO MOTOROLA SOURCE
      # ============================================================

      - name: Map symbols into Motorola source
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/motorola-symbol-map.txt"

          {
            echo "MOTOROLA QCACLD3 SYMBOL MAP"
            echo "==========================="
            echo

            grep -E \
              -o \
              '\b(wlan_[A-Za-z0-9_]+|wma_[A-Za-z0-9_]+|ol_[A-Za-z0-9_]+|qdf_[A-Za-z0-9_]+|wmi_[A-Za-z0-9_]+)\b' \
              patches/07_packet_injection.patch \
              | sort -u \
              | while read -r SYMBOL
            do

              [ -z "$SYMBOL" ] && continue

              echo
              echo "----------------------------------------------"
              echo "$SYMBOL"
              echo "----------------------------------------------"

              grep -Rni \
                --exclude-dir=.git \
                -E \
                "(^|[^A-Za-z0-9_])${SYMBOL}([^A-Za-z0-9_]|$)" \
                vendor/qcom/opensource/wlan/qcacld-3.0 \
                vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
                2>/dev/null \
                | head -40 \
                || echo "NOT FOUND"

            done

          } > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # SEARCH MOTOROLA INJECTION-RELATED CODE
      # ============================================================

      - name: Search Motorola injection functions
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/motorola-injection-search.txt"

          {
            echo "MOTOROLA INJECTION-RELATED CODE"
            echo "================================"
            echo

            grep -Rni \
              --exclude-dir=.git \
              -E \
              'mgmt_tx|mgmt.*tx|tx.*mgmt|monitor|radiotap|frame.*inject|inject.*frame|testmode|raw.*80211|80211.*raw|ndo_start_xmit' \
              vendor/qcom/opensource/wlan/qcacld-3.0 \
              vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
              2>/dev/null \
              | head -5000 \
              || true

          } > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # COMPARE CONFIGURATION
      # ============================================================

      - name: Compare injection configuration
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/config-comparison.txt"

          {
            echo "INJECTION CONFIGURATION"
            echo "======================="
            echo

            echo "=== PATCH ==="

            grep -n \
              -E \
              'CONFIG_|FRAME_INJECTION|INJECTION' \
              patches/07_packet_injection.patch \
              | head -1000 \
              || true

            echo
            echo "=== MOTOROLA SOURCE ==="

            grep -Rni \
              --exclude-dir=.git \
              -E \
              'FRAME_INJECTION|INJECTION|NL80211_TESTMODE|TESTMODE|QCA_CLD_WLAN' \
              vendor/qcom/opensource/wlan/qcacld-3.0 \
              vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
              2>/dev/null \
              | head -2000 \
              || true

          } > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Create final report
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/PORTING-SUMMARY.txt"

          {
            echo "Moto G9 Power cebu"
            echo "QCACLD-3 NetHunter Injection Port Analysis"
            echo "==========================================="
            echo

            echo "Motorola QCACLD3:"
            git -C vendor/qcom/opensource/wlan/qcacld-3.0 \
              rev-parse HEAD \
              2>/dev/null \
              || true

            echo
            echo "Motorola QCA host common:"
            git -C vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
              rev-parse HEAD \
              2>/dev/null \
              || true

            echo
            echo "Reference kernel:"
            git -C reference/android_kernel_xiaomi_sm8150 \
              rev-parse HEAD \
              2>/dev/null \
              || true

            echo
            echo "Patch SHA256:"
            sha256sum patches/07_packet_injection.patch

            echo
            echo "Patch status:"
            cat patch-status.txt

            echo
            echo "Rejection files:"
            cat rejection-files.txt

            echo
            echo "This workflow is analysis-only."
            echo "It does not build or flash anything."

          } > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # UPLOAD REPORT
      # ============================================================

      - name: Upload port analysis
        uses: actions/upload-artifact@v4
        with:
          name: cebu-qcacld3-port-analysis
          path: |
            PORTING-SUMMARY.txt
            patches/07_packet_injection.patch
            patch-apply-output.txt
            patch-status.txt
            rejection-files.txt
            rejected-hunks.txt
            patch-symbols.txt
            motorola-symbol-map.txt
            motorola-injection-search.txt
            config-comparison.txt
          if-no-files-found: error
          retention-days: 14


      # ============================================================
      # FINISH
      # ============================================================

      - name: Finish
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "QCACLD3 PORT ANALYSIS COMPLETE"
          echo "=============================================="
          echo
          echo "Artifact:"
          echo "cebu-qcacld3-port-analysis"
          echo
          echo "Upload that artifact here."
