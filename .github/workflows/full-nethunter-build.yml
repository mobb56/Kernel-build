          STOCK="${GITHUB_WORKSPACE}/cebu-stock.config"
          FINAL="${OUT_DIR}/.config"

          test -s "${STOCK}"
          test -s "${FINAL}"

          # Keep only actual CONFIG entries and sort them by symbol.
          #
          # This makes the comparison independent of the ordering
          # used by the original /proc/config.gz extraction.

          grep -E \
            '^(CONFIG_[A-Za-z0-9_]+=(.*)|# CONFIG_[A-Za-z0-9_]+ is not set)$' \
            "${STOCK}" |
            sort \
            > "${GITHUB_WORKSPACE}/artifacts/source-audit/stock-normalized.config"

          grep -E \
            '^(CONFIG_[A-Za-z0-9_]+=(.*)|# CONFIG_[A-Za-z0-9_]+ is not set)$' \
            "${FINAL}" |
            sort \
            > "${GITHUB_WORKSPACE}/artifacts/source-audit/final-normalized.config"

          test -s \
            "${GITHUB_WORKSPACE}/artifacts/source-audit/stock-normalized.config"

          test -s \
            "${GITHUB_WORKSPACE}/artifacts/source-audit/final-normalized.config"

          echo "Stock configuration entries:"
          wc -l \
            "${GITHUB_WORKSPACE}/artifacts/source-audit/stock-normalized.config"

          echo
          echo "Final configuration entries:"
          wc -l \
            "${GITHUB_WORKSPACE}/artifacts/source-audit/final-normalized.config"

      # ============================================================
      # 39. GENERATE COMPLETE CONFIGURATION DIFFERENCE
      # ============================================================

      - name: Generate stock versus final configuration diff
        shell: bash
        run: |
