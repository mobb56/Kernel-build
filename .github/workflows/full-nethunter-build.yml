name: Moto G9 Power cebu NetHunter

on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "Run the kernel compilation after all static audits pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read 

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  KERNEL_BRANCH: lineage-23.2

  NETHUNTER_REPO: https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git
  NETHUNTER_BRANCH: nethunter-lineage-23.2

  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out

  # Stock kernel metadata shows Clang/LLVM 21.
  LLVM_DIR: /usr/lib/llvm-21

jobs:
  build:
    name: Build cebu NetHunter kernel
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT THIS WORKFLOW REPOSITORY
      # ============================================================

      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL BASE BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libssl-dev \
            curl \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 3. INSTALL LLVM / CLANG 21
      # ============================================================
      - name: Install Android LLVM clang-r563880c
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_LLVM_DIR="${GITHUB_WORKSPACE}/android-llvm"
          LLVM_ARCHIVE_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/9916fb51ccb914d62d35ad9a7b9b21d2ef046928/clang-r563880c.tar.gz"

          rm -rf "${ANDROID_LLVM_DIR}"
          mkdir -p "${ANDROID_LLVM_DIR}"

          echo "=== Downloading Android clang-r563880c ==="

          curl -fL --retry 5 --retry-delay 5 \
            "${LLVM_ARCHIVE_URL}" \
            -o /tmp/clang-r563880c.tar.gz

          test -s /tmp/clang-r563880c.tar.gz

          echo "=== Extracting Android LLVM ==="

          tar -xzf /tmp/clang-r563880c.tar.gz \
            -C "${ANDROID_LLVM_DIR}"

          test -x "${ANDROID_LLVM_DIR}/bin/clang"
          test -x "${ANDROID_LLVM_DIR}/bin/ld.lld"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-ar"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-nm"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-objcopy"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-strip"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-readelf"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-objdump"

          echo
          echo "=== Android Clang version ==="

          "${ANDROID_LLVM_DIR}/bin/clang" --version

          "${ANDROID_LLVM_DIR}/bin/clang" --version \
            | grep -q -F 'clang version 21.0.0'

          echo
          echo "=== Activating Android LLVM ==="

          echo "LLVM_DIR=${ANDROID_LLVM_DIR}" >> "${GITHUB_ENV}"
          echo "PATH=${ANDROID_LLVM_DIR}/bin:${PATH}" >> "${GITHUB_ENV}"

          echo
          echo "Android clang-r563880c activated."
      # ============================================================
      # 4. PREPARE DETERMINISTIC LLVM TOOLCHAIN
      # ============================================================

         
      - name: Prepare Android LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_LLVM_DIR="${GITHUB_WORKSPACE}/android-llvm"
          LLVM_BIN="${ANDROID_LLVM_DIR}/bin"

          test -x "${ANDROID_LLVM_DIR}/bin/clang"
          test -x "${ANDROID_LLVM_DIR}/bin/ld.lld"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-ar"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-nm"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-objcopy"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-strip"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-readelf"
          test -x "${ANDROID_LLVM_DIR}/bin/llvm-objdump"

          echo "=== Android LLVM toolchain selected ==="

          echo "LLVM_DIR=${ANDROID_LLVM_DIR}" >> "${GITHUB_ENV}"
          echo "LLVM_BIN=${LLVM_BIN}" >> "${GITHUB_ENV}"
          echo "PATH=${LLVM_BIN}:${PATH}" >> "${GITHUB_ENV}"

          echo
          echo "=== Verify Android Clang directly ==="

          "${ANDROID_LLVM_DIR}/bin/clang" --version
          "${ANDROID_LLVM_DIR}/bin/ld.lld" --version

          "${ANDROID_LLVM_DIR}/bin/clang" --version \
            | grep -q -F 'clang version 21.0.0'

          echo
          echo "Android LLVM toolchain prepared successfully."
      # ============================================================
      # 5. VERIFY THAT CLANG 21 IS ACTUALLY SELECTED
      # ============================================================

      - name: Verify Android Clang 21.0.0 toolchain
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="${LLVM_BIN}:${PATH}"

          echo "clang:"
          command -v clang
          clang --version

          echo
          echo "ld.lld:"
          command -v ld.lld
          ld.lld --version

          echo
          echo "llvm-ar:"
          command -v llvm-ar
          llvm-ar --version

          echo
          echo "llvm-nm:"
          command -v llvm-nm
          llvm-nm --version

          echo
          echo "llvm-objcopy:"
          command -v llvm-objcopy

          echo
          echo "llvm-strip:"
          command -v llvm-strip

          echo
          echo "llvm-readelf:"
          command -v llvm-readelf

          echo
          echo "Checking compiler generation..."

          "${LLVM_BIN}/clang" --version |
          grep -q -F 'clang version 21.0.0'

          echo
          echo "Android Clang 21.0.0 toolchain verification PASSED."

      # ============================================================
      # 6. VERIFY THE STOCK CONFIGURATION FILE EXISTS
      #
      # This file is the authoritative cebu hardware baseline.
      # ============================================================

      - name: Verify stock cebu configuration
        shell: bash
        run: |
          set -euxo pipefail

          test -f cebu-stock.config
          test -s cebu-stock.config

          echo "Stock configuration:"
          ls -lh cebu-stock.config

          echo
          echo "Configuration line count:"
          wc -l cebu-stock.config

          echo
          echo "First configuration lines:"
          head -n 10 cebu-stock.config

          echo
          echo "Stock cebu configuration is present."


      # ============================================================
      # 7. CLONE KERNEL SOURCE
      # ============================================================

      - name: Clone cebu kernel source
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf kernel

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          cd kernel

          echo
          echo "Kernel repository:"
          git remote -v

          echo
          echo "Kernel branch:"
          git branch --show-current

          echo
          echo "Kernel commit:"
          git rev-parse HEAD

      # ============================================================
      # 8. VERIFY CORRECT KERNEL BRANCH
      # ============================================================

      - name: Verify cebu kernel source
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          test "$(git branch --show-current)" = "${KERNEL_BRANCH}"

          test -f Makefile
          test -d arch/arm64
          test -d drivers

          test -f \
            arch/arm64/configs/vendor/bengal-perf_defconfig

          echo
          echo "Correct cebu kernel source verified."

          echo
          echo "Defconfig:"
          echo "arch/arm64/configs/vendor/bengal-perf_defconfig"

      # ============================================================
      # 9. VERIFY QCACLD3 SOURCE TREE
      #
      # We do not modify it yet.
      # ============================================================

      - name: Verify QCACLD3 source tree
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../artifacts/source-audit

          echo "=== QCACLD3 source tree ==="

          test -d drivers/staging/qcacld-3.0
          test -f drivers/staging/qcacld-3.0/Kbuild

          echo "QCACLD3 root:"
          find drivers/staging/qcacld-3.0 \
            -maxdepth 3 \
            -type f \
            \( -name 'wlan_hdd_main.c' -o -name 'wlan_hdd_main.h' \) \
            -print

          HDD_MAIN_C="$(
            find drivers/staging/qcacld-3.0 \
              -type f \
              -name 'wlan_hdd_main.c' \
              -print -quit
          )"

          HDD_MAIN_H="$(
            find drivers/staging/qcacld-3.0 \
              -type f \
              -name 'wlan_hdd_main.h' \
              -print -quit
          )"

          if [ -z "${HDD_MAIN_C}" ]; then
            echo "ERROR: wlan_hdd_main.c was not found anywhere in QCACLD3."
            exit 1
          fi

          if [ -z "${HDD_MAIN_H}" ]; then
            echo "ERROR: wlan_hdd_main.h was not found anywhere in QCACLD3."
            exit 1
          fi

          echo "wlan_hdd_main.c: ${HDD_MAIN_C}"
          echo "wlan_hdd_main.h: ${HDD_MAIN_H}"

          {
            echo "QCACLD3_ROOT=drivers/staging/qcacld-3.0"
            echo "WLAN_HDD_MAIN_C=${HDD_MAIN_C}"
            echo "WLAN_HDD_MAIN_H=${HDD_MAIN_H}"
          } > ../artifacts/source-audit/qcacld3-paths.txt

          echo "QCACLD3 source tree verified."
      # ============================================================
      # 10. CLONE NETHUNTER REFERENCE
      # ============================================================

      - name: Clone NetHunter reference
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf nethunter-reference

          git clone \
            --depth=1 \
            --branch "${NETHUNTER_BRANCH}" \
            "${NETHUNTER_REPO}" \
            nethunter-reference

          cd nethunter-reference

          echo
          echo "NetHunter reference:"
          git remote -v

          echo
          echo "NetHunter branch:"
          git branch --show-current

          echo
          echo "NetHunter commit:"
          git rev-parse HEAD

      # ============================================================
      # 11. VERIFY NETHUNTER QCACLD3 REFERENCE
      # ============================================================

      - name: Verify NetHunter reference
        shell: bash
        run: |
          set -euxo pipefail

          NH="nethunter-reference"

          test -d "${NH}/drivers/staging/qcacld-3.0"

          echo
          echo "Searching for frame-injection sources..."

          find "${NH}/drivers/staging/qcacld-3.0" \
            -type f \
            \( \
              -name '*inject*' \
              -o \
              -name '*frame*inject*' \
            \) \
            -print \
            | sort

          echo
          echo "NetHunter QCACLD3 reference tree verified."

      # ============================================================
      # 12. VERIFY REQUIRED INJECTION SOURCES EXIST
      #
      # These are checked now so Part 4 never silently copies from
      # a missing or different source tree.
      # ============================================================

      - name: Verify required injection sources
        shell: bash
        run: |
          set -euxo pipefail

          NH="nethunter-reference/drivers/staging/qcacld-3.0"

          REQUIRED_FILES=(
            "${NH}/core/hdd/src/wlan_hdd_frame_inject.c"
            "${NH}/core/hdd/src/wlan_hdd_frame_validate.c"
            "${NH}/core/hdd/src/wlan_hdd_inject_security.c"
            "${NH}/core/hdd/src/wlan_hdd_frame_inject_debug.c"
            "${NH}/core/wma/src/wma_frame_inject.c"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "ERROR: required NetHunter source is missing:"
              echo "${file}"
              exit 1
            fi

            echo "FOUND: ${file}"
          done

          echo
          echo "All required injection sources are present."

      # ============================================================
      # 13. CREATE ARTIFACT DIRECTORY
      # ============================================================

      - name: Prepare audit directories
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            artifacts \
            artifacts/source-audit

          echo "Audit directories ready."

      # ============================================================
      # 14. RECORD SOURCE COMMITS
      # ============================================================

      - name: Record source versions
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "============================================================"
            echo "CEBU NETHUNTER SOURCE MANIFEST"
            echo "============================================================"
            echo
            echo "Kernel repository:"
            echo "${KERNEL_REPO}"
            echo
            echo "Kernel branch:"
            echo "${KERNEL_BRANCH}"
            echo
            echo "Kernel commit:"
            git -C kernel rev-parse HEAD
            echo
            echo "NetHunter repository:"
            echo "${NETHUNTER_REPO}"
            echo
            echo "NetHunter branch:"
            echo "${NETHUNTER_BRANCH}"
            echo
            echo "NetHunter commit:"
            git -C nethunter-reference rev-parse HEAD
            echo
            echo "Architecture:"
            echo "${ARCH}"
            echo
            echo "Cross compiler:"
            echo "${CROSS_COMPILE}"
            echo
            echo "LLVM:"
            echo "${LLVM_DIR}"
          } > artifacts/source-audit/source-manifest.txt

          cat artifacts/source-audit/source-manifest.txt

      # ============================================================
      # 15. SAVE STOCK CONFIGURATION HASH
      # ============================================================

      - name: Record stock configuration hash
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum \
            cebu-stock.config \
            > artifacts/source-audit/stock-config.sha256

          cat artifacts/source-audit/stock-config.sha256


      # ============================================================
      # 16. PREPARE KERNEL OUTPUT DIRECTORY
      # ============================================================

      - name: Prepare kernel output directory
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          echo "Kernel output directory:"
          echo "${OUT_DIR}"

      # ============================================================
      # 17. LOAD THE VERIFIED STOCK CEBU CONFIGURATION
      #
      # IMPORTANT:
      # We deliberately start from the real configuration extracted
      # from the running stock kernel.
      # ============================================================

      - name: Load stock cebu configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          cp \
            "${GITHUB_WORKSPACE}/cebu-stock.config" \
            "${OUT_DIR}/.config"

          test -s "${OUT_DIR}/.config"

          echo "Loaded stock cebu configuration."

          echo
          echo "Configuration:"
          wc -l "${OUT_DIR}/.config"

          sha256sum "${OUT_DIR}/.config"

      # ============================================================
      # 18. VERIFY CRITICAL STOCK HARDWARE CONFIGURATION
      # ============================================================

      



      - name: Verify critical stock build configuration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${OUT_DIR}/.config"

          test -s "${CONFIG}"

          echo "============================================================"
          echo " CRITICAL STOCK CONFIGURATION CHECK"
          echo "============================================================"

          REQUIRED=(
            "CONFIG_LTO=y"
            "CONFIG_THINLTO=y"
            "CONFIG_LTO_CLANG=y"
            "CONFIG_CFI=y"
            "CONFIG_CFI_CLANG=y"
            "CONFIG_CFI_CLANG_SHADOW=y"
            "CONFIG_SHADOW_CALL_STACK=y"
            "CONFIG_INIT_STACK_ALL_ZERO=y"
            "CONFIG_DEBUG_INFO=y"
            "CONFIG_MODVERSIONS=y"
            "CONFIG_HZ_300=y"
            "CONFIG_HZ=300"
            "CONFIG_INPUT_TOUCHSCREEN=y"
            "CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI_MMI=m"
            "CONFIG_INPUT_TOUCHSCREEN_FOCALTECH_0FLASH_MMI=m"
            "CONFIG_TOUCHSCREEN_CHIPONE_TDDI=m"
            "CONFIG_INPUT_MISC_FPC1020=m"
            "CONFIG_I2C_QCOM_GENI=y"
            "CONFIG_SPI_QCOM_GENI=y"
            "CONFIG_WLAN=y"
            "CONFIG_QCA_CLD_WLAN=m"
            "CONFIG_RMNET=y"
            "CONFIG_IPA3=y"
            "CONFIG_RMNET_IPA3=y"
            "CONFIG_USB_GADGET=y"
            "CONFIG_USB_CONFIGFS=y"
            "CONFIG_HIDRAW=y"
            "CONFIG_UHID=y"
          )

          for expected in "${REQUIRED[@]}"; do
            if ! grep -Fxq "${expected}" "${CONFIG}"; then
              echo
              echo "ERROR: Critical stock configuration mismatch:"
              echo "  ${expected}"
              echo
              echo "The final kernel configuration is NOT stock-compatible."
              exit 1
            fi

            echo "OK: ${expected}"
          done

          echo
          echo "============================================================"
          echo " CRITICAL STOCK CONFIGURATION PASSED"
          echo "============================================================"

      # ============================================================
      # 19. VERIFY STOCK COMPILER METADATA
      #
      # The real stock config records Clang/AS/LLD 21.
      # ============================================================

      - name: Verify stock compiler configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          echo "Stock compiler metadata:"

          grep -E \
            '^CONFIG_(CLANG_VERSION|AS_VERSION|LLD_VERSION)=' \
            "${CONFIG}"

          test \
            "$(sed -n 's/^CONFIG_CLANG_VERSION=//p' "${CONFIG}")" \
            = "210000"

          test \
            "$(sed -n 's/^CONFIG_AS_VERSION=//p' "${CONFIG}")" \
            = "210000"

          test \
            "$(sed -n 's/^CONFIG_LLD_VERSION=//p' "${CONFIG}")" \
            = "210000"

          echo
          echo "Stock compiler metadata verified."

      # ============================================================
      # 20. CREATE NETHUNTER CONFIGURATION FRAGMENT
      #
      # IMPORTANT:
      #
      # FEATURE_FRAME_INJECTION_SUPPORT
      # FEATURE_MONITOR_MODE_SUPPORT
      #
      # are NOT kernel .config symbols.
      #
      # They will be handled later through QCACLD3 Kbuild.
      # ============================================================

      - name: Create cebu NetHunter config fragment
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          mkdir -p nethunter-config

          cat > nethunter-config/cebu-nethunter.config <<'EOF'
          # ==========================================================
          # Moto G9 Power cebu NetHunter configuration
          #
          # This is a fragment merged into the verified stock config.
          #
          # DO NOT add:
          # CONFIG_FEATURE_FRAME_INJECTION_SUPPORT
          # CONFIG_FEATURE_MONITOR_MODE_SUPPORT
          #
          # Those are QCACLD3 Kbuild variables, not kernel config
          # symbols.
          # ==========================================================

          # ----------------------------------------------------------
          # HID
          # ----------------------------------------------------------

          CONFIG_HIDRAW=y
          CONFIG_UHID=y

          # ----------------------------------------------------------
          # Bluetooth
          # ----------------------------------------------------------

          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y

          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y

          CONFIG_BT_BNEP=m
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y

          CONFIG_BT_HIDP=m

          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y

          CONFIG_BT_HCIVHCI=m

          # ----------------------------------------------------------
          # USB gadget / ConfigFS
          #
          # Existing stock USB gadget functionality is preserved.
          # Additional NetHunter gadget functions are enabled here.
          # ----------------------------------------------------------

          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y

          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_NCM=y

          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_EEM=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y

          # ----------------------------------------------------------
          # USB serial / networking
          # ----------------------------------------------------------

          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_GENERIC=y

          CONFIG_USB_USBNET=m
          CONFIG_USB_NET_CDCETHER=m
          CONFIG_USB_NET_CDC_NCM=m

          # ----------------------------------------------------------
          # Packet sockets
          # ----------------------------------------------------------

          CONFIG_PACKET=y

          # ----------------------------------------------------------
          # Sensors
          # ----------------------------------------------------------

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m

          # ----------------------------------------------------------
          # Qualcomm WLAN
          #
          # Preserve the stock module arrangement.
          # ----------------------------------------------------------

          CONFIG_WLAN=y
          CONFIG_QCA_CLD_WLAN=m

          -----------------------------------------------------

          

          test -s nethunter-config/cebu-nethunter.config

          echo
          echo "NetHunter fragment:"
          cat nethunter-config/cebu-nethunter.config

      # ============================================================
      # 21. VERIFY FORBIDDEN FEATURE SYMBOLS ARE ABSENT
      # ============================================================

      - name: Verify injection feature symbols are not config symbols
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          FRAGMENT="nethunter-config/cebu-nethunter.config"

          if grep -Eq \
            '^CONFIG_(FEATURE_FRAME_INJECTION_SUPPORT|FEATURE_MONITOR_MODE_SUPPORT)(=| is not set)' \
            "${FRAGMENT}"; then

            echo "ERROR: QCACLD3 FEATURE_* variable was incorrectly added"
            echo "to the kernel configuration fragment."

            exit 1
          fi

          echo
          echo "QCACLD3 FEATURE_* variables correctly absent."

      # ============================================================
      # 22. MERGE NETHUNTER FRAGMENT
      # ============================================================

      - name: Merge NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG_BEFORE="${OUT_DIR}/stock-before-nethunter.config"

          cp \
            "${OUT_DIR}/.config" \
            "${CONFIG_BEFORE}"

          scripts/kconfig/merge_config.sh \
            -O "${OUT_DIR}" \
            "${CONFIG_BEFORE}" \
            nethunter-config/cebu-nethunter.config

          test -s "${OUT_DIR}/.config"

          echo
          echo "NetHunter fragment merged."

      # ============================================================
      # 23. RESOLVE KCONFIG DEPENDENCIES
      #
      # olddefconfig is allowed here because we will audit every
      # resulting difference later.
      # ============================================================

      - name: Resolve Kconfig dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig

          test -s "${OUT_DIR}/.config"

          echo
          echo "Kconfig dependency resolution completed."



      - name: Set kernel release to stock-compatible release
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${OUT_DIR}/.config"

          test -s "${CONFIG}"

          echo "=== Set stock-compatible kernel release ==="

          scripts/config \
            --file "${CONFIG}" \
            --disable LOCALVERSION_AUTO \
            --set-str LOCALVERSION "-perf"

          echo
          echo "=== Final local-version settings ==="

          grep -E '^CONFIG_LOCALVERSION=' "${CONFIG}"
          grep -E '^# CONFIG_LOCALVERSION_AUTO is not set$' "${CONFIG}"

          test "$(scripts/config --file "${CONFIG}" --state LOCALVERSION)" = '-perf-g39bcecd5c63d'
          test "$(scripts/config --file "${CONFIG}" --state LOCALVERSION_AUTO)" = 'n'

          echo
          echo "=== Verify expected kernel release ==="

          RELEASE="$(make -s \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            LOCALVERSION="-g39bcecd5c63d" \
            kernelrelease)"

          echo "KERNEL_RELEASE=${RELEASE}"

          test "${RELEASE}" = "4.19.325-cip135-st19-perf-g39bcecd5c63d"

          echo
          echo "Stock-compatible kernel release confirmed."



            



      - name: Full stock-vs-final configuration audit
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${OUT_DIR}/.config"
          STOCK="../cebu-stock.config"
          FRAGMENT="nethunter-config/cebu-nethunter.config"

          test -s "${CONFIG}"
          test -s "${STOCK}"
          test -s "${FRAGMENT}"

          echo "============================================================"
          echo " FULL STOCK VS FINAL CONFIGURATION AUDIT"
          echo "============================================================"

          TMP_DIR="${GITHUB_WORKSPACE}/config-audit"
          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"

          STOCK_NORM="${TMP_DIR}/stock.normalized"
          FINAL_NORM="${TMP_DIR}/final.normalized"
          ALLOWED="${TMP_DIR}/allowed.symbols"
          DIFFERENCES="${TMP_DIR}/unexpected-differences"

          echo
          echo "=== Normalize stock configuration ==="

          awk '
            /^# CONFIG_[A-Za-z0-9_]+ is not set$/ {
              line=$0
              sub(/^# /, "", line)
              sub(/ is not set$/, "", line)
              print line "=n"
              next
            }

            /^CONFIG_[A-Za-z0-9_]+=/ {
              pos=index($0, "=")
              print substr($0, 1, pos-1) "=" substr($0, pos+1)
            }
          ' "${STOCK}" | sort -u > "${STOCK_NORM}"

          echo
          echo "=== Normalize final configuration ==="

          awk '
            /^# CONFIG_[A-Za-z0-9_]+ is not set$/ {
              line=$0
              sub(/^# /, "", line)
              sub(/ is not set$/, "", line)
              print line "=n"
              next
            }

            /^CONFIG_[A-Za-z0-9_]+=/ {
              pos=index($0, "=")
              print substr($0, 1, pos-1) "=" substr($0, pos+1)
            }
          ' "${CONFIG}" | sort -u > "${FINAL_NORM}"

          echo
          echo "=== Build explicit NetHunter change allowlist ==="

          ALLOWED_CHANGES="${TMP_DIR}/allowed.changes"

          cat > "${ALLOWED_CHANGES}" <<'EOF'
             CONFIG_HIDRAW=y
             CONFIG_UHID=y
             CONFIG_BT=y
            CONFIG_BT_BREDR=y
             CONFIG_BT_LE=y
             CONFIG_BT_RFCOMM=y
            CONFIG_BT_RFCOMM_TTY=y
             CONFIG_BT_BNEP=m
             CONFIG_BT_BNEP_PROTO_FILTER=y
             CONFIG_BT_BNEP_MULTICAST_FILTER=y
             CONFIG_BT_HIDP=m
            CONFIG_BT_HCIUART=m
            CONFIG_BT_HCIUART_H4=y
             CONFIG_BT_HCIVHCI=m
             CONFIG_USB_GADGET=y
            CONFIG_USB_CONFIGFS=y
             CONFIG_USB_CONFIGFS_UEVENT=y
             CONFIG_USB_CONFIGFS_ACM=y
              CONFIG_USB_CONFIGFS_NCM=y
            CONFIG_USB_CONFIGFS_RNDIS=y
            CONFIG_USB_CONFIGFS_ECM=y
           CONFIG_USB_CONFIGFS_EEM=y
            CONFIG_USB_CONFIGFS_F_HID=y
            CONFIG_USB_CONFIGFS_F_FS=y
            CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y
             CONFIG_USB_SERIAL=y
             CONFIG_USB_SERIAL_GENERIC=y
             CONFIG_USB_USBNET=m
             CONFIG_USB_NET_CDCETHER=m
             CONFIG_USB_NET_CDC_NCM=m
             CONFIG_PACKET=y
             CONFIG_SENSORS_SSC=y
              CONFIG_SENSORS_CLASS=m
              CONFIG_WLAN=y
               CONFIG_QCA_CLD_WLAN=m
                CONFIG_LOCALVERSION=-perf-g39bcecd5c63d
               CONFIG_LOCALVERSION_AUTO=n
             EOF

          sort -u "${ALLOWED_CHANGES}" -o "${ALLOWED_CHANGES}"

          echo
          echo "=== Explicitly allowed configuration changes ==="
          cat "${ALLOWED_CHANGES}"

          echo
          echo "=== Compare every stock CONFIG symbol ==="

          awk -F= '
            NR==FNR {
              stock[$1]=$0
              next
            }

            {
              final[$1]=$0
            }

            END {
              for (symbol in stock) {
                if (!(symbol in final)) {
                  print "REMOVED|" symbol "|" stock[symbol] "|<missing>"
                }
                else if (stock[symbol] != final[symbol]) {
                  print "CHANGED|" symbol "|" stock[symbol] "|" final[symbol]
                }
              }

              for (symbol in final) {
                if (!(symbol in stock)) {
                  print "ADDED|" symbol "|<absent-from-stock>|" final[symbol]
                }
              }
            }
          ' "${STOCK_NORM}" "${FINAL_NORM}" > "${TMP_DIR}/all-differences"

          : > "${DIFFERENCES}"

          while IFS='|' read -r TYPE SYMBOL STOCK_VALUE FINAL_VALUE; do
            [ -n "${SYMBOL}" ] || continue

              if [ "${TYPE}" = "ADDED" ]; then
           EXPECTED=""

            awk -F'|' \
             -v allowed="${ALLOWED_CHANGES}" \
             -v differences="${DIFFERENCES}" '
           BEGIN {
           while ((getline line < allowed) > 0) {
           split(line, parts, "=")
           allowed_value[parts[1]] = substr(line, length(parts[1]) + 2)
            }
           close(allowed)
            }
           {
            type   = $1
            symbol = $2
            stock  = $3
             final  = $4

             if (symbol in allowed_value && final == allowed_value[symbol]) {
           print "ALLOWED: " symbol ": " stock " -> " final
           } else {
            print type "|" symbol "|" stock "|" final >> differences
           }
           }
              '. "${TMP_DIR}/all-differences"
          echo
          echo "============================================================"
          echo " UNEXPECTED STOCK CONFIGURATION DIFFERENCES"
          echo "============================================================"

          if [ -s "${DIFFERENCES}" ]; then
            cat "${DIFFERENCES}"
            echo
            echo "ERROR: Unexpected configuration differences detected."
            echo "The final configuration is NOT an acceptable stock cebu baseline."
            exit 1
          fi

          echo "No unexpected stock configuration differences detected."

          echo
          echo "============================================================"
          echo " STOCK CONFIGURATION PRESERVATION PASSED"
          echo "============================================================"

          echo
          echo "Stock symbols:"
          wc -l < "${STOCK_NORM}"

          echo "Final symbols:"
          wc -l < "${FINAL_NORM}"

          echo
          echo "The final configuration contains the complete stock"
          echo "configuration plus only explicitly allowed NetHunter"
          echo "and deliberate kernel-release changes."


      # ============================================================
