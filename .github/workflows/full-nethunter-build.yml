      - name: Restore native policy-manager VDEV callbacks
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          PM="drivers/staging/qcacld-3.0/components/cmn_services/policy_mgr/src/wlan_policy_mgr_init_deinit.c"
          CLEAN="${GITHUB_WORKSPACE}/clean-policy-manager.c"

          test -f "$PM"

          echo "============================================================"
          echo " RESTORE NATIVE POLICY-MANAGER VDEV CALLBACKS"
          echo "============================================================"

          echo
          echo "=== EXTRACT EXACT PINNED-SOURCE VERSION ==="

          git show "HEAD:${PM}" > "$CLEAN"

          test -s "$CLEAN"

          echo "Pinned source:"
          git rev-parse HEAD
          echo "Clean source extracted successfully."

          echo
          echo "=== EXTRACT CLEAN CALLBACKS WITH AWK ==="

          rm -f \
            "${GITHUB_WORKSPACE}/vdev-create.clean" \
            "${GITHUB_WORKSPACE}/vdev-destroy.clean" \
            "${GITHUB_WORKSPACE}/vdev-status.clean"

          awk '
          function begin(name) {
            active=1
            opened=0
            depth=0
            target=name
            buffer=""
          }

          /^[[:space:]]*static[[:space:]]+.*policy_mgr_vdev_obj_create_cb[[:space:]]*\(/ {
            begin("create")
          }

          /^[[:space:]]*static[[:space:]]+.*policy_mgr_vdev_obj_destroy_cb[[:space:]]*\(/ {
            begin("destroy")
          }

          /^[[:space:]]*static[[:space:]]+.*policy_mgr_vdev_obj_status_cb[[:space:]]*\(/ {
            begin("status")
          }

          active {
            buffer = buffer $0 "\n"

            x=$0
            opens=gsub(/\{/, "{", x)
            closes=gsub(/\}/, "}", x)

            if (opens)
              opened=1

            if (opened)
              depth += opens - closes

            if (opened && depth <= 0) {
              file="../vdev-" target ".clean"
              printf "%s", buffer > file
              close(file)
              active=0
              buffer=""
              target=""
              opened=0
              depth=0
            }

            next
          }
          ' "$CLEAN"

          for f in \
            "${GITHUB_WORKSPACE}/vdev-create.clean" \
            "${GITHUB_WORKSPACE}/vdev-destroy.clean" \
            "${GITHUB_WORKSPACE}/vdev-status.clean"
          do
            test -s "$f"
          done

          echo "PASS: all three callbacks extracted from pinned source."

          echo
          echo "=== CLEAN CALLBACKS ==="

          cat "${GITHUB_WORKSPACE}/vdev-create.clean"
          echo
          cat "${GITHUB_WORKSPACE}/vdev-destroy.clean"
          echo
          cat "${GITHUB_WORKSPACE}/vdev-status.clean"

          echo
          echo "=== RESTORE CALLBACKS WITH AWK ==="

          awk \
            -v create_file="${GITHUB_WORKSPACE}/vdev-create.clean" \
            -v destroy_file="${GITHUB_WORKSPACE}/vdev-destroy.clean" \
            -v status_file="${GITHUB_WORKSPACE}/vdev-status.clean" '
          function emit(file, line) {
            while ((getline line < file) > 0)
              print line
            close(file)
          }

          function skip_start() {
            active=1
            opened=0
            depth=0
          }

          /^[[:space:]]*static[[:space:]]+.*policy_mgr_vdev_obj_create_cb[[:space:]]*\(/ {
            emit(create_file)
            skip_start()
            next
          }

          /^[[:space:]]*static[[:space:]]+.*policy_mgr_vdev_obj_destroy_cb[[:space:]]*\(/ {
            emit(destroy_file)
            skip_start()
            next
          }

          /^[[:space:]]*static[[:space:]]+.*policy_mgr_vdev_obj_status_cb[[:space:]]*\(/ {
            emit(status_file)
            skip_start()
            next
          }

          active {
            x=$0
            opens=gsub(/\{/, "{", x)
            closes=gsub(/\}/, "}", x)

            if (opens)
              opened=1

            if (opened)
              depth += opens - closes

            if (opened && depth <= 0)
              active=0

            next
          }

          {
            print
          }
          ' "$PM" > "${PM}.tmp"

          mv "${PM}.tmp" "$PM"

          echo
          echo "=== VERIFY FINAL CALLBACKS ==="

          grep -n -A35 \
            '^[[:space:]]*static[[:space:]]\+.*policy_mgr_vdev_obj_create_cb' \
            "$PM"

          echo
          grep -n -A35 \
            '^[[:space:]]*static[[:space:]]\+.*policy_mgr_vdev_obj_destroy_cb' \
            "$PM"

          echo
          grep -n -A35 \
            '^[[:space:]]*static[[:space:]]\+.*policy_mgr_vdev_obj_status_cb' \
            "$PM"

          echo
          echo "=== CALLBACK COUNT CHECK ==="

          test "$(grep -Ec \
            '^[[:space:]]*static[[:space:]]+.*policy_mgr_vdev_obj_create_cb[[:space:]]*\(' \
            "$PM")" -eq 1

          test "$(grep -Ec \
            '^[[:space:]]*static[[:space:]]+.*policy_mgr_vdev_obj_destroy_cb[[:space:]]*\(' \
            "$PM")" -eq 1

          test "$(grep -Ec \
            '^[[:space:]]*static[[:space:]]+.*policy_mgr_vdev_obj_status_cb[[:space:]]*\(' \
            "$PM")" -eq 1

          rm -f \
            "$CLEAN" \
            "${GITHUB_WORKSPACE}/vdev-create.clean" \
            "${GITHUB_WORKSPACE}/vdev-destroy.clean" \
            "${GITHUB_WORKSPACE}/vdev-status.clean"

          echo
          echo "PASS: native policy-manager VDEV callbacks restored from pinned source."






