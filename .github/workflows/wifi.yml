          'QDF_MONITOR_MODE|wlan_mon_drv_ops|hdd_mon_open|device_mode[[:space:]]*=[[:space:]]*QDF_MONITOR_MODE|NL80211_IFTYPE_MONITOR' \
          "$HDD_MAIN" "$HDD_CFG" || true

