              echo "ERROR: WMA_INC is not included in QCACLD3 include paths."
              exit 1
            }

          # ----------------------------------------------------------
          # Feature variables.
          # ----------------------------------------------------------

          grep -Fq \
            'CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y' \
            "${K}"

          grep -Fq \
            'CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y' \
            "${K}"

          # ----------------------------------------------------------
          # HDD objects.
          # ----------------------------------------------------------

          grep -Fq \
            'wlan_hdd_frame_inject.o' \
            "${K}"

          grep -Fq \
            'wlan_hdd_frame_validate.o' \
            "${K}"

          grep -Fq \
            'wlan_hdd_inject_security.o' \
            "${K}"

          grep -Fq \
            'wlan_hdd_frame_inject_debug.o' \
            "${K}"

          # ----------------------------------------------------------
          # WMA object.
          # ----------------------------------------------------------

          grep -Fq \
            'wma_frame_inject.o' \
            "${K}"

          # ----------------------------------------------------------
          # Preprocessor definitions.
          # ----------------------------------------------------------

          grep -Fq \
            'cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT' \
            "${K}"

          grep -Fq \
            'cppflags-y += -DFEATURE_MONITOR_MODE_SUPPORT' \
            "${K}"

          echo "QCACLD3 Kbuild verification passed."

      # ============================================================
      # 19. VERIFY SOURCE ADAPTATION
      # ============================================================

      - name: Verify source adaptation
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0"

          # ----------------------------------------------------------
          # Source files.
          # ----------------------------------------------------------

          test -f \
            "${K}/core/hdd/src/wlan_hdd_frame_inject.c"

          test -f \
            "${K}/core/hdd/src/wlan_hdd_frame_validate.c"

          test -f \
            "${K}/core/hdd/src/wlan_hdd_inject_security.c"

          test -f \
            "${K}/core/hdd/src/wlan_hdd_frame_inject_debug.c"

          test -f \
            "${K}/core/wma/src/wma_frame_inject.c"

          # ----------------------------------------------------------
          # Header files.
          # ----------------------------------------------------------

          test -f \
            "${K}/core/hdd/inc/wlan_hdd_frame_inject.h"

          test -f \
            "${K}/core/hdd/inc/wlan_hdd_frame_validate.h"

          test -f \
            "${K}/core/hdd/inc/wlan_hdd_inject_security.h"

          test -f \
            "${K}/core/hdd/inc/wlan_hdd_frame_inject_debug.h"

          test -f \
