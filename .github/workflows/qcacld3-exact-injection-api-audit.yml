name: QCACLD3 Exact Injection API Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git ripgrep python3

      - name: Clone Motorola QCACLD3
        run: |
          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qcacld-3.0.git \
            motorola

      - name: Clone OnePlus reference
        run: |
          git clone --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            oneplus

      - name: Clone Xiaomi reference
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/yesimxev/android_kernel_xiaomi_sm6125.git \
            xiaomi

      - name: Prepare report
        run: |
          mkdir -p report/reference
          mkdir -p report/motorola
          mkdir -p report/comparison

      - name: Copy reference injection files
        run: |
          cp oneplus/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c \
            report/reference/oneplus-wma_frame_inject.c

          cp oneplus/drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h \
            report/reference/oneplus-wma_frame_inject.h

          cp xiaomi/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c \
            report/reference/xiaomi-wma_frame_inject.c

          cp xiaomi/drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h \
            report/reference/xiaomi-wma_frame_inject.h

      - name: Extract reference injection calls
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("report/reference/oneplus-wma_frame_inject.c"),
              Path("report/reference/xiaomi-wma_frame_inject.c")
          ]

          all_calls = {}

          ignore = {
              "if",
              "for",
              "while",
              "switch",
              "sizeof",
              "return",
              "do"
          }

          for path in files:
              source = path.read_text(errors="ignore")

              calls = re.findall(
                  r"\b([A-Za-z_][A-Za-z0-9_]*)\s*\(",
                  source
              )

              calls = sorted(
                  set(x for x in calls if x not in ignore)
              )

              all_calls[path.name] = calls

              output = path.stem + "-calls.txt"

              Path(
                  "report/comparison/" + output
              ).write_text(
                  "\n".join(calls) + "\n"
              )

          oneplus = set(all_calls[files[0].name])
          xiaomi = set(all_calls[files[1].name])

          common = sorted(oneplus & xiaomi)
          oneplus_only = sorted(oneplus - xiaomi)
          xiaomi_only = sorted(xiaomi - oneplus)

          lines = []

          lines.append("COMMON REFERENCE INJECTION CALLS")
          lines.append("================================")
          lines.extend(common)

          lines.append("")
          lines.append("ONEPLUS ONLY")
          lines.append("============")
          lines.extend(oneplus_only)

          lines.append("")
          lines.append("XIAOMI ONLY")
          lines.append("===========")
          lines.extend(xiaomi_only)

          Path(
              "report/comparison/reference-call-set.txt"
          ).write_text(
              "\n".join(lines) + "\n"
          )
          PY

      - name: Compare reference calls against Motorola
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          source = Path(
              "report/comparison/reference-call-set.txt"
          ).read_text(errors="ignore")

          common_section = source.split(
              "ONEPLUS ONLY",
              1
          )[0]

          symbols = []

          for line in common_section.splitlines():
              line = line.strip()

              if not line:
                  continue

              if line.startswith("COMMON"):
                  continue

              if line.startswith("="):
                  continue

              if re.match(
                  r"^[A-Za-z_][A-Za-z0-9_]*$",
                  line
              ):
                  symbols.append(line)

          results = []

          for symbol in symbols:
              result = subprocess.run(
                  [
                      "rg",
                      "-n",
                      "--fixed-strings",
                      symbol,
                      "motorola"
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode == 0:
                  results.append(
                      "[PRESENT] " + symbol
                  )

                  for line in result.stdout.splitlines()[:8]:
                      results.append("  " + line)

              else:
                  results.append(
                      "[MISSING] " + symbol
                  )

          Path(
              "report/comparison/motorola-call-compatibility.txt"
          ).write_text(
              "\n".join(results) + "\n"
          )

          print(
              "Reference calls checked:",
              len(symbols)
          )
          PY

      - name: Extract exact WMI and WMA identifiers
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          files = [
              Path("report/reference/oneplus-wma_frame_inject.c"),
              Path("report/reference/xiaomi-wma_frame_inject.c")
          ]

          identifiers = set()

          for path in files:
              source = path.read_text(errors="ignore")

              found = re.findall(
                  r"\b(?:WMI|wmi|WMA|wma)_[A-Za-z0-9_]+\b",
                  source
              )

              identifiers.update(found)

          results = []

          for symbol in sorted(identifiers):
              result = subprocess.run(
                  [
                      "rg",
                      "-n",
                      "--fixed-strings",
                      symbol,
                      "motorola"
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode == 0:
                  results.append(
                      "[PRESENT] " + symbol
                  )

                  for line in result.stdout.splitlines()[:8]:
                      results.append("  " + line)

              else:
                  results.append(
                      "[MISSING] " + symbol
                  )

          Path(
              "report/comparison/exact-wmi-identifiers.txt"
          ).write_text(
              "\n".join(results) + "\n"
          )

          print(
              "WMI/WMA identifiers checked:",
              len(identifiers)
          )
          PY

      - name: Extract reference WMI TX context
        run: |
          {
            echo "===== ONEPLUS WMA FRAME INJECTION ====="
            rg -n -C 8 \
              "wmi_|WMI_|wma_|WMA_|tx_|TX_|mgmt_|MGMT_|vdev_|VDEV_" \
              report/reference/oneplus-wma_frame_inject.c \
              || true

            echo
            echo "===== XIAOMI WMA FRAME INJECTION ====="
            rg -n -C 8 \
              "wmi_|WMI_|wma_|WMA_|tx_|TX_|mgmt_|MGMT_|vdev_|VDEV_" \
              report/reference/xiaomi-wma_frame_inject.c \
              || true

          } > report/reference/reference-wmi-tx-context.txt

      - name: Extract Motorola management TX implementation
        run: |
          {
            echo "===== wlan_hdd_mgmt_tx ====="
            rg -n -C 60 \
              "wlan_hdd_mgmt_tx|__wlan_hdd_mgmt_tx" \
              motorola \
              || true

            echo
            echo "===== WMA MANAGEMENT TX ====="
            rg -n -C 60 \
              "wma_mgmt_tx" \
              motorola \
              || true

            echo
            echo "===== WMI MANAGEMENT TX ====="
            rg -n -C 60 \
              "wmi_mgmt_unified_cmd_send" \
              motorola \
              || true

          } > report/motorola/mgmt-tx-context.txt

      - name: Extract Motorola WMI definitions
        run: |
          {
            echo "===== MGMT TX DEFINITIONS ====="

            rg -n -C 12 \
              "MGMT_TX|MGMT.*TX|mgmt_tx" \
              motorola \
              || true

            echo
            echo "===== TX COMPLETION DEFINITIONS ====="

            rg -n -C 12 \
              "TX.*COMP|COMP.*TX|completion.*tx|tx.*completion" \
              motorola \
              || true

            echo
            echo "===== VDEV DEFINITIONS ====="

            rg -n -C 8 \
              "WMI_VDEV_TYPE_MONITOR|vdev_create|vdev_start|vdev_stop|vdev_delete" \
              motorola \
              || true

          } > report/motorola/wmi-definitions-context.txt

      - name: Compare management TX structures
        run: |
          {
            echo "===== ONEPLUS STRUCTURES ====="

            rg -n -C 12 \
              "struct .*mgmt.*tx|struct .*tx.*mgmt|mgmt_tx.*param|tx.*mgmt.*param" \
              oneplus/drivers/staging/qcacld-3.0 \
              || true

            echo
            echo "===== XIAOMI STRUCTURES ====="

            rg -n -C 12 \
              "struct .*mgmt.*tx|struct .*tx.*mgmt|mgmt_tx.*param|tx.*mgmt.*param" \
              xiaomi/drivers/staging/qcacld-3.0 \
              || true

            echo
            echo "===== MOTOROLA STRUCTURES ====="

            rg -n -C 12 \
              "struct .*mgmt.*tx|struct .*tx.*mgmt|mgmt_tx.*param|tx.*mgmt.*param" \
              motorola \
              || true

          } > report/comparison/management-tx-structures.txt

      - name: Compare reference injection source
        run: |
          diff -u \
            report/reference/oneplus-wma_frame_inject.c \
            report/reference/xiaomi-wma_frame_inject.c \
            > report/comparison/oneplus-vs-xiaomi.diff \
            || true

      - name: Generate decision report
        run: |
          python3 - <<'PY'
          from pathlib import Path

          calls = Path(
              "report/comparison/motorola-call-compatibility.txt"
          ).read_text(errors="ignore")

          wmi = Path(
              "report/comparison/exact-wmi-identifiers.txt"
          ).read_text(errors="ignore")

          present_calls = calls.count("[PRESENT]")
          missing_calls = calls.count("[MISSING]")

          present_wmi = wmi.count("[PRESENT]")
          missing_wmi = wmi.count("[MISSING]")

          lines = [
              "QCACLD3 EXACT INJECTION API AUDIT",
              "=================================",
              "",
              "Reference injection calls checked: "
              + str(present_calls + missing_calls),
              "Present in Motorola: "
              + str(present_calls),
              "Missing from Motorola: "
              + str(missing_calls),
              "",
              "Reference WMI/WMA identifiers checked: "
              + str(present_wmi + missing_wmi),
              "Present in Motorola: "
              + str(present_wmi),
              "Missing from Motorola: "
              + str(missing_wmi),
              "",
              "This workflow performs source/API analysis only.",
              "",
              "It does not modify the Motorola kernel.",
              "It does not modify firmware.",
              "It does not flash the phone.",
              "",
              "A matching kernel API does not prove that the",
              "Moto G9 Power firmware supports actual frame injection.",
              "",
              "The source-port decision must therefore consider:",
              "1. WMI command compatibility.",
              "2. TX structure compatibility.",
              "3. Completion-event compatibility.",
              "4. Monitor-vdev handling.",
              "5. Firmware support."
          ]

          Path(
              "report/DECISION.txt"
          ).write_text(
              "\n".join(lines) + "\n"
          )
          PY

      - name: Show audit summary
        if: always()
        run: |
          echo "===== DECISION ====="
          cat report/DECISION.txt || true

          echo
          echo "===== EXACT WMI IDENTIFIERS ====="
          cat report/comparison/exact-wmi-identifiers.txt || true

          echo
          echo "===== MOTOROLA CALL COMPATIBILITY ====="
          cat report/comparison/motorola-call-compatibility.txt || true

      - name: Package report
        if: always()
        run: |
          zip -r qcacld3-exact-injection-api-audit.zip report

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-exact-injection-api-audit
          path: qcacld3-exact-injection-api-audit.zip
          if-no-files-found: error
