name: QCACLD3 Fast History Investigation

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ripgrep jq

      - name: Clone Motorola QCACLD3 history
        run: |
          git clone \
            --filter=blob:none \
            --no-single-branch \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qcacld-3.0.git \
            motorola-qcacld3

          cd motorola-qcacld3

          echo "=== CURRENT COMMIT ==="
          git rev-parse HEAD

          echo "=== REMOTES ==="
          git remote -v

          echo "=== FETCHING COMMIT HISTORY ==="
          git fetch origin --prune --tags

          echo "=== REPOSITORY STATUS ==="
          git rev-parse --is-shallow-repository
          git rev-list --all --count

      - name: Find relevant Motorola commits by subject
        run: |
          cd motorola-qcacld3

          {
            echo "======================================"
            echo "MOTOROLA COMMIT SUBJECT SEARCH"
            echo "======================================"

            git log --all \
              --date=short \
              --format='%H|%ad|%s' \
              --regexp-ignore-case \
              --grep='injection' \
              --grep='packet capture' \
              --grep='pkt capture' \
              --grep='radiotap' \
              --grep='monitor mode' \
              --grep='monitor tx' \
              --grep='monitor-mode' \
              --grep='frame tx' \
              --grep='frame injection' \
              | head -300

          } | tee ../candidate-commits.txt

      - name: Find historical paths without scanning file contents
        run: |
          cd motorola-qcacld3

          {
            echo "======================================"
            echo "HISTORICAL RELEVANT PATHS"
            echo "======================================"

            git log --all \
              --name-only \
              --format= \
              -- \
              '*pkt_capture*' \
              '*radiotap*' \
              '*frame_inject*' \
              '*frame_validate*' \
              '*injection*' \
              '*monitor*' \
              | sed '/^$/d' \
              | sort -u

          } | tee ../historical-relevant-paths.txt

      - name: Identify commits touching relevant paths
        run: |
          cd motorola-qcacld3

          {
            echo "======================================"
            echo "COMMITS TOUCHING PKT_CAPTURE"
            echo "======================================"

            git log --all \
              --date=short \
              --format='%H|%ad|%s' \
              -- \
              '*pkt_capture*' \
              | head -200

            echo
            echo "======================================"
            echo "COMMITS TOUCHING RADIOTAP"
            echo "======================================"

            git log --all \
              --date=short \
              --format='%H|%ad|%s' \
              -- \
              '*radiotap*' \
              | head -200

            echo
            echo "======================================"
            echo "COMMITS TOUCHING INJECTION"
            echo "======================================"

            git log --all \
              --date=short \
              --format='%H|%ad|%s' \
              -- \
              '*inject*' \
              | head -300

            echo
            echo "======================================"
            echo "COMMITS TOUCHING MONITOR"
            echo "======================================"

            git log --all \
              --date=short \
              --format='%H|%ad|%s' \
              -- \
              '*monitor*' \
              | head -300

          } | tee ../relevant-path-commits.txt

      - name: Search for Qualcomm 2.0 and R60/R61 references
        run: |
          cd motorola-qcacld3

          {
            echo "======================================"
            echo "2.0 / R60 / R61 COMMIT SEARCH"
            echo "======================================"

            git log --all \
              --date=short \
              --format='%H|%ad|%s' \
              --regexp-ignore-case \
              --grep='wlan-cld3.driver.lnx.2.0' \
              --grep='r60' \
              --grep='r61' \
              --grep='cld3.*2.0' \
              | head -300

            echo
            echo "======================================"
            echo "TAGS"
            echo "======================================"

            git tag -l \
              | grep -Ei \
              'wlan|qcacld|cld3|r60|r61|2\.0' \
              | sort -V \
              || true

          } | tee ../qualcomm-version-search.txt

      - name: Build candidate commit list
        run: |
          python3 - <<'PY'
          import re

          files = [
              "candidate-commits.txt",
              "relevant-path-commits.txt",
              "qualcomm-version-search.txt",
          ]

          commits = {}

          for filename in files:
              try:
                  with open(filename, errors="ignore") as f:
                      for line in f:
                          m = re.match(r"^([0-9a-f]{40})\|", line.strip())
                          if m:
                              commits[m.group(1)] = line.strip()
              except FileNotFoundError:
                  pass

          with open("candidate-list.txt", "w") as out:
              for commit, line in sorted(commits.items()):
                  out.write(line + "\n")

          print("Candidate commits:", len(commits))
          PY

          echo "=== CANDIDATES ==="
          cat candidate-list.txt || true

      - name: Inspect candidate commits
        run: |
          cd motorola-qcacld3

          mkdir -p ../candidate-inspection

          COUNT=0

          while IFS='|' read -r COMMIT DATE SUBJECT; do
            [ -z "$COMMIT" ] && continue

            COUNT=$((COUNT + 1))

            if [ "$COUNT" -gt 40 ]; then
              break
            fi

            SHORT="${COMMIT:0:12}"

            echo "Inspecting $SHORT $SUBJECT"

            {
              echo "======================================"
              echo "COMMIT"
              echo "$COMMIT"
              echo "DATE"
              echo "$DATE"
              echo "SUBJECT"
              echo "$SUBJECT"
              echo "======================================"
              echo
              echo "STAT:"
              git show \
                --stat \
                --oneline \
                --no-renames \
                "$COMMIT"

              echo
              echo "CHANGED PATHS:"
              git diff-tree \
                --no-commit-id \
                --name-status \
                -r \
                "$COMMIT"

              echo
              echo "RELEVANT FILES:"
              git diff-tree \
                --no-commit-id \
                --name-only \
                -r \
                "$COMMIT" \
                | grep -Ei \
                  'pkt_capture|radiotap|monitor|inject|validate|wlan_hdd|wma_' \
                || true

            } > "../candidate-inspection/${SHORT}.txt"

          done < ../candidate-list.txt

      - name: Inspect current Motorola source for injection infrastructure
        run: |
          cd motorola-qcacld3

          {
            echo "======================================"
            echo "CURRENT MOTOROLA TREE"
            echo "======================================"

            echo
            echo "PKT_CAPTURE:"
            git ls-tree -r --name-only HEAD \
              | grep -Ei 'pkt_capture' \
              || true

            echo
            echo "RADIOTAP:"
            git ls-tree -r --name-only HEAD \
              | grep -Ei 'radiotap' \
              || true

            echo
            echo "FRAME INJECTION:"
            git ls-tree -r --name-only HEAD \
              | grep -Ei 'frame_inject|frame_validate|injection' \
              || true

            echo
            echo "MONITOR:"
            git ls-tree -r --name-only HEAD \
              | grep -Ei 'monitor' \
              | head -200 \
              || true

            echo
            echo "KEY SYMBOLS:"
            git grep -n \
              -E \
              'wlan_hdd_frame_inject|wlan_hdd_frame_validate|wma_frame_inject|FRAME_INJECTION_SUPPORT|pkt_capture|radiotap' \
              HEAD \
              -- '*.c' '*.h' 'Kconfig' 'Kbuild' \
              || true

          } | tee ../current-source-report.txt

      - name: Try Qualcomm R60 reference
        continue-on-error: true
        run: |
          mkdir -p qualcomm-r60

          echo "Attempting Qualcomm R60 source..."

          git clone \
            --depth 1 \
            --filter=blob:none \
            --branch wlan-cld3.driver.lnx.2.0.r60-rel \
            https://git.codelinaro.org/clo/la/platform/vendor/qcom-opensource/wlan/qcacld-3.0.git \
            qualcomm-r60

          cd qualcomm-r60

          echo "R60 COMMIT:"
          git rev-parse HEAD | tee ../qualcomm-r60-commit.txt

          echo
          echo "R60 RELEVANT FILES:"

          git ls-tree -r --name-only HEAD \
            | grep -Ei \
              'pkt_capture|radiotap|monitor|inject|validate' \
            | tee ../qualcomm-r60-files.txt

      - name: Compare R60 structure
        run: |
          if [ ! -d qualcomm-r60/.git ]; then
            echo "R60 source was not available."
            exit 0
          fi

          cd motorola-qcacld3

          git ls-tree -r --name-only HEAD \
            | sort > ../motorola-files.txt

          cd ../qualcomm-r60

          git ls-tree -r --name-only HEAD \
            | sort > ../r60-files.txt

          cd ..

          mkdir -p comparison

          comm -13 \
            motorola-files.txt \
            r60-files.txt \
            > comparison/r60-files-not-in-motorola.txt

          comm -12 \
            motorola-files.txt \
            r60-files.txt \
            > comparison/common-files.txt

          echo "=== R60 FILES ABSENT FROM MOTOROLA ==="
          cat comparison/r60-files-not-in-motorola.txt

      - name: Generate final report
        run: |
          {
            echo "================================================"
            echo "CEBU QCACLD3 FAST HISTORY INVESTIGATION"
            echo "================================================"
            echo
            echo "Repository:"
            echo "MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qcacld-3.0"
            echo
            echo "================================================"
            echo "CANDIDATE COMMITS"
            echo "================================================"
            cat candidate-list.txt || true
            echo
            echo "================================================"
            echo "QUALCOMM VERSION SEARCH"
            echo "================================================"
            cat qualcomm-version-search.txt || true
            echo
            echo "================================================"
            echo "CURRENT SOURCE"
            echo "================================================"
            cat current-source-report.txt || true
            echo
            echo "================================================"
            echo "R60 COMMIT"
            echo "================================================"
            cat qualcomm-r60-commit.txt || true
            echo
            echo "================================================"
            echo "R60 RELEVANT FILES"
            echo "================================================"
            cat qualcomm-r60-files.txt || true
            echo
            echo "================================================"
            echo "R60 FILES NOT IN MOTOROLA"
            echo "================================================"
            cat comparison/r60-files-not-in-motorola.txt || true
            echo
            echo "================================================"
            echo "HISTORICAL PATHS"
            echo "================================================"
            cat historical-relevant-paths.txt || true

          } | tee final-report.txt

      - name: Package results
        run: |
          mkdir -p investigation-results

          cp \
            candidate-commits.txt \
            candidate-list.txt \
            historical-relevant-paths.txt \
            relevant-path-commits.txt \
            qualcomm-version-search.txt \
            current-source-report.txt \
            final-report.txt \
            investigation-results/ 2>/dev/null || true

          cp \
            qualcomm-r60-commit.txt \
            qualcomm-r60-files.txt \
            investigation-results/ 2>/dev/null || true

          cp \
            comparison/*.txt \
            investigation-results/ 2>/dev/null || true

          cp -r \
            candidate-inspection \
            investigation-results/ 2>/dev/null || true

          echo "=== RESULTS ==="
          find investigation-results -type f | sort

      - name: Upload investigation artifact
        uses: actions/upload-artifact@v4
        with:
          name: cebu-qcacld3-fast-history
          path: investigation-results/
          if-no-files-found: error
          retention-days: 14

      - name: Final summary
        run: |
          echo
          echo "============================================"
          echo "INVESTIGATION COMPLETE"
          echo "============================================"
          echo
          echo "Download artifact:"
          echo "cebu-qcacld3-fast-history"
          echo
          echo "Most important files:"
          echo "  final-report.txt"
          echo "  candidate-list.txt"
          echo "  current-source-report.txt"
          echo "  qualcomm-version-search.txt"
          echo "  qualcomm-r60-files.txt"
          echo "  comparison/r60-files-not-in-motorola.txt"
          echo
