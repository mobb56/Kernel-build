name: QCACLD3 Injection Prototype v13

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ============================================================
      # BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync

      # ============================================================
      # CLONE SOURCES
      # ============================================================

      - name: Clone kernel and NetHunter reference
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf Kernel-Build

          mkdir -p Kernel-Build

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            Kernel-Build/kernel

          git clone \
            --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            Kernel-Build/reference

      # ============================================================
      # PATHS
      # ============================================================

      - name: Set build paths
        shell: bash
        run: |
          set -euxo pipefail

          KERNEL="$GITHUB_WORKSPACE/Kernel-Build/kernel"
          REF="$GITHUB_WORKSPACE/Kernel-Build/reference"
          OUT="$KERNEL/out"
          WLAN="$KERNEL/drivers/staging/qcacld-3.0"

          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "WLAN=$WLAN" >> "$GITHUB_ENV"

      # ============================================================
      # VERIFY FRESH SOURCE
      # ============================================================

      - name: Verify clean source trees
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL"

          git status --short

          if [ -n "$(git status --porcelain)" ]; then
            echo "Kernel source is unexpectedly dirty."
            exit 1
          fi

          test -d "$WLAN"
          test -f "$WLAN/Kbuild"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c"

          echo "Source trees are clean."

      # ============================================================
      # PREPARE KERNEL FIRST
      #
      # IMPORTANT:
      # NOTHING is copied into the kernel source tree before this.
      # ============================================================

      - name: Configure and prepare kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL"

          export PATH="/usr/lib/llvm-14/bin:$PATH"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          echo "=== DEFCONFIG ==="

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          echo "=== ENABLE QCACLD3 MODULE ==="

          ./scripts/config \
            --module CONFIG_QCA_CLD_WLAN

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "=== PREPARE ==="

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            prepare

          echo "=== MODULES PREPARE ==="

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_prepare

          test -f "$OUT/.config"
          test -f "$OUT/include/config/auto.conf"
          test -f "$OUT/include/generated/autoconf.h"

          echo "Kernel preparation completed successfully."

      # ============================================================
      # VERIFY PREPARATION DID NOT ALTER SOURCE
      # ============================================================

      - name: Verify kernel source remains clean
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL"

          git status --short

          if [ -n "$(git status --porcelain)" ]; then
            echo "WARNING: preparation modified tracked source files."
            git diff --stat || true
          else
            echo "Kernel source remains clean."
          fi

      # ============================================================
      # BACKUP ORIGINAL KBUILD
      # ============================================================

      - name: Backup QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            "$WLAN/Kbuild" \
            "$WLAN/Kbuild.original"

      # ============================================================
      # IMPORT PRODUCTION INJECTION IMPLEMENTATION
      # ============================================================

      - name: Import production injection implementation
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            "$WLAN/core/hdd/inc" \
            "$WLAN/core/hdd/src" \
            "$WLAN/core/wma/inc" \
            "$WLAN/core/wma/src"

          # Production headers.
          INJECTION_HEADERS=(
            "core/hdd/inc/wlan_hdd_frame_inject.h"
            "core/hdd/inc/wlan_hdd_frame_inject_debug.h"
            "core/hdd/inc/wlan_hdd_frame_inject_integration.h"
            "core/hdd/inc/wlan_hdd_frame_validate.h"
            "core/hdd/inc/wlan_hdd_inject_security.h"
            "core/wma/inc/wma_frame_inject.h"
          )

          # Production source files.
          INJECTION_SOURCES=(
            "core/hdd/src/wlan_hdd_frame_inject.c"
            "core/hdd/src/wlan_hdd_frame_inject_debug.c"
            "core/hdd/src/wlan_hdd_frame_inject_integration.c"
            "core/hdd/src/wlan_hdd_frame_validate.c"
            "core/hdd/src/wlan_hdd_inject_security.c"
            "core/wma/src/wma_frame_inject.c"
          )

          echo "=== COPYING HEADERS ==="

          for f in "${INJECTION_HEADERS[@]}"; do
            echo "COPY $f"

            mkdir -p \
              "$(dirname "$WLAN/$f")"

            cp \
              "$REF/drivers/staging/qcacld-3.0/$f" \
              "$WLAN/$f"
          done

          echo "=== COPYING SOURCES ==="

          for f in "${INJECTION_SOURCES[@]}"; do
            echo "COPY $f"

            mkdir -p \
              "$(dirname "$WLAN/$f")"

            cp \
              "$REF/drivers/staging/qcacld-3.0/$f" \
              "$WLAN/$f"
          done

          echo "Injection implementation imported."

      # ============================================================
      # VERIFY IMPORTED FILES
      # ============================================================

      - name: Verify imported injection files
        shell: bash
        run: |
          set -euxo pipefail

          missing=0

          INJECTION_HEADERS=(
            "core/hdd/inc/wlan_hdd_frame_inject.h"
            "core/hdd/inc/wlan_hdd_frame_inject_debug.h"
            "core/hdd/inc/wlan_hdd_frame_inject_integration.h"
            "core/hdd/inc/wlan_hdd_frame_validate.h"
            "core/hdd/inc/wlan_hdd_inject_security.h"
            "core/wma/inc/wma_frame_inject.h"
          )

          INJECTION_SOURCES=(
            "core/hdd/src/wlan_hdd_frame_inject.c"
            "core/hdd/src/wlan_hdd_frame_inject_debug.c"
            "core/hdd/src/wlan_hdd_frame_inject_integration.c"
            "core/hdd/src/wlan_hdd_frame_validate.c"
            "core/hdd/src/wlan_hdd_inject_security.c"
            "core/wma/src/wma_frame_inject.c"
          )

          echo "=== HEADERS ==="

          for f in "${INJECTION_HEADERS[@]}"; do
            if [ -f "$WLAN/$f" ]; then
              echo "OK:      $f"
            else
              echo "MISSING: $f"
              missing=1
            fi
          done

          echo
          echo "=== SOURCES ==="

          for f in "${INJECTION_SOURCES[@]}"; do
            if [ -f "$WLAN/$f" ]; then
              echo "OK:      $f"
            else
              echo "MISSING: $f"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Injection import incomplete."
            exit 1
          fi

      # ============================================================
      # AUDIT INCLUDES
      # ============================================================

      - name: Audit injection includes
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          {
            echo "=== INJECTION INCLUDE AUDIT ==="
            echo

            for f in \
              "$WLAN/core/hdd/src/wlan_hdd_frame_inject.c" \
              "$WLAN/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
              "$WLAN/core/hdd/src/wlan_hdd_frame_inject_integration.c" \
              "$WLAN/core/hdd/src/wlan_hdd_frame_validate.c" \
              "$WLAN/core/hdd/src/wlan_hdd_inject_security.c" \
              "$WLAN/core/wma/src/wma_frame_inject.c"
            do
              echo "========================================"
              echo "$f"
              echo "========================================"

              grep -E \
                '^[[:space:]]*#include[[:space:]]*["<]' \
                "$f" || true

              echo
            done
          } | tee reports/injection-includes.txt

      # ============================================================
      # PATCH KBUILD
      # ============================================================

      - name: Patch QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "Kernel-Build/kernel/drivers/staging/qcacld-3.0/Kbuild"
          )

          s = p.read_text()

          marker = "$(MODNAME)-y := $(OBJS)"

          if marker not in s:
              raise SystemExit(
                  "ERROR: Could not locate $(MODNAME)-y := $(OBJS)"
              )

          if "wlan_hdd_frame_inject.o" in s:
              raise SystemExit(
                  "ERROR: Injection objects already exist in Kbuild"
              )

          block = r'''
          # ==========================================================
          # NetHunter QCACLD3 frame-injection prototype
          # ==========================================================

          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_integration.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o

          # Feature macro used by the imported implementation.
          ccflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT

          # Injection header directories.
          ccflags-y += -I$(src)/core/hdd/inc
          ccflags-y += -I$(src)/core/hdd/src
          ccflags-y += -I$(src)/core/wma/inc

          '''

          s = s.replace(
              marker,
              block + marker,
              1
          )

          p.write_text(s)
          PY

          echo "=== INJECTION KBUILD BLOCK ==="

          grep -n \
            -A25 \
            -B5 \
            "NetHunter QCACLD3 frame-injection prototype" \
            "$WLAN/Kbuild"

      # ============================================================
      # VERIFY KBUILD
      # ============================================================

      - name: Verify patched Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          for object in \
            wlan_hdd_frame_inject.o \
            wlan_hdd_frame_inject_debug.o \
            wlan_hdd_frame_inject_integration.o \
            wlan_hdd_frame_validate.o \
            wlan_hdd_inject_security.o \
            wma_frame_inject.o
          do
            grep -q "$object" "$WLAN/Kbuild"
          done

          grep -q \
            'FEATURE_FRAME_INJECTION_SUPPORT' \
            "$WLAN/Kbuild"

          grep -q \
            'core/hdd/inc' \
            "$WLAN/Kbuild"

          grep -q \
            'core/wma/inc' \
            "$WLAN/Kbuild"

          grep -q \
            '\$(MODNAME)-y := \$(OBJS)' \
            "$WLAN/Kbuild"

          echo "Kbuild verified."

      # ============================================================
      # BUILD QCACLD3
      # ============================================================

      - name: Build QCACLD3
        shell: bash
        run: |
          set +e

          cd "$KERNEL"

          export PATH="/usr/lib/llvm-14/bin:$PATH"

          mkdir -p "$GITHUB_WORKSPACE/reports"

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            V=1 \
            M=drivers/staging/qcacld-3.0 \
            WLAN_ROOT=drivers/staging/qcacld-3.0 \
            WLAN_COMMON_ROOT=drivers/staging/qca-wifi-host-cmn \
            WLAN_COMMON_INC=drivers/staging/qca-wifi-host-cmn \
            WLAN_FW_API=drivers/staging/fw-api \
            WLAN_PROFILE=default \
            DYNAMIC_SINGLE_CHIP= \
            MODNAME=wlan \
            BOARD_PLATFORM=bengal \
            CONFIG_QCA_CLD_WLAN=m \
            modules \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/reports/build.log"

          rc=${PIPESTATUS[0]}

          echo "$rc" > \
            "$GITHUB_WORKSPACE/reports/build-exit-code.txt"

          echo "QCACLD3 make exit code: $rc"

          # Don't stop report generation here.
          exit 0

      # ============================================================
      # EXTRACT ACTUAL COMPILER COMMANDS
      # ============================================================

      - name: Extract injection compile commands
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          {
            echo "=== INJECTION COMPILATION COMMANDS ==="
            echo

            grep -E \
              'wlan_hdd_frame_inject\.o|wlan_hdd_frame_inject_debug\.o|wlan_hdd_frame_inject_integration\.o|wlan_hdd_frame_validate\.o|wlan_hdd_inject_security\.o|wma_frame_inject\.o' \
              reports/build.log || true

            echo
            echo "=== COMPILER ERRORS ==="

            grep -E \
              'fatal error:|error:|undefined reference|No rule to make|recipe for target' \
              reports/build.log || true
          } | tee reports/injection-compile-results.txt

      # ============================================================
      # VERIFY OBJECTS
      # ============================================================

      - name: Verify injection objects
        if: always()
        shell: bash
        run: |
          set +e

          {
            echo "=== INJECTION OBJECT VERIFICATION ==="
            echo

            objects=(
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.o"
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.o"
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_integration.o"
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_validate.o"
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.o"
              "$OUT/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.o"
            )

            for f in "${objects[@]}"; do
              if [ -f "$f" ]; then
                echo "BUILT:     $f"
              else
                echo "NOT BUILT: $f"
              fi
            done

            echo
            echo "=== WLAN MODULE ==="

            MOD="$OUT/drivers/staging/qcacld-3.0/wlan.ko"

            if [ -f "$MOD" ]; then
              echo "BUILT: wlan.ko"
              ls -lh "$MOD"
              file "$MOD"
            else
              echo "NOT BUILT: wlan.ko"
            fi
          } | tee reports/object-verification.txt

          exit 0

      # ============================================================
      # SYMBOL INSPECTION
      # ============================================================

      - name: Inspect WLAN module
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p reports

          MOD="$OUT/drivers/staging/qcacld-3.0/wlan.ko"

          {
            echo "=== WLAN MODULE SYMBOL INSPECTION ==="
            echo

            if [ -f "$MOD" ]; then

              echo "--- FILE ---"
              file "$MOD"

              echo
              echo "--- MODINFO ---"
              modinfo "$MOD" 2>/dev/null || true

              echo
              echo "--- INJECTION SYMBOLS ---"

              llvm-nm "$MOD" 2>/dev/null | \
                grep -E \
                'wlan_hdd_frame_inject|wlan_hdd_frame_validate|wma_frame_inject|injection' \
                || true

            else
              echo "wlan.ko was not generated."
            fi
          } | tee reports/module-symbols.txt

      # ============================================================
      # FINAL REPORT
      # ============================================================

      - name: Generate prototype conclusion
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          BUILD_RC="$(cat reports/build-exit-code.txt 2>/dev/null || echo unknown)"

          {
            echo "QCACLD3 Injection Prototype v13"
            echo "================================"
            echo
            echo "Build exit code: $BUILD_RC"
            echo
            echo "Target kernel:"
            echo "LineageOS android_kernel_motorola_sm6225
