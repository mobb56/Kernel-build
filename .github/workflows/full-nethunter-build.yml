          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          DESTROY = "wlan_hdd_state_ctrl_param_destroy();"
          UNLOAD = "hdd_driver_unload();"

          # Exactly one of each.
          if text.count(DESTROY) != 1:
              raise SystemExit(
                  "FAIL: expected exactly one "
