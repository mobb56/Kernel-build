            \( \
              -name '*frame*inject*.h' \
              -o \
              -name '*inject*security*.h' \
              -o \
              -name '*frame*validate*.h' \
            \) \
            -print \
            | sort

          # Copy the matching injection-related headers while
          # preserving their relative directory structure.

          while IFS= read -r header; do
            relative="${header#${NH_QCACLD}/}"
            destination="${KERNEL_QCACLD}/${relative}"

            mkdir -p "$(dirname "${destination}")"
            cp "${header}" "${destination}"

            echo "Imported: ${relative}"
          done < <(
            find "${NH_QCACLD}" \
              -type f \
              \( \
                -name '*frame*inject*.h' \
                -o \
                -name '*inject*security*.h' \
                -o \
                -name '*frame*validate*.h' \
              \) \
              -print
          )


          mkdir -p drivers/staging/qcacld-3.0/core/wma/inc

          cp "${GITHUB_WORKSPACE}/nethunter-reference/drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h" \
          drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h





      - name: Route injection descriptor completions
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          WMA_MGMT="drivers/staging/qcacld-3.0/core/wma/src/wma_mgmt.c"

          test -f "$WMA_MGMT"

          echo "=== Ensuring WMA frame injection header is included ==="

          if ! grep -Fq '#include "wma_frame_inject.h"' "$WMA_MGMT"; then

            awk '
            BEGIN {
                inserted = 0
            }

            /^#include/ {
                print
                if (!inserted &&
                    $0 ~ /#include "wma\.h"/) {
                    print "#include \"wma_frame_inject.h\""
                    inserted = 1
                }
                next
            }

            {
                print
            }

            END {
                if (!inserted) {
                    print "ERROR: Could not insert wma_frame_inject.h"
                    exit 2
                }
            }
            ' "$WMA_MGMT" > "${WMA_MGMT}.new"

            mv "${WMA_MGMT}.new" "$WMA_MGMT"
          fi

          echo
          echo "=== Patching single management-TX completion ==="

          awk '
          BEGIN {
              patched = 0
          }

          !patched && /mgmt_txrx_get_nbuf[[:space:]]*\(/ {
              print "        /* NETHUNTER_INJECTION_COMPLETION_BRIDGE */"
              print "#ifdef FEATURE_FRAME_INJECTION_SUPPORT"
              print "        if (WMA_IS_INJECTION_DESC_ID(desc_id)) {"
              print "                QDF_STATUS injection_status;"
              print ""
              print "                injection_status ="
              print "                        wma_handle_injection_fw_response("
              print "                                wma_handle, desc_id, status);"
              print ""
              print "                if (injection_status != QDF_STATUS_SUCCESS)"
              print "                        wma_err(\"Failed to process injection completion: %d\","
              print "                                injection_status);"
              print ""
              print "                return 0;"
              print "        }"
              print "#endif"
              print ""
              print
              patched = 1
              next
          }

          {
              print
          }

          END {
