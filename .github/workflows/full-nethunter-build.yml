name: Moto G9 Power cebu NetHunter

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  KERNEL_BRANCH: lineage-23.2

  NETHUNTER_REPO: https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git
  NETHUNTER_BRANCH: nethunter-lineage-23.2

  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_BRANCH: master

  LLVM_DIR: /usr/lib/llvm-14
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out

  

jobs:
  build:
    name: Moto G9 Power cebu NetHunter
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang-14 \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            zip

          echo "Installed compiler versions:"
          clang-14 --version
          ld.lld-14 --version
          aarch64-linux-gnu-gcc --version
          make --version

      # ============================================================
      # 3. PREPARE LLVM TOOL NAMES
      # ============================================================

      - name: Prepare LLVM toolchain
        shell: bash
        run: |
          set -euxo pipefail

          LLVM_BIN="${RUNNER_TEMP}/llvm-bin"

          rm -rf "${LLVM_BIN}"
          mkdir -p "${LLVM_BIN}"

          link_tool() {
            local target="$1"
            local name="$2"

            if [ -x "${target}" ]; then
              ln -sf "${target}" "${LLVM_BIN}/${name}"
              return 0
            fi

            echo "ERROR: LLVM tool not found: ${target}"
            exit 1
          }

          link_tool /usr/bin/clang-14 clang
          link_tool /usr/bin/clang++-14 clang++

          link_tool /usr/bin/ld.lld-14 ld.lld

          link_tool /usr/bin/llvm-ar-14 llvm-ar
          link_tool /usr/bin/llvm-nm-14 llvm-nm
          link_tool /usr/bin/llvm-objcopy-14 llvm-objcopy
          link_tool /usr/bin/llvm-objdump-14 llvm-objdump
          link_tool /usr/bin/llvm-strip-14 llvm-strip
          link_tool /usr/bin/llvm-readelf-14 llvm-readelf
          link_tool /usr/bin/llvm-size-14 llvm-size
          link_tool /usr/bin/llvm-ranlib-14 llvm-ranlib
          link_tool /usr/bin/llvm-as-14 llvm-as

          export PATH="${LLVM_BIN}:${PATH}"

          echo "${LLVM_BIN}" >> "${GITHUB_PATH}"

          echo "LLVM_BIN=${LLVM_BIN}" >> "${GITHUB_ENV}"

          echo "LLVM toolchain prepared:"
          ls -la "${LLVM_BIN}"

      # ============================================================
      # 4. CLONE KERNEL SOURCE
      # ============================================================

      - name: Clone kernel source
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          test -d kernel
          test -f kernel/Makefile

          echo "Kernel source cloned successfully."

      # ============================================================
      # 5. CLONE NETHUNTER REFERENCE
      # ============================================================

      - name: Clone NetHunter reference
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${NETHUNTER_BRANCH}" \
            "${NETHUNTER_REPO}" \
            nethunter-reference

          test -d nethunter-reference
          test -d nethunter-reference/kernel

          echo "NetHunter reference cloned successfully."

      # ============================================================
      # 6. CLONE ANYKERNEL3 REFERENCE
      # ============================================================

      - name: Clone AnyKernel3 reference
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${ANYKERNEL_BRANCH}" \
            "${ANYKERNEL_REPO}" \
            AnyKernel3

          test -d AnyKernel3
          test -f AnyKernel3/tools/ak3-core.sh

          echo "AnyKernel3 reference cloned successfully."

      # ============================================================
      # 7. VERIFY SOURCE TREE
      # ============================================================

      - name: Verify kernel source tree
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            kernel/arch/arm64/configs/vendor/bengal-perf_defconfig

          test -f \
            kernel/drivers/staging/qcacld-3.0/Kbuild

          test -f \
            kernel/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h

          test -f \
            kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c

          echo "Kernel source tree verified."

      # ============================================================
      # 8. PREPARE OUTPUT
      # ============================================================

      - name: Prepare output
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          echo "Output directory prepared."


      # ============================================================
      # 9. GENERATE CLEAN BASE CONFIGURATION
      # ============================================================

      - name: Generate clean base configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            vendor/bengal-perf_defconfig

          CLEAN_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          test -n "${CLEAN_RELEASE}"

          case "${CLEAN_RELEASE}" in
            *-dirty)
              echo "ERROR: base release is already dirty."
              exit 1
              ;;
          esac

          echo "CLEAN_RELEASE=${CLEAN_RELEASE}" >> "${GITHUB_ENV}"

          echo "Clean kernel release:"
          echo "${CLEAN_RELEASE}"

      # ============================================================
      # 10. CREATE NETHUNTER CONFIGURATION
      #
      # IMPORTANT:
      # Do NOT put CONFIG_FEATURE_FRAME_INJECTION_SUPPORT or
      # CONFIG_FEATURE_MONITOR_MODE_SUPPORT in this file.
      #
      # Those are QCACLD3 Kbuild variables and are configured later.
      # ============================================================

      - name: Create NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p kernel/nethunter-config

          cat > kernel/nethunter-config/cebu-nethunter.config <<'EOF'
          # ============================================================
          # Moto G9 Power cebu NetHunter configuration
          #
          # This fragment is ADDITIVE.
          #
          # Stock cebu hardware drivers are explicitly preserved here
          # because the previous custom kernel disabled several of them.
          # ============================================================

          # ------------------------------------------------------------
          # Core input / HID
          # ------------------------------------------------------------

          CONFIG_INPUT=y
          CONFIG_INPUT_EVDEV=y
          CONFIG_INPUT_TOUCHSCREEN=y
          CONFIG_TOUCHSCREEN_PROPERTIES=y

          CONFIG_HID=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y

          # ------------------------------------------------------------
          # Stock cebu touchscreen
          # ------------------------------------------------------------

          CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI=m

          CONFIG_INPUT_NOVA_DRM_PANEL=y

          CONFIG_INPUT_TOUCHSCREEN_FOCALTECH_0FLASH_MMI=m
          CONFIG_INPUT_FOCALTECH_0FLASH_MMI_IC_NAME_FT8006S_AA=y
          CONFIG_INPUT_TOUCHSCREEN_FOCALTECH_0FLASH_MMI_DRM_PANEL=y

          # ------------------------------------------------------------
          # Stock cebu fingerprint
          # ------------------------------------------------------------

          CONFIG_INPUT_MISC_FPC1020=m
          CONFIG_INPUT_MISC_FPC1020_SAVE_TO_CLASS_DEVICE=y
          CONFIG_INPUT_CHIPONE_FPS_MMI=m

          # ------------------------------------------------------------
          # Qualcomm transport
          # ------------------------------------------------------------

          CONFIG_I2C_QCOM_GENI=y
          CONFIG_SPI_QCOM_GENI=y

          # ------------------------------------------------------------
          # Qualcomm WLAN
          # ------------------------------------------------------------

          CONFIG_WLAN=y
          CONFIG_QCA_CLD_WLAN=m

          # ------------------------------------------------------------
          # Cellular / IPA / RMNET
          # ------------------------------------------------------------

          CONFIG_RMNET=y
          CONFIG_RMNET_IPA3=y
          CONFIG_RMNET_PERF=m
          CONFIG_RMNET_SHS=m

          CONFIG_IPA3=y
          CONFIG_IPA_WDI_UNIFIED_API=y

          CONFIG_QCOM_QMI_HELPERS=y

          CONFIG_CNSS_UTILS=y
          CONFIG_CNSS_GENL=y

          # ------------------------------------------------------------
          # Bluetooth
          # ------------------------------------------------------------

          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y

          # RFCOMM is deliberately built into the kernel.
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y

          CONFIG_BT_BNEP=m
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y

          CONFIG_BT_HIDP=m

          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIUART_BCM=y
          CONFIG_BT_HCIUART_RTL=y

          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y

          CONFIG_BT_HCIVHCI=m

          # ------------------------------------------------------------
          # USB gadget / HID
          # ------------------------------------------------------------

          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y

          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_EEM=y

          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y

          # ------------------------------------------------------------
          # USB serial / networking
          # ------------------------------------------------------------

          CONFIG_USB_ACM=m
          CONFIG_USB_SERIAL=m
          CONFIG_USB_SERIAL_GENERIC=y

          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=y
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_NET_RNDIS_HOST=m

          CONFIG_USB_RTL8150=m
          CONFIG_USB_RTL8152=m

          # ------------------------------------------------------------
          # Sensors / packet networking
          # ------------------------------------------------------------

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m

          CONFIG_PACKET=y

          # ------------------------------------------------------------
          # Production build: no DWARF debug information
          # ------------------------------------------------------------

          # CONFIG_DEBUG_INFO is not set

          EOF

          test -s \
            kernel/nethunter-config/cebu-nethunter.config

          echo "NetHunter configuration created."

      # ============================================================
      # 11. MERGE NETHUNTER CONFIGURATION
      # ============================================================

      - name: Merge NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          scripts/kconfig/merge_config.sh \
            -m \
            -O "${OUT_DIR}" \
            "${OUT_DIR}/.config" \
            nethunter-config/cebu-nethunter.config

          make -s \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig

          echo "NetHunter configuration merged."

      # ============================================================
      # 12. PRESERVE STOCK KERNEL RELEASE
      # ============================================================

      - name: Preserve stock kernel release
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          EXPECTED_RELEASE="4.19.325-cip135-st19-perf-g39bcecd5c63d"
          RELEASE_SUFFIX="-perf-g39bcecd5c63d"

          echo "===== PREPARING KERNEL CONFIGURATION ====="

          make -s O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig

          echo "Initial configuration generated."

          echo
          echo "===== SETTING STOCK LOCAL VERSION ====="

          scripts/config --file out/.config \
            --disable LOCALVERSION_AUTO

          scripts/config --file out/.config \
            --set-str LOCALVERSION "${RELEASE_SUFFIX}"

          test "$(scripts/config --file out/.config --state LOCALVERSION_AUTO)" = "n"

          echo "LOCALVERSION_AUTO:"
          scripts/config --file out/.config --state LOCALVERSION_AUTO

          echo "CONFIG_LOCALVERSION:"
          scripts/config --file out/.config --state LOCALVERSION

          echo
          echo "===== REGENERATING CONFIGURATION ====="

          make -s O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig

          echo
          echo "===== CALCULATING KERNEL RELEASE ====="

            CONFIG_RELEASE="$(
            make -s O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              LOCALVERSION="" \
              kernelrelease
          )"

          echo "Configured release:"
          echo "${CONFIG_RELEASE}"

          echo "Expected release:"
          echo "${EXPECTED_RELEASE}"

          test "${CONFIG_RELEASE}" = "${EXPECTED_RELEASE}"

          case "${CONFIG_RELEASE}" in
            *+*|*-dirty*)
              echo "ERROR: dirty kernel release detected"
              exit 1
              ;;
          esac

          echo
          echo "===== VERIFYING CONFIGURATION HEADERS ====="

          test -f "${OUT_DIR}/include/generated/autoconf.h"
          test -f "${OUT_DIR}/include/config/auto.conf"

          echo "autoconf.h: OK"
          echo "auto.conf: OK"

          {
            echo "CLEAN_RELEASE=${EXPECTED_RELEASE}"
            echo "BASE_VERSION=4.19.325"
            echo "RELEASE_SUFFIX=${RELEASE_SUFFIX}"
          } >> "${GITHUB_ENV}"

          echo
          echo "Kernel release preserved successfully."
      # ============================================================
      # 13. DISABLE DEBUG INFORMATION
      # ============================================================

      - name: Disable kernel debug information
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          scripts/config \
            --file "${OUT_DIR}/.config" \
            --disable DEBUG_INFO

          make -s \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            syncconfig

          DEBUG_INFO_STATE="$(
            scripts/config \
              --file "${OUT_DIR}/.config" \
              --state DEBUG_INFO
          )"

          echo "DEBUG_INFO: ${DEBUG_INFO_STATE}"

          test "${DEBUG_INFO_STATE}" = "n"

      # ============================================================
      # 14. VERIFY KERNEL RELEASE BEFORE BUILD
      # ============================================================

      - name: Verify kernel release before build
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          echo "===== RELEASE CONFIGURATION CHECK ====="

          LOCALVERSION_AUTO_STATE="$(
            scripts/config \
              --file "${CONFIG}" \
              --state LOCALVERSION_AUTO
          )"

          LOCALVERSION_STATE="$(
            scripts/config \
              --file "${CONFIG}" \
              --state LOCALVERSION
          )"

          echo "LOCALVERSION_AUTO=${LOCALVERSION_AUTO_STATE}"
          echo "LOCALVERSION=${LOCALVERSION_STATE}"

          if [ "${LOCALVERSION_AUTO_STATE}" != "n" ]; then
            echo "ERROR: LOCALVERSION_AUTO was changed after the release setup"
            exit 1
          fi

          if [ "${LOCALVERSION_STATE}" != "-perf-g39bcecd5c63d" ]; then
            echo "ERROR: CONFIG_LOCALVERSION changed unexpectedly"
            exit 1
          fi

          echo
          echo "===== KERNEL RELEASE CHECK ====="

            CONFIG_RELEASE="$(
            make -s O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              LOCALVERSION="" \
              kernelrelease
          )"

          echo "Configured release:"
          echo "${CONFIG_RELEASE}"

          echo "Expected release:"
          echo "${CLEAN_RELEASE}"

          if [ "${CONFIG_RELEASE}" != "${CLEAN_RELEASE}" ]; then
            echo "ERROR: kernel release mismatch"
            exit 1
          fi

          case "${CONFIG_RELEASE}" in
            *+*|*-dirty*)
              echo "ERROR: dirty kernel release detected"
              exit 1
              ;;
          esac

          echo "Kernel release verification passed."
      # ============================================================
      # 15. VERIFY IMPORTANT CONFIGURATION
      # ============================================================

      - name: Verify important configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          get_state() {
            scripts/config \
              --file "${CONFIG}" \
              --state "$1"
          }

          require_exact() {
            local symbol="$1"
            local expected="$2"
            local actual

            actual="$(get_state "${symbol}")"

            echo "${symbol}: ${actual}"

            test "${actual}" = "${expected}" || {
              echo "ERROR: ${symbol} expected ${expected}, got ${actual}"
              exit 1
            }
          }

          require_enabled() {
            local symbol="$1"
            local actual

            actual="$(get_state "${symbol}")"

            echo "${symbol}: ${actual}"

            case "${actual}" in
              y|m)
                ;;
              *)
                echo "ERROR: ${symbol} is disabled."
                exit 1
                ;;
            esac
          }

          require_exact HIDRAW y
          require_exact UHID y

          require_exact BT y
          require_exact BT_BREDR y
          require_exact BT_LE y

          require_enabled BT_RFCOMM
          require_enabled BT_BNEP
          require_enabled BT_HIDP
          require_enabled BT_HCIUART
          require_enabled BT_HCIVHCI

          require_exact USB_GADGET y
          require_exact USB_CONFIGFS y
          require_exact USB_CONFIGFS_NCM y
          require_exact USB_CONFIGFS_RNDIS y
          require_exact USB_CONFIGFS_ECM y
          require_exact USB_CONFIGFS_EEM y
          require_exact USB_CONFIGFS_F_HID y

          require_enabled USB_ACM
          require_enabled USB_SERIAL
          require_exact USB_SERIAL_GENERIC y
          require_exact USB_USBNET y

          require_enabled USB_NET_CDCETHER
          require_enabled USB_NET_CDC_NCM
          require_enabled USB_NET_RNDIS_HOST

          require_enabled USB_RTL8150
          require_enabled USB_RTL8152

          require_exact SENSORS_SSC y
          require_enabled SENSORS_CLASS

          require_enabled QCA_CLD_WLAN

          require_exact LOCALVERSION_AUTO n
          require_exact DEBUG_INFO n

          # These are QCACLD3 Kbuild variables, NOT kernel
          # .config symbols.
          if grep -Eq \
            '^CONFIG_FEATURE_(FRAME_INJECTION_SUPPORT|MONITOR_MODE_SUPPORT)=' \
            "${CONFIG}"; then

            echo "ERROR: QCACLD3 FEATURE_* variable incorrectly present in .config."
            exit 1
          fi

          echo "Kernel configuration verification passed."

      # ============================================================
      # 16. IMPORT QCACLD3 INJECTION FRAMEWORK
      # ============================================================

      - name: Import QCACLD3 injection framework
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0"
          R="nethunter-reference/drivers/staging/qcacld-3.0"

          # ----------------------------------------------------------
          # HDD source files
          # ----------------------------------------------------------

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_inject.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_validate.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_inject_security.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
            "${K}/core/hdd/src/"

          # ----------------------------------------------------------
          # WMA source
          # ----------------------------------------------------------

          cp \
            "${R}/core/wma/src/wma_frame_inject.c" \
            "${K}/core/wma/src/"

          # ----------------------------------------------------------
          # HDD headers
          # ----------------------------------------------------------

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_validate.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_inject_security.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject_debug.h" \
            "${K}/core/hdd/inc/"

          # ----------------------------------------------------------
          # WMA header
          # ----------------------------------------------------------

          cp \
            "${R}/core/wma/inc/wma_frame_inject.h" \
            "${K}/core/wma/inc/"

          echo "QCACLD3 injection sources imported."

      # ============================================================
      # 17. ADD INJECTION CONTEXT
      # ============================================================

      - name: Add injection context to Motorola HDD
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/core/hdd/inc/"
              "wlan_hdd_main.h"
          )

          text = path.read_text()

          # ----------------------------------------------------------
          # Forward declaration
          # ----------------------------------------------------------

          if "struct hdd_injection_ctx;" not in text:

              marker = "struct hdd_adapter {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: struct hdd_adapter marker not found."
                  )

              text = text.replace(
                  marker,
                  "struct hdd_injection_ctx;\n\n" + marker,
                  1
              )

          # ----------------------------------------------------------
          # Injection context pointer
          # ----------------------------------------------------------

          if "struct hdd_injection_ctx *injection_ctx;" not in text:

              marker = (
                  "\tqdf_atomic_t net_dev_hold_ref_count"
                  "[NET_DEV_HOLD_ID_MAX];\n"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: injection-context anchor not found."
                  )

              replacement = """\tqdf_atomic_t net_dev_hold_ref_count[NET_DEV_HOLD_ID_MAX];

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              struct hdd_injection_ctx *injection_ctx;
          #endif
          """

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          path.write_text(text)

          print("Injection context added.")
          PY

          grep -Fq \
            "struct hdd_injection_ctx;" \
            kernel/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h

          grep -Fq \
            "struct hdd_injection_ctx *injection_ctx;" \
            kernel/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h

      # ============================================================
      # 18. FIX 4.19 CREDENTIAL COMPATIBILITY
      # ============================================================

      - name: Fix 4.19 credential compatibility
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/core/hdd/src/"
              "wlan_hdd_inject_security.c"
          )

          text = path.read_text()

          signature = re.compile(
              r"QDF_STATUS\s+"
              r"hdd_check_injection_capability\s*"
              r"\(\s*struct\s+task_struct\s*\*\s*task\s*\)"
              r"\s*\{"
          )

          match = signature.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: hdd_check_injection_capability() "
                  "signature not found."
              )

          brace_start = text.find("{", match.start())

          depth = 0
          brace_end = None

          for index in range(brace_start, len(text)):

              char = text[index]

              if char == "{":
                  depth += 1

              elif char == "}":
                  depth -= 1

                  if depth == 0:
                      brace_end = index + 1
                      break

          if brace_end is None:
              raise SystemExit(
                  "ERROR: function closing brace not found."
              )

          replacement = """QDF_STATUS hdd_check_injection_capability(
              struct task_struct *task)
          {
              bool has_capability;

              hdd_security_debug(
                  "Checking injection capabilities");

              if (!task)
                  task = current;

              has_capability = capable(CAP_NET_RAW);

              if (!has_capability) {
                  hdd_security_warn(
                      "Process lacks CAP_NET_RAW capability");

                  return QDF_STATUS_E_PERM;
              }

              hdd_security_debug(
                  "Process has CAP_NET_RAW capability");

              return QDF_STATUS_SUCCESS;
          }"""

          new_text = (
              text[:match.start()]
              + replacement
              + text[brace_end:]
          )

          path.write_text(new_text)

          print(
              "4.19-compatible injection capability check installed."
          )
          PY

          SRC="kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c"

          if grep -nE \
            '^[[:space:]]*(const[[:space:]]+struct[[:space:]]+cred|put_cred|get_task_cred)[[:space:]]*(\(|;)' \
            "${SRC}"; then

            echo "ERROR: incompatible credential API code remains."
            exit 1
          fi

          grep -Fq \
            "capable(CAP_NET_RAW)" \
            "${SRC}"

          echo "4.19 credential compatibility verified."

      # ============================================================
      # 19. INTEGRATE INJECTION LIFECYCLE
      # ============================================================

      - name: Integrate injection lifecycle
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/core/hdd/src/"
              "wlan_hdd_main.c"
          )

          text = path.read_text()

          # ----------------------------------------------------------
          # Include frame injection header.
          # ----------------------------------------------------------

          include_marker = '#include "wlan_hdd_rx_monitor.h"\n'

          if '#include "wlan_hdd_frame_inject.h"' not in text:

              if include_marker not in text:
                  raise SystemExit(
                      "ERROR: RX monitor include marker not found."
                  )

              replacement = (
                  '#include "wlan_hdd_rx_monitor.h"\n'
                  '#ifdef FEATURE_FRAME_INJECTION_SUPPORT\n'
                  '#include "wlan_hdd_frame_inject.h"\n'
                  '#endif\n'
              )

              text = text.replace(
                  include_marker,
                  replacement,
                  1
              )

          # ----------------------------------------------------------
          # Initialize frame injection.
          # ----------------------------------------------------------

          if "hdd_init_frame_injection(adapter)" not in text:

              marker = (
                  "\thdd_periodic_sta_stats_init(adapter);\n"
                  "\n"
                  "\treturn adapter;"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: adapter initialization marker not found."
                  )

              replacement = """\thdd_periodic_sta_stats_init(adapter);

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              if (QDF_STATUS_SUCCESS !=
                  hdd_init_frame_injection(adapter)) {
                  hdd_err(
                      "Failed to initialize frame injection for adapter");
                  /* Continue without frame injection support */
              }
          #endif

              return adapter;"""

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          # ----------------------------------------------------------
          # Deinitialize frame injection.
          # ----------------------------------------------------------

          if "hdd_deinit_frame_injection(adapter)" not in text:

              marker = (
                  "\thdd_adapter_feature_update_work_deinit(adapter);\n"
                  "\thdd_cleanup_adapter(hdd_ctx, adapter, rtnl_held);"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: adapter cleanup marker not found."
                  )

              replacement = """\thdd_adapter_feature_update_work_deinit(adapter);

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              hdd_deinit_frame_injection(adapter);
          #endif

              hdd_cleanup_adapter(hdd_ctx, adapter, rtnl_held);"""

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          path.write_text(text)

          print("Injection lifecycle integrated.")
          PY

          grep -Fq \
            '#include "wlan_hdd_frame_inject.h"' \
            kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c

          grep -Fq \
            "hdd_init_frame_injection(adapter)" \
            kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c

          grep -Fq \
            "hdd_deinit_frame_injection(adapter)" \
            kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c

          echo "Injection lifecycle verification passed."


      # ============================================================
      # 20. PATCH QCACLD3 KBUILD
      # ============================================================

      - name: Patch QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/Kbuild"
          )

          text = path.read_text()

          # ----------------------------------------------------------
          # Define QCACLD3 feature variables early enough for every
          # later Kbuild conditional.
          # ----------------------------------------------------------

          feature_defs = """# NetHunter QCACLD3 frame injection support
          CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y
          CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y

          """

          if "CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y" not in text:

              marker = "TARGET_BUILD_VARIANT := user\n"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: top Kbuild insertion marker not found."
                  )

              text = text.replace(
                  marker,
                  marker + "\n" + feature_defs,
                  1
              )

          # ----------------------------------------------------------
          # Add HDD/WMA include paths.
          # ----------------------------------------------------------

          if (
              "$(HDD_INC)" not in text
              or
              "$(WMA_INC)" not in text
          ):

              inc_marker = (
                  "INCS := -I $(srctree)/$(WLAN_ROOT)/inc \\\n"
              )

              if inc_marker not in text:
                  raise SystemExit(
                      "ERROR: QCACLD3 INCS anchor not found."
                  )

              replacement = (
                  "INCS := $(HDD_INC) \\\n"
                  "        $(WMA_INC) \\\n"
                  "        -I $(srctree)/$(WLAN_ROOT)/inc \\\n"
              )

              text = text.replace(
                  inc_marker,
                  replacement,
                  1
              )

          # ----------------------------------------------------------
          # HDD injection objects.
          # ----------------------------------------------------------

          if "wlan_hdd_frame_inject.o" not in text:

              anchor = (
                  "ifeq ($(CONFIG_LITHIUM), y)\n"
                  "HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_rx_monitor.o\n"
                  "endif\n"
              )

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: HDD insertion anchor not found."
                  )

              addition = anchor + """ifeq ($(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT), y)
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o
          endif

          """

              text = text.replace(
                  anchor,
                  addition,
                  1
              )

          # ----------------------------------------------------------
          # WMA injection object.
          # ----------------------------------------------------------

          if "wma_frame_inject.o" not in text:

              anchor = "\t\t$(WMA_NDP_OBJS)\n"

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: WMA insertion anchor not found."
                  )

              addition = anchor + """ifeq ($(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT), y)
          WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o
          endif
          """

              text = text.replace(
                  anchor,
                  addition,
                  1
              )

          # ----------------------------------------------------------
          # Frame-injection compiler define.
          # ----------------------------------------------------------

          if (
              "cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT"
              not in text
          ):

              monitor_block = """ifeq ($(CONFIG_FEATURE_MONITOR_MODE_SUPPORT), y)
          cppflags-y += -DFEATURE_MONITOR_MODE_SUPPORT
          else
          cppflags-y += -DDISABLE_MON_CONFIG
          endif
          """

              if monitor_block not in text:
                  raise SystemExit(
                      "ERROR: monitor-mode Kbuild block not found."
                  )

              addition = monitor_block + """ifeq ($(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT), y)
          cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT
          endif
          """

              text = text.replace(
                  monitor_block,
                  addition,
                  1
              )

          path.write_text(text)

          print("QCACLD3 Kbuild patched.")
          PY

      # ============================================================
      # 21. VERIFY QCACLD3 KBUILD
      # ============================================================

      - name: Verify QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0/Kbuild"

          # ----------------------------------------------------------
          # Include paths.
          # ----------------------------------------------------------

          grep -Fq \
            'INCS := $(HDD_INC)' \
            "${K}" || {
              echo "ERROR: HDD_INC is not included."
              exit 1
            }

          grep -Fq \
            '$(WMA_INC)' \
            "${K}" || {
              echo "ERROR: WMA_INC is not included."
              exit 1
            }

          # ----------------------------------------------------------
          # Feature variables.
          # ----------------------------------------------------------

          grep -Fq \
            'CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y' \
            "${K}"

          grep -Fq \
            'CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y' \
            "${K}"

          # ----------------------------------------------------------
          # HDD objects.
          # ----------------------------------------------------------

          grep -Fq \
            'wlan_hdd_frame_inject.o' \
            "${K}"

          grep -Fq \
            'wlan_hdd_frame_validate.o' \
            "${K}"

          grep -Fq \
            'wlan_hdd_inject_security.o' \
            "${K}"

          grep -Fq \
            'wlan_hdd_frame_inject_debug.o' \
            "${K}"

          # ----------------------------------------------------------
          # WMA object.
          # ----------------------------------------------------------

          grep -Fq \
            'wma_frame_inject.o' \
            "${K}"

          # ----------------------------------------------------------
          # Compiler defines.
          # ----------------------------------------------------------

          grep -Fq \
            'cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT' \
            "${K}"

          grep -Fq \
            'cppflags-y += -DFEATURE_MONITOR_MODE_SUPPORT' \
            "${K}"

          echo "QCACLD3 Kbuild verification passed."

      # ============================================================
      # 22. VERIFY SOURCE ADAPTATION
      # ============================================================

      - name: Verify source adaptation
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0"

          # ----------------------------------------------------------
          # Injection sources.
          # ----------------------------------------------------------

          test -s \
            "${K}/core/hdd/src/wlan_hdd_frame_inject.c"

          test -s \
            "${K}/core/hdd/src/wlan_hdd_frame_validate.c"

          test -s \
            "${K}/core/hdd/src/wlan_hdd_inject_security.c"

          test -s \
            "${K}/core/hdd/src/wlan_hdd_frame_inject_debug.c"

          test -s \
            "${K}/core/wma/src/wma_frame_inject.c"

          # ----------------------------------------------------------
          # Injection headers.
          # ----------------------------------------------------------

          test -s \
            "${K}/core/hdd/inc/wlan_hdd_frame_inject.h"

          test -s \
            "${K}/core/hdd/inc/wlan_hdd_frame_validate.h"

          test -s \
            "${K}/core/hdd/inc/wlan_hdd_inject_security.h"

          test -s \
            "${K}/core/hdd/inc/wlan_hdd_frame_inject_debug.h"

          test -s \
            "${K}/core/wma/inc/wma_frame_inject.h"

          # ----------------------------------------------------------
          # Motorola HDD integration.
          # ----------------------------------------------------------

          grep -Fq \
            "struct hdd_injection_ctx;" \
            "${K}/core/hdd/inc/wlan_hdd_main.h"

          grep -Fq \
            "struct hdd_injection_ctx *injection_ctx;" \
            "${K}/core/hdd/inc/wlan_hdd_main.h"

          grep -Fq \
            '#include "wlan_hdd_frame_inject.h"' \
            "${K}/core/hdd/src/wlan_hdd_main.c"

          grep -Fq \
            "hdd_init_frame_injection(adapter)" \
            "${K}/core/hdd/src/wlan_hdd_main.c"

          grep -Fq \
            "hdd_deinit_frame_injection(adapter)" \
            "${K}/core/hdd/src/wlan_hdd_main.c"

          # ----------------------------------------------------------
          # 4.19 capability handling.
          # ----------------------------------------------------------

          grep -Fq \
            "capable(CAP_NET_RAW)" \
            "${K}/core/hdd/src/wlan_hdd_inject_security.c"

          echo "QCACLD3 source adaptation verification passed."

      # ============================================================
      # 23. VERIFY FEATURE VARIABLES DID NOT LEAK INTO .CONFIG
      # ============================================================

      - name: Verify QCACLD3 feature configuration separation
        shell: bash
        run: |
          set -euxo pipefail

          CONFIG="kernel/${OUT_DIR}/.config"
          KBUILD="kernel/drivers/staging/qcacld-3.0/Kbuild"

          grep -Fq \
            'CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y' \
            "${KBUILD}"

          grep -Fq \
            'CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y' \
            "${KBUILD}"

          if grep -Eq \
            '^CONFIG_FEATURE_(FRAME_INJECTION_SUPPORT|MONITOR_MODE_SUPPORT)=' \
            "${CONFIG}"; then

            echo "ERROR: QCACLD3 FEATURE_* variables leaked into .config."
            exit 1
          fi

          echo "Kbuild/.config separation verified."

      # ============================================================
      # 24. FINAL PRE-BUILD HARDWARE GATE
      # ============================================================

      - name: Final pre-build hardware gate
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          get_state() {
            scripts/config \
              --file "${CONFIG}" \
              --state "$1"
          }

          require_enabled() {
            local symbol="$1"
            local actual

            actual="$(get_state "${symbol}")"

            echo "${symbol}: ${actual}"

            case "${actual}" in
              y|m)
                ;;
              *)
                echo "ERROR: ${symbol} is disabled."
                exit 1
                ;;
            esac
          }

          echo "============================================================"
          echo "FINAL HARDWARE PRESERVATION CHECK"
          echo "============================================================"

          # Touchscreen.
          require_enabled INPUT_TOUCHSCREEN_FOCALTECH_0FLASH_MMI

          # Fingerprint.
          require_enabled INPUT_MISC_FPC1020

          # WLAN.
          require_enabled QCA_CLD_WLAN

          # Cellular.
          require_enabled RMNET_PERF
          require_enabled RMNET_SHS

          # HID.
          require_enabled HIDRAW
          require_enabled UHID

          # Bluetooth/VHCI.
          require_enabled BT
          require_enabled BT_HCIVHCI

          # USB gadget.
          require_enabled USB_GADGET
          require_enabled USB_CONFIGFS

          # Sensors.
          require_enabled SENSORS_SSC
          require_enabled SENSORS_CLASS

          # Packet sockets.
          require_enabled PACKET

          # Release safety.
          test \
            "$(get_state LOCALVERSION_AUTO)" = "n"

          test \
            "$(get_state DEBUG_INFO)" = "n"

          echo "============================================================"
          echo "FINAL HARDWARE PRESERVATION CHECK PASSED"
          echo "============================================================"


      # ============================================================
      # 25. BUILD KERNEL + MODULES
      # ============================================================

      - name: Build kernel and modules
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          BUILD_LOG="${GITHUB_WORKSPACE}/kernel-build.log"

          rm -f "${BUILD_LOG}"

          echo "============================================================"
          echo "BUILDING KERNEL + MODULES"
          echo "============================================================"

            make -j2 \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            LOCALVERSION="" \
            Image \
            modules 2>&1 | tee "${BUILD_LOG}"
            
          status="${PIPESTATUS[0]}"

          if [ "${status}" -ne 0 ]; then
            echo "Kernel build failed."
            exit "${status}"
          fi

          test -s "${BUILD_LOG}"

          test -s \
            "${OUT_DIR}/arch/arm64/boot/Image"

          echo "Kernel and module build completed successfully."

      # ============================================================
      # 26. BUILD FAILURE DIAGNOSTICS
      # ============================================================

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "BUILD FAILURE DIAGNOSTICS"
          echo "============================================================"

          if [ -f kernel-build.log ]; then

            echo
            echo "Likely compiler/linker errors:"

            grep -nEi \
              '(^|[[:space:]])(error:|fatal error:|undefined reference|undefined!|No such file|not found)' \
              kernel-build.log \
              | head -n 100 \
              || true

            echo
            echo "Last 250 build-log lines:"

            tail -n 250 kernel-build.log

          else

            echo "kernel-build.log does not exist."

            echo
            echo "The failure occurred before kernel compilation"
            echo "or before the build log could be created."

          fi

      # ============================================================
      # 27. VERIFY KERNEL RELEASE AFTER BUILD
      # ============================================================

      - name: Verify kernel release
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          BUILT_RELEASE="$(
          make -s O="${OUT_DIR}" \
          ARCH="${ARCH}" \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE="${CROSS_COMPILE}" \
          LOCALVERSION="" \
          kernelrelease
          )"

          echo "Expected release:"
          echo "${CLEAN_RELEASE}"

          echo "Built release:"
          echo "${BUILT_RELEASE}"

          test "${BUILT_RELEASE}" = "${CLEAN_RELEASE}"

          case "${BUILT_RELEASE}" in
            *+*)
              echo "ERROR: unwanted '+' detected in release."
              exit 1
              ;;
            *-dirty)
              echo "ERROR: dirty release detected."
              exit 1
              ;;
          esac

          echo "Kernel release verification passed."

      # ============================================================
      # 28. VERIFY KERNEL IMAGE
      # ============================================================

      - name: Verify kernel Image
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="kernel/out/arch/arm64/boot/Image"

          test -f "${IMAGE}"
          test -s "${IMAGE}"

          SIZE="$(stat -c%s "${IMAGE}")"

          echo "Kernel Image size: ${SIZE} bytes"

          test "${SIZE}" -gt 10000000

          echo "Kernel Image:"
          ls -lh "${IMAGE}"

          file "${IMAGE}"

          echo "Kernel Image verification passed."

      # ============================================================
      # 29. INSTALL MODULES
      # ============================================================

      - name: Install kernel modules
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          MODULE_INSTALL_DIR="${GITHUB_WORKSPACE}/module-install"

          rm -rf "${MODULE_INSTALL_DIR}"

          mkdir -p "${MODULE_INSTALL_DIR}"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            INSTALL_MOD_PATH="${MODULE_INSTALL_DIR}" \
            modules_install

          echo "Installed modules:"

          find \
            "${MODULE_INSTALL_DIR}" \
            -type f \
            -name "*.ko" \
            -print \
            | sort

      # ============================================================
      # 30. STRIP MODULE DEBUG INFORMATION
      # ============================================================

      - name: Strip kernel module debug information
        shell: bash
        run: |
          set -euxo pipefail

          MODULE_INSTALL_DIR="${GITHUB_WORKSPACE}/module-install"

          LLVM_STRIP="${LLVM_DIR}/bin/llvm-strip"

          test -x "${LLVM_STRIP}"

          echo "Using:"
          echo "${LLVM_STRIP}"

          while IFS= read -r module; do

            echo "Stripping:"
            echo "${module}"

            "${LLVM_STRIP}" \
              --strip-debug \
              "${module}"

          done < <(
            find \
              "${MODULE_INSTALL_DIR}" \
              -type f \
              -name "*.ko"
          )

          echo "Module debug information stripped."

      # ============================================================
      # 31. VERIFY WLAN MODULE
      # ============================================================

      - name: Verify WLAN module
        shell: bash
        run: |
          set -euxo pipefail

          MODULE_INSTALL_DIR="${GITHUB_WORKSPACE}/module-install"

          WLAN_MODULE="$(
            find \
              "${MODULE_INSTALL_DIR}" \
              -type f \
              -name "wlan.ko" \
              -print \
              -quit
          )"

          test -n "${WLAN_MODULE}"
          test -f "${WLAN_MODULE}"
          test -s "${WLAN_MODULE}"

          echo "WLAN module:"
          echo "${WLAN_MODULE}"

          ls -lh "${WLAN_MODULE}"

          echo "WLAN module verification passed."

      # ============================================================
      # 32. VERIFY NO DWARF DEBUG SECTIONS
      # ============================================================

      - name: Verify modules contain no DWARF sections
        shell: bash
        run: |
          set -euxo pipefail

          MODULE_INSTALL_DIR="${GITHUB_WORKSPACE}/module-install"

          while IFS= read -r module; do

            echo "Checking:"
            echo "${module}"

            if llvm-readelf \
              -S \
              "${module}" \
              | grep -Eq '\.(debug_|zdebug_)'; then

              echo "ERROR: DWARF/debug section found:"
              echo "${module}"

              exit 1
            fi

          done < <(
            find \
              "${MODULE_INSTALL_DIR}" \
              -type f \
              -name "*.ko"
          )

          echo "No DWARF debug sections found."

      # ============================================================
      # 33. VERIFY WLAN VERMAGIC
      # ============================================================

      - name: Verify WLAN module vermagic
        shell: bash
        run: |
          set -euxo pipefail

          MODULE_INSTALL_DIR="${GITHUB_WORKSPACE}/module-install"

          WLAN_MODULE="$(
            find \
              "${MODULE_INSTALL_DIR}" \
              -type f \
              -name "wlan.ko" \
              -print \
              -quit
          )"

          test -n "${WLAN_MODULE}"

          VERMAGIC="$(
            modinfo \
              -F vermagic \
              "${WLAN_MODULE}"
          )"

          echo "Expected release:"
          echo "${CLEAN_RELEASE}"

          echo "WLAN vermagic:"
          echo "${VERMAGIC}"

          case "${VERMAGIC}" in
            "${CLEAN_RELEASE}"\ *)
              ;;
            *)
              echo "ERROR: WLAN vermagic does not match kernel release."
              exit 1
              ;;
          esac

          echo "WLAN vermagic verification passed."

      # ============================================================
      # 34. VERIFY NETHUNTER MODULES
      # ============================================================

      - name: Verify NetHunter modules
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          MODULE_INSTALL_DIR="${GITHUB_WORKSPACE}/module-install"

          test -d "${MODULE_INSTALL_DIR}"

          # ----------------------------------------------------------
          # RFCOMM is built into the kernel.
          # ----------------------------------------------------------

          RFCOMM_STATE="$(
            scripts/config \
              --file "${OUT_DIR}/.config" \
              --state BT_RFCOMM
          )"

          RFCOMM_TTY_STATE="$(
            scripts/config \
              --file "${OUT_DIR}/.config" \
              --state BT_RFCOMM_TTY
          )"

          echo "BT_RFCOMM: ${RFCOMM_STATE}"
          echo "BT_RFCOMM_TTY: ${RFCOMM_TTY_STATE}"

          test "${RFCOMM_STATE}" = "y"
          test "${RFCOMM_TTY_STATE}" = "y"

          if find \
            "${MODULE_INSTALL_DIR}" \
            -type f \
            -name "rfcomm.ko" \
            | grep -q .; then

            echo "ERROR: rfcomm.ko exists even though RFCOMM is built-in."
            exit 1
          fi

          echo "Built-in RFCOMM verification passed."

          # ----------------------------------------------------------
          # Required NetHunter Bluetooth modules.
          # ----------------------------------------------------------

          required_modules=(
            hci_vhci.ko
            hci_uart.ko
            hidp.ko
            bnep.ko
          )

          for module in "${required_modules[@]}"; do

            found="$(
              find \
                "${MODULE_INSTALL_DIR}" \
                -type f \
                -name "${module}" \
                -print \
                -quit
            )"

            if [ -z "${found}" ]; then
              echo "ERROR: missing ${module}"
              exit 1
            fi

            test -s "${found}"

            echo "Found ${module}:"
            echo "${found}"

          done

          echo "NetHunter Bluetooth/VHCI modules verified."

      # ============================================================
      # 35. CHECK WLAN MODPOST / UNDEFINED SYMBOLS
      # ============================================================

      - name: Check WLAN undefined symbols
        shell: bash
        run: |
          set -euxo pipefail

          KERNEL_BUILD_LOG="${GITHUB_WORKSPACE}/kernel-build.log"
          MODULE_INSTALL_DIR="${GITHUB_WORKSPACE}/module-install"

          test -s "${KERNEL_BUILD_LOG}"

          echo "Checking build log for undefined WLAN symbols..."

          if grep -E \
            'ERROR: "[^"]+" \[[^]]+\] wlan\.ko\] undefined' \
            "${KERNEL_BUILD_LOG}"; then

            echo "ERROR: wlan.ko has undefined symbols."
            exit 1
          fi

          if grep -E \
            'undefined!$' \
            "${KERNEL_BUILD_LOG}"; then

            echo "ERROR: undefined kernel symbols detected."
            exit 1
          fi

          WLAN_MODULE="$(
            find \
              "${MODULE_INSTALL_DIR}" \
              -type f \
              -name "wlan.ko" \
              -print \
              -quit
          )"

          test -n "${WLAN_MODULE}"
          test -f "${WLAN_MODULE}"

          echo "Confirmed WLAN module:"
          echo "${WLAN_MODULE}"

          echo "WLAN undefined-symbol verification passed."

      # ============================================================
      # 36. STAGE FINAL NETHUNTER MODULES
      # ============================================================

      - name: Prepare NetHunter modules
        shell: bash
        run: |
          set -euxo pipefail

          MODULE_INSTALL_DIR="${GITHUB_WORKSPACE}/module-install"
          STAGE_DIR="${GITHUB_WORKSPACE}/kernel/module-stage"
          STAGE_MODULE_DIR="${STAGE_DIR}/vendor/lib/modules"

          test -d "${MODULE_INSTALL_DIR}"

          rm -rf "${STAGE_DIR}"

          mkdir -p "${STAGE_MODULE_DIR}"

          echo "Copying compiled kernel modules..."

          find \
            "${MODULE_INSTALL_DIR}" \
            -type f \
            -name "*.ko" \
            -exec cp {} "${STAGE_MODULE_DIR}/" \;

          # ----------------------------------------------------------
          # Qualcomm WLAN
          # ----------------------------------------------------------

          test -f \
            "${STAGE_MODULE_DIR}/wlan.ko"

          mv \
            "${STAGE_MODULE_DIR}/wlan.ko" \
            "${STAGE_MODULE_DIR}/qca_cld3_wlan.ko"

          # ----------------------------------------------------------
          # RFCOMM is built into the kernel.
          # ----------------------------------------------------------

          rm -f \
            "${STAGE_MODULE_DIR}/rfcomm.ko"

          # ----------------------------------------------------------
          # Required NetHunter modules.
          # ----------------------------------------------------------

          test -s \
            "${STAGE_MODULE_DIR}/qca_cld3_wlan.ko"

          test -s \
            "${STAGE_MODULE_DIR}/hci_vhci.ko"

          test -s \
            "${STAGE_MODULE_DIR}/hci_uart.ko"

          test -s \
            "${STAGE_MODULE_DIR}/hidp.ko"

          test -s \
            "${STAGE_MODULE_DIR}/bnep.ko"

          echo
          echo "Final staged modules:"
          echo

          find \
            "${STAGE_MODULE_DIR}" \
            -type f \
            -name "*.ko" \
            -printf "%f\n" \
            | sort

          echo
          echo "NetHunter module staging passed."

      # ============================================================
      # 37. VERIFY STAGED MODULES
      # ============================================================

      - name: Verify staged modules
        shell: bash
        run: |
          set -euxo pipefail

          MODULE_DIR="${GITHUB_WORKSPACE}/kernel/module-stage/vendor/lib/modules"

          test -d "${MODULE_DIR}"

          for module in \
            qca_cld3_wlan.ko \
            hci_vhci.ko \
            hci_uart.ko \
            hidp.ko \
            bnep.ko
          do

            test -s \
              "${MODULE_DIR}/${module}"

            echo "Verified:"
            echo "${module}"

          done

          if [ -e "${MODULE_DIR}/rfcomm.ko" ]; then
            echo "ERROR: rfcomm.ko exists."
            echo "RFCOMM must be built into the kernel."
            exit 1
          fi

          echo "Staged module verification passed."

      # ============================================================
      # 38. SAVE FINAL CONFIGURATION
      # ============================================================

      - name: Save final kernel configuration
        shell: bash
        run: |
          set -euxo pipefail

          test -s \
            kernel/out/.config

          cp \
            kernel/out/.config \
            final-kernel.config

          cp \
            kernel/nethunter-config/cebu-nethunter.config \
            nethunter-config-used.config

          test -s \
            final-kernel.config

          test -s \
            nethunter-config-used.config

          echo "Final configuration saved."

      # ============================================================
      # 39. CREATE BUILD MANIFEST
      # ============================================================

      - name: Create build manifest
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="kernel/out/arch/arm64/boot/Image"
          WLAN="kernel/module-stage/vendor/lib/modules/qca_cld3_wlan.ko"

          IMAGE_SHA256="$(
            sha256sum \
              "${IMAGE}" \
              | awk '{print $1}'
          )"

          WLAN_SHA256="$(
            sha256sum \
              "${WLAN}" \
              | awk '{print $1}'
          )"

          IMAGE_SIZE="$(
            stat \
              -c '%s' \
              "${IMAGE}"
          )"

          WLAN_SIZE="$(
            stat \
              -c '%s' \
              "${WLAN}"
          )"

          cat > build-manifest.txt <<EOF
          Device: Motorola Moto G9 Power
          Codename: cebu

          ROM: LineageOS 23.2 / Android 16

          Kernel repository:
          ${KERNEL_REPO}

          Kernel branch:
          ${KERNEL_BRANCH}

          NetHunter reference:
          ${NETHUNTER_REPO}

          NetHunter branch:
          ${NETHUNTER_BRANCH}

          Architecture:
          ${ARCH}

          Compiler:
          LLVM/Clang 14

          Kernel release:
          ${CLEAN_RELEASE}

          Kernel Image size:
          ${IMAGE_SIZE}

          Kernel Image SHA256:
          ${IMAGE_SHA256}

          qca_cld3_wlan.ko size:
          ${WLAN_SIZE}

          qca_cld3_wlan.ko SHA256:
          ${WLAN_SHA256}

          HIDRAW:
          enabled

          UHID:
          enabled

          Bluetooth:
          enabled

          Bluetooth RFCOMM:
          built-in

          Bluetooth BNEP:
          enabled

          Bluetooth HIDP:
          enabled

          Bluetooth HCI UART:
          enabled

          Bluetooth VHCI:
          enabled

          USB gadget/configfs:
          enabled

          USB HID gadget:
          enabled

          USB networking:
          enabled

          USB serial:
          enabled

          Qualcomm WLAN:
          enabled

          QCACLD3 monitor-mode Kbuild:
          enabled

          QCACLD3 frame-injection Kbuild:
          enabled

          CAP_NET_RAW injection authorization:
          enabled

          Stock cebu touchscreen drivers:
          explicitly preserved and verified

          Stock cebu fingerprint drivers:
          explicitly preserved and verified

          Stock cellular/RMNET/IPA configuration:
          explicitly preserved and verified

          Debug information:
          disabled

          AnyKernel3:
          not used for flashing

          Automatic flashing:
          disabled

          Automatic reboot:
          disabled
          EOF

          cat build-manifest.txt

      # ============================================================
      # 40. CREATE SHA256 CHECKSUM FILE
      # ============================================================

      - name: Create SHA256 checksums
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum \
            kernel/out/arch/arm64/boot/Image \
            kernel/module-stage/vendor/lib/modules/qca_cld3_wlan.ko \
            final-kernel.config \
            nethunter-config-used.config \
            build-manifest.txt \
            kernel-build.log \
            > SHA256SUMS.txt

          echo "SHA256 checksums:"
          cat SHA256SUMS.txt

      # ============================================================
      # 41. VERIFY SHA256 CHECKSUMS
      # ============================================================

      - name: Verify SHA256 checksums
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum \
            -c \
            SHA256SUMS.txt

          echo "All SHA256 checksums verified."

      # ============================================================
      # 42. CREATE VERIFIED ARTIFACT DIRECTORY
      # ============================================================

      - name: Prepare verified artifacts
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf artifacts

          mkdir -p artifacts

          cp \
            kernel/out/arch/arm64/boot/Image \
            artifacts/Image

          cp \
            kernel/module-stage/vendor/lib/modules/qca_cld3_wlan.ko \
            artifacts/qca_cld3_wlan.ko

          cp \
            final-kernel.config \
            artifacts/final-kernel.config

          cp \
            nethunter-config-used.config \
            artifacts/nethunter-config-used.config

          cp \
            build-manifest.txt \
            artifacts/build-manifest.txt

          cp \
            SHA256SUMS.txt \
            artifacts/SHA256SUMS.txt

          cp \
            kernel-build.log \
            artifacts/kernel-build.log

          test -s artifacts/Image
          test -s artifacts/qca_cld3_wlan.ko
          test -s artifacts/final-kernel.config
          test -s artifacts/nethunter-config-used.config
          test -s artifacts/build-manifest.txt
          test -s artifacts/SHA256SUMS.txt
          test -s artifacts/kernel-build.log

          echo "Verified artifact directory prepared."

      # ============================================================
      # 43. UPLOAD VERIFIED BUILD ARTIFACTS
      # ============================================================

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-verified
          path: |
            artifacts/Image
            artifacts/qca_cld3_wlan.ko
            artifacts/final-kernel.config
            artifacts/nethunter-config-used.config
            artifacts/build-manifest.txt
            artifacts/SHA256SUMS.txt
            artifacts/kernel-build.log
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 44. FINAL BUILD GATE
      # ============================================================

      - name: Final build gate
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "NETHUNTER KERNEL BUILD PASSED"
          echo "============================================================"

          echo
          echo "Device:"
          echo "Motorola Moto G9 Power (cebu)"

          echo
          echo "Kernel release:"
          echo "${CLEAN_RELEASE}"

          echo
          echo "Artifacts:"
          echo "  Image"
          echo "  qca_cld3_wlan.ko"
          echo "  final-kernel.config"
          echo "  nethunter-config-used.config"
          echo "  build-manifest.txt"
          echo "  SHA256SUMS.txt"
          echo "  kernel-build.log"

          echo
          echo "NO kernel partition was flashed."
          echo "NO reboot was performed."

          echo
          echo "============================================================"



      - name: Final safety and hardware configuration audit
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${GITHUB_WORKSPACE}/out/.config"
          RELEASE="${CLEAN_RELEASE}"

          echo "===== FINAL SAFETY AUDIT ====="
          echo "Expected kernel release: ${RELEASE}"

          test -f "${CONFIG}"
          test -f "${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image"

          check_config() {
            local symbol="$1"
            local expected="$2"
            local actual
            actual="$(scripts/config --file "${CONFIG}" --state "${symbol}" 2>/dev/null || true)"

            if [ "${actual}" != "${expected}" ]; then
              echo "ERROR: ${symbol}=${actual}, expected ${expected}"
              exit 1
            fi

            echo "OK: ${symbol}=${expected}"
          }

          echo
          echo "----- Touchscreen / fingerprint -----"
          check_config CONFIG_INPUT y
          check_config CONFIG_INPUT_EVDEV y
          check_config CONFIG_INPUT_TOUCHSCREEN y
          check_config CONFIG_TOUCHSCREEN_PROPERTIES y
          check_config CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI m
          check_config CONFIG_INPUT_NOVA_DRM_PANEL y
          check_config CONFIG_INPUT_TOUCHSCREEN_FOCALTECH_0FLASH_MMI m
          check_config CONFIG_INPUT_FOCALTECH_0FLASH_MMI_IC_NAME_FT8006S_AA y
          check_config CONFIG_INPUT_TOUCHSCREEN_FOCALTECH_0FLASH_MMI_DRM_PANEL y
          check_config CONFIG_INPUT_MISC_FPC1020 m
          check_config CONFIG_INPUT_MISC_FPC1020_SAVE_TO_CLASS_DEVICE y
          check_config CONFIG_INPUT_CHIPONE_FPS_MMI m

          echo
          echo "----- Qualcomm connectivity -----"
          check_config CONFIG_I2C_QCOM_GENI y
          check_config CONFIG_SPI_QCOM_GENI y
          check_config CONFIG_WLAN y
          check_config CONFIG_QCA_CLD_WLAN m
          check_config CONFIG_CNSS_UTILS y
          check_config CONFIG_CNSS_GENL y
          check_config CONFIG_QCOM_QMI_HELPERS y
          check_config CONFIG_RMNET y
          check_config CONFIG_RMNET_IPA3 y
          check_config CONFIG_IPA3 y
          check_config CONFIG_IPA_WDI_UNIFIED_API y

          echo
          echo "----- Bluetooth / HID -----"
          check_config CONFIG_HID y
          check_config CONFIG_HIDRAW y
          check_config CONFIG_UHID y
          check_config CONFIG_BT y
          check_config CONFIG_BT_BREDR y
          check_config CONFIG_BT_LE y
          check_config CONFIG_BT_RFCOMM y
          check_config CONFIG_BT_RFCOMM_TTY y
          check_config CONFIG_BT_BNEP m
          check_config CONFIG_BT_HIDP m
          check_config CONFIG_BT_HCIUART m
          check_config CONFIG_BT_HCIVHCI m

          echo
          echo "----- USB / NetHunter gadget support -----"
          check_config CONFIG_USB_GADGET y
          check_config CONFIG_USB_CONFIGFS y
          check_config CONFIG_USB_CONFIGFS_UEVENT y
          check_config CONFIG_USB_CONFIGFS_ACM y
          check_config CONFIG_USB_CONFIGFS_NCM y
          check_config CONFIG_USB_CONFIGFS_RNDIS y
          check_config CONFIG_USB_CONFIGFS_ECM y
          check_config CONFIG_USB_CONFIGFS_EEM y
          check_config CONFIG_USB_CONFIGFS_F_HID y
          check_config CONFIG_USB_SERIAL m
          check_config CONFIG_USB_SERIAL_GENERIC y
          check_config CONFIG_USB_USBNET y
          check_config CONFIG_USB_NET_CDCETHER y

          echo
          echo "----- NetHunter / packet / sensors -----"
          check_config CONFIG_SENSORS_SSC y
          check_config CONFIG_SENSORS_CLASS m
          check_config CONFIG_PACKET y

          echo
          echo "----- Release / reproducibility -----"
          check_config CONFIG_LOCALVERSION_AUTO n
          check_config CONFIG_DEBUG_INFO n

          if grep -Eq 'CONFIG_FEATURE_(FRAME_INJECTION|MONITOR_MODE_SUPPORT)' "${CONFIG}"; then
            echo "ERROR: QCACLD3 FEATURE_* variables leaked into .config"
            exit 1
          fi

          ACTUAL_RELEASE="$(
            make -s -C "${GITHUB_WORKSPACE}" \
              O=out \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          echo "Actual kernel release: ${ACTUAL_RELEASE}"

          if [ "${ACTUAL_RELEASE}" != "${RELEASE}" ]; then
            echo "ERROR: kernel release mismatch"
            exit 1
          fi

          case "${ACTUAL_RELEASE}" in
            *+*|*-dirty*)
              echo "ERROR: dirty/custom kernel release detected"
              exit 1
              ;;
          esac

          echo
          echo "===== FINAL SAFETY AUDIT PASSED ====="
          echo "No flashing performed."
          echo "No reboot performed."
          echo "No boot partition was modified by this workflow."

      - name: Verify final kernel and WLAN module
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image"
          WLAN="${GITHUB_WORKSPACE}/module-install/lib/modules/${CLEAN_RELEASE}/kernel/drivers/staging/qcacld-3.0/wlan.ko"

          echo "===== FINAL KERNEL VERIFICATION ====="

          test -s "${IMAGE}"
          test -s "${WLAN}"

          IMAGE_SIZE="$(stat -c '%s' "${IMAGE}")"
          WLAN_SIZE="$(stat -c '%s' "${WLAN}")"

          echo "Image size: ${IMAGE_SIZE}"
          echo "wlan.ko size: ${WLAN_SIZE}"

          if [ "${IMAGE_SIZE}" -lt 10000000 ]; then
            echo "ERROR: Image is unexpectedly small"
            exit 1
          fi

          if [ "${WLAN_SIZE}" -lt 1000000 ]; then
            echo "ERROR: wlan.ko is unexpectedly small"
            exit 1
          fi

          echo
          echo "Image SHA256:"
          sha256sum "${IMAGE}"

          echo
          echo "wlan.ko SHA256:"
          sha256sum "${WLAN}"

          echo
          echo "WLAN vermagic:"
          modinfo -F vermagic "${WLAN}"

          case "$(modinfo -F vermagic "${WLAN}")" in
            "${CLEAN_RELEASE}"\ *)
              echo "WLAN vermagic release matches."
              ;;
            *)
              echo "ERROR: WLAN vermagic mismatch"
              exit 1
              ;;
          esac

          echo
          echo "Checking required NetHunter modules..."

          MODULE_ROOT="${GITHUB_WORKSPACE}/module-install/lib/modules/${CLEAN_RELEASE}"

          for module in \
            hci_vhci.ko \
            hci_uart.ko \
            hidp.ko \
            bnep.ko
          do
            FOUND="$(find "${MODULE_ROOT}" -type f -name "${module}" | head -n 1 || true)"

            if [ -z "${FOUND}" ]; then
              echo "ERROR: required module missing: ${module}"
              exit 1
            fi

            echo "OK: ${FOUND}"
          done

          if find "${MODULE_ROOT}" -type f -name 'rfcomm.ko' | grep -q .; then
            echo "ERROR: rfcomm.ko exists even though RFCOMM is built-in"
            exit 1
          fi

          echo "OK: RFCOMM is built-in; no rfcomm.ko."

          echo
          echo "Checking WLAN injection symbols..."

          INJECTION_SYMBOLS=(
            hdd_init_frame_injection
            hdd_deinit_frame_injection
            hdd_frame_inject_ioctl
            hdd_frame_inject_netlink
            hdd_process_frame_injection
            hdd_check_injection_capability
            hdd_validate_injection_permissions
            wma_process_injection_queue_work
            wma_injection_ensure_tx_vdev
          )

          for symbol in "${INJECTION_SYMBOLS[@]}"; do
            if ! llvm-nm -a "${WLAN}" 2>/dev/null | grep -Eq "[[:space:]]${symbol}$"; then
              echo "ERROR: injection symbol missing: ${symbol}"
              exit 1
            fi

            echo "OK: ${symbol}"
          done

          echo
          echo "Checking for unresolved symbols..."

          if llvm-nm -u "${WLAN}" 2>/dev/null | grep -v '^$'; then
            echo "ERROR: unresolved symbols detected in wlan.ko"
            exit 1
          fi

          echo "OK: no unresolved symbols reported by llvm-nm."

          echo
          echo "===== KERNEL/MODULE VERIFICATION PASSED ====="



      - name: Prepare safe stock-boot replacement script
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/boot-builder"

          cat > "${GITHUB_WORKSPACE}/boot-builder/build-cebu-boot.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ "$#" -ne 2 ]; then
            echo "Usage:"
            echo "  $0 STOCK_BOOT.img NET HUNTER_Image"
            echo
            echo "Example:"
            echo "  $0 boot_a-stock.img Image"
            exit 2
          fi

          STOCK_BOOT="$1"
          CUSTOM_IMAGE="$2"

          command -v magiskboot >/dev/null 2>&1 || {
            echo "ERROR: magiskboot not found"
            exit 1
          }

          test -f "${STOCK_BOOT}" || {
            echo "ERROR: stock boot image not found: ${STOCK_BOOT}"
            exit 1
          }

          test -f "${CUSTOM_IMAGE}" || {
            echo "ERROR: custom Image not found: ${CUSTOM_IMAGE}"
            exit 1
          }

          WORK="$(mktemp -d)"
          trap 'rm -rf "${WORK}"' EXIT

          cp "${STOCK_BOOT}" "${WORK}/stock.img"
          cp "${CUSTOM_IMAGE}" "${WORK}/Image"

          echo "===== STOCK BOOT IMAGE AUDIT ====="

          STOCK_SIZE="$(stat -c '%s' "${WORK}/stock.img")"
          IMAGE_SIZE="$(stat -c '%s' "${WORK}/Image")"

          echo "Stock boot size: ${STOCK_SIZE}"
          echo "Custom Image size: ${IMAGE_SIZE}"

          if [ "${STOCK_SIZE}" -ne 100663296 ]; then
            echo "ERROR: unexpected stock boot size"
            exit 1
          fi

          if [ "${IMAGE_SIZE}" -lt 10000000 ]; then
            echo "ERROR: custom Image is unexpectedly small"
            exit 1
          fi

          echo
          echo "Stock boot SHA256:"
          sha256sum "${WORK}/stock.img"

          echo
          echo "Custom Image SHA256:"
          sha256sum "${WORK}/Image"

          echo
          echo "===== UNPACKING STOCK BOOT ====="

          cd "${WORK}"

          magiskboot unpack stock.img

          test -f kernel
          test -f ramdisk.cpio

          echo
          echo "Stock kernel SHA256:"
          sha256sum kernel

          echo
          echo "Stock ramdisk SHA256:"
          sha256sum ramdisk.cpio

          if [ -f dtb ]; then
            echo
            echo "Stock DTB SHA256:"
            sha256sum dtb
          fi

          echo
          echo "===== REPLACING KERNEL ONLY ====="

          cp Image kernel

          echo
          echo "New kernel SHA256:"
          sha256sum kernel

          echo
          echo "===== REPACKING ====="

          magiskboot repack stock.img

          test -f new-boot.img

          echo
          echo "New boot image size:"
          stat -c '%s' new-boot.img

          if [ "$(stat -c '%s' new-boot.img)" -ne 100663296 ]; then
            echo "ERROR: repacked boot image is not 96 MiB"
            exit 1
          fi

          echo
          echo "New boot SHA256:"
          sha256sum new-boot.img

          mkdir -p "${OLDPWD}/boot-output"

          cp new-boot.img "${OLDPWD}/boot-output/cebu-nethunter-new-boot.img"

          echo
          echo "===== BOOT IMAGE CREATED ====="
          echo "Output:"
          echo "${OLDPWD}/boot-output/cebu-nethunter-new-boot.img"

          echo
          echo "IMPORTANT:"
          echo "This script only constructs an image."
          echo "It does NOT flash the image."
          echo "It does NOT reboot the phone."
          SCRIPT

          chmod +x "${GITHUB_WORKSPACE}/boot-builder/build-cebu-boot.sh"

          cat > "${GITHUB_WORKSPACE}/boot-builder/README.txt" <<'EOF'
          Moto G9 Power cebu NetHunter safe boot-image builder

          INPUT 1:
            A verified stock boot image from the same installed ROM/build.

          INPUT 2:
            The verified NetHunter kernel Image.

          OPERATION:
            1. Validate stock boot image size.
            2. Unpack stock boot image.
            3. Preserve stock ramdisk.
            4. Preserve stock DTB.
            5. Replace ONLY the kernel.
            6. Repack boot image.
            7. Validate resulting size.
            8. Produce cebu-nethunter-new-boot.img.

          SAFETY:
            This builder does not flash anything.
            This builder does not reboot the phone.
            The original stock boot image is never modified.
          EOF

          echo
          echo "===== BOOT BUILDER PREPARED ====="
          ls -lh "${GITHUB_WORKSPACE}/boot-builder/"

      - name: Package final boot-builder artifact
        uses: actions/upload-artifact@v4
        with:
          name: cebu-nethunter-safe-boot-builder
          path: |
            boot-builder/build-cebu-boot.sh
            boot-builder/README.txt
          if-no-files-found: error



            
      - name: Build final verified package
        shell: bash
        run: |
          set -euo pipefail

          FINAL="${GITHUB_WORKSPACE}/final-package"
          rm -rf "${FINAL}"
          mkdir -p "${FINAL}"

          IMAGE="${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image"
          MODULE="${GITHUB_WORKSPACE}/module-stage/vendor/lib/modules/qca_cld3_wlan.ko"

          test -s "${IMAGE}"
          test -s "${MODULE}"

          cp "${IMAGE}" "${FINAL}/Image"
          cp "${MODULE}" "${FINAL}/qca_cld3_wlan.ko"

          cp "${GITHUB_WORKSPACE}/out/.config" \
            "${FINAL}/final-kernel.config"

          cp "${GITHUB_WORKSPACE}/kernel/nethunter-config/cebu-nethunter.config" \
            "${FINAL}/nethunter-config-used.config"

          cp "${GITHUB_WORKSPACE}/build-manifest.txt" \
            "${FINAL}/build-manifest.txt"

          cp "${GITHUB_WORKSPACE}/kernel-build.log" \
            "${FINAL}/kernel-build.log"

          cat > "${FINAL}/FLASH-ORDER.txt" <<'EOF'
          MOTO G9 POWER CEBU NETHUNTER

          STATUS:
          KERNEL BUILD VERIFIED.

          IMPORTANT:
          This package does NOT contain an automatically flashed boot image.

          DO NOT:
          - flash Image directly to boot
          - use AnyKernel3
          - reboot before the boot image has passed verification
          - overwrite boot_b
          - erase vbmeta
          - disable AVB
          - flash an unverified image

          The correct future sequence is:

          1. Preserve the verified stock boot image.
          2. Replace ONLY its kernel with the verified Image.
          3. Repack the boot image.
          4. Verify kernel, ramdisk and DTB.
          5. Verify boot image size and structure.
          6. Verify the resulting image against the expected build.
          7. Only then consider flashing boot_a.
          8. Keep the stock boot_a backup available for immediate restoration.

          No flashing is performed by this workflow.
          No reboot is performed by this workflow.
          EOF

          (
            cd "${FINAL}"
            sha256sum \
              Image \
              qca_cld3_wlan.ko \
              final-kernel.config \
              nethunter-config-used.config \
              build-manifest.txt \
              kernel-build.log \
              FLASH-ORDER.txt \
              > SHA256SUMS.txt
          )

          echo
          echo "===== FINAL PACKAGE ====="
          find "${FINAL}" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

          echo
          echo "===== FINAL CHECKSUMS ====="
          cat "${FINAL}/SHA256SUMS.txt"

          echo
          echo "===== CHECKSUM VERIFICATION ====="
          (
            cd "${FINAL}"
            sha256sum -c SHA256SUMS.txt
          )

          echo
          echo "===== FINAL PACKAGE VERIFIED ====="

      - name: Upload final verified package
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-final-verified
          path: final-package/
          if-no-files-found: error

      - name: Final no-flash safety gate
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " MOTO G9 POWER CEBU NETHUNTER BUILD COMPLETE"
          echo "=============================================="
          echo
          echo "Kernel build: VERIFIED"
          echo "Kernel configuration: VERIFIED"
          echo "WLAN module: VERIFIED"
          echo "Injection symbols: VERIFIED"
          echo "Touchscreen configuration: VERIFIED"
