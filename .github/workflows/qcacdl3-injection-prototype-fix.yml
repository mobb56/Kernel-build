name: QCACLD3 Injection Prototype - QDF Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git clang lld llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex \
            libssl-dev libelf-dev pahole \
            cpio python3 rsync ripgrep

      - name: Clone kernel
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            kernel

      - name: Clone Motorola QCACLD3
        run: |
          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qcacld-3.0.git \
            qcacld3

      - name: Clone Motorola host common
        run: |
          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qca-wifi-host-cmn.git \
            qca-wifi-host-cmn

      - name: Clone Motorola FW API
        run: |
          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-fw-api.git \
            fw-api

      - name: Clone reference injection source
        run: |
          git clone --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            reference

      - name: Copy minimal injection prototype
        run: |
          set -e

          mkdir -p \
            qcacld3/core/wma/inc \
            qcacld3/core/wma/src \
            qcacld3/core/hdd/inc \
            qcacld3/core/hdd/src

          cp reference/drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h \
             qcacld3/core/wma/inc/

          cp reference/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c \
             qcacld3/core/wma/src/

          cp reference/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject.h \
             qcacld3/core/hdd/inc/

          cp reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c \
             qcacld3/core/hdd/src/

          cp reference/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_validate.h \
             qcacld3/core/hdd/inc/

          cp reference/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_validate.c \
             qcacld3/core/hdd/src/

      - name: Prepare kernel
        run: |
          set -e

          mkdir -p out

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules_prepare

      - name: Verify required headers
        run: |
          set -e

          echo "=== athdefs.h ==="
          test -f kernel/drivers/staging/fw-api/fw/athdefs.h
          realpath kernel/drivers/staging/fw-api/fw/athdefs.h

          echo
          echo "=== qdf_nbuf.h ==="
          find qca-wifi-host-cmn kernel \
            -type f \
            -name qdf_nbuf.h \
            -print

          test -f qca-wifi-host-cmn/qdf/inc/qdf_nbuf.h

          echo
          echo "=== QDF include directory ==="
          realpath qca-wifi-host-cmn/qdf/inc

      - name: Build QCACLD3
        id: qcacld-build
        continue-on-error: true
        run: |
          set -o pipefail

          KERNEL="$PWD/kernel"
          OUT="$PWD/out"
          WLAN="$PWD/qcacld3"
          COMMON="$PWD/qca-wifi-host-cmn"
          FWAPI="$PWD/fw-api"

          FWAPI_INC="$KERNEL/drivers/staging/fw-api/fw"
          QDF_INC="$COMMON/qdf/inc"
          QDF_LINUX="$COMMON/qdf/linux/src"
          QDF_LINUX_INC="$COMMON/qdf/linux/inc"

          echo "=== Build paths ==="
          echo "KERNEL=$KERNEL"
          echo "OUT=$OUT"
          echo "WLAN=$WLAN"
          echo "COMMON=$COMMON"
          echo "FWAPI=$FWAPI"
          echo "FWAPI_INC=$FWAPI_INC"
          echo "QDF_INC=$QDF_INC"
          echo "QDF_LINUX=$QDF_LINUX"
          echo "QDF_LINUX_INC=$QDF_LINUX_INC"

          KCFLAGS="\
          -I$FWAPI_INC \
          -I$QDF_INC \
          -I$QDF_LINUX \
          -I$QDF_LINUX_INC"

          echo
          echo "KCFLAGS=$KCFLAGS"

          make -C "$KERNEL" \
            O="$OUT" \
            M="$WLAN" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="$KCFLAGS" \
            modules \
            WLAN_ROOT="$WLAN" \
            WLAN_COMMON_ROOT="$COMMON" \
            WLAN_COMMON_INC="$COMMON" \
            WLAN_FW_API="$FWAPI" \
            WLAN_PROFILE=default \
            DYNAMIC_SINGLE_CHIP= \
            MODNAME=wlan \
            BOARD_PLATFORM=bengal \
            CONFIG_QCA_CLD_WLAN=m \
            2>&1 | tee report-build.log

      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p report

          cp report-build.log report/qcacld3-build.log 2>/dev/null || true

          {
            echo "=== fatal errors ==="
            grep -n -C 5 "fatal error" \
              report-build.log || true

            echo
            echo "=== compiler errors ==="
            grep -n -C 4 "error:" \
              report-build.log || true

            echo
            echo "=== warnings ==="
            grep -n -C 2 "warning:" \
              report-build.log | head -n 300 || true

            echo
            echo "=== missing headers ==="
            grep -n \
              "file not found" \
              report-build.log || true
          } > report/compiler-diagnostics.txt

      - name: Search QDF headers
        if: always()
        run: |
          {
            echo "=== qdf_nbuf.h ==="
            find qca-wifi-host-cmn -type f \
              \( -name 'qdf_nbuf.h' \
              -o -name 'i_qdf_nbuf.h' \
              -o -name 'qdf_types.h' \
              -o -name 'qdf_util.h' \
              -o -name 'qdf_lock.h' \) \
              -print

            echo
            echo "=== QDF include tree ==="
            find qca-wifi-host-cmn/qdf/inc \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
          } > report/qdf-headers.txt

      - name: Locate generated modules
        if: always()
        run: |
          {
            echo "=== qca_cld3_wlan.ko ==="
            find . \
              -type f \
              -name qca_cld3_wlan.ko \
              -print || true

            echo
            echo "=== all kernel modules ==="
            find . \
              -type f \
              -name '*.ko' \
              -print || true
          } > report/generated-modules.txt

      - name: Conclusion
        if: always()
        run: |
          {
            echo "=== QCACLD3 QDF dependency test ==="
            echo

            if find . -type f -name qca_cld3_wlan.ko | grep -q .; then
              echo "RESULT: QCACLD3 MODULE GENERATED"
              find . -type f -name qca_cld3_wlan.ko -print
            else
              echo "RESULT: MODULE NOT GENERATED"
              echo
              echo "Inspect compiler-diagnostics.txt for the next dependency/API barrier."
            fi

            echo
            echo "Headers supplied:"
            echo "  $PWD/kernel/drivers/staging/fw-api/fw"
            echo "  $PWD/qca-wifi-host-cmn/qdf/inc"
            echo "  $PWD/qca-wifi-host-cmn/qdf/linux/src"
            echo "  $PWD/qca-wifi-host-cmn/qdf/linux/inc"
          } > report/CONCLUSION.txt

      - name: Package report
        if: always()
        run: |
          mkdir -p artifact
          cp -r report artifact/

          cd artifact
          zip -r ../qcacld3-qdf-fix-report.zip .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-qdf-fix-report
          path: qcacld3-qdf-fix-report.zip
          if-no-files-found: error
