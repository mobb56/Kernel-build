        echo "=== Patching single management-TX completion ==="

        awk '
        BEGIN {
            patched = 0
        }

        !patched && /mgmt_txrx_get_nbuf[[:space:]]*\(/ {
            print "        /* NETHUNTER_INJECTION_COMPLETION_BRIDGE */"
            print "#ifdef FEATURE_FRAME_INJECTION_SUPPORT"
            print "        if (WMA_IS_INJECTION_DESC_ID(desc_id)) {"
            print "                QDF_STATUS injection_status;"
            print ""
            print "                injection_status ="
            print "                        wma_handle_injection_fw_response("
            print "                                wma_handle, desc_id, status);"
            print ""
            print "                if (injection_status != QDF_STATUS_SUCCESS)"
            print "                        wma_err(\"Failed to process injection completion: %d\","
            print "                                injection_status);"
            print ""
            print "                return 0;"
            print "        }"
            print "#endif"
            print ""
            print
            patched = 1
            next
        }

        {
            print
        }

        END {
            if (!patched) {
                print "ERROR: Could not find normal MGMT TX descriptor lookup."
                exit 3
            }
        }
        ' "$WMA_MGMT" > "${WMA_MGMT}.new"

        mv "${WMA_MGMT}.new" "$WMA_MGMT"

        echo
        echo "=== Patching bundled management-TX completion ==="

        awk '
        BEGIN {
            patched = 0
        }

        !patched &&
        /for \(i = 0; i < num_reports; i\+\+\)/ {

            print
            print "        {"
            print "                uint32_t injection_desc_id = desc_ids[i];"
            print ""
            print "#ifdef FEATURE_FRAME_INJECTION_SUPPORT"
            print "                if (WMA_IS_INJECTION_DESC_ID(injection_desc_id)) {"
            print "                        QDF_STATUS injection_status;"
            print ""
            print "                        injection_status ="
            print "                                wma_handle_injection_fw_response("
            print "                                        wma_handle,"
            print "                                        injection_desc_id,"
            print "                                        status[i]);"
            print ""
            print "                        if (injection_status != QDF_STATUS_SUCCESS)"
            print "                                wma_err(\"Failed to process bundled injection completion: %d\","
            print "                                        injection_status);"
            print ""
            print "                        continue;"
            print "                }"
            print "#endif"
            print "        }"

            patched = 1
            next
        }

        {
            print
        }

        END {
            if (!patched) {
                print "ERROR: Could not find management bundle completion loop."
                exit 4
            }
        }
        ' "$WMA_MGMT" > "${WMA_MGMT}.new"

        mv "${WMA_MGMT}.new" "$WMA_MGMT"

        echo
        echo "=== Verifying injection completion API ==="

        grep -n \
          'wma_handle_injection_fw_response' \
          "$WMA_MGMT"

        echo
        echo "Injection completion routing patch completed successfully."
