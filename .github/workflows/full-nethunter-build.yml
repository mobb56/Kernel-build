            drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c

          echo "CAP_NET_RAW check confirmed."

          echo
          echo "=== No-flash / no-reboot safety check ==="

          if grep -RniE \
            'fastboot[[:space:]]+(flash|boot)|adb[[:space:]]+reboot|reboot[[:space:]]+bootloader|reboot[[:space:]]+recovery|dd[[:space:]]+if=.*of=/dev/block' \
            .github/workflows \
            --exclude-dir=.git; then
            echo "ERROR: Dangerous flash/reboot command detected in workflow."
            exit 1
          fi

          echo "No flash or reboot commands detected."

          echo
          echo "=== AnyKernel3 safety check ==="

          if grep -Rni \
            'AnyKernel3\|anykernel' \
            .github/workflows \
            --exclude-dir=.git; then
            echo "ERROR: AnyKernel3 reference detected in workflow."
            exit 1
          fi

          echo "No AnyKernel3 workflow operation detected."

          echo
          echo "=== Final Part 9 manifest ==="

          {
            echo "KERNEL_RELEASE=${KERNEL_RELEASE}"
            echo "IMAGE=${IMAGE}"
            echo "IMAGE_SIZE=${IMAGE_SIZE}"
            echo "BOOT_PARTITION_BYTES=${BOOT_PARTITION_BYTES}"
            echo "WLAN_MODULE=${WLAN_MODULE}"
            echo "CONFIG_MODVERSIONS=y"
            echo "FRAME_INJECTION_KBUILD=y"
            echo "MONITOR_MODE_KBUILD=y"
            echo "CAP_NET_RAW=confirmed"
            echo "FEATURE_SYMBOLS_IN_CONFIG=absent"
            echo "FLASH_COMMANDS=absent"
            echo "REBOOT_COMMANDS=absent"
            echo "ANYKERNEL3=absent"
          } > ../artifacts/source-audit/part9-final-safety.txt

          cat ../artifacts/source-audit/part9-final-safety.txt

          echo
          echo "=== PART 9 PASSED ==="
          echo "Kernel passed the final static safety and integrity gate."


       
      - name: Package verified kernel artifacts
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Part 8: artifact packaging ==="

          ARTIFACT_DIR="../artifacts/nethunter-cebu"
          MODULE_DIR="${ARTIFACT_DIR}/modules"

          rm -rf "${ARTIFACT_DIR}"
          mkdir -p "${MODULE_DIR}"

          IMAGE="${OUT_DIR}/arch/arm64/boot/Image"

          test -s "${IMAGE}"
          test -f "../artifacts/source-audit/part7-result.txt"

          echo
          echo "=== Copy kernel ==="

          cp -f "${IMAGE}" "${ARTIFACT_DIR}/Image"

          echo
          echo "=== Copy compiled modules ==="

          MODULE_COUNT=0

          while IFS= read -r module; do
            [ -n "${module}" ] || continue

            relative="${module#${OUT_DIR}/}"

            mkdir -p \
              "${MODULE_DIR}/$(dirname "${relative}")"

            cp -f \
              "${module}" \
              "${MODULE_DIR}/${relative}"

            MODULE_COUNT=$((MODULE_COUNT + 1))
          done < <(find "${OUT_DIR}" -type f -name '*.ko' | sort)

          if [ "${MODULE_COUNT}" -eq 0 ]; then
            echo "ERROR: No modules were packaged."
            exit 1
          fi

          echo "Packaged modules: ${MODULE_COUNT}"

          echo
          echo "=== Copy verification reports ==="

          cp -f \
            ../artifacts/source-audit/part7-result.txt \
            "${ARTIFACT_DIR}/part7-result.txt"

          cp -f \
            ../artifacts/source-audit/qcacld3-symbols.txt \
            "${ARTIFACT_DIR}/qcacld3-symbols.txt"

          cp -f \
            ../artifacts/source-audit/built-modules.txt \
            "${ARTIFACT_DIR}/built-modules.txt"

          cp -f \
            ../artifacts/source-audit/kernel-Image.sha256 \
            "${ARTIFACT_DIR}/kernel-Image.sha256"

          echo
          echo "=== Generate artifact checksums ==="

          (
            cd "${ARTIFACT_DIR}"
            find . -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > "${ARTIFACT_DIR}/SHA256SUMS"

          echo
          echo "=== Generate artifact manifest ==="

          {
            echo "Device: Motorola Moto G9 Power (cebu)"
            echo "ROM: LineageOS 23.2 / Android 16"
            echo "Kernel base: Linux 4.19.325"
            echo "Architecture: arm64"
            echo "Artifact type: verified kernel build output"
            echo "Flashable boot image: NO"
            echo "AnyKernel3: NO"
            echo "Flashing performed by workflow: NO"
            echo "Reboot performed by workflow: NO"
            echo "Compiled modules: ${MODULE_COUNT}"
            echo
            echo "Kernel SHA256:"
            sha256sum "${ARTIFACT_DIR}/Image"
            echo
            echo "Contents:"
            find "${ARTIFACT_DIR}" -type f -printf '%P\n' | sort
          } > "${ARTIFACT_DIR}/MANIFEST.txt"

          echo
          echo "=== Verify packaged kernel ==="

          test -s "${ARTIFACT_DIR}/Image"
          test -s "${ARTIFACT_DIR}/SHA256SUMS"
          test -s "${ARTIFACT_DIR}/MANIFEST.txt"

          echo
          echo "=== Artifact tree ==="

          find "${ARTIFACT_DIR}" -type f -printf '%P\n' | sort

          echo
          echo "=== PART 10 PASSED ==="background: 



      - name: Upload verified kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cebu-nethunter-verified-kernel
          path: artifacts/nethunter-cebu
          if-no-files-found: error
          retention-days: 30

       
          
           




           
