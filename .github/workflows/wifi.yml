            'hdd_set_station_ops|wlan_mon_drv_ops|wlan_drv_ops' \
            "$HDD_SRC" 2>/dev/null || true
          exit 1
        fi

        echo "Target: $TARGET"

        echo
        echo "=== NORMALIZING hdd_set_station_ops() ==="

        awk '
        BEGIN {
            in_func = 0
            depth = 0
            found = 0
        }

        !in_func &&
        /hdd_set_station_ops[[:space:]]*\(struct net_device[[:space:]]*\*dev\)/ {

            if (found == 0) {
                print "void hdd_set_station_ops(struct net_device *dev)"
                print "{"
                print "\tstruct hdd_adapter *adapter = WLAN_HDD_GET_PRIV_PTR(dev);"
                print ""
                print "\tif (cds_get_conparam() == QDF_GLOBAL_MONITOR_MODE ||"
                print "\t    (adapter && adapter->device_mode == QDF_MONITOR_MODE)) {"
                print "\t\tdev->netdev_ops = &wlan_mon_drv_ops;"
                print "\t} else {"
                print "\t\tdev->netdev_ops = &wlan_drv_ops;"
                print "\t}"
                print ""
                print "\tdev->ethtool_ops = &wlan_ethtool_ops;"
                print "}"

                found = 1
            }

            in_func = 1
            depth = 0
            next
        }

        in_func {
            opens = gsub(/\{/, "{")
            closes = gsub(/\}/, "}")
            depth += opens - closes

            if (depth <= 0)
                in_func = 0

            next
        }

        {
            print
        }

        END {
            if (found != 1) {
                print "ERROR: hdd_set_station_ops() not replaced." > "/dev/stderr"
                exit 2
            }
        }
        ' "$TARGET" > "$TARGET.tmp"

        mv "$TARGET.tmp" "$TARGET"

        echo
        echo "=== VERIFYING FUNCTION ==="

        awk '
        /hdd_set_station_ops[[:space:]]*\(struct net_device[[:space:]]*\*dev\)/ {
            in_func = 1
            depth = 0
        }

        in_func {
            print

            opens = gsub(/\{/, "{")
            closes = gsub(/\}/, "}")
            depth += opens - closes

            if (depth == 0 && opens > 0)
                exit
        }
        ' "$TARGET"

        echo
        echo "=== VERIFYING MONITOR ROUTING ==="

        awk '
        /hdd_set_station_ops[[:space:]]*\(struct net_device[[:space:]]*\*dev\)/ {
            in_func = 1
            depth = 0
        }

        in_func {
            body = body $0 "\n"

            opens = gsub(/\{/, "{")
            closes = gsub(/\}/, "}")
            depth += opens - closes

            if (depth == 0 && opens > 0) {
                if (body !~ /QDF_GLOBAL_MONITOR_MODE/)
                    exit 2

                if (body !~ /QDF_MONITOR_MODE/)
                    exit 3

                if (body !~ /wlan_mon_drv_ops/)
                    exit 4

                if (body !~ /wlan_drv_ops/)
                    exit 5

                if (body !~ /wlan_ethtool_ops/)
                    exit 6

                exit 0
            }
        }
        ' "$TARGET"

        echo
        echo "=========================================="
        echo "PER-INTERFACE MONITOR ROUTING: PASS"
        echo "DUPLICATE DEFINITIONS: NORMALIZED"
        echo "MONITOR NETDEV OPS: PRESENT"
        echo "NORMAL WLAN OPS: PRESENT"
        echo "=========================================="

        exit 0
