                }
              }
            ' "${MAIN_C}" > "${TMP_C}"

            test -s "${TMP_C}"
            mv "${TMP_C}" "${MAIN_C}"

            echo "Frame-injection deinitialization inserted."
          fi

          echo
          echo "=== Verifying correct deinitialization location ==="

          grep -n -A5 -B5 \
            'hdd_deinit_frame_injection(adapter);' \
            "${MAIN_C}"

          echo
          echo "=== Frame-injection deinitialization passed ==="



      
      

      
      # ============================================================
      # 33. FIX QCACLD3 WLAN STATE-DEVICE LIFECYCLE
      #
      # REAL SOURCE FIX:
      #
      #   Remove:
      #       wlan_hdd_state_ctrl_param_destroy();
      #
      #   from its current teardown location and place it directly
      #   after the module's hdd_driver_unload(); call.
      #
      # This prevents the /sys/class/wlan object from surviving
      # module unload and causing:
      #
      #   kobject_add_internal failed for wlan with -EEXIST
      # ============================================================

      - name: Fix QCACLD3 module lifecycle cleanup
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          MAIN_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"

          test -f "${MAIN_C}"

          echo "=== Applying REAL QCACLD3 lifecycle fix ==="

          python3 - "${MAIN_C}" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          DESTROY = "wlan_hdd_state_ctrl_param_destroy();"
          UNLOAD = "hdd_driver_unload();"

          # --------------------------------------------------------
          # Safety checks
          # --------------------------------------------------------

          destroy_count = text.count(DESTROY)
          unload_count = text.count(UNLOAD)

          print(f"Existing destroy calls: {destroy_count}")
          print(f"hdd_driver_unload() calls: {unload_count}")

          if destroy_count != 1:
              raise SystemExit(
                  "ERROR: expected exactly ONE existing "
                  "wlan_hdd_state_ctrl_param_destroy(); call."
