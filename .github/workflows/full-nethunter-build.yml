          echo "PASS: FEATURE_MONITOR_MODE_SUPPORT is Kbuild-only."

      # ============================================================
      # 37. SAVE SOURCE MODIFICATION MANIFEST
      # ============================================================

      - name: Save QCACLD3 modification manifest
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          {
            echo "============================================================"
            echo "QCACLD3 NETHUNTER INTEGRATION"
            echo "============================================================"
            echo
            echo "Frame injection: enabled"
