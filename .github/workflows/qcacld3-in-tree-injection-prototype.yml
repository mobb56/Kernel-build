name: QCACLD3 Baseline and Injection Probe v19

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            clang lld llvm libssl-dev libelf-dev \
            python3 cpio rsync unzip

      - name: Clone kernel and reference
        run: |
          set -eux

          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$GITHUB_WORKSPACE/kernel"

          git clone --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            "$GITHUB_WORKSPACE/reference"

      - name: Set paths
        run: |
          set -eux

          echo "KERNEL=$GITHUB_WORKSPACE/kernel" >> "$GITHUB_ENV"
          echo "REFERENCE=$GITHUB_WORKSPACE/reference" >> "$GITHUB_ENV"
          echo "OUT=$GITHUB_WORKSPACE/out" >> "$GITHUB_ENV"
          echo "QCACLD=$GITHUB_WORKSPACE/kernel/drivers/staging/qcacld-3.0" >> "$GITHUB_ENV"

      - name: Show paths
        run: |
          set -eux

          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "KERNEL=$KERNEL"
          echo "OUT=$OUT"
          echo "QCACLD=$QCACLD"

          test -d "$KERNEL"
          test -d "$QCACLD"
          test -d "$REFERENCE"

      # ------------------------------------------------------------
      # STEP 1: Configure the completely unmodified kernel
      # ------------------------------------------------------------

      - name: Configure kernel
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          ./scripts/config \
            --file "$OUT/.config" \
            --module CONFIG_QCA_CLD_WLAN

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            prepare

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_prepare

      - name: Verify configuration
        run: |
          set -eux

          echo "=== Configuration files ==="

          test -f "$OUT/.config"
          test -f "$OUT/include/config/auto.conf"

          echo "CONFIGURATION=PASS"

          grep '^CONFIG_QCA_CLD_WLAN=' "$OUT/.config" || true

      # ------------------------------------------------------------
      # STEP 2: Build completely unmodified QCACLD3
      # ------------------------------------------------------------

      - name: Build baseline QCACLD3
        working-directory: ${{ env.KERNEL }}
        run: |
          set +e

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/staging/qcacld-3.0 \
            modules \
            2>&1 | tee "$GITHUB_WORKSPACE/baseline.log"

          rc=${PIPESTATUS[0]}

          echo "BASELINE_EXIT=$rc" \
            | tee "$GITHUB_WORKSPACE/baseline-result.txt"

          if [ "$rc" -ne 0 ]; then
            echo "BASELINE_QCACLD3=FAIL" \
              | tee "$GITHUB_WORKSPACE/baseline-status.txt"
          else
            echo "BASELINE_QCACLD3=PASS" \
              | tee "$GITHUB_WORKSPACE/baseline-status.txt"
          fi

          exit "$rc"

      # ------------------------------------------------------------
      # STEP 3: Confirm baseline output
      # ------------------------------------------------------------

      - name: Verify baseline module
        run: |
          set -eux

          echo "=== Baseline module search ==="

          find "$OUT" \
            -type f \
            \( -name 'wlan.ko' -o -name 'wlan.o' \) \
            -print

          if find "$OUT" \
            -type f \
            -name 'wlan.ko' \
            -print -quit | grep -q .; then

            echo "BASELINE_MODULE=PASS" \
              | tee "$GITHUB_WORKSPACE/baseline-module-status.txt"

          else

            echo "BASELINE_MODULE=FAIL" \
              | tee "$GITHUB_WORKSPACE/baseline-module-status.txt"

            exit 1
          fi

      # ------------------------------------------------------------
      # STEP 4: Import ONLY the minimum injection files
      # ------------------------------------------------------------

      - name: Import minimal injection source
        run: |
          set -eux

          SRC="$REFERENCE/drivers/staging/qcacld-3.0"

          cp \
            "$SRC/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "$QCACLD/core/hdd/src/"

          
          cp "$SRC/core/hdd/inc/wlan_hdd_frame_validate.h" \
            "$QCACLD/core/hdd/src/"

          cp \
            "$SRC/core/hdd/inc/wlan_hdd_inject_security.h" \
            "$QCACLD/core/hdd/src/"

            cp \
            "$SRC/core/hdd/inc/wlan_hdd_frame_inject_debug.h" \
            "$QCACLD/core/hdd/src/"

          cp \
            "$SRC/core/hdd/src/wlan_hdd_frame_inject.c" \
            "$QCACLD/core/hdd/src/"

         

          echo "Imported:"
          ls -lh \
          "$QCACLD/core/hdd/src/wlan_hdd_frame_inject.h" \
          "$QCACLD/core/hdd/src/wlan_hdd_frame_validate.h" \
          "$QCACLD/core/hdd/src/wlan_hdd_inject_security.h" \
          "$QCACLD/core/hdd/src/wlan_hdd_frame_inject_debug.h" \
          "$QCACLD/core/hdd/src/wlan_hdd_frame_inject.c"

      # ------------------------------------------------------------
      # STEP 5: Temporarily add ONE object
      # ------------------------------------------------------------

      - name: Patch one injection object
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          cp \
            drivers/staging/qcacld-3.0/Kbuild \
            drivers/staging/qcacld-3.0/Kbuild.v19-original

          python3 <<'PY'
          from pathlib import Path

          p = Path("drivers/staging/qcacld-3.0/Kbuild")
          s = p.read_text()

          marker = "obj-$(CONFIG_QCA_CLD_WLAN) += $(MODNAME).o"

          if marker not in s:
              raise SystemExit("Kbuild marker not found")

          addition = r'''
          # v19 single-object injection probe
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT

          '''

          s = s.replace(marker, addition + marker, 1)
          p.write_text(s)
          PY

          grep -n \
            -A5 \
            -B2 \
            'v19 single-object injection probe' \
            drivers/staging/qcacld-3.0/Kbuild

      # ------------------------------------------------------------
      # STEP 6: Compile ONLY the injection probe
      # ------------------------------------------------------------

      - name: Build injection probe
        working-directory: ${{ env.KERNEL }}
        run: |
          set +e

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/staging/qcacld-3.0 \
            modules \
            2>&1 | tee "$GITHUB_WORKSPACE/injection-probe.log"

          rc=${PIPESTATUS[0]}

          echo "INJECTION_PROBE_EXIT=$rc" \
            | tee "$GITHUB_WORKSPACE/injection-probe-result.txt"

          if grep -q \
            'CC.*wlan_hdd_frame_inject.o' \
            "$GITHUB_WORKSPACE/injection-probe.log"; then

            echo "INJECTION_OBJECT_REACHED=YES" \
              | tee "$GITHUB_WORKSPACE/injection-object-status.txt"

          else

            echo "INJECTION_OBJECT_REACHED=NO" \
              | tee "$GITHUB_WORKSPACE/injection-object-status.txt"

          fi

          exit "$rc"

      # ------------------------------------------------------------
      # STEP 7: Collect concise diagnostics
      # ------------------------------------------------------------

      - name: Collect diagnostics
        if: always()
        run: |
          set +e

          mkdir -p "$GITHUB_WORKSPACE/report"

          cp "$GITHUB_WORKSPACE/baseline.log" \
            "$GITHUB_WORKSPACE/report/" 2>/dev/null || true

          cp "$GITHUB_WORKSPACE/injection-probe.log" \
            "$GITHUB_WORKSPACE/report/" 2>/dev/null || true

          cp "$GITHUB_WORKSPACE/"*-status.txt \
            "$GITHUB_WORKSPACE/report/" 2>/dev/null || true

          cp "$GITHUB_WORKSPACE/"*-result.txt \
            "$GITHUB_WORKSPACE/report/" 2>/dev/null || true

          echo "=== Relevant errors ===" \
            > "$GITHUB_WORKSPACE/report/errors.txt"

          grep -Ei \
            'error:|fatal error:|Argument list too long|No rule to make|undefined reference|auto.conf' \
            "$GITHUB_WORKSPACE/injection-probe.log" \
            >> "$GITHUB_WORKSPACE/report/errors.txt" \
            2>/dev/null || true

      - name: Create report
        if: always()
        run: |
          set +e

          cd "$GITHUB_WORKSPACE"

          zip -r \
            qcacld3-v19-report.zip \
            report

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-v19-report
          path: |
            qcacld3-v19-report.zip
            baseline.log
            injection-probe.log
            baseline-status.txt
            baseline-module-status.txt
            injection-object-status.txt
            baseline-result.txt
            injection-probe-result.txt
          if-no-files-found: error
          retention-days: 14
