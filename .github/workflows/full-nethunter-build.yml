              echo "Stock: ${stock_value}"
              echo "Final: ${final_value}"
              exit 1
            fi

            echo "UNCHANGED: ${stock_value}"
          }

          check_same CONFIG_USB_GADGET
          check_same CONFIG_USB_CONFIGFS
          check_same CONFIG_USB_CONFIGFS_UEVENT
          check_same CONFIG_USB_CONFIGFS_ACM
          check_same CONFIG_USB_CONFIGFS_NCM

          echo
