name: WiFi Monitor VDEV Investigation

on:
  workflow_dispatch:

jobs:
  investigate-wifi:
    name: Investigate QCACLD3 Monitor Mode
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6225
          ref: lineage-23.2
          fetch-depth: 1

      - name: Verify kernel source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CEBU WIFI INVESTIGATION"
          echo "=========================================="

          echo "Kernel:"
          make -s kernelversion || true

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Defconfig:"
          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          echo "OK"

          echo
          echo "QCACLD3:"
          test -d drivers/staging/qcacld-3.0
          echo "OK"

      - name: Trace monitor VDEV-UP architecture
        shell: bash
        run: |
          set -euo pipefail

          SRC="drivers/staging/qcacld-3.0"
          OUT="$GITHUB_WORKSPACE/wifi-vdev-investigation.txt"

          : > "$OUT"

          log() {
            echo "$@" | tee -a "$OUT"
          }

          trace_symbol() {
            local SYMBOL="$1"

            log ""
            log "============================================================"
            log "SYMBOL: $SYMBOL"
            log "============================================================"

            find "$SRC" -type f \
              \( -name '*.c' -o -name '*.h' \) -print0 |
            xargs -0 grep -nF "$SYMBOL" 2>/dev/null |
            head -n 100 |
            tee -a "$OUT" || true
          }

          log "============================================================"
          log " QCACLD3 MONITOR/VDEV-UP INVESTIGATION"
          log "============================================================"
          log "Kernel commit: $(git rev-parse HEAD)"
          log ""

          # HDD monitor channel path
          trace_symbol "__wlan_hdd_cfg80211_set_mon_ch"

          # Monitor VDEV-UP SME event
          trace_symbol "sme_process_monitor_mode_vdev_up_evt"

          # HDD callback which should wake the waiting event
          trace_symbol "hdd_sme_monitor_mode_callback"

          # Callback registration
          trace_symbol "sme_set_monitor_mode_cb"

          # MLME VDEV-UP
          trace_symbol "sta_mlme_vdev_up_send"

          # MLME START continuation
          trace_symbol "sta_mlme_vdev_start_continue"

          # VDEV START response
          trace_symbol "WMI_VDEV_START_RESP_EVENTID"

          log ""
          log "============================================================"
          log "VDEV START / VDEV UP REFERENCES"
          log "============================================================"

          git grep -n -E \
            'VDEV_START|VDEV_UP|vdev_start|vdev_up' \
            -- "$SRC" |
            head -n 300 |
            tee -a "$OUT" || true

          log ""
          log "============================================================"
          log "MONITOR MODE REFERENCES"
          log "============================================================"

          git grep -n -Ei \
            'monitor_mode|monitor.*vdev|vdev.*monitor' \
            -- "$SRC" |
            head -n 300 |
            tee -a "$OUT" || true

          log ""
          log "============================================================"
          log "WMI EVENT REGISTRATION"
          log "============================================================"

          git grep -n \
            'wmi_unified_register_event_handler' \
            -- "$SRC" |
            grep -Ei 'vdev|start|up|monitor' |
            head -n 250 |
            tee -a "$OUT" || true

      - name: Inspect monitor event implementation
        shell: bash
        run: |
          set -euo pipefail

          SRC="drivers/staging/qcacld-3.0"
          OUT="$GITHUB_WORKSPACE/wifi-vdev-context.txt"

          : > "$OUT"

          {
            echo "============================================================"
            echo "TARGETED SOURCE CONTEXT"
            echo "============================================================"

            for symbol in \
              "sme_process_monitor_mode_vdev_up_evt" \
              "sta_mlme_vdev_up_send" \
              "sta_mlme_vdev_start_continue" \
              "hdd_sme_monitor_mode_callback" \
              "__wlan_hdd_cfg80211_set_mon_ch"
            do
              echo
              echo "############################################################"
              echo "### $symbol"
              echo "############################################################"

              git grep -n -B 12 -A 20 "$symbol" -- "$SRC" || true
            done
          } | tee "$OUT"

      - name: Inspect relevant event IDs
        shell: bash
        run: |
          set -euo pipefail

          SRC="drivers/staging/qcacld-3.0"
          OUT="$GITHUB_WORKSPACE/wifi-event-ids.txt"

          {
            echo "============================================================"
            echo "VDEV EVENT IDS"
            echo "============================================================"

            git grep -n -E \
              'WMI_.*VDEV.*(START|UP|STOP|DOWN).*EVENTID|VDEV_.*EVENTID' \
              -- "$SRC" |
              head -n 400 || true

            echo
            echo "============================================================"
            echo "MONITOR EVENT DEFINITIONS"
            echo "============================================================"

            git grep -n -Ei \
              'MONITOR.*EVENT|EVENT.*MONITOR|MONITOR_MODE.*EVENT' \
              -- "$SRC" |
              head -n 300 || true
          } | tee "$OUT"








      - name: Trace monitor VDEV startup
        shell: bash
        run: |
          set -eu
          SRC="drivers/staging/qcacld-3.0"

          echo "===== LIM MONITOR START ====="
          git grep -n -B 20 -A 35 \
            "lim_mon_mlme_vdev_start_send" -- "$SRC" || true

          echo "===== MONITOR START CONTINUATION ====="
          git grep -n -B 15 -A 35 \
            "wma_mon_mlme_vdev_start_continue" -- "$SRC" || true

          echo "===== MONITOR VDEV-UP SEND ====="
          git grep -n -B 15 -A 35 \
            "wma_mon_mlme_vdev_up_send" -- "$SRC" || true

          echo "===== COMPLETION EVENT SENDER ====="
          git grep -n -B 25 -A 25 \
            "eWNI_SME_MONITOR_MODE_VDEV_UP" -- "$SRC" || true

          echo "===== FEATURE BUILD FLAG ====="
          grep -n -A 3 -B 3 \
            "CONFIG_FEATURE_MONITOR_MODE_SUPPORT" \
            "$SRC/Kbuild" || true




      - name: Dump exact monitor MLME path
        shell: bash
        run: |
          set -eu
          SRC="drivers/staging/qcacld-3.0"

          echo "===== MONITOR MLME OPS ====="
          sed -n '1110,1160p' \
            "$SRC/components/mlme/core/src/wlan_mlme_vdev_mgr_interface.c"

          echo "===== MONITOR OPS REGISTRATION ====="
          sed -n '1418,1440p' \
            "$SRC/components/mlme/core/src/wlan_mlme_vdev_mgr_interface.c"

          echo "===== MONITOR START SEND ====="
          git grep -n -B 10 -A 45 \
            "mon_mlme_vdev_start_restart_send" -- "$SRC"

          echo "===== MONITOR START CONTINUE ====="
          git grep -n -B 10 -A 45 \
            "mon_mlme_start_continue" -- "$SRC"

          echo "===== MONITOR VDEV UP SEND ====="
          git grep -n -B 10 -A 35 \
            "mon_mlme_vdev_up_send" -- "$SRC"

          echo "===== LIM COMPLETION ====="
          sed -n '2850,2890p' \
            "$SRC/core/mac/src/pe/lim/lim_process_mlm_rsp_messages.c"




      - name: Dump WMA VDEV start response handler
        shell: bash
        run: |
          set -u
          SRC="drivers/staging/qcacld-3.0"

          echo "===== FIND WMA VDEV START RESPONSE HANDLER ====="
          git grep -n -B 5 -A 120 \
            "wma_vdev_start_resp_handler" -- "$SRC" || true

          echo
          echo "===== FIND START RESPONSE DISPATCH ====="
          git grep -n -B 10 -A 50 \
            "mlme_vdev_start_continue" -- "$SRC" || true

          echo
          echo "===== FIND MONITOR MODE REFERENCES IN WMA ====="
          git grep -n -B 5 -A 15 \
            "QDF_MONITOR_MODE" -- "$SRC/core/wma" |
            head -n 200 || true

          echo
          echo "===== FIND VDEV START RESPONSE EVENT ====="
          git grep -n -B 10 -A 40 \
            "VDEV_START_RESP" -- "$SRC/core/wma" || true



      - name: Trace monitor VDEV start response dispatch
        shell: bash
        run: |
          set -eu
          SRC="drivers/staging/qcacld-3.0"

          echo "===== WMA VDEV START RESPONSE ====="
          sed -n '1190,1340p' \
            "$SRC/core/wma/src/wma_dev_if.c"

          echo "===== MONITOR START CONTINUE REFERENCES ====="
          git grep -n -B 12 -A 30 \
            "wma_mon_mlme_vdev_start_continue" -- "$SRC"

          echo "===== MONITOR VDEV UP REFERENCES ====="
          git grep -n -B 12 -A 30 \
            "wma_mon_mlme_vdev_up_send" -- "$SRC"

          echo "===== MLME MONITOR OPS REGISTRATION ====="
          git grep -n -B 15 -A 30 \
            "mon_mlme_vdev_start_restart_send" -- \
            "$SRC/components/mlme"

      - name: Create investigation summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "QCACLD3 Wi-Fi Monitor Investigation"
            echo
            echo "Repository:"
            echo "LineageOS/android_kernel_motorola_sm6225"
            echo
            echo "Branch:"
            echo "lineage-23.2"
            echo
            echo "Commit:"
            git rev-parse HEAD
            echo
            echo "Important files:"
            find drivers/staging/qcacld-3.0 \
              -type f \
              \( -name '*.c' -o -name '*.h' \) |
              grep -E \
              'wlan_hdd_cfg80211|wlan_hdd_main|vdev_mgr|sme|wmi' |
              head -n 100
          } > wifi-investigation-summary.txt




      - name: Capture exact WMA response handler
        shell: bash
        run: |
          set -eu
          SRC="drivers/staging/qcacld-3.0"
          OUT="wifi-vdev-investigation.txt"

          {
            echo
            echo "===== WMA VDEV START RESPONSE HANDLER ====="
            sed -n '1194,1345p' \
              "$SRC/core/wma/src/wma_dev_if.c"

            echo
            echo "===== MLME RESPONSE CALLBACK ====="
            sed -n '1288,1315p' \
              "$SRC/components/mlme/core/src/wlan_mlme_vdev_mgr_interface.c"

            echo
            echo "===== MONITOR CALLBACK REGISTRATION ====="
            sed -n '1418,1438p' \
              "$SRC/components/mlme/core/src/wlan_mlme_vdev_mgr_interface.c"
          } | tee -a "$OUT"




      - name: Capture monitor VDEV completion path
        shell: bash
        run: |
          set -eu
          SRC="drivers/staging/qcacld-3.0"
          OUT="wifi-vdev-investigation.txt"

          {
            echo
            echo "===== COMPLETE WMA START RESPONSE HANDLER ====="
            sed -n '1194,1385p' \
              "$SRC/core/wma/src/wma_dev_if.c"

            echo
            echo "===== MONITOR START CONTINUE AND UP SEND ====="
            sed -n '4608,4665p' \
              "$SRC/core/wma/src/wma_utils.c"

            echo
            echo "===== SME MONITOR UP CALLBACK ====="
            sed -n '16425,16475p' \
              "$SRC/core/sme/src/common/sme_api.c"

            echo
            echo "===== HDD MONITOR CALLBACK ====="
            sed -n '18057,18110p' \
              "$SRC/core/hdd/src/wlan_hdd_main.c"

            echo
            echo "===== CHANNEL SWITCH RESPONSE DEFINITIONS ====="
            grep -Rn -E \
              'wma_handle_channel_switch_resp|lim_process_switch_channel_rsp' \
              "$SRC/core/wma" "$SRC/core/mac/src/pe/lim" || true

            echo
            echo "===== MONITOR UP EVENT PRODUCER AND HANDLER ====="
            grep -Rn -E \
              'eWNI_SME_MONITOR_MODE_VDEV_UP|sme_process_monitor_mode_vdev_up_evt' \
              "$SRC/core/mac/src/pe/lim" \
              "$SRC/core/sme/src/common/sme_api.c" || true
          } | tee -a "$OUT"




      - name: Capture LIM monitor completion logic
        shell: bash
        run: |
          set -eu
          SRC="drivers/staging/qcacld-3.0"
          OUT="wifi-vdev-investigation.txt"

          {
            echo
            echo "===== LIM SWITCH CHANNEL RESPONSE ====="
            sed -n '2860,2960p' \
              "$SRC/core/mac/src/pe/lim/lim_process_mlm_rsp_messages.c"

            echo
            echo "===== MONITOR VDEV START SEND ====="
            sed -n '8585,8665p' \
              "$SRC/core/mac/src/pe/lim/lim_utils.c"

            echo
            echo "===== MONITOR CALLBACK REGISTRATION SITES ====="
            grep -Rn -E \
              'sme_set_monitor_mode_cb|hdd_sme_monitor_mode_callback' \
              "$SRC/core/hdd" "$SRC/core/sme" || true
          } | tee -a "$OUT"

      - name: Upload WiFi investigation
        uses: actions/upload-artifact@v4
        with:
          name: cebu-wifi-vdev-investigation
          path: |
            wifi-vdev-investigation.txt
            wifi-vdev-context.txt
            wifi-event-ids.txt
            wifi-investigation-summary.txt
          if-no-files-found: error
