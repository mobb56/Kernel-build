name: Build cebu NetHunter Wi-Fi module
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  KERNEL_BRANCH: lineage-23.2
  NETHUNTER_REPO: https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git
  NETHUNTER_BRANCH: nethunter-lineage-23.2
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out
  LLVM_DIR: /usr/lib/llvm-21
jobs:
  build-wifi-module:
    name: Build and verify QCACLD3 Wi-Fi module
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout build repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Install build dependencies
      shell: bash
      run: |
        set -euxo pipefail

        sudo apt-get update

        sudo apt-get install -y \
          bc \
          bison \
          build-essential \
          ccache \
          flex \
          gcc-aarch64-linux-gnu \
          git \
          kmod \
          libssl-dev \
          curl \
          python3 \
          rsync \
          unzip \
          wget \
          xz-utils \
          zip
    - name: Install Android LLVM clang-r563880c
      shell: bash
      run: |
        set -euo pipefail

        NDK_VERSION="r29"
        NDK_ARCHIVE="android-ndk-r29-linux.zip"
        NDK_URL="https://dl.google.com/android/repository/${NDK_ARCHIVE}"
        NDK_SHA1="87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b"

        NDK_ROOT="${GITHUB_WORKSPACE}/android-ndk-r29"
        ANDROID_LLVM_DIR="${GITHUB_WORKSPACE}/android-llvm"
        NDK_ZIP="${RUNNER_TEMP}/${NDK_ARCHIVE}"

        echo "============================================================"
        echo "ANDROID NDK r29 / CLANG-r563880c"
        echo "============================================================"

        rm -rf "${NDK_ROOT}"
        rm -rf "${ANDROID_LLVM_DIR}"
        rm -f "${NDK_ZIP}"

        echo
        echo "=== Downloading official Google Android NDK r29 ==="

        curl -fL \
          --retry 5 \
          --retry-delay 5 \
          --retry-all-errors \
          -o "${NDK_ZIP}" \
          "${NDK_URL}"

        test -s "${NDK_ZIP}"

        echo
        echo "=== Verifying NDK SHA-1 ==="

        echo "${NDK_SHA1}  ${NDK_ZIP}" | sha1sum -c -

        echo
        echo "NDK archive verified."

        echo
        echo "=== Extracting Android NDK r29 ==="

        unzip -q "${NDK_ZIP}" -d "${GITHUB_WORKSPACE}"

        test -d "${NDK_ROOT}"

        echo
        echo "=== Selecting LLVM toolchain ==="

        LLVM_SOURCE="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
                test -d "${LLVM_SOURCE}"

        cp -a "${LLVM_SOURCE}" "${ANDROID_LLVM_DIR}"

        test -x "${ANDROID_LLVM_DIR}/bin/clang"
        test -x "${ANDROID_LLVM_DIR}/bin/ld.lld"
        test -x "${ANDROID_LLVM_DIR}/bin/llvm-ar"
        test -x "${ANDROID_LLVM_DIR}/bin/llvm-nm"
        test -x "${ANDROID_LLVM_DIR}/bin/llvm-objcopy"
        test -x "${ANDROID_LLVM_DIR}/bin/llvm-strip"
        test -x "${ANDROID_LLVM_DIR}/bin/llvm-readelf"
        test -x "${ANDROID_LLVM_DIR}/bin/llvm-objdump"

        echo
        echo "=== Verify clang version ==="

        "${ANDROID_LLVM_DIR}/bin/clang" --version

        "${ANDROID_LLVM_DIR}/bin/clang" --version \
          | grep -q -F "clang version 21.0.0"

           echo
           echo "=== Verify clang source revision ==="

           echo "Checking compiler identity..."

           CLANG_VERSION="$("${ANDROID_LLVM_DIR}/bin/clang" --version)"

            echo "${CLANG_VERSION}"

             echo
             echo "=== Verify clang-r563880c ==="

             echo "${CLANG_VERSION}" | grep -F "clang version 21.0.0"
             echo "${CLANG_VERSION}" | grep -F "based on r563880c"

              echo
              echo "Android clang-r563880c source revision verified."
    - name: Prepare Android LLVM toolchain
      shell: bash
      run: |
        set -euo pipefail

        ANDROID_LLVM_DIR="${GITHUB_WORKSPACE}/android-llvm"
        LLVM_BIN="${ANDROID_LLVM_DIR}/bin"

        test -x "${ANDROID_LLVM_DIR}/bin/clang"
        test -x "${ANDROID_LLVM_DIR}/bin/ld.lld"
        test -x "${ANDROID_LLVM_DIR}/bin/llvm-ar"
        test -x "${ANDROID_LLVM_DIR}/bin/llvm-nm"
        test -x "${ANDROID_LLVM_DIR}/bin/llvm-objcopy"
        test -x "${ANDROID_LLVM_DIR}/bin/llvm-strip"
        test -x "${ANDROID_LLVM_DIR}/bin/llvm-readelf"
        test -x "${ANDROID_LLVM_DIR}/bin/llvm-objdump"

        echo "=== Android LLVM toolchain selected ==="

        echo "LLVM_DIR=${ANDROID_LLVM_DIR}" >> "${GITHUB_ENV}"
        echo "LLVM_BIN=${LLVM_BIN}" >> "${GITHUB_ENV}"
        echo "PATH=${LLVM_BIN}:${PATH}" >> "${GITHUB_ENV}"

        echo
        echo "=== Verify Android Clang directly ==="

        "${ANDROID_LLVM_DIR}/bin/clang" --version
        "${ANDROID_LLVM_DIR}/bin/ld.lld" --version

        "${ANDROID_LLVM_DIR}/bin/clang" --version \
          | grep -q -F 'clang version 21.0.0'

        echo
        echo "Android LLVM toolchain prepared successfully."
    - name: Verify Android Clang 21.0.0 toolchain
      shell: bash
      run: |
        set -euxo pipefail

        export PATH="${LLVM_BIN}:${PATH}"

        echo "clang:"
        command -v clang
        clang --version

        echo
        echo "ld.lld:"
        command -v ld.lld
        ld.lld --version

        echo
        echo "llvm-ar:"
        command -v llvm-ar
        llvm-ar --version

        echo
        echo "llvm-nm:"
        command -v llvm-nm
        llvm-nm --version

        echo
        echo "llvm-objcopy:"
        command -v llvm-objcopy

        echo
        echo "llvm-strip:"
        command -v llvm-strip

        echo
        echo "llvm-readelf:"
        command -v llvm-readelf

        echo
        echo "Checking compiler generation..."

        "${LLVM_BIN}/clang" --version |
        grep -q -F 'clang version 21.0.0'

        echo
        echo "Android Clang 21.0.0 toolchain verification PASSED."
    - name: Verify stock cebu configuration
      shell: bash
      run: |
        set -euxo pipefail

        test -f cebu-stock.config
        test -s cebu-stock.config

        echo "Stock configuration:"
        ls -lh cebu-stock.config

        echo
        echo "Configuration line count:"
        wc -l cebu-stock.config

        echo
        echo "First configuration lines:"
        head -n 10 cebu-stock.config

        echo
        echo "Stock cebu configuration is present."
    - name: Clone cebu kernel source
      shell: bash
      run: |
        set -euxo pipefail

        rm -rf kernel

         git clone \
           --branch "${KERNEL_BRANCH}" \
           --single-branch \
            "${KERNEL_REPO}" \
             kernel

             cd kernel

          git checkout 39bcecd5c63df849923b1faadc9cde482648a1a1

        echo
        echo "============================================================"
        echo "CEBU KERNEL SOURCE IDENTITY"
        echo "============================================================"

        CURRENT_COMMIT="$(git rev-parse HEAD)"
        CURRENT_SHORT="$(git rev-parse --short=12 HEAD)"

        echo
        echo "Repository:"
        git remote get-url origin

        echo
        echo "Branch:"
        git branch --show-current

        echo
        echo "Current HEAD:"
        echo "${CURRENT_COMMIT}"

        echo
        echo "Current 12-character commit:"
        echo "${CURRENT_SHORT}"
                test -n "${CURRENT_COMMIT}"
        test -n "${CURRENT_SHORT}"

        echo
        echo "Kernel source successfully cloned."
    - name: Verify cebu kernel source
      working-directory: kernel
      shell: bash
      run: "set -euo pipefail\n\necho \"============================================================\"\necho \"\
        CEBU KERNEL SOURCE VERIFIED\"\necho \"============================================================\"\n\n\
       \  EXPECTED_COMMIT=\"39bcecd5c63df849923b1faadc9cde482648a1a1\"\n  \
        CURRENT_BRANCH=\"$(git branch --show-current)\"\
        \n CURRENT_COMMIT=\"$(git rev-parse HEAD)\"\n CURRENT_SHORT=\"$(git rev-parse --short=12 HEAD)\"\n\n  echo\n\
        \  echo \"Branch:\"\n  echo \"${CURRENT_BRANCH}\"\n\n  echo\n  echo \"Commit:\"\n  echo \"${CURRENT_COMMIT}\"\
        \n\n  echo\n  echo \"12-character commit:\"\n  echo \"${CURRENT_SHORT}\"\n\n  echo\n  echo \"Expected stock\
        \ source revision:\"\n  echo \"${EXPECTED_COMMIT}\"\n\n   test \"${CURRENT_COMMIT}\" = \"${EXPECTED_COMMIT}\"\
        \n\n  test -f Makefile\n  test -d arch/arm64\n  test -d drivers\n test -f arch/arm64/configs/vendor/bengal-perf_defconfig\n\
        \n  echo\n  echo \"Defconfig:\"\n  echo \"arch/arm64/configs/vendor/bengal-perf_defconfig\"\n\n  echo\n\
        \  echo \"Correct cebu kernel source verified.\"\n"
        
    - name: Verify QCACLD3 source tree
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p ../artifacts/source-audit

        echo "=== QCACLD3 source tree ==="

        test -d drivers/staging/qcacld-3.0
        test -f drivers/staging/qcacld-3.0/Kbuild

        echo "QCACLD3 root:"
        find drivers/staging/qcacld-3.0 \
          -maxdepth 3 \
          -type f \
          \( -name 'wlan_hdd_main.c' -o -name 'wlan_hdd_main.h' \) \
          -print

        HDD_MAIN_C="$(
          find drivers/staging/qcacld-3.0 \
            -type f \
            -name 'wlan_hdd_main.c' \
            -print -quit
        )"

        HDD_MAIN_H="$(
          find drivers/staging/qcacld-3.0 \
            -type f \
            -name 'wlan_hdd_main.h' \
            -print -quit
        )"

        if [ -z "${HDD_MAIN_C}" ]; then
          echo "ERROR: wlan_hdd_main.c was not found anywhere in QCACLD3."
          exit 1
        fi

        if [ -z "${HDD_MAIN_H}" ]; then
          echo "ERROR: wlan_hdd_main.h was not found anywhere in QCACLD3."
          exit 1
        fi

        echo "wlan_hdd_main.c: ${HDD_MAIN_C}"
        echo "wlan_hdd_main.h: ${HDD_MAIN_H}"

        {
          echo "QCACLD3_ROOT=drivers/staging/qcacld-3.0"
          echo "WLAN_HDD_MAIN_C=${HDD_MAIN_C}"
          echo "WLAN_HDD_MAIN_H=${HDD_MAIN_H}"
        } > ../artifacts/source-audit/qcacld3-paths.txt

        echo "QCACLD3 source tree verified."
        
    - name: Clone NetHunter reference
      shell: bash
      run: |
        set -euxo pipefail

        rm -rf nethunter-reference

        git clone \
          --depth=1 \
          --branch "${NETHUNTER_BRANCH}" \
          "${NETHUNTER_REPO}" \
          nethunter-reference

        cd nethunter-reference

        echo
        echo "NetHunter reference:"
        git remote -v

        echo
        echo "NetHunter branch:"
        git branch --show-current

        echo
        echo "NetHunter commit:"
        git rev-parse HEAD
    - name: Verify required injection sources
      shell: bash
      run: |
        set -euxo pipefail

        NH="nethunter-reference/drivers/staging/qcacld-3.0"

        REQUIRED_FILES=(
          "${NH}/core/hdd/src/wlan_hdd_frame_inject.c"
          "${NH}/core/hdd/src/wlan_hdd_frame_validate.c"
          "${NH}/core/hdd/src/wlan_hdd_inject_security.c"
          "${NH}/core/hdd/src/wlan_hdd_frame_inject_debug.c"
          "${NH}/core/wma/src/wma_frame_inject.c"
        )

        for file in "${REQUIRED_FILES[@]}"; do
          if [ ! -f "${file}" ]; then
            echo "ERROR: required NetHunter source is missing:"
            echo "${file}"
            exit 1
          fi

          echo "FOUND: ${file}"
        done

        echo
        echo "All required injection sources are present."
    - name: Prepare audit directories
      shell: bash
      run: |
        set -euxo pipefail

        mkdir -p \
          artifacts \
          artifacts/source-audit

        echo "Audit directories ready."
    - name: Record source versions
      shell: bash
      run: |
        set -euxo pipefail

        {
          echo "============================================================"
          echo "CEBU NETHUNTER SOURCE MANIFEST"
          echo "============================================================"
          echo
          echo "Kernel repository:"
          echo "${KERNEL_REPO}"
          echo
          echo "Kernel branch:"
          echo "${KERNEL_BRANCH}"
          echo
          echo "Kernel commit:"
          git -C kernel rev-parse HEAD
          echo
          echo "NetHunter repository:"
          echo "${NETHUNTER_REPO}"
          echo
          echo "NetHunter branch:"
          echo "${NETHUNTER_BRANCH}"
          echo
          echo "NetHunter commit:"
          git -C nethunter-reference rev-parse HEAD
          echo
          echo "Architecture:"
          echo "${ARCH}"
          echo
          echo "Cross compiler:"
          echo "${CROSS_COMPILE}"
          echo
          echo "LLVM:"
          echo "${LLVM_DIR}"
        } > artifacts/source-audit/source-manifest.txt

        cat artifacts/source-audit/source-manifest.txt
    - name: Record stock configuration hash
      shell: bash
      run: |
        set -euxo pipefail

        sha256sum \
          cebu-stock.config \
          > artifacts/source-audit/stock-config.sha256

        cat artifacts/source-audit/stock-config.sha256
    - name: Prepare kernel output directory
      shell: bash
      run: |
        set -euxo pipefail

        cd kernel

        rm -rf "${OUT_DIR}"
        mkdir -p "${OUT_DIR}"

        echo "Kernel output directory:"
        echo "${OUT_DIR}"
    - name: Load stock cebu configuration
      shell: bash
      run: |
        set -euxo pipefail

        cd kernel

        cp \
          "${GITHUB_WORKSPACE}/cebu-stock.config" \
          "${OUT_DIR}/.config"

        test -s "${OUT_DIR}/.config"

                echo "Loaded stock cebu configuration."

        echo
        echo "Configuration:"
        wc -l "${OUT_DIR}/.config"

        sha256sum "${OUT_DIR}/.config"
    - name: Verify critical stock build configuration
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        CONFIG="${OUT_DIR}/.config"

        test -s "${CONFIG}"

        echo "============================================================"
        echo " CRITICAL STOCK CONFIGURATION CHECK"
        echo "============================================================"

        REQUIRED=(
          "CONFIG_LTO=y"
          "CONFIG_THINLTO=y"
          "CONFIG_LTO_CLANG=y"
          "CONFIG_CFI=y"
          "CONFIG_CFI_CLANG=y"
          "CONFIG_CFI_CLANG_SHADOW=y"
          "CONFIG_SHADOW_CALL_STACK=y"
          "CONFIG_INIT_STACK_ALL_ZERO=y"
          "CONFIG_DEBUG_INFO=y"
          "CONFIG_MODVERSIONS=y"
          "CONFIG_HZ_300=y"
          "CONFIG_HZ=300"
          "CONFIG_INPUT_TOUCHSCREEN=y"
          "CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI_MMI=m"
          "CONFIG_INPUT_TOUCHSCREEN_FOCALTECH_0FLASH_MMI=m"
          "CONFIG_TOUCHSCREEN_CHIPONE_TDDI=m"
          "CONFIG_INPUT_MISC_FPC1020=m"
          "CONFIG_I2C_QCOM_GENI=y"
          "CONFIG_SPI_QCOM_GENI=y"
          "CONFIG_WLAN=y"
          "CONFIG_QCA_CLD_WLAN=m"
          "CONFIG_RMNET=y"
          "CONFIG_IPA3=y"
          "CONFIG_RMNET_IPA3=y"
          "CONFIG_USB_GADGET=y"
          "CONFIG_USB_CONFIGFS=y"
          "CONFIG_HIDRAW=y"
          "CONFIG_UHID=y"
        )

        for expected in "${REQUIRED[@]}"; do
          if ! grep -Fxq "${expected}" "${CONFIG}"; then
            echo
            echo "ERROR: Critical stock configuration mismatch:"
            echo "  ${expected}"
            echo
            echo "The final kernel configuration is NOT stock-compatible."
            exit 1
          fi

          echo "OK: ${expected}"
        done

        echo
        echo "============================================================"
        echo " CRITICAL STOCK CONFIGURATION PASSED"
        echo "============================================================"
    - name: Verify stock compiler configuration
      shell: bash
      run: |
        set -euxo pipefail

        cd kernel

        CONFIG="${OUT_DIR}/.config"

        echo "Stock compiler metadata:"

        grep -E \
          '^CONFIG_(CLANG_VERSION|AS_VERSION|LLD_VERSION)=' \
          "${CONFIG}"

        test \
          "$(sed -n 's/^CONFIG_CLANG_VERSION=//p' "${CONFIG}")" \
          = "210000"

        test \
          "$(sed -n 's/^CONFIG_AS_VERSION=//p' "${CONFIG}")" \
          = "210000"

        test \
          "$(sed -n 's/^CONFIG_LLD_VERSION=//p' "${CONFIG}")" \
          = "210000"

        echo
        echo "Stock compiler metadata verified."
    - name: Create complete NetHunter configuration
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p kernel/nethunter-config

        cat > kernel/nethunter-config/cebu-nethunter.config <<'EOF'
        # ============================================================
        # Moto G9 Power cebu - NetHunter additive configuration
        #
        # IMPORTANT:
        # This is merged into the verified stock cebu configuration.
        #
        # Do NOT put:
        #   CONFIG_LTO
        #   CONFIG_CFI
        #   CONFIG_SHADOW_CALL_STACK
        #   CONFIG_MODVERSIONS
        #   CONFIG_DEBUG_INFO
        # etc. here.
        #
        # Those ABI/security/compiler settings come from stock.
        #
        # QCACLD3 FEATURE_* variables are Kbuild variables and do
        # NOT belong in this file.
        # ============================================================

        # ============================================================
        # HID
        # ============================================================

        CONFIG_HID=y
        CONFIG_HIDRAW=y
        CONFIG_UHID=y


        # ============================================================
        # BLUETOOTH
        # ============================================================

        CONFIG_BT=y
        CONFIG_BT_BREDR=y
        CONFIG_BT_LE=y

        # RFCOMM deliberately built into kernel.
        CONFIG_BT_RFCOMM=y
        CONFIG_BT_RFCOMM_TTY=y

        # NetHunter Bluetooth PAN.
        CONFIG_BT_BNEP=m
        CONFIG_BT_BNEP_MC_FILTER=y
        CONFIG_BT_BNEP_PROTO_FILTER=y

        # Bluetooth HID.
        CONFIG_BT_HIDP=m

        # Bluetooth HCI UART.
        CONFIG_BT_HCIUART=m
        CONFIG_BT_HCIUART_H4=y

        # Bluetooth VHCI.
        CONFIG_BT_HCIVHCI=m


        # ============================================================
        # USB GADGET / CONFIGFS
        # ============================================================

        CONFIG_USB_GADGET=y
        CONFIG_USB_CONFIGFS=y
        CONFIG_USB_CONFIGFS_UEVENT=y

        CONFIG_USB_CONFIGFS_ACM=y
        CONFIG_USB_CONFIGFS_NCM=y
        CONFIG_USB_CONFIGFS_RNDIS=y
        CONFIG_USB_CONFIGFS_ECM=y
        CONFIG_USB_CONFIGFS_EEM=y

        CONFIG_USB_CONFIGFS_F_FS=y
        CONFIG_USB_CONFIGFS_F_HID=y


        # ============================================================
        # USB SERIAL
        # ============================================================

        CONFIG_USB_SERIAL=y
        CONFIG_USB_SERIAL_GENERIC=y

        CONFIG_USB_ACM=m


        # ============================================================
        # USB NETWORKING
        # ============================================================

        CONFIG_USB_USBNET=m
        CONFIG_USB_NET_CDCETHER=m
        CONFIG_USB_NET_CDC_NCM=m


        # ============================================================
        # USB ETHERNET ADAPTERS
        # ============================================================

        CONFIG_USB_RTL8150=m
        CONFIG_USB_RTL8152=m


        # ============================================================
        # PACKET SOCKETS
                # ============================================================

        CONFIG_PACKET=y


        # ============================================================
        # SENSORS
        # ============================================================

        CONFIG_SENSORS_SSC=y
        CONFIG_SENSORS_CLASS=m


        # ============================================================
        # QUALCOMM WLAN
        # ============================================================

        CONFIG_WLAN=y
        CONFIG_QCA_CLD_WLAN=m


        # ============================================================
        # END
        # ============================================================
        EOF

        test -s kernel/nethunter-config/cebu-nethunter.config

        echo
        echo "=== COMPLETE NETHUNTER CONFIGURATION ==="
        cat kernel/nethunter-config/cebu-nethunter.config
    - name: Verify injection feature symbols are not config symbols
      shell: bash
      run: |
        set -euxo pipefail

        cd kernel

        FRAGMENT="nethunter-config/cebu-nethunter.config"

        if grep -Eq \
          '^CONFIG_(FEATURE_FRAME_INJECTION_SUPPORT|FEATURE_MONITOR_MODE_SUPPORT)(=| is not set)' \
          "${FRAGMENT}"; then

          echo "ERROR: QCACLD3 FEATURE_* variable was incorrectly added"
          echo "to the kernel configuration fragment."

          exit 1
        fi

        echo
        echo "QCACLD3 FEATURE_* variables correctly absent."
    - name: Merge NetHunter configuration
      shell: bash
      run: |
        set -euxo pipefail

        cd kernel

        CONFIG_BEFORE="${OUT_DIR}/stock-before-nethunter.config"

        cp \
          "${OUT_DIR}/.config" \
          "${CONFIG_BEFORE}"

        scripts/kconfig/merge_config.sh \
        -m \
        -O "${OUT_DIR}" \
        "${CONFIG_BEFORE}" \
         nethunter-config/cebu-nethunter.config

        test -s "${OUT_DIR}/.config"

        echo
        echo "NetHunter fragment merged."
    - name: Audit CFI/LTO before olddefconfig
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        CONFIG="${OUT_DIR}/.config"

        echo "============================================================"
        echo "CFI/LTO CONFIG BEFORE OLDDEFCONFIG"
        echo "============================================================"

        for SYMBOL in \
          LTO \
          THINLTO \
          LTO_CLANG \
          LTO_NONE \
          CFI \
          CFI_CLANG \
          CFI_CLANG_SHADOW \
          SHADOW_CALL_STACK \
          INIT_STACK_ALL_ZERO \
          DEBUG_INFO \
          MODVERSIONS
        do
          echo -n "${SYMBOL}: "
          scripts/config --file "${CONFIG}" --state "${SYMBOL}" || true
        done

        echo
        echo "Relevant raw config lines:"
        grep -E \
          '^(CONFIG_(LTO|THINLTO|LTO_CLANG|LTO_NONE|CFI|CFI_CLANG|CFI_CLANG_SHADOW|SHADOW_CALL_STACK|INIT_STACK_ALL_ZERO|DEBUG_INFO|MODVERSIONS)=|# CONFIG_(LTO|THINLTO|LTO_CLANG|LTO_NONE|CFI|CFI_CLANG|CFI_CLANG_SHADOW|SHADOW_CALL_STACK|INIT_STACK_ALL_ZERO|DEBUG_INFO|MODVERSIONS) is not set)' \
          "${CONFIG}" || true
    - name: Resolve Kconfig dependencies
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        echo "============================================================"
        echo "KCONFIG RESOLUTION / ABI SAFETY CHECK"
        echo "============================================================"

        CONFIG="${OUT_DIR}/.config"
        STOCK_CONFIG="${GITHUB_WORKSPACE}/cebu-stock.config"
        PREMERGE_CONFIG="${OUT_DIR}/stock-before-nethunter.config"

        test -s "${CONFIG}"
        test -s "${STOCK_CONFIG}"
        test -s "${PREMERGE_CONFIG}"

        test -x "${LLVM_BIN}/clang"
        test -x "${LLVM_BIN}/ld.lld"

        export PATH="${LLVM_BIN}:${PATH}"

        echo
        echo "=== Verify Android Clang ==="
        clang --version
        ld.lld --version

        echo
        echo "=== Verify exact stock config before Kconfig resolution ==="

        STOCK_SHA="$(sha256sum "${STOCK_CONFIG}" | awk '{print $1}')"
        PREMERGE_SHA="$(sha256sum "${PREMERGE_CONFIG}" | awk '{print $1}')"

        echo "Stock config:    ${STOCK_SHA}"
        echo "Pre-merge copy:  ${PREMERGE_SHA}"

        test "${STOCK_SHA}" = "${PREMERGE_SHA}"

        echo
        echo "=== Critical settings BEFORE olddefconfig ==="

        REQUIRED=(
          "LTO=y"
          "THINLTO=y"
          "LTO_CLANG=y"
          "CFI=y"
          "CFI_CLANG=y"
          "CFI_CLANG_SHADOW=y"
          "SHADOW_CALL_STACK=y"
          "INIT_STACK_ALL_ZERO=y"
          "DEBUG_INFO=y"
          "MODVERSIONS=y"
          "HZ_300=y"
        )

        for item in "${REQUIRED[@]}"; do
          symbol="${item%%=*}"
          expected="${item#*=}"

          actual="$(
            scripts/config \
              --file "${CONFIG}" \
              --state "${symbol}"
          )"

          echo "${symbol}: ${actual}"

