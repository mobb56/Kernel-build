name: Build Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # Dependencies
      # =========================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang-14 \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # =========================================================
      # LLVM
      # =========================================================
      - name: Setup LLVM
        run: |
          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

          echo "===== CLANG ====="
          /usr/lib/llvm-14/bin/clang --version

          echo
          echo "===== LLD ====="
          /usr/lib/llvm-14/bin/ld.lld --version

      # =========================================================
      # Kernel source
      # =========================================================
      - name: Checkout LineageOS kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6225
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      # =========================================================
      # Cebu device tree
      # =========================================================
      - name: Checkout cebu device tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_cebu
          ref: lineage-23.2
          path: device/motorola/cebu
          fetch-depth: 1

      # =========================================================
      # Common device tree
      # =========================================================
      - name: Checkout SM6225 common tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_sm6225-common
          ref: lineage-23.2
          path: device/motorola/sm6225-common
          fetch-depth: 1

      # =========================================================
      # Verify source
      # =========================================================
      - name: Verify source
        run: |
          set -e

          echo "========================================"
          echo "KERNEL"
          echo "========================================"

          git -C kernel rev-parse --short HEAD

          echo
          echo "========================================"
          echo "CEBU"
          echo "========================================"

          git -C device/motorola/cebu rev-parse --short HEAD

          echo
          echo "========================================"
          echo "COMMON"
          echo "========================================"

          git -C device/motorola/sm6225-common rev-parse --short HEAD

          echo
          echo "Checking Bengal defconfig..."

          test -f \
            kernel/arch/arm64/configs/vendor/bengal-perf_defconfig

          echo "FOUND"

          echo
          echo "Checking Qualcomm trace header..."

          test -f \
            kernel/drivers/clk/qcom/trace.h

          echo "FOUND"

          echo
          echo "Cebu kernel configuration:"

          grep -n \
            "TARGET_KERNEL_CONFIG" \
            device/motorola/cebu/BoardConfig.mk || true

      # =========================================================
      # Clean kernel source
      # =========================================================
      - name: Clean kernel source
        working-directory: kernel
        run: |
          set -e

          make mrproper

          rm -rf out
          rm -rf include/config
          rm -rf include/generated
          rm -rf arch/arm64/include/generated

          echo
          echo "Source tree clean."

      # =========================================================
      # Find cebu configuration
      # =========================================================
      - name: Locate cebu configuration
        run: |
          echo "========================================"
          echo "SEARCHING FOR CEBU CONFIG"
          echo "========================================"

          CEBU_CONFIG="$(
            find \
              "$GITHUB_WORKSPACE" \
              -type f \
              -name "cebu-default.config" \
              -print \
              -quit
          )"

          if [ -n "$CEBU_CONFIG" ]; then
            echo "CEBU_CONFIG=$CEBU_CONFIG" >> "$GITHUB_ENV"

            echo
            echo "Found:"
            echo "$CEBU_CONFIG"
          else
            echo "CEBU_CONFIG=" >> "$GITHUB_ENV"

            echo
            echo "cebu-default.config was not found."
            echo "Continuing with Bengal base configuration."
          fi

      # =========================================================
      # Create NetHunter configuration
      # =========================================================
      - name: Create NetHunter config
        working-directory: kernel
        run: |
          set -e

          cat > nethunter.config <<'EOF'

          # =====================================================
          # Bluetooth core
          # =====================================================

          CONFIG_BT=y
          CONFIG_BT_BREDR=y

          # Bluetooth protocols
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HCIVHCI=y

          # Bluetooth HCI UART
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y

          # =====================================================
          # Required Bluetooth dependencies
          # =====================================================

          CONFIG_TTY=y
          CONFIG_INPUT=y
          CONFIG_HID=y

          # =====================================================
          # USB gadget
          # =====================================================

          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y

          # USB networking
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_F_FS=y

          # =====================================================
          # HID / input
          # =====================================================

          CONFIG_INPUT_EVDEV=y
          CONFIG_INPUT_UINPUT=y
          CONFIG_UHID=y
          CONFIG_HIDRAW=y

          # =====================================================
          # Networking
          # =====================================================

          CONFIG_PACKET=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NF_CONNTRACK=y

          CONFIG_TUN=y
          CONFIG_VETH=y

          # =====================================================
          # Wireless framework
          # =====================================================

          CONFIG_CFG80211=y
          CONFIG_RFKILL=y

          EOF

          echo
          echo "========================================"
          echo "NETHUNTER CONFIG"
          echo "========================================"

          cat nethunter.config

      # =========================================================
      # Base configuration
      # =========================================================
      - name: Configure base kernel
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
          KCONFIG_CONFIG: out/.config
        run: |
          set -e

          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          test -f out/.config

          echo
          echo "Base configuration generated."

      # =========================================================
      # Apply cebu configuration
      # =========================================================
      - name: Apply cebu configuration
        working-directory: kernel
        env:
          KCONFIG_CONFIG: out/.config
        run: |
          set -e

          if [ -n "$CEBU_CONFIG" ]; then

            echo "========================================"
            echo "APPLYING CEBU CONFIGURATION"
            echo "========================================"

            echo "$CEBU_CONFIG"

            scripts/kconfig/merge_config.sh \
              out/.config \
              "$CEBU_CONFIG"

            test -f out/.config

          else

            echo "========================================"
            echo "NO CEBU CONFIGURATION FOUND"
            echo "========================================"

            echo "Using Bengal configuration."

          fi

      # =========================================================
      # Apply NetHunter configuration
      #
      # IMPORTANT:
      # Do NOT use merge_config.sh -m here.
      # The -m option means merge-only and skips Kconfig.
      # =========================================================
      - name: Apply NetHunter configuration
        working-directory: kernel
        env:
          KCONFIG_CONFIG: out/.config
        run: |
          set -e

          echo "========================================"
          echo "APPLYING NETHUNTER CONFIGURATION"
          echo "========================================"

          scripts/kconfig/merge_config.sh \
            out/.config \
            nethunter.config

          test -f out/.config

          echo
          echo "========================================"
          echo "CONFIG AFTER NETHUNTER MERGE"
          echo "========================================"

          grep -E \
            'CONFIG_BT=|CONFIG_BT_BREDR=|CONFIG_BT_RFCOMM=|CONFIG_BT_RFCOMM_TTY=|CONFIG_BT_HIDP=|CONFIG_BT_HCIVHCI=|CONFIG_BT_HCIUART=|CONFIG_BT_HCIUART_H4=|CONFIG_TTY=|CONFIG_INPUT=|CONFIG_HID=|CONFIG_USB_GADGET=|CONFIG_USB_CONFIGFS=|CONFIG_USB_CONFIGFS_F_HID=|CONFIG_USB_CONFIGFS_NCM=|CONFIG_INPUT_UINPUT=|CONFIG_TUN=|CONFIG_VETH=|CONFIG_CFG80211=|CONFIG_RFKILL=' \
            out/.config || true

      # =========================================================
      # Finalize configuration
      # =========================================================
      - name: Finalize configuration
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -e

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          test -f out/.config

          echo
          echo "========================================"
          echo "FINAL CONFIGURATION"
          echo "========================================"

          grep -E \
            'CONFIG_BT=|CONFIG_BT_BREDR=|CONFIG_BT_RFCOMM=|CONFIG_BT_RFCOMM_TTY=|CONFIG_BT_HIDP=|CONFIG_BT_HCIVHCI=|CONFIG_BT_HCIUART=|CONFIG_BT_HCIUART_H4=|CONFIG_TTY=|CONFIG_INPUT=|CONFIG_HID=|CONFIG_USB_GADGET=|CONFIG_USB_CONFIGFS=|CONFIG_USB_CONFIGFS_F_HID=|CONFIG_USB_CONFIGFS_NCM=|CONFIG_INPUT_UINPUT=|CONFIG_TUN=|CONFIG_VETH=|CONFIG_CFG80211=|CONFIG_RFKILL=' \
            out/.config || true

      # =========================================================
      # Verify required NetHunter options
      # =========================================================
      - name: Verify required NetHunter options
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING REQUIRED NETHUNTER OPTIONS"
          echo "========================================"

          required=(
            CONFIG_BT
            CONFIG_BT_BREDR
            CONFIG_BT_RFCOMM
            CONFIG_BT_RFCOMM_TTY
            CONFIG_BT_HIDP
            CONFIG_BT_HCIVHCI
            CONFIG_BT_HCIUART
            CONFIG_BT_HCIUART_H4
            CONFIG_TTY
            CONFIG_INPUT
            CONFIG_HID
            CONFIG_USB_GADGET
            CONFIG_USB_CONFIGFS
            CONFIG_USB_CONFIGFS_F_HID
            CONFIG_USB_CONFIGFS_NCM
            CONFIG_INPUT_EVDEV
            CONFIG_INPUT_UINPUT
            CONFIG_UHID
            CONFIG_HIDRAW
            CONFIG_PACKET
            CONFIG_NETFILTER
            CONFIG_NF_CONNTRACK
            CONFIG_TUN
            CONFIG_VETH
            CONFIG_CFG80211
            CONFIG_RFKILL
          )

          failed=0

          for option in "${required[@]}"; do

            if grep -q "^${option}=y$" out/.config; then
              echo "OK: ${option}=y"
            else
              echo "FAIL: ${option} is NOT built-in"

              grep \
                -E "^# ${option} is not set$|^${option}=" \
                out/.config || true

              failed=1
            fi

          done

          echo

          if [ "$failed" -ne 0 ]; then
            echo "========================================"
            echo "CONFIGURATION VERIFICATION FAILED"
            echo "========================================"

            exit 1
          fi

          echo "========================================"
          echo "ALL REQUIRED OPTIONS ARE BUILT-IN"
          echo "========================================"

      # =========================================================
      # Clean generated source files before build
      # =========================================================
      - name: Clean generated source files before build
        working-directory: kernel
        run: |
          set -e

          echo "Removing generated files from source tree..."

          rm -f .config

          rm -rf include/config
          rm -rf include/generated
          rm -rf arch/arm64/include/generated

          echo
          echo "Checking source tree..."

          if [ -f .config ]; then
            echo "ERROR: .config still exists"
            exit 1
          fi

          if [ -d include/config ]; then
            echo "ERROR: include/config still exists"
            exit 1
          fi

          if [ -d arch/arm64/include/generated ]; then
            echo "ERROR: arch/arm64/include/generated still exists"
            exit 1
          fi

          echo
          echo "SOURCE TREE CLEAN."

          echo
          echo "Output configuration:"
          ls -lh out/.config

      # =========================================================
      # Build ONLY kernel Image
      #
      # NO dtbs target.
      # =========================================================
      - name: Build kernel Image
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -e

          echo "========================================"
          echo "BUILDING KERNEL IMAGE"
          echo "========================================"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

          echo
          echo "Checking Image..."

          test -f \
            out/arch/arm64/boot/Image

          ls -lh \
            out/arch/arm64/boot/Image

      # =========================================================
      # Build modules separately
      # =========================================================
      - name: Build kernel modules
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -e

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules

      # =========================================================
      # Collect artifacts
      # =========================================================
      - name: Collect artifacts
        run: |
          set -e

          mkdir -p artifacts
          mkdir -p artifacts/modules

          cp \
            kernel/out/arch/arm64/boot/Image \
            artifacts/Image

          cp \
            kernel/out/.config \
            artifacts/kernel.config

          cp \
            kernel/nethunter.config \
            artifacts/nethunter.config

          find kernel/out \
            -type f \
            -name "*.ko" \
            -exec cp {} artifacts/modules/ \; || true

          echo
          echo "========================================"
          echo "FINAL ARTIFACTS"
          echo "========================================"

          find artifacts \
            -type f \
            -exec ls -lh {} \;

      # =========================================================
      # Create AnyKernel3 package
      # =========================================================
      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "DOWNLOADING ANYKERNEL3"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          echo
          echo "========================================"
          echo "INSTALLING COMPILED KERNEL"
          echo "========================================"

          cp \
            kernel/out/arch/arm64/boot/Image \
            AnyKernel3/Image

          test -f AnyKernel3/Image

          ls -lh AnyKernel3/Image

          echo
          echo "========================================"
          echo "CONFIGURING ANYKERNEL3"
          echo "========================================"

          cat > AnyKernel3/anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script

          properties() { '
          kernel.string=Moto G9 Power cebu NetHunter Kernel

          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=cebu
          device.name2=

          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=

          '; }

          BLOCK=boot
          IS_SLOT_DEVICE=auto
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto

          . tools/ak3-core.sh

          dump_boot
          write_boot
          EOF

          chmod 755 AnyKernel3/anykernel.sh

          echo
          echo "========================================"
          echo "CREATING FLASHABLE ZIP"
          echo "========================================"

          rm -rf AnyKernel3/.git

          cd AnyKernel3

          zip -r9 \
            ../Moto-G9-Power-cebu-NetHunter-Kernel.zip \
            . \
            -x "README.md" \
            -x ".git/*"

          cd ..

          test -f \
            Moto-G9-Power-cebu-NetHunter-Kernel.zip

          echo
          echo "Flashable ZIP:"
          ls -lh \
            Moto-G9-Power-cebu-NetHunter-Kernel.zip

          echo
          echo "========================================"
          echo "ZIP CONTENTS"
          echo "========================================"

          unzip -l \
            Moto-G9-Power-cebu-NetHunter-Kernel.zip

      # =========================================================
      # Upload original kernel artifacts
      # =========================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          path: artifacts/
          if-no-files-found: error

      # =========================================================
      # Upload flashable ZIP
      # =========================================================
      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-flashable
          path: Moto-G9-Power-cebu-NetHunter-Kernel.zip
          if-no-files-found: error
