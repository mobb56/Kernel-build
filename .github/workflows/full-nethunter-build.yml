          echo "=== Critical settings AFTER olddefconfig ==="

          for item in "${REQUIRED[@]}"; do
            symbol="${item%%=*}"
            expected="${item#*=}"

            actual="$(
              scripts/config \
                --file "${CONFIG}" \
                --state "${symbol}"
            )"

            echo "${symbol}: ${actual}"

            if [ "${actual}" != "${expected}" ]; then
              echo
              echo "ERROR: olddefconfig changed a stock ABI/security setting."
              echo "  Symbol:   ${symbol}"
              echo "  Expected: ${expected}"
              echo "  Actual:   ${actual}"
              echo
              echo "This proves the problem occurs during Kconfig resolution."
              exit 1
            fi
          done

          echo
          echo "============================================================"
          echo "KCONFIG RESOLUTION PASSED"
          echo "All required stock ABI/security settings survived."
          echo "============================================================"






      # ============================================================
      # ABI-SENSITIVE CONFIGURATION AUDIT
      #
      # The failing symbols include module_layout and cfg80211 APIs.
      # Audit every CONFIG_* symbol referenced by the kernel module
      # and cfg80211 public headers.
      #
      # A NetHunter feature is not allowed to silently alter one of
      # these configuration conditions.
      # ============================================================

      - name: Audit ABI-sensitive configuration
        working-directory: kernel
        shell: bash
        run: |
           set -euo pipefail
           
           STOCK_CONFIG="${GITHUB_WORKSPACE}/cebu-stock.config"
           FINAL_CONFIG="${OUT_DIR}/.config"

            test -s "${STOCK_CONFIG}"
            test -s "${FINAL_CONFIG}"

            echo "============================================================"
            echo "ABI-SENSITIVE CONFIGURATION AUDIT"
            echo "============================================================"

             FAILED=0

              for HEADER in \
              include/linux/module.h \
              include/net/cfg80211.h
             do
            echo
            echo "------------------------------------------------------------"
            echo "Header: ${HEADER}"
            echo "------------------------------------------------------------"

               while read -r SYMBOL; do

                  STOCK_STATE="$(
                 scripts/config \
              --file "${STOCK_CONFIG}" \
              --state "${SYMBOL}" 2>/dev/null ||
              true
              )"

                FINAL_STATE="$(
                scripts/config \
             --file "${FINAL_CONFIG}" \
             --state "${SYMBOL}" 2>/dev/null ||
              true
             )"

             if [ "${STOCK_STATE}" != "${FINAL_STATE}" ]; then
             echo
             echo "ABI CONFIG DIFFERENCE:"
              echo "  ${SYMBOL}"
              echo "  stock = ${STOCK_STATE:-unset}"
              echo "  final = ${FINAL_STATE:-unset}"
              FAILED=1
             fi

             done < <(
             grep -oE 'CONFIG_[A-Z0-9_]+' "${HEADER}" |
              sort -u
              )
               done

              if [ "${FAILED}" -ne 0 ]; then
           echo
           echo "ERROR: ABI-sensitive configuration differs from stock."
           echo "The NetHunter configuration must not change these"
           echo "configuration conditions until the ABI is understood."
           exit 1
           fi

            echo
            echo "ABI-sensitive configuration matches stock."
       
      - name: Audit complete stock versus final config
        working-directory: kernel
        shell: bash
        run: |
         set -euo pipefail

          echo "=== Complete stock versus final config audit ==="

         STOCK_CONFIG="${GITHUB_WORKSPACE}/cebu-stock.config"
         FINAL_CONFIG="${OUT_DIR}/.config"
         REPORT="${OUT_DIR}/stock-final-config.diff"

         test -s "${STOCK_CONFIG}"
          test -s "${FINAL_CONFIG}"

         scripts/diffconfig \
         "${STOCK_CONFIG}" \
         "${FINAL_CONFIG}" \
         > "${REPORT}" || true
 
         echo
         echo "=== Configuration differences ==="

          if [ -s "${REPORT}" ]; then
          cat "${REPORT}"
          else
          echo "No configuration differences."
          fi

         echo
         echo "Configuration audit report:"
          wc -l "${REPORT}"

      - name: Set kernel release to stock-compatible release
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${OUT_DIR}/.config"

          test -s "${CONFIG}"

          echo "=== Set stock-compatible kernel release ==="

          scripts/config \
            --file "${CONFIG}" \
            --disable LOCALVERSION_AUTO \
            --set-str LOCALVERSION "-perf"

          echo
          echo "=== Final local-version settings ==="

          grep -E '^CONFIG_LOCALVERSION=' "${CONFIG}"
          grep -E '^# CONFIG_LOCALVERSION_AUTO is not set$' "${CONFIG}"

          grep -Fxq 'CONFIG_LOCALVERSION="-perf"' "${CONFIG}"
          grep -Fxq '# CONFIG_LOCALVERSION_AUTO is not set' "${CONFIG}"


          : > .scmversion
          test -f .scmversion
          echo "SCM version suffix disabled."

          echo
          echo "=== Verify expected kernel release ==="

          RELEASE="$(make -s \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            LOCALVERSION="-g39bcecd5c63d" \
            kernelrelease)"

          echo "KERNEL_RELEASE=${RELEASE}"

          test "${RELEASE}" = "4.19.325-cip135-st19-perf-g39bcecd5c63d"

          echo
          echo "Stock-compatible kernel release confirmed."



            



      - name: Full stock-vs-final configuration audit
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${OUT_DIR}/.config"
          STOCK="../cebu-stock.config"
          FRAGMENT="nethunter-config/cebu-nethunter.config"

          test -s "${CONFIG}"
          test -s "${STOCK}"
          test -s "${FRAGMENT}"

          echo "============================================================"
          echo " FULL STOCK VS FINAL CONFIGURATION AUDIT"
          echo "============================================================"

          TMP_DIR="${GITHUB_WORKSPACE}/config-audit"
          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}"

          STOCK_NORM="${TMP_DIR}/stock.normalized"
          FINAL_NORM="${TMP_DIR}/final.normalized"
          ALLOWED="${TMP_DIR}/allowed.symbols"
          DIFFERENCES="${TMP_DIR}/unexpected-differences"

          echo
          echo "=== Normalize stock configuration ==="

          awk '
            /^# CONFIG_[A-Za-z0-9_]+ is not set$/ {
              line=$0
              sub(/^# /, "", line)
              sub(/ is not set$/, "", line)
              print line "=n"
              next
            }

            /^CONFIG_[A-Za-z0-9_]+=/ {
              pos=index($0, "=")
              print substr($0, 1, pos-1) "=" substr($0, pos+1)
            }
          ' "${STOCK}" | sort -u > "${STOCK_NORM}"

          echo
          echo "=== Normalize final configuration ==="

          awk '
            /^# CONFIG_[A-Za-z0-9_]+ is not set$/ {
              line=$0
              sub(/^# /, "", line)
              sub(/ is not set$/, "", line)
              print line "=n"
              next
            }

            /^CONFIG_[A-Za-z0-9_]+=/ {
              pos=index($0, "=")
              print substr($0, 1, pos-1) "=" substr($0, pos+1)
            }
          ' "${CONFIG}" | sort -u > "${FINAL_NORM}"

          echo
          echo "=== Build explicit NetHunter change allowlist ==="

          ALLOWED_CHANGES="${TMP_DIR}/allowed.changes"

          cat > "${ALLOWED_CHANGES}" <<'EOF'
             CONFIG_HIDRAW=y
             CONFIG_UHID=y
             CONFIG_BT=y
            CONFIG_BT_BREDR=y
             CONFIG_BT_LE=y
             CONFIG_BT_RFCOMM=y
            CONFIG_BT_RFCOMM_TTY=y
             CONFIG_BT_BNEP=m
             CONFIG_BT_BNEP_PROTO_FILTER=y
             CONFIG_BT_BNEP_MC_FILTER=y
             CONFIG_BT_HIDP=m
            CONFIG_BT_HCIUART=m
            CONFIG_BT_HCIUART_H4=y
             CONFIG_BT_HCIVHCI=m
             CONFIG_USB_GADGET=y
            CONFIG_USB_CONFIGFS=y
             CONFIG_USB_CONFIGFS_UEVENT=y
             CONFIG_USB_CONFIGFS_ACM=y
              CONFIG_USB_CONFIGFS_NCM=y
            CONFIG_USB_CONFIGFS_RNDIS=y
            CONFIG_USB_CONFIGFS_ECM=y
           CONFIG_USB_CONFIGFS_EEM=y
            CONFIG_USB_CONFIGFS_F_HID=y
            CONFIG_USB_CONFIGFS_F_FS=y
             CONFIG_USB_SERIAL=y
             CONFIG_USB_SERIAL_GENERIC=y
             CONFIG_USB_USBNET=m
             CONFIG_USB_NET_CDCETHER=m
             CONFIG_USB_NET_CDC_NCM=m
             CONFIG_PACKET=y
             CONFIG_SENSORS_SSC=y
              CONFIG_SENSORS_CLASS=m
              CONFIG_WLAN=y
               CONFIG_QCA_CLD_WLAN=m
               CONFIG_LOCALVERSION_AUTO=n
             EOF

          sort -u "${ALLOWED_CHANGES}" -o "${ALLOWED_CHANGES}"

          echo
          echo "=== Explicitly allowed configuration changes ==="
          cat "${ALLOWED_CHANGES}"

          echo
          echo "=== Compare every stock CONFIG symbol ==="

          awk -F= '
            NR==FNR {
              stock[$1]=$0
              next
            }

            {
              final[$1]=$0
            }

            END {
              for (symbol in stock) {
                if (!(symbol in final)) {
                  print "REMOVED|" symbol "|" stock[symbol] "|<missing>"
                }
                else if (stock[symbol] != final[symbol]) {
                  print "CHANGED|" symbol "|" stock[symbol] "|" final[symbol]
                }
              }

              for (symbol in final) {
                if (!(symbol in stock)) {
                  print "ADDED|" symbol "|<absent-from-stock>|" final[symbol]
                }
              }
            }
          ' "${STOCK_NORM}" "${FINAL_NORM}" > "${TMP_DIR}/all-differences"

            : > "${DIFFERENCES}"

          awk -F'|' \
            -v allowed="${ALLOWED_CHANGES}" \
            -v differences="${DIFFERENCES}" '
          BEGIN {
            while ((getline line < allowed) > 0) {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)

              if (line == "")
                continue

              pos = index(line, "=")

              if (pos == 0)
                continue

              symbol = substr(line, 1, pos - 1)
              value  = substr(line, pos + 1)

              allowed_value[symbol] = value
            }

            close(allowed)
          }

          {
            type   = $1
            symbol = $2
            stock  = $3
            final  = $4

            if ((symbol in allowed_value) &&
                (final == allowed_value[symbol])) {

              print "ALLOWED: " symbol ": " stock " -> " final

            } else {

              print type "|" symbol "|" stock "|" final >> differences
            }
          }
          ' "${TMP_DIR}/all-differences"
          echo
          echo "============================================================"
          echo " UNEXPECTED STOCK CONFIGURATION DIFFERENCES"
          echo "============================================================"

          if [ -s "${DIFFERENCES}" ]; then
            cat "${DIFFERENCES}"
            echo
            echo "ERROR: Unexpected configuration differences detected."
            echo "The final configuration is NOT an acceptable stock cebu baseline."
            exit 1
          fi

          echo "No unexpected stock configuration differences detected."

          echo
          echo "============================================================"
          echo " STOCK CONFIGURATION PRESERVATION PASSED"
          echo "============================================================"

          echo
          echo "Stock symbols:"
          wc -l < "${STOCK_NORM}"

          echo "Final symbols:"
          wc -l < "${FINAL_NORM}"

          echo
          echo "The final configuration contains the complete stock"
          echo "configuration plus only explicitly allowed NetHunter"
          echo "and deliberate kernel-release changes."


