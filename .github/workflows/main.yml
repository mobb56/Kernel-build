name: Build Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      OUT_DIR: ${{ github.workspace }}/kernel-out
      ANYKERNEL_DIR: ${{ github.workspace }}/AnyKernel3

    steps:

      # ============================================================
      # 1. Dependencies
      # ============================================================
      - name: Set up job
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            zip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          sudo apt-get install -y llvm-14 lld-14

          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

          clang-14 --version
          ld.lld-14 --version
          aarch64-linux-gnu-gcc --version

      # ============================================================
      # 2. Clone official LineageOS SM6225 kernel
      # ============================================================
      - name: Clone LineageOS kernel
        run: |
          set -e

          rm -rf "$KERNEL_DIR"
          rm -rf "$OUT_DIR"

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo "Kernel source:"
          git remote -v
          git branch --show-current
          git rev-parse HEAD

      # ============================================================
      # 3. Prepare build directories
      # ============================================================
      - name: Prepare build directories
        run: |
          set -e

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          echo "KERNEL_DIR=$KERNEL_DIR"
          echo "OUT_DIR=$OUT_DIR"

      # ============================================================
      # 4. Verify base defconfig
      # ============================================================
      - name: Verify Bengal base configuration
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          if [ ! -f arch/arm64/configs/vendor/bengal-perf_defconfig ]; then
            echo "ERROR: vendor/bengal-perf_defconfig not found"
            exit 1
          fi

          echo "Base defconfig found:"
          ls -lh arch/arm64/configs/vendor/bengal-perf_defconfig

      # ============================================================
      # 5. Create NetHunter configuration OUTSIDE source tree
      # ============================================================
      - name: Create NetHunter configuration
        run: |
          set -e

          NH_CONFIG="$GITHUB_WORKSPACE/nethunter.config"

          rm -f "$NH_CONFIG"

          cat > "$NH_CONFIG" <<'EOF'
          # ==========================================================
          # Bluetooth
          # ==========================================================

          CONFIG_BT=y
          CONFIG_BT_BREDR=y

          CONFIG_BT_RFCOMM=m
          CONFIG_BT_RFCOMM_TTY=y

          CONFIG_BT_HIDP=m

          CONFIG_BT_HCIVHCI=m

          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y


          # ==========================================================
          # USB gadget / HID
          # ==========================================================

          CONFIG_USB_GADGET=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_CONFIGFS=y

          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_NCM=y


          # ==========================================================
          # Input / userspace interfaces
          # ==========================================================

          CONFIG_INPUT_UINPUT=y


          # ==========================================================
          # Networking
          # ==========================================================

          CONFIG_TUN=y
          CONFIG_VETH=y


          # ==========================================================
          # Wireless framework
          # ==========================================================

          CONFIG_CFG80211=y
          CONFIG_RFKILL=y

          # Wireless test mode support.
          # NOTE:
          # This does NOT by itself add QCACLD-3 injection support.
          CONFIG_NL80211_TESTMODE=y


          # ==========================================================
          # Motorola sensor dependency
          # ==========================================================

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m
          EOF

          echo "Created:"
          cat "$NH_CONFIG"

      # ============================================================
      # 6. Configure kernel
      # ============================================================
      - name: Configure kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          rm -f "$OUT_DIR/.config"

          echo "Creating base configuration..."

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          echo "Merging NetHunter configuration..."

          scripts/kconfig/merge_config.sh \
            -m \
            -O "$OUT_DIR" \
            "$OUT_DIR/.config" \
            "$GITHUB_WORKSPACE/nethunter.config"

          echo "Resolving configuration..."

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      # ============================================================
      # 7. Verify NetHunter configuration
      # ============================================================
      - name: Verify NetHunter configuration
        run: |
          set -e

          CONFIG="$OUT_DIR/.config"

          echo "Checking important configuration symbols..."

          check_config() {
            SYMBOL="$1"

            if ! grep -qx "$SYMBOL=y" "$CONFIG" \
              && ! grep -qx "$SYMBOL=m" "$CONFIG"; then
              echo "ERROR: $SYMBOL is not enabled"
              grep -E "^${SYMBOL%%=*}=" "$CONFIG" || true
              exit 1
            fi

            echo "OK: $(grep -E "^${SYMBOL%%=*}=" "$CONFIG")"
          }

          check_config CONFIG_BT
          check_config CONFIG_BT_BREDR
          check_config CONFIG_BT_RFCOMM
          check_config CONFIG_BT_HIDP
          check_config CONFIG_BT_HCIVHCI
          check_config CONFIG_BT_HCIUART
          check_config CONFIG_USB_GADGET
          check_config CONFIG_USB_LIBCOMPOSITE
          check_config CONFIG_USB_CONFIGFS
          check_config CONFIG_USB_CONFIGFS_F_HID
          check_config CONFIG_USB_CONFIGFS_NCM
          check_config CONFIG_INPUT_UINPUT
          check_config CONFIG_TUN
          check_config CONFIG_VETH
          check_config CONFIG_CFG80211
          check_config CONFIG_RFKILL
          check_config CONFIG_NL80211_TESTMODE
          check_config CONFIG_SENSORS_SSC
          check_config CONFIG_SENSORS_CLASS

          echo
          echo "Selected Bluetooth / USB / networking configuration:"
          grep -E \
            '^(CONFIG_BT|CONFIG_USB_CONFIGFS|CONFIG_INPUT_UINPUT|CONFIG_TUN|CONFIG_VETH|CONFIG_CFG80211|CONFIG_RFKILL|CONFIG_NL80211_TESTMODE|CONFIG_SENSORS_)' \
            "$CONFIG" || true

      # ============================================================
      # 8. Verify source tree is still clean
      # ============================================================
      - name: Verify clean kernel source
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          echo "Git status before build:"
          git status --short

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Kernel source tree is dirty."
            exit 1
          fi

          echo "Kernel source tree is clean."

      # ============================================================
      # 9. IMPORTANT:
      #    Get the release directly from Kbuild.
      #    DO NOT hard-code it.
      # ============================================================
      - name: Verify kernel release
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          BUILT_RELEASE="$(
            make -s \
              O="$OUT_DIR" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              kernelrelease
          )"

          echo "=========================================="
          echo "Kernel release from Kbuild:"
          echo "$BUILT_RELEASE"
          echo "=========================================="

          if [ -z "$BUILT_RELEASE" ]; then
            echo "ERROR: kernelrelease returned empty"
            exit 1
          fi

          case "$BUILT_RELEASE" in
            *-dirty)
              echo "ERROR: Kernel release contains -dirty:"
              echo "$BUILT_RELEASE"
              exit 1
              ;;
          esac

          echo "$BUILT_RELEASE" > "$GITHUB_WORKSPACE/kernel-release.txt"

          echo "Kernel release verification passed."

      # ============================================================
      # 10. Save final kernel config
      # ============================================================
      - name: Save final kernel config
        run: |
          set -e

          cp \
            "$OUT_DIR/.config" \
            "$GITHUB_WORKSPACE/kernel.config"

          cp \
            "$GITHUB_WORKSPACE/nethunter.config" \
            "$GITHUB_WORKSPACE/nethunter-final.config"

          echo "Saved kernel configuration."

      # ============================================================
      # 11. Build kernel Image
      # ============================================================
      - name: Build kernel Image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

      # ============================================================
      # 12. Verify Image
      # ============================================================
      - name: Verify kernel Image
        run: |
          set -e

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Kernel Image was not produced."
            exit 1
          fi

          echo "Kernel Image:"
          ls -lh "$IMAGE"

      # ============================================================
      # 13. Build modules
      # ============================================================
      - name: Build kernel modules
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules

      # ============================================================
      # 14. Prepare module staging
      # ============================================================
      - name: Install kernel modules
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          MODULE_STAGE="$GITHUB_WORKSPACE/module-stage"

          rm -rf "$MODULE_STAGE"
          mkdir -p "$MODULE_STAGE"

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_install \
            INSTALL_MOD_PATH="$MODULE_STAGE" \
            INSTALL_MOD_STRIP=1

          RELEASE="$(
            cat "$GITHUB_WORKSPACE/kernel-release.txt"
          )"

          echo "Installed module release:"
          find "$MODULE_STAGE/lib/modules" -maxdepth 2 -type f 2>/dev/null || true

          MODULE_DIR="$MODULE_STAGE/lib/modules/$RELEASE"

          if [ ! -d "$MODULE_DIR" ]; then
            echo "ERROR: Expected module directory not found:"
            echo "$MODULE_DIR"
            find "$MODULE_STAGE" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Module directory:"
          ls -la "$MODULE_DIR"

      # ============================================================
      # 15. Prepare Android vendor module tree
      # ============================================================
      - name: Prepare vendor modules
        run: |
          set -e

          RELEASE="$(
            cat "$GITHUB_WORKSPACE/kernel-release.txt"
          )"

          MODULE_DIR="$GITHUB_WORKSPACE/module-stage/lib/modules/$RELEASE"

          AK_MODULE_DIR="$GITHUB_WORKSPACE/ak-modules/vendor/lib/modules"

          rm -rf "$GITHUB_WORKSPACE/ak-modules"
          mkdir -p "$AK_MODULE_DIR"

          # Copy the modules built by this kernel.
          find "$MODULE_DIR" \
            -type f \
            -name '*.ko' \
            -exec cp -f {} "$AK_MODULE_DIR/" \;

          echo "Modules going into AnyKernel3:"
          find "$AK_MODULE_DIR" -type f -name '*.ko' -printf '%f\n' | sort

          MODULE_COUNT="$(
            find "$AK_MODULE_DIR" \
              -type f \
              -name '*.ko' \
              | wc -l
          )"

          echo "Module count: $MODULE_COUNT"

          if [ "$MODULE_COUNT" -eq 0 ]; then
            echo "ERROR: No kernel modules were produced."
            exit 1
          fi

      # ============================================================
      # 16. Verify sensors_class module
      # ============================================================
      - name: Verify sensors_class module
        run: |
          set -e

          SENSOR_MODULE="$GITHUB_WORKSPACE/ak-modules/vendor/lib/modules/sensors_class.ko"

          if [ ! -f "$SENSOR_MODULE" ]; then
            echo "ERROR: sensors_class.ko was not produced."
            echo
            echo "Available modules:"
            find "$GITHUB_WORKSPACE/ak-modules" \
              -type f \
              -name '*.ko' \
              -printf '%p\n' \
              | sort
            exit 1
          fi

          echo "sensors_class.ko:"
          ls -lh "$SENSOR_MODULE"

          echo
          echo "Module vermagic:"
          modinfo "$SENSOR_MODULE" 2>/dev/null \
            | grep -E '^(filename|version|vermagic|depends):' \
            || true

      # ============================================================
      # 17. Verify module vermagic matches Kbuild release
      # ============================================================
      - name: Verify module vermagic
        run: |
          set -e

          RELEASE="$(
            cat "$GITHUB_WORKSPACE/kernel-release.txt"
          )"

          echo "Expected release:"
          echo "$RELEASE"

          FAILED=0

          while IFS= read -r MODULE; do
            VERMAGIC="$(
              modinfo "$MODULE" 2>/dev/null \
                | sed -n 's/^vermagic: //p'
            )"

            echo
            echo "Module: $(basename "$MODULE")"
            echo "Vermagic: $VERMAGIC"

            if [ -z "$VERMAGIC" ]; then
              echo "ERROR: Could not read vermagic."
              FAILED=1
              continue
            fi

            MODULE_RELEASE="$(printf '%s\n' "$VERMAGIC" | awk '{print $1}')"

            if [ "$MODULE_RELEASE" != "$RELEASE" ]; then
              echo "ERROR: Release mismatch."
              echo "Expected: $RELEASE"
              echo "Actual:   $MODULE_RELEASE"
              FAILED=1
            else
              echo "OK: release matches."
            fi

          done < <(
            find "$GITHUB_WORKSPACE/ak-modules" \
              -type f \
              -name '*.ko' \
              | sort
          )

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo
          echo "All module releases match Kbuild."

      # ============================================================
      # 18. Clone AnyKernel3
      # ============================================================
      - name: Prepare AnyKernel3
        run: |
          set -e

          rm -rf "$ANYKERNEL_DIR"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            "$ANYKERNEL_DIR"

          rm -rf \
            "$ANYKERNEL_DIR/.git" \
            "$ANYKERNEL_DIR/.github"

          echo "AnyKernel3 prepared."

      # ============================================================
      # 19. Configure AnyKernel3
      # ============================================================
      - name: Configure AnyKernel3
        run: |
          set -e

          cd "$ANYKERNEL_DIR"

          cat > anykernel.sh <<'EOF'
          #!/bin/sh

          properties() { '
          kernel.string=Moto G9 Power cebu NetHunter Kernel

          do.devicecheck=1
          do.modules=1
          do.systemless=0

          do.cleanup=1
          do.cleanuponabort=0

          device.name1=cebu
          device.name2=

          supported.versions=16
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot
          IS_SLOT_DEVICE=auto

          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto

          . tools/ak3-core.sh

          dump_boot
          write_boot
          EOF

          chmod +x anykernel.sh

          echo "AnyKernel3 configuration:"
          cat anykernel.sh

      # ============================================================
      # 20. Put kernel Image into AnyKernel3
      # ============================================================
      - name: Prepare AnyKernel kernel files
        run: |
          set -e

          cp \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$ANYKERNEL_DIR/Image"

          mkdir -p "$ANYKERNEL_DIR/modules/vendor/lib/modules"

          cp \
            "$GITHUB_WORKSPACE/ak-modules/vendor/lib/modules/"*.ko \
            "$ANYKERNEL_DIR/modules/vendor/lib/modules/"

          cp \
            "$GITHUB_WORKSPACE/kernel-release.txt" \
            "$ANYKERNEL_DIR/kernel-release.txt"

          cp \
            "$GITHUB_WORKSPACE/kernel.config" \
            "$ANYKERNEL_DIR/kernel.config"

          cp \
            "$GITHUB_WORKSPACE/nethunter-final.config" \
            "$ANYKERNEL_DIR/nethunter.config"

          echo "AnyKernel contents:"
          find "$ANYKERNEL_DIR" \
            -maxdepth 4 \
            -type f \
            | sort

      # ============================================================
      # 21. Verify AnyKernel package contents
      # ============================================================
      - name: Verify AnyKernel package
        run: |
          set -e

          test -f "$ANYKERNEL_DIR/Image"
          test -f "$ANYKERNEL_DIR/anykernel.sh"
          test -f "$ANYKERNEL_DIR/modules/vendor/lib/modules/sensors_class.ko"

          echo "Image:"
          ls -lh "$ANYKERNEL_DIR/Image"

          echo
          echo "Modules:"
          find "$ANYKERNEL_DIR/modules" \
            -type f \
            -name '*.ko' \
          
