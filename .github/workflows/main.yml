name: Build Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. Install dependencies
      # =========================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang-14 \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # =========================================================
      # 2. Make LLVM 14 available
      # =========================================================
      - name: Setup LLVM environment
        run: |
          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

          echo "===== CLANG ====="
          /usr/lib/llvm-14/bin/clang --version

          echo
          echo "===== LLD ====="
          /usr/lib/llvm-14/bin/ld.lld --version

      # =========================================================
      # 3. Checkout official LineageOS kernel
      # =========================================================
      - name: Checkout LineageOS kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6225
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      # =========================================================
      # 4. Checkout cebu device tree
      # =========================================================
      - name: Checkout cebu device tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_cebu
          ref: lineage-23.2
          path: device/motorola/cebu
          fetch-depth: 1

      # =========================================================
      # 5. Checkout common SM6225 device tree
      # =========================================================
      - name: Checkout SM6225 common tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_sm6225-common
          ref: lineage-23.2
          path: device/motorola/sm6225-common
          fetch-depth: 1

      # =========================================================
      # 6. Verify source
      # =========================================================
      - name: Verify source
        run: |
          echo "===== KERNEL ====="
          git -C kernel rev-parse --short HEAD

          echo
          echo "===== CEBU DEVICE ====="
          git -C device/motorola/cebu rev-parse --short HEAD

          echo
          echo "===== SM6225 COMMON ====="
          git -C device/motorola/sm6225-common rev-parse --short HEAD

          echo
          echo "===== KERNEL MAKEFILE ====="
          test -f kernel/Makefile
          echo "Kernel Makefile found."

          echo
          echo "===== BENGAL DEFCONFIG ====="
          test -f kernel/arch/arm64/configs/vendor/bengal-perf_defconfig
          echo "vendor/bengal-perf_defconfig found."

          echo
          echo "===== CEBU BOARD CONFIG ====="
          grep -n "TARGET_KERNEL_CONFIG" \
            device/motorola/cebu/BoardConfig.mk || true

      # =========================================================
      # 7. Clean kernel source BEFORE configuring
      # =========================================================
      - name: Clean kernel source
        working-directory: kernel
        run: |
          echo "Running mrproper..."

          make mrproper

          echo
          echo "Checking source tree..."

          test ! -f .config
          test ! -d include/config
          test ! -d arch/arm64/include/generated

          echo "Kernel source tree is clean."

      # =========================================================
      # 8. Create NetHunter configuration
      # =========================================================
      - name: Create NetHunter config
        working-directory: kernel
        run: |
          cat > nethunter.config <<'EOF'

          #
          # =====================================================
          # Bluetooth
          # =====================================================
          #
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y

          #
          # =====================================================
          # USB Gadget / HID
          # =====================================================
          #
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y

          #
          # =====================================================
          # USB networking
          # =====================================================
          #
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_F_FS=y

          #
          # =====================================================
          # HID / userspace input
          # =====================================================
          #
          CONFIG_INPUT_EVDEV=y
          CONFIG_INPUT_UINPUT=y
          CONFIG_UHID=y
          CONFIG_HIDRAW=y

          #
          # =====================================================
          # Networking
          # =====================================================
          #
          CONFIG_PACKET=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_TUN=y
          CONFIG_VETH=y

          #
          # =====================================================
          # Wireless framework
          # =====================================================
          #
          CONFIG_CFG80211=y
          CONFIG_RFKILL=y

          EOF

          echo "===== NETHUNTER CONFIG ====="
          cat nethunter.config

      # =========================================================
      # 9. Configure kernel
      # =========================================================
      - name: Configure kernel
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          echo "===== TOOLCHAIN ====="
          which clang
          which ld.lld

          clang --version
          ld.lld --version

          echo
          echo "===== BASE DEFCONFIG ====="

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          echo
          echo "===== MERGING NETHUNTER CONFIG ====="

          scripts/kconfig/merge_config.sh \
            -m \
            .config \
            nethunter.config

          echo
          echo "===== FINALIZING CONFIG ====="

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      # =========================================================
      # 10. Verify configuration
      # =========================================================
      - name: Verify kernel configuration
        working-directory: kernel
        run: |
          echo "========================================"
          echo "Bluetooth"
          echo "========================================"

          grep -E \
            'CONFIG_BT=|CONFIG_BT_BREDR=|CONFIG_BT_RFCOMM=|CONFIG_BT_HIDP=|CONFIG_BT_HCIVHCI=|CONFIG_BT_HCIUART=' \
            .config || true

          echo
          echo "========================================"
          echo "USB Gadget / HID"
          echo "========================================"

          grep -E \
            'CONFIG_USB_GADGET=|CONFIG_USB_CONFIGFS=|CONFIG_USB_CONFIGFS_F_HID=' \
            .config || true

          echo
          echo "========================================"
          echo "Networking"
          echo "========================================"

          grep -E \
            'CONFIG_PACKET=|CONFIG_NETFILTER=|CONFIG_NF_CONNTRACK=|CONFIG_TUN=|CONFIG_VETH=' \
            .config || true

          echo
          echo "========================================"
          echo "Wireless"
          echo "========================================"

          grep -E \
            'CONFIG_CFG80211=|CONFIG_RFKILL=' \
            .config || true

          echo
          echo "========================================"
          echo "Configuration complete"
          echo "========================================"

      # =========================================================
      # 11. Build kernel
      # =========================================================
      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          echo "========================================"
          echo "BUILDING KERNEL"
          echo "========================================"

          make -j"$(nproc)" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image \
            dtbs \
            modules

      # =========================================================
      # 12. Collect artifacts
      # =========================================================
      - name: Collect kernel artifacts
        run: |
          mkdir -p artifacts

          echo "Copying kernel image..."

          cp kernel/arch/arm64/boot/Image \
            artifacts/Image

          echo "Copying DTBs..."

          find kernel/arch/arm64/boot/dts \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp {} artifacts/ \; || true

          echo "Copying configuration..."

          cp kernel/.config \
            artifacts/kernel.config

          cp kernel/nethunter.config \
            artifacts/nethunter.config

          echo
          echo "========================================"
          echo "BUILD ARTIFACTS"
          echo "========================================"

          ls -lh artifacts

      # =========================================================
      # 13. Upload artifacts
      # =========================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          path: artifacts/
          if-no-files-found: error
