          python3 - "$IOCTL_SRC" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          CASE = """    case (SIOCDEVPRIVATE + 10):
              ret = hdd_frame_inject_ioctl(dev, ifr, cmd);
              break;
          """

          def locate_function(text, name):
              needle = name + "("
              start = text.find(needle)

              if start < 0:
                  raise SystemExit(
                      f"FATAL: {name}() not found"
                  )

              brace = text.find("{", start)

              if brace < 0:
                  raise SystemExit(
                      f"FATAL: opening brace for {name}() not found"
                  )

              depth = 0

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          return start, i + 1

              raise SystemExit(
                  f"FATAL: could not determine end of {name}()"
              )

          start, end = locate_function(
              text,
              "__hdd_ioctl"
          )

          block = text[start:end]

          if "switch (cmd)" not in block and \
             "switch(cmd)" not in block:
              raise SystemExit(
                  "FATAL: verified __hdd_ioctl() no longer "
                  "contains switch(cmd)."
              )

          if "case (SIOCDEVPRIVATE + 10):" in block:
              print(
                  "0x89FA already present in __hdd_ioctl(); "
                  "no duplicate inserted."
              )
              raise SystemExit(0)

          markers = [
              "\n\tdefault:",
              "\n    default:",
              "\ndefault:"
          ]

          marker = next(
              (m for m in markers if m in block),
              None
          )

          if marker is None:
              raise SystemExit(
                  "FATAL: __hdd_ioctl() default case not found. "
                  "Refusing to guess."
              )

          block = block.replace(
              marker,
              "\n" + CASE + marker,
              1
          )

          text = text[:start] + block + text[end:]
          path.write_text(text)

          print(
              "SUCCESS: 0x89FA wired into verified "
              "__hdd_ioctl() switch."
          )
          PY

          echo
          echo "=================================================="
          echo "POST-PATCH SOURCE VERIFICATION"
