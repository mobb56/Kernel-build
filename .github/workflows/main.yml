name: Build Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang-14 \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 2. Setup LLVM
      # ============================================================
      - name: Setup LLVM
        run: |
          set -e

          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

          /usr/lib/llvm-14/bin/clang --version
          /usr/lib/llvm-14/bin/ld.lld --version

      # ============================================================
      # 3. Checkout LineageOS SM6225 kernel
      # ============================================================
      - name: Checkout LineageOS SM6225 kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6225
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      # ============================================================
      # 4. Checkout cebu device tree
      # ============================================================
      - name: Checkout cebu device tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_cebu
          ref: lineage-23.2
          path: device/motorola/cebu
          fetch-depth: 1

      # ============================================================
      # 5. Checkout SM6225 common device tree
      # ============================================================
      - name: Checkout SM6225 common device tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_sm6225-common
          ref: lineage-23.2
          path: device/motorola/sm6225-common
          fetch-depth: 1

      # ============================================================
      # 6. Verify source
      # ============================================================
      - name: Verify source
        working-directory: kernel
        run: |
          set -e

          echo "Kernel revision:"
          git rev-parse HEAD

          echo
          echo "Checking required files..."

          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          test -f scripts/kconfig/merge_config.sh
          test -f drivers/sensors/Kconfig
          test -f drivers/sensors/Makefile
          test -f drivers/sensors/sensors_class.c

          echo "Required kernel files found."

          echo
          echo "Sensor driver configuration:"
          grep -n "CONFIG_SENSORS_SSC" drivers/Makefile || true
          grep -n "SENSORS_CLASS" drivers/sensors/Makefile || true

          echo
          echo "cebu BoardConfig:"
          grep -n "cebu-default.config" \
            "$GITHUB_WORKSPACE/device/motorola/cebu/BoardConfig.mk" \
            || true

      # ============================================================
      # 7. Clean kernel source
      # ============================================================
      - name: Clean kernel source
        working-directory: kernel
        run: |
          set -e

          make ARCH=arm64 mrproper

          rm -rf out
          rm -rf include/config
          rm -rf include/generated
          rm -rf arch/arm64/include/generated
          rm -rf .config

          echo "Kernel source cleaned."

      # ============================================================
      # 8. Locate cebu configuration
      # ============================================================
      - name: Locate cebu kernel configuration
        run: |
          set -e

          CEBU_CONFIG="$(find "$GITHUB_WORKSPACE" -type f -name "cebu-default.config" -print -quit)"

          if [ -n "$CEBU_CONFIG" ]; then
            echo "Found cebu config:"
            echo "$CEBU_CONFIG"
            echo "CEBU_CONFIG=$CEBU_CONFIG" >> "$GITHUB_ENV"
          else
            echo "::warning::cebu-default.config was not found in the checked-out public trees."
            echo "Continuing with the SM6225 Bengal base configuration."
          fi

      # ============================================================
      # 9. Create NetHunter configuration
      # ============================================================
      - name: Create NetHunter config
        working-directory: kernel
        run: |
          set -e

          cat > nethunter.config <<'EOF'
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y

          CONFIG_TTY=y
          CONFIG_INPUT=y
          CONFIG_HID=y
          CONFIG_INPUT_EVDEV=y
          CONFIG_INPUT_UINPUT=y
          CONFIG_UHID=y
          CONFIG_HIDRAW=y

          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_F_FS=y

          CONFIG_PACKET=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_TUN=y
          CONFIG_VETH=y

          CONFIG_CFG80211=y
          CONFIG_RFKILL=y

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m
          EOF

          echo "NetHunter configuration:"
          cat nethunter.config

      # ============================================================
      # 10. Configure base kernel
      # ============================================================
      - name: Configure base kernel
        working-directory: kernel
        run: |
          set -e

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

      # ============================================================
      # 11. Apply cebu configuration
      # ============================================================
      - name: Apply cebu configuration
        if: env.CEBU_CONFIG != ''
        working-directory: kernel
        run: |
          set -e

          scripts/kconfig/merge_config.sh \
            -m \
            -O out \
            out/.config \
            "$CEBU_CONFIG"

      # ============================================================
      # 12. Apply NetHunter configuration
      # ============================================================
      - name: Apply NetHunter configuration
        working-directory: kernel
        run: |
          set -e

          scripts/kconfig/merge_config.sh \
            -m \
            -O out \
            out/.config \
            nethunter.config

      # ============================================================
      # 13. Finalize configuration
      # ============================================================
      - name: Finalize configuration
        working-directory: kernel
        run: |
          set -e

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      # ============================================================
      # 14. Verify configuration
      # ============================================================
      - name: Verify NetHunter configuration
        working-directory: kernel
        run: |
          set -e

          CONFIG="out/.config"
          FAILED=0

          check_y() {
            OPTION="$1"

            if grep -q "^${OPTION}=y$" "$CONFIG"; then
              echo "OK: ${OPTION}=y"
            else
              echo "FAIL: ${OPTION} is NOT built-in"
              grep -E "^# ${OPTION} is not set$|^${OPTION}=" "$CONFIG" || true
              FAILED=1
            fi
          }

          check_m() {
            OPTION="$1"

            if grep -q "^${OPTION}=m$" "$CONFIG"; then
              echo "OK: ${OPTION}=m"
            else
              echo "FAIL: ${OPTION} is NOT a module"
              grep -E "^# ${OPTION} is not set$|^${OPTION}=" "$CONFIG" || true
              FAILED=1
            fi
          }

          echo "========== Bluetooth =========="

          check_y CONFIG_BT
          check_y CONFIG_BT_BREDR
          check_y CONFIG_BT_RFCOMM
          check_y CONFIG_BT_RFCOMM_TTY
          check_y CONFIG_BT_HIDP
          check_y CONFIG_BT_HCIVHCI
          check_y CONFIG_BT_HCIUART
          check_y CONFIG_BT_HCIUART_H4

          echo
          echo "========== Input / HID =========="

          check_y CONFIG_TTY
          check_y CONFIG_INPUT
          check_y CONFIG_HID
          check_y CONFIG_INPUT_EVDEV
          check_y CONFIG_INPUT_UINPUT
          check_y CONFIG_UHID
          check_y CONFIG_HIDRAW

          echo
          echo "========== USB Gadget =========="

          check_y CONFIG_USB_GADGET
          check_y CONFIG_USB_CONFIGFS
          check_y CONFIG_USB_CONFIGFS_F_HID
          check_y CONFIG_USB_CONFIGFS_NCM
          check_y CONFIG_USB_CONFIGFS_F_FS

          echo
          echo "========== Networking =========="

          check_y CONFIG_PACKET
          check_y CONFIG_NETFILTER
          check_y CONFIG_NETFILTER_XTABLES
          check_y CONFIG_NF_CONNTRACK
          check_y CONFIG_TUN
          check_y CONFIG_VETH

          echo
          echo "========== Wireless =========="

          check_y CONFIG_CFG80211
          check_y CONFIG_RFKILL

          echo
          echo "========== Sensors =========="

          check_y CONFIG_SENSORS_SSC
          check_m CONFIG_SENSORS_CLASS

          echo

          if [ "$FAILED" -ne 0 ]; then
            echo "CONFIGURATION VERIFICATION FAILED"
            exit 1
          fi

          echo "ALL REQUIRED CONFIGURATION OPTIONS PASSED."

      # ============================================================
      # 15. Save final config
      # ============================================================
      - name: Save final kernel config
        working-directory: kernel
        run: |
          set -e

          cp out/.config out/kernel.config

      # ============================================================
      # 16. Build kernel Image
      # ============================================================
      - name: Build kernel Image
        working-directory: kernel
        run: |
          set -e

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

      # ============================================================
      # 17. Build kernel modules
      # ============================================================
      - name: Build kernel modules
        working-directory: kernel
        run: |
          set -e

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules

      # ============================================================
      # 18. Verify sensor module
      # ============================================================
      - name: Verify sensor module
        working-directory: kernel
        run: |
          set -e

          SENSOR_MODULE="$(find out -type f -name "sensors_class.ko" -print -quit)"

          if [ -z "$SENSOR_MODULE" ]; then
            echo "ERROR: sensors_class.ko was not produced."
            grep -E "^CONFIG_SENSORS_(SSC|CLASS)=" out/.config || true
            exit 1
          fi

          echo "Sensor module found:"
          echo "$SENSOR_MODULE"

          ls -lh "$SENSOR_MODULE"

      # ============================================================
      # 19. Collect artifacts
      # ============================================================
      - name: Collect artifacts
        working-directory: kernel
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/artifact"

          mkdir -p "$GITHUB_WORKSPACE/artifact/modules/vendor/lib/modules"

          cp \
            out/arch/arm64/boot/Image \
            "$GITHUB_WORKSPACE/artifact/Image"

          cp \
            out/kernel.config \
            "$GITHUB_WORKSPACE/artifact/kernel.config"

          cp \
            nethunter.config \
            "$GITHUB_WORKSPACE/artifact/nethunter.config"

          SENSOR_MODULE="$(find out -type f -name "sensors_class.ko" -print -quit)"

          cp \
            "$SENSOR_MODULE" \
            "$GITHUB_WORKSPACE/artifact/modules/vendor/lib/modules/sensors_class.ko"

          echo
          echo "========== Artifact contents =========="

          find \
            "$GITHUB_WORKSPACE/artifact" \
            -type f \
            -printf '%P\n' \
            | sort

          echo
          echo "Kernel Image:"
          ls -lh "$GITHUB_WORKSPACE/artifact/Image"

          echo
          echo "Sensor module:"
          ls -lh "$GITHUB_WORKSPACE/artifact/modules/vendor/lib/modules/sensors_class.ko"

      # ============================================================
      # 20. Upload kernel artifact
      # ============================================================
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          path: artifact
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 21. Prepare AnyKernel3
      # ============================================================
      - name: Prepare AnyKernel3
        run: |
          set -e

          rm -rf AnyKernel3

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          cp \
            "$GITHUB_WORKSPACE/artifact/Image" \
            AnyKernel3/Image

          rm -rf AnyKernel3/modules

          mkdir -p \
            AnyKernel3/modules/vendor/lib/modules

          cp \
            "$GITHUB_WORKSPACE/artifact/modules/vendor/lib/modules/sensors_class.ko" \
            AnyKernel3/modules/vendor/lib/modules/sensors_class.ko

          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Moto G9 Power cebu NetHunter Kernel
          do.devicecheck=1
          do.modules=1
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=cebu
          device.name2=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot
          IS_SLOT_DEVICE=auto
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto

          . tools/ak3-core.sh

          dump_boot
          write_boot
          EOF

          echo
          echo "========== AnyKernel3 configuration =========="

          cat AnyKernel3/anykernel.sh

          echo
          echo "========== AnyKernel3 modules =========="

          find AnyKernel3/modules -type f -printf '%P\n' | sort

      # ============================================================
      # 22. Build flashable ZIP
      # ============================================================
      - name: Build AnyKernel3 flashable ZIP
        working-directory: AnyKernel3
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/moto-g9-power-cebu-nethunter-flashable.zip"

          rm -f "$ZIP_FILE"

          echo "Creating flashable ZIP..."

          zip -r9 "$ZIP_FILE" . -x '.git/*' -x '.github/*'

          echo
          echo "Flashable ZIP created:"
          ls -lh "$ZIP_FILE"

          echo
          echo "Testing ZIP..."

          unzip -t "$ZIP_FILE"

          echo
          echo "ZIP test completed successfully."

      # ============================================================
      # 23. Upload flashable ZIP
      # ============================================================
      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-flashable
          path: moto-g9-power-cebu-nethunter-flashable.zip
          if-no-files-found: error
          retention-days: 30
