name: QCACLD3 Frame Injection Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      KERNEL: ${{ github.workspace }}/kernel
      REFERENCE: ${{ github.workspace }}/reference
      OUT: ${{ github.workspace }}/out
      ARCH: arm64
      LLVM: "1"
      LLVM_IAS: "1"
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:

      # ------------------------------------------------------------
      # 1. Checkout workflow repository
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Install build dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils

      # ------------------------------------------------------------
      # 3. Clone exact Motorola / LineageOS kernel
      # ------------------------------------------------------------
      - name: Clone kernel source
        run: |
          set -eux

          rm -rf "$KERNEL"
          mkdir -p "$KERNEL"

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$KERNEL"

          cd "$KERNEL"

          echo "===== KERNEL COMMIT ====="
          git rev-parse HEAD

          echo "===== KERNEL STATUS ====="
          git status --short

      # ------------------------------------------------------------
      # 4. Clone known-working NetHunter QCACLD3 injection reference
      # ------------------------------------------------------------
      - name: Clone injection reference
        run: |
          set -eux

          rm -rf "$REFERENCE"

          git clone \
            --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            "$REFERENCE"

          echo "===== REFERENCE COMMIT ====="
          cd "$REFERENCE"
          git rev-parse HEAD

      # ------------------------------------------------------------
      # 5. Prepare output paths
      # ------------------------------------------------------------
      - name: Prepare paths
        run: |
          set -eux

          rm -rf "$OUT"
          mkdir -p "$OUT"

          mkdir -p "$GITHUB_WORKSPACE/reports"

          echo "KERNEL=$KERNEL"
          echo "REFERENCE=$REFERENCE"
          echo "OUT=$OUT"

      # ------------------------------------------------------------
      # 6. Verify source trees
      # ------------------------------------------------------------
      - name: Verify source trees
        run: |
          set -eux

          test -f "$KERNEL/Makefile"
          test -f "$KERNEL/arch/arm64/Makefile"

          test -f "$KERNEL/drivers/staging/qcacld-3.0/Kbuild"

          test -f "$REFERENCE/drivers/staging/qcacld-3.0/Kbuild"

          echo "===== MOTOROLA QCACLD3 ====="
          grep -n "KERNEL_BUILD" \
            "$KERNEL/drivers/staging/qcacld-3.0/Kbuild" | head

          echo "===== REFERENCE INJECTION ====="
          grep -n "CONFIG_FEATURE_FRAME_INJECTION_SUPPORT" \
            "$REFERENCE/drivers/staging/qcacld-3.0/Kbuild" | head -20

      # ------------------------------------------------------------
      # 7. Configure kernel
      # ------------------------------------------------------------
      - name: Configure kernel
        run: |
          set -eux

          cd "$KERNEL"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            vendor/bengal-perf_defconfig

          scripts/config \
            --file "$OUT/.config" \
            --enable CONFIG_QCA_CLD_WLAN \
            --module CONFIG_QCA_CLD_WLAN \
            --enable CONFIG_SENSORS_SSC \
            --module CONFIG_SENSORS_CLASS

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            olddefconfig

          echo "===== QCACLD CONFIG ====="
          grep -E \
            'CONFIG_QCA_CLD_WLAN=|CONFIG_SENSORS_SSC=|CONFIG_SENSORS_CLASS=' \
            "$OUT/.config"

      # ------------------------------------------------------------
      # 8. Prepare kernel
      # ------------------------------------------------------------
      - name: Prepare kernel
        run: |
          set -eux

          cd "$KERNEL"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            prepare

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            modules_prepare

      # ------------------------------------------------------------
      # 9. Baseline QCACLD3 build
      # ------------------------------------------------------------
      - name: Baseline QCACLD3 build
        run: |
          set -eux

          cd "$KERNEL"

          echo "===== BASELINE BUILD ====="

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            V=1 \
            M=drivers/staging/qcacld-3.0 \
            modules

          test -f "$OUT/drivers/staging/qcacld-3.0/wlan.ko"

          echo "===== BASELINE SUCCESS ====="

      # ------------------------------------------------------------
      # 10. Import complete injection source set
      # ------------------------------------------------------------
      - name: Import injection sources and headers
        run: |
          set -eux

          SRC="$REFERENCE/drivers/staging/qcacld-3.0"
          DST="$KERNEL/drivers/staging/qcacld-3.0"

          # HDD headers
          cp -f \
            "$SRC/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "$DST/core/hdd/inc/"

          cp -f \
            "$SRC/core/hdd/inc/wlan_hdd_frame_validate.h" \
            "$DST/core/hdd/inc/"

          cp -f \
            "$SRC/core/hdd/inc/wlan_hdd_inject_security.h" \
            "$DST/core/hdd/inc/"

          cp -f \
            "$SRC/core/hdd/inc/wlan_hdd_frame_inject_debug.h" \
            "$DST/core/hdd/inc/"

          # HDD sources
          cp -f \
            "$SRC/core/hdd/src/wlan_hdd_frame_inject.c" \
            "$DST/core/hdd/src/"

          cp -f \
            "$SRC/core/hdd/src/wlan_hdd_frame_validate.c" \
            "$DST/core/hdd/src/"

          cp -f \
            "$SRC/core/hdd/src/wlan_hdd_inject_security.c" \
            "$DST/core/hdd/src/"

          cp -f \
            "$SRC/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
            "$DST/core/hdd/src/"

          # WMA header
          cp -f \
            "$SRC/core/wma/inc/wma_frame_inject.h" \
            "$DST/core/wma/inc/"

          # WMA source
          cp -f \
            "$SRC/core/wma/src/wma_frame_inject.c" \
            "$DST/core/wma/src/"

          echo "===== IMPORTED FILES ====="

          find "$DST/core/hdd/inc" \
            -maxdepth 1 \
            -name '*inject*' \
            -o -name '*validate*' | sort

          find "$DST/core/hdd/src" \
            -maxdepth 1 \
            -name '*inject*' \
            -o -name '*validate*' | sort

          find "$DST/core/wma/inc" \
            -maxdepth 1 \
            -name '*inject*' | sort

          find "$DST/core/wma/src" \
            -maxdepth 1 \
            -name '*inject*' | sort

      # ------------------------------------------------------------
      # 11. Adapt Motorola HDD adapter structure
      # ------------------------------------------------------------
      - name: Adapt HDD injection context
        run: |
          set -eux

          MAIN="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h"

          python3 -c 'from pathlib import Path; p=Path("'"$MAIN"'"); s=p.read_text(); old="\tqdf_atomic_t net_dev_hold_ref_count[NET_DEV_HOLD_ID_MAX];\n"; new="\tqdf_atomic_t net_dev_hold_ref_count[NET_DEV_HOLD_ID_MAX];\n#ifdef FEATURE_FRAME_INJECTION_SUPPORT\n\tstruct hdd_injection_ctx *injection_ctx;\n#endif\n"; assert old in s, "hdd_adapter insertion point not found"; assert "struct hdd_injection_ctx *injection_ctx;" not in s; p.write_text(s.replace(old,new,1))'

          echo "===== INJECTION CONTEXT ====="
          grep -n -A4 -B3 \
            "injection_ctx" \
            "$MAIN"

      # ------------------------------------------------------------
      # 12. Add injection API include to Motorola HDD main header
      # ------------------------------------------------------------
      - name: Include injection API
        run: |
          set -eux

          MAIN="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h"

          python3 -c 'from pathlib import Path; p=Path("'"$MAIN"'"); s=p.read_text(); old="#include \"wlan_hdd_sta_info.h\"\n"; new="#include \"wlan_hdd_sta_info.h\"\n#ifdef FEATURE_FRAME_INJECTION_SUPPORT\n#include \"wlan_hdd_frame_inject.h\"\n#endif\n"; assert old in s, "wlan_hdd_sta_info.h include marker not found"; assert "wlan_hdd_frame_inject.h" not in s; p.write_text(s.replace(old,new,1))'

          echo "===== INJECTION INCLUDE ====="
          grep -n -A4 -B3 \
            "wlan_hdd_frame_inject.h" \
            "$MAIN"

      # ------------------------------------------------------------
      # 13. Patch Motorola QCACLD3 Kbuild
      #
      # IMPORTANT:
      # No Perl.
      # No shell environment substitution.
      # No embedded Python indentation.
      #
      # We use Python -c one-liners with literal Kbuild markers.
      # ------------------------------------------------------------
      - name: Patch QCACLD3 Kbuild
        run: |
          set -eux

          KBUILD="$KERNEL/drivers/staging/qcacld-3.0/Kbuild"

          python3 -c 'from pathlib import Path; p=Path("'"$KBUILD"'"); s=p.read_text(); marker="ifeq ($(CONFIG_WLAN_NUD_TRACKING), y)\n"; block="ifeq ($(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT), y)\nHDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o\nHDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o\nHDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o\nHDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o\nendif\n\n"; assert marker in s, "HDD Kbuild marker not found"; assert "wlan_hdd_frame_inject.o" not in s; p.write_text(s.replace(marker,block+marker,1))'

          python3 -c 'from pathlib import Path; p=Path("'"$KBUILD"'"); s=p.read_text(); marker="\t\t$(WMA_NDP_OBJS)\n"; block="\nifeq ($(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT), y)\nWMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o\nendif\n"; assert marker in s, "WMA Kbuild marker not found"; assert "wma_frame_inject.o" not in s; p.write_text(s.replace(marker,marker+block,1))'

          python3 -c 'from pathlib import Path; p=Path("'"$KBUILD"'"); s=p.read_text(); marker="ccflags-y += $(INCS)\n"; block="ccflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT\nccflags-y += -DFEATURE_MONITOR_MODE_SUPPORT\nccflags-y += $(HDD_INC)\nccflags-y += $(WMA_INC)\n"; assert marker in s, "ccflags marker not found"; assert "-DFEATURE_FRAME_INJECTION_SUPPORT" not in s; p.write_text(s.replace(marker,block+marker,1))'

          echo "===== VERIFY HDD OBJECTS ====="

          grep -n \
            "wlan_hdd_frame_inject.o" \
            "$KBUILD"

          grep -n \
            "wlan_hdd_frame_validate.o" \
            "$KBUILD"

          grep -n \
            "wlan_hdd_inject_security.o" \
            "$KBUILD"

          grep -n \
            "wlan_hdd_frame_inject_debug.o" \
            "$KBUILD"

          echo "===== VERIFY WMA OBJECT ====="

          grep -n \
            "wma_frame_inject.o" \
            "$KBUILD"

          echo "===== VERIFY FLAGS ====="

          grep -n \
            "FEATURE_FRAME_INJECTION_SUPPORT" \
            "$KBUILD"

          grep -n \
            "FEATURE_MONITOR_MODE_SUPPORT" \
            "$KBUILD"

          echo "===== VERIFY INCLUDE PATHS ====="

          grep -n \
            'ccflags-y += $(HDD_INC)' \
            "$KBUILD"

          grep -n \
            'ccflags-y += $(WMA_INC)' \
            "$KBUILD"

      # ------------------------------------------------------------
      # 14. Show final patched Kbuild
      # ------------------------------------------------------------
      - name: Show patched QCACLD3 Kbuild
        run: |
          set -eux

          KBUILD="$KERNEL/drivers/staging/qcacld-3.0/Kbuild"

          echo "===== HDD INJECTION BLOCK ====="

          grep -n -A8 -B2 \
            "wlan_hdd_frame_inject.o" \
            "$KBUILD"

          echo "===== WMA INJECTION BLOCK ====="

          grep -n -A4 -B3 \
            "wma_frame_inject.o" \
            "$KBUILD"

          echo "===== FLAGS / INCLUDE PATHS ====="

          grep -n -A5 -B2 \
            "FEATURE_FRAME_INJECTION_SUPPORT" \
            "$KBUILD"

      # ------------------------------------------------------------
      # 15. Clean only QCACLD3 module outputs
      # ------------------------------------------------------------
      - name: Clean QCACLD3 module outputs
        run: |
          set -eux

          cd "$KERNEL"

          rm -f \
            "$OUT/drivers/staging/qcacld-3.0/wlan.ko" \
            "$OUT/drivers/staging/qcacld-3.0/wlan.o" \
            "$OUT/drivers/staging/qcacld-3.0/wlan.lto.o" \
            "$OUT/drivers/staging/qcacld-3.0/wlan.mod.c" \
            "$OUT/drivers/staging/qcacld-3.0/wlan.mod.o" \
            "$OUT/drivers/staging/qcacld-3.0/modules.order" \
            "$OUT/drivers/staging/qcacld-3.0/Module.symvers"

          find "$OUT/drivers/staging/qcacld-3.0" \
            -name '*.o' \
            -delete || true

          find "$OUT/drivers/staging/qcacld-3.0" \
            -name '*.o.cmd' \
            -delete || true

      # ------------------------------------------------------------
      # 16. Build injection-enabled QCACLD3
      # ------------------------------------------------------------
      - name: Build injection-enabled QCACLD3
        run: |
          set -eux

          cd "$KERNEL"

          echo "===== INJECTION BUILD ====="

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            V=1 \
            CONFIG_QCA_CLD_WLAN=m \
            CONFIG_FEATURE_FRAME_INJECTION_SUPPORT=y \
            CONFIG_FEATURE_MONITOR_MODE_SUPPORT=y \
            M=drivers/staging/qcacld-3.0 \
            modules

      # ------------------------------------------------------------
      # 17. Verify every injection object and final wlan.ko
      # ------------------------------------------------------------
      - name: Verify injection build
        run: |
          set -eux

          BASE="$OUT/drivers/staging/qcacld-3.0"

          test -f "$BASE/wlan.ko"

          test -f "$BASE/core/hdd/src/wlan_hdd_frame_inject.o"
          test -f "$BASE/core/hdd/src/wlan_hdd_frame_validate.o"
          test -f "$BASE/core/hdd/src/wlan_hdd_inject_security.o"
          test -f "$BASE/core/hdd/src/wlan_hdd_frame_inject_debug.o"
          test -f "$BASE/core/wma/src/wma_frame_inject.o"

          echo "INJECTION_OBJECTS=5"
          echo "INJECTION_BUILD=SUCCESS"

          echo "===== FINAL MODULE ====="

          ls -lh "$BASE/wlan.ko"

          echo "===== MODULE INFO ====="

          file "$BASE/wlan.ko"

          modinfo "$BASE/wlan.ko" || true

      # ------------------------------------------------------------
      # 18. Collect diagnostics
      # ------------------------------------------------------------
      - name: Collect diagnostics
        if: always()
        run: |
          set +e

          REPORT="$GITHUB_WORKSPACE/reports/qcacld3-injection-report.txt"

          {
            echo "=================================================="
            echo "QCACLD3 INJECTION BUILD REPORT"
            echo "=================================================="
            echo

            echo "DATE:"
            date -u
            echo

            echo "MOTOROLA KERNEL COMMIT:"
            cd "$KERNEL" 2>/dev/null && git rev-parse HEAD
            echo

            echo "REFERENCE COMMIT:"
            cd "$REFERENCE" 2>/dev/null && git rev-parse HEAD
            echo

            echo "=================================================="
            echo "INJECTION SOURCES"
            echo "=================================================="

            find "$KERNEL/drivers/staging/qcacld-3.0/core/hdd" \
              -maxdepth 2 \
              \( -name '*inject*' -o -name '*validate*' \) \
              -print 2>/dev/null | sort

            find "$KERNEL/drivers/staging/qcacld-3.0/core/wma" \
              -maxdepth 2 \
              -name '*inject*' \
              -print 2>/dev/null | sort

            echo
            echo "=================================================="
            echo "KBUILD INJECTION REFERENCES"
            echo "=================================================="

            grep -n \
              -E 'FRAME_INJECTION|wlan_hdd_.*inject|wma_frame_inject|HDD_INC|WMA_INC' \
              "$KERNEL/drivers/staging/qcacld-3.0/Kbuild" \
              2>/dev/null

            echo
            echo "=================================================="
            echo "INJECTION CONTEXT"
            echo "=================================================="

            grep -n -A4 -B4 \
              "injection_ctx" \
              "$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h" \
              2>/dev/null

            echo
            echo "=================================================="
            echo "BUILD OUTPUT"
            echo "=================================================="

            find "$OUT/drivers/staging/qcacld-3.0" \
              -maxdepth 5 \
              \( -name '*.o' -o -name '*.ko' \) \
              -print 2>/dev/null | sort

            echo
            echo "=================================================="
            echo "WLAN MODULE"
            echo "=================================================="

            if [ -f "$OUT/drivers/staging/qcacld-3.0/wlan.ko" ]; then
              ls -lh "$OUT/drivers/staging/qcacld-3.0/wlan.ko"
              sha256sum "$OUT/drivers/staging/qcacld-3.0/wlan.ko"
              file "$OUT/drivers/staging/qcacld-3.0/wlan.ko"
            else
              echo "wlan.ko NOT BUILT"
            fi

          } > "$REPORT" 2>&1

          echo "===== REPORT ====="
          cat "$REPORT"

      # ------------------------------------------------------------
      # 19. Upload diagnostics
      # ------------------------------------------------------------
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-injection-report
          path: reports/qcacld3-injection-report.txt
          if-no-files-found: warn

      # ------------------------------------------------------------
      # 20. Upload successful WLAN module
      # ------------------------------------------------------------
      - name: Upload successful wlan module
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-injection-wlan-module
          path: out/drivers/staging/qcacld-3.0/wlan.ko
          if-no-files-found: error
