      - name: Build Cesium userspace injector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/tools"
          cat > "${GITHUB_WORKSPACE}/tools/cebu_cesium_inject.c" <<EOF
          #include <errno.h>
          #include <linux/netlink.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/socket.h>
          #include <unistd.h>

          #define WLAN_NLINK_CESIUM 30
          #define CESIUM_FRAME_MAX 4096

          #define ATTR_FRAME_DATA  (${ATTR_FRAME_DATA})
          #define ATTR_FRAME_LEN   (${ATTR_FRAME_LEN})
          #define ATTR_VDEV_ID     (${ATTR_VDEV_ID})

          static int nl_socket_create(void)
          {
              int fd = socket(AF_NETLINK, SOCK_RAW, WLAN_NLINK_CESIUM);
              if (fd < 0) { perror("socket"); return -1; }
              struct sockaddr_nl local;
              memset(&local, 0, sizeof(local));
              local.nl_family = AF_NETLINK;
              local.nl_pid = (uint32_t)getpid();
              if (bind(fd, (struct sockaddr *)&local, sizeof(local)) < 0) {
                  perror("bind"); close(fd); return -1;
              }
              return fd;
          }

          static int nl_attr_put(unsigned char *buf, size_t buf_size,
                                 size_t *offset, uint16_t type,
                                 const void *data, size_t len)
          {
              size_t total = NLA_ALIGN(sizeof(struct nlattr) + len);
              if (*offset + total > buf_size) return -1;
              struct nlattr *attr = (struct nlattr *)(buf + *offset);
              attr->nla_type = type;
              attr->nla_len = sizeof(struct nlattr) + len;
              memcpy((unsigned char *)attr + sizeof(struct nlattr), data, len);
              memset((unsigned char *)attr + sizeof(struct nlattr) + len,
                     0, total - sizeof(struct nlattr) - len);
              *offset += total;
              return 0;
          }

          static int read_frame(const char *path, unsigned char *frame, size_t *len)
          {
              FILE *fp = fopen(path, "rb");
              if (!fp) { perror("fopen"); return -1; }
              if (fseek(fp, 0, SEEK_END) != 0) { fclose(fp); return -1; }
              long size = ftell(fp);
              if (size <= 0 || size > CESIUM_FRAME_MAX) {
                  fprintf(stderr, "Invalid frame size: %ld\n", size);
                  fclose(fp); return -1;
              }
              rewind(fp);
              if (fread(frame, 1, (size_t)size, fp) != (size_t)size) {
                  perror("fread"); fclose(fp); return -1;
              }
              fclose(fp);
              *len = (size_t)size;
              return 0;
          }

          int main(int argc, char **argv)
          {
              if (argc < 2 || argc > 3) {
                  fprintf(stderr, "Usage: %s frame.bin [vdev_id]\n", argv[0]);
                  return 2;
              }
              unsigned char frame[CESIUM_FRAME_MAX];
              size_t frame_len;
              if (read_frame(argv[1], frame, &frame_len) < 0) return 1;
              uint32_t vdev_id = 0;
              if (argc == 3) vdev_id = (uint32_t)strtoul(argv[2], NULL, 10);
              int fd = nl_socket_create();
              if (fd < 0) return 1;
              unsigned char packet[8192];
              memset(packet, 0, sizeof(packet));
              struct nlmsghdr *nlh = (struct nlmsghdr *)packet;
              nlh->nlmsg_len = NLMSG_LENGTH(0);
              nlh->nlmsg_type = 0;
              nlh->nlmsg_flags = NLM_F_REQUEST;
              nlh->nlmsg_seq = 1;
              nlh->nlmsg_pid = (uint32_t)getpid();
              size_t offset = NLMSG_ALIGN(nlh->nlmsg_len);
              if (nl_attr_put(packet, sizeof(packet), &offset,
                              ATTR_FRAME_DATA, frame, frame_len) < 0) {
                  fprintf(stderr, "attr frame_data failed\n"); close(fd); return 1;
              }
              if (nl_attr_put(packet, sizeof(packet), &offset,
                              ATTR_FRAME_LEN, &frame_len, sizeof(frame_len)) < 0) {
                  fprintf(stderr, "attr frame_len failed\n"); close(fd); return 1;
              }
              if (nl_attr_put(packet, sizeof(packet), &offset,
                              ATTR_VDEV_ID, &vdev_id, sizeof(vdev_id)) < 0) {
                  fprintf(stderr, "attr vdev_id failed\n"); close(fd); return 1;
              }
              nlh->nlmsg_len = (uint32_t)offset;
              struct sockaddr_nl kernel;
              memset(&kernel, 0, sizeof(kernel));
              kernel.nl_family = AF_NETLINK;
              if (sendto(fd, packet, nlh->nlmsg_len, 0,
                         (struct sockaddr *)&kernel, sizeof(kernel)) < 0) {
                  perror("sendto"); close(fd); return 1;
              }
              printf("Submitted %zu byte frame to vdev %u\n", frame_len, vdev_id);
              close(fd);
              return 0;
          }
          EOF

          ${CC:-gcc} -O2 -Wall -Wextra \
            "${GITHUB_WORKSPACE}/tools/cebu_cesium_inject.c" \
            -o "${GITHUB_WORKSPACE}/tools/cebu_cesium_inject"
          chmod 0755 "${GITHUB_WORKSPACE}/tools/cebu_cesium_inject"
          file "${GITHUB_WORKSPACE}/tools/cebu_cesium_inject"

      - name: Verify build outputs
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${OUT_DIR}/arch/arm64/boot/Image"
          test -s "$IMAGE"
          SZ="$(stat -c '%s' "$IMAGE")"
          echo "Image size: ${SZ}"
          test "${SZ}" -lt 100663296

          R="$(make -s O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
