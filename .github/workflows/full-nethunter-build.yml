          COUNT="$(
            grep -c \
              'case (SIOCDEVPRIVATE + 10):' \
              "$IOCTL_SRC" || true
          )"

          echo "0x89FA case count: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "FATAL: Expected exactly one 0x89FA case."
            exit 1
