name: Build Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. Dependencies
      # =========================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang-14 \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # =========================================================
      # 2. LLVM
      # =========================================================
      - name: Setup LLVM
        run: |
          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

          echo "===== CLANG ====="
          /usr/lib/llvm-14/bin/clang --version

          echo
          echo "===== LLD ====="
          /usr/lib/llvm-14/bin/ld.lld --version

      # =========================================================
      # 3. Kernel
      # =========================================================
      - name: Checkout LineageOS kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6225
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      # =========================================================
      # 4. Cebu device tree
      # =========================================================
      - name: Checkout cebu device tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_cebu
          ref: lineage-23.2
          path: device/motorola/cebu
          fetch-depth: 1

      # =========================================================
      # 5. Common tree
      # =========================================================
      - name: Checkout SM6225 common tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_sm6225-common
          ref: lineage-23.2
          path: device/motorola/sm6225-common
          fetch-depth: 1

      # =========================================================
      # 6. Verify source
      # =========================================================
      - name: Verify source
        run: |
          echo "===== KERNEL ====="
          git -C kernel rev-parse --short HEAD

          echo
          echo "===== CEBU ====="
          git -C device/motorola/cebu rev-parse --short HEAD

          echo
          echo "===== COMMON ====="
          git -C device/motorola/sm6225-common rev-parse --short HEAD

          echo
          echo "===== DEFCONFIG ====="

          test -f \
            kernel/arch/arm64/configs/vendor/bengal-perf_defconfig

          echo "vendor/bengal-perf_defconfig found"

          echo
          echo "===== QCOM TRACE HEADER ====="

          test -f \
            kernel/drivers/clk/qcom/trace.h

          echo "drivers/clk/qcom/trace.h found"

      # =========================================================
      # 7. Clean source tree
      # =========================================================
      - name: Clean kernel source
        working-directory: kernel
        run: |
          make mrproper

          rm -rf out

          echo "Source tree cleaned."

          test ! -f .config
          test ! -d include/config

      # =========================================================
      # 8. NetHunter configuration
      # =========================================================
      - name: Create NetHunter config
        working-directory: kernel
        run: |
          cat > nethunter.config <<'EOF'

          #
          # Bluetooth
          #
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y

          #
          # USB Gadget / HID
          #
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y

          #
          # USB networking
          #
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_F_FS=y

          #
          # HID / input
          #
          CONFIG_INPUT_EVDEV=y
          CONFIG_INPUT_UINPUT=y
          CONFIG_UHID=y
          CONFIG_HIDRAW=y

          #
          # Networking
          #
          CONFIG_PACKET=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_TUN=y
          CONFIG_VETH=y

          #
          # Wireless framework
          #
          CONFIG_CFG80211=y
          CONFIG_RFKILL=y

          EOF

          echo "NetHunter fragment created."

      # =========================================================
      # 9. Base configuration
      # =========================================================
      - name: Configure base kernel
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          echo
          echo "Base configuration created."

          test -f out/.config

      # =========================================================
      # 10. Merge NetHunter configuration
      # =========================================================
      - name: Merge NetHunter config
        working-directory: kernel
        run: |
          scripts/kconfig/merge_config.sh \
            -m \
            out/.config \
            nethunter.config

          echo
          echo "NetHunter configuration merged."

          test -f out/.config

      # =========================================================
      # 11. Finalize configuration
      # =========================================================
      - name: Finalize configuration
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "Configuration finalized."

          test -f out/.config

      # =========================================================
      # 12. Clean accidental source-tree config
      # =========================================================
      - name: Clean source tree before build
        working-directory: kernel
        run: |
          echo "Checking source tree..."

          rm -f .config
          rm -rf include/config
          rm -rf include/generated
          rm -rf arch/arm64/include/generated

          echo
          echo "Source tree status:"

          if [ -f .config ]; then
            echo "ERROR: source .config exists"
            exit 1
          fi

          if [ -d include/config ]; then
            echo "ERROR: source include/config exists"
            exit 1
          fi

          echo "Source tree is clean."

          echo
          echo "Output configuration:"
          test -f out/.config
          ls -lh out/.config

      # =========================================================
      # 13. Verify NetHunter options
      # =========================================================
      - name: Verify configuration
        working-directory: kernel
        run: |
          echo "===== BLUETOOTH ====="

          grep -E \
            'CONFIG_BT=|CONFIG_BT_BREDR=|CONFIG_BT_RFCOMM=|CONFIG_BT_HIDP=|CONFIG_BT_HCIVHCI=|CONFIG_BT_HCIUART=' \
            out/.config || true

          echo
          echo "===== USB HID ====="

          grep -E \
            'CONFIG_USB_GADGET=|CONFIG_USB_CONFIGFS=|CONFIG_USB_CONFIGFS_F_HID=' \
            out/.config || true

          echo
          echo "===== NETWORKING ====="

          grep -E \
            'CONFIG_PACKET=|CONFIG_NETFILTER=|CONFIG_NF_CONNTRACK=|CONFIG_TUN=|CONFIG_VETH=' \
            out/.config || true

          echo
          echo "===== WIRELESS ====="

          grep -E \
            'CONFIG_CFG80211=|CONFIG_RFKILL=' \
            out/.config || true

      # =========================================================
      # 14. Build
      # =========================================================
      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          echo "========================================"
          echo "BUILDING MOTO G9 POWER KERNEL"
          echo "========================================"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image \
            dtbs \
            modules

      # =========================================================
      # 15. Collect artifacts
      # =========================================================
      - name: Collect artifacts
        run: |
          mkdir -p artifacts

          echo "Copying Image..."

          cp kernel/out/arch/arm64/boot/Image \
            artifacts/Image

          echo
          echo "Copying DTBs..."

          find kernel/out/arch/arm64/boot/dts \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp {} artifacts/ \; || true

          echo
          echo "Copying configuration..."

          cp kernel/out/.config \
            artifacts/kernel.config

          cp kernel/nethunter.config \
            artifacts/nethunter.config

          echo
          echo "========================================"
          echo "ARTIFACTS"
          echo "========================================"

          ls -lh artifacts

      # =========================================================
      # 16. Upload
      # =========================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          path: artifacts/
          if-no-files-found: error
