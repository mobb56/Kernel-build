name: QCACLD3 Injection Port Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. MOTOROLA QCACLD-3 SOURCE
      # ============================================================

      - name: Clone Motorola QCACLD3
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p vendor/qcom/opensource/wlan

          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qcacld-3.0.git \
            vendor/qcom/opensource/wlan/qcacld-3.0


      # ============================================================
      # 2. MOTOROLA HOST COMMON
      # ============================================================

      - name: Clone Motorola QCA host common
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qca-wifi-host-cmn.git \
            vendor/qcom/opensource/wlan/qca-wifi-host-cmn


      # ============================================================
      # 3. MOTOROLA FW API
      # ============================================================

      - name: Clone Motorola FW API
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-fw-api.git \
            vendor/qcom/opensource/wlan/fw-api


      # ============================================================
      # 4. CLONE THE KNOWN NET HUNTER SOURCE
      # ============================================================

      - name: Clone NetHunter reference kernel
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reference

          git clone \
            --branch patches \
            --single-branch \
            --depth=100 \
            https://github.com/Loukious/android_kernel_xiaomi_sm8150.git \
            reference/android_kernel_xiaomi_sm8150

          echo
          echo "Reference commit:"
          git -C reference/android_kernel_xiaomi_sm8150 rev-parse HEAD

          echo
          echo "Reference remote:"
          git -C reference/android_kernel_xiaomi_sm8150 remote get-url origin


      # ============================================================
      # 5. LOCATE INJECTION PATCH
      # ============================================================

      - name: Locate NetHunter injection patch
        shell: bash
        run: |
          set -euxo pipefail

          PATCH="reference/android_kernel_xiaomi_sm8150/patches/patches/nethunter/07_packet_injection.patch"

          test -f "$PATCH"

          cp "$PATCH" \
            nethunter-qcacld3-injection.patch

          echo
          echo "Patch found:"
          ls -lh nethunter-qcacld3-injection.patch

          echo
          echo "Patch SHA256:"
          sha256sum nethunter-qcacld3-injection.patch

          echo
          echo "Patch line count:"
          wc -l nethunter-qcacld3-injection.patch


      # ============================================================
      # 6. FIND THE PATCH COMMIT
      # ============================================================

      - name: Identify patch history
        shell: bash
        run: |
          set +e

          REPO="reference/android_kernel_xiaomi_sm8150"

          {
            echo "NETHUNTER QCACLD3 PATCH HISTORY"
            echo "================================"
            echo

            git -C "$REPO" log \
              --all \
              --oneline \
              --decorate \
              -- \
              patches/patches/nethunter/07_packet_injection.patch \
              | head -30

            echo
            echo "Recent reference commits:"
            git -C "$REPO" log \
              --oneline \
              --decorate \
              -20

          } > patch-history.txt

          cat patch-history.txt


      # ============================================================
      # 7. LIST PATCH FILES
      # ============================================================

      - name: Extract affected files
        shell: bash
        run: |
          set -u

          {
            echo "FILES MODIFIED BY NETHUNTER QCACLD3 PATCH"
            echo "=========================================="
            echo

            grep '^diff --git ' \
              nethunter-qcacld3-injection.patch \
              || true

          } > affected-files.txt

          cat affected-files.txt


      # ============================================================
      # 8. CREATE ISOLATED MOTOROLA TREE
      # ============================================================

      - name: Create isolated Motorola tree
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/motorola-qcacld3

          mkdir -p /tmp/motorola-qcacld3/drivers/staging

          cp -a \
            vendor/qcom/opensource/wlan/qcacld-3.0 \
            /tmp/motorola-qcacld3/drivers/staging/qcacld-3.0

          cp -a \
            vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
            /tmp/motorola-qcacld3/drivers/staging/qca-wifi-host-cmn

          cd /tmp/motorola-qcacld3

          git init

          git config user.name "QCACLD3 Analysis"

          git config user.email "analysis@example.invalid"

          git add .

          git commit \
            -m "Motorola QCACLD3 analysis baseline"


      # ============================================================
      # 9. APPLY PATCH TO ISOLATED COPY
      #
      # --reject deliberately creates .rej files instead of
      # stopping at the first failure.
      # ============================================================

      - name: Generate patch rejection files
        shell: bash
        run: |
          set +e

          cd /tmp/motorola-qcacld3

          git apply \
            --reject \
            --whitespace=nowarn \
            "$GITHUB_WORKSPACE/nethunter-qcacld3-injection.patch" \
            > "$GITHUB_WORKSPACE/patch-apply-output.txt" \
            2>&1

          STATUS=$?

          echo "Patch application exit code: $STATUS"

          find . \
            -name '*.rej' \
            -type f \
            | sort \
            > "$GITHUB_WORKSPACE/rejection-files.txt"

          echo
          echo "Rejection files:"
          cat "$GITHUB_WORKSPACE/rejection-files.txt"

          exit 0


      # ============================================================
      # 10. EXTRACT FAILED HUNKS
      # ============================================================

      - name: Analyze rejected hunks
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/rejected-hunks.txt"

          {
            echo "QCACLD3 REJECTED HUNKS"
            echo "======================"
            echo

            while IFS= read -r FILE
            do
              [ -z "$FILE" ] && continue

              echo
              echo "================================================"
              echo "REJECTION: $FILE"
              echo "================================================"

              cat "/tmp/motorola-qcacld3/$FILE" 2>/dev/null || true

            done < "$GITHUB_WORKSPACE/rejection-files.txt"

          } > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # 11. EXTRACT FUNCTION NAMES FROM PATCH
      # ============================================================

      - name: Extract functions from patch
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/patch-functions.txt"

          {
            echo "FUNCTIONS / SYMBOLS REFERENCED BY PATCH"
            echo "======================================="
            echo

            grep -E \
              '^[+-][a-zA-Z_][a-zA-Z0-9_ *&:<>(),\[\]]*\(' \
              nethunter-qcacld3-injection.patch \
              | head -1000 \
              || true

            echo
            echo "Likely WLAN symbols:"
            echo

            grep -E \
              -o \
              '\b(wlan_[A-Za-z0-9_]+|wma_[A-Za-z0-9_]+|ol_[A-Za-z0-9_]+|qdf_[A-Za-z0-9_]+|wmi_[A-Za-z0-9_]+)\b' \
              nethunter-qcacld3-injection.patch \
              | sort -u \
              | head -1000 \
              || true

          } > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # 12. FIND PATCH SYMBOLS IN MOTOROLA SOURCE
      # ============================================================

      - name: Map patch symbols into Motorola source
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/motorola-symbol-map.txt"

          {
            echo "MOTOROLA QCACLD3 SYMBOL MAP"
            echo "==========================="
            echo

            grep -E \
              -o \
              '\b(wlan_[A-Za-z0-9_]+|wma_[A-Za-z0-9_]+|ol_[A-Za-z0-9_]+|qdf_[A-Za-z0-9_]+|wmi_[A-Za-z0-9_]+)\b' \
              nethunter-qcacld3-injection.patch \
              | sort -u \
              | while read -r SYMBOL
            do

              [ -z "$SYMBOL" ] && continue

              echo
              echo "------------------------------------------------"
              echo "$SYMBOL"
              echo "------------------------------------------------"

              grep -Rni \
                --exclude-dir=.git \
                -E \
                "(^|[^A-Za-z0-9_])${SYMBOL}([^A-Za-z0-9_]|$)" \
                vendor/qcom/opensource/wlan/qcacld-3.0 \
                vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
                2>/dev/null \
                | head -40 \
                || echo "NOT FOUND"

            done

          } > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # 13. FIND EQUIVALENT FUNCTIONS IN MOTOROLA SOURCE
      # ============================================================

      - name: Search Motorola source for injection-related functions
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/motorola-injection-functions.txt"

          {
            echo "MOTOROLA INJECTION-RELATED FUNCTIONS"
            echo "====================================="
            echo

            grep -Rni \
              --exclude-dir=.git \
              -E \
              'mgmt_tx|mgmt.*tx|tx.*mgmt|monitor|radiotap|frame.*inject|inject.*frame|testmode|raw.*80211|80211.*raw|txrx|wmi.*tx' \
              vendor/qcom/opensource/wlan/qcacld-3.0 \
              vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
              2>/dev/null \
              | head -5000 \
              || true

          } > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # 14. COMPARE KEY SOURCE DIRECTORIES
      # ============================================================

      - name: Compare QCACLD3 directory structure
        shell: bash
        run: |
          set -u

          {
            echo "MOTOROLA QCACLD3 DIRECTORY STRUCTURE"
            echo "===================================="
            echo

            find vendor/qcom/opensource/wlan/qcacld-3.0 \
              -maxdepth 3 \
              -type d \
              | sort \
              | head -2000

            echo
            echo "REFERENCE QCACLD3 DIRECTORY STRUCTURE"
            echo "====================================="

            find reference/android_kernel_xiaomi_sm8150 \
              -path '*qcacld-3.0*' \
              -maxdepth 6 \
              -type d \
              | sort \
              | head -2000

          } > directory-comparison.txt

          cat directory-comparison.txt


      # ============================================================
      # 15. SEARCH CONFIG DIFFERENCES
      # ============================================================

      - name: Compare injection configuration
        shell: bash
        run: |
          set -u

          {
            echo "INJECTION CONFIGURATION COMPARISON"
            echo "==================================="
            echo

            echo "=== PATCH CONFIG ==="

            grep -n \
              -E \
              'CONFIG_|FRAME_INJECTION|INJECTION' \
              nethunter-qcacld3-injection.patch \
              | head -1000 \
              || true

            echo
            echo "=== MOTOROLA CONFIG REFERENCES ==="

            grep -Rni \
              --exclude-dir=.git \
              -E \
              'FRAME_INJECTION|INJECTION|NL80211_TESTMODE|TESTMODE|QCA_CLD_WLAN' \
              vendor/qcom/opensource/wlan/qcacld-3.0 \
              vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
              2>/dev/null \
              | head -2000 \
              || true

          } > config-comparison.txt

          cat config-comparison.txt


      # ============================================================
      # 16. CHECK WHETHER PATCH ADDED FILES ARE ABSENT
      # ============================================================

      - name: Identify patch-added files
        shell: bash
        run: |
          set -u

          {
            echo "PATCH-ADDED FILES"
            echo "================="
            echo

            grep '^diff --git ' \
              nethunter-qcacld3-injection.patch \
              | while read -r LINE
            do

              A=$(echo "$LINE" | sed 's/^diff --git a\///' | cut -d' ' -f1)

              if grep -q "^new file mode" \
                <(
                  grep -A2 \
                    -F "$LINE" \
                    nethunter-qcacld3-injection.patch
                )
              then
                echo "$A"
              fi

            done

          } > patch-added-files.txt

          cat patch-added-files.txt


      # ============================================================
      # 17. CREATE SUMMARY
      # ============================================================

      - name: Create porting summary
        shell: bash
        run: |
          set -u

          SUMMARY="$GITHUB_WORKSPACE/PORTING-SUMMARY.txt"

          {
            echo "Moto G9 Power cebu"
            echo "QCACLD-3 NetHunter Injection Port Analysis"
            echo "==========================================="
            echo

            echo "Motorola QCACLD3:"
            git -C vendor/qcom/opensource/wlan/qcacld-3.0 \
              rev-parse HEAD \
              2>/dev/null || true

            echo
            echo "Motorola host-common:"
            git -C vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
              rev-parse HEAD \
              2>/dev/null || true

            echo
            echo "Reference kernel:"
            git -C reference/android_kernel_xiaomi_sm8150 \
              rev-parse HEAD \
              2>/dev/null || true

            echo
            echo "Patch:"
            sha256sum nethunter-qcacld3-injection.patch

            echo
            echo "Rejected hunks:"
            wc -l rejection-files.txt
            cat rejection-files.txt

            echo
            echo "================================================"
            echo "IMPORTANT"
            echo "================================================"
            echo
            echo "This is an analysis-only workflow."
            echo "No real source tree was modified."
            echo "No kernel was built."
            echo "No WLAN module was built."
            echo "No flashable ZIP was created."
            echo "Nothing was flashed to the phone."
            echo
            echo "The reports identify where the reference"
            echo "injection implementation differs from the"
            echo "Motorola QCACLD3 source."

          } > "$SUMMARY"

          cat "$SUMMARY"


      # ============================================================
      # 18. UPLOAD EVERYTHING
      # ============================================================

      - name: Upload porting analysis
        uses: actions/upload-artifact@v4
        with:
          name: cebu-qcacld3-port-analysis
          path: |
            PORTING-SUMMARY.txt
            nethunter-qcacld3-injection.patch
            patch-history.txt
            affected-files.txt
            patch-apply-output.txt
            rejection-files.txt
            rejected-hunks.txt
            patch-functions.txt
            motorola-symbol-map.txt
            motorola-injection-functions.txt
            directory-comparison.txt
            config-comparison.txt
            patch-added-files.txt
          if-no-files-found: error
          retention-days: 14


      # ============================================================
      # 19. FINISH
      # ============================================================

      - name: Finish
        shell: bash
        run: |
          echo
          echo "================================================"
          echo "QCACLD3 PORT ANALYSIS COMPLETE"
          echo "================================================"
          echo
          echo "Artifact:"
          echo
          echo "cebu-qcacld3-port-analysis"
          echo
          echo "Upload that artifact here for the next step."
