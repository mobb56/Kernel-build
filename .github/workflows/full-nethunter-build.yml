      # ============================================================
      # 28. IMPORT REQUIRED QCACLD3 HEADERS
      # ============================================================

      - name: Import QCACLD3 injection headers
        shell: bash
        run: |
          set -euxo pipefail

          KERNEL_QCACLD="${GITHUB_WORKSPACE}/kernel/drivers/staging/qcacld-3.0"
          NH_QCACLD="${GITHUB_WORKSPACE}/nethunter-reference/drivers/staging/qcacld-3.0"

          find "${NH_QCACLD}" \
            -type f \
            \( \
              -name '*frame*inject*.h' \
              -o \
              -name '*inject*security*.h' \
              -o \
              -name '*frame*validate*.h' \
            \) \
            -print \
            | sort

          # Copy the matching injection-related headers while
          # preserving their relative directory structure.

          while IFS= read -r header; do
            relative="${header#${NH_QCACLD}/}"
            destination="${KERNEL_QCACLD}/${relative}"

            mkdir -p "$(dirname "${destination}")"
            cp "${header}" "${destination}"

            echo "Imported: ${relative}"
          done < <(
            find "${NH_QCACLD}" \
              -type f \
              \( \
                -name '*frame*inject*.h' \
                -o \
                -name '*inject*security*.h' \
                -o \
                -name '*frame*validate*.h' \
              \) \
              -print
          )


             mkdir -p drivers/staging/qcacld-3.0/core/wma/inc

            cp ../nethunter-reference/drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h \
           drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h



      - name: Remove duplicate injection helper definitions
        working-directory: kernel
        shell: bash
        run: |
