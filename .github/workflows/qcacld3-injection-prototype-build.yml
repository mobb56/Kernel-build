name: QCACLD3 Injection Prototype Build

on:
  workflow_dispatch:

jobs:
  prototype:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            gcc \
            clang \
            lld \
            llvm \
            python3 \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            zip \
            cpio

      - name: Clone Motorola QCACLD3
        run: |
          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qcacld-3.0.git \
            motorola-qcacld3

      - name: Clone OnePlus reference
        run: |
          git clone --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            oneplus

      - name: Clone Motorola kernel
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            kernel

      - name: Prepare report directories
        run: |
          mkdir -p report/reference/wma
          mkdir -p report/reference/hdd
          mkdir -p report/port
          mkdir -p report/build

          touch report/port/prototype-symbol-check.txt
          touch report/port/kbuild-integration.txt
          touch report/build/qcacld3-build.log
          touch report/build/compiler-errors.txt
          touch report/build/generated-objects.txt

      - name: Copy reference injection files
        shell: bash
        run: |
          set +e

          REF="oneplus/drivers/staging/qcacld-3.0"

          cp "$REF/core/wma/inc/wma_frame_inject.h" \
            report/reference/wma/wma_frame_inject.h

          cp "$REF/core/wma/src/wma_frame_inject.c" \
            report/reference/wma/wma_frame_inject.c

          cp "$REF/core/hdd/inc/wlan_hdd_frame_inject.h" \
            report/reference/hdd/wlan_hdd_frame_inject.h

          cp "$REF/core/hdd/src/wlan_hdd_frame_inject.c" \
            report/reference/hdd/wlan_hdd_frame_inject.c

          cp "$REF/core/hdd/inc/wlan_hdd_frame_validate.h" \
            report/reference/hdd/wlan_hdd_frame_validate.h

          cp "$REF/core/hdd/src/wlan_hdd_frame_validate.c" \
            report/reference/hdd/wlan_hdd_frame_validate.c

      - name: Copy prototype into Motorola tree
        shell: bash
        run: |
          set +e

          DEST="motorola-qcacld3/drivers/staging/qcacld-3.0"

          mkdir -p "$DEST/core/wma/inc"
          mkdir -p "$DEST/core/wma/src"
          mkdir -p "$DEST/core/hdd/inc"
          mkdir -p "$DEST/core/hdd/src"

          cp report/reference/wma/wma_frame_inject.h \
            "$DEST/core/wma/inc/" 2>/dev/null || true

          cp report/reference/wma/wma_frame_inject.c \
            "$DEST/core/wma/src/" 2>/dev/null || true

          cp report/reference/hdd/wlan_hdd_frame_inject.h \
            "$DEST/core/hdd/inc/" 2>/dev/null || true

          cp report/reference/hdd/wlan_hdd_frame_inject.c \
            "$DEST/core/hdd/src/" 2>/dev/null || true

          cp report/reference/hdd/wlan_hdd_frame_validate.h \
            "$DEST/core/hdd/inc/" 2>/dev/null || true

          cp report/reference/hdd/wlan_hdd_frame_validate.c \
            "$DEST/core/hdd/src/" 2>/dev/null || true

      - name: Record prototype files
        if: always()
        run: |
          {
            echo "===== MOTOROLA QCACLD3 STATUS ====="
            git -C motorola-qcacld3 status --short || true

            echo
            echo "===== PROTOTYPE FILES ====="
            find motorola-qcacld3/drivers/staging/qcacld-3.0 \
              -type f \
              \( \
                -name "wma_frame_inject.c" \
                -o -name "wma_frame_inject.h" \
                -o -name "wlan_hdd_frame_inject.c" \
                -o -name "wlan_hdd_frame_inject.h" \
                -o -name "wlan_hdd_frame_validate.c" \
                -o -name "wlan_hdd_frame_validate.h" \
              \) \
              -print \
              || true

          } > report/port/prototype-files.txt

      - name: Check prototype symbols
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          files = [
              Path(
                  "motorola-qcacld3/"
                  "drivers/staging/qcacld-3.0/"
                  "core/wma/src/wma_frame_inject.c"
              ),
              Path(
                  "motorola-qcacld3/"
                  "drivers/staging/qcacld-3.0/"
                  "core/hdd/src/wlan_hdd_frame_inject.c"
              ),
              Path(
                  "motorola-qcacld3/"
                  "drivers/staging/qcacld-3.0/"
                  "core/hdd/src/wlan_hdd_frame_validate.c"
              )
          ]

          symbols = set()

          for path in files:
              if not path.exists():
                  continue

              try:
                  source = path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except Exception:
                  continue

              found = re.findall(
                  r"\b(?:wma|wlan_hdd|qdf|qca|wmi)_[A-Za-z0-9_]+\b",
                  source
              )

              symbols.update(found)

          results = []

          for symbol in sorted(symbols):
              try:
                  result = subprocess.run(
                      [
                          "rg",
                          "-n",
                          "--text",
                          "--fixed-strings",
                          symbol,
                          "motorola-qcacld3"
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=False,
                      timeout=30
                  )

                  if result.returncode == 0:
                      results.append(
                          "[PRESENT] " + symbol
                      )
                  else:
                      results.append(
                          "[MISSING] " + symbol
                      )

              except Exception as exc:
                  results.append(
                      "[CHECK_ERROR] "
                      + symbol
                      + " "
                      + str(exc)
                  )

          output = Path(
              "report/port/prototype-symbol-check.txt"
          )

          output.write_text(
              "\n".join(results) + "\n"
          )

          print(
              "Prototype symbols checked:",
              len(symbols)
          )
          print(
              "Report written to:",
              output
          )
          PY

      - name: Analyze Kbuild integration
        if: always()
        shell: bash
        run: |
          {
            echo "===== WMA KBUILD ====="

            rg -n -C 12 --text \
              "wma_frame_inject|core/wma|wma.*\.o" \
              motorola-qcacld3/drivers/staging/qcacld-3.0 \
              || true

            echo
            echo "===== HDD KBUILD ====="

            rg -n -C 12 --text \
              "wlan_hdd_frame_inject|core/hdd|hdd.*\.o" \
              motorola-qcacld3/drivers/staging/qcacld-3.0 \
              || true

            echo
            echo "===== INJECTION CONFIG ====="

            rg -n --text \
              "FEATURE_FRAME_INJECTION_SUPPORT|FRAME_INJECTION" \
              motorola-qcacld3 \
              || true

          } > report/port/kbuild-integration.txt

      - name: Prepare Motorola kernel
        if: always()
        shell: bash
        run: |
          set +e

          cd kernel

          echo "===== KERNEL VERSION =====" \
            > ../report/build/kernel-preparation.log

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            O=out \
            vendor/bengal-perf_defconfig \
            >> ../report/build/kernel-preparation.log 2>&1

          STATUS=$?

          echo "" \
            >> ../report/build/kernel-preparation.log

          echo "defconfig exit status: $STATUS" \
            >> ../report/build/kernel-preparation.log

          exit 0

      - name: Attempt QCACLD3 module build
        if: always()
        shell: bash
        run: |
          set +e

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel"
          QCACLD_DIR="$GITHUB_WORKSPACE/motorola-qcacld3/drivers/staging/qcacld-3.0"
          OUT_DIR="$KERNEL_DIR/out"

          echo "Kernel directory:"
          echo "$KERNEL_DIR"

          echo "QCACLD3 directory:"
          echo "$QCACLD_DIR"

          echo "Kernel output:"
          echo "$OUT_DIR"

          make \
            -C "$KERNEL_DIR" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            M="$QCACLD_DIR" \
            modules \
            > "$GITHUB_WORKSPACE/report/build/qcacld3-build.log" \
            2>&1

          STATUS=$?

          echo "$STATUS" \
            > "$GITHUB_WORKSPACE/report/build/qcacld3-build-status.txt"

          echo "Build exit status: $STATUS"

          exit 0

      - name: Extract compiler errors
        if: always()
        shell: bash
        run: |
          LOG="report/build/qcacld3-build.log"

          {
            echo "===== COMPILER ERRORS ====="

            rg -n --text \
              "error:|fatal error:|undefined|undeclared|implicit declaration|No such file|No rule|unknown type name|incompatible type|too few arguments|too many arguments" \
              "$LOG" \
              || true

            echo
            echo "===== WARNINGS ====="

            rg -n --text \
              "warning:" \
              "$LOG" \
              || true

          } > report/build/compiler-errors.txt

      - name: Extract build summary
        if: always()
        shell: bash
        run: |
          {
            echo "===== BUILD STATUS ====="

            if [ -f report/build/qcacld3-build-status.txt ]; then
              cat report/build/qcacld3-build-status.txt
            else
              echo "NO_BUILD_STATUS"
            fi

            echo
            echo "===== LAST 100 BUILD LINES ====="

            tail -n 100 \
              report/build/qcacld3-build.log \
              || true

          } > report/build/build-summary.txt

      - name: Find generated objects
        if: always()
        shell: bash
        run: |
          find \
            motorola-qcacld3 \
            kernel/out \
            -type f \
            \( \
              -name "*.ko" \
              -o -name "*.o" \
            \) \
            -print \
            2>/dev/null \
            > report/build/generated-objects.txt \
            || true

      - name: Generate prototype result
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          status_file = Path(
              "report/build/qcacld3-build-status.txt"
          )

          if status_file.exists():
              status = status_file.read_text().strip()
          else:
              status = "BUILD_STEP_DID_NOT_PRODUCE_STATUS"

          error_file = Path(
              "report/build/compiler-errors.txt"
          )

          errors = ""

          if error_file.exists():
              errors = error_file.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

          symbol_file = Path(
              "report/port/prototype-symbol-check.txt"
          )

          symbols = ""

          if symbol_file.exists():
              symbols = symbol_file.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

          present = symbols.count("[PRESENT]")
          missing = symbols.count("[MISSING]")

          lines = [
              "QCACLD3 INJECTION PROTOTYPE RESULT",
              "==================================",
              "",
              "Build exit status: " + status,
              "",
              "Prototype symbols present: "
              + str(present),
              "Prototype symbols missing: "
              + str(missing),
              "",
              "This was a compile-only source experiment.",
              "",
              "No phone was flashed.",
              "No firmware was modified.",
              "No device configuration was changed.",
              ""
          ]

          if "error:" in errors or "fatal error:" in errors:
              lines.extend([
                  "BUILD RESULT: COMPILER ERRORS DETECTED.",
                  "",
                  "The exact compiler diagnostics are in:",
                  "report/build/compiler-errors.txt",
                  "",
                  "The full build log is in:",
                  "report/build/qcacld3-build.log"
              ])
          elif status == "0":
              lines.extend([
                  "BUILD RESULT: COMMAND COMPLETED WITHOUT",
                  "A NONZERO EXIT STATUS.",
                  "",
                  "This does NOT prove firmware support or",
                  "actual packet injection."
              ])
          else:
              lines.extend([
                  "BUILD RESULT: BUILD COMMAND FAILED OR",
                  "DID NOT COMPLETE SUCCESSFULLY.",
                  "",
                  "See the full build log and compiler diagnostics."
              ])

          Path(
              "report/PROTOTYPE_RESULT.txt"
          ).write_text(
              "\n".join(lines) + "\n"
          )
          PY

      - name: Display result
        if: always()
        run: |
          echo "================================"
          echo "QCACLD3 PROTOTYPE RESULT"
          echo "================================"

          cat report/PROTOTYPE_RESULT.txt || true

          echo
          echo "================================"
          echo "COMPILER ERRORS"
          echo "================================"

          cat report/build/compiler-errors.txt || true

          echo
          echo "================================"
          echo "BUILD SUMMARY"
          echo "================================"

          cat report/build/build-summary.txt || true

      - name: Package complete audit
        if: always()
        run: |
          zip -r \
            qcacld3-injection-prototype-audit.zip \
            report

      - name: Upload complete audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-injection-prototype-audit
          path: qcacld3-injection-prototype-audit.zip
          if-no-files-found: error
