name: Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      KERNEL: ${{ github.workspace }}/kernel
      OUT: ${{ github.workspace }}/out
      REF: ${{ github.workspace }}/reference
      AK3: ${{ github.workspace }}/AnyKernel3

      ARCH: arm64
      LLVM: 1
      LLVM_IAS: 1
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:

      # ============================================================
      # 1. BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            zip \
            unzip \
            bc \
            bison \
            flex \
            python3 \
            cpio \
            rsync \
            file \
            libssl-dev \
            libelf-dev \
            dwarves \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang-14 \
            llvm-14 \
            lld-14

          clang-14 --version
          ld.lld-14 --version
          aarch64-linux-gnu-gcc --version

      # ============================================================
      # 2. CLONE MOTOROLA / LINEAGEOS KERNEL
      # ============================================================

      - name: Clone Motorola kernel
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$KERNEL"

      # ============================================================
      # 3. CLONE NETHUNTER QCACLD3 REFERENCE
      # ============================================================

      - name: Clone NetHunter QCACLD3 reference
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            "$REF"

      # ============================================================
      # 4. CLONE ANYKERNEL3
      # ============================================================

      - name: Clone AnyKernel3
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            "$AK3"

      # ============================================================
      # 5. VERIFY SOURCE TREES
      # ============================================================

      - name: Verify source trees
        run: |
          set -eux

          echo "===== MOTOROLA KERNEL ====="

          test -f "$KERNEL/Makefile"
          test -f "$KERNEL/arch/arm64/Makefile"
          test -f "$KERNEL/drivers/staging/qcacld-3.0/Kbuild"

          # Correct location of the Motorola defconfig.
          test -f \
            "$KERNEL/arch/arm64/configs/vendor/bengal-perf_defconfig"

          echo "Motorola kernel source: OK"
          echo "Motorola defconfig: OK"

          echo
          echo "===== NETHUNTER REFERENCE ====="

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_validate.c"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject.h"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_validate.h"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_inject_security.h"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject_debug.h"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h"

          echo "NetHunter reference: OK"

          echo
          echo "========================================"
          echo "SOURCE VERIFICATION PASSED"
          echo "========================================"

      # ============================================================
      # 6. LLVM
      # ============================================================

      - name: Configure LLVM toolchain
        run: |
          set -eux

          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 7. CLEAN OUT-OF-TREE OUTPUT
      # ============================================================

      - name: Prepare output directory
        run: |
          set -eux

          rm -rf "$OUT"

          mkdir -p "$OUT"

      # ============================================================
      # 8. BASE DEFCONFIG
      # ============================================================

      - name: Generate base kernel configuration
        run: |
          set -eux

          cd "$KERNEL"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            vendor/bengal-perf_defconfig

      # ============================================================
      # 9. NETHUNTER CONFIGURATION
      # ============================================================

      - name: Create NetHunter configuration fragment
        run: |
          set -eux

          cat > "$GITHUB_WORKSPACE/nethunter.config" <<'EOF'

          # ========================================================
          # MODULE SUPPORT
          # ========================================================

          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y
          CONFIG_MODVERSIONS=y

          # ========================================================
          # HID
          # ========================================================

          CONFIG_HID=m
          CONFIG_HID_GENERIC=m
          CONFIG_HIDRAW=m
          CONFIG_UHID=m
          CONFIG_USB_HID=m

          # ========================================================
          # BLUETOOTH
          # ========================================================

          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y

          CONFIG_BT_RFCOMM=m
          CONFIG_BT_RFCOMM_TTY=y

          CONFIG_BT_BNEP=m
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y

          CONFIG_BT_HIDP=m

          CONFIG_BT_HCIVHCI=m

          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y

          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y

          # ========================================================
          # USB
          # ========================================================

          CONFIG_USB=y
          CONFIG_USB_OTG=y

          # ========================================================
          # USB GADGET
          # ========================================================

          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y

          CONFIG_USB_CONFIGFS_SERIAL=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_OBEX=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_ECM_SUBSET=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_EEM=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y

          # ========================================================
          # USB NETWORKING
          # ========================================================

          CONFIG_USB_NET_DRIVERS=m
          CONFIG_USB_NET_CDCETHER=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_NET_RNDIS_HOST=m

          CONFIG_USB_RTL8150=m
          CONFIG_USB_RTL8152=m

          # ========================================================
          # USB SERIAL
          # ========================================================

          CONFIG_USB_ACM=m
          CONFIG_USB_SERIAL=m
          CONFIG_USB_SERIAL_GENERIC=m

          # ========================================================
          # NETWORKING
          # ========================================================

          CONFIG_NET=y
          CONFIG_PACKET=y
          CONFIG_UNIX=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=m

          # ========================================================
          # WIRELESS
          # ========================================================

          CONFIG_WIRELESS=y
          CONFIG_CFG80211=y

          # ========================================================
          # QCACLD3
          # ========================================================

          CONFIG_QCA_CLD_WLAN=m

          # ========================================================
          # SENSOR COMPATIBILITY
          # ========================================================

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m

          EOF

      # ============================================================
      # 10. MERGE CONFIGURATION
      # ============================================================

      - name: Merge NetHunter configuration
        run: |
          set -eux

          cd "$KERNEL"

          scripts/kconfig/merge_config.sh \
            -m \
            -O "$OUT" \
            "$OUT/.config" \
            "$GITHUB_WORKSPACE/nethunter.config"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            olddefconfig

      # ============================================================
      # 11. VERIFY CONFIGURATION
      # ============================================================

      - name: Verify important configuration
        run: |
          set -eux

          echo "===== IMPORTANT CONFIGURATION ====="

          for CONFIG in \
            CONFIG_MODULES \
            CONFIG_HID \
            CONFIG_HID_GENERIC \
            CONFIG_HIDRAW \
            CONFIG_UHID \
            CONFIG_USB_HID \
            CONFIG_BT_RFCOMM \
            CONFIG_BT_HIDP \
            CONFIG_BT_HCIVHCI \
            CONFIG_BT_HCIUART \
            CONFIG_BT_HCIUART_H4 \
            CONFIG_BT_HCIBTUSB \
            CONFIG_USB_GADGET \
            CONFIG_USB_CONFIGFS \
            CONFIG_USB_CONFIGFS_F_HID \
            CONFIG_USB_CONFIGFS_RNDIS \
            CONFIG_USB_CONFIGFS_NCM \
            CONFIG_USB_CONFIGFS_ECM \
            CONFIG_USB_CONFIGFS_EEM \
            CONFIG_USB_RTL8152 \
            CONFIG_USB_ACM \
            CONFIG_QCA_CLD_WLAN \
            CONFIG_SENSORS_SSC \
            CONFIG_SENSORS_CLASS
          do
            if grep -q "^${CONFIG}=" "$OUT/.config"; then
              grep "^${CONFIG}=" "$OUT/.config"
            else
              echo "$CONFIG not explicitly set"
            fi
          done

      # ============================================================
      # 12. IMPORT QCACLD3 INJECTION IMPLEMENTATION
      # ============================================================

      - name: Import QCACLD3 injection framework
        run: |
          set -eux

          HDD_SRC="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/src"
          HDD_INC="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc"
          WMA_SRC="$KERNEL/drivers/staging/qcacld-3.0/core/wma/src"
          WMA_INC="$KERNEL/drivers/staging/qcacld-3.0/core/wma/inc"

          REF_HDD_SRC="$REF/drivers/staging/qcacld-3.0/core/hdd/src"
          REF_HDD_INC="$REF/drivers/staging/qcacld-3.0/core/hdd/inc"
          REF_WMA_SRC="$REF/drivers/staging/qcacld-3.0/core/wma/src"
          REF_WMA_INC="$REF/drivers/staging/qcacld-3.0/core/wma/inc"

          mkdir -p \
            "$HDD_SRC" \
            "$HDD_INC" \
            "$WMA_SRC" \
            "$WMA_INC"

          # Implementation files
          cp \
            "$REF_HDD_SRC/wlan_hdd_frame_inject.c" \
            "$HDD_SRC/"

          cp \
            "$REF_HDD_SRC/wlan_hdd_frame_validate.c" \
            "$HDD_SRC/"

          cp \
            "$REF_HDD_SRC/wlan_hdd_inject_security.c" \
            "$HDD_SRC/"

          cp \
            "$REF_HDD_SRC/wlan_hdd_frame_inject_debug.c" \
            "$HDD_SRC/"

          cp \
            "$REF_WMA_SRC/wma_frame_inject.c" \
            "$WMA_SRC/"

          # Headers
          cp \
            "$REF_HDD_INC/wlan_hdd_frame_inject.h" \
            "$HDD_INC/"

          cp \
            "$REF_HDD_INC/wlan_hdd_frame_validate.h" \
            "$HDD_INC/"

          cp \
            "$REF_HDD_INC/wlan_hdd_inject_security.h" \
            "$HDD_INC/"

          cp \
            "$REF_HDD_INC/wlan_hdd_frame_inject_debug.h" \
            "$HDD_INC/"

          cp \
            "$REF_WMA_INC/wma_frame_inject.h" \
            "$WMA_INC/"

          echo "QCACLD3 injection framework imported."

      # ============================================================
      # 13. ADD INJECTION CONTEXT TO MOTOROLA HDD
      # ============================================================

      - name: Adapt Motorola HDD adapter
        run: |
          set -eux

          MAIN="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h"

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          field = "struct hdd_injection_ctx *injection_ctx;"

          if field in s:
              print("injection_ctx already exists")
              raise SystemExit(0)

          marker = "qdf_atomic_t net_dev_hold_ref_count[NET_DEV_HOLD_ID_MAX];"

          if marker not in s:
              raise SystemExit(
                  "Could not find HDD adapter insertion point"
              )

          replacement = marker + """

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              struct hdd_injection_ctx *injection_ctx;
          #endif"""

          s = s.replace(marker, replacement, 1)

          p.write_text(s)

          print("Added injection_ctx.")
          PY

      # ============================================================
      # 14. ADD INJECTION HEADER
      # ============================================================

      - name: Add injection header to HDD
        run: |
          set -eux

          MAIN="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h"

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          include = '#include "wlan_hdd_frame_inject.h"'

          if include in s:
              print("Injection include already exists")
              raise SystemExit(0)

          marker = '#include "wlan_hdd_includes.h"'

          if marker not in s:
              raise SystemExit(
                  "Could not find wlan_hdd_includes.h"
              )

          replacement = (
              marker +
              "\n\n#ifdef FEATURE_FRAME_INJECTION_SUPPORT\n" +
              include +
              "\n#endif"
          )

          s = s.replace(marker, replacement, 1)

          p.write_text(s)

          print("Added injection header include.")
          PY

      # ============================================================
      # 15. FIX get_task_cred
      # ============================================================

      - name: Fix Motorola credential compatibility
        run: |
          set -eux

          SECURITY="$KERNEL/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c"

          python3 - "$SECURITY" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if "get_task_cred(" not in s:
              print("get_task_cred is already absent.")
              raise SystemExit(0)

          pattern = re.compile(
              r"""
              \s*const\s+struct\s+cred\s+\*cred;
              \s*bool\s+has_capability\s*=\s*false;
              \s*
              hdd_security_debug\("Checking injection capabilities"\);
              \s*/\* Use current task if none specified \*/
              \s*if\s*\(!task\)
              \s*task\s*=\s*current;
              \s*
              /\* Get task credentials \*/
              \s*cred\s*=\s*get_task_cred\(task\);
              \s*if\s*\(!cred\)\s*\{
              \s*hdd_security_err\("Failed to get task credentials"\);
              \s*return\s+QDF_STATUS_E_FAILURE;
              \s*\}
              \s*
              /\* Check for CAP_NET_RAW capability \*/
              \s*has_capability\s*=\s*capable\(CAP_NET_RAW\);
              \s*
              put_cred\(cred\);
              """,
              re.VERBOSE
          )

          replacement = r"""

              bool has_capability = false;

              hdd_security_debug("Checking injection capabilities");

              /* Use current task if none specified */
              if (!task)
                  task = current;

              /*
               * Motorola's 4.19 kernel does not export get_task_cred()
               * for loadable modules.
               *
               * The NetHunter reference ultimately performs the
               * authorization check with capable(CAP_NET_RAW).
               * The caller currently supplies NULL, meaning current.
               * Avoid the unavailable module symbol.
               */
              has_capability = capable(CAP_NET_RAW);
          """

          ns, count = pattern.subn(replacement, s, count=1)

          if count != 1:
              raise SystemExit(
                  "Could not safely locate get_task_cred block."
              )

          if "get_task_cred(" in ns:
              raise SystemExit(
                  "get_task_cred still exists after patch."
              )

          p.write_text(ns)

          print("get_task_cred compatibility patch applied.")
          PY

          echo "===== CHECKING ====="

          if grep -R \
            "get_task_cred(" \
            "$KERNEL/drivers/staging/qcacld-3.0/core/hdd/src"
          then
            echo "ERROR: get_task_cred remains"
            exit 1
          fi

          echo "PASS: get_task_cred removed."

      # ============================================================
      # 16. PATCH QCACLD3 KBUILD
      #
      # IMPORTANT:
      # FEATURE_FRAME_INJECTION_SUPPORT is not a Kconfig symbol.
      # We therefore make this dedicated kernel build include the
      # injection implementation unconditionally.
      # ============================================================

      - name: Enable QCACLD3 injection objects
        run: |
          set -eux

          KBUILD="$KERNEL/drivers/staging/qcacld-3.0/Kbuild"

          python3 - "$KBUILD" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # --------------------------------------------------------
          # HDD objects
          # --------------------------------------------------------

          hdd_marker = "ifeq ($(CONFIG_WLAN_NUD_TRACKING), y)"

          hdd_block = """
          # NetHunter frame injection support
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o
          """

          if "wlan_hdd_frame_inject.o" not in s:
              if hdd_marker not in s:
                  raise SystemExit(
                      "HDD Kbuild insertion point not found"
                  )

              s = s.replace(
                  hdd_marker,
                  hdd_block + "\n" + hdd_marker,
                  1
              )

          # --------------------------------------------------------
          # WMA object
          # --------------------------------------------------------

          wma_marker = "$(WMA_NDP_OBJS)"

          wma_block = """
          # NetHunter frame injection support
          WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o
          """

          if "wma_frame_inject.o" not in s:
              if wma_marker not in s:
                  raise SystemExit(
                      "WMA Kbuild insertion point not found"
                  )

              s = s.replace(
                  wma_marker,
                  wma_marker + "\n" + wma_block,
                  1
              )

          # --------------------------------------------------------
          # Required compiler define
          # --------------------------------------------------------

          if "-DFEATURE_FRAME_INJECTION_SUPPORT" not in s:
              s += """

          # NetHunter frame injection support
          cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT
          """

          # --------------------------------------------------------
          # Monitor mode required by injection
          # --------------------------------------------------------

          if "CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y" not in s:
              s += """

          # NetHunter injection requires monitor-mode support
          CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y
          """

          # --------------------------------------------------------
          # Header paths
          # --------------------------------------------------------

          if "ccflags-y += $(HDD_INC)" not in s:
              s += """

          # NetHunter injection header paths
          ccflags-y += $(HDD_INC)
          """

          if "ccflags-y += $(WMA_INC)" not in s:
              s += """
          ccflags-y += $(WMA_INC)
          """

          p.write_text(s)

          print("QCACLD3 Kbuild updated.")
          PY

          echo
          echo "===== INJECTION KBUILD CHECK ====="

          grep -n \
            -E \
            "wlan_hdd_frame_inject|wlan_hdd_frame_validate|wlan_hdd_inject_security|wlan_hdd_frame_inject_debug|wma_frame_inject|FEATURE_FRAME_INJECTION_SUPPORT|HDD_INC|WMA_INC" \
            "$KBUILD"

      # ============================================================
      # 17. VERIFY IMPORTED FILES
      # ============================================================

      - name: Verify imported injection files
        run: |
          set -eux

          BASE="$KERNEL/drivers/staging/qcacld-3.0"

          test -f \
            "$BASE/core/hdd/src/wlan_hdd_frame_inject.c"

          test -f \
            "$BASE/core/hdd/src/wlan_hdd_frame_validate.c"

          test -f \
            "$BASE/core/hdd/src/wlan_hdd_inject_security.c"

          test -f \
            "$BASE/core/hdd/src/wlan_hdd_frame_inject_debug.c"

          test -f \
            "$BASE/core/wma/src/wma_frame_inject.c"

          test -f \
            "$BASE/core/hdd/inc/wlan_hdd_frame_inject.h"

          test -f \
            "$BASE/core/hdd/inc/wlan_hdd_frame_validate.h"

          test -f \
            "$BASE/core/hdd/inc/wlan_hdd_inject_security.h"

          test -f \
            "$BASE/core/hdd/inc/wlan_hdd_frame_inject_debug.h"

          test -f \
            "$BASE/core/wma/inc/wma_frame_inject.h"

          echo "All injection files present."

      # ============================================================
      # 18. BUILD FULL KERNEL
      # ============================================================

      - name: Build kernel and all modules
        run: |
          set -eux

          cd "$KERNEL"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            -j"$(nproc)" \
            Image \
            modules

      # ============================================================
      # 19. KERNEL RELEASE
      # ============================================================

      - name: Verify kernel release
        run: |
          set -eux

          cd "$KERNEL"

          BUILT_RELEASE="$(
            make -s \
              O="$OUT" \
              ARCH="$ARCH" \
              LLVM="$LLVM" \
              LLVM_IAS="$LLVM_IAS" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              kernelrelease
          )"

          echo "Built kernel release:"
          echo "$BUILT_RELEASE"

          case "$BUILT_RELEASE" in
            *-dirty)
              echo "ERROR: kernel is dirty"
              exit 1
              ;;
          esac

          printf '%s\n' "$BUILT_RELEASE" \
            > "$GITHUB_WORKSPACE/kernel-release.txt"

      # ============================================================
      # 20. VERIFY IMAGE
      # ============================================================

      - name: Verify kernel Image
        run: |
          set -eux

          IMAGE="$OUT/arch/arm64/boot/Image"

          test -f "$IMAGE"

          echo "Kernel Image:"
          ls -lh "$IMAGE"

          echo
          echo "SHA256:"
          sha256sum "$IMAGE"

      # ============================================================
      # 21. INSTALL ALL MODULES
      # ============================================================

      - name: Install kernel modules
        run: |
          set -eux

          rm -rf \
            "$GITHUB_WORKSPACE/modules-staging"

          mkdir -p \
            "$GITHUB_WORKSPACE/modules-staging"

          cd "$KERNEL"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules-staging/system" \
            modules_install

          echo "===== INSTALLED MODULES ====="

          find \
            "$GITHUB_WORKSPACE/modules-staging" \
            -type f \
            -name '*.ko' \
            -print \
            | sort

      # ============================================================
      # 22. VERIFY WLAN MODULE
      # ============================================================

      - name: Verify WLAN module
        run: |
          set -eux

          WLAN="$(
            find \
              "$GITHUB_WORKSPACE/modules-staging" \
              -type f \
              -name 'wlan.ko' \
              -print -quit
          )"

          if [ -z "$WLAN" ]; then
            echo "ERROR: wlan.ko not found"
            exit 1
          fi

          echo "WLAN module:"
          echo "$WLAN"

          ls -lh "$WLAN"

          echo
          echo "===== WLAN SHA256 ====="

          sha256sum "$WLAN"

          echo
          echo "===== MODINFO ====="

          modinfo "$WLAN" || true

      # ============================================================
      # 23. VERIFY BLUETOOTH / HID / USB MODULES
      # ============================================================

      - name: Verify NetHunter modules
        run: |
          set -eux

          ROOT="$GITHUB_WORKSPACE/modules-staging"

          echo "===== HID / BLUETOOTH / USB ====="

          for MOD in \
            hidp.ko \
            rfcomm.ko \
            bnep.ko \
            hci_uart.ko \
            hci_vhci.ko \
            btusb.ko \
            uhid.ko \
            hid-generic.ko \
            usbnet.ko \
            cdc_ether.ko \
            cdc_ncm.ko \
            rndis_host.ko \
            r8152.ko
          do
            RESULT="$(
              find "$ROOT" \
                -type f \
                -name "$MOD" \
                -print \
                | head -n 1
            )"

            if [ -n "$RESULT" ]; then
              echo "FOUND  $MOD"
            else
              echo "NOT MODULAR: $MOD"
            fi
          done

      # ============================================================
      # 24. CHECK WLAN UNDEFINED SYMBOLS
      # ============================================================

      - name: Check WLAN undefined symbols
        run: |
          set -eux

          WLAN="$(
            find \
              "$GITHUB_WORKSPACE/modules-staging" \
              -type f \
              -name 'wlan.ko' \
              -print -quit
          )"

          test -n "$WLAN"

          echo "===== UNDEFINED WLAN SYMBOLS ====="

          readelf -Ws "$WLAN" \
            | awk '$4 == "UND" {print $8}' \
            | sort -u \
            | tee \
              "$GITHUB_WORKSPACE/wlan-undefined-symbols.txt"

          echo
          echo "===== CHECK get_task_cred ====="

          if grep -Fxq \
            "get_task_cred" \
            "$GITHUB_WORKSPACE/wlan-undefined-symbols.txt"
          then
            echo "ERROR: get_task_cred remains unresolved"
            exit 1
          fi

          echo "PASS: get_task_cred is not unresolved."

      # ============================================================
      # 25. CHECK WLAN MODULE VERMIAGIC
      # ============================================================

      - name: Check WLAN vermagic
        run: |
          set -eux

          WLAN="$(
            find \
              "$GITHUB_WORKSPACE/modules-staging" \
              -type f \
              -name 'wlan.ko' \
              -print -quit
          )"

          test -n "$WLAN"

          echo "===== WLAN VERIMAGIC ====="

          modinfo "$WLAN" \
            | grep -E \
              '^(vermagic|name|filename):' \
            || true

          echo
          echo "===== KERNEL RELEASE ====="

          cat "$GITHUB_WORKSPACE/kernel-release.txt"

      # ============================================================
      # 26. SAVE FINAL CONFIG
      # ============================================================

      - name: Save final configuration
        run: |
          set -eux

          cp \
            "$OUT/.config" \
            "$GITHUB_WORKSPACE/final-kernel.config"

      # ============================================================
      # 27. BUILD REPORT
      # ============================================================

      - name: Generate build report
        run: |
          set -eux

          {
            echo "========================================"
            echo "Moto G9 Power / cebu"
            echo "========================================"
            echo
            echo "Android: 16"
            echo "LineageOS: 23.2"
            echo
            echo "Kernel release:"
            cat "$GITHUB_WORKSPACE/kernel-release.txt"
            echo
            echo "Kernel Image:"
            ls -lh "$OUT/arch/arm64/boot/Image"
            echo
            echo "Requested features:"
            echo
            grep -E \
              '^(CONFIG_(HID|USB_HID|UHID|BT_|USB_CONFIGFS|USB_NET|USB_RTL|USB_ACM|QCA_CLD_WLAN|SENSORS_SSC|SENSORS_CLASS))=' \
              "$OUT/.config" \
              || true
            echo
            echo "Injection framework:"
            echo "wlan_hdd_frame_inject.c"
            echo "wlan_hdd_frame_validate.c"
            echo "wlan_hdd_inject_security.c"
            echo "wlan_hdd_frame_inject_debug.c"
            echo "wma_frame_inject.c"
            echo
            echo "WLAN undefined symbols:"
            cat "$GITHUB_WORKSPACE/wlan-undefined-symbols.txt"
          } > "$GITHUB_WORKSPACE/build-report.txt"

          cat "$GITHUB_WORKSPACE/build-report.txt"

      # ============================================================
      # 28. PREPARE ANYKERNEL3
      # ============================================================

      - name: Prepare AnyKernel3
        run: |
          set -eux

          cd "$AK3"

          rm -rf \
            modules/system/lib/modules

          mkdir -p \
            modules/system/lib/modules

          cp \
            "$OUT/arch/arm64/boot/Image" \
            "$AK3/Image"

          find \
            "$GITHUB_WORKSPACE/modules-staging" \
            -type f \
            -name '*.ko' \
            -exec cp {} \
              "$AK3/modules/system/lib/modules/" \;

          echo "===== AK3 IMAGE ====="

          ls -lh "$AK3/Image"

          echo
          echo "===== AK3 MODULES ====="

          find \
            "$AK3/modules/system/lib/modules" \
            -type f \
            -name '*.ko' \
            -printf '%f\n' \
            | sort

      # ============================================================
      # 29. CONFIGURE ANYKERNEL3
      # ============================================================

      - name: Configure AnyKernel3
        run: |
          set -eux

          cat > "$AK3/anykernel.sh" <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script

          properties() { '
          kernel.string=Moto G9 Power cebu NetHunter Kernel
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=cebu
          supported.versions=16
          '; }

          block=/dev/block/bootdevice/by-name/boot;

          is_slot_device=1;

          ramdisk_compression=auto;

          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;

          write_boot;
          EOF

          chmod 755 "$AK3/anykernel.sh"

          echo "===== ANYKERNEL SCRIPT ====="

          cat "$AK3/anykernel.sh"

      # ============================================================
      # 30. CREATE FLASHABLE ZIP
      # ============================================================

      - name: Build AnyKernel3 ZIP
        run: |
          set -eux

          RELEASE="$(
            cat "$GITHUB_WORKSPACE/kernel-release.txt"
          )"

          ZIP="$GITHUB_WORKSPACE/moto-g9-power-cebu-nethunter-${RELEASE}.zip"

          cd "$AK3"

          rm -f "$ZIP"

          zip -r9 \
            "$ZIP" \
            . \
            -x '.git/*' \
            -x 'README.md' \
            -x '*placeholder'

          test -f "$ZIP"

          echo "===== FINAL ZIP ====="

          ls -lh "$ZIP"

          sha256sum "$ZIP" \
            | tee \
              "$GITHUB_WORKSPACE/kernel-zip.sha256"

      # ============================================================
      # 31. MANIFEST
      # ============================================================

      - name: Create artifact manifest
        run: |
          set -eux

          {
            echo "Moto G9 Power / cebu"
            echo "Android 16"
            echo "LineageOS 23.2"
            echo
            echo "Kernel:"
            cat "$GITHUB_WORKSPACE/kernel-release.txt"
            echo
            echo "ZIP:"
            ls -lh "$GITHUB_WORKSPACE"/*.zip
            echo
            echo "ZIP SHA256:"
            cat "$GITHUB_WORKSPACE/kernel-zip.sha256"
            echo
            echo "Modules:"
            find \
              "$GITHUB_WORKSPACE/modules-staging" \
              -type f \
              -name '*.ko' \
              -printf '%f\n' \
              | sort
          } > "$GITHUB_WORKSPACE/manifest.txt"

          cat "$GITHUB_WORKSPACE/manifest.txt"

      # ============================================================
      # 32. UPLOAD EVERYTHING
      # ============================================================

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/kernel-release.txt
            ${{ github.workspace }}/kernel-zip.sha256
            ${{ github.workspace }}/manifest.txt
            ${{ github.workspace }}/build-report.txt
            ${{ github.workspace }}/final-kernel.config
            ${{ github.workspace }}/wlan-undefined-symbols.txt
            ${{ github.workspace }}/modules-staging/system/lib/modules/*.ko
