          echo "=== Forbidden QCACLD3 feature symbols in kernel .config ==="

          if grep -Eq \
            '^(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT|CONFIG_FEATURE_MONITOR_MODE_SUPPORT)=' \
            "${CONFIG}"; then
            echo "ERROR: QCACLD3 feature variables leaked into kernel .config."
            exit 1
          fi

          echo "No forbidden CONFIG_FEATURE_* entries found."

          echo
          echo "=== Clean release configuration ==="

           grep -Fxq 'CONFIG_LOCALVERSION="-perf"' "${CONFIG}"
           grep -Fxq '# CONFIG_LOCALVERSION_AUTO is not set' "${CONFIG}"

          echo "LOCALVERSION=-perf"
          echo "LOCALVERSION_AUTO disabled."

          echo
          echo "=== Kernel Image size ==="

          IMAGE_SIZE="$(stat -c '%s' "${IMAGE}")"
          BOOT_PARTITION_SIZE=100663296

          echo "Image bytes: ${IMAGE_SIZE}"
          echo "Boot partition bytes: ${BOOT_PARTITION_SIZE}"

          test "${IMAGE_SIZE}" -lt "${BOOT_PARTITION_SIZE}"

          echo "Kernel Image fits within the stock boot partition."

          echo
          echo "=== Compiled module ABI audit ==="

          EXPECTED_VERMAGIC="4.19.325-cip135-st19-perf-g39bcecd5c63d SMP preempt mod_unload modversions aarch64"

          MODULE_COUNT=0

          while IFS= read -r module; do
            MODULE_COUNT=$((MODULE_COUNT + 1))

            vermagic="$(
              modinfo -F vermagic "${module}" 2>/dev/null || true
            )"

            echo "$(basename "${module}"): ${vermagic}"

            test "${vermagic}" = "${EXPECTED_VERMAGIC}"
          done < <(
            find "${OUT_DIR}" \
              -type f \
              -name '*.ko' \
              -print \
              | sort
          )

          test "${MODULE_COUNT}" -gt 0

          echo
          echo "Verified module count: ${MODULE_COUNT}"
          echo "All compiled modules have the expected ABI."

          echo
          echo "=== QCACLD3 NetHunter injection symbols ==="

          WLAN_MODULE="${OUT_DIR}/drivers/staging/qcacld-3.0/wlan.ko"

          test -s "${WLAN_MODULE}"

          REQUIRED_SYMBOLS=(
            "wma_process_injection_queue_work"
            "hdd_init_frame_injection"
            "hdd_deinit_frame_injection"
            "hdd_frame_inject_netlink"
            "hdd_frame_inject_ioctl"
            "hdd_frame_inject_enable"
            "hdd_frame_inject_disable"
            "wma_process_injection_queue"
          )

          for symbol in "${REQUIRED_SYMBOLS[@]}"; do
            echo "Checking ${symbol}"

            if ! llvm-nm -a "${WLAN_MODULE}" 2>/dev/null \
                | grep -Eq "[[:space:]]${symbol}$"; then
              echo "ERROR: Missing QCACLD3 injection symbol: ${symbol}"
              exit 1
            fi
          done

          echo
          echo "All required QCACLD3 injection symbols are present."

          echo
          echo "=== Flashing safety audit ==="

          if find . -maxdepth 3 \
              -type f \
              \( -name 'boot.img' -o -name 'vendor_boot.img' \) \
              -print \
              | grep -q .; then
            echo "ERROR: Unexpected flashable boot image found."
            exit 1
          fi

          if find . -maxdepth 4 \
              -type d \
              -iname '*AnyKernel*' \
              -print \
              | grep -q .; then
            echo "ERROR: AnyKernel3 content found."
            exit 1
          fi

          echo "No flashable boot image generated."
          echo "No AnyKernel3 content found."

          echo
          echo "========================================"
          echo " FINAL STATIC AUDIT PASSED"
          echo "========================================"


       
      - name: Package verified kernel artifacts
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Part 8: artifact packaging ==="

          ARTIFACT_DIR="../artifacts/nethunter-cebu"
          MODULE_DIR="${ARTIFACT_DIR}/modules"

          rm -rf "${ARTIFACT_DIR}"
          mkdir -p "${MODULE_DIR}"

          IMAGE="${OUT_DIR}/arch/arm64/boot/Image"

          test -s "${IMAGE}"
          test -f "../artifacts/source-audit/part7-result.txt"

          echo
          echo "=== Copy kernel ==="

          cp -f "${IMAGE}" "${ARTIFACT_DIR}/Image"

          echo
          echo "=== Copy compiled modules ==="

          MODULE_COUNT=0

          while IFS= read -r module; do
            [ -n "${module}" ] || continue

            relative="${module#${OUT_DIR}/}"

            mkdir -p \
              "${MODULE_DIR}/$(dirname "${relative}")"

            cp -f \
              "${module}" \
              "${MODULE_DIR}/${relative}"

            MODULE_COUNT=$((MODULE_COUNT + 1))
          done < <(find "${OUT_DIR}" -type f -name '*.ko' | sort)

          if [ "${MODULE_COUNT}" -eq 0 ]; then
            echo "ERROR: No modules were packaged."
            exit 1
          fi

          echo "Packaged modules: ${MODULE_COUNT}"

          echo
          echo "=== Copy verification reports ==="

          cp -f \
            ../artifacts/source-audit/part7-result.txt \
            "${ARTIFACT_DIR}/part7-result.txt"

          cp -f \
            ../artifacts/source-audit/qcacld3-symbols.txt \
            "${ARTIFACT_DIR}/qcacld3-symbols.txt"



            echo "=== Generate built module manifest ==="

          find "${OUT_DIR}" \
          -type f \
          -name '*.ko' \
          -print \
          | sort \
          > ../artifacts/source-audit/built-modules.txt

          test -s ../artifacts/source-audit/built-modules.txt

           echo "Built module manifest:"
           cat ../artifacts/source-audit/built-modules.txt

            

          cp -f \
            ../artifacts/source-audit/built-modules.txt \
            "${ARTIFACT_DIR}/built-modules.txt"

             echo "=== Generate kernel Image checksum ==="

             test -f "${OUT_DIR}/arch/arm64/boot/Image"

             sha256sum \
              "${OUT_DIR}/arch/arm64/boot/Image" \
              > ../artifacts/source-audit/kernel-Image.sha256

            cat ../artifacts/source-audit/kernel-Image.sha256

          cp -f \
            ../artifacts/source-audit/kernel-Image.sha256 \
            "${ARTIFACT_DIR}/kernel-Image.sha256"

          echo
            echo "=== Generate artifact checksums ==="

              (
            cd "${ARTIFACT_DIR}"
          find . \
            -type f \
            ! -name 'SHA256SUMS' \
           -print0 \
           | sort -z \
            | xargs -0 sha256sum
           ) > "${ARTIFACT_DIR}/SHA256SUMS"

             test -s "${ARTIFACT_DIR}/SHA256SUMS"

            echo "=== SHA256SUMS ==="
           cat "${ARTIFACT_DIR}/SHA256SUMS"

          echo
          echo "=== Generate artifact manifest ==="

          {
            echo "Device: Motorola Moto G9 Power (cebu)"
            echo "ROM: LineageOS 23.2 / Android 16"
            echo "Kernel base: Linux 4.19.325"
            echo "Architecture: arm64"
            echo "Artifact type: verified kernel build output"
            echo "Flashable boot image: NO"
            echo "AnyKernel3: NO"
            echo "Flashing performed by workflow: NO"
            echo "Reboot performed by workflow: NO"
            echo "Compiled modules: ${MODULE_COUNT}"
            echo
            echo "Kernel SHA256:"
            sha256sum "${ARTIFACT_DIR}/Image"
            echo
            echo "Contents:"
            find "${ARTIFACT_DIR}" -type f -printf '%P\n' | sort
          } > "${ARTIFACT_DIR}/MANIFEST.txt"

          echo
          echo "=== Verify packaged kernel ==="

          test -s "${ARTIFACT_DIR}/Image"
          test -s "${ARTIFACT_DIR}/SHA256SUMS"
          test -s "${ARTIFACT_DIR}/MANIFEST.txt"

          echo
          echo "=== Artifact tree ==="

          find "${ARTIFACT_DIR}" -type f -printf '%P\n' | sort

          echo
          echo "=== PART 10 PASSED ==="background: 



      - name: Upload verified kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cebu-nethunter-verified-kernel
          path: artifacts/nethunter-cebu
          if-no-files-found: error
          retention-days: 30

       
          
           




           
