            "${FRAME_H}"

          grep -q \
            'static inline QDF_STATUS hdd_reset_injection_stats' \
            "${FRAME_H}"

          echo
          echo "=== Removing ONLY duplicate helper lines 682-691 ==="

          sed -i '682,691d' "${FRAME_H}"

          echo
          echo "=== Verifying duplicates were removed ==="

          if grep -q \
            'static inline QDF_STATUS hdd_get_injection_stats' \
            "${FRAME_H}"; then
            echo "ERROR: hdd_get_injection_stats still exists in frame_inject.h"
            exit 1
          fi

          if grep -q \
            'static inline QDF_STATUS hdd_reset_injection_stats' \
