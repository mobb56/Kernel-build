          # ----------------------------------------------------------

          grep -Fq \
            'capable(CAP_NET_RAW)' \
            "${K}/core/hdd/src/wlan_hdd_inject_security.c"

          echo "Source adaptation verification passed."

      # ============================================================
      # 20. BUILD KERNEL + MODULES
      #
      # Keep the build log even when make fails.
      # ============================================================

      - name: Build kernel and modules
        id: kernel_build
        shell: bash
        run: |
          set -o pipefail

          cd kernel

          BUILD_LOG="${GITHUB_WORKSPACE}/kernel-build.log"

          rm -f "${BUILD_LOG}"

          make -j2 \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            Image \
            modules \
            2>&1 | tee "${BUILD_LOG}"

          status="${PIPESTATUS[0]}"

          if [ "${status}" -ne 0 ]; then
            echo "Kernel build failed."
            exit "${status}"
          fi

          test -s "${BUILD_LOG}"

          echo "Kernel and module build completed successfully."

      # ============================================================
      # 21. FAILURE DIAGNOSTICS
      #
      # If a genuine compiler failure occurs, expose the useful
      # portion instead of only showing "Makefile:153 Error 2".
      #
      # This step also handles the case where the failure happened
      # before kernel-build.log could be created.
      # ============================================================

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "BUILD FAILURE DIAGNOSTICS"
          echo "============================================================"

          if [ -f kernel-build.log ]; then

            echo
            echo "First likely compiler/linker errors:"

            grep -nEi \
              '(^|[[:space:]])(error:|fatal error:|undefined reference|undefined!|No such file|not found)' \
              kernel-build.log |
              head -n 100 || true

            echo
            echo "Last 250 build-log lines:"

            tail -n 250 kernel-build.log

          else

            echo "kernel-build.log does not exist."
            echo
            echo "The failure occurred before the kernel compilation step"
            echo "or before the build log could be created."

          fi

      # ============================================================
      # 22. VERIFY RELEASE
      #
      # This is a second release check after compilation.
      # Step 11 already prevents an expensive build with a bad
      # configured release.
