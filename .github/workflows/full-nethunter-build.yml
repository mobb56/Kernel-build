          FINAL="${GITHUB_WORKSPACE}/artifacts/source-audit/final-normalized.config"
          DIFF="${GITHUB_WORKSPACE}/artifacts/source-audit/stock-vs-final.config.diff"

          diff -u \
            "${STOCK}" \
            "${FINAL}" \
            > "${DIFF}" || true

          echo "============================================================"
          echo "STOCK -> FINAL CONFIGURATION DIFFERENCE"
          echo "============================================================"

          cat "${DIFF}"

      # ============================================================
      # 40. VERIFY CRITICAL STOCK HARDWARE SETTINGS
      #
