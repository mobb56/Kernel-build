name: Build Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      OUT_DIR: ${{ github.workspace }}/kernel-out

    steps:

      # ============================================================
      # 1. BUILD DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            clang-14 \
            llvm \
            llvm-14 \
            lld \
            lld-14 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            zip \
            unzip \
            python3

          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 2. CLONE OFFICIAL LINEAGEOS KERNEL
      # ============================================================

      - name: Clone LineageOS kernel
        run: |
          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$KERNEL_DIR"

          echo
          echo "Kernel repository:"
          echo "$KERNEL_DIR"

          echo
          echo "Kernel commit:"
          git -C "$KERNEL_DIR" rev-parse HEAD

          echo
          echo "Kernel branch:"
          git -C "$KERNEL_DIR" branch --show-current

          echo
          echo "Initial Git status:"
          git -C "$KERNEL_DIR" status --short


      # ============================================================
      # 3. CLEAN BUILD DIRECTORIES
      # ============================================================

      - name: Prepare build directories
        run: |
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          cd "$KERNEL_DIR"

          make mrproper

          mkdir -p "$OUT_DIR"


      # ============================================================
      # 4. VERIFY BASE DEFCONFIG
      #
      # We deliberately use the public Bengal performance
      # configuration rather than the unavailable proprietary
      # cebu-default.config.
      # ============================================================

      - name: Verify Bengal base configuration
        run: |
          DEFCONFIG="$KERNEL_DIR/arch/arm64/configs/vendor/bengal-perf_defconfig"

          if [ ! -f "$DEFCONFIG" ]; then
            echo "ERROR: Bengal defconfig was not found:"
            echo "$DEFCONFIG"
            exit 1
          fi

          echo "Found:"
          echo "$DEFCONFIG"

          echo
          echo "Kernel base configuration:"
          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_ARCH_BENGAL=|CONFIG_BT=|CONFIG_CFG80211=|CONFIG_TUN=|CONFIG_VETH=|CONFIG_INPUT_UINPUT=|CONFIG_USB_CONFIGFS=' \
            "$DEFCONFIG" || true


      # ============================================================
      # 5. CREATE NETHUNTER CONFIG OUTSIDE KERNEL TREE
      #
      # IMPORTANT:
      # Keeping this outside the Git checkout prevents "-dirty"
      # from being appended to the kernel release.
      # ============================================================

      - name: Create NetHunter configuration
        run: |
          NH_CONFIG="$GITHUB_WORKSPACE/nethunter.config"

          rm -f "$NH_CONFIG"

          cat > "$NH_CONFIG" <<'EOF'

          # ==========================================================
          # Bluetooth
          # ==========================================================

          CONFIG_BT=y
          CONFIG_BT_BREDR=y

          CONFIG_BT_RFCOMM=m
          CONFIG_BT_RFCOMM_TTY=y

          CONFIG_BT_HIDP=m

          CONFIG_BT_HCIVHCI=m

          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y


          # ==========================================================
          # USB Gadget
          # ==========================================================

          CONFIG_USB_GADGET=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_CONFIGFS=y

          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_NCM=y


          # ==========================================================
          # Input / Userspace HID
          # ==========================================================

          CONFIG_INPUT_UINPUT=y


          # ==========================================================
          # Networking
          # ==========================================================

          CONFIG_TUN=y
          CONFIG_VETH=y


          # ==========================================================
          # Wireless framework
          # ==========================================================

          CONFIG_CFG80211=y
          CONFIG_RFKILL=y
          CONFIG_NL80211_TESTMODE=y


          # ==========================================================
          # Motorola sensor dependency
          #
          # Required by:
          #   dts201a_mmi.ko
          #   abov_sar_mmi_overlay.ko
          # ==========================================================

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m

          EOF

          echo "Created:"
          echo "$NH_CONFIG"

          echo
          echo "NetHunter configuration:"
          cat "$NH_CONFIG"

          echo
          echo "Checking that the fragment is outside the kernel Git tree..."

          case "$NH_CONFIG" in
            "$KERNEL_DIR"/*)
              echo "ERROR: NetHunter config is inside kernel source!"
              exit 1
              ;;
            *)
              echo "OK"
              ;;
          esac


      # ============================================================
      # 6. CONFIGURE KERNEL
      # ============================================================

      - name: Configure kernel
        run: |
          cd "$KERNEL_DIR"

          NH_CONFIG="$GITHUB_WORKSPACE/nethunter.config"

          echo "Creating Bengal performance configuration..."

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          echo
          echo "Merging NetHunter configuration..."

          scripts/kconfig/merge_config.sh \
            -m \
            -O "$OUT_DIR" \
            "$OUT_DIR/.config" \
            "$NH_CONFIG"

          echo
          echo "Running olddefconfig..."

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig


      # ============================================================
      # 7. VERIFY REQUIRED OPTIONS
      # ============================================================

      - name: Verify NetHunter configuration
        run: |
          CONFIG="$OUT_DIR/.config"

          echo "=================================================="
          echo "VERIFYING NETHUNTER CONFIGURATION"
          echo "=================================================="

          REQUIRED_CONFIGS=(
            "CONFIG_BT=y"
            "CONFIG_BT_BREDR=y"
            "CONFIG_BT_RFCOMM=m"
            "CONFIG_BT_RFCOMM_TTY=y"
            "CONFIG_BT_HIDP=m"
            "CONFIG_BT_HCIVHCI=m"
            "CONFIG_BT_HCIUART=m"
            "CONFIG_BT_HCIUART_H4=y"

            "CONFIG_USB_GADGET=y"
            "CONFIG_USB_LIBCOMPOSITE=y"
            "CONFIG_USB_CONFIGFS=y"
            "CONFIG_USB_CONFIGFS_F_HID=y"
            "CONFIG_USB_CONFIGFS_NCM=y"

            "CONFIG_INPUT_UINPUT=y"

            "CONFIG_TUN=y"
            "CONFIG_VETH=y"

            "CONFIG_CFG80211=y"
            "CONFIG_RFKILL=y"
            "CONFIG_NL80211_TESTMODE=y"

            "CONFIG_SENSORS_SSC=y"
            "CONFIG_SENSORS_CLASS=m"
          )

          FAILED=0

          for REQUIRED in "${REQUIRED_CONFIGS[@]}"; do
            if grep -qx "$REQUIRED" "$CONFIG"; then
              echo "[OK]   $REQUIRED"
            else
              echo "[FAIL] $REQUIRED"
              FAILED=1
            fi
          done

          echo

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: Configuration verification failed."
            exit 1
          fi

          echo "All required options are enabled."


      # ============================================================
      # 8. VERIFY SOURCE TREE IS CLEAN
      #
      # This is the fix for the previous "-dirty" problem.
      # ============================================================

      - name: Verify clean kernel source
        run: |
          cd "$KERNEL_DIR"

          echo "Git status:"
          git status --short

          if [ -n "$(git status --porcelain)" ]; then
            echo
            echo "ERROR: Kernel source tree is dirty."
            echo
            git status --short
            exit 1
          fi

          echo
          echo "Kernel source tree is CLEAN."


      # ============================================================
      # 9. VERIFY KERNEL RELEASE BEFORE BUILD
      # ============================================================

      - name: Verify kernel release
        run: |
          cd "$KERNEL_DIR"

          EXPECTED_RELEASE="4.19.325-cip135-st19-perf-g39bcecd5c63"

          ACTUAL_RELEASE="$(
            make -s \
              O="$OUT_DIR" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              kernelrelease
          )"

          echo "Expected kernel release:"
          echo "$EXPECTED_RELEASE"

          echo
          echo "Actual kernel release:"
          echo "$ACTUAL_RELEASE"

          if [ "$ACTUAL_RELEASE" != "$EXPECTED_RELEASE" ]; then
            echo
            echo "ERROR: Kernel release mismatch."
            echo
            echo "Expected:"
            echo "$EXPECTED_RELEASE"
            echo
            echo "Got:"
            echo "$ACTUAL_RELEASE"
            exit 1
          fi

          echo
          echo "Kernel release MATCHES the phone."


      # ============================================================
      # 10. SAVE CONFIG
      # ============================================================

      - name: Save final kernel config
        run: |
          cp \
            "$OUT_DIR/.config" \
            "$OUT_DIR/kernel.config"

          echo "Final kernel configuration saved."


      # ============================================================
      # 11. BUILD KERNEL IMAGE
      # ============================================================

      - name: Build kernel Image
        run: |
          cd "$KERNEL_DIR"

          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image


      # ============================================================
      # 12. BUILD MODULES
      # ============================================================

      - name: Build kernel modules
        run: |
          cd "$KERNEL_DIR"

          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules


      # ============================================================
      # 13. VERIFY IMAGE
      # ============================================================

      - name: Verify kernel Image
        run: |
          IMAGE="$OUT_DIR/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Kernel Image was not created."
            exit 1
          fi

          echo "Kernel Image:"
          ls -lh "$IMAGE"


      # ============================================================
      # 14. INSTALL MODULES INTO STAGING DIRECTORY
      # ============================================================

      - name: Install kernel modules
        run: |
          MODULE_DIR="$GITHUB_WORKSPACE/modules"

          rm -rf "$MODULE_DIR"
          mkdir -p "$MODULE_DIR"

          cd "$KERNEL_DIR"

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$MODULE_DIR" \
            modules_install

          echo
          echo "Kernel modules:"
          find "$MODULE_DIR" -type f -name '*.ko' | sort


      # ============================================================
      # 15. VERIFY SENSOR MODULE
      # ============================================================

      - name: Verify sensors_class module
        run: |
          SENSOR="$GITHUB_WORKSPACE/modules/vendor/lib/modules/sensors_class.ko"

          if [ ! -f "$SENSOR" ]; then
            echo "ERROR: sensors_class.ko was not produced."

            echo
            echo "Searching for sensor modules:"
            find "$GITHUB_WORKSPACE/modules" \
              -type f \
              \( -name '*sensor*.ko' -o -name 'sensors_class.ko' \) \
              -print

            exit 1
          fi

          echo "Found:"
          ls -lh "$SENSOR"

          echo
          echo "Module information:"
          modinfo "$SENSOR" || true


      # ============================================================
      # 16. VERIFY MODULE VERMAGIC
      # ============================================================

      - name: Verify module vermagic
        run: |
          EXPECTED_RELEASE="4.19.325-cip135-st19-perf-g39bcecd5c63"

          SENSOR="$GITHUB_WORKSPACE/modules/vendor/lib/modules/sensors_class.ko"

          VERMAGIC="$(modinfo -F vermagic "$SENSOR" 2>/dev/null || true)"

          echo "Expected release:"
          echo "$EXPECTED_RELEASE"

          echo
          echo "Module vermagic:"
          echo "$VERMAGIC"

          case "$VERMAGIC" in
            "$EXPECTED_RELEASE "*)
              echo
              echo "Module vermagic MATCHES."
              ;;
            *)
              echo
              echo "ERROR: Module vermagic does not match kernel release."
              exit 1
              ;;
          esac


      # ============================================================
      # 17. PREPARE ANYKERNEL3
      # ============================================================

      - name: Prepare AnyKernel3
        run: |
          AK3="$GITHUB_WORKSPACE/AnyKernel3"

          rm -rf "$AK3"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            "$AK3"

          rm -rf "$AK3/modules"

          mkdir -p "$AK3/modules"

          cp \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$AK3/Image"

          cp -a \
            "$GITHUB_WORKSPACE/modules/." \
            "$AK3/modules/"

          echo "AnyKernel3 prepared."


      # ============================================================
      # 18. CONFIGURE ANYKERNEL3
      # ============================================================

      - name: Configure AnyKernel3
        run: |
          AK3="$GITHUB_WORKSPACE/AnyKernel3"

          cat > "$AK3/anykernel.sh" <<'EOF'
          # AnyKernel3 Ramdisk Mod Script

          properties() { '
          kernel.string=Moto G9 Power cebu NetHunter Kernel

          do.devicecheck=1
          do.modules=1
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0

          device.name1=cebu
          device.name2=

          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot
          IS_SLOT_DEVICE=auto
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto

          . tools/ak3-core.sh

          dump_boot
          write_boot
          EOF

          chmod 755 "$AK3/anykernel.sh"

          echo
          echo "AnyKernel3 configuration:"
          cat "$AK3/anykernel.sh"


      # ============================================================
      # 19. VERIFY ANYKERNEL PACKAGE CONTENT
      # ============================================================

      - name: Verify AnyKernel package
        run: |
          AK3="$GITHUB_WORKSPACE/AnyKernel3"

          echo "Kernel Image:"
          ls -lh "$AK3/Image"

          echo
          echo "Sensor module:"
          ls -lh \
            "$AK3/modules/vendor/lib/modules/sensors_class.ko"

          echo
          echo "AnyKernel settings:"
          grep -E \
            'device.name1|do.modules|BLOCK=|IS_SLOT_DEVICE=' \
            "$AK3/anykernel.sh"


      # ============================================================
      # 20. CREATE FLASHABLE ZIP
      # ============================================================

      - name: Create flashable ZIP
        run: |
          AK3="$GITHUB_WORKSPACE/AnyKernel3"

          ZIP_FILE="$GITHUB_WORKSPACE/moto-g9-power-cebu-nethunter-flashable.zip"

          rm -f "$ZIP_FILE"

          cd "$AK3"

          zip -r9 \
            "$ZIP_FILE" \
            . \
            -x '.git/*' \
            -x '.github/*'

          echo
          echo "Flashable ZIP:"
          ls -lh "$ZIP_FILE"

          echo
          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"


      # ============================================================
      # 21. FINAL SAFETY CHECK
      # ============================================================

      - name: Final verification
        run: |
          EXPECTED_RELEASE="4.19.325-cip135-st19-perf-g39bcecd5c63"

          echo "=================================================="
          echo "FINAL VERIFICATION"
          echo "=================================================="

          echo
          echo "1. Kernel source status:"
          git -C "$KERNEL_DIR" status --short

          if [ -n "$(git -C "$KERNEL_DIR" status --porcelain)" ]; then
            echo "ERROR: Kernel tree is dirty."
            exit 1
          fi

          echo "PASS"

          echo
          echo "2. Kernel release:"

          FINAL_RELEASE="$(
            make -s \
              -C "$KERNEL_DIR" \
              O="$OUT_DIR" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              kernelrelease
          )"

          echo "$FINAL_RELEASE"

          if [ "$FINAL_RELEASE" != "$EXPECTED_RELEASE" ]; then
            echo "ERROR: Final kernel release mismatch."
            exit 1
          fi

          echo "PASS"

          echo
          echo "3. Kernel Image:"
          ls -lh "$OUT_DIR/arch/arm64/boot/Image"

          echo
          echo "4. sensors_class.ko:"
          ls -lh \
            "$GITHUB_WORKSPACE/modules/vendor/lib/modules/sensors_class.ko"

          echo
          echo "5. Flashable ZIP:"
          ls -lh \
            "$GITHUB_WORKSPACE/moto-g9-power-cebu-nethunter-flashable.zip"

          echo
          echo "=================================================="
          echo "ALL FINAL CHECKS PASSED"
          echo "=================================================="


      # ============================================================
      # 22. UPLOAD FLASHABLE ZIP
      # ============================================================

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-flashable
          path: moto-g9-power-cebu-nethunter-flashable.zip
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 23. COLLECT RAW KERNEL ARTIFACT
      # ============================================================

      - name: Collect raw kernel artifact
        run: |
          RAW="$GITHUB_WORKSPACE/raw-kernel"

          rm -rf "$RAW"
          mkdir -p "$RAW"

          cp \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$RAW/Image"

          cp \
            "$OUT_DIR/kernel.config" \
            "$RAW/kernel.config"

          cp \
            "$GITHUB_WORKSPACE/nethunter.config" \
            "$RAW/nethunter.config"

          cp \
            "$GITHUB_WORKSPACE/modules/vendor/lib/modules/sensors_class.ko" \
            "$RAW/sensors_class.ko"

          echo "Raw kernel artifact:"
          find "$RAW" -type f -exec ls -lh {} \;


      # ============================================================
      # 24. UPLOAD RAW KERNEL
      # ============================================================

      - name: Upload raw kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          path: raw-kernel/
          if-no-files-found: error
          retention-days: 30
