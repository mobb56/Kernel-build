name: QCACLD3 In-Tree Injection Prototype v4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            python3 \
            rsync \
            ripgrep

      - name: Clone LineageOS SM6225 kernel
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            kernel

      - name: Clone NetHunter reference
        run: |
          git clone --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            reference

      - name: Prepare directories
        run: |
          rm -rf out report
          mkdir -p out report

      - name: Generate base kernel config
        run: |
          set -e

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

      - name: Enable QCACLD3 module
        run: |
          set -e

          test -f out/.config

          echo "Before:"
          grep '^CONFIG_QCA_CLD_WLAN=' \
            out/.config || true

          ./kernel/scripts/config \
            --file out/.config \
            --module CONFIG_QCA_CLD_WLAN

          echo
          echo "After scripts/config:"
          grep '^CONFIG_QCA_CLD_WLAN=' \
            out/.config

          test "$(grep '^CONFIG_QCA_CLD_WLAN=' out/.config)" = \
            "CONFIG_QCA_CLD_WLAN=m"

      - name: Synchronize configuration
        run: |
          set -e

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          grep '^CONFIG_QCA_CLD_WLAN=' \
            out/.config

          test "$(grep '^CONFIG_QCA_CLD_WLAN=' out/.config)" = \
            "CONFIG_QCA_CLD_WLAN=m"

      - name: Prepare kernel
        run: |
          set -e

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            prepare

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules_prepare

      - name: Verify configuration
        run: |
          set -e

          test -f out/include/config/auto.conf
          test -f out/include/config/auto.conf.cmd

          echo "=== WLAN configuration ==="
          grep -E \
            '^CONFIG_QCA_CLD_WLAN=|^CONFIG_CFG80211=|^CONFIG_MAC80211=' \
            out/.config || true

          echo
          echo "=== auto.conf ==="
          grep \
            'CONFIG_QCA_CLD_WLAN' \
            out/include/config/auto.conf

      - name: Verify integrated Qualcomm source
        run: |
          set -e

          test -d kernel/drivers/staging/qcacld-3.0
          test -d kernel/drivers/staging/qca-wifi-host-cmn
          test -d kernel/drivers/staging/fw-api

          test -f \
            kernel/drivers/staging/qca-wifi-host-cmn/qdf/inc/qdf_nbuf.h

          test -f \
            kernel/drivers/staging/fw-api/fw/athdefs.h

          echo "QCACLD3: OK"
          echo "QDF: OK"
          echo "FW API: OK"

      - name: Copy injection prototype
        run: |
          set -e

          K="$PWD/kernel/drivers/staging/qcacld-3.0"
          R="$PWD/reference/drivers/staging/qcacld-3.0"

          cp \
            "$R/core/wma/inc/wma_frame_inject.h" \
            "$K/core/wma/inc/"

          cp \
            "$R/core/wma/src/wma_frame_inject.c" \
            "$K/core/wma/src/"

          cp \
            "$R/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "$K/core/hdd/inc/"

          cp \
            "$R/core/hdd/src/wlan_hdd_frame_inject.c" \
            "$K/core/hdd/src/"

          cp \
            "$R/core/hdd/inc/wlan_hdd_frame_validate.h" \
            "$K/core/hdd/inc/"

          cp \
            "$R/core/hdd/src/wlan_hdd_frame_validate.c" \
            "$K/core/hdd/src/"

      - name: Add injection objects safely
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "kernel/drivers/staging/qcacld-3.0/Kbuild"
          )

          text = p.read_text()

          marker = (
              "INCS := -I $(srctree)/$(WLAN_ROOT)/inc"
          )

          if marker not in text:
              raise SystemExit(
                  "Safe Kbuild insertion marker not found"
              )

          additions = """
          # NetHunter injection prototype
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o
          cppflags-y += -DCONFIG_FEATURE_FRAME_INJECTION_SUPPORT

          """

          if "HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o" not in text:
              text = text.replace(
                  marker,
                  additions + marker,
                  1
              )

          p.write_text(text)
          PY

      - name: Verify Kbuild changes
        run: |
          set -e

          K="kernel/drivers/staging/qcacld-3.0/Kbuild"

          grep -n \
            -E \
            'wlan_hdd_frame_inject\.o|wlan_hdd_frame_validate\.o|wma_frame_inject\.o' \
            "$K"

      - name: Build QCACLD3
        id: build
        continue-on-error: true
        run: |
          set -o pipefail

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            M=drivers/staging/qcacld-3.0 \
            V=1 \
            modules \
            2>&1 | tee report/qcacld3-build.log

      - name: Capture diagnostics
        if: always()
        run: |
          {
            echo "=== CONFIG_QCA_CLD_WLAN ==="
            grep '^CONFIG_QCA_CLD_WLAN=' \
              out/.config || true

            echo
            echo "=== Compiler errors ==="
            grep -n -C 6 \
              'error:' \
              report/qcacld3-build.log || true

            echo
            echo "=== Fatal errors ==="
            grep -n -C 6 \
              'fatal error' \
              report/qcacld3-build.log || true

            echo
            echo "=== Missing headers ==="
            grep -n \
              'file not found' \
              report/qcacld3-build.log || true

            echo
            echo "=== Kbuild errors ==="
            grep -n \
              'Kbuild:' \
              report/qcacld3-build.log || true

            echo
            echo "=== Undefined ==="
            grep -n -E \
              'undefined|UNDEFINED' \
              report/qcacld3-build.log || true
          } > report/compiler-diagnostics.txt

      - name: Find compilation objects
        if: always()
        run: |
          {
            echo "=== Injection objects ==="

            find kernel out \
              -type f \
              \( \
                -name 'wma_frame_inject.o' \
                -o -name 'wlan_hdd_frame_inject.o' \
                -o -name 'wlan_hdd_frame_validate.o' \
              \) \
              -print || true

            echo
            echo "=== WLAN objects ==="

            find kernel out \
              -type f \
              \( \
                -name 'wlan.o' \
                -o -name 'qca_cld3_wlan.o' \
              \) \
              -print || true
          } > report/objects.txt

      - name: Find modules
        if: always()
        run: |
          {
            echo "=== WLAN modules ==="

            find kernel out \
              -type f \
              \( \
                -name 'wlan.ko' \
                -o -name 'qca_cld3_wlan.ko' \
              \) \
              -print || true

            echo
            echo "=== All modules ==="

            find kernel out \
              -type f \
              -name '*.ko' \
              -print || true
          } > report/modules.txt

      - name: Inspect build log
        if: always()
        run: |
          {
            echo "=== CC lines ==="
            grep -E \
              '(^|[[:space:]])CC[[:space:]]' \
              report/qcacld3-build.log \
              | head -n 500 || true

            echo
            echo "=== LD lines ==="
            grep -E \
              '(^|[[:space:]])LD[[:space:]]' \
              report/qcacld3-build.log \
              | head -n 200 || true

            echo
            echo "=== MODPOST ==="
            grep -n \
              'MODPOST' \
              report/qcacld3-build.log || true
          } > report/build-stages.txt

      - name: Conclusion
        if: always()
        run: |
          {
            echo "=== QCACLD3 Injection Prototype v4 ==="
            echo

            CONFIG=$(grep '^CONFIG_QCA_CLD_WLAN=' \
              out/.config 2>/dev/null || true)

            echo "CONFIG_QCA_CLD_WLAN: $CONFIG"

            echo

            if find kernel out \
              -type f \
              \( \
                -name 'wlan.ko' \
                -o -name 'qca_cld3_wlan.ko' \
              \) \
              | grep -q .; then

              echo "RESULT: WLAN MODULE GENERATED"

            elif find kernel out \
              -type f \
              \( \
                -name 'wma_frame_inject.o' \
                -o -name 'wlan_hdd_frame_inject.o' \
                -o -name 'wlan_hdd_frame_validate.o' \
              \) \
              | grep -q .; then

              echo "RESULT: INJECTION OBJECTS COMPILED"

            else

              echo "RESULT: NO INJECTION OBJECTS OR WLAN MODULE"

            fi

          } > report/CONCLUSION.txt

      - name: Package report
        if: always()
        run: |
          mkdir -p artifact
          cp -r report artifact/

          cd artifact
          zip -r ../qcacld3-in-tree-injection-v4.zip .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-in-tree-injection-v4
          path: qcacld3-in-tree-injection-v4.zip
          if-no-files-found: error
