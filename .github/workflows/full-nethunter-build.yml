          R="nethunter-reference/drivers/staging/qcacld-3.0"

          echo "=== CESIUM NETLINK IMPLEMENTATION ==="
          grep -RniE \
            'cesium_nl_srv_sock|hdd_open_cesium_nl_sock|hdd_close_cesium_nl_sock|hdd_frame_inject_netlink' \
            "$R" 2>/dev/null | head -100

          echo
          echo "=== INJECTION SYSFS IMPLEMENTATION ==="
          grep -RniE \
