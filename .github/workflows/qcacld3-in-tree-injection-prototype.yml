name: QCACLD3 Frame Injection Probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL: ${{ github.workspace }}/kernel
  REFERENCE: ${{ github.workspace }}/reference
  OUT: ${{ github.workspace }}/out
  REPORT: ${{ github.workspace }}/qcacld3-v21-report.txt

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld-14 \
            clang-14 \
            llvm-14 \
            make \
            perl \
            python3

      - name: Set paths
        run: |
          set -eux

          rm -rf "$KERNEL" "$REFERENCE" "$OUT"

          mkdir -p \
            "$KERNEL" \
            "$REFERENCE" \
            "$OUT"

      - name: Clone Motorola kernel and reference kernel
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$KERNEL"

          git clone \
            --depth 1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            "$REFERENCE"

          echo "Motorola kernel:"
          git -C "$KERNEL" rev-parse HEAD

          echo "Reference kernel:"
          git -C "$REFERENCE" rev-parse HEAD

      - name: Configure kernel
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          export PATH="/usr/lib/llvm-14/bin:$PATH"

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          cat > "$GITHUB_WORKSPACE/qcacld3-probe.config" <<'EOF'
          CONFIG_QCA_CLD_WLAN=m
          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m
          EOF

          scripts/kconfig/merge_config.sh \
            -m \
            -O "$OUT" \
            "$OUT/.config" \
            "$GITHUB_WORKSPACE/qcacld3-probe.config"

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      - name: Verify configuration
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          grep -E \
            '^(CONFIG_QCA_CLD_WLAN|CONFIG_SENSORS_SSC|CONFIG_SENSORS_CLASS)=' \
            "$OUT/.config"

      - name: Prepare kernel
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          export PATH="/usr/lib/llvm-14/bin:$PATH"

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_prepare

      - name: Build baseline QCACLD3
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          export PATH="/usr/lib/llvm-14/bin:$PATH"

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/staging/qcacld-3.0 \
            modules

          test -f \
            "$OUT/drivers/staging/qcacld-3.0/wlan.ko"

          echo "BASELINE_QCACLD3=PASS"

      - name: Import injection headers and sources
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          mkdir -p \
            drivers/staging/qcacld-3.0/core/hdd/inc \
            drivers/staging/qcacld-3.0/core/hdd/src \
            drivers/staging/qcacld-3.0/core/wma/inc \
            drivers/staging/qcacld-3.0/core/wma/src

          cp \
            "$REFERENCE/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject.h" \
            drivers/staging/qcacld-3.0/core/hdd/inc/

          cp \
            "$REFERENCE/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_validate.h" \
            drivers/staging/qcacld-3.0/core/hdd/inc/

          cp \
            "$REFERENCE/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_inject_security.h" \
            drivers/staging/qcacld-3.0/core/hdd/inc/

          cp \
            "$REFERENCE/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject_debug.h" \
            drivers/staging/qcacld-3.0/core/hdd/inc/

          cp \
            "$REFERENCE/drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h" \
            drivers/staging/qcacld-3.0/core/wma/inc/

          cp \
            "$REFERENCE/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c" \
            drivers/staging/qcacld-3.0/core/hdd/src/

          cp \
            "$REFERENCE/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_validate.c" \
            drivers/staging/qcacld-3.0/core/hdd/src/

          cp \
            "$REFERENCE/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c" \
            drivers/staging/qcacld-3.0/core/hdd/src/

          cp \
            "$REFERENCE/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
            drivers/staging/qcacld-3.0/core/hdd/src/

          cp \
            "$REFERENCE/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c" \
            drivers/staging/qcacld-3.0/core/wma/src/

          test -f drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject.h
          test -f drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_validate.h
          test -f drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_inject_security.h
          test -f drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject_debug.h
          test -f drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h

          test -f drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c
          test -f drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_validate.c
          test -f drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c
          test -f drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c
          test -f drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c

          echo "INJECTION_SOURCES=PASS"

      - name: Adapt hdd_adapter
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          MAIN_H="drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h"

          grep -q \
            'struct hdd_injection_ctx \*injection_ctx;' \
            "$MAIN_H" || \
          sed -i \
            '/qdf_atomic_t net_dev_hold_ref_count\[NET_DEV_HOLD_ID_MAX\];/a\
          #ifdef FEATURE_FRAME_INJECTION_SUPPORT\
          	struct hdd_injection_ctx *injection_ctx;\
          #endif' \
            "$MAIN_H"

          grep -q \
            'struct hdd_injection_ctx \*injection_ctx;' \
            "$MAIN_H"

          grep -n \
            -A5 \
            -B3 \
            'injection_ctx' \
            "$MAIN_H"

      - name: Include injection API
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          MAIN_H="drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h"

          if ! grep -q \
            '#include "wlan_hdd_frame_inject.h"' \
            "$MAIN_H"; then

            sed -i \
              '/#include "wlan_hdd_sta_info.h"/a\
          #ifdef FEATURE_FRAME_INJECTION_SUPPORT\
          #include "wlan_hdd_frame_inject.h"\
          #endif' \
              "$MAIN_H"
          fi

          grep -q \
            '#include "wlan_hdd_frame_inject.h"' \
            "$MAIN_H"

          grep -n \
            -A4 \
            -B3 \
            'wlan_hdd_frame_inject.h' \
            "$MAIN_H"

      - name: Patch QCACLD3 Kbuild
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          KBUILD="drivers/staging/qcacld-3.0/Kbuild"

          HDD_BLOCK='ifeq ($(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT), y)
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o
          endif
          '

          WMA_BLOCK='ifeq ($(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT), y)
          WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o
          endif
          '

          perl -0pi -e \
            's/\Qifeq ($(CONFIG_WLAN_NUD_TRACKING), y)\E/$ENV{HDD_BLOCK}$&/ unless /wlan_hdd_frame_inject\.o/' \
            "$KBUILD"

          perl -0pi -e \
            's/\Q#######DIRECT_BUFFER_RX#########\E/$ENV{WMA_BLOCK}$&/ unless /wma_frame_inject\.o/' \
            "$KBUILD"

          perl -0pi -e \
            's/\Qccflags-y += $(INCS)\E/ccflags-y += $(INCS)\nccflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT\nccflags-y += -DFEATURE_MONITOR_MODE_SUPPORT\nccflags-y += -I \$(srctree)\/\$(WLAN_ROOT)\/\$(HDD_INC_DIR)\nccflags-y += -I \$(srctree)\/\$(WLAN_ROOT)\/\$(HDD_SRC_DIR)\nccflags-y += -I \$(srctree)\/\$(WLAN_ROOT)\/\$(WMA_INC_DIR)\nccflags-y += -I \$(srctree)\/\$(WLAN_ROOT)\/\$(WMA_SRC_DIR)/ unless /-DFEATURE_FRAME_INJECTION_SUPPORT/' \
            "$KBUILD"

          grep -q \
            'wlan_hdd_frame_inject.o' \
            "$KBUILD"

          grep -q \
            'wlan_hdd_frame_validate.o' \
            "$KBUILD"

          grep -q \
            'wlan_hdd_inject_security.o' \
            "$KBUILD"

          grep -q \
            'wlan_hdd_frame_inject_debug.o' \
            "$KBUILD"

          grep -q \
            'wma_frame_inject.o' \
            "$KBUILD"

          grep -q \
            'FEATURE_FRAME_INJECTION_SUPPORT' \
            "$KBUILD"

          echo "KBUILD_INJECTION_PATCH=PASS"

      - name: Show final injection Kbuild
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          KBUILD="drivers/staging/qcacld-3.0/Kbuild"

          grep -n \
            -A8 \
            -B3 \
            'wlan_hdd_frame_inject.o' \
            "$KBUILD"

          grep -n \
            -A4 \
            -B3 \
            'wma_frame_inject.o' \
            "$KBUILD"

          grep -n \
            -A6 \
            'ccflags-y += $(INCS)' \
            "$KBUILD"

      - name: Clean QCACLD3 module outputs
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          rm -f \
            "$OUT/drivers/staging/qcacld-3.0/wlan.ko" \
            "$OUT/drivers/staging/qcacld-3.0/wlan.o" \
            "$OUT/drivers/staging/qcacld-3.0/wlan.lto.o" \
            "$OUT/drivers/staging/qcacld-3.0/wlan.mod.o"

      - name: Build injection-enabled QCACLD3
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          export PATH="/usr/lib/llvm-14/bin:$PATH"

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CONFIG_FEATURE_FRAME_INJECTION_SUPPORT=y \
            CONFIG_FEATURE_MONITOR_MODE_SUPPORT=y \
            M=drivers/staging/qcacld-3.0 \
            V=1 \
            modules

          test -f \
            "$OUT/drivers/staging/qcacld-3.0/wlan.ko"

          test -f \
            "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.o"

          test -f \
            "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_validate.o"

          test -f \
            "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.o"

          test -f \
            "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.o"

          test -f \
            "$OUT/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.o"

          echo "INJECTION_BUILD=PASS"

      - name: Verify wlan.ko
        working-directory: ${{ env.KERNEL }}
        run: |
          set -eux

          modinfo \
            "$OUT/drivers/staging/qcacld-3.0/wlan.ko" \
            > "$GITHUB_WORKSPACE/wlan-modinfo.txt" || true

          file \
            "$OUT/drivers/staging/qcacld-3.0/wlan.ko"

          ls -lh \
            "$OUT/drivers/staging/qcacld-3.0/wlan.ko"

      - name: Collect diagnostics
        if: always()
        working-directory: ${{ env.KERNEL }}
        run: |
          set +e

          {
            echo "=== QCACLD3 v21 diagnostic ==="
            echo

            echo "Motorola kernel:"
            git rev-parse HEAD
            echo

            echo "Reference kernel:"
            git -C "$REFERENCE" rev-parse HEAD
            echo

            echo "Kernel release:"
            make -s \
              O="$OUT" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              kernelrelease

            echo

            echo "Injection objects:"
            find \
              "$OUT/drivers/staging/qcacld-3.0" \
              -type f \
              \( \
                -name 'wlan_hdd_frame_inject.o' -o \
                -name 'wlan_hdd_frame_validate.o' -o \
                -name 'wlan_hdd_inject_security.o' -o \
                -name 'wlan_hdd_frame_inject_debug.o' -o \
                -name 'wma_frame_inject.o' \
              \) \
              -print

            echo

            echo "wlan.ko:"
            ls -lh \
              "$OUT/drivers/staging/qcacld-3.0/wlan.ko"

          } > "$REPORT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-v21-report
          path: |
            ${{ env.REPORT }}
            ${{ github.workspace }}/wlan-modinfo.txt
          if-no-files-found: warn
