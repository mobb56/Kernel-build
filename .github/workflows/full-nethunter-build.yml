            echo "ERROR: hdd_reset_injection_stats still exists in frame_inject.h"
            exit 1
          fi

          echo
          echo "=== Verifying security header still contains the helpers ==="

          grep -n \
            'static inline QDF_STATUS hdd_get_injection_stats\|static inline QDF_STATUS hdd_reset_injection_stats' \
            "${SECURITY_H}"

          echo
          echo "=== Verifying frame header preprocessor balance ==="

          grep -n \
            '#if\|#ifdef\|#ifndef\|#else\|#elif\|#endif' \
