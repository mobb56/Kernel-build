name: Build Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ------------------------------------------------------------
      # 1. Install build dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang-14 \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ------------------------------------------------------------
      # 2. Setup LLVM 14
      # ------------------------------------------------------------
      - name: Setup LLVM
        run: |
          set -e

          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

          /usr/lib/llvm-14/bin/clang --version
          /usr/lib/llvm-14/bin/ld.lld --version

      # ------------------------------------------------------------
      # 3. Checkout official LineageOS kernel
      # ------------------------------------------------------------
      - name: Checkout LineageOS SM6225 kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6225
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      # ------------------------------------------------------------
      # 4. Checkout cebu device tree
      # ------------------------------------------------------------
      - name: Checkout cebu device tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_cebu
          ref: lineage-23.2
          path: device/motorola/cebu
          fetch-depth: 1

      # ------------------------------------------------------------
      # 5. Checkout SM6225 common device tree
      # ------------------------------------------------------------
      - name: Checkout SM6225 common device tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_sm6225-common
          ref: lineage-23.2
          path: device/motorola/sm6225-common
          fetch-depth: 1

      # ------------------------------------------------------------
      # 6. Verify source trees
      # ------------------------------------------------------------
      - name: Verify source
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "Kernel revision"
          echo "========================================"
          git rev-parse HEAD

          echo
          echo "========================================"
          echo "cebu device revision"
          echo "========================================"
          git -C "$GITHUB_WORKSPACE/device/motorola/cebu" rev-parse HEAD

          echo
          echo "========================================"
          echo "SM6225 common revision"
          echo "========================================"
          git -C "$GITHUB_WORKSPACE/device/motorola/sm6225-common" rev-parse HEAD

          echo
          echo "========================================"
          echo "Checking required kernel files"
          echo "========================================"

          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          test -f scripts/kconfig/merge_config.sh
          test -f drivers/clk/qcom/clk-debug.c

          echo "Required kernel files found."

          echo
          echo "========================================"
          echo "Checking cebu BoardConfig"
          echo "========================================"

          grep -n "cebu-default.config" \
            "$GITHUB_WORKSPACE/device/motorola/cebu/BoardConfig.mk" \
            || true

      # ------------------------------------------------------------
      # 7. Clean source tree
      # ------------------------------------------------------------
      - name: Clean kernel source
        working-directory: kernel
        run: |
          set -e

          make ARCH=arm64 mrproper

          rm -rf out

          rm -rf include/config
          rm -rf include/generated
          rm -rf arch/arm64/include/generated
          rm -rf .config

          echo "Kernel source cleaned."

      # ------------------------------------------------------------
      # 8. Locate cebu-specific kernel config
      # ------------------------------------------------------------
      - name: Locate cebu kernel configuration
        run: |
          set -e

          CEBU_CONFIG="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "cebu-default.config" \
            -print -quit)"

          if [ -n "$CEBU_CONFIG" ]; then
            echo "Found cebu config:"
            echo "$CEBU_CONFIG"

            echo "CEBU_CONFIG=$CEBU_CONFIG" >> "$GITHUB_ENV"
          else
            echo "::warning::cebu-default.config was not found in the checked-out public trees."
            echo "The build will continue using the SM6225 Bengal base configuration."
          fi

      # ------------------------------------------------------------
      # 9. Create NetHunter configuration fragment
      # ------------------------------------------------------------
      - name: Create NetHunter config
        working-directory: kernel
        run: |
          set -e

          cat > nethunter.config <<'EOF'
          # --------------------------------------------------------
          # Bluetooth
          # --------------------------------------------------------
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y

          # --------------------------------------------------------
          # TTY / input / HID
          # --------------------------------------------------------
          CONFIG_TTY=y
          CONFIG_INPUT=y
          CONFIG_HID=y
          CONFIG_INPUT_EVDEV=y
          CONFIG_INPUT_UINPUT=y
          CONFIG_UHID=y
          CONFIG_HIDRAW=y

          # --------------------------------------------------------
          # USB gadget / HID / networking
          # --------------------------------------------------------
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_F_FS=y

          # --------------------------------------------------------
          # Networking
          # --------------------------------------------------------
          CONFIG_PACKET=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_TUN=y
          CONFIG_VETH=y

          # --------------------------------------------------------
          # Wireless framework
          # --------------------------------------------------------
          CONFIG_CFG80211=y
          CONFIG_RFKILL=y

          # --------------------------------------------------------
          # Qualcomm / Motorola sensor support
          # --------------------------------------------------------
          CONFIG_SENSORS_CLASS=y
          EOF

          echo "Created nethunter.config:"
          echo
          cat nethunter.config

      # ------------------------------------------------------------
      # 10. Configure base Bengal kernel
      # ------------------------------------------------------------
      - name: Configure base kernel
        working-directory: kernel
        run: |
          set -e

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

      # ------------------------------------------------------------
      # 11. Merge cebu configuration
      # ------------------------------------------------------------
      - name: Apply cebu configuration
        if: env.CEBU_CONFIG != ''
        working-directory: kernel
        run: |
          set -e

          scripts/kconfig/merge_config.sh \
            -m \
            -O out \
            out/.config \
            "$CEBU_CONFIG"

      # ------------------------------------------------------------
      # 12. Merge NetHunter configuration
      # ------------------------------------------------------------
      - name: Apply NetHunter configuration
        working-directory: kernel
        run: |
          set -e

          scripts/kconfig/merge_config.sh \
            -m \
            -O out \
            out/.config \
            nethunter.config

      # ------------------------------------------------------------
      # 13. Resolve Kconfig dependencies
      # ------------------------------------------------------------
      - name: Finalize configuration
        working-directory: kernel
        run: |
          set -e

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      # ------------------------------------------------------------
      # 14. Verify required options
      # ------------------------------------------------------------
      - name: Verify NetHunter configuration
        working-directory: kernel
        run: |
          set -e

          CONFIG="out/.config"
          FAILED=0

          check_y() {
            OPTION="$1"

            if grep -q "^${OPTION}=y$" "$CONFIG"; then
              echo "OK: ${OPTION}=y"
            else
              echo "FAIL: ${OPTION} is NOT built-in"
              grep -E "^# ${OPTION} is not set$|^${OPTION}=" "$CONFIG" || true
              FAILED=1
            fi
          }

          echo "========================================"
          echo "Bluetooth"
          echo "========================================"

          check_y CONFIG_BT
          check_y CONFIG_BT_BREDR
          check_y CONFIG_BT_RFCOMM
          check_y CONFIG_BT_RFCOMM_TTY
          check_y CONFIG_BT_HIDP
          check_y CONFIG_BT_HCIVHCI
          check_y CONFIG_BT_HCIUART
          check_y CONFIG_BT_HCIUART_H4

          echo
          echo "========================================"
          echo "Input / HID"
          echo "========================================"

          check_y CONFIG_TTY
          check_y CONFIG_INPUT
          check_y CONFIG_HID
          check_y CONFIG_INPUT_EVDEV
          check_y CONFIG_INPUT_UINPUT
          check_y CONFIG_UHID
          check_y CONFIG_HIDRAW

          echo
          echo "========================================"
          echo "USB gadget"
          echo "========================================"

          check_y CONFIG_USB_GADGET
          check_y CONFIG_USB_CONFIGFS
          check_y CONFIG_USB_CONFIGFS_F_HID
          check_y CONFIG_USB_CONFIGFS_NCM
          check_y CONFIG_USB_CONFIGFS_F_FS

          echo
          echo "========================================"
          echo "Networking"
          echo "========================================"

          check_y CONFIG_PACKET
          check_y CONFIG_NETFILTER
          check_y CONFIG_NETFILTER_XTABLES
          check_y CONFIG_NF_CONNTRACK
          check_y CONFIG_TUN
          check_y CONFIG_VETH

          echo
          echo "========================================"
          echo "Wireless"
          echo "========================================"

          check_y CONFIG_CFG80211
          check_y CONFIG_RFKILL

          echo
          echo "========================================"
          echo "Sensors"
          echo "========================================"

          check_y CONFIG_SENSORS_CLASS

          echo
          echo "========================================"

          if [ "$FAILED" -ne 0 ]; then
            echo "CONFIGURATION VERIFICATION FAILED"
            exit 1
          fi

          echo "ALL REQUIRED NETHUNTER OPTIONS ARE ENABLED."

      # ------------------------------------------------------------
      # 15. Save final config
      # ------------------------------------------------------------
      - name: Save final kernel config
        working-directory: kernel
        run: |
          set -e

          cp out/.config out/kernel.config

          echo "Final kernel configuration saved."

      # ------------------------------------------------------------
      # 16. Clean source generated files
      # ------------------------------------------------------------
      - name: Clean source generated files
        working-directory: kernel
        run: |
          set -e

          rm -rf include/config
          rm -rf include/generated
          rm -rf arch/arm64/include/generated

          echo "Source generated files cleaned."
          echo "out/ configuration preserved."

      # ------------------------------------------------------------
      # 17. Build kernel Image
      # ------------------------------------------------------------
      - name: Build kernel Image
        working-directory: kernel
        run: |
          set -e

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

      # ------------------------------------------------------------
      # 18. Build kernel modules
      # ------------------------------------------------------------
      - name: Build kernel modules
        working-directory: kernel
        run: |
          set -e

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules

      # ------------------------------------------------------------
      # 19. Collect build artifacts
