name: QCACLD3 Injection Prototype v15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync

      # ============================================================
      # CLONE SOURCES
      # ============================================================

      - name: Clone kernel and NetHunter reference
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$GITHUB_WORKSPACE/Kernel-Build"

          mkdir -p "$GITHUB_WORKSPACE/Kernel-Build"

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$GITHUB_WORKSPACE/Kernel-Build/kernel"

          git clone \
            --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            "$GITHUB_WORKSPACE/Kernel-Build/reference"

      # ============================================================
      # PATHS
      #
      # IMPORTANT:
      # OUT IS OUTSIDE THE KERNEL GIT TREE.
      # ============================================================

      - name: Set build paths
        shell: bash
        run: |
          set -euxo pipefail

          KERNEL="$GITHUB_WORKSPACE/Kernel-Build/kernel"
          REF="$GITHUB_WORKSPACE/Kernel-Build/reference"

          # NEVER put generated kernel output inside the Git tree.
          OUT="$GITHUB_WORKSPACE/Kernel-Build/kernel-out"

          WLAN="$KERNEL/drivers/staging/qcacld-3.0"

          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "WLAN=$WLAN" >> "$GITHUB_ENV"

          echo "KERNEL=$KERNEL"
          echo "REF=$REF"
          echo "OUT=$OUT"
          echo "WLAN=$WLAN"

      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify source trees
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL"

          test -d "$WLAN"
          test -f "$WLAN/Kbuild"

          test -d \
            "$KERNEL/drivers/staging/qca-wifi-host-cmn"

          test -d \
            "$KERNEL/drivers/staging/fw-api"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c"

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Fresh kernel tree is dirty."
            git status --short
            exit 1
          fi

          echo "Source trees verified."

      # ============================================================
      # CONFIGURE KERNEL
      #
      # Generated files are written to kernel-out/.
      # ============================================================

      - name: Configure and prepare kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL"

          export PATH="/usr/lib/llvm-14/bin:$PATH"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          echo "========================================"
          echo "DEFCONFIG"
          echo "========================================"

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          test -f "$OUT/.config"

          echo "========================================"
          echo "ENABLE QCACLD3"
          echo "========================================"

          ./scripts/config \
            --file "$OUT/.config" \
            --module CONFIG_QCA_CLD_WLAN

          echo "========================================"
          echo "OLDDEFCONFIG"
          echo "========================================"

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "========================================"
          echo "PREPARE"
          echo "========================================"

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            prepare

          echo "========================================"
          echo "MODULES PREPARE"
          echo "========================================"

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_prepare

          echo "========================================"
          echo "VERIFY CONFIG"
          echo "========================================"

          test -f "$OUT/.config"
          test -f "$OUT/include/config/auto.conf"

          grep '^CONFIG_QCA_CLD_WLAN=' \
            "$OUT/.config"

          echo
          echo "Kernel preparation successful."

      # ============================================================
      # VERIFY SOURCE TREE
      #
      # OUT is now outside the repository, so this should remain clean.
      # ============================================================

      - name: Verify kernel source remains clean
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL"

          if [ -f ".config" ]; then
            echo "ERROR: .config exists inside source tree."
            exit 1
          fi

          if [ -d "out" ]; then
            echo "ERROR: out/ exists inside source tree."
            exit 1
          fi

          STATUS="$(git status --porcelain)"

          if [ -n "$STATUS" ]; then
            echo "ERROR: Kernel source became dirty:"
            echo "$STATUS"
            exit 1
          fi

          echo "Kernel source is clean."

      # ============================================================
      # BACKUP KBUILD
      # ============================================================

      - name: Backup QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            "$WLAN/Kbuild" \
            "$WLAN/Kbuild.original"

      # ============================================================
      # IMPORT HEADERS
      # ============================================================

      - name: Import injection headers
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            "$WLAN/core/hdd/inc" \
            "$WLAN/core/hdd/src" \
            "$WLAN/core/wma/inc" \
            "$WLAN/core/wma/src"

          HEADERS=(
            "core/hdd/inc/wlan_hdd_frame_inject.h"
            "core/hdd/inc/wlan_hdd_frame_inject_debug.h"
            "core/hdd/inc/wlan_hdd_frame_inject_integration.h"
            "core/hdd/inc/wlan_hdd_frame_validate.h"
            "core/hdd/inc/wlan_hdd_inject_security.h"
            "core/wma/inc/wma_frame_inject.h"
          )

          for f in "${HEADERS[@]}"; do
            echo "IMPORT HEADER: $f"

            cp \
              "$REF/drivers/staging/qcacld-3.0/$f" \
              "$WLAN/$f"
          done

      # ============================================================
      # IMPORT SOURCES
      # ============================================================

      - name: Import injection sources
        shell: bash
        run: |
          set -euxo pipefail

          SOURCES=(
            "core/hdd/src/wlan_hdd_frame_inject.c"
            "core/hdd/src/wlan_hdd_frame_inject_debug.c"
            "core/hdd/src/wlan_hdd_frame_inject_integration.c"
            "core/hdd/src/wlan_hdd_frame_validate.c"
            "core/hdd/src/wlan_hdd_inject_security.c"
            "core/wma/src/wma_frame_inject.c"
          )

          for f in "${SOURCES[@]}"; do
            echo "IMPORT SOURCE: $f"

            cp \
              "$REF/drivers/staging/qcacld-3.0/$f" \
              "$WLAN/$f"
          done

      # ============================================================
      # VERIFY IMPORT
      # ============================================================

      - name: Verify imported injection files
        shell: bash
        run: |
          set -euxo pipefail

          missing=0

          FILES=(
            "core/hdd/inc/wlan_hdd_frame_inject.h"
            "core/hdd/inc/wlan_hdd_frame_inject_debug.h"
            "core/hdd/inc/wlan_hdd_frame_inject_integration.h"
            "core/hdd/inc/wlan_hdd_frame_validate.h"
            "core/hdd/inc/wlan_hdd_inject_security.h"
            "core/wma/inc/wma_frame_inject.h"

            "core/hdd/src/wlan_hdd_frame_inject.c"
            "core/hdd/src/wlan_hdd_frame_inject_debug.c"
            "core/hdd/src/wlan_hdd_frame_inject_integration.c"
            "core/hdd/src/wlan_hdd_frame_validate.c"
            "core/hdd/src/wlan_hdd_inject_security.c"
            "core/wma/src/wma_frame_inject.c"
          )

          for f in "${FILES[@]}"; do
            if [ -f "$WLAN/$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # ============================================================
      # AUDIT IMPORTED INCLUDES
      # ============================================================

      - name: Audit injection includes
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          {
            echo "=== INJECTION INCLUDE AUDIT ==="
            echo

            for f in \
              "$WLAN/core/hdd/src/wlan_hdd_frame_inject.c" \
              "$WLAN/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
              "$WLAN/core/hdd/src/wlan_hdd_frame_inject_integration.c" \
              "$WLAN/core/hdd/src/wlan_hdd_frame_validate.c" \
              "$WLAN/core/hdd/src/wlan_hdd_inject_security.c" \
              "$WLAN/core/wma/src/wma_frame_inject.c"
            do
              echo "========================================"
              echo "$f"
              echo "========================================"

              grep -E \
                '^[[:space:]]*#include[[:space:]]*["<]' \
                "$f" || true

              echo
            done
          } | tee reports/injection-includes.txt

      # ============================================================
      # PATCH KBUILD
      # ============================================================

      - name: Patch QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "Kernel-Build/kernel/drivers/staging/qcacld-3.0/Kbuild"
          )

          text = path.read_text()

          marker = "$(MODNAME)-y := $(OBJS)"

          if marker not in text:
              raise SystemExit(
                  "ERROR: $(MODNAME)-y := $(OBJS) not found"
              )

          if "NetHunter QCACLD3 injection prototype" in text:
              raise SystemExit(
                  "ERROR: Kbuild already patched"
              )

          block = r'''
          # ==========================================================
          # NetHunter QCACLD3 injection prototype
          # ==========================================================

          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_integration.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o

          ccflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT

          ccflags-y += -I$(src)/core/hdd/inc
          ccflags-y += -I$(src)/core/hdd/src
          ccflags-y += -I$(src)/core/wma/inc

          '''

          text = text.replace(
              marker,
              block + marker,
              1
          )

          path.write_text(text)
          PY

          echo "=== PATCHED KBUILD ==="

          grep -n \
            -A25 \
            -B3 \
            "NetHunter QCACLD3 injection prototype" \
            "$WLAN/Kbuild"

      # ============================================================
      # VERIFY KBUILD
      # ============================================================

      - name: Verify patched Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          REQUIRED=(
            "wlan_hdd_frame_inject.o"
            "wlan_hdd_frame_inject_debug.o"
            "wlan_hdd_frame_inject_integration.o"
            "wlan_hdd_frame_validate.o"
            "wlan_hdd_inject_security.o"
            "wma_frame_inject.o"
            "FEATURE_FRAME_INJECTION_SUPPORT"
            "core/hdd/inc"
            "core/wma/inc"
          )

          for item in "${REQUIRED[@]}"; do
            grep -q "$item" "$WLAN/Kbuild"
          done

          echo "Kbuild verified."

      # ============================================================
      # BUILD QCACLD3
      # ============================================================

      - name: Build QCACLD3
        shell: bash
        run: |
          set +e

          cd "$KERNEL"

          export PATH="/usr/lib/llvm-14/bin:$PATH"

          mkdir -p "$GITHUB_WORKSPACE/reports"

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            V=1 \
            M=drivers/staging/qcacld-3.0 \
            WLAN_ROOT=drivers/staging/qcacld-3.0 \
            WLAN_COMMON_ROOT=drivers/staging/qca-wifi-host-cmn \
            WLAN_COMMON_INC=drivers/staging/qca-wifi-host-cmn \
            WLAN_FW_API=drivers/staging/fw-api \
            WLAN_PROFILE=default \
            DYNAMIC_SINGLE_CHIP= \
            MODNAME=wlan \
            BOARD_PLATFORM=bengal \
            CONFIG_QCA_CLD_WLAN=m \
            modules \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/reports/build.log"

          RC=${PIPESTATUS[0]}

          echo "$RC" > \
            "$GITHUB_WORKSPACE/reports/build-exit-code.txt"

          echo "QCACLD3 build exit code: $RC"

          exit 0

      # ============================================================
      # COMPILATION DIAGNOSTICS
      # ============================================================

      - name: Extract injection compilation
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          {
            echo "=== INJECTION COMPILATION ==="
            echo

            if [ -f reports/build.log ]; then
              grep -E \
                'wlan_hdd_frame_inject\.o|wlan_hdd_frame_inject_debug\.o|wlan_hdd_frame_inject_integration\.o|wlan_hdd_frame_validate\.o|wlan_hdd_inject_security\.o|wma_frame_inject\.o' \
                reports/build.log || true

              echo
              echo "=== ERRORS ==="

              grep -E \
                'fatal error:|error:|undefined reference|No rule to make|recipe for target' \
                reports/build.log || true
            else
              echo "build.log does not exist."
            fi
          } | tee reports/injection-compile-results.txt

      # ============================================================
      # OBJECT VERIFICATION
      # ============================================================

      - name: Verify injection objects
        if: always()
        shell: bash
        run: |
          set +e

          {
            echo "=== OBJECT VERIFICATION ==="
            echo

            OBJECTS=(
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.o"
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.o"
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_integration.o"
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_validate.o"
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.o"
              "$OUT/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.o"
            )

            for f in "${OBJECTS[@]}"; do
              if [ -f "$f" ]; then
                echo "BUILT: $f"
              else
                echo "NOT BUILT: $f"
              fi
            done

            echo
            echo "=== WLAN MODULE ==="

            MOD="$OUT/drivers/staging/qcacld-3.0/wlan.ko"

            if [ -f "$MOD" ]; then
              echo "BUILT: wlan.ko"
              ls -lh "$MOD"
              file "$MOD"
            else
              echo "NOT BUILT: wlan.ko"
            fi

          } | tee reports/object-verification.txt

          exit 0

      # ============================================================
      # MODULE INSPECTION
      # ============================================================

      - name: Inspect WLAN module
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p reports

          MOD="$OUT/drivers/staging/qcacld-3.0/wlan.ko"

          {
            echo "=== WLAN MODULE INSPECTION ==="
            echo

            if [ -f "$MOD" ]; then

              file "$MOD"

              echo
              echo "=== MODINFO ==="

              modinfo "$MOD" 2>/dev/null || true

              echo
              echo "=== INJECTION SYMBOLS ==="

              llvm-nm "$MOD" 2>/dev/null | \
                grep -E \
                'wlan_hdd_frame_inject|wlan_hdd_frame_validate|wma_frame_inject|injection' \
                || true

            else
              echo "wlan.ko was not generated."
            fi

          } | tee reports/module-symbols.txt

      # ============================================================
      # CONCLUSION
      # ============================================================

      - name: Generate prototype conclusion
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          BUILD_RC="unknown"

          if [ -f reports/build-exit-code.txt ]; then
            BUILD_RC="$(cat reports/build-exit-code.txt)"
          fi

          {
            echo "QCACLD3 Injection Prototype v15"
            echo "================================"
            echo
            echo "Build exit code: ${BUILD_RC}"
            echo
            echo "Target:"
            echo "LineageOS android_kernel_motorola_sm6225"
            echo "branch: lineage-23.2"
            echo
            echo "Reference:"
            echo "V0lk3n/nethunter_kernel_oneplus_sm8150"
            echo "branch: nethunter-lineage-23.2"
            echo
            echo "Imported production components:"
            echo "  wlan_hdd_frame_inject"
            echo "  wlan_hdd_frame_inject_debug"
            echo "  wlan_hdd_frame_inject_integration"
            echo "  wlan_hdd_frame_validate"
            echo "  wlan_hdd_inject_security"
            echo "  wma_frame_inject"
            echo
            echo "This is a source compatibility prototype."
            echo "It does not establish firmware-level injection support."
          } | tee reports/conclusion.txt

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package report
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf prototype-report

          mkdir -p \
            prototype-report \
            prototype-report/imported-source \
            prototype-report/imported-headers

          cp -a \
            reports/. \
            prototype-report/ \
            2>/dev/null || true

          cp \
            "$WLAN/Kbuild.original" \
            prototype-report/Kbuild.original \
            2>/dev/null || true

          cp \
            "$WLAN/Kbuild" \
            prototype-report/Kbuild.patched \
            2>/dev/null || true

          for f in \
            wlan_hdd_frame_inject.c \
            wlan_hdd_frame_inject_debug.c \
            wlan_hdd_frame_inject_integration.c \
            wlan_hdd_frame_validate.c \
            wlan_hdd_inject_security.c
          do
            cp \
              "$WLAN/core/hdd/src/$f" \
              prototype-report/imported-source/ \
              2>/dev/null || true
          done

          cp \
            "$WLAN/core/wma/src/wma_frame_inject.c" \
            prototype-report/imported-source/ \
            2>/dev/null || true

          cp \
            "$WLAN/core/hdd/inc/"*.h \
            prototype-report/imported-headers/ \
            2>/dev/null || true

          cp \
            "$WLAN/core/wma/inc/wma_frame_inject.h" \
            prototype-report/imported-headers/ \
            2>/dev/null || true

          cd prototype-report

          zip -r \
            ../qcacld3-injection-prototype-v15.zip \
            . >/dev/null

          ls -lh \
            ../qcacld3-injection-prototype-v15.zip

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload prototype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-injection-prototype-v15
          path: qcacld3-injection-prototype-v15.zip
          if-no-files-found: error
