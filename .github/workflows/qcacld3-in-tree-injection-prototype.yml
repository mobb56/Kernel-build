name: QCACLD3 Injection Prototype v10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      OUT_DIR: ${{ github.workspace }}/kernel-out

    steps:

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync

      # ============================================================
      # SOURCE TREES
      # ============================================================

      - name: Clone LineageOS SM6225 kernel
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$KERNEL_DIR"

      - name: Clone NetHunter reference
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            reference

      - name: Show source revisions
        run: |
          echo "============================================"
          echo "MOTOROLA / LINEAGEOS KERNEL"
          echo "============================================"

          git -C "$KERNEL_DIR" log -1 --oneline

          echo
          echo "============================================"
          echo "NETHUNTER REFERENCE"
          echo "============================================"

          git -C reference log -1 --oneline

      # ============================================================
      # REPORT DIRECTORY
      # ============================================================

      - name: Initialize reports
        run: |
          mkdir -p reports

          touch \
            reports/build.log \
            reports/injection-compile-commands.txt \
            reports/injection-symbols.txt \
            reports/final-module-symbols.txt \
            reports/undefined-symbols.txt \
            reports/compiler-errors.txt \
            reports/source-inventory.txt \
            reports/kbuild-database.txt

      # ============================================================
      # COPY INJECTION IMPLEMENTATION
      # ============================================================

      - name: Copy injection sources
        run: |
          set -eux

          WLAN="$KERNEL_DIR/drivers/staging/qcacld-3.0"
          REF="$GITHUB_WORKSPACE/reference/drivers/staging/qcacld-3.0"

          mkdir -p \
            "$WLAN/core/hdd/inc" \
            "$WLAN/core/hdd/src" \
            "$WLAN/core/wma/inc" \
            "$WLAN/core/wma/src"

          # --------------------------------------------------------
          # HDD HEADERS
          # --------------------------------------------------------

          cp \
            "$REF/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "$WLAN/core/hdd/inc/"

          cp \
            "$REF/core/hdd/inc/wlan_hdd_frame_validate.h" \
            "$WLAN/core/hdd/inc/"

          cp \
            "$REF/core/hdd/inc/wlan_hdd_inject_security.h" \
            "$WLAN/core/hdd/inc/"

          # --------------------------------------------------------
          # HDD SOURCES
          # --------------------------------------------------------

          cp \
            "$REF/core/hdd/src/wlan_hdd_frame_inject.c" \
            "$WLAN/core/hdd/src/"

          cp \
            "$REF/core/hdd/src/wlan_hdd_frame_validate.c" \
            "$WLAN/core/hdd/src/"

          cp \
            "$REF/core/hdd/src/wlan_hdd_inject_security.c" \
            "$WLAN/core/hdd/src/"

          # --------------------------------------------------------
          # WMA
          # --------------------------------------------------------

          cp \
            "$REF/core/wma/inc/wma_frame_inject.h" \
            "$WLAN/core/wma/inc/"

          cp \
            "$REF/core/wma/src/wma_frame_inject.c" \
            "$WLAN/core/wma/src/"

          # ========================================================
          # V10 HEADER RESOLUTION
          #
          # The imported .c files use quoted includes:
          #
          #   #include "wlan_hdd_frame_inject.h"
          #
          # Put copies beside the source files so the compiler can
          # resolve them without depending on the parent Kbuild's
          # INCS aggregation.
          # ========================================================

          cp \
            "$WLAN/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "$WLAN/core/hdd/src/"

          cp \
            "$WLAN/core/hdd/inc/wlan_hdd_frame_validate.h" \
            "$WLAN/core/hdd/src/"

          cp \
            "$WLAN/core/hdd/inc/wlan_hdd_inject_security.h" \
            "$WLAN/core/hdd/src/"

          cp \
            "$WLAN/core/wma/inc/wma_frame_inject.h" \
            "$WLAN/core/wma/src/"

          echo
          echo "============================================"
          echo "INJECTION FILES"
          echo "============================================"

          find "$WLAN/core/hdd" "$WLAN/core/wma" \
            -type f \
            \( \
              -name '*frame_inject*' \
              -o -name '*frame_validate*' \
              -o -name '*inject_security*' \
            \) \
            -print \
            | tee reports/source-inventory.txt

      # ============================================================
      # KERNEL CONFIG
      # ============================================================

      - name: Configure kernel
        run: |
          set -eux

          mkdir -p "$OUT_DIR"

          cd "$KERNEL_DIR"

          echo "============================================"
          echo "BENGAL DEFCONFIG"
          echo "============================================"

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          echo
          echo "============================================"
          echo "ENABLE QCACLD3"
          echo "============================================"

          ./scripts/config \
            --file "$OUT_DIR/.config" \
            --module CONFIG_QCA_CLD_WLAN

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "============================================"
          echo "PREPARE KERNEL"
          echo "============================================"

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            prepare \
            modules_prepare

          echo
          echo "CONFIG_QCA_CLD_WLAN:"
          grep '^CONFIG_QCA_CLD_WLAN=' \
            "$OUT_DIR/.config"

          test -f \
            "$OUT_DIR/include/config/auto.conf"

      # ============================================================
      # BACKUP KBUILD
      # ============================================================

      - name: Backup original Kbuild
        run: |
          set -eux

          KBUILD="$KERNEL_DIR/drivers/staging/qcacld-3.0/Kbuild"

          test -f "$KBUILD"

          cp \
            "$KBUILD" \
            "$KBUILD.v10-original"

      # ============================================================
      # PATCH KBUILD
      # ============================================================

      - name: Patch QCACLD3 Kbuild
        run: |
          set -eux

          KBUILD="$KERNEL_DIR/drivers/staging/qcacld-3.0/Kbuild"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "kernel/drivers/staging/qcacld-3.0/Kbuild"
          )

          s = p.read_text()

          if "NETHUNTER_INJECTION_V10" in s:
              raise SystemExit(
                  "v10 patch already exists"
              )

          marker = "ccflags-y += $(INCS)"

          if marker not in s:
              raise SystemExit(
                  "Could not find ccflags-y += $(INCS)"
              )

          patch = r'''
          #
          # ==========================================================
          # NETHUNTER_INJECTION_V10
          # ==========================================================
          #

          # Feature macro used by the imported injection source.
          cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT

          #
          # Add injection objects directly to the final composite
          # object list.
          #
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o

          #
          # Explicit include directories as an additional safeguard.
          #
          ccflags-y += -I$(srctree)/$(WLAN_ROOT)/core/hdd/inc
          ccflags-y += -I$(srctree)/$(WLAN_ROOT)/core/hdd/src
          ccflags-y += -I$(srctree)/$(WLAN_ROOT)/core/wma/inc

          #
          # ==========================================================
          # END NETHUNTER_INJECTION_V10
          # ==========================================================
          #
          '''

          s = s.replace(
              marker,
              patch + "\n" + marker,
              1
          )

          p.write_text(s)

          PY

          echo
          echo "============================================"
          echo "PATCHED KBUILD"
          echo "============================================"

          grep -n -A35 -B5 \
            "NETHUNTER_INJECTION_V10" \
            "$KBUILD"

      # ============================================================
      # VERIFY KBUILD
      # ============================================================

      - name: Verify Kbuild injection entries
        run: |
          set -eux

          KBUILD="$KERNEL_DIR/drivers/staging/qcacld-3.0/Kbuild"

          grep -F \
            'OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o' \
            "$KBUILD"

          grep -F \
            'OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o' \
            "$KBUILD"

          grep -F \
            'OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o' \
            "$KBUILD"

          grep -F \
            'OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o' \
            "$KBUILD"

          grep -F \
            'FEATURE_FRAME_INJECTION_SUPPORT' \
            "$KBUILD"

          echo
          echo "Kbuild injection entries verified."

      # ============================================================
      # VERIFY HEADERS BESIDE SOURCES
      # ============================================================

      - name: Verify local injection headers
        run: |
          set -eux

          WLAN="$KERNEL_DIR/drivers/staging/qcacld-3.0"

          test -f \
            "$WLAN/core/hdd/src/wlan_hdd_frame_inject.h"

          test -f \
            "$WLAN/core/hdd/src/wlan_hdd_frame_validate.h"

          test -f \
            "$WLAN/core/hdd/src/wlan_hdd_inject_security.h"

          test -f \
            "$WLAN/core/wma/src/wma_frame_inject.h"

          echo "All local injection headers exist."

      # ============================================================
      # BUILD QCACLD3
      # ============================================================

      - name: Build QCACLD3
        id: build_qcacld3
        run: |
          set -o pipefail

          cd "$KERNEL_DIR"

          echo "============================================"
          echo "BUILDING QCACLD3"
          echo "============================================"

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            M=drivers/staging/qcacld-3.0 \
            modules \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/reports/build.log"

      # ============================================================
      # EXTRACT INJECTION COMPILATION
      # ============================================================

      - name: Extract injection compile commands
        if: always()
        run: |
          set -eux

          LOG="$GITHUB_WORKSPACE/reports/build.log"
          OUT="$GITHUB_WORKSPACE/reports/injection-compile-commands.txt"

          : > "$OUT"

          if [ -f "$LOG" ]; then
            grep -E \
              'wlan_hdd_frame_inject\.o|wlan_hdd_frame_validate\.o|wlan_hdd_inject_security\.o|wma_frame_inject\.o' \
              "$LOG" \
              > "$OUT" \
              || true
          fi

          echo
          echo "============================================"
          echo "INJECTION COMPILE COMMANDS"
          echo "============================================"

          cat "$OUT" || true

      # ============================================================
      # VERIFY ALL FOUR OBJECTS
      # ============================================================

      - name: Verify injection objects compiled
        if: success()
        run: |
          set -eux

          FILE="$GITHUB_WORKSPACE/reports/injection-compile-commands.txt"

          for obj in \
            wlan_hdd_frame_inject.o \
            wlan_hdd_frame_validate.o \
            wlan_hdd_inject_security.o \
            wma_frame_inject.o
          do

            echo
            echo "Checking: $obj"

            if ! grep -F "$obj" "$FILE" >/dev/null; then
              echo
              echo "ERROR: $obj was not compiled."
              exit 1
            fi

          done

          echo
          echo "============================================"
          echo "ALL FOUR INJECTION OBJECTS COMPILED"
          echo "============================================"

      # ============================================================
      # VERIFY FINAL MODULE
      # ============================================================

      - name: Verify wlan objects
        if: always()
        run: |
          set -eux

          OBJ="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.o"
          MOD="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.ko"

          echo "=== wlan.o ==="

          if [ -f "$OBJ" ]; then
            ls -lh "$OBJ"
          else
            echo "wlan.o not present"
          fi

          echo
          echo "=== wlan.ko ==="

          if [ -f "$MOD" ]; then
            ls -lh "$MOD"
          else
            echo "wlan.ko not present"
          fi

      # ============================================================
      # SYMBOL INSPECTION
      # ============================================================

      - name: Inspect injection symbols
        if: always()
        run: |
          set -eux

          OBJ="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.o"
          MOD="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.ko"

          : > reports/injection-symbols.txt
          : > reports/final-module-symbols.txt

          if [ -f "$OBJ" ]; then

            llvm-nm "$OBJ" \
              | grep -E \
                'wlan_hdd_frame_inject|wlan_hdd_frame_validate|wlan_hdd_inject_security|wma_frame_inject' \
              > reports/injection-symbols.txt \
              || true

          fi

          if [ -f "$MOD" ]; then

            llvm-nm "$MOD" \
              | grep -E \
                'wlan_hdd_frame_inject|wlan_hdd_frame_validate|wlan_hdd_inject_security|wma_frame_inject' \
              > reports/final-module-symbols.txt \
              || true

          fi

          echo
          echo "============================================"
          echo "wlan.o INJECTION SYMBOLS"
          echo "============================================"

          cat reports/injection-symbols.txt

          echo
          echo "============================================"
          echo "wlan.ko INJECTION SYMBOLS"
          echo "============================================"

          cat reports/final-module-symbols.txt

      # ============================================================
      # UNDEFINED SYMBOLS
      # ============================================================

      - name: Inspect undefined symbols
        if: always()
        run: |
          set -eux

          MOD="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.ko"

          : > reports/undefined-symbols.txt

          if [ -f "$MOD" ]; then

            llvm-nm -u "$MOD" \
              > reports/undefined-symbols.txt \
              || true

          fi

          echo
          echo "============================================"
          echo "UNDEFINED SYMBOLS"
          echo "============================================"

          cat reports/undefined-symbols.txt

      # ============================================================
      # KBUILD DATABASE
      # ============================================================

      - name: Dump Kbuild database
        if: always()
        run: |
          set -eux

          cd "$KERNEL_DIR"

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            M=drivers/staging/qcacld-3.0 \
            -pn \
            > "$GITHUB_WORKSPACE/reports/kbuild-database.txt" \
            2>/dev/null \
            || true

          echo
          echo "============================================"
          echo "INJECTION OBJECTS IN KBUILD DATABASE"
          echo "============================================"

          grep -E \
            'wlan_hdd_frame_inject|wlan_hdd_frame_validate|wlan_hdd_inject_security|wma_frame_inject' \
            "$GITHUB_WORKSPACE/reports/kbuild-database.txt" \
            | head -150 \
            || true

      # ============================================================
      # COMPILER ERRORS
      # ============================================================

      - name: Extract compiler errors
        if: always()
        run: |
          set -eux

          : > reports/compiler-errors.txt

          if [ -f reports/build.log ]; then

            grep -E \
              'error:|fatal error:|undefined reference|No rule to make target|recipe commences before first target' \
              reports/build.log \
              > reports/compiler-errors.txt \
              || true

          fi

          echo
          echo "============================================"
          echo "COMPILER ERRORS"
          echo "============================================"

          cat reports/compiler-errors.txt

      # ============================================================
      # SAVE CONFIG
      # ============================================================

      - name: Save kernel config
        if: always()
        run: |
          if [ -f "$OUT_DIR/.config" ]; then
            cp \
              "$OUT_DIR/.config" \
              reports/kernel.config
          fi

      # ============================================================
      # PACKAGE REPORT
      # ============================================================

      - name: Package v10 report
        if: always()
        run: |
          set -eux

          rm -rf qcacld3-v10-report

          mkdir -p qcacld3-v10-report

          cp -a \
            reports/. \
            qcacld3-v10-report/

          KBUILD="$KERNEL_DIR/drivers/staging/qcacld-3.0/Kbuild"

          if [ -f "$KBUILD" ]; then
            cp \
              "$KBUILD" \
              qcacld3-v10-report/Kbuild.modified
          fi

          if [ -f "$KBUILD.v10-original" ]; then
            cp \
              "$KBUILD.v10-original" \
              qcacld3-v10-report/Kbuild.original
          fi

          MOD="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.ko"
          OBJ="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.o"

          if [ -f "$MOD" ]; then
            cp "$MOD" qcacld3-v10-report/
          fi

          if [ -f "$OBJ" ]; then
            cp "$OBJ" qcacld3-v10-report/
          fi

          tar \
            -czf \
            qcacld3-injection-v10-report.tar.gz \
            qcacld3-v10-report

          echo
          echo "============================================"
          echo "REPORT CREATED"
          echo "============================================"

          ls -lh \
            qcacld3-injection-v10-report.tar.gz

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload v10 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-injection-v10-report
          path: qcacld3-injection-v10-report.tar.gz
          if-no-files-found: error

      # ============================================================
      # FINAL
      # ============================================================

      - name: Final result
        if: always()
        run: |
          echo
          echo "================================================"
          echo "QCACLD3 INJECTION PROTOTYPE V10"
          echo "================================================"

          echo
          echo "=== INJECTION COMPILE COMMANDS ==="
          cat reports/injection-compile-commands.txt || true

          echo
          echo "=== INJECTION SYMBOLS ==="
          cat reports/injection-symbols.txt || true

          echo
          echo "=== COMPILER ERRORS ==="
          cat reports/compiler-errors.txt || true

          echo
          echo "================================================"
