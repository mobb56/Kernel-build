name: QCACLD3 Injection Prototype v5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            python3 \
            rsync \
            ripgrep

      - name: Clone LineageOS SM6225 kernel
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            kernel

      - name: Clone NetHunter reference
        run: |
          git clone --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            reference

      - name: Prepare directories
        run: |
          rm -rf out report
          mkdir -p out report

      - name: Generate kernel configuration
        run: |
          set -e

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

      - name: Enable QCACLD3
        run: |
          set -e

          ./kernel/scripts/config \
            --file out/.config \
            --module CONFIG_QCA_CLD_WLAN

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          grep '^CONFIG_QCA_CLD_WLAN=' out/.config

          test "$(grep '^CONFIG_QCA_CLD_WLAN=' out/.config)" = \
            "CONFIG_QCA_CLD_WLAN=m"

      - name: Prepare kernel
        run: |
          set -e

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            prepare

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules_prepare

          test -f out/include/config/auto.conf
          test -f out/include/config/auto.conf.cmd

      - name: Verify integrated Qualcomm trees
        run: |
          set -e

          test -d kernel/drivers/staging/qcacld-3.0
          test -d kernel/drivers/staging/qca-wifi-host-cmn
          test -d kernel/drivers/staging/fw-api

          test -f \
            kernel/drivers/staging/qca-wifi-host-cmn/qdf/inc/qdf_nbuf.h

          test -f \
            kernel/drivers/staging/fw-api/fw/athdefs.h

          echo "QCACLD3: OK"
          echo "QDF: OK"
          echo "FW API: OK"

      - name: Copy injection implementation
        run: |
          set -e

          K="$PWD/kernel/drivers/staging/qcacld-3.0"
          R="$PWD/reference/drivers/staging/qcacld-3.0"

          mkdir -p \
            "$K/core/wma/inc" \
            "$K/core/wma/src" \
            "$K/core/hdd/inc" \
            "$K/core/hdd/src"

          # WMA
          cp "$R/core/wma/inc/wma_frame_inject.h" \
             "$K/core/wma/inc/"

          cp "$R/core/wma/src/wma_frame_inject.c" \
             "$K/core/wma/src/"

          # HDD frame injection
          cp "$R/core/hdd/inc/wlan_hdd_frame_inject.h" \
             "$K/core/hdd/inc/"

          cp "$R/core/hdd/src/wlan_hdd_frame_inject.c" \
             "$K/core/hdd/src/"

          # Frame validation
          cp "$R/core/hdd/inc/wlan_hdd_frame_validate.h" \
             "$K/core/hdd/inc/"

          cp "$R/core/hdd/src/wlan_hdd_frame_validate.c" \
             "$K/core/hdd/src/"

          # Injection security layer
          cp "$R/core/hdd/inc/wlan_hdd_inject_security.h" \
             "$K/core/hdd/inc/"

          cp "$R/core/hdd/src/wlan_hdd_inject_security.c" \
             "$K/core/hdd/src/"

      - name: Verify injection source closure
        run: |
          set -e

          K="kernel/drivers/staging/qcacld-3.0"

          files="
          core/wma/inc/wma_frame_inject.h
          core/wma/src/wma_frame_inject.c
          core/hdd/inc/wlan_hdd_frame_inject.h
          core/hdd/src/wlan_hdd_frame_inject.c
          core/hdd/inc/wlan_hdd_frame_validate.h
          core/hdd/src/wlan_hdd_frame_validate.c
          core/hdd/inc/wlan_hdd_inject_security.h
          core/hdd/src/wlan_hdd_inject_security.c
          "

          for f in $files; do
            test -f "$K/$f"
            echo "FOUND: $f"
          done

      - name: Add injection objects and include paths
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "kernel/drivers/staging/qcacld-3.0/Kbuild"
          )

          text = p.read_text()

          marker = (
              "ccflags-y += $(INCS)"
          )

          if marker not in text:
              raise SystemExit(
                  "Could not find ccflags-y INCS marker"
              )

          additions = """
          # NetHunter QCACLD3 injection prototype
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o

          ccflags-y += -I $(srctree)/$(WLAN_ROOT)/$(HDD_INC_DIR)
          ccflags-y += -I $(srctree)/$(WLAN_ROOT)/$(HDD_SRC_DIR)
          ccflags-y += -I $(srctree)/$(WLAN_ROOT)/core/wma/inc

          cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT

          """

          if "wlan_hdd_frame_inject.o" not in text:
              text = text.replace(
                  marker,
                  additions + marker,
                  1
              )

          p.write_text(text)
          PY

      - name: Verify Kbuild changes
        run: |
          set -e

          K="kernel/drivers/staging/qcacld-3.0/Kbuild"

          echo "=== Injection objects ==="

          grep -n -E \
            'wlan_hdd_frame_inject\.o|wlan_hdd_frame_validate\.o|wlan_hdd_inject_security\.o|wma_frame_inject\.o' \
            "$K"

          echo
          echo "=== Injection include paths ==="

          grep -n -E \
            'core/wma/inc|HDD_INC_DIR|HDD_SRC_DIR' \
            "$K" \
            | tail -n 20

          echo
          echo "=== Feature define ==="

          grep -n \
            'FEATURE_FRAME_INJECTION_SUPPORT' \
            "$K"

      - name: Compile QCACLD3
        id: build
        continue-on-error: true
        run: |
          set -o pipefail

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            M=drivers/staging/qcacld-3.0 \
            V=1 \
            modules \
            2>&1 | tee report/qcacld3-build.log

      - name: Capture compiler diagnostics
        if: always()
        run: |
          {
            echo "=== Fatal errors ==="

            grep -n -C 7 \
              "fatal error" \
              report/qcacld3-build.log || true

            echo
            echo "=== Compiler errors ==="

            grep -n -C 6 \
              "error:" \
              report/qcacld3-build.log || true

            echo
            echo "=== Missing headers ==="

            grep -n \
              "file not found" \
              report/qcacld3-build.log || true

            echo
            echo "=== Implicit declarations ==="

            grep -n -C 3 \
              "implicit declaration" \
              report/qcacld3-build.log || true

            echo
            echo "=== Incompatible declarations ==="

            grep -n -C 3 \
              "incompatible" \
              report/qcacld3-build.log || true

            echo
            echo "=== Undefined symbols ==="

            grep -n -E \
              "undefined|UNDEFINED" \
              report/qcacld3-build.log || true

          } > report/compiler-diagnostics.txt

      - name: Record compiler stages
        if: always()
        run: |
          {
            echo "=== CC ==="

            grep -E \
              '(^|[[:space:]])CC[[:space:]]' \
              report/qcacld3-build.log \
              | head -n 500 || true

            echo
            echo "=== LD ==="

            grep -E \
              '(^|[[:space:]])LD[[:space:]]' \
              report/qcacld3-build.log \
              | head -n 200 || true

            echo
            echo "=== MODPOST ==="

            grep -n \
              "MODPOST" \
              report/qcacld3-build.log || true

          } > report/build-stages.txt

      - name: Find injection objects
        if: always()
        run: |
          {
            find kernel out \
              -type f \
              \( \
                -name 'wma_frame_inject.o' \
                -o -name 'wlan_hdd_frame_inject.o' \
                -o -name 'wlan_hdd_frame_validate.o' \
                -o -name 'wlan_hdd_inject_security.o' \
              \) \
              -print || true
          } > report/injection-objects.txt

      - name: Find WLAN module
        if: always()
        run: |
          {
            find kernel out \
              -type f \
              \( \
                -name 'wlan.ko' \
                -o -name 'qca_cld3_wlan.ko' \
              \) \
              -print || true

            echo
            echo "All modules:"
            find kernel out \
              -type f \
              -name '*.ko' \
              -print || true

          } > report/modules.txt

      - name: Final conclusion
        if: always()
        run: |
          {
            echo "=== QCACLD3 Injection Prototype v5 ==="
            echo

            echo "CONFIG:"
            grep '^CONFIG_QCA_CLD_WLAN=' \
              out/.config || true

            echo
            echo "=== Injection objects ==="

            find kernel out \
              -type f \
              \( \
                -name 'wma_frame_inject.o' \
                -o -name 'wlan_hdd_frame_inject.o' \
                -o -name 'wlan_hdd_frame_validate.o' \
                -o -name 'wlan_hdd_inject_security.o' \
              \) \
              -print || true

            echo
            echo "=== WLAN module ==="

            find kernel out \
              -type f \
              \( \
                -name 'wlan.ko' \
                -o -name 'qca_cld3_wlan.ko' \
              \) \
              -print || true

          } > report/CONCLUSION.txt

      - name: Package report
        if: always()
        run: |
          mkdir -p artifact
          cp -r report artifact/

          cd artifact
          zip -r ../qcacld3-injection-v5-report.zip .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-injection-v5-report
          path: qcacld3-injection-v5-report.zip
          if-no-files-found: error
