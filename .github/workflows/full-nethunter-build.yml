name: Moto G9 Power cebu NetHunter

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  KERNEL_BRANCH: lineage-23.2

  NETHUNTER_REPO: https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git
  NETHUNTER_BRANCH: nethunter-lineage-23.2

  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_BRANCH: master

  LLVM_DIR: /usr/lib/llvm-14
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out

jobs:
  build:
    name: Moto G9 Power cebu NetHunter
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang-14 \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            zip

          echo "Installed compiler:"
          clang-14 --version

          echo "Installed linker:"
          ld.lld-14 --version

          echo "Installed cross compiler:"
          aarch64-linux-gnu-gcc --version

      # ============================================================
      # 3. MAKE LLVM 14 AVAILABLE TO ALL LATER STEPS
      # ============================================================

      - name: Configure LLVM 14
        shell: bash
        run: |
          set -euxo pipefail

          test -d "${LLVM_DIR}/bin"

          test -x "${LLVM_DIR}/bin/clang"
          test -x "${LLVM_DIR}/bin/ld.lld"
          test -x "${LLVM_DIR}/bin/llvm-ar"
          test -x "${LLVM_DIR}/bin/llvm-nm"
          test -x "${LLVM_DIR}/bin/llvm-objcopy"

          # Persist PATH across GitHub Actions steps.
          echo "${LLVM_DIR}/bin" >> "${GITHUB_PATH}"

          export PATH="${LLVM_DIR}/bin:${PATH}"

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy

          clang --version
          ld.lld --version
          llvm-ar --version

      # ============================================================
      # 4. CLONE MOTOROLA KERNEL
      # ============================================================

      - name: Clone Motorola kernel
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          git -C kernel rev-parse HEAD
          git -C kernel status --short

      # ============================================================
      # 5. CLONE NETHUNTER QCACLD3 REFERENCE
      # ============================================================

      - name: Clone NetHunter QCACLD3 reference
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${NETHUNTER_BRANCH}" \
            "${NETHUNTER_REPO}" \
            nethunter-reference

          R="nethunter-reference/drivers/staging/qcacld-3.0"

          test -f \
            "${R}/core/hdd/src/wlan_hdd_frame_inject.c"

          test -f \
            "${R}/core/hdd/src/wlan_hdd_frame_validate.c"

          test -f \
            "${R}/core/hdd/src/wlan_hdd_inject_security.c"

          test -f \
            "${R}/core/hdd/src/wlan_hdd_frame_inject_debug.c"

          test -f \
            "${R}/core/wma/src/wma_frame_inject.c"

          test -f \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject.h"

          test -f \
            "${R}/core/hdd/inc/wlan_hdd_frame_validate.h"

          test -f \
            "${R}/core/hdd/inc/wlan_hdd_inject_security.h"

          test -f \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject_debug.h"

          test -f \
            "${R}/core/wma/inc/wma_frame_inject.h"

          echo "NetHunter QCACLD3 reference verified."

      # ============================================================
      # 6. CLONE ANYKERNEL3
      # ============================================================

      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${ANYKERNEL_BRANCH}" \
            "${ANYKERNEL_REPO}" \
            AnyKernel3

          test -f AnyKernel3/anykernel.sh
          test -f AnyKernel3/tools/ak3-core.sh

      # ============================================================
      # 7. VERIFY SOURCES
      # ============================================================

      - name: Verify source trees
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            kernel/arch/arm64/configs/vendor/bengal-perf_defconfig

          test -f \
            kernel/drivers/staging/qcacld-3.0/Kbuild

          test -f \
            kernel/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h

          test -f \
            kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c

          echo "Motorola source tree verified."

      # ============================================================
      # 8. PREPARE BUILD OUTPUT
      # ============================================================

      - name: Prepare output
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          rm -rf "${OUT_DIR}"

          mkdir -p "${OUT_DIR}"

      # ============================================================
      # 9. GENERATE BASE DEFCONFIG
      #
      # Capture the clean release BEFORE making source changes.
      # ============================================================

      - name: Generate base configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            vendor/bengal-perf_defconfig

          CLEAN_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          test -n "${CLEAN_RELEASE}"

          case "${CLEAN_RELEASE}" in
            *-dirty)
              echo "ERROR: clean base release is already dirty."
              exit 1
              ;;
          esac

          echo "CLEAN_RELEASE=${CLEAN_RELEASE}" >> "${GITHUB_ENV}"

          echo "Clean release:"
          echo "${CLEAN_RELEASE}"

      # ============================================================
      # 10. CREATE NETHUNTER KERNEL CONFIG
      #
      # IMPORTANT:
      # Do NOT put CONFIG_FEATURE_MONITOR_MODE_SUPPORT or
      # CONFIG_FEATURE_FRAME_INJECTION_SUPPORT here.
      # Those are QCACLD3 Kbuild variables.
      # ============================================================

      - name: Create NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p kernel/nethunter-config

          cat > kernel/nethunter-config/cebu-nethunter.config <<'EOF'
          # ============================================================
          # Moto G9 Power cebu NetHunter
          # ============================================================

          # ------------------------------------------------------------
          # HID
          # ------------------------------------------------------------

          CONFIG_HIDRAW=y
          CONFIG_UHID=y

          # ------------------------------------------------------------
          # Bluetooth
          # ------------------------------------------------------------

          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y

          CONFIG_BT_RFCOMM=m
          CONFIG_BT_RFCOMM_TTY=y

          CONFIG_BT_BNEP=m

          CONFIG_BT_HIDP=m

          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y

          CONFIG_BT_HCIBTUSB=m

          CONFIG_BT_HCIVHCI=m

          # ------------------------------------------------------------
          # USB gadget
          # ------------------------------------------------------------

          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y

          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_EEM=y

          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y

          # ------------------------------------------------------------
          # USB serial/network
          # ------------------------------------------------------------

          CONFIG_USB_ACM=m
          CONFIG_USB_SERIAL=m
          CONFIG_USB_SERIAL_GENERIC=y

          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_NET_RNDIS_HOST=m

          CONFIG_USB_RTL8150=m
          CONFIG_USB_RTL8152=m

          # ------------------------------------------------------------
          # Sensors
          # ------------------------------------------------------------

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m

          # ------------------------------------------------------------
          # Qualcomm WLAN
          # ------------------------------------------------------------

          CONFIG_QCA_CLD_WLAN=m

          # ------------------------------------------------------------
          # Networking
          # ------------------------------------------------------------

          CONFIG_PACKET=y

          EOF

          test -s \
            kernel/nethunter-config/cebu-nethunter.config

          cat \
            kernel/nethunter-config/cebu-nethunter.config

      # ============================================================
      # 11. MERGE CONFIGURATION
      #
      # olddefconfig happens BEFORE final LOCALVERSION changes.
      # We intentionally do NOT run olddefconfig afterward.
      # ============================================================

      - name: Merge NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          scripts/kconfig/merge_config.sh \
            -m \
            -O "${OUT_DIR}" \
            "${OUT_DIR}/.config" \
            nethunter-config/cebu-nethunter.config

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig

          BASE_VERSION="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelversion
          )"

          RELEASE_SUFFIX="${CLEAN_RELEASE#${BASE_VERSION}}"

          echo "Base version:   ${BASE_VERSION}"
          echo "Clean release:  ${CLEAN_RELEASE}"
          echo "Release suffix: ${RELEASE_SUFFIX}"

          test -n "${RELEASE_SUFFIX}"

          # Disable Git automatic localversion handling.
          scripts/config \
            --file "${OUT_DIR}/.config" \
            --disable LOCALVERSION_AUTO

          # Preserve the exact clean kernel release.
          scripts/config \
            --file "${OUT_DIR}/.config" \
            --set-str LOCALVERSION "${RELEASE_SUFFIX}"

          # ----------------------------------------------------------
          # IMPORTANT:
          # No olddefconfig after this point.
          # ----------------------------------------------------------

          AUTO_STATE="$(
            scripts/config \
              --file "${OUT_DIR}/.config" \
              --state LOCALVERSION_AUTO
          )"

          LOCAL_STATE="$(
            scripts/config \
              --file "${OUT_DIR}/.config" \
              --state LOCALVERSION
          )"

          echo "LOCALVERSION_AUTO state: ${AUTO_STATE}"
          echo "LOCALVERSION state:      ${LOCAL_STATE}"

          test "${AUTO_STATE}" = "n"

          test "${LOCAL_STATE}" = "${RELEASE_SUFFIX}"

          CONFIG_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          echo "Configured release: ${CONFIG_RELEASE}"

          test "${CONFIG_RELEASE}" = "${CLEAN_RELEASE}"

      # ============================================================
      # 12. VERIFY KERNEL CONFIG
      # ============================================================

      - name: Verify important configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          check_config() {
            symbol="$1"
            expected="$2"

            actual="$(
              scripts/config \
                --file "${CONFIG}" \
                --state "${symbol}"
            )"

            echo "${symbol}: ${actual}"

            test "${actual}" = "${expected}" || {
              echo "ERROR: ${symbol} expected ${expected}, got ${actual}"
              exit 1
            }
          }

          check_config HIDRAW y
          check_config UHID y

          check_config BT y
          check_config BT_BREDR y
          check_config BT_LE y
          check_config BT_RFCOMM m
          check_config BT_BNEP m
          check_config BT_HIDP m
          check_config BT_HCIUART m
          check_config BT_HCIVHCI m

          check_config USB_GADGET y
          check_config USB_CONFIGFS y
          check_config USB_CONFIGFS_NCM y
          check_config USB_CONFIGFS_RNDIS y
          check_config USB_CONFIGFS_ECM y
          check_config USB_CONFIGFS_EEM y
          check_config USB_CONFIGFS_F_HID y

          check_config USB_ACM m
          check_config USB_SERIAL m
          check_config USB_SERIAL_GENERIC y
          check_config USB_USBNET y
          check_config USB_NET_CDCETHER m
          check_config USB_NET_CDC_NCM m
          check_config USB_NET_RNDIS_HOST m

          check_config USB_RTL8150 m
          check_config USB_RTL8152 m

          check_config SENSORS_SSC y
          check_config SENSORS_CLASS m

          check_config QCA_CLD_WLAN m

          check_config LOCALVERSION_AUTO n

          LOCAL_STATE="$(
            scripts/config \
              --file "${CONFIG}" \
              --state LOCALVERSION
          )"

          BASE_VERSION="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelversion
          )"

          RELEASE_SUFFIX="${CLEAN_RELEASE#${BASE_VERSION}}"

          test "${LOCAL_STATE}" = "${RELEASE_SUFFIX}"

          # These are intentionally NOT kernel .config symbols.
          if grep -Eq \
            '^CONFIG_FEATURE_(MONITOR_MODE_SUPPORT|FRAME_INJECTION_SUPPORT)=' \
            "${CONFIG}"; then

            echo "ERROR: QCACLD3 Kbuild feature was incorrectly placed in .config."
            exit 1
          fi

          echo "Kernel configuration verification passed."

      # ============================================================
      # 13. IMPORT QCACLD3 INJECTION SOURCES
      # ============================================================

      - name: Import QCACLD3 injection framework
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0"
          R="nethunter-reference/drivers/staging/qcacld-3.0"

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_inject.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_validate.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_inject_security.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/wma/src/wma_frame_inject.c" \
            "${K}/core/wma/src/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_validate.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_inject_security.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject_debug.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/wma/inc/wma_frame_inject.h" \
            "${K}/core/wma/inc/"

          echo "QCACLD3 injection framework imported."

      # ============================================================
      # 14. ADD INJECTION CONTEXT
      # ============================================================

      - name: Add injection context to Motorola HDD
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/"
              "core/hdd/inc/wlan_hdd_main.h"
          )

          text = path.read_text()

          if "struct hdd_injection_ctx;" not in text:
              marker = "struct hdd_adapter {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: struct hdd_adapter marker not found."
                  )

              text = text.replace(
                  marker,
                  "struct hdd_injection_ctx;\n\n" + marker,
                  1
              )

          if "struct hdd_injection_ctx *injection_ctx;" not in text:
              marker = (
                  "\tqdf_atomic_t net_dev_hold_ref_count"
                  "[NET_DEV_HOLD_ID_MAX];\n"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: net_dev_hold_ref_count marker not found."
                  )

              addition = """\tqdf_atomic_t net_dev_hold_ref_count[NET_DEV_HOLD_ID_MAX];

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              struct hdd_injection_ctx *injection_ctx;
          #endif
          """

              text = text.replace(
                  marker,
                  addition,
                  1
              )

          path.write_text(text)

          print("Injection context added.")
          PY

      # ============================================================
      # 15. FIX MOTOROLA 4.19 CREDENTIAL COMPATIBILITY
      #
      # Replace the whole function instead of searching for a
      # particular internal block.
      # ============================================================

      - name: Fix 4.19 credential compatibility
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/"
              "core/hdd/src/wlan_hdd_inject_security.c"
          )

          text = path.read_text()

          match = re.search(
              r"\bQDF_STATUS\s+"
              r"hdd_check_injection_capability\s*\([^;]*\)\s*\{",
              text,
              re.S
          )

          if not match:
              raise SystemExit(
                  "ERROR: hdd_check_injection_capability() not found."
              )

          start = match.start()
          brace_start = text.find("{", match.start(), match.end())

          if brace_start < 0:
              raise SystemExit(
                  "ERROR: injection capability function brace not found."
              )

          depth = 0
          i = brace_start
          in_line_comment = False
          in_block_comment = False
          in_string = False
          in_char = False
          escape = False

          end = None

          while i < len(text):
              c = text[i]
              n = text[i + 1] if i + 1 < len(text) else ""

              if in_line_comment:
                  if c == "\n":
                      in_line_comment = False

              elif in_block_comment:
                  if c == "*" and n == "/":
                      in_block_comment = False
                      i += 1

              elif in_string:
                  if escape:
                      escape = False
                  elif c == "\\":
                      escape = True
                  elif c == '"':
                      in_string = False

              elif in_char:
                  if escape:
                      escape = False
                  elif c == "\\":
                      escape = True
                  elif c == "'":
                      in_char = False

              else:
                  if c == "/" and n == "/":
                      in_line_comment = True
                      i += 1
                  elif c == "/" and n == "*":
                      in_block_comment = True
                      i += 1
                  elif c == '"':
                      in_string = True
                  elif c == "'":
                      in_char = True
                  elif c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              i += 1

          if end is None:
              raise SystemExit(
                  "ERROR: could not find end of injection capability function."
              )

          replacement = r'''QDF_STATUS hdd_check_injection_capability(
              struct task_struct *task)
          {
              bool has_capability;

              (void)task;

              hdd_security_debug(
                  "Checking injection capabilities");

              has_capability = capable(CAP_NET_RAW);

              if (!has_capability) {
                  hdd_security_debug(
                      "Process lacks CAP_NET_RAW capability");

                  return QDF_STATUS_E_PERM;
              }

              hdd_security_debug(
                  "Process has CAP_NET_RAW capability");

              return QDF_STATUS_SUCCESS;
          }'''

          new_text = text[:start] + replacement + text[end:]

          path.write_text(new_text)

          print("4.19 credential compatibility patched.")
          PY

          grep -Fq \
            "capable(CAP_NET_RAW)" \
            kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c

          echo "Credential compatibility verified."

      # ============================================================
      # 16. INTEGRATE INJECTION LIFECYCLE
      # ============================================================

      - name: Integrate injection lifecycle
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/"
              "core/hdd/src/wlan_hdd_main.c"
          )

          text = path.read_text()

          # ----------------------------------------------------------
          # Include
          # ----------------------------------------------------------

          if '#include "wlan_hdd_frame_inject.h"' not in text:
              marker = '#include "wlan_hdd_rx_monitor.h"\n'

              if marker not in text:
                  raise SystemExit(
                      "ERROR: wlan_hdd_rx_monitor.h marker not found."
                  )

              replacement = (
                  '#include "wlan_hdd_rx_monitor.h"\n'
                  '#ifdef FEATURE_FRAME_INJECTION_SUPPORT\n'
                  '#include "wlan_hdd_frame_inject.h"\n'
                  '#endif\n'
              )

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          # ----------------------------------------------------------
          # Init
          # ----------------------------------------------------------

          if "hdd_init_frame_injection(adapter)" not in text:
              marker = (
                  "\thdd_periodic_sta_stats_init(adapter);\n"
                  "\n"
                  "\treturn adapter;"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: adapter init marker not found."
                  )

              replacement = """\thdd_periodic_sta_stats_init(adapter);

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              if (QDF_STATUS_SUCCESS !=
                  hdd_init_frame_injection(adapter)) {
                  hdd_err(
                      "Failed to initialize frame injection for adapter");
                  /* Continue without frame injection support */
              }
          #endif

              return adapter;"""

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          # ----------------------------------------------------------
          # Cleanup
          # ----------------------------------------------------------

          if "hdd_deinit_frame_injection(adapter)" not in text:
              marker = (
                  "\thdd_adapter_feature_update_work_deinit(adapter);\n"
                  "\thdd_cleanup_adapter(hdd_ctx, adapter, rtnl_held);"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: adapter cleanup marker not found."
                  )

              replacement = """\thdd_adapter_feature_update_work_deinit(adapter);

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              hdd_deinit_frame_injection(adapter);
          #endif

              hdd_cleanup_adapter(hdd_ctx, adapter, rtnl_held);"""

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          path.write_text(text)

          print("Injection lifecycle integrated.")
          PY

      # ============================================================
      # 17. PATCH QCACLD3 KBUILD
      #
      # Feature variables are defined early so the existing Motorola
      # monitor-mode object selection sees them.
      # ============================================================

      - name: Patch QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/Kbuild"
          )

          text = path.read_text()

          # ----------------------------------------------------------
          # Define QCACLD3 feature variables EARLY.
          # ----------------------------------------------------------

          marker = (
              "CONFIG_QCA_CLD_WLAN_PROFILE ?= $(WLAN_PROFILE)\n"
          )

          feature_defs = """CONFIG_QCA_CLD_WLAN_PROFILE ?= $(WLAN_PROFILE)

          # NetHunter QCACLD3 frame injection
          CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y

          # Enable monitor-mode objects required by frame injection.
          CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y
          """

          if (
              "CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y"
              not in text
          ):
              if marker not in text:
                  raise SystemExit(
                      "ERROR: Kbuild feature insertion marker not found."
                  )

              text = text.replace(
                  marker,
                  feature_defs + "\n",
                  1
              )

          # ----------------------------------------------------------
          # HDD objects
          # ----------------------------------------------------------

          if "wlan_hdd_frame_inject.o" not in text:
              anchor = (
                  "\t\t$(HDD_SRC_DIR)/wlan_hdd_wowl.o"
              )

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: HDD object anchor not found."
                  )

              replacement = """\t\t$(HDD_SRC_DIR)/wlan_hdd_wowl.o

          # NetHunter QCACLD3 frame injection objects
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o
          """

              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          # ----------------------------------------------------------
          # WMA object
          # ----------------------------------------------------------

          if "wma_frame_inject.o" not in text:
              anchor = "\t\t$(WMA_NDP_OBJS)"

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: WMA object anchor not found."
                  )

              replacement = """\t\t$(WMA_NDP_OBJS)

          # NetHunter QCACLD3 frame injection
          WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o
          """

              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          # ----------------------------------------------------------
          # Frame injection preprocessor define.
          #
          # The existing monitor-mode logic will see the variable
          # defined above and enable FEATURE_MONITOR_MODE_SUPPORT.
          # ----------------------------------------------------------

          if "cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT" not in text:
              marker = (
                  "#Enable NL80211 test mode\n"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: NL80211 Kbuild marker not found."
                  )

              injection_define = """ifeq ($(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT), y)
          cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT
          endif

          """

              text = text.replace(
                  marker,
                  injection_define + marker,
                  1
              )

          path.write_text(text)

          print("QCACLD3 Kbuild patched.")
          PY

      # ============================================================
      # 18. VERIFY QCACLD3 KBUILD
      # ============================================================

      - name: Verify QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0/Kbuild"

          grep -Fq \
            "CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y" \
            "${K}"

          grep -Fq \
            "CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y" \
            "${K}"

          grep -Fq \
            "cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT" \
            "${K}"

          grep -Fq \
            "wlan_hdd_frame_inject.o" \
            "${K}"

          grep -Fq \
            "wlan_hdd_frame_validate.o" \
            "${K}"

          grep -Fq \
            "wlan_hdd_inject_security.o" \
            "${K}"

          grep -Fq \
            "wlan_hdd_frame_inject_debug.o" \
            "${K}"

          grep -Fq \
            "wma_frame_inject.o" \
            "${K}"

          echo "QCACLD3 Kbuild verification passed."

      # ============================================================
      # 19. VERIFY SOURCE ADAPTATION
      # ============================================================

      - name: Verify source adaptation
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0"

          test -f \
            "${K}/core/hdd/src/wlan_hdd_frame_inject.c"

          test -f \
            "${K}/core/hdd/src/wlan_hdd_frame_validate.c"

          test -f \
            "${K}/core/hdd/src/wlan_hdd_inject_security.c"

          test -f \
            "${K}/core/hdd/src/wlan_hdd_frame_inject_debug.c"

          test -f \
            "${K}/core/wma/src/wma_frame_inject.c"

          test -f \
            "${K}/core/hdd/inc/wlan_hdd_frame_inject.h"

          test -f \
            "${K}/core/hdd/inc/wlan_hdd_frame_validate.h"

          test -f \
            "${K}/core/hdd/inc/wlan_hdd_inject_security.h"

          test -f \
            "${K}/core/hdd/inc/wlan_hdd_frame_inject_debug.h"

          test -f \
            "${K}/core/wma/inc/wma_frame_inject.h"

          grep -Fq \
            "struct hdd_injection_ctx *injection_ctx;" \
            "${K}/core/hdd/inc/wlan_hdd_main.h"

          grep -Fq \
            "hdd_init_frame_injection(adapter)" \
            "${K}/core/hdd/src/wlan_hdd_main.c"

          grep -Fq \
            "hdd_deinit_frame_injection(adapter)" \
            "${K}/core/hdd/src/wlan_hdd_main.c"

          grep -Fq \
            "capable(CAP_NET_RAW)" \
            "${K}/core/hdd/src/wlan_hdd_inject_security.c"

          echo "Source adaptation verification passed."

      # ============================================================
      # 20. BUILD KERNEL + MODULES
      # ============================================================

      - name: Build kernel and modules
        shell: bash
        run: |
          set -o pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          BUILD_LOG="${GITHUB_WORKSPACE}/kernel-build.log"

          echo "LLVM tools:"
          command -v clang
          command -v ld.lld
          command -v llvm-ar

          if ! make -j2 \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            Image \
            modules \
            2>&1 | tee "${BUILD_LOG}"; then

            echo
            echo "============================================================"
            echo "KERNEL BUILD FAILED - LAST 250 LINES"
            echo "============================================================"

            tail -n 250 "${BUILD_LOG}"

            exit 1
          fi

      # ============================================================
      # 21. VERIFY FINAL KERNEL RELEASE
      # ============================================================

      - name: Verify kernel release
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          BUILT_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          echo "Expected release:"
          echo "${CLEAN_RELEASE}"

          echo "Built release:"
          echo "${BUILT_RELEASE}"

          test "${BUILT_RELEASE}" = "${CLEAN_RELEASE}"

          case "${BUILT_RELEASE}" in
            *-dirty)
              echo "ERROR: dirty release detected."
              exit 1
              ;;
          esac

          echo "Kernel release verification passed."

      # ============================================================
      # 22. VERIFY IMAGE
      # ============================================================

      - name: Verify Image
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="kernel/out/arch/arm64/boot/Image"

          test -f "${IMAGE}"

          SIZE="$(stat -c%s "${IMAGE}")"

          echo "Image size: ${SIZE}"

          test "${SIZE}" -gt 10000000

          file "${IMAGE}"

      # ============================================================
      # 23. INSTALL MODULES
      # ============================================================

      - name: Install modules
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          rm -rf \
            "${GITHUB_WORKSPACE}/module-install"

          mkdir -p \
            "${GITHUB_WORKSPACE}/module-install"

          export PATH="${LLVM_DIR}/bin:${PATH}"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            INSTALL_MOD_PATH="${GITHUB_WORKSPACE}/module-install" \
            modules_install

          find \
            "${GITHUB_WORKSPACE}/module-install" \
            -type f \
            -name '*.ko' \
            -print

      # ============================================================
      # 24. VERIFY WLAN MODULE
      # ============================================================

      - name: Verify wlan.ko
        shell: bash
        run: |
          set -euxo pipefail

          WLAN_MODULE="$(
            find module-install \
              -type f \
              -name "wlan.ko" \
              -print -quit
          )"

          test -n "${WLAN_MODULE}"

          echo "WLAN module:"
          echo "${WLAN_MODULE}"

          VERMAGIC="$(
            modinfo \
              -F vermagic \
              "${WLAN_MODULE}"
          )"

          echo "WLAN vermagic:"
          echo "${VERMAGIC}"

          echo "${VERMAGIC}" | \
            grep -Fq "${CLEAN_RELEASE}"

      # ============================================================
      # 25. VERIFY NETHUNTER MODULES
      # ============================================================

      - name: Verify NetHunter modules
        shell: bash
        run: |
          set -euxo pipefail

          required_modules=(
            hci_vhci.ko
            hci_uart.ko
            hidp.ko
            rfcomm.ko
            bnep.ko
          )

          for module in "${required_modules[@]}"; do

            found="$(
              find module-install \
                -type f \
                -name "${module}" \
                -print -quit
            )"

            if [ -z "${found}" ]; then
              echo "ERROR: missing ${module}"
              exit 1
            fi

            echo "Found ${module}: ${found}"

          done

      # ============================================================
      # 26. CHECK MODPOST / UNDEFINED WLAN SYMBOLS
      # ============================================================

      - name: Check WLAN undefined symbols
        shell: bash
        run: |
          set -euxo pipefail

          if grep -E \
            'ERROR: "[^"]+" \[[^]]*wlan\.ko\] undefined!' \
            kernel-build.log; then

            echo "ERROR: wlan.ko contains undefined symbols."
            exit 1
          fi

          if grep -E \
            'undefined!$' \
            kernel-build.log; then

            echo "ERROR: undefined symbols detected."
            exit 1
          fi

          grep -Fq \
            "LD [M] drivers/staging/qcacld-3.0/wlan.ko" \
            kernel-build.log

          echo "WLAN MODPOST verification passed."

      # ============================================================
      # 27. STAGE FINAL MODULES
      # ============================================================

      - name: Prepare NetHunter modules
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf module-stage

          mkdir -p \
            module-stage/vendor/lib/modules

          WLAN_MODULE="$(
            find module-install \
              -type f \
              -name "wlan.ko" \
              -print -quit
          )"

          test -n "${WLAN_MODULE}"

          # Match the stock Moto cebu Qualcomm WLAN filename.
          cp \
            "${WLAN_MODULE}" \
            module-stage/vendor/lib/modules/qca_cld3_wlan.ko

          # ----------------------------------------------------------
          # Bluetooth
          # ----------------------------------------------------------

          for name in \
            bluetooth.ko \
            hci_uart.ko \
            hci_vhci.ko \
            hidp.ko \
            rfcomm.ko \
            bnep.ko \
            hid.ko \
            hid_generic.ko
          do

            found="$(
              find module-install \
                -type f \
                -name "${name}" \
                -print -quit
            )"

            if [ -n "${found}" ]; then
              cp \
                "${found}" \
                module-stage/vendor/lib/modules/
            fi
          done

          # ----------------------------------------------------------
          # USB / networking
          # ----------------------------------------------------------

          for name in \
            cdc_acm.ko \
            usbserial.ko \
            cdc_ether.ko \
            cdc_ncm.ko \
            rndis_host.ko \
            r8150.ko \
            r8152.ko
          do

            found="$(
              find module-install \
                -type f \
                -name "${name}" \
                -print -quit
            )"

            if [ -n "${found}" ]; then
              cp \
                "${found}" \
                module-stage/vendor/lib/modules/
            fi
          done

          # ----------------------------------------------------------
          # Sensor class
          # ----------------------------------------------------------

          found="$(
            find module-install \
              -type f \
              -name "sensors_class.ko" \
              -print -quit
          )"

          if [ -n "${found}" ]; then
            cp \
              "${found}" \
              module-stage/vendor/lib/modules/
          fi

          # ----------------------------------------------------------
          # Required final files
          # ----------------------------------------------------------

          test -f \
            module-stage/vendor/lib/modules/qca_cld3_wlan.ko

          test -f \
            module-stage/vendor/lib/modules/hci_vhci.ko

          test -f \
            module-stage/vendor/lib/modules/hidp.ko

          echo
          echo "Final staged modules:"
          find \
            module-stage/vendor/lib/modules \
            -type f \
            -name '*.ko' \
            -printf '%f\n' | sort

      # ============================================================
      # 28. SAVE CONFIG / BUILD MANIFEST
      # ============================================================

      - name: Save build information
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            kernel/out/.config \
            final-kernel.config

          cp \
            kernel/nethunter-config/cebu-nethunter.config \
            nethunter-config-used.config

          cat > build-manifest.txt <<EOF
          Device: Motorola Moto G9 Power
          Codename: cebu
          ROM base: LineageOS 23.2
          Kernel branch: ${KERNEL_BRANCH}
          Kernel release: ${CLEAN_RELEASE}
          Architecture: ${ARCH}
          LLVM: 14
          QCACLD3 frame injection sources: imported
          QCACLD3 frame injection Kbuild: enabled
          QCACLD3 monitor-mode Kbuild: enabled
          HID/HIDRAW/UHID: enabled
          Bluetooth HID/VHCI: enabled
          USB gadget/networking: enabled
          Sensor compatibility: enabled
          EOF

          cat build-manifest.txt

      # ============================================================
      # 29. PREPARE ANYKERNEL3
      # ============================================================

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            kernel/out/arch/arm64/boot/Image \
            AnyKernel3/Image

          rm -rf \
            AnyKernel3/modules

          mkdir -p \
            AnyKernel3/modules

          cp -a \
            module-stage/vendor \
            AnyKernel3/modules/

          test -f \
            AnyKernel3/Image

          test -f \
            AnyKernel3/modules/vendor/lib/modules/qca_cld3_wlan.ko

      # ============================================================
      # 30. CONFIGURE ANYKERNEL3
      # ============================================================

      - name: Configure AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cat > AnyKernel3/anykernel.sh <<'EOF'
          #!/sbin/sh

          properties() { '
          kernel.string=Moto G9 Power cebu NetHunter
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=cebu
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          # Boot partition.
          BLOCK=/dev/block/bootdevice/by-name/boot;

          # Moto cebu uses A/B slots.
          IS_SLOT_DEVICE=1;

          # Preserve detected boot image compression.
          RAMDISK_COMPRESSION=auto;

          # Let AnyKernel3 handle AVBv2 automatically.
          PATCH_VBMETA_FLAG=auto;

          # Import AnyKernel3 functions.
          . tools/ak3-core.sh;

          # Use the existing boot image as the base.
          dump_boot;

          # Write the new kernel into the existing boot image.
          write_boot;
          EOF

          chmod 0755 \
            AnyKernel3/anykernel.sh

          grep -Fq \
            "device.name1=cebu" \
            AnyKernel3/anykernel.sh

          grep -Fq \
            "BLOCK=/dev/block/bootdevice/by-name/boot" \
            AnyKernel3/anykernel.sh

          grep -Fq \
            "IS_SLOT_DEVICE=1" \
            AnyKernel3/anykernel.sh

          grep -Fq \
            "dump_boot" \
            AnyKernel3/anykernel.sh

          grep -Fq \
            "write_boot" \
            AnyKernel3/anykernel.sh

      # ============================================================
      # 31. BUILD FLASHABLE ZIP
      # ============================================================

      - name: Build AnyKernel3 ZIP
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          cd AnyKernel3

          rm -f \
            ../artifacts/moto-g9-power-cebu-nethunter-flashable.zip

          zip -r9 \
            ../artifacts/moto-g9-power-cebu-nethunter-flashable.zip \
            . \
            -x ".git/*" \
            -x "README.md" \
            -x "*placeholder"

          cd ..

          test -s \
            artifacts/moto-g9-power-cebu-nethunter-flashable.zip

          unzip -t \
            artifacts/moto-g9-power-cebu-nethunter-flashable.zip

      # ============================================================
      # 32. VERIFY FINAL ZIP
      # ============================================================

      - name: Verify final package
        shell: bash
        run: |
          set -euxo pipefail

          ZIP="artifacts/moto-g9-power-cebu-nethunter-flashable.zip"

          unzip -l "${ZIP}"

          unzip -l "${ZIP}" | \
            grep -Fq "Image"

          unzip -l "${ZIP}" | \
            grep -Fq \
            "modules/vendor/lib/modules/qca_cld3_wlan.ko"

          unzip -l "${ZIP}" | \
            grep -Fq \
            "modules/vendor/lib/modules/hci_vhci.ko"

          unzip -l "${ZIP}" | \
            grep -Fq \
            "modules/vendor/lib/modules/hidp.ko"

          echo "Final AnyKernel3 package verification passed."

      # ============================================================
      # 33. CHECKSUMS
      # ============================================================

      - name: Generate checksums
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum \
            artifacts/moto-g9-power-cebu-nethunter-flashable.zip \
            kernel/out/arch/arm64/boot/Image \
            final-kernel.config \
            nethunter-config-used.config \
            > artifacts/SHA256SUMS.txt

          cat artifacts/SHA256SUMS.txt

      # ============================================================
      # 34. PREPARE ARTIFACTS
      # ============================================================

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            kernel/out/arch/arm64/boot/Image \
            artifacts/Image

          cp \
            final-kernel.config \
            artifacts/final-kernel.config

          cp \
            nethunter-config-used.config \
            artifacts/nethunter-config-used.config

          cp \
            kernel-build.log \
            artifacts/kernel-build.log

          cp \
            build-manifest.txt \
            artifacts/build-manifest.txt

      # ============================================================
      # 35. UPLOAD
      # ============================================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 36. COMPLETE
      # ============================================================

      - name: Complete build
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Moto G9 Power cebu NetHunter build completed"
          echo "============================================================"
          echo
          echo "Kernel release:"
          echo "${CLEAN_RELEASE}"
          echo
          echo "Flashable ZIP:"
          echo "moto-g9-power-cebu-nethunter-flashable.zip"
          echo
          echo "============================================================"
