            echo "  ATTR_FRAME_DATA = ${ATTR_FRAME_DATA}"
            echo "  ATTR_FRAME_LEN  = ${ATTR_FRAME_LEN}"
            echo "  ATTR_VDEV_ID    = ${ATTR_VDEV_ID}"
            echo
            echo "Runtime modules:"
            ls -1 "${RUNTIME}" | sort
            echo
            echo "Kernel SHA256:"
            sha256sum "${ART}/Image"
          } > "${ART}/MANIFEST.txt"

          (cd "$ART" && find . -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum) > "${ART}/SHA256SUMS"

      - name: Upload verified kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cebu-nethunter-verified-kernel
          path: artifacts/nethunter-cebu
          if-no-files-found: error
          retention-days: 30
