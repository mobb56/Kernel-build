          test "${R}" = "${EXPECTED_RELEASE}"

          W="${OUT_DIR}/drivers/staging/qcacld-3.0/wlan.ko"
          test -s "$W"
          ls -lh "$W"

          for o in \
            core/hdd/src/wlan_hdd_frame_inject.o \
            core/hdd/src/wlan_hdd_frame_validate.o \
            core/hdd/src/wlan_hdd_inject_security.o \
            core/hdd/src/wlan_hdd_frame_inject_debug.o \
            core/wma/src/wma_frame_inject.o
          do
            test -s "${OUT_DIR}/drivers/staging/qcacld-3.0/${o}" || {
              echo "MISSING: $o"; exit 1; }
          done

          grep -q 'NETHUNTER_MONITOR_VDEV_EXCEPTION' \
            drivers/staging/qcacld-3.0/components/cmn_services/policy_mgr/src/wlan_policy_mgr_action.c
          grep -q 'NETHUNTER_MONITOR_NETDEV_OPS' \
            drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c

          echo "All verification checks passed."

      - name: Verify module ABI
        shell: bash
        run: |
          set -euo pipefail
          EXP="${EXPECTED_RELEASE} SMP preempt mod_unload modversions aarch64"
          COUNT=0
          while IFS= read -r ko; do
            COUNT=$((COUNT + 1))
            v="$("${LLVM_BIN}/llvm-readelf" -p .modinfo "$ko" 2>/dev/null \
              | sed -n 's/.*vermagic=//p' | head -n1 | tr -d '\r')"
            [ -z "$v" ] && v="$(modinfo -F vermagic "$ko" 2>/dev/null || true)"
            if [ -z "$v" ]; then
              echo "FAIL: no vermagic in $ko"; exit 1
            fi
            if [ "$v" != "$EXP" ]; then
              echo "MISMATCH: $ko"
              echo "  expected: $EXP"
              echo "  actual:   $v"
              exit 1
            fi
          done < <(find "${OUT_DIR}" -type f -name '*.ko' | sort)
          echo "Verified ${COUNT} modules."

      - name: Package artifacts
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          ART="${GITHUB_WORKSPACE}/artifacts/nethunter-cebu"
          MOD="${ART}/modules"
          RUNTIME="${ART}/runtime/vendor/lib/modules"
          OUT="${GITHUB_WORKSPACE}/kernel/out"

          rm -rf "$ART"
          mkdir -p "$ART" "$MOD" "$RUNTIME" "$ART/abi"

          cp -f "${OUT}/arch/arm64/boot/Image" "${ART}/Image"
          cp -f "${OUT}/.config" "${ART}/abi/final.config"
          cp -f "${OUT}/Module.symvers" "${ART}/abi/Module.symvers"
          cp -f "${OUT}/System.map" "${ART}/abi/System.map"
          [ -f "${OUT}/stock-before-nethunter.config" ] && \
            cp -f "${OUT}/stock-before-nethunter.config" "${ART}/abi/stock.config"

          find "${OUT}" -type f -name '*.ko' -print | while read -r ko; do
            rel="${ko#${OUT}/}"
            mkdir -p "${MOD}/$(dirname "${rel}")"
            cp -f "$ko" "${MOD}/${rel}"
          done

          cp -f "${OUT}/drivers/staging/qcacld-3.0/wlan.ko" "${RUNTIME}/qca_cld3_wlan.ko"

          for pair in \
            "net/bluetooth/bnep/bnep.ko:bnep.ko" \
            "net/bluetooth/hidp/hidp.ko:hidp.ko" \
            "drivers/bluetooth/hci_uart.ko:hci_uart.ko" \
            "drivers/bluetooth/hci_vhci.ko:hci_vhci.ko" \
            "drivers/usb/class/cdc-acm.ko:cdc-acm.ko" \
            "drivers/net/usb/usbnet.ko:usbnet.ko" \
            "drivers/net/usb/cdc_ether.ko:cdc_ether.ko" \
            "drivers/net/usb/cdc_ncm.ko:cdc_ncm.ko"
          do
            s="${pair%%:*}"; d="${pair##*:}"
            if [ -s "${OUT}/${s}" ]; then
              cp -f "${OUT}/${s}" "${RUNTIME}/${d}"
            else
              echo "WARN: missing ${s}"
            fi
          done

          mkdir -p "${ART}/tools"
          cp -f "${GITHUB_WORKSPACE}/tools/cebu_cesium_inject" "${ART}/tools/" 2>/dev/null || true
          cp -f "${GITHUB_WORKSPACE}/tools/cebu_cesium_inject.c" "${ART}/tools/" 2>/dev/null || true

          {
            echo "Device: Moto G9 Power (cebu)"
            echo "Kernel release: ${EXPECTED_RELEASE}"
            echo "Flashable boot image: NO"
            echo "AnyKernel3: NO"
            echo
            echo "Cesium attribute IDs:"
            echo "  ATTR_FRAME_DATA = ${ATTR_FRAME_DATA}"
            echo "  ATTR_FRAME_LEN  = ${ATTR_FRAME_LEN}"
            echo "  ATTR_VDEV_ID    = ${ATTR_VDEV_ID}"
            echo
            echo "Runtime modules:"
            ls -1 "${RUNTIME}" | sort
            echo
            echo "Kernel SHA256:"
            sha256sum "${ART}/Image"
          } > "${ART}/MANIFEST.txt"

          (cd "$ART" && find . -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum) > "${ART}/SHA256SUMS"

      - name: Upload verified kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cebu-nethunter-verified-kernel
          path: artifacts/nethunter-cebu
          if-no-files-found: error
          retention-days: 30
