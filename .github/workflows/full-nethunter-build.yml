              inserted = 0
            }

            {
              if (!inserted && $0 ~ /^#include[[:space:]]+/) {
                print "#include \"../inc/wlan_hdd_frame_inject.h\""
                inserted = 1
              }

              print
            }

            END {
              if (!inserted) {
                exit 1
              }
            }
          ' "${MAIN_C}" > "${TMP_C}"

          test -s "${TMP_C}"
          mv "${TMP_C}" "${MAIN_C}"

          echo
          echo "=== Verifying HDD injection API include ==="

          grep -n -F \
            '#include "../inc/wlan_hdd_frame_inject.h"' \
