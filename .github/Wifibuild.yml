          done

          # depmod metadata
          DEP="${ART}/.depmod"
          rm -rf "$DEP"
          mkdir -p "${DEP}/lib/modules/${EXPECTED_RELEASE}"
          cp -f "${RUNTIME}"/*.ko "${DEP}/lib/modules/${EXPECTED_RELEASE}/" 2>/dev/null || true
          : > "${DEP}/lib/modules/${EXPECTED_RELEASE}/modules.order"
