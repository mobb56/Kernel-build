name: QCACLD3 Injection Prototype v6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync

      - name: Checkout kernel
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            kernel

      - name: Checkout NetHunter reference
        run: |
          git clone --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            reference

      - name: Show source versions
        run: |
          echo "=== KERNEL ==="
          git -C kernel log -1 --oneline

          echo "=== REFERENCE ==="
          git -C reference log -1 --oneline

      - name: Copy production injection sources
        run: |
          set -eux

          WLAN="kernel/drivers/staging/qcacld-3.0"
          REF="reference/drivers/staging/qcacld-3.0"

          mkdir -p "$WLAN/core/hdd/inc"
          mkdir -p "$WLAN/core/hdd/src"
          mkdir -p "$WLAN/core/wma/inc"
          mkdir -p "$WLAN/core/wma/src"

          cp "$REF/core/hdd/inc/wlan_hdd_frame_inject.h" \
             "$WLAN/core/hdd/inc/"

          cp "$REF/core/hdd/inc/wlan_hdd_frame_validate.h" \
             "$WLAN/core/hdd/inc/"

          cp "$REF/core/hdd/inc/wlan_hdd_inject_security.h" \
             "$WLAN/core/hdd/inc/"

          cp "$REF/core/hdd/src/wlan_hdd_frame_inject.c" \
             "$WLAN/core/hdd/src/"

          cp "$REF/core/hdd/src/wlan_hdd_frame_validate.c" \
             "$WLAN/core/hdd/src/"

          cp "$REF/core/hdd/src/wlan_hdd_inject_security.c" \
             "$WLAN/core/hdd/src/"

          cp "$REF/core/wma/inc/wma_frame_inject.h" \
             "$WLAN/core/wma/inc/"

          cp "$REF/core/wma/src/wma_frame_inject.c" \
             "$WLAN/core/wma/src/"

          echo "=== COPIED INJECTION FILES ==="
          find "$WLAN/core/hdd" "$WLAN/core/wma" \
            -type f \
            \( \
              -name '*frame_inject*' \
              -o -name '*frame_validate*' \
              -o -name '*inject_security*' \
            \) \
            -print

      - name: Configure kernel
        run: |
          set -eux

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="/usr/lib/llvm-14/bin:$PATH"

          mkdir -p out

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_QCA_CLD_WLAN

          ./scripts/config \
            --file out/.config \
            --module CONFIG_QCA_CLD_WLAN

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            prepare \
            modules_prepare

          grep '^CONFIG_QCA_CLD_WLAN=' out/.config

      - name: Patch QCACLD3 Kbuild
        run: |
          set -eux

          KBUILD="kernel/drivers/staging/qcacld-3.0/Kbuild"

          cp "$KBUILD" "$KBUILD.v6-original"

          python3 <<'PY'
          from pathlib import Path

          p = Path("kernel/drivers/staging/qcacld-3.0/Kbuild")
          s = p.read_text()

          marker = "ccflags-y += $(INCS)"

          if marker not in s:
              raise SystemExit(
                  "Could not find the existing ccflags-y += $(INCS) marker"
              )

          injection = r'''
          # ============================================================
          # NetHunter QCACLD3 frame injection prototype
          # ============================================================

          ccflags-y += -I$(src)/core/hdd/inc
          ccflags-y += -I$(src)/core/hdd/src
          ccflags-y += -I$(src)/core/wma/inc

          ccflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT

          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o

          WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o

          # ============================================================
          # End NetHunter QCACLD3 frame injection prototype
          # ============================================================
          '''

          if "wlan_hdd_frame_inject.o" in s:
              raise SystemExit(
                  "Injection objects already present in Kbuild"
              )

          s = s.replace(
              marker,
              injection + "\n" + marker,
              1
          )

          p.write_text(s)
          PY

          echo "=== INJECTION KBUILD SECTION ==="
          grep -n -A30 -B5 \
            'NetHunter QCACLD3 frame injection prototype' \
            "$KBUILD"

      - name: Verify Kbuild object assignments
        run: |
          set -eux

          KBUILD="kernel/drivers/staging/qcacld-3.0/Kbuild"

          for obj in \
            "wlan_hdd_frame_inject.o" \
            "wlan_hdd_frame_validate.o" \
            "wlan_hdd_inject_security.o" \
            "wma_frame_inject.o"
          do
            grep -F "$obj" "$KBUILD"
          done

      - name: Build QCACLD3
        run: |
          set -o pipefail

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="/usr/lib/llvm-14/bin:$PATH"

          mkdir -p reports

          make \
            -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            M=drivers/staging/qcacld-3.0 \
            modules \
            2>&1 | tee reports/build.log

      - name: Verify injection objects were compiled
        run: |
          set -eux

          LOG="reports/build.log"

          echo "=== INJECTION COMPILE COMMANDS ==="

          grep -E \
            'wlan_hdd_frame_inject\.o|wlan_hdd_frame_validate\.o|wlan_hdd_inject_security\.o|wma_frame_inject\.o' \
            "$LOG" \
            | tee reports/injection-compile-commands.txt

          for obj in \
            "wlan_hdd_frame_inject.o" \
            "wlan_hdd_frame_validate.o" \
            "wlan_hdd_inject_security.o" \
            "wma_frame_inject.o"
          do
            if ! grep -F "$obj" "$LOG" >/dev/null; then
              echo "ERROR: $obj was NOT compiled."
              exit 1
            fi
          done

          echo "All four injection objects were compiled."

      - name: Verify composite module object
        run: |
          set -eux

          echo "=== QCACLD3 OUTPUT ==="

          find out/drivers/staging/qcacld-3.0 \
            -maxdepth 2 \
            -type f \
            \( \
              -name 'wlan.o' \
              -o -name 'wlan.ko' \
              -o -name '*.mod.c' \
              -o -name '*.mod' \
            \) \
            -print

          test -f \
            out/drivers/staging/qcacld-3.0/wlan.o

          test -f \
            out/drivers/staging/qcacld-3.0/wlan.ko

      - name: Inspect linked wlan.o
        run: |
          set -eux

          WLAN_OBJ="out/drivers/staging/qcacld-3.0/wlan.o"

          llvm-nm "$WLAN_OBJ" \
            | grep -E \
              'wlan_hdd_frame_inject|wlan_hdd_frame_validate|wlan_hdd_inject_security|wma_frame_inject' \
            | tee reports/injection-symbols.txt

      - name: Verify injection symbols
        run: |
          set -eux

          SYMBOLS="reports/injection-symbols.txt"

          if ! grep -E 'wlan_hdd_frame_inject' "$SYMBOLS"; then
            echo "ERROR: wlan_hdd_frame_inject symbols absent"
            exit 1
          fi

          if ! grep -E 'wlan_hdd_frame_validate' "$SYMBOLS"; then
            echo "ERROR: wlan_hdd_frame_validate symbols absent"
            exit 1
          fi

          if ! grep -E 'wlan_hdd_inject_security' "$SYMBOLS"; then
            echo "ERROR: wlan_hdd_inject_security symbols absent"
            exit 1
          fi

          if ! grep -E 'wma_frame_inject' "$SYMBOLS"; then
            echo "ERROR: wma_frame_inject symbols absent"
            exit 1
          fi

          echo "Injection objects are linked into wlan.o."

      - name: Inspect final module
        run: |
          set -eux

          MOD="out/drivers/staging/qcacld-3.0/wlan.ko"

          modinfo "$MOD" \
            | tee reports/modinfo.txt || true

          llvm-nm "$MOD" \
            | grep -E \
              'wlan_hdd_frame_inject|wlan_hdd_frame_validate|wlan_hdd_inject_security|wma_frame_inject' \
            | tee reports/final-module-symbols.txt

      - name: Check unresolved symbols
        run: |
          set -eux

          MOD="out/drivers/staging/qcacld-3.0/wlan.ko"

          echo "=== UNDEFINED SYMBOLS ==="

          llvm-nm -u "$MOD" \
            | tee reports/undefined-symbols.txt

      - name: Generate source inventory
        if: always()
        run: |
          mkdir -p reports

          find kernel/drivers/staging/qcacld-3.0 \
            -type f \
            \( \
              -name '*frame_inject*' \
              -o -name '*frame_validate*' \
              -o -name '*inject_security*' \
            \) \
            -print \
            > reports/injection-source-inventory.txt

          echo "=== SOURCE INVENTORY ==="
          cat reports/injection-source-inventory.txt

      - name: Package prototype report
        if: always()
        run: |
          set -eux

          mkdir -p qcacld3-v6-report

          cp -a reports \
            qcacld3-v6-report/

          cp kernel/drivers/staging/qcacld-3.0/Kbuild \
            qcacld3-v6-report/Kbuild.modified

          cp kernel/drivers/staging/qcacld-3.0/Kbuild.v6-original \
            qcacld3-v6-report/Kbuild.original

          if [ -f out/drivers/staging/qcacld-3.0/wlan.ko ]; then
            cp out/drivers/staging/qcacld-3.0/wlan.ko \
              qcacld3-v6-report/
          fi

          if [ -f out/drivers/staging/qcacld-3.0/wlan.o ]; then
            cp out/drivers/staging/qcacld-3.0/wlan.o \
              qcacld3-v6-report/
          fi

          cp out/.config \
            qcacld3-v6-report/kernel.config

          tar -czf \
            qcacld3-injection-v6-report.tar.gz \
            qcacld3-v6-report

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-injection-v6-report
          path: qcacld3-injection-v6-report.tar.gz
          if-no-files-found: error

      - name: Final result
        if: always()
        run: |
          echo "================================================"
          echo "QCACLD3 INJECTION PROTOTYPE V6"
          echo "================================================"

          if [ -f reports/injection-symbols.txt ]; then
            echo "Injection symbols:"
            cat reports/injection-symbols.txt
          else
            echo "Injection symbols were not generated."
          fi
