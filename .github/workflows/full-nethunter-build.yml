name: Moto G9 Power cebu NetHunter

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  KERNEL_BRANCH: lineage-23.2

  NETHUNTER_REPO: https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git
  NETHUNTER_BRANCH: nethunter-lineage-23.2

  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_BRANCH: master

  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out

  LLVM_DIR: /usr/lib/llvm-14

  LOCALVERSION: ""

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang-14 \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            zip

          clang-14 --version
          ld.lld-14 --version
          llvm-strip-14 --version
          aarch64-linux-gnu-gcc --version


                - name: Clone kernel source
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          test -d kernel
          test -f kernel/Makefile

          echo "Kernel source cloned successfully."

      - name: Clone NetHunter reference
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${NETHUNTER_BRANCH}" \
            "${NETHUNTER_REPO}" \
            nethunter-reference

          test -d nethunter-reference
          test -d nethunter-reference/kernel

          echo "NetHunter reference cloned successfully."

      - name: Clone AnyKernel3 reference
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${ANYKERNEL_BRANCH}" \
            "${ANYKERNEL_REPO}" \
            AnyKernel3

          test -d AnyKernel3
          test -f AnyKernel3/tools/ak3-core.sh

          echo "AnyKernel3 reference cloned successfully."

      - name: Prepare LLVM toolchain
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${LLVM_DIR}/bin"

          ln -sf /usr/bin/clang-14 \
            "${LLVM_DIR}/bin/clang"

          ln -sf /usr/bin/ld.lld-14 \
            "${LLVM_DIR}/bin/ld.lld"

          ln -sf /usr/bin/llvm-ar-14 \
            "${LLVM_DIR}/bin/llvm-ar"

          ln -sf /usr/bin/llvm-nm-14 \
            "${LLVM_DIR}/bin/llvm-nm"

          ln -sf /usr/bin/llvm-objcopy-14 \
            "${LLVM_DIR}/bin/llvm-objcopy"

          ln -sf /usr/bin/llvm-strip-14 \
            "${LLVM_DIR}/bin/llvm-strip"

          ln -sf /usr/bin/llvm-readelf-14 \
            "${LLVM_DIR}/bin/llvm-readelf"

          echo "LLVM toolchain links:"
          ls -l "${LLVM_DIR}/bin"

      - name: Verify kernel source tree
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            kernel/arch/arm64/configs/vendor/bengal-perf_defconfig

          test -f \
            kernel/drivers/staging/qcacld-3.0/Kbuild

          test -f \
            kernel/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h

          test -f \
            kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c

          echo "Kernel source tree verified."

      - name: Verify NetHunter reference tree
        shell: bash
        run: |
          set -euxo pipefail

          test -d \
            nethunter-reference/kernel

          echo "NetHunter reference tree verified."

      - name: Prepare output
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          echo "Output directory prepared:"
          pwd
          ls -la "${OUT_DIR}"

                - name: Generate clean base configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            vendor/bengal-perf_defconfig

          CLEAN_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          test -n "${CLEAN_RELEASE}"

          case "${CLEAN_RELEASE}" in
            *-dirty)
              echo "ERROR: base release is already dirty."
              exit 1
              ;;
          esac

          echo "CLEAN_RELEASE=${CLEAN_RELEASE}" >> "${GITHUB_ENV}"

          echo "Clean kernel release:"
          echo "${CLEAN_RELEASE}"

      - name: Create NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p kernel/nethunter-config

          cat > kernel/nethunter-config/cebu-nethunter.config <<'EOF'
          # ============================================================
          # Moto G9 Power cebu NetHunter configuration
          #
          # This fragment is ADDITIVE.
          #
          # It explicitly preserves the stock cebu hardware drivers
          # verified from the running LineageOS kernel configuration,
          # then adds NetHunter functionality.
          #
          # Do NOT put QCACLD3 FEATURE_* variables here.
          # Those are Kbuild variables and are added later.
          # ============================================================

          # ------------------------------------------------------------
          # Core input / HID
          # ------------------------------------------------------------

          CONFIG_INPUT=y
          CONFIG_INPUT_EVDEV=y
          CONFIG_INPUT_TOUCHSCREEN=y
          CONFIG_TOUCHSCREEN_PROPERTIES=y

          CONFIG_HID=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y

          # ------------------------------------------------------------
          # Stock cebu touchscreen / fingerprint drivers
          # ------------------------------------------------------------

          CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI=m

          CONFIG_INPUT_NOVA_DRM_PANEL=y

          CONFIG_INPUT_TOUCHSCREEN_FOCALTECH_0FLASH_MMI=m
          CONFIG_INPUT_FOCALTECH_0FLASH_MMI_IC_NAME_FT8006S_AA=y
          CONFIG_INPUT_TOUCHSCREEN_FOCALTECH_0FLASH_MMI_DRM_PANEL=y

          CONFIG_INPUT_MISC_FPC1020=m
          CONFIG_INPUT_MISC_FPC1020_SAVE_TO_CLASS_DEVICE=y

          CONFIG_INPUT_CHIPONE_FPS_MMI=m

          # ------------------------------------------------------------
          # Qualcomm transport / cellular / WLAN
          # ------------------------------------------------------------

          CONFIG_I2C_QCOM_GENI=y
          CONFIG_SPI_QCOM_GENI=y

          CONFIG_WLAN=y
          CONFIG_QCA_CLD_WLAN=m

          CONFIG_RMNET=y
          CONFIG_RMNET_IPA3=y
          CONFIG_RMNET_PERF=m
          CONFIG_RMNET_SHS=m

          CONFIG_IPA3=y
          CONFIG_IPA_WDI_UNIFIED_API=y

          CONFIG_QCOM_QMI_HELPERS=y

          CONFIG_CNSS_UTILS=y
          CONFIG_CNSS_GENL=y

          # ------------------------------------------------------------
          # Bluetooth
          # ------------------------------------------------------------

          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y

          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y

          CONFIG_BT_BNEP=m
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y

          CONFIG_BT_HIDP=m

          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIUART_BCM=y
          CONFIG_BT_HCIUART_RTL=y

          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y

          CONFIG_BT_HCIVHCI=m

          # ------------------------------------------------------------
          # USB gadget / HID / networking
          # ------------------------------------------------------------

          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y

          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_EEM=y

          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y

          CONFIG_USB_ACM=m
          CONFIG_USB_SERIAL=m
          CONFIG_USB_SERIAL_GENERIC=y

          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=y
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_NET_RNDIS_HOST=m

          CONFIG_USB_RTL8150=m
          CONFIG_USB_RTL8152=m

          # ------------------------------------------------------------
          # Sensors / networking
          # ------------------------------------------------------------

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m

          CONFIG_PACKET=y

          # ------------------------------------------------------------
          # No DWARF debug information
          # ------------------------------------------------------------

          # CONFIG_DEBUG_INFO is not set

          EOF

          test -s \
            kernel/nethunter-config/cebu-nethunter.config

          echo "NetHunter configuration:"
          cat kernel/nethunter-config/cebu-nethunter.config

      - name: Merge NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          scripts/kconfig/merge_config.sh \
            -m \
            -O "${OUT_DIR}" \
            "${OUT_DIR}/.config" \
            nethunter-config/cebu-nethunter.config

          make -s \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig

          echo "NetHunter configuration merged."

      - name: Preserve stock kernel release
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          BASE_VERSION="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelversion
          )"

          RELEASE_SUFFIX="${CLEAN_RELEASE#${BASE_VERSION}}"

          echo "Base version:    ${BASE_VERSION}"
          echo "Clean release:   ${CLEAN_RELEASE}"
          echo "Release suffix:  ${RELEASE_SUFFIX}"

          scripts/config \
            --file "${OUT_DIR}/.config" \
            --disable LOCALVERSION_AUTO

          scripts/config \
            --file "${OUT_DIR}/.config" \
            --set-str CONFIG_LOCALVERSION "${RELEASE_SUFFIX}"

          make -s \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            syncconfig

          LOCALVERSION_AUTO_STATE="$(
            scripts/config \
              --file "${OUT_DIR}/.config" \
              --state LOCALVERSION_AUTO
          )"

          echo "LOCALVERSION_AUTO state: ${LOCALVERSION_AUTO_STATE}"

          test "${LOCALVERSION_AUTO_STATE}" = "n"

      - name: Disable kernel debug information
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          scripts/config \
            --file "${OUT_DIR}/.config" \
            --disable DEBUG_INFO

          make -s \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            syncconfig

          DEBUG_INFO_STATE="$(
            scripts/config \
              --file "${OUT_DIR}/.config" \
              --state DEBUG_INFO
          )"

          echo "DEBUG_INFO: ${DEBUG_INFO_STATE}"

          test "${DEBUG_INFO_STATE}" = "n"

      - name: Verify kernel release before build
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          echo "Configured release:"
          echo "${CONFIG_RELEASE}"

          echo "Expected release:"
          echo "${CLEAN_RELEASE}"

          test "${CONFIG_RELEASE}" = "${CLEAN_RELEASE}"

          case "${CONFIG_RELEASE}" in
            *+*)
              echo "ERROR: unwanted '+' remains in kernel release."
              exit 1
              ;;
            *-dirty)
              echo "ERROR: dirty release detected."
              exit 1
              ;;
          esac

          echo "Kernel release verification passed."



                - name: Verify stock cebu hardware configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          get_state() {
            scripts/config \
              --file "${CONFIG}" \
              --state "$1"
          }

          require_exact() {
            local symbol="$1"
            local expected="$2"
            local actual

            actual="$(get_state "${symbol}")"

            echo "${symbol}: ${actual}"

            test "${actual}" = "${expected}" || {
              echo "ERROR: ${symbol} expected ${expected}, got ${actual}"
              exit 1
            }
          }

          require_enabled() {
            local symbol="$1"
            local actual

            actual="$(get_state "${symbol}")"

            echo "${symbol}: ${actual}"

            case "${actual}" in
              y|m)
                ;;
              *)
                echo "ERROR: ${symbol} is disabled."
                exit 1
                ;;
            esac
          }

          echo "============================================================"
          echo "STOCK cebu INPUT / HID"
          echo "============================================================"

          require_exact INPUT y
          require_exact INPUT_EVDEV y
          require_exact INPUT_TOUCHSCREEN y
          require_exact TOUCHSCREEN_PROPERTIES y

          require_exact HID y
          require_exact HIDRAW y
          require_exact UHID y

          echo "============================================================"
          echo "STOCK cebu TOUCHSCREEN"
          echo "============================================================"

          require_enabled TOUCHSCREEN_NT36xxx_HOSTDL_SPI

          require_exact INPUT_NOVA_DRM_PANEL y

          require_enabled \
            INPUT_TOUCHSCREEN_FOCALTECH_0FLASH_MMI

          require_exact \
            INPUT_FOCALTECH_0FLASH_MMI_IC_NAME_FT8006S_AA \
            y

          require_exact \
            INPUT_TOUCHSCREEN_FOCALTECH_0FLASH_MMI_DRM_PANEL \
            y

          echo "============================================================"
          echo "STOCK cebu FINGERPRINT"
          echo "============================================================"

          require_enabled INPUT_MISC_FPC1020

          require_exact \
            INPUT_MISC_FPC1020_SAVE_TO_CLASS_DEVICE \
            y

          require_enabled INPUT_CHIPONE_FPS_MMI

          echo "============================================================"
          echo "STOCK cebu QCOM TRANSPORT"
          echo "============================================================"

          require_exact I2C_QCOM_GENI y
          require_exact SPI_QCOM_GENI y

          echo "============================================================"
          echo "STOCK cebu WLAN"
          echo "============================================================"

          require_exact WLAN y
          require_enabled QCA_CLD_WLAN

          echo "============================================================"
          echo "STOCK cebu CELLULAR / IPA / RMNET"
          echo "============================================================"

          require_exact RMNET y
          require_exact RMNET_IPA3 y
          require_exact IPA3 y
          require_exact IPA_WDI_UNIFIED_API y

          require_exact QCOM_QMI_HELPERS y

          require_exact CNSS_UTILS y
          require_exact CNSS_GENL y

          require_enabled RMNET_PERF
          require_enabled RMNET_SHS

          echo "============================================================"
          echo "STOCK HARDWARE CONFIGURATION PASSED"
          echo "============================================================"


      - name: Verify NetHunter Bluetooth configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          get_state() {
            scripts/config \
              --file "${CONFIG}" \
              --state "$1"
          }

          require_exact() {
            local symbol="$1"
            local expected="$2"
            local actual

            actual="$(get_state "${symbol}")"

            echo "${symbol}: ${actual}"

            test "${actual}" = "${expected}" || {
              echo "ERROR: ${symbol} expected ${expected}, got ${actual}"
              exit 1
            }
          }

          require_enabled() {
            local symbol="$1"
            local actual

            actual="$(get_state "${symbol}")"

            echo "${symbol}: ${actual}"

            case "${actual}" in
              y|m)
                ;;
              *)
                echo "ERROR: ${symbol} is disabled."
                exit 1
                ;;
            esac
          }

          require_exact BT y
          require_exact BT_BREDR y
          require_exact BT_LE y

          require_exact BT_RFCOMM y
          require_exact BT_RFCOMM_TTY y

          require_enabled BT_BNEP
          require_enabled BT_HIDP
          require_enabled BT_HCIUART
          require_enabled BT_HCIVHCI

          echo "Bluetooth configuration passed."


      - name: Verify NetHunter USB configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          get_state() {
            scripts/config \
              --file "${CONFIG}" \
              --state "$1"
          }

          require_exact() {
            local symbol="$1"
            local expected="$2"
            local actual

            actual="$(get_state "${symbol}")"

            echo "${symbol}: ${actual}"

            test "${actual}" = "${expected}" || {
              echo "ERROR: ${symbol} expected ${expected}, got ${actual}"
              exit 1
            }
          }

          require_enabled() {
            local symbol="$1"
            local actual

            actual="$(get_state "${symbol}")"

            echo "${symbol}: ${actual}"

            case "${actual}" in
              y|m)
                ;;
              *)
                echo "ERROR: ${symbol} is disabled."
                exit 1
                ;;
            esac
          }

          require_exact USB_GADGET y
          require_exact USB_CONFIGFS y
          require_exact USB_CONFIGFS_UEVENT y

          require_exact USB_CONFIGFS_ACM y
          require_exact USB_CONFIGFS_NCM y
          require_exact USB_CONFIGFS_RNDIS y
          require_exact USB_CONFIGFS_ECM y
          require_exact USB_CONFIGFS_EEM y

          require_exact USB_CONFIGFS_F_FS y
          require_exact USB_CONFIGFS_F_HID y
          require_exact USB_CONFIGFS_MASS_STORAGE y

          require_enabled USB_ACM
          require_enabled USB_SERIAL
          require_exact USB_SERIAL_GENERIC y

          require_exact USB_USBNET y

          require_enabled USB_NET_CDCETHER
          require_enabled USB_NET_CDC_NCM
          require_enabled USB_NET_RNDIS_HOST

          require_enabled USB_RTL8150
          require_enabled USB_RTL8152

          echo "USB/NetHunter configuration passed."


      - name: Verify NetHunter networking configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          get_state() {
            scripts/config \
              --file "${CONFIG}" \
              --state "$1"
          }

          require_exact() {
            local symbol="$1"
            local expected="$2"
            local actual

            actual="$(get_state "${symbol}")"

            echo "${symbol}: ${actual}"

            test "${actual}" = "${expected}" || {
              echo "ERROR: ${symbol} expected ${expected}, got ${actual}"
              exit 1
            }
          }

          require_enabled() {
            local symbol="$1"
            local actual

            actual="$(get_state "${symbol}")"

            echo "${symbol}: ${actual}"

            case "${actual}" in
              y|m)
                ;;
              *)
                echo "ERROR: ${symbol} is disabled."
                exit 1
                ;;
            esac
          }

          require_exact PACKET y

          require_exact SENSORS_SSC y
          require_enabled SENSORS_CLASS

          require_enabled QCA_CLD_WLAN

          echo "NetHunter networking configuration passed."


      - name: Verify configuration safety rules
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          echo "Checking that QCACLD3 FEATURE_* options are NOT kernel config symbols."

          if grep -Eq \
            '^CONFIG_FEATURE_(FRAME_INJECTION_SUPPORT|MONITOR_MODE_SUPPORT)=' \
            "${CONFIG}"; then

            echo "ERROR: QCACLD3 FEATURE_* variables incorrectly appear in .config."
            exit 1
          fi

          echo "QCACLD3 FEATURE_* .config check passed."

          DEBUG_INFO_STATE="$(
            scripts/config \
              --file "${CONFIG}" \
              --state DEBUG_INFO
          )"

          echo "DEBUG_INFO: ${DEBUG_INFO_STATE}"

          test "${DEBUG_INFO_STATE}" = "n"

          LOCALVERSION_AUTO_STATE="$(
            scripts/config \
              --file "${CONFIG}" \
              --state LOCALVERSION_AUTO
          )"

          echo "LOCALVERSION_AUTO: ${LOCALVERSION_AUTO_STATE}"

          test "${LOCALVERSION_AUTO_STATE}" = "n"

          echo "Configuration safety gates passed."


                - name: Import QCACLD3 frame injection sources
        shell: bash
        run: |
          set -euxo pipefail

          KERNEL_QCACLD3="kernel/drivers/staging/qcacld-3.0"
          REF_QCACLD3="nethunter-reference/kernel/drivers/staging/qcacld-3.0"

          test -d "${KERNEL_QCACLD3}"
          test -d "${REF_QCACLD3}"

          echo "QCACLD3 kernel tree:"
          echo "${KERNEL_QCACLD3}"

          echo "NetHunter QCACLD3 reference:"
          echo "${REF_QCACLD3}"

          # ----------------------------------------------------------
          # Frame-injection source files
          # ----------------------------------------------------------

          for file in \
            wlan_hdd_frame_inject.c \
            wlan_hdd_inject_security.c \
            wlan_hdd_inject_netlink.c \
            wlan_hdd_inject_debugfs.c \
            wlan_hdd_inject_sysfs.c
          do
            test -f \
              "${REF_QCACLD3}/core/hdd/src/${file}"

            cp \
              "${REF_QCACLD3}/core/hdd/src/${file}" \
              "${KERNEL_QCACLD3}/core/hdd/src/${file}"
          done

          # ----------------------------------------------------------
          # Frame-injection headers
          # ----------------------------------------------------------

          for file in \
            wlan_hdd_frame_inject.h \
            wlan_hdd_inject_security.h \
            wlan_hdd_inject_netlink.h \
            wlan_hdd_inject_debugfs.h \
            wlan_hdd_inject_sysfs.h
          do
            test -f \
              "${REF_QCACLD3}/core/hdd/inc/${file}"

            cp \
              "${REF_QCACLD3}/core/hdd/inc/${file}" \
              "${KERNEL_QCACLD3}/core/hdd/inc/${file}"
          done

          # ----------------------------------------------------------
          # WMA injection source
          # ----------------------------------------------------------

          test -f \
            "${REF_QCACLD3}/core/wma/src/wma_injection.c"

          cp \
            "${REF_QCACLD3}/core/wma/src/wma_injection.c" \
            "${KERNEL_QCACLD3}/core/wma/src/wma_injection.c"

          # ----------------------------------------------------------
          # WMA injection header, if supplied by reference
          # ----------------------------------------------------------

          if test -f \
            "${REF_QCACLD3}/core/wma/inc/wma_injection.h"; then

            cp \
              "${REF_QCACLD3}/core/wma/inc/wma_injection.h" \
              "${KERNEL_QCACLD3}/core/wma/inc/wma_injection.h"
          fi

          echo "QCACLD3 injection sources imported."

          find \
            "${KERNEL_QCACLD3}/core/hdd/src" \
            "${KERNEL_QCACLD3}/core/hdd/inc" \
            "${KERNEL_QCACLD3}/core/wma/src" \
            "${KERNEL_QCACLD3}/core/wma/inc" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*inject*' \
              -o \
              -name '*injection*' \
            \) \
            -print \
            | sort


      - name: Add QCACLD3 injection context
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/core/hdd/inc/"
              "wlan_hdd_main.h"
          )

          text = path.read_text()

          # ----------------------------------------------------------
          # Forward declaration
          # ----------------------------------------------------------

          if "struct hdd_injection_ctx;" not in text:

              marker = "struct hdd_adapter {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: struct hdd_adapter marker not found."
                  )

              text = text.replace(
                  marker,
                  "struct hdd_injection_ctx;\n\n" + marker,
                  1
              )

          # ----------------------------------------------------------
          # Injection context pointer
          # ----------------------------------------------------------

          if "struct hdd_injection_ctx *injection_ctx;" not in text:

              marker = (
                  "\tqdf_atomic_t net_dev_hold_ref_count"
                  "[NET_DEV_HOLD_ID_MAX];\n"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: adapter injection-context marker not found."
                  )

              replacement = """\tqdf_atomic_t net_dev_hold_ref_count[NET_DEV_HOLD_ID_MAX];

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              struct hdd_injection_ctx *injection_ctx;
          #endif
          """

              text = text.replace(
                  marker,
