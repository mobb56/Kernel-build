    - name: Package Wi-Fi module only
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        MODULE="${OUT_DIR}/drivers/staging/qcacld-3.0/wlan.ko"
        STOCK_MODULE="${GITHUB_WORKSPACE}/stock-qca_cld3_wlan.ko"
        REPORT="${OUT_DIR}/qca-crc-report.txt"
        SYMVERS="${OUT_DIR}/Module.symvers"
        CONFIG="${OUT_DIR}/.config"
        LLVM_READelf="${LLVM_DIR}/bin/llvm-readelf"

        echo "=== Wi-Fi module-only package ==="

        test -s "${MODULE}"
        test -s "${STOCK_MODULE}"
        test -s "${REPORT}"
        test -s "${SYMVERS}"
        test -s "${CONFIG}"

        grep -Fxq 'CONFIG_MODVERSIONS=y' "${CONFIG}"
        "${LLVM_READelf}" -S -W "${MODULE}" | grep -q '[[:space:]]__versions[[:space:]]'

        EXPECTED_RELEASE="4.19.325-cip135-st19-perf-g39bcecd5c63d"
        VERMAGIC="$(modinfo -F vermagic "${MODULE}")"
        echo "Module vermagic: ${VERMAGIC}"
        case "${VERMAGIC}" in
          "${EXPECTED_RELEASE} "*) ;;
          *)
            echo "ERROR: module vermagic does not match the phone's kernel release."
            exit 1
            ;;
        esac

        OUT="${GITHUB_WORKSPACE}/artifacts/wifi-module"
        rm -rf "${OUT}"
        mkdir -p "${OUT}"

        cp "${MODULE}" "${OUT}/qca_cld3_wlan.ko"
        cp "${REPORT}" "${OUT}/qca-crc-report.txt"
        cp "${SYMVERS}" "${OUT}/Module.symvers"
        cp "${CONFIG}" "${OUT}/kernel.config"
        cp "${GITHUB_WORKSPACE}/cebu-stock.config" "${OUT}/cebu-stock.config"

        {
          echo "Artifact: cebu-nethunter-wlan-module"
          echo "Kernel repository: ${KERNEL_REPO}"
          echo "Kernel branch: ${KERNEL_BRANCH}"
          echo "Kernel commit: $(git -C kernel rev-parse HEAD)"
          echo "NetHunter repository: ${NETHUNTER_REPO}"
          echo "NetHunter branch: ${NETHUNTER_BRANCH}"
          echo "NetHunter commit: $(git -C nethunter-reference rev-parse HEAD)"
          echo "Expected kernel release: ${EXPECTED_RELEASE}"
          echo "Module vermagic: ${VERMAGIC}"
          echo "CONFIG_MODVERSIONS=y"
          echo "Patch monitor VDEV completion diagnostics: NOT applied"
          echo "Module SHA256: $(sha256sum "${OUT}/qca_cld3_wlan.ko" | awk '{print $1}')"
        } > "${OUT}/MANIFEST.txt"

        (
          cd "${OUT}"
          sha256sum qca_cld3_wlan.ko qca-crc-report.txt Module.symvers kernel.config cebu-stock.config MANIFEST.txt > SHA256SUMS
          zip -q -9 "${GITHUB_WORKSPACE}/artifacts/cebu-nethunter-wlan-module.zip" \
            qca_cld3_wlan.ko qca-crc-report.txt Module.symvers kernel.config cebu-stock.config MANIFEST.txt SHA256SUMS
        )

        echo
        echo "=== Module artifact ==="
        ls -lh "${OUT}/qca_cld3_wlan.ko" "${GITHUB_WORKSPACE}/artifacts/cebu-nethunter-wlan-module.zip"
        sha256sum "${OUT}/qca_cld3_wlan.ko" "${GITHUB_WORKSPACE}/artifacts/cebu-nethunter-wlan-module.zip"
    - name: Upload Wi-Fi module artifact
      uses: actions/upload-artifact@v4
