          fi
        else
          echo "FAIL: ${OUT_DIR}/.config does not exist."
          fail=1
        fi

        echo
        echo "=========================================="

        if [ "$fail" -ne 0 ]; then
          echo "MONITOR + INJECTION PRE-BUILD INTEGRATION: FAILED"
          echo "=========================================="
          exit 1
        fi

        echo "MONITOR + INJECTION PRE-BUILD INTEGRATION: PASSED"
