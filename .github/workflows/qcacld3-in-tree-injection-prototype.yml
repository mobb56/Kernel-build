name: QCACLD3 Injection Prototype v12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libssl-dev \
            libelf-dev \
            clang \
            llvm \
            lld \
            ccache \
            git \
            python3 \
            rsync

      - name: Clone kernel and reference
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf Kernel-Build
          mkdir -p Kernel-Build

          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            Kernel-Build/kernel

          git clone --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            Kernel-Build/reference

      - name: Define paths
        shell: bash
        run: |
          set -euxo pipefail

          KERNEL="$GITHUB_WORKSPACE/Kernel-Build/kernel"
          REF="$GITHUB_WORKSPACE/Kernel-Build/reference"

          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "WLAN=$KERNEL/drivers/staging/qcacld-3.0" >> "$GITHUB_ENV"
          echo "OUT=$KERNEL/out" >> "$GITHUB_ENV"

      - name: Verify source trees
        shell: bash
        run: |
          set -euxo pipefail

          test -d "$KERNEL/drivers/staging/qcacld-3.0"
          test -d "$KERNEL/drivers/staging/qca-wifi-host-cmn"
          test -d "$KERNEL/drivers/staging/fw-api"

          test -f "$KERNEL/drivers/staging/qcacld-3.0/Kbuild"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c"

          test -f \
            "$REF/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c"

          echo "Kernel and reference trees verified."

      # ------------------------------------------------------------
      # Import production injection implementation
      # ------------------------------------------------------------

      - name: Import injection implementation
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL"

          mkdir -p \
            drivers/staging/qcacld-3.0/core/hdd/inc \
            drivers/staging/qcacld-3.0/core/hdd/src \
            drivers/staging/qcacld-3.0/core/wma/inc \
            drivers/staging/qcacld-3.0/core/wma/src

          # Production headers.
          INJECTION_HEADERS=(
            "core/hdd/inc/wlan_hdd_frame_inject.h"
            "core/hdd/inc/wlan_hdd_frame_inject_debug.h"
            "core/hdd/inc/wlan_hdd_frame_inject_integration.h"
            "core/hdd/inc/wlan_hdd_frame_validate.h"
            "core/hdd/inc/wlan_hdd_inject_security.h"
            "core/wma/inc/wma_frame_inject.h"
          )

          # Production implementation.
          INJECTION_SOURCES=(
            "core/hdd/src/wlan_hdd_frame_inject.c"
            "core/hdd/src/wlan_hdd_frame_inject_debug.c"
            "core/hdd/src/wlan_hdd_frame_inject_integration.c"
            "core/hdd/src/wlan_hdd_frame_validate.c"
            "core/hdd/src/wlan_hdd_inject_security.c"
            "core/wma/src/wma_frame_inject.c"
          )

          for f in "${INJECTION_HEADERS[@]}"; do
            mkdir -p "$(dirname "$WLAN/$f")"
            cp "$REF/drivers/staging/qcacld-3.0/$f" \
               "$WLAN/$f"
          done

          for f in "${INJECTION_SOURCES[@]}"; do
            mkdir -p "$(dirname "$WLAN/$f")"
            cp "$REF/drivers/staging/qcacld-3.0/$f" \
               "$WLAN/$f"
          done

          echo "Imported production injection files."

      # ------------------------------------------------------------
      # Verify everything was copied
      # ------------------------------------------------------------

      - name: Verify imported files
        shell: bash
        run: |
          set -euxo pipefail

          missing=0

          INJECTION_HEADERS=(
            "core/hdd/inc/wlan_hdd_frame_inject.h"
            "core/hdd/inc/wlan_hdd_frame_inject_debug.h"
            "core/hdd/inc/wlan_hdd_frame_inject_integration.h"
            "core/hdd/inc/wlan_hdd_frame_validate.h"
            "core/hdd/inc/wlan_hdd_inject_security.h"
            "core/wma/inc/wma_frame_inject.h"
          )

          INJECTION_SOURCES=(
            "core/hdd/src/wlan_hdd_frame_inject.c"
            "core/hdd/src/wlan_hdd_frame_inject_debug.c"
            "core/hdd/src/wlan_hdd_frame_inject_integration.c"
            "core/hdd/src/wlan_hdd_frame_validate.c"
            "core/hdd/src/wlan_hdd_inject_security.c"
            "core/wma/src/wma_frame_inject.c"
          )

          echo "=== HEADERS ==="

          for f in "${INJECTION_HEADERS[@]}"; do
            if [ -f "$WLAN/$f" ]; then
              echo "OK      $f"
            else
              echo "MISSING $f"
              missing=1
            fi
          done

          echo
          echo "=== SOURCES ==="

          for f in "${INJECTION_SOURCES[@]}"; do
            if [ -f "$WLAN/$f" ]; then
              echo "OK      $f"
            else
              echo "MISSING $f"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Injection source import is incomplete."
            exit 1
          fi

      # ------------------------------------------------------------
      # Show direct include dependencies before compiling
      # ------------------------------------------------------------

      - name: Audit imported includes
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          {
            echo "=== DIRECT INCLUDE AUDIT ==="
            echo

            for f in \
              "$WLAN/core/hdd/src/wlan_hdd_frame_inject.c" \
              "$WLAN/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
              "$WLAN/core/hdd/src/wlan_hdd_frame_inject_integration.c" \
              "$WLAN/core/hdd/src/wlan_hdd_frame_validate.c" \
              "$WLAN/core/hdd/src/wlan_hdd_inject_security.c" \
              "$WLAN/core/wma/src/wma_frame_inject.c"
            do
              echo "### $f"
              grep -E '^[[:space:]]*#include[[:space:]]*["<]' "$f" || true
              echo
            done
          } | tee reports/imported-includes.txt

      # ------------------------------------------------------------
      # Configure kernel
      # ------------------------------------------------------------

      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          export PATH="/usr/lib/llvm-14/bin:$PATH"

          make O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          # Ensure QCACLD3 is built as a module.
          ./scripts/config \
            --module CONFIG_QCA_CLD_WLAN

          make O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          make O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            prepare

          make O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_prepare

          test -f "$OUT/include/config/auto.conf"

          echo "Kernel configured successfully."

      # ------------------------------------------------------------
      # Backup original Kbuild
      # ------------------------------------------------------------

      - name: Backup Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            "$WLAN/Kbuild" \
            "$WLAN/Kbuild.original"

      # ------------------------------------------------------------
      # Patch Kbuild
      #
      # Important:
      # The existing Kbuild eventually does:
      #
      #     $(MODNAME)-y := $(OBJS)
      #
      # Therefore the injection objects must be added to OBJS
      # BEFORE that assignment.
      # ------------------------------------------------------------

      - name: Patch QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("Kernel-Build/kernel/drivers/staging/qcacld-3.0/Kbuild")
          s = p.read_text()

          marker = "$(MODNAME)-y := $(OBJS)"

          if marker not in s:
              raise SystemExit(
                  "Could not find '$(MODNAME)-y := $(OBJS)' in Kbuild"
              )

          injection_objects = r'''
          # NetHunter QCACLD3 injection prototype
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_integration.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o

          # Injection feature macro.
          ccflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT

          # Injection header locations.
          ccflags-y += -I$(src)/core/hdd/inc
          ccflags-y += -I$(src)/core/hdd/src
          ccflags-y += -I$(src)/core/wma/inc
          '''

          if "wlan_hdd_frame_inject.o" not in s:
              s = s.replace(
                  marker,
                  injection_objects + "\n" + marker,
                  1
              )

          p.write_text(s)
          PY

          echo "=== PATCHED KBUILD ==="
          grep -n -A25 -B5 \
            "NetHunter QCACLD3 injection prototype" \
            "$WLAN/Kbuild"

      # ------------------------------------------------------------
      # Verify Kbuild syntax/content
      # ------------------------------------------------------------

      - name: Verify Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          grep -q \
            'wlan_hdd_frame_inject.o' \
            "$WLAN/Kbuild"

          grep -q \
            'wlan_hdd_frame_inject_debug.o' \
            "$WLAN/Kbuild"

          grep -q \
            'wlan_hdd_frame_inject_integration.o' \
            "$WLAN/Kbuild"

          grep -q \
            'wlan_hdd_frame_validate.o' \
            "$WLAN/Kbuild"

          grep -q \
            'wlan_hdd_inject_security.o' \
            "$WLAN/Kbuild"

          grep -q \
            'wma_frame_inject.o' \
            "$WLAN/Kbuild"

          grep -q \
            'FEATURE_FRAME_INJECTION_SUPPORT' \
            "$WLAN/Kbuild"

          grep -q \
            'core/hdd/inc' \
            "$WLAN/Kbuild"

          grep -q \
            'core/wma/inc' \
            "$WLAN/Kbuild"

          echo "Kbuild injection modifications verified."

      # ------------------------------------------------------------
      # Build QCACLD3
      # ------------------------------------------------------------

      - name: Build QCACLD3
        shell: bash
        continue-on-error: true
        run: |
          set +e

          cd "$KERNEL"

          export PATH="/usr/lib/llvm-14/bin:$PATH"

          mkdir -p "$GITHUB_WORKSPACE/reports"

          make \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            V=1 \
            M=drivers/staging/qcacld-3.0 \
            WLAN_ROOT=drivers/staging/qcacld-3.0 \
            WLAN_COMMON_ROOT=drivers/staging/qca-wifi-host-cmn \
            WLAN_COMMON_INC=drivers/staging/qca-wifi-host-cmn \
            WLAN_FW_API=drivers/staging/fw-api \
            WLAN_PROFILE=default \
            DYNAMIC_SINGLE_CHIP= \
            MODNAME=wlan \
            BOARD_PLATFORM=bengal \
            CONFIG_QCA_CLD_WLAN=m \
            modules \
            2>&1 | tee "$GITHUB_WORKSPACE/reports/build.log"

          rc=${PIPESTATUS[0]}

          echo "$rc" > \
            "$GITHUB_WORKSPACE/reports/build-exit-code.txt"

          exit 0

      # ------------------------------------------------------------
      # Extract actual compiler commands
      # ------------------------------------------------------------

      - name: Extract injection compile commands
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "=== ACTUAL INJECTION COMPILATION ==="
            echo

            grep -E \
              'wlan_hdd_frame_inject\.o|wlan_hdd_frame_inject_debug\.o|wlan_hdd_frame_inject_integration\.o|wlan_hdd_frame_validate\.o|wlan_hdd_inject_security\.o|wma_frame_inject\.o' \
              reports/build.log || true

            echo
            echo "=== INJECTION ERRORS ==="

            grep -E \
              'fatal error:|error:|undefined reference|No rule to make|recipe for target' \
              reports/build.log || true
          } | tee reports/injection-compile-results.txt

      # ------------------------------------------------------------
      # Verify objects
      # ------------------------------------------------------------

      - name: Verify injection objects
        shell: bash
        run: |
          set +e

          {
            echo "=== INJECTION OBJECT VERIFICATION ==="
            echo

            for f in \
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.o" \
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.o" \
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_integration.o" \
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_validate.o" \
              "$OUT/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.o" \
              "$OUT/drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.o"
            do
              if [ -f "$f" ]; then
                echo "BUILT: $f"
              else
                echo "NOT BUILT: $f"
              fi
            done

            echo
            echo "=== WLAN MODULE ==="

            if [ -f "$OUT/drivers/staging/qcacld-3.0/wlan.ko" ]; then
              echo "BUILT: wlan.ko"
              file "$OUT/drivers/staging/qcacld-3.0/wlan.ko"
            else
              echo "wlan.ko was not produced."
            fi
          } | tee reports/object-verification.txt

          exit 0

      # ------------------------------------------------------------
      # Check resulting symbols
      # ------------------------------------------------------------

      - name: Inspect WLAN module
        shell: bash
        run: |
          set +e

          mkdir -p reports

          {
            echo "=== WLAN MODULE SYMBOLS ==="
            echo

            MOD="$OUT/drivers/staging/qcacld-3.0/wlan.ko"

            if [ -f "$MOD" ]; then
              llvm-nm "$MOD" 2>/dev/null | \
                grep -E \
                'wlan_hdd_frame_inject|wlan_hdd_frame_validate|wma_frame_inject|injection' \
                || true

              echo
              echo "=== MODINFO ==="
              modinfo "$MOD" 2>/dev/null || true
            else
              echo "wlan.ko not found."
            fi
          } | tee reports/module-symbols.txt

      # ------------------------------------------------------------
      # Final conclusion
      # ------------------------------------------------------------

      - name: Generate prototype conclusion
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          BUILD_RC="$(cat reports/build-exit-code.txt 2>/dev/null || echo unknown)"

          {
            echo "QCACLD3 Injection Prototype v12"
            echo "================================"
            echo
            echo "Build exit code: $BUILD_RC"
            echo
            echo "This workflow is a SOURCE-PORT PROTOTYPE."
            echo
            echo "It does NOT establish firmware-level packet injection support."
            echo
            echo "Injection implementation imported from:"
            echo "V0lk3n/nethunter_kernel_oneplus_sm8150"
            echo "branch: nethunter-lineage-23.2"
            echo
            echo "Motorola target:"
            echo "LineageOS/android_kernel_motorola_sm6225"
            echo "branch: lineage-23.2"
            echo
            echo "Imported production components:"
            echo "- wlan_hdd_frame_inject"
            echo "- wlan_hdd_frame_inject_debug"
            echo "- wlan_hdd_frame_inject_integration"
            echo "- wlan_hdd_frame_validate"
            echo "- wlan_hdd_inject_security"
            echo "- wma_frame_inject"
            echo
            echo "See:"
            echo "- reports/build.log"
            echo "- reports/injection-compile-results.txt"
            echo "- reports/object-verification.txt"
            echo "- reports/module-symbols.txt"
          } | tee reports/conclusion.txt

      # ------------------------------------------------------------
      # Package everything even if compilation failed
      # ------------------------------------------------------------

      - name: Package prototype report
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p prototype-report

          cp -a reports/. \
            prototype-report/ 2>/dev/null || true

          cp \
            "$WLAN/Kbuild.original" \
            prototype-report/Kbuild.original 2>/dev/null || true

          cp \
            "$WLAN/Kbuild" \
            prototype-report/Kbuild.patched 2>/dev/null || true

          mkdir -p \
            prototype-report/imported-source \
            prototype-report/imported-headers

          cp \
            "$WLAN/core/hdd/src/wlan_hdd_frame_inject.c" \
            prototype-report/imported-source/ 2>/dev/null || true

          cp \
            "$WLAN/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
            prototype-report/imported-source/ 2>/dev/null || true

          cp \
            "$WLAN/core/hdd/src/wlan_hdd_frame_inject_integration.c" \
            prototype-report/imported-source/ 2>/dev/null || true

          cp \
            "$WLAN/core/hdd/src/wlan_hdd_frame_validate.c" \
            prototype-report/imported-source/ 2>/dev/null || true

          cp \
            "$WLAN/core/hdd/src/wlan_hdd_inject_security.c" \
            prototype-report/imported-source/ 2>/dev/null || true

          cp \
            "$WLAN/core/wma/src/wma_frame_inject.c" \
            prototype-report/imported-source/ 2>/dev/null || true

          cp \
            "$WLAN/core/hdd/inc/"*.h \
            prototype-report/imported-headers/ 2>/dev/null || true

          cp \
            "$WLAN/core/wma/inc/wma_frame_inject.h" \
            prototype-report/imported-headers/ 2>/dev/null || true

          cd prototype-report
          zip -r ../qcacld3-injection-prototype-v12.zip . >/dev/null

      - name: Upload prototype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-injection-prototype-v12
          path: qcacld3-injection-prototype-v12.zip
          if-no-files-found: error
