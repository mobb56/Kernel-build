          echo
          echo "=== HDD MAIN OBJECT CONTEXT ==="
          grep -n -B8 -A12 \
            'wlan_hdd_main\.o' \
            "${KBUILD_FILE}" || true

          echo
          echo "=== HDD FRAME INJECTION OBJECT CONTEXT ==="
          grep -n -B8 -A8 \
            'wlan_hdd_frame_inject\.o' \
            "${KBUILD_FILE}" || true

          echo
          echo "=== ALL HDD_OBJS DEFINITIONS ==="
          grep -n -E \
            '^[[:space:]]*HDD_OBJS|HDD_OBJS[[:space:]]*[:+?]?=' \
            "${KBUILD_FILE}" || true

          echo
          echo "=== DIAGNOSTIC COMPLETE ==="

          
          
          
                    

      - name: Inspect WMA injection header/source collision
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          HEADER="drivers/staging/qcacld-3.0/core/wma/inc/wma_frame_inject.h"
          SOURCE="drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c"

          test -f "${HEADER}"
          test -f "${SOURCE}"

          echo "=== WMA HEADER DUPLICATE DEFINITIONS ==="

          grep -n -E \
            'static inline.*wma_(init_injection_queue|deinit_injection_queue|queue_injection_frame|get_injection_queue_stats|reset_injection_queue_stats|get_injection_queue_size|is_injection_queue_empty|flush_injection_queue|send_injection_frame_to_fw|handle_injection_fw_response)' \
            "${HEADER}" || true

          echo
          echo "=== WMA SOURCE DEFINITIONS ==="

          grep -n -E \
            '^(QDF_STATUS|uint32_t|bool|void).*wma_(init_injection_queue|deinit_injection_queue|queue_injection_frame|get_injection_queue_stats|reset_injection_queue_stats|get_injection_queue_size|is_injection_queue_empty|flush_injection_queue|send_injection_frame_to_fw|handle_injection_fw_response|translate_fw_injection_error)' \
            "${SOURCE}" || true

          echo
          echo "=== WMA HEADER RANGE ==="

          sed -n '320,395p' "${HEADER}"

          echo
          echo "WMA collision inspection complete."





      - name: Fix WMA injection include path
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          KBUILD_FILE="drivers/staging/qcacld-3.0/Kbuild"

          test -f "${KBUILD_FILE}"

          echo "=== Fix WMA injection include path ==="

          grep -n -A4 \
            '^WMA_INC[[:space:]]*:=' \
            "${KBUILD_FILE}"

          if ! grep -Fq 'ccflags-y += $(WMA_INC)' "${KBUILD_FILE}"; then
            sed -i \
              '/^WMA_INC[[:space:]]*:=[[:space:]]*/,/^[[:space:]]*$/{
                /^WMA_INC[[:space:]]*:=[[:space:]]*/{
                  :a
                  n
                  /^[[:space:]]*$/!ba
                  i\
             ccflags-y += $(WMA_INC)
                }
              }' \
              "${KBUILD_FILE}"
          fi

          echo
          echo "=== Verify WMA include flags ==="

          grep -n -A5 \
            '^WMA_INC[[:space:]]*:=' \
            "${KBUILD_FILE}"

          grep -Fq 'ccflags-y += $(WMA_INC)' "${KBUILD_FILE}"

          echo "WMA injection include path fixed."






      - name: Fix WMA HDD injection include path
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          KBUILD_FILE="drivers/staging/qcacld-3.0/Kbuild"
          HDD_INC='ccflags-y += -I$(srctree)/$(WLAN_ROOT)/core/hdd/inc'

          test -f "${KBUILD_FILE}"
          test -f "drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject.h"

          echo "=== Add HDD injection include path to WMA ==="

          if ! grep -Fqx "${HDD_INC}" "${KBUILD_FILE}"; then
            LINE="$(grep -n -F 'ccflags-y += $(WMA_INC)' "${KBUILD_FILE}" | head -n1 | cut -d: -f1)"

            test -n "${LINE}"

            sed -i "${LINE}a\\
          ${HDD_INC}" "${KBUILD_FILE}"
          fi

          echo
          echo "=== Verify HDD injection include path ==="

          grep -n -A3 \
            -F 'ccflags-y += $(WMA_INC)' \
            "${KBUILD_FILE}"

          grep -Fqx "${HDD_INC}" "${KBUILD_FILE}"

          echo "WMA HDD injection include path fixed."

      # ============================================================
      # 35. VERIFY INJECTION SOURCES AND INTEGRATION
      # ============================================================

      - name: Verify QCACLD3 injection integration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          QCACLD="drivers/staging/qcacld-3.0"

          REQUIRED=(
            "${QCACLD}/core/hdd/src/wlan_hdd_frame_inject.c"
            "${QCACLD}/core/hdd/src/wlan_hdd_frame_validate.c"
            "${QCACLD}/core/hdd/src/wlan_hdd_inject_security.c"
            "${QCACLD}/core/hdd/src/wlan_hdd_frame_inject_debug.c"
            "${QCACLD}/core/wma/src/wma_frame_inject.c"
          )

          for file in "${REQUIRED[@]}"; do
            test -f "${file}"
            echo "OK: ${file}"
          done

          echo
          echo "=== Checking QCACLD3 build features ==="

          grep -Fq \
            'CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y' \
            "${QCACLD}/Kbuild"

          grep -Fq \
            'CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y' \
            "${QCACLD}/Kbuild"

          echo "OK: frame injection build feature enabled"
          echo "OK: monitor mode build feature enabled"

          echo
          echo "=== Checking HDD injection API include ==="

          grep -Fq \
            '#include "../inc/wlan_hdd_frame_inject.h"' \
            "${QCACLD}/core/hdd/src/wlan_hdd_main.c"

          echo "OK: wlan_hdd_frame_inject.h included from HDD main"

          echo
          echo "=== Checking injection initialization ==="

          grep -Fq \
            'hdd_init_frame_injection(adapter);' \
            "${QCACLD}/core/hdd/src/wlan_hdd_main.c"

          echo "OK: frame-injection initialization found"

          echo
          echo "=== Checking injection deinitialization ==="

          grep -Fq \
            'hdd_deinit_frame_injection(adapter);' \
            "${QCACLD}/core/hdd/src/wlan_hdd_main.c"

          echo "OK: frame-injection deinitialization found"

          echo
          echo "=== QCACLD3 injection integration verified ==="
      # ============================================================
      # 36. FINAL CHECK: FEATURE VARIABLES MUST NOT BE IN .config
      # ============================================================

      - name: Verify Kbuild and kernel config separation
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          if grep -Eq \
            '^CONFIG_(FEATURE_FRAME_INJECTION_SUPPORT|FEATURE_MONITOR_MODE_SUPPORT)(=| is not set)' \
            "${CONFIG}"; then

            echo "ERROR: QCACLD3 Kbuild feature leaked into kernel .config."
            exit 1
          fi

          echo "PASS: FEATURE_FRAME_INJECTION_SUPPORT is Kbuild-only."
          echo "PASS: FEATURE_MONITOR_MODE_SUPPORT is Kbuild-only."

      # ============================================================
      # 37. SAVE SOURCE MODIFICATION MANIFEST
      # ============================================================

      - name: Save QCACLD3 modification manifest
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          {
            echo "============================================================"
            echo "QCACLD3 NETHUNTER INTEGRATION"
            echo "============================================================"
            echo
            echo "Frame injection: enabled"
            echo "Monitor mode: enabled"
            echo "Capability check: CAP_NET_RAW"
            echo
            echo "Kbuild:"
            grep -nE \
              'FEATURE_FRAME_INJECTION_SUPPORT|FEATURE_MONITOR_MODE_SUPPORT' \
              drivers/staging/qcacld-3.0/Kbuild
            echo
            echo "Injection sources:"
            find drivers/staging/qcacld-3.0 \
              -type f \
              \( \
                -name '*frame*inject*' \
                -o \
                -name '*inject*security*' \
              \) \
              -print \
              | sort
          } > "${GITHUB_WORKSPACE}/artifacts/source-audit/qcacld3-injection-manifest.txt"

          cat \
            "${GITHUB_WORKSPACE}/artifacts/source-audit/qcacld3-injection-manifest.txt"



      # ============================================================
      # 38. NORMALIZE STOCK AND FINAL CONFIGURATIONS
      # ============================================================

      - name: Normalize configuration files
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          STOCK="${GITHUB_WORKSPACE}/cebu-stock.config"
          FINAL="${OUT_DIR}/.config"

          test -s "${STOCK}"
          test -s "${FINAL}"

          # Keep only actual CONFIG entries and sort them by symbol.
          #
          # This makes the comparison independent of the ordering
          # used by the original /proc/config.gz extraction.

          grep -E \
            '^(CONFIG_[A-Za-z0-9_]+=(.*)|# CONFIG_[A-Za-z0-9_]+ is not set)$' \
            "${STOCK}" |
            sort \
            > "${GITHUB_WORKSPACE}/artifacts/source-audit/stock-normalized.config"

          grep -E \
            '^(CONFIG_[A-Za-z0-9_]+=(.*)|# CONFIG_[A-Za-z0-9_]+ is not set)$' \
            "${FINAL}" |
            sort \
            > "${GITHUB_WORKSPACE}/artifacts/source-audit/final-normalized.config"

          test -s \
            "${GITHUB_WORKSPACE}/artifacts/source-audit/stock-normalized.config"

          test -s \
            "${GITHUB_WORKSPACE}/artifacts/source-audit/final-normalized.config"

          echo "Stock configuration entries:"
          wc -l \
            "${GITHUB_WORKSPACE}/artifacts/source-audit/stock-normalized.config"

          echo
          echo "Final configuration entries:"
          wc -l \
            "${GITHUB_WORKSPACE}/artifacts/source-audit/final-normalized.config"

      # ============================================================
      # 39. GENERATE COMPLETE CONFIGURATION DIFFERENCE
      # ============================================================

      - name: Generate stock versus final configuration diff
        shell: bash
        run: |
          set -euxo pipefail

          STOCK="${GITHUB_WORKSPACE}/artifacts/source-audit/stock-normalized.config"
          FINAL="${GITHUB_WORKSPACE}/artifacts/source-audit/final-normalized.config"
          DIFF="${GITHUB_WORKSPACE}/artifacts/source-audit/stock-vs-final.config.diff"

          diff -u \
            "${STOCK}" \
            "${FINAL}" \
            > "${DIFF}" || true

          echo "============================================================"
          echo "STOCK -> FINAL CONFIGURATION DIFFERENCE"
          echo "============================================================"

          cat "${DIFF}"

      # ============================================================
      # 40. VERIFY CRITICAL STOCK HARDWARE SETTINGS
      #
      # These settings must remain exactly as they were in the
      # verified stock configuration.
      # ============================================================

      - name: Verify critical stock hardware settings
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          STOCK="${GITHUB_WORKSPACE}/cebu-stock.config"
          FINAL="${OUT_DIR}/.config"

          check_same() {
            local symbol="$1"

            local stock_value
            local final_value

            stock_value="$(
              grep -E "^${symbol}=" "${STOCK}" |
                head -n1 || true
            )"

            final_value="$(
              grep -E "^${symbol}=" "${FINAL}" |
                head -n1 || true
            )"

            if [ -z "${stock_value}" ]; then
              echo "ERROR: stock symbol not found: ${symbol}"
              exit 1
            fi

            if [ "${stock_value}" != "${final_value}" ]; then
              echo
              echo "ERROR: STOCK CONFIGURATION CHANGED"
              echo "Symbol: ${symbol}"
              echo "Stock:  ${stock_value}"
              echo "Final:  ${final_value}"
              exit 1
            fi

            echo "UNCHANGED: ${stock_value}"
          }

          echo "============================================================"
