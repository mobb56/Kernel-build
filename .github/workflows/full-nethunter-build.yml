          # Make sure this really is a module.
          if "module_exit(" not in text:
              raise SystemExit(
                  "ERROR: module_exit() registration was not found. "
                  "Refusing to modify source."
              )

          # --------------------------------------------------------
          # Remove the existing standalone destroy call.
          #
          # Only one exists, so this is deterministic.
          # --------------------------------------------------------

          destroy_line = re.compile(
              r'(?m)^[ \t]*'
              r'wlan_hdd_state_ctrl_param_destroy\(\);'
              r'[ \t]*\n?'
          )

          new_text, removed = destroy_line.subn(
              "",
              text,
              count=1
          )

          if removed != 1:
              raise SystemExit(
                  "ERROR: could not safely remove the existing "
                  "destroy call."
              )

          # --------------------------------------------------------
          # Locate the one and only hdd_driver_unload().
          # --------------------------------------------------------

          unload_pos = new_text.find(UNLOAD)

          if unload_pos < 0:
              raise SystemExit(
                  "ERROR: hdd_driver_unload() disappeared unexpectedly."
              )

          # --------------------------------------------------------
          # Insert destroy immediately after hdd_driver_unload().
          # --------------------------------------------------------

          line_end = new_text.find("\n", unload_pos)

          if line_end < 0:
              line_end = len(new_text)

          insertion = (
              "\n"
              "    wlan_hdd_state_ctrl_param_destroy();"
          )

          new_text = (
              new_text[:line_end]
              + insertion
              + new_text[line_end:]
          )

          path.write_text(new_text)

