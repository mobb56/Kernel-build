          if grep -Fq 'hdd_deinit_frame_injection(adapter);' "${MAIN_C}"; then
            echo "Frame-injection deinitialization already exists."
          else
            TMP_C="${MAIN_C}.tmp"

            awk '
              BEGIN {
                in_close = 0
                inserted = 0
              }

              /static void __hdd_close_adapter[[:space:]]*\(/ {
                in_close = 1
              }

              {
                print

                if (in_close &&
                    !inserted &&
                    $0 ~ /^[[:space:]]*hdd_adapter_feature_update_work_deinit\(adapter\);[[:space:]]*$/) {
                  print ""
                  print "#ifdef FEATURE_FRAME_INJECTION_SUPPORT"
                  print "    hdd_deinit_frame_injection(adapter);"
                  print "#endif"
                  inserted = 1
                  in_close = 0
                }
              }

              END {
                if (!inserted) {
                  exit 1
                }
              }
            ' "${MAIN_C}" > "${TMP_C}"

            test -s "${TMP_C}"
            mv "${TMP_C}" "${MAIN_C}"

            echo "Frame-injection deinitialization inserted."
          fi

          echo
          echo "=== Verifying correct deinitialization location ==="

          grep -n -A5 -B5 \
            'hdd_deinit_frame_injection(adapter);' \
            "${MAIN_C}"

          echo
          echo "=== Frame-injection deinitialization passed ==="
          
      # ============================================================
      # 33. APPLY 4.19 CAP_NET_RAW COMPATIBILITY
      #
      # The older injection security implementation can use credential
      # APIs that are inappropriate for this 4.19 kernel.
      #
      # Only make the replacement if the expected function exists.
      # ============================================================

      - name: Apply 4.19 injection capability compatibility
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          SECURITY_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c"

          test -f "${SECURITY_C}"

          echo "Relevant capability code:"

          grep -n \
            -A15 \
            -B5 \
            "hdd_check_injection_capability" \
            "${SECURITY_C}" \
            || true

          if grep -Fq \
            "capable(CAP_NET_RAW)" \
            "${SECURITY_C}"; then

            echo "CAP_NET_RAW compatibility already present."

          elif grep -Fq \
            "hdd_check_injection_capability" \
            "${SECURITY_C}"; then

            python3 - "${SECURITY_C}" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          pattern = re.compile(
              r"""
              hdd_check_injection_capability
              \s*\(
              [^)]*
              \)
              \s*\{
              .*?
              \n\}
              """,
              re.S | re.X
          )

          match = pattern.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: could not safely locate "
                  "hdd_check_injection_capability body"
              )

          replacement = """hdd_check_injection_capability(struct task_struct *task)
          {
                  return capable(CAP_NET_RAW);
          }"""

          text = text[:match.start()] + replacement + text[match.end():]

          path.write_text(text)
          PY

          else
            echo "ERROR: expected injection capability function was not found."
            exit 1
          fi

          echo
          echo "Final capability implementation:"

          grep -n \
            -A8 \
            -B3 \
            "hdd_check_injection_capability" \
            "${SECURITY_C}"

          grep -Fq \
            "capable(CAP_NET_RAW)" \
            "${SECURITY_C}"




            

      # ============================================================
      # 34. ENABLE QCACLD3 MONITOR MODE + FRAME INJECTION IN KBUILD
      #
      # These are Kbuild variables.
      # They MUST NOT become CONFIG_* entries in .config.
      # ============================================================
                      
                         
      - name: Enable QCACLD3 injection Kbuild features
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          KBUILD_FILE="drivers/staging/qcacld-3.0/Kbuild"

          test -f "${KBUILD_FILE}"

          echo "=== Enable QCACLD3 injection Kbuild features ==="

          # ------------------------------------------------------------
          # Remove previous custom registrations from earlier workflow
          # attempts. Do not touch the original QCACLD3 object lists.
          # ------------------------------------------------------------

          sed -i \
            '\|HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|ccflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|ccflags-y += -DFEATURE_MONITOR_MODE_SUPPORT|d' \
            "${KBUILD_FILE}"

          # ------------------------------------------------------------
          # Add the QCACLD3 feature variables and compiler defines near
          # the beginning of the Kbuild file.
          # ------------------------------------------------------------

          sed -i '1i\
          CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y\
          CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y\
          ccflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT\
          ccflags-y += -DFEATURE_MONITOR_MODE_SUPPORT\
          ' "${KBUILD_FILE}"

          echo
          echo "=== Verify QCACLD3 feature definitions ==="

          grep -nF \
            'CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y' \
            "${KBUILD_FILE}"

          grep -nF \
            'CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y' \
            "${KBUILD_FILE}"

          grep -nF \
            'ccflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT' \
            "${KBUILD_FILE}"

          grep -nF \
            'ccflags-y += -DFEATURE_MONITOR_MODE_SUPPORT' \
            "${KBUILD_FILE}"

          # ------------------------------------------------------------
          # Register HDD frame injection object.
          #
          # The existing Kbuild uses:
          #
          #     OBJS := $(HDD_OBJS)
          #
          # We insert the injection object immediately before that
          # aggregation point.
          # ------------------------------------------------------------

           echo
          echo "=== Register HDD frame injection objects ==="

          # Remove any previous HDD injection registrations.
          sed -i \
            '\|HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o|d' \
            "${KBUILD_FILE}"

          echo "Locating HDD OBJS aggregation point..."

          if ! grep -Eq \
            '^[[:space:]]*OBJS[[:space:]]*:=[[:space:]]*\$\(HDD_OBJS\)' \
            "${KBUILD_FILE}"; then
            echo "ERROR: HDD OBJS aggregation point was not found."
            grep -n -E 'OBJS.*HDD_OBJS' "${KBUILD_FILE}" || true
            exit 1
          fi

          TMP_KBUILD="${KBUILD_FILE}.tmp"

          awk '
          BEGIN {
            inserted = 0
          }

          !inserted &&
          $0 ~ /^[[:space:]]*OBJS[[:space:]]*:=[[:space:]]*\$\(HDD_OBJS\)/ {
            print "HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o"
            print "HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o"
            print "HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o"
            print "HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o"
            inserted = 1
          }

          {
            print
          }

          END {
            if (!inserted)
              exit 1
          }
          ' "${KBUILD_FILE}" > "${TMP_KBUILD}"

          mv "${TMP_KBUILD}" "${KBUILD_FILE}"

          echo
          echo "=== Verify HDD injection object registration ==="

          for obj in \
            wlan_hdd_frame_inject.o \
            wlan_hdd_frame_validate.o \
            wlan_hdd_inject_security.o \
            wlan_hdd_frame_inject_debug.o
          do
            if ! grep -Fq \
              "HDD_OBJS += \$(HDD_SRC_DIR)/${obj}" \
              "${KBUILD_FILE}"; then
              echo "ERROR: Missing HDD injection object: ${obj}"
              exit 1
            fi
          done

          grep -n -B5 -A8 \
            -E '^[[:space:]]*OBJS[[:space:]]*:=[[:space:]]*\$\(HDD_OBJS\)' \
            "${KBUILD_FILE}"

          echo
          echo "HDD injection objects registered correctly."

          echo
          echo "=== Register WMA frame injection object ==="

          sed -i \
            '\|WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o|d' \
            "${KBUILD_FILE}"

          WMA_OBJS_LINE="$(
            awk '
              index($0, "$(WMA_OBJS)") {
                print NR
                exit
              }
            ' "${KBUILD_FILE}"
          )"

          if [ -z "${WMA_OBJS_LINE}" ]; then
            echo "ERROR: WMA OBJS aggregation point was not found."
            grep -nF '$(WMA_OBJS)' "${KBUILD_FILE}" || true
            exit 1
          fi

          echo "WMA OBJS aggregation line: ${WMA_OBJS_LINE}"

          sed -i \
            "${WMA_OBJS_LINE}i WMA_OBJS += \$(WMA_SRC_DIR)/wma_frame_inject.o" \
            "${KBUILD_FILE}"

          echo
          echo "=== Verify injection object registration ==="

          HDD_INJECT_COUNT="$(
            grep -Fc \
              'HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o' \
              "${KBUILD_FILE}"
          )"

          WMA_INJECT_COUNT="$(
            grep -Fc \
              'WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o' \
              "${KBUILD_FILE}"
          )"

          if [ "${HDD_INJECT_COUNT}" -ne 1 ]; then
            echo "ERROR: HDD injection object count = ${HDD_INJECT_COUNT}"
            exit 1
          fi

          if [ "${WMA_INJECT_COUNT}" -ne 1 ]; then
            echo "ERROR: WMA injection object count = ${WMA_INJECT_COUNT}"
            exit 1
          fi

          echo
          echo "=== HDD injection placement ==="

          grep -n -B3 -A3 \
            -F 'HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o' \
            "${KBUILD_FILE}"

          echo
          echo "=== WMA injection placement ==="

          grep -n -B3 -A3 \
            -F 'WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o' \
            "${KBUILD_FILE}"

          echo
          echo "QCACLD3 injection Kbuild configuration complete."

          # ------------------------------------------------------------
          # Verify that each custom object is registered exactly once.
          # ------------------------------------------------------------

          echo
          echo "=== Verify injection object registration ==="

          HDD_INJECT_COUNT="$(
            grep -Fc \
              'HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o' \
              "${KBUILD_FILE}"
          )"

          WMA_INJECT_COUNT="$(
            grep -Fc \
              'WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o' \
              "${KBUILD_FILE}"
          )"

          if [ "${HDD_INJECT_COUNT}" -ne 1 ]; then
            echo "ERROR: Expected exactly one HDD injection object registration; found ${HDD_INJECT_COUNT}."
            exit 1
          fi

          if [ "${WMA_INJECT_COUNT}" -ne 1 ]; then
            echo "ERROR: Expected exactly one WMA injection object registration; found ${WMA_INJECT_COUNT}."
            exit 1
          fi

          echo
          echo "=== HDD injection placement ==="

          grep -n -B3 -A3 \
            -F 'HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o' \
            "${KBUILD_FILE}"

          echo
          echo "=== WMA injection placement ==="

          grep -n -B3 -A3 \
            -F 'WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o' \
            "${KBUILD_FILE}"

          # ------------------------------------------------------------
          # Final verification.
          # ------------------------------------------------------------

          echo
          echo "=== Final QCACLD3 injection Kbuild configuration ==="

          grep -n -E \
            'CONFIG_FEATURE_(FRAME_INJECTION|MONITOR_MODE)_SUPPORT|wlan_hdd_frame_inject\.o|wma_frame_inject\.o|FEATURE_(FRAME_INJECTION|MONITOR_MODE)_SUPPORT' \
            "${KBUILD_FILE}"

          echo
          echo "QCACLD3 injection Kbuild configuration complete."


                        

      - name: Inspect exact HDD Kbuild structure
        if: always()
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          KBUILD_FILE="drivers/staging/qcacld-3.0/Kbuild"

