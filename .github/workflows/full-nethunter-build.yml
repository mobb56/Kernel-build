            python3 - "${SECURITY_C}" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          pattern = re.compile(
              r"""
              hdd_check_injection_capability
              \s*\(
              [^)]*
              \)
              \s*\{
              .*?
              \n\}
              """,
              re.S | re.X
          )

          match = pattern.search(text)

          if not match:
              raise SystemExit(
