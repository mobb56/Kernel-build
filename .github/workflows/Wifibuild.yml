name: Moto G9 Power cebu NetHunter

on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "Run the kernel compilation"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  KERNEL_BRANCH: lineage-23.2
  KERNEL_COMMIT: 39bcecd5c63df849923b1faadc9cde482648a1a1
  NETHUNTER_REPO: https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git
  NETHUNTER_BRANCH: nethunter-lineage-23.2
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out
  EXPECTED_RELEASE: "4.19.325-cip135-st19-perf-g39bcecd5c63d"
  LOCALVERSION_SUFFIX: "-g39bcecd5c63d"

jobs:
  build:
    name: Build cebu NetHunter kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex \
            gcc-aarch64-linux-gnu git kmod libssl-dev \
            curl python3 rsync unzip wget xz-utils zip \
            device-tree-compiler

      - name: Install Android LLVM clang-r563880c
        shell: bash
        run: |
          set -euo pipefail
          NDK_ARCHIVE="android-ndk-r29-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/${NDK_ARCHIVE}"
          NDK_SHA1="87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b"
          NDK_ROOT="${GITHUB_WORKSPACE}/android-ndk-r29"
          ANDROID_LLVM_DIR="${GITHUB_WORKSPACE}/android-llvm"
          NDK_ZIP="${RUNNER_TEMP}/${NDK_ARCHIVE}"
          rm -rf "${NDK_ROOT}" "${ANDROID_LLVM_DIR}"
          rm -f "${NDK_ZIP}"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${NDK_ZIP}" "${NDK_URL}"
          echo "${NDK_SHA1}  ${NDK_ZIP}" | sha1sum -c -
          unzip -q "${NDK_ZIP}" -d "${GITHUB_WORKSPACE}"
          cp -a "${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64" "${ANDROID_LLVM_DIR}"
          "${ANDROID_LLVM_DIR}/bin/clang" --version | grep -F "clang version 21.0.0"

      - name: Prepare Android LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          D="${GITHUB_WORKSPACE}/android-llvm"
          B="${D}/bin"
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-strip llvm-readelf llvm-objdump; do
            test -x "${B}/${t}"
          done
          echo "LLVM_DIR=${D}" >> "${GITHUB_ENV}"
          echo "LLVM_BIN=${B}" >> "${GITHUB_ENV}"
          echo "PATH=${B}:${PATH}" >> "${GITHUB_ENV}"

      - name: Verify stock cebu configuration
        shell: bash
        run: |
          set -euxo pipefail
          test -f cebu-stock.config
          test -s cebu-stock.config
          wc -l cebu-stock.config

      - name: Clone cebu kernel source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf kernel
          git clone --branch "${KERNEL_BRANCH}" --single-branch \
            "${KERNEL_REPO}" kernel
          cd kernel
          git checkout "${KERNEL_COMMIT}"
          test "$(git rev-parse HEAD)" = "${KERNEL_COMMIT}"
          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          test -d drivers/staging/qcacld-3.0

      - name: Clone NetHunter reference
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf nethunter-reference
          git clone --depth=1 --branch "${NETHUNTER_BRANCH}" \
            "${NETHUNTER_REPO}" nethunter-reference
          test -d nethunter-reference/drivers/staging/qcacld-3.0

      - name: Verify required injection sources
        shell: bash
        run: |
          set -euxo pipefail
          NH="nethunter-reference/drivers/staging/qcacld-3.0"
          for f in \
            "${NH}/core/hdd/src/wlan_hdd_frame_inject.c" \
            "${NH}/core/hdd/src/wlan_hdd_frame_validate.c" \
            "${NH}/core/hdd/src/wlan_hdd_inject_security.c" \
            "${NH}/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
            "${NH}/core/wma/src/wma_frame_inject.c" \
            "${NH}/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "${NH}/core/wma/inc/wma_frame_inject.h"
          do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All injection sources present."

      - name: Extract HDD_FRAME_INJECT_ATTR enum values
        shell: bash
        run: |
          set -euo pipefail
          HDR="nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject.h"
          test -f "$HDR"

          echo "=== enum block ==="
          awk '/enum[[:space:]]+hdd_frame_inject_attr/,/};/' "$HDR" || true

          ENUM_RAW="$(awk '/enum[[:space:]]+hdd_frame_inject_attr/,/};/' "$HDR")"
          DATA_ID="$(printf '%s\n' "$ENUM_RAW" | awk -F'[=,]' '/HDD_FRAME_INJECT_ATTR_FRAME_DATA/ {gsub(/[^0-9]/,"",$2); print $2; exit}')"
          LEN_ID="$(printf '%s\n'  "$ENUM_RAW" | awk -F'[=,]' '/HDD_FRAME_INJECT_ATTR_FRAME_LEN/  {gsub(/[^0-9]/,"",$2); print $2; exit}')"
          VDEV_ID="$(printf '%s\n' "$ENUM_RAW" | awk -F'[=,]' '/HDD_FRAME_INJECT_ATTR_VDEV_ID/ {gsub(/[^0-9]/,"",$2); print $2; exit}')"

          [ -z "$DATA_ID" ] && DATA_ID=1
          [ -z "$LEN_ID" ] && LEN_ID=2
          [ -z "$VDEV_ID" ] && VDEV_ID=3

          echo "ATTR_FRAME_DATA=$DATA_ID"
          echo "ATTR_FRAME_LEN=$LEN_ID"
          echo "ATTR_VDEV_ID=$VDEV_ID"

          echo "ATTR_FRAME_DATA=$DATA_ID" >> "$GITHUB_ENV"
          echo "ATTR_FRAME_LEN=$LEN_ID"   >> "$GITHUB_ENV"
          echo "ATTR_VDEV_ID=$VDEV_ID"    >> "$GITHUB_ENV"

      - name: Load stock cebu configuration
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"
          cp "${GITHUB_WORKSPACE}/cebu-stock.config" "${OUT_DIR}/.config"
          test -s "${OUT_DIR}/.config"
          cp "${OUT_DIR}/.config" "${OUT_DIR}/stock-before-nethunter.config"

      - name: Create NetHunter additive configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel/nethunter-config
          cat > kernel/nethunter-config/cebu-nethunter.config <<'EOF'
          CONFIG_HID=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=m
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y
          CONFIG_BT_HIDP=m
          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIVHCI=m
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_EEM=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_GENERIC=y
          CONFIG_USB_ACM=m
          CONFIG_USB_USBNET=m
          CONFIG_USB_NET_CDCETHER=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_RTL8150=m
          CONFIG_USB_RTL8152=m
          CONFIG_PACKET=y
          CONFIG_TUN=y
          CONFIG_NET_NS=y
          CONFIG_VETH=m
          CONFIG_BRIDGE=m
          CONFIG_BRIDGE_NETFILTER=m
          CONFIG_VLAN_8021Q=m
          CONFIG_DUMMY=m
          CONFIG_MACVLAN=m
          CONFIG_IPVLAN=m
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=m
          CONFIG_NF_NAT=m
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NETFILTER_XT_MARK=m
          CONFIG_NETFILTER_XT_NAT=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
          CONFIG_NETFILTER_XT_MATCH_MARK=m
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=m
          CONFIG_FUSE_FS=m
          CONFIG_OVERLAY_FS=m
          CONFIG_BLK_DEV_LOOP=m
          CONFIG_SQUASHFS=m
          CONFIG_SQUASHFS_XATTR=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m
          CONFIG_WLAN=y
          CONFIG_QCA_CLD_WLAN=m
          EOF
          test -s kernel/nethunter-config/cebu-nethunter.config

      - name: Merge NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel
          scripts/kconfig/merge_config.sh \
            -m -O "${OUT_DIR}" \
            "${OUT_DIR}/stock-before-nethunter.config" \
            nethunter-config/cebu-nethunter.config
          test -s "${OUT_DIR}/.config"

      - name: Resolve Kconfig dependencies
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${LLVM_BIN}:${PATH}"
          make O="${OUT_DIR}" ARCH="${ARCH}" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" olddefconfig

      - name: Set kernel release to stock-compatible release
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          C="${OUT_DIR}/.config"
          scripts/config --file "$C" --disable LOCALVERSION_AUTO --set-str LOCALVERSION "-perf"
          : > .scmversion
          grep -Fxq 'CONFIG_LOCALVERSION="-perf"' "$C"
          grep -Fxq '# CONFIG_LOCALVERSION_AUTO is not set' "$C"
          R="$(make -s O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            LOCALVERSION="${LOCALVERSION_SUFFIX}" kernelrelease)"
          echo "RELEASE=${R}"
          test "${R}" = "${EXPECTED_RELEASE}"

      - name: Import QCACLD3 injection sources
        shell: bash
        run: |
          set -euxo pipefail
          K="${GITHUB_WORKSPACE}/kernel/drivers/staging/qcacld-3.0"
          N="${GITHUB_WORKSPACE}/nethunter-reference/drivers/staging/qcacld-3.0"

          cp "${N}/core/hdd/src/wlan_hdd_frame_inject.c"        "${K}/core/hdd/src/"
          cp "${N}/core/hdd/src/wlan_hdd_frame_validate.c"      "${K}/core/hdd/src/"
          cp "${N}/core/hdd/src/wlan_hdd_inject_security.c"     "${K}/core/hdd/src/"
          cp "${N}/core/hdd/src/wlan_hdd_frame_inject_debug.c"  "${K}/core/hdd/src/"
          cp "${N}/core/wma/src/wma_frame_inject.c"             "${K}/core/wma/src/"

          mkdir -p "${K}/core/wma/inc"

          find "${N}" -type f \( \
              -name '*frame*inject*.h' -o \
              -name '*inject*security*.h' -o \
              -name '*frame*validate*.h' \) -print | while read -r h; do
            rel="${h#${N}/}"
            mkdir -p "$(dirname "${K}/${rel}")"
            cp "$h" "${K}/${rel}"
            echo "Imported header: ${rel}"
          done

          test -f "${K}/core/hdd/inc/wlan_hdd_frame_inject.h"
          test -f "${K}/core/wma/inc/wma_frame_inject.h"






      - name: Fix relative includes in imported injection files
        working-directory: kernel
        shell: bash
        run: |
           set -euo pipefail
    
             echo "=== Fixing HDD injection .c include paths ==="
             HDD_SRC="drivers/staging/qcacld-3.0/core/hdd/src"
  
             # Fix all imported HDD injection C files
              for f in wlan_hdd_frame_inject.c wlan_hdd_frame_validate.c wlan_hdd_inject_security.c wlan_hdd_frame_inject_debug.c; do
              if [ -f "${HDD_SRC}/${f}" ]; then
              echo "Patching ${f}..."
             # Replace the flat includes with the correct relative paths
              sed -i 's|#include "wlan_hdd_frame_inject.h"|#include "../inc/wlan_hdd_frame_inject.h"|g' "${HDD_SRC}/${f}"
              sed -i 's|#include "wlan_hdd_frame_validate.h"|#include "../inc/wlan_hdd_frame_validate.h"|g' "${HDD_SRC}/${f}"
              sed -i 's|#include "wlan_hdd_inject_security.h"|#include "../inc/wlan_hdd_inject_security.h"|g' "${HDD_SRC}/${f}"
        
             # Fix the WMA include that is currently failing
              sed -i 's|#include "wma_frame_inject.h"|#include "../../wma/inc/wma_frame_inject.h"|g' "${HDD_SRC}/${f}"
            fi
           done

              echo "=== Fixing WMA injection .c include paths ==="
              WMA_SRC="drivers/staging/qcacld-3.0/core/wma/src"
    
            if [ -f "${WMA_SRC}/wma_frame_inject.c" ]; then
            echo "Patching wma_frame_inject.c..."
            sed -i 's|#include "wma_frame_inject.h"|#include "../inc/wma_frame_inject.h"|g' "${WMA_SRC}/wma_frame_inject.c"
            sed -i 's|#include "wlan_hdd_frame_inject.h"|#include "../../hdd/inc/wlan_hdd_frame_inject.h"|g' "${WMA_SRC}/wma_frame_inject.c"
           fi

            echo
            echo "=== Verify include lines ==="
            grep -n '#include.*inject.*\.h' "${HDD_SRC}/wlan_hdd_frame_inject.c" | head -10
            grep -n '#include.*inject.*\.h' "${WMA_SRC}/wma_frame_inject.c" | head -10

      - name: Remove duplicate injection helper definitions
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          FH="drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject.h"
          SH="drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_inject_security.h"
          test -f "$FH"
          test -f "$SH"

          cat > /tmp/dedupe.awk <<'AWK'
          function flush_buf(   i) {
              for (i = 1; i <= n; i++) print buf[i]
              n = 0
              delete buf
          }
          BEGIN {
              active = 0
              n = 0
              depth = 0
              started = 0
              remove = 0
          }
          !active && /static[[:space:]]+inline[[:space:]]+QDF_STATUS[[:space:]]+hdd_(get|reset)_injection_stats[[:space:]]*\(/ {
              active = 1
              depth = 0
              started = 0
              remove = 1
              n = 0
              buf[++n] = $0
              line = $0
              opens = gsub(/\{/, "{", line)
              closes = gsub(/\}/, "}", line)
              depth += opens - closes
              if (opens > 0) started = 1
              if (started && depth <= 0) {
                  active = 0
                  remove = 0
                  n = 0
                  delete buf
              }
              next
          }
          active {
              buf[++n] = $0
              line = $0
              opens = gsub(/\{/, "{", line)
              closes = gsub(/\}/, "}", line)
              depth += opens - closes
              if (opens > 0) started = 1
              if (started && depth <= 0) {
                  active = 0
                  remove = 0
                  n = 0
                  delete buf
              }
              next
          }
          { print }
          AWK

          awk -f /tmp/dedupe.awk "$FH" > "${FH}.new"
          mv "${FH}.new" "$FH"

          if grep -q 'static inline QDF_STATUS hdd_get_injection_stats' "$FH"; then
            echo "WARN: hdd_get_injection_stats still present in $FH"
          fi
          if grep -q 'static inline QDF_STATUS hdd_reset_injection_stats' "$FH"; then
            echo "WARN: hdd_reset_injection_stats still present in $FH"
          fi

          grep -n 'hdd_get_injection_stats\|hdd_reset_injection_stats' "$SH" || true

      - name: Integrate injection context into HDD adapter
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          MH="drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h"
          test -f "$MH"

          if grep -q 'struct hdd_injection_ctx \*injection_ctx;' "$MH"; then
            echo "PASS: injection_ctx already present."
            exit 0
          fi

          cat > /tmp/add_ctx.awk <<'AWK'
          BEGIN { in_struct = 0; depth = 0; started = 0; inserted = 0 }
          !in_struct && /^struct[[:space:]]+hdd_adapter[[:space:]]*\{/ {
              in_struct = 1
              print
              line = $0
              opens = gsub(/\{/, "{", line)
              closes = gsub(/\}/, "}", line)
              depth += opens - closes
              if (opens > 0) started = 1
              next
          }
          in_struct {
              line = $0
              opens = gsub(/\{/, "{", line)
              closes = gsub(/\}/, "}", line)
              if (started && depth == 1 && !inserted && $0 ~ /^[[:space:]]*};[[:space:]]*$/) {
                  print "#ifdef FEATURE_FRAME_INJECTION_SUPPORT"
                  print "\tstruct hdd_injection_ctx *injection_ctx;"
                  print "#endif"
                  inserted = 1
              }
              depth += opens - closes
              print
              if (started && depth == 0) { in_struct = 0 }
              next
          }
          { print }
          END {
              if (!inserted) {
                  print "ERROR: could not insert injection_ctx" > "/dev/stderr"
                  exit 2
              }
          }
          AWK

          awk -f /tmp/add_ctx.awk "$MH" > "${MH}.new"
          mv "${MH}.new" "$MH"

          grep -n -B2 -A2 'injection_ctx' "$MH"

      - name: Integrate injection API into HDD main
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          MC="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"
          test -f "$MC"

          sed -i '/wlan_hdd_frame_inject\.h/d' "$MC"

          cat > /tmp/add_inc.awk <<'AWK'
          BEGIN { inserted = 0 }
          {
              if (!inserted && $0 ~ /^#include[[:space:]]+/) {
                  print "#include \"../inc/wlan_hdd_frame_inject.h\""
                  inserted = 1
              }
              print
          }
          END {
              if (!inserted) {
                  print "ERROR: no #include line found" > "/dev/stderr"
                  exit 2
              }
          }
          AWK

          awk -f /tmp/add_inc.awk "$MC" > "${MC}.new"
          mv "${MC}.new" "$MC"

          grep -Fq 'wlan_hdd_frame_inject.h' "$MC"

      - name: Integrate frame-injection init and deinit
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          MC="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"
          test -f "$MC"

          cat > /tmp/inject_init_deinit.awk <<'AWK'
          function detect_open(line) {
              return line ~ /^[A-Za-z_][A-Za-z0-9_ \t\*]*[[:space:]]+__hdd_open_adapter[[:space:]]*\(/ || \
                     line ~ /^[A-Za-z_][A-Za-z0-9_ \t\*]*[[:space:]]+hdd_open_adapter[[:space:]]*\(/
          }
          function detect_close(line) {
              return line ~ /^[A-Za-z_][A-Za-z0-9_ \t\*]*[[:space:]]+__hdd_close_adapter[[:space:]]*\(/ || \
                     line ~ /^[A-Za-z_][A-Za-z0-9_ \t\*]*[[:space:]]+hdd_close_adapter[[:space:]]*\(/
          }
          BEGIN {
              in_open = 0; in_close = 0
              open_depth = 0; close_depth = 0
              open_started = 0; close_started = 0
              open_inserted = 0; close_inserted = 0
          }
          !in_open && !in_close && detect_open($0) {
              in_open = 1
              print
              line = $0
              opens = gsub(/\{/, "{", line)
              closes = gsub(/\}/, "}", line)
              open_depth += opens - closes
              if (opens > 0) open_started = 1
              if (open_started && !open_inserted) {
                  print ""
                  print "#ifdef FEATURE_FRAME_INJECTION_SUPPORT"
                  print "\t{"
                  print "\t\tQDF_STATUS __s = hdd_init_frame_injection(adapter);"
                  print "\t\tif (QDF_IS_STATUS_ERROR(__s))"
                  print "\t\t\thdd_err(\"frame injection init failed: %d\", __s);"
                  print "\t}"
                  print "#endif"
                  open_inserted = 1
              }
              next
          }
          in_open {
              print
              line = $0
              opens = gsub(/\{/, "{", line)
              closes = gsub(/\}/, "}", line)
              open_depth += opens - closes
              if (open_started && open_depth == 0) in_open = 0
              next
          }
          !in_open && !in_close && detect_close($0) {
              in_close = 1
              print
              line = $0
              opens = gsub(/\{/, "{", line)
              closes = gsub(/\}/, "}", line)
              close_depth += opens - closes
              if (opens > 0) close_started = 1
              next
          }
          in_close {
              line = $0
              opens = gsub(/\{/, "{", line)
              closes = gsub(/\}/, "}", line)
              close_depth += opens - closes
              if (close_started && close_depth == 0 && !close_inserted) {
                  print "#ifdef FEATURE_FRAME_INJECTION_SUPPORT"
                  print "\thdd_deinit_frame_injection(adapter);"
                  print "#endif"
                  close_inserted = 1
              }
              print
              if (close_started && close_depth == 0) in_close = 0
              next
          }
          { print }
          AWK

          awk -f /tmp/inject_init_deinit.awk "$MC" > "${MC}.new"
          mv "${MC}.new" "$MC"

          grep -n 'hdd_init_frame_injection\|hdd_deinit_frame_injection' "$MC" || true



      - name: Route injection completion in wma_mgmt.c
        working-directory: kernel
        shell: bash
        run: |
           set -euo pipefail
           WM="drivers/staging/qcacld-3.0/core/wma/src/wma_mgmt.c"
           test -f "$WM"

            if grep -q 'NETHUNTER_INJECTION_COMPLETION_BRIDGE' "$WM"; then
            echo "PASS: bridge already present."
            exit 0
           fi

            if ! grep -Fq '#include "../inc/wma_frame_inject.h"' "$WM"; then
            cat > /tmp/add_inc2.awk <<'AWK'
            BEGIN { inserted = 0 }
           {
              if (!inserted && $0 ~ /^#include[[:space:]]+/) {
            print "#include \"../inc/wma_frame_inject.h\""
            inserted = 1
           }
             print
           }
            AWK
             awk -f /tmp/add_inc2.awk "$WM" > "${WM}.new"
             mv "${WM}.new" "$WM"
           fi

            cat > /tmp/bridge.awk <<'AWK'
            BEGIN { inserted = 0 }
           !inserted && /mgmt_txrx_get_nbuf[[:space:]]*\(/ {
              print "        /* NETHUNTER_INJECTION_COMPLETION_BRIDGE */"
              print "#ifdef FEATURE_FRAME_INJECTION_SUPPORT"
              print "        if (WMA_IS_INJECTION_DESC_ID(desc_id)) {"
              print "                QDF_STATUS inj_status = wma_handle_injection_fw_response("
              print "                        wma_handle, desc_id, status);"
              print "                if (QDF_IS_STATUS_ERROR(inj_status))"
              print "                        wma_err(\"injection completion failed: %d\", inj_status);"
              print "                return 0;"
              print "        }"
              print "#endif"
             inserted = 1
           }
           { print }
           END {
               if (!inserted) {
              print "WARN: mgmt_txrx_get_nbuf call not found; bridge not inserted." > "/dev/stderr"
            }
           }
           AWK

             awk -f /tmp/bridge.awk "$WM" > "${WM}.new"
             mv "${WM}.new" "$WM"

              grep -n 'NETHUNTER_INJECTION_COMPLETION_BRIDGE' "$WM" || true
    
      - name: Fix monitor VDEV policy-manager lookup
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          PM="drivers/staging/qcacld-3.0/components/cmn_services/policy_mgr/src/wlan_policy_mgr_action.c"
          test -f "$PM"

          if ! grep -q '#include <wlan_objmgr_vdev_obj.h>' "$PM"; then
            cat > /tmp/add_objmgr.awk <<'AWK'
          BEGIN { inserted = 0 }
          {
              if (!inserted && $0 ~ /^#include[[:space:]]+/) {
                  print "#include <wlan_objmgr_vdev_obj.h>"
                  inserted = 1
              }
              print
          }
          AWK
            awk -f /tmp/add_objmgr.awk "$PM" > "${PM}.new"
            mv "${PM}.new" "$PM"
          fi

          if grep -q 'NETHUNTER_MONITOR_VDEV_EXCEPTION' "$PM"; then
            echo "PASS: monitor VDEV exception already present."
            exit 0
          fi

          cat > /tmp/pm_patch.awk <<'AWK'
          BEGIN {
              in_func = 0
              brace_depth = 0
              started = 0
              inserted = 0
              notfound_seen = 0
              in_notfound = 0
              nf_depth = 0
              nf_started = 0
          }
          !in_func && /QDF_STATUS[[:space:]]+policy_mgr_update_connection_info[[:space:]]*\(/ {
              in_func = 1
              print
              line = $0
              opens = gsub(/\{/, "{", line)
              closes = gsub(/\}/, "}", line)
              brace_depth += opens - closes
              if (opens > 0) started = 1
              next
          }
          in_func && !in_notfound && !inserted && \
              ( $0 ~ /if[[:space:]]*\([[:space:]]*![[:space:]]*found[[:space:]]*\)[[:space:]]*\{/ || \
                $0 ~ /if[[:space:]]*\([[:space:]]*found[[:space:]]*==[[:space:]]*(false|0)[[:space:]]*\)[[:space:]]*\{/ || \
                $0 ~ /if[[:space:]]*\([[:space:]]*QDF_STATUS_E_FAILURE[[:space:]]*==[[:space:]]*status[[:space:]]*\)[[:space:]]*\{/ ) {
              print
              print "\t\t/* NETHUNTER_MONITOR_VDEV_EXCEPTION */"
              print "\t\t{"
              print "\t\t\tstruct wlan_objmgr_vdev *monitor_vdev;"
              print "\t\t\tenum QDF_OPMODE monitor_opmode;"
              print "\t\t\tmonitor_vdev = wlan_objmgr_get_vdev_by_id_from_psoc("
              print "\t\t\t\tpsoc, vdev_id, WLAN_LEGACY_MAC_ID);"
              print "\t\t\tif (monitor_vdev) {"
              print "\t\t\t\tmonitor_opmode = wlan_vdev_mlme_get_opmode(monitor_vdev);"
              print "\t\t\t\twlan_objmgr_vdev_release_ref(monitor_vdev, WLAN_LEGACY_MAC_ID);"
              print "\t\t\t\tif (monitor_opmode == QDF_MONITOR_MODE) {"
              print "\t\t\t\t\tpolicy_mgr_debug(\"Skipping concurrency-list lookup for monitor vdev_id %d\", vdev_id);"
              print "\t\t\t\t\treturn QDF_STATUS_SUCCESS;"
              print "\t\t\t\t}"
              print "\t\t\t}"
              print "\t\t}"
              inserted = 1
              in_notfound = 1
              line = $0
              opens = gsub(/\{/, "{", line)
              closes = gsub(/\}/, "}", line)
              nf_depth += opens - closes
              if (opens > 0) nf_started = 1
              next
          }
          in_notfound {
              print
              line = $0
              opens = gsub(/\{/, "{", line)
              closes = gsub(/\}/, "}", line)
              nf_depth += opens - closes
              if (nf_started && nf_depth == 0) {
                  in_notfound = 0
              }
              next
          }
          in_func {
              print
              line = $0
              opens = gsub(/\{/, "{", line)
              closes = gsub(/\}/, "}", line)
              brace_depth += opens - closes
              if (started && brace_depth == 0) {
                  in_func = 0
              }
              next
          }
          { print }
          END {
              if (!inserted) {
                  print "ERROR: no not-found branch matched in policy_mgr_update_connection_info" > "/dev/stderr"
                  exit 2
              }
          }
          AWK

          awk -f /tmp/pm_patch.awk "$PM" > "${PM}.new"
          mv "${PM}.new" "$PM"

          grep -q 'NETHUNTER_MONITOR_VDEV_EXCEPTION' "$PM"
          grep -q 'Skipping concurrency-list lookup for monitor vdev_id' "$PM"




      - name: Fix csr_get_vdev_type_nss for monitor mode
        working-directory: kernel
        shell: bash
        run: |
         set -euo pipefail
           QC="drivers/staging/qcacld-3.0"
         IMPL="$(grep -RIl --include='*.c' -E 'csr_get_vdev_type_nss[[:space:]]*\(' "$QC" 2>/dev/null | head -n1 || true)"
           if [ -z "$IMPL" ]; then
            echo "WARN: csr_get_vdev_type_nss not found"
          exit 0
         fi
          echo "Implementation: $IMPL"

            echo "=== CONTEXT ==="
           grep -n -B3 -A30 'csr_get_vdev_type_nss[[:space:]]*(' "$IMPL" | head -80

           if grep -q 'NETHUNTER_MONITOR_NSS_GUARD' "$IMPL"; then
            echo "PASS: NSS guard already present."
           exit 0
          fi

           cat > /tmp/nss_guard2.awk <<'AWK'
          BEGIN {
            armed = 0
            depth = 0
            started = 0
            inserted = 0
          }

          # Arm when we see the function name and an opening paren.
          # Do not print the guard yet - the body has not started.
          !armed && /csr_get_vdev_type_nss[[:space:]]*\(/ {
           armed = 1
           print
           next
         }

         # While armed, look for the first opening brace '{'.
          armed && !started {
            print
            line = $0
           opens = gsub(/\{/, "{", line)
           closes = gsub(/\}/, "}", line)
            if (opens > 0) {
            depth += opens - closes
            started = 1
            if (!inserted) {
                print "\t/* NETHUNTER_MONITOR_NSS_GUARD */"
                print "\tif (dev_mode == QDF_MONITOR_MODE) {"
                print "\t\t*type = QDF_MONITOR_MODE;"
                print "\t\t*nss = 1;"
                print "\t\treturn;"
                print "\t}"
                inserted = 1
            }
            if (depth == 0) {
                armed = 0
            }
          }
          next
         }

           started {
           print
           line = $0
            opens = gsub(/\{/, "{", line)
            closes = gsub(/\}/, "}", line)
            depth += opens - closes
           if (depth == 0) {
            started = 0
            armed = 0
           }
          next
         }

         { print }

         END {
            if (!inserted) {
               print "ERROR: NSS guard not inserted (function body not detected)" > "/dev/stderr"
             exit 2
           }
         }
          AWK

          awk -f /tmp/nss_guard2.awk "$IMPL" > "${IMPL}.new"
          mv "${IMPL}.new" "$IMPL"

          grep -n -A15 -B3 'NETHUNTER_MONITOR_NSS_GUARD' "$IMPL"
        



      - name: Patch hdd_set_station_ops for monitor netdev ops
        working-directory: kernel
        shell: bash
        run: |
           set -euo pipefail
            HS="drivers/staging/qcacld-3.0/core/hdd/src"
            TARGET="$(grep -RIl 'hdd_set_station_ops[[:space:]]*(struct net_device' "$HS" 2>/dev/null | head -n1 || true)"
              if [ -z "$TARGET" ]; then
               echo "WARN: hdd_set_station_ops not found"
           exit 0
           fi
             echo "Target: $TARGET"

             echo
             echo "=== ORIGINAL DEFINITION ==="
              START="$(grep -n -m1 'hdd_set_station_ops[[:space:]]*(struct net_device' "$TARGET" | cut -d: -f1)"
              if [ -z "$START" ]; then
            echo "WARN: cannot locate definition line"
             exit 0
           fi
             END=$((START + 25))
              sed -n "${START},${END}p" "$TARGET"
           echo "=== END ORIGINAL ==="
           echo

            # Find the ACTUAL symbol name used for ethtool ops in this tree.
               ETHTOOL_SYM="$(grep -oE '\b[a-zA-Z_][a-zA-Z0-9_]*ethtool_ops\b' "$TARGET" \
             | sort -u | head -n1 || true)"
           if [ -z "$ETHTOOL_SYM" ]; then
           echo "WARN: no ethtool_ops symbol found; using wlan_ethtool_ops"
            ETHTOOL_SYM="wlan_ethtool_ops"
           fi
           echo "Detected ethtool ops symbol: $ETHTOOL_SYM"

            if grep -q 'NETHUNTER_MONITOR_NETDEV_OPS' "$TARGET"; then
             echo "PASS: monitor netdev ops already present."
            exit 0
           fi

           cat > /tmp/station_ops3.awk <<AWK
            BEGIN {
             in_func = 0
             depth = 0
             started = 0
              inserted = 0
              ethtool = "$ETHTOOL_SYM"
           }

           !in_func && /hdd_set_station_ops[[:space:]]*\\(struct net_device/ {
             in_func = 1
             print
             next
           }

              in_func && !started {
               # Look for the first '{'
              line = \$0
               opens = gsub(/\\{/, "{", line)
               closes = gsub(/\\}/, "}", line)
               print
               if (opens > 0) {
               started = 1
               depth += opens - closes
             }
             next
           }

           # We just passed the opening brace; insert our monitor block
           # right after the FIRST executable line we see (which is
           # usually an assignment to dev->netdev_ops).
              started && !inserted && /dev->netdev_ops[[:space:]]*=/ {
            print "\\t/* NETHUNTER_MONITOR_NETDEV_OPS */"
            print "\\t{"
            print "\\t\\tstruct hdd_adapter *__nh_adapter = WLAN_HDD_GET_PRIV_PTR(dev);"
            print "\\t\\tif (cds_get_conparam() == QDF_GLOBAL_MONITOR_MODE ||"
            print "\\t\\t    (__nh_adapter && __nh_adapter->device_mode == QDF_MONITOR_MODE)) {"
            print "\\t\\t\\tdev->netdev_ops = &wlan_mon_drv_ops;"
            print "\\t\\t\\tdev->ethtool_ops = &" ethtool ";"
            print "\\t\\t\\treturn;"
            print "\\t\\t}"
            print "\\t}"
            inserted = 1
            print
            next
           }

            started {
               print
               line = \$0
               opens = gsub(/\\{/, "{", line)
               closes = gsub(/\\}/, "}", line)
               depth += opens - closes
               if (depth == 0) {
              in_func = 0
              started = 0
             }
              next
            }

           { print }

           END {
              if (!inserted) {
            print "ERROR: monitor block not inserted into hdd_set_station_ops" > "/dev/stderr"
            exit 2
             }
           }
           AWK

           awk -f /tmp/station_ops3.awk "$TARGET" > "${TARGET}.new"
            mv "${TARGET}.new" "$TARGET"

           echo
           echo "=== PATCHED FUNCTION ==="
              START2="$(grep -n -m1 'hdd_set_station_ops[[:space:]]*(struct net_device' "$TARGET" | cut -d: -f1)"
            END2=$((START2 + 40))
           sed -n "${START2},${END2}p" "$TARGET"

           grep -q 'NETHUNTER_MONITOR_NETDEV_OPS' "$TARGET"
           echo "PASS: monitor block inserted."
        

