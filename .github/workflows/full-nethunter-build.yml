          test \
            "$(sed -n 's/^CONFIG_AS_VERSION=//p' "${CONFIG}")" \
            = "210000"

          test \
            "$(sed -n 's/^CONFIG_LLD_VERSION=//p' "${CONFIG}")" \
            = "210000"

          echo
          echo "Stock compiler metadata verified."




      # ============================================================
      # CREATE COMPLETE NETHUNTER CONFIGURATION
      # ============================================================

      - name: Create complete NetHunter configuration
        shell: bash
        run: |
