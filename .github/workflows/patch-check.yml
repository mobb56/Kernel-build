name: Check QCACLD3 NetHunter Patch

on:
  workflow_dispatch:

jobs:
  patch-check:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT LINEAGEOS KERNEL
      # ============================================================

      - name: Checkout SM6225 kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6225
          ref: lineage-23.2
          path: kernel/motorola/sm6225
          fetch-depth: 1


      # ============================================================
      # 2. CHECKOUT CEBU DEVICE TREE
      # ============================================================

      - name: Checkout cebu device tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_cebu
          ref: lineage-23.2
          path: device/motorola/cebu
          fetch-depth: 1


      # ============================================================
      # 3. CHECKOUT SM6225 COMMON DEVICE TREE
      # ============================================================

      - name: Checkout SM6225 common device tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_sm6225-common
          ref: lineage-23.2
          path: device/motorola/sm6225-common
          fetch-depth: 1


      # ============================================================
      # 4. CLONE MOTOROLA QCACLD-3.0
      # ============================================================

      - name: Clone Motorola QCACLD3
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p vendor/qcom/opensource/wlan

          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qcacld-3.0.git \
            vendor/qcom/opensource/wlan/qcacld-3.0


      # ============================================================
      # 5. CLONE QCA WIFI HOST COMMON
      # ============================================================

      - name: Clone Motorola QCA WiFi host common
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qca-wifi-host-cmn.git \
            vendor/qcom/opensource/wlan/qca-wifi-host-cmn


      # ============================================================
      # 6. CLONE FW API
      # ============================================================

      - name: Clone Motorola FW API
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth=1 \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-fw-api.git \
            vendor/qcom/opensource/wlan/fw-api


      # ============================================================
      # 7. DOWNLOAD NETHUNTER PATCH
      # ============================================================

      - name: Download NetHunter QCACLD3 injection patch
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p patches

          PATCH_URL="https://raw.githubusercontent.com/Loukious/android_kernel_xiaomi_sm8150/patches/patches/nethunter/07_packet_injection.patch"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o patches/nethunter-qcacld3-injection.patch \
            "$PATCH_URL"

          test -s patches/nethunter-qcacld3-injection.patch

          echo
          echo "Patch successfully downloaded:"
          ls -lh patches/nethunter-qcacld3-injection.patch

          echo
          echo "Patch line count:"
          wc -l patches/nethunter-qcacld3-injection.patch


      # ============================================================
      # 8. SHOW SOURCE REVISIONS
      # ============================================================

      - name: Show source revisions
        shell: bash
        run: |
          set -u

          echo
          echo "================================================"
          echo "SOURCE REVISIONS"
          echo "================================================"

          for repo in \
            kernel/motorola/sm6225 \
            device/motorola/cebu \
            device/motorola/sm6225-common \
            vendor/qcom/opensource/wlan/qcacld-3.0 \
            vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
            vendor/qcom/opensource/wlan/fw-api
          do

            echo
            echo "----- $repo -----"

            if [ -d "$repo/.git" ]; then
              echo "Commit:"
              git -C "$repo" rev-parse HEAD

              echo "Remote:"
              git -C "$repo" remote get-url origin 2>/dev/null || true
            else
              echo "NOT FOUND"
            fi

          done


      # ============================================================
      # 9. INSPECT PATCH
      # ============================================================

      - name: Inspect NetHunter patch
        shell: bash
        run: |
          set -u

          echo
          echo "================================================"
          echo "PATCH INFORMATION"
          echo "================================================"

          echo
          echo "Patch header:"
          sed -n '1,80p' \
            patches/nethunter-qcacld3-injection.patch

          echo
          echo "Files changed:"
          grep '^diff --git ' \
            patches/nethunter-qcacld3-injection.patch \
            || true

          echo
          echo "Configuration changes:"
          grep -n -E \
            'CONFIG_FEATURE_FRAME_INJECTION_SUPPORT|FEATURE_FRAME_INJECTION_SUPPORT|INJECTION|inject' \
            patches/nethunter-qcacld3-injection.patch \
            | head -300 \
            || true


      # ============================================================
      # 10. BUILD A SYNTHETIC TREE
      #
      # The NetHunter patch expects:
      #
      # drivers/staging/qcacld-3.0
      # drivers/staging/qca-wifi-host-cmn
      #
      # Motorola stores these as external repositories.
      #
      # This step creates an isolated temporary tree containing
      # both repositories in the paths expected by the patch.
      # ============================================================

      - name: Prepare isolated patch tree
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/qcacld3-patch-test

          mkdir -p \
            /tmp/qcacld3-patch-test/drivers/staging

          cp -a \
            vendor/qcom/opensource/wlan/qcacld-3.0 \
            /tmp/qcacld3-patch-test/drivers/staging/qcacld-3.0

          cp -a \
            vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
            /tmp/qcacld3-patch-test/drivers/staging/qca-wifi-host-cmn

          cd /tmp/qcacld3-patch-test

          git init

          git config user.name "Patch Compatibility Test"

          git config user.email "patch-test@example.invalid"

          git add drivers

          git commit \
            -m "QCACLD3 compatibility test baseline"

          echo
          echo "Synthetic tree created."

          find drivers/staging \
            -maxdepth 2 \
            -type d \
            | sort \
            | head -100


      # ============================================================
      # 11. CHECK PATCH WITHOUT APPLYING IT
      # ============================================================

      - name: Check NetHunter patch compatibility
        shell: bash
        run: |
          set +e

          cd /tmp/qcacld3-patch-test

          echo
          echo "================================================"
          echo "RUNNING PATCH COMPATIBILITY CHECK"
          echo "================================================"

          git apply \
            --check \
            --verbose \
            "$GITHUB_WORKSPACE/patches/nethunter-qcacld3-injection.patch" \
            > "$GITHUB_WORKSPACE/qcacld3-patch-check.txt" \
            2>&1

          STATUS=$?

          echo
          echo "================================================"
          echo "PATCH CHECK OUTPUT"
          echo "================================================"

          cat "$GITHUB_WORKSPACE/qcacld3-patch-check.txt"

          echo
          echo "Patch check exit code:"
          echo "$STATUS"

          echo "$STATUS" \
            > "$GITHUB_WORKSPACE/qcacld3-patch-status.txt"

          # IMPORTANT:
          # Do not fail the workflow here.
          #
          # A non-zero status is useful information because it
          # tells us which files require adaptation.

          exit 0


      # ============================================================
      # 12. CHECK WHICH PATCH FILES EXIST
      # ============================================================

      - name: Compare patch paths with Motorola source
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/path-comparison.txt"

          {
            echo "QCACLD3 PATCH PATH COMPARISON"
            echo "=============================="
            echo

            grep '^diff --git ' \
              "$GITHUB_WORKSPACE/patches/nethunter-qcacld3-injection.patch" \
              | while read -r LINE
            do

              FILE_A=$(echo "$LINE" | sed 's/^diff --git a\///' | cut -d' ' -f1)

              FILE_B=$(echo "$LINE" | sed 's/^diff --git a\/[^ ]* b\///')

              if [ -f "/tmp/qcacld3-patch-test/$FILE_A" ]; then
                echo "MATCH: $FILE_A"

              elif [ -f "/tmp/qcacld3-patch-test/$FILE_B" ]; then
                echo "MATCH: $FILE_B"

              else
                echo "MISSING: $FILE_A"
              fi

            done

          } > "$REPORT"

          echo
          cat "$REPORT"


      # ============================================================
      # 13. SEARCH CURRENT SOURCE FOR INJECTION FEATURES
      # ============================================================

      - name: Search QCACLD3 injection infrastructure
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/injection-source-search.txt"

          {
            echo "CURRENT QCACLD3 INJECTION / MONITOR SUPPORT"
            echo "============================================"
            echo

            echo "=== QCACLD3 ==="

            grep -Rni \
              --exclude-dir=.git \
              -E \
              'FRAME_INJECTION|FRAME_INJECT|INJECTION|inject|testmode|NL80211_TESTMODE|radiotap|monitor' \
              vendor/qcom/opensource/wlan/qcacld-3.0 \
              2>/dev/null \
              | head -3000 \
              || true

            echo
            echo "=== QCA WIFI HOST COMMON ==="

            grep -Rni \
              --exclude-dir=.git \
              -E \
              'FRAME_INJECTION|FRAME_INJECT|INJECTION|inject|testmode|NL80211_TESTMODE|radiotap|monitor' \
              vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
              2>/dev/null \
              | head -3000 \
              || true

          } > "$REPORT"

          echo
          cat "$REPORT"


      # ============================================================
      # 14. SEARCH RELEVANT SYMBOLS
      # ============================================================

      - name: Search relevant WLAN symbols
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/symbol-search.txt"

          {
            echo "RELEVANT WLAN SYMBOL SEARCH"
            echo "==========================="
            echo

            grep -Rni \
              --exclude-dir=.git \
              -E \
              'wlan_hdd_cfg80211|wlan_hdd_cfg80211_mgmt_tx|cfg80211_mgmt_tx|ndo_start_xmit|qdf_nbuf|wmi_unified' \
              vendor/qcom/opensource/wlan/qcacld-3.0 \
              vendor/qcom/opensource/wlan/qca-wifi-host-cmn \
              2>/dev/null \
              | head -3000 \
              || true

          } > "$REPORT"

          echo
          cat "$REPORT"


      # ============================================================
      # 15. CHECK MOTOROLA BUILD CONFIGURATION
      # ============================================================

      - name: Check Motorola WLAN build configuration
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/android-build-config.txt"

          {
            echo "MOTOROLA QCACLD3 BUILD CONFIGURATION"
            echo "===================================="
            echo

            echo "=== Android.mk ==="

            sed -n '1,1200p' \
              vendor/qcom/opensource/wlan/qcacld-3.0/Android.mk \
              2>/dev/null \
              || true

            echo
            echo "=== Kconfig ==="

            sed -n '1,1200p' \
              vendor/qcom/opensource/wlan/qcacld-3.0/Kconfig \
              2>/dev/null \
              || true

            echo
            echo "=== Device configuration ==="

            grep -Rni \
              --exclude-dir=.git \
              -E \
              'qca_cld3|QCA_CLD_WLAN|WIFI_DRIVER|wlan\.ko' \
              device/motorola/cebu \
              device/motorola/sm6225-common \
              2>/dev/null \
              | head -1000 \
              || true

          } > "$REPORT"

          echo
          cat "$REPORT"


      # ============================================================
      # 16. CREATE FINAL REPORT
      # ============================================================

      - name: Create final compatibility report
        shell: bash
        run: |
          set -u

          REPORT="$GITHUB_WORKSPACE/FINAL-QCACLD3-COMPATIBILITY.txt"

          {
            echo "Moto G9 Power (cebu)"
            echo "QCACLD-3 NetHunter Patch Compatibility Report"
            echo "=============================================="
            echo

            echo "Patch compatibility exit code:"
            cat "$GITHUB_WORKSPACE/qcacld3-patch-status.txt" \
              2>/dev/null \
              || true

            echo
            echo "Interpretation:"
            echo
            echo "0 = patch applies cleanly to the synthetic"
            echo "    Motorola QCACLD3 + host-common tree."
            echo
            echo "non-zero = one or more patch changes conflict"
            echo "          or the source structure differs."
            echo

            echo "IMPORTANT:"
            echo "This workflow does NOT apply the patch."
            echo "This workflow does NOT build a kernel."
            echo "This workflow does NOT build qca_cld3_wlan.ko."
            echo "This workflow does NOT create a flashable ZIP."
            echo "This workflow does NOT modify the phone."
            echo

            echo "================================================"
            echo "PATCH CHECK"
            echo "================================================"

            cat "$GITHUB_WORKSPACE/qcacld3-patch-check.txt" \
              2>/dev/null \
              || true

            echo
            echo "================================================"
            echo "PATH COMPARISON"
            echo "================================================"

            cat "$GITHUB_WORKSPACE/path-comparison.txt" \
              2>/dev/null \
              || true

          } > "$REPORT"

          echo
          cat "$REPORT"


      # ============================================================
      # 17. UPLOAD REPORTS
      # ============================================================

      - name: Upload QCACLD3 compatibility reports
        uses: actions/upload-artifact@v4
        with:
          name: cebu-qcacld3-patch-compatibility
          path: |
            FINAL-QCACLD3-COMPATIBILITY.txt
            qcacld3-patch-check.txt
            qcacld3-patch-status.txt
            path-comparison.txt
            injection-source-search.txt
            symbol-search.txt
            android-build-config.txt
          if-no-files-found: error
          retention-days: 14


      # ============================================================
      # 18. FINAL MESSAGE
      # ============================================================

      - name: Final status
        shell: bash
        run: |
          echo
          echo "================================================"
          echo "QCACLD3 PATCH COMPATIBILITY CHECK COMPLETE"
          echo "================================================"
          echo
          echo "Artifact:"
          echo "cebu-qcacld3-patch-compatibility"
          echo
          echo "Download that artifact and upload it here."
          echo
          echo "No patch was applied."
          echo "No kernel was built."
          echo "No ZIP was created."
          echo "Nothing was flashed to the phone."
