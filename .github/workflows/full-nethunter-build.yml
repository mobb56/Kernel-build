            -print -quit
             )"

            test -n "${WLAN_MODULE}"
            test -f "${WLAN_MODULE}"

           echo "Confirmed WLAN module exists:"
           echo "${WLAN_MODULE}"

           echo "WLAN undefined-symbol verification passed."
  

      # ============================================================
      # 28. STAGE FINAL MODULES
      # ============================================================
      - name: Prepare NetHunter modules
        shell: bash
        run: |
          set -euo pipefail

           MODULE_INSTALL_DIR="${GITHUB_WORKSPACE}/module-install"
           STAGE_DIR="${GITHUB_WORKSPACE}/kernel/module-stage"
           STAGE_MODULE_DIR="${STAGE_DIR}/vendor/lib/modules"

           echo "Module install directory:"
           echo "${MODULE_INSTALL_DIR}"

           echo "Module staging directory:"
           echo "${STAGE_MODULE_DIR}"

           test -d "${MODULE_INSTALL_DIR}" || {
           echo "ERROR: module-install directory does not exist."
           exit 1
           }

             rm -rf "${STAGE_DIR}"

             mkdir -p "${STAGE_MODULE_DIR}"

            echo "Copying built kernel modules..."

             find "${MODULE_INSTALL_DIR}" \
            -type f \
             -name "*.ko" \
            -exec cp {} "${STAGE_MODULE_DIR}/" \;

           echo "Checking WLAN module..."

           test -f "${STAGE_MODULE_DIR}/wlan.ko" || {
          echo "ERROR: wlan.ko was not found."
          exit 1
           }

          mv \
          "${STAGE_MODULE_DIR}/wlan.ko" \
          "${STAGE_MODULE_DIR}/qca_cld3_wlan.ko"

           echo "WLAN module staged as qca_cld3_wlan.ko"

          echo "RFCOMM is built into the kernel."
          echo "Removing any unexpected rfcomm.ko..."

          rm -f "${STAGE_MODULE_DIR}/rfcomm.ko"

          echo "Checking required modules..."

          test -s "${STAGE_MODULE_DIR}/qca_cld3_wlan.ko" || {
           echo "ERROR: qca_cld3_wlan.ko is missing or empty."
          exit 1
           }

          test -s "${STAGE_MODULE_DIR}/hci_vhci.ko" || {
          echo "ERROR: hci_vhci.ko is missing or empty."
          exit 1
          }

           test -s "${STAGE_MODULE_DIR}/hidp.ko" || {
           echo "ERROR: hidp.ko is missing or empty."
           exit 1
          }

          echo "Final staged modules:"

          find "${STAGE_MODULE_DIR}" \
          -type f \
          -name "*.ko" \
          -printf "%f\n" |
           sort

           echo "NetHunter module staging passed."
      
      # ============================================================
      # 29. SAVE BUILD INFORMATION
      # ============================================================

      - name: Save build information
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            kernel/out/.config \
            final-kernel.config

          cp \
            kernel/nethunter-config/cebu-nethunter.config \
            nethunter-config-used.config

          cat > build-manifest.txt <<EOF
          Device: Motorola Moto G9 Power
          Codename: cebu
          ROM: LineageOS 23.2
          Kernel branch: ${KERNEL_BRANCH}
          Kernel release: ${CLEAN_RELEASE}
          Architecture: ${ARCH}
          LLVM: 14
          HID/HIDRAW/UHID: enabled
          Bluetooth HIDP/RFCOMM/BNEP/VHCI: enabled
          USB gadget/configfs: enabled
          USB networking/serial: enabled
          Qualcomm WLAN module: enabled
          QCACLD3 injection framework: imported
          QCACLD3 injection Kbuild: enabled
          Sensor compatibility: enabled
          EOF

          cat build-manifest.txt

      # ============================================================
      # 30. PREPARE ANYKERNEL3
      # ============================================================

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

           test -f "${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image"

           test -d "${GITHUB_WORKSPACE}/kernel/module-stage/vendor"

           test -d "${GITHUB_WORKSPACE}/AnyKernel3"

           rm -rf "${GITHUB_WORKSPACE}/AnyKernel3/Image"
           rm -rf "${GITHUB_WORKSPACE}/AnyKernel3/modules"

           mkdir -p "${GITHUB_WORKSPACE}/AnyKernel3/modules"

           cp \
          "${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image" \
          "${GITHUB_WORKSPACE}/AnyKernel3/Image"

           cp -a \
          "${GITHUB_WORKSPACE}/kernel/module-stage/vendor" \
          "${GITHUB_WORKSPACE}/AnyKernel3/modules/"

          test -f "${GITHUB_WORKSPACE}/AnyKernel3/Image"

          test -f \
          "${GITHUB_WORKSPACE}/AnyKernel3/modules/vendor/lib/modules/qca_cld3_wlan.ko"

          echo "AnyKernel3 preparation passed."

      # ============================================================
      # 31. CONFIGURE ANYKERNEL3
      # ============================================================

      - name: Configure AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cat > AnyKernel3/anykernel.sh <<'EOF'
          #!/sbin/sh

          properties() { '
          kernel.string=Moto G9 Power cebu NetHunter
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=cebu
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          attributes() {
          set_perm_recursive 0 0 755 644 $ramdisk/*;
          }

          block=/dev/block/bootdevice/by-name/boot;

          is_slot_device=1;

          ramdisk_compression=auto;

          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh && attributes;

          dump_boot;

          write_boot;
          EOF

          chmod 0755 \
            AnyKernel3/anykernel.sh

          # ----------------------------------------------------------
          # Verify the important device/package settings.
          # ----------------------------------------------------------

          grep -Fq \
            'device.name1=cebu' \
            AnyKernel3/anykernel.sh

          grep -Fq \
            'is_slot_device=1' \
            AnyKernel3/anykernel.sh

          grep -Fq \
            'do.modules=1' \
            AnyKernel3/anykernel.sh

          grep -Fq \
            'do.systemless=1' \
            AnyKernel3/anykernel.sh

          echo "AnyKernel3 configuration verified."

      # ============================================================
      # 32. BUILD ANYKERNEL3 ZIP
      # ============================================================

      - name: Build AnyKernel3 ZIP
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          cd AnyKernel3

          rm -f \
            ../artifacts/moto-g9-power-cebu-nethunter-flashable.zip

          zip -r9 \
            ../artifacts/moto-g9-power-cebu-nethunter-flashable.zip \
            . \
            -x ".git/*" \
            -x "README.md" \
            -x "*placeholder"

          cd ..

          test -s \
            artifacts/moto-g9-power-cebu-nethunter-flashable.zip

          unzip -t \
            artifacts/moto-g9-power-cebu-nethunter-flashable.zip

          echo "AnyKernel3 ZIP integrity test passed."

      # ============================================================
      # 33. VERIFY FINAL ZIP
      # ============================================================

      - name: Verify final package
        shell: bash
        run: |
          set -euxo pipefail

          ZIP="artifacts/moto-g9-power-cebu-nethunter-flashable.zip"

          test -s "${ZIP}"

          echo "Final ZIP contents:"
          unzip -l "${ZIP}"

          # ----------------------------------------------------------
          # Kernel image
          # ----------------------------------------------------------

          unzip -l "${ZIP}" |
            grep -Fq 'Image'

          # ----------------------------------------------------------
          # Qualcomm WLAN
          # ----------------------------------------------------------

          unzip -l "${ZIP}" |
            grep -Fq \
            'modules/vendor/lib/modules/qca_cld3_wlan.ko'

          # ----------------------------------------------------------
          # Bluetooth / HID
          # ----------------------------------------------------------

          unzip -l "${ZIP}" |
            grep -Fq \
            'modules/vendor/lib/modules/hci_vhci.ko'

          unzip -l "${ZIP}" |
            grep -Fq \
            'modules/vendor/lib/modules/hidp.ko'

          echo "Final package verification passed."

      # ============================================================
      # 34. CHECKSUMS
      # ============================================================

      - name: Generate checksums
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum \
            artifacts/moto-g9-power-cebu-nethunter-flashable.zip \
            kernel/out/arch/arm64/boot/Image \
            final-kernel.config \
            nethunter-config-used.config \
            > artifacts/SHA256SUMS.txt

          cat artifacts/SHA256SUMS.txt

      # ============================================================
      # 35. PREPARE ARTIFACTS
      # ============================================================

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euxo pipefail

          # ----------------------------------------------------------
          # Kernel image
          # ----------------------------------------------------------

          cp \
            kernel/out/arch/arm64/boot/Image \
            artifacts/Image

          # ----------------------------------------------------------
          # Final configurations
          # ----------------------------------------------------------

          cp \
            final-kernel.config \
            artifacts/final-kernel.config

          cp \
            nethunter-config-used.config \
            artifacts/nethunter-config-used.config

          # ----------------------------------------------------------
          # Build log
          # ----------------------------------------------------------

          test -s kernel-build.log

          cp \
            kernel-build.log \
            artifacts/kernel-build.log

          # ----------------------------------------------------------
          # Manifest
          # ----------------------------------------------------------

          cp \
            build-manifest.txt \
            artifacts/build-manifest.txt

          # ----------------------------------------------------------
          # Final artifact inventory
          # ----------------------------------------------------------

          echo "============================================================"
          echo "FINAL ARTIFACTS"
          echo "============================================================"

          find \
            artifacts \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

      # ============================================================
      # 36. UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 37. COMPLETE
      # ============================================================

      - name: Complete build
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "MOTO G9 POWER CEBU NETHUNTER BUILD COMPLETE"
          echo "============================================================"

          echo
          echo "Kernel release:"
          echo "${CLEAN_RELEASE}"

          echo
          echo "ZIP:"
          echo "moto-g9-power-cebu-nethunter-flashable.zip"

          echo
          echo "Artifacts:"
          echo "moto-g9-power-cebu-nethunter"

          echo
          echo "============================================================"
