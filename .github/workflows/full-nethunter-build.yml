          sed -i \
            '/wlan_hdd_frame_inject\.h/d' \
            "${MAIN_C}"

          TMP_C="${MAIN_C}.tmp"

          awk '
            BEGIN {
              inserted = 0
            }

            {
              if (!inserted && $0 ~ /^#include[[:space:]]+/) {
                print "#include \"../inc/wlan_hdd_frame_inject.h\""
                inserted = 1
              }

              print
            }

            END {
              if (!inserted) {
                exit 1
              }
            }
          ' "${MAIN_C}" > "${TMP_C}"

          test -s "${TMP_C}"
          mv "${TMP_C}" "${MAIN_C}"

          echo
          echo "=== Verifying HDD injection API include ==="

          grep -n -F \
            '#include "../inc/wlan_hdd_frame_inject.h"' \
            "${MAIN_C}"

          echo
          echo "=== HDD injection API integration passed ==="
      # ============================================================
      # 31. INTEGRATE FRAME-INJECTION INITIALIZATION
      # ============================================================

      - name: Integrate frame-injection initialization
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          MAIN_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"

          grep -n \
            "hdd_periodic_sta_stats_init(adapter)" \
            "${MAIN_C}" \
            | head -n 5

          if grep -Fq \
            "hdd_init_frame_injection(adapter);" \
            "${MAIN_C}"; then

            echo "Frame-injection initialization already integrated."

          else

            python3 - "${MAIN_C}" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          anchor = "hdd_periodic_sta_stats_init(adapter);"
          call = """
          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
                  hdd_init_frame_injection(adapter);
          #endif
          """

          if call.strip() in text:
              raise SystemExit(0)

          count = text.count(anchor)

          if count != 1:
              raise SystemExit(
                  f"ERROR: expected exactly one initialization anchor, found {count}"
              )

          text = text.replace(
              anchor,
              anchor + call,
              1
          )

          path.write_text(text)
          PY

          fi

          grep -n \
            -A5 \
            -B3 \
            "hdd_init_frame_injection" \
            "${MAIN_C}"

      # ============================================================
      # 32. INTEGRATE FRAME-INJECTION DEINITIALIZATION
      # ============================================================
      - name: Integrate frame-injection deinitialization
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          MAIN_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"

          test -f "${MAIN_C}"

          echo "=== Integrating frame-injection deinitialization ==="

          if grep -Fq 'hdd_deinit_frame_injection(adapter);' "${MAIN_C}"; then
            echo "Frame-injection deinitialization already exists."
          else
            TMP_C="${MAIN_C}.tmp"

            awk '
              BEGIN {
                in_close = 0
                inserted = 0
              }

              /static void __hdd_close_adapter[[:space:]]*\(/ {
                in_close = 1
              }

              {
                print

                if (in_close &&
                    !inserted &&
                    $0 ~ /^[[:space:]]*hdd_adapter_feature_update_work_deinit\(adapter\);[[:space:]]*$/) {
                  print ""
                  print "#ifdef FEATURE_FRAME_INJECTION_SUPPORT"
                  print "    hdd_deinit_frame_injection(adapter);"
                  print "#endif"
                  inserted = 1
                  in_close = 0
                }
              }

              END {
                if (!inserted) {
                  exit 1
                }
              }
            ' "${MAIN_C}" > "${TMP_C}"

            test -s "${TMP_C}"
            mv "${TMP_C}" "${MAIN_C}"

            echo "Frame-injection deinitialization inserted."
          fi

          echo
          echo "=== Verifying correct deinitialization location ==="

          grep -n -A5 -B5 \
            'hdd_deinit_frame_injection(adapter);' \
            "${MAIN_C}"

          echo
          echo "=== Frame-injection deinitialization passed ==="
          
      # ============================================================
      # 33. APPLY 4.19 CAP_NET_RAW COMPATIBILITY
      #
      # The older injection security implementation can use credential
      # APIs that are inappropriate for this 4.19 kernel.
      #
      # Only make the replacement if the expected function exists.
      # ============================================================

      - name: Apply 4.19 injection capability compatibility
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          SECURITY_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c"

          test -f "${SECURITY_C}"

          echo "Relevant capability code:"

          grep -n \
            -A15 \
            -B5 \
            "hdd_check_injection_capability" \
            "${SECURITY_C}" \
            || true

          if grep -Fq \
            "capable(CAP_NET_RAW)" \
            "${SECURITY_C}"; then

            echo "CAP_NET_RAW compatibility already present."

          elif grep -Fq \
            "hdd_check_injection_capability" \
            "${SECURITY_C}"; then

            python3 - "${SECURITY_C}" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          pattern = re.compile(
              r"""
              hdd_check_injection_capability
              \s*\(
              [^)]*
              \)
              \s*\{
              .*?
              \n\}
              """,
              re.S | re.X
          )

          match = pattern.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: could not safely locate "
                  "hdd_check_injection_capability body"
              )

          replacement = """hdd_check_injection_capability(struct task_struct *task)
          {
                  return capable(CAP_NET_RAW);
          }"""

          text = text[:match.start()] + replacement + text[match.end():]

          path.write_text(text)
          PY

          else
            echo "ERROR: expected injection capability function was not found."
            exit 1
          fi

          echo
          echo "Final capability implementation:"

          grep -n \
            -A8 \
            -B3 \
            "hdd_check_injection_capability" \
            "${SECURITY_C}"

          grep -Fq \
            "capable(CAP_NET_RAW)" \
            "${SECURITY_C}"

      # ============================================================
