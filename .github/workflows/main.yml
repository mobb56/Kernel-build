name: Build Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. Install build dependencies
      # =========================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang-14 \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # =========================================================
      # 2. Setup LLVM
      # =========================================================
      - name: Setup LLVM
        run: |
          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

          echo "===== CLANG ====="
          /usr/lib/llvm-14/bin/clang --version

          echo
          echo "===== LLD ====="
          /usr/lib/llvm-14/bin/ld.lld --version

      # =========================================================
      # 3. Checkout official Motorola SM6225 kernel
      # =========================================================
      - name: Checkout LineageOS kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6225
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      # =========================================================
      # 4. Checkout cebu device tree
      # =========================================================
      - name: Checkout cebu device tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_cebu
          ref: lineage-23.2
          path: device/motorola/cebu
          fetch-depth: 1

      # =========================================================
      # 5. Checkout common SM6225 tree
      # =========================================================
      - name: Checkout SM6225 common tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_sm6225-common
          ref: lineage-23.2
          path: device/motorola/sm6225-common
          fetch-depth: 1

      # =========================================================
      # 6. Verify repositories
      # =========================================================
      - name: Verify source
        run: |
          echo "========================================"
          echo "KERNEL"
          echo "========================================"

          git -C kernel rev-parse --short HEAD

          echo
          echo "========================================"
          echo "CEBU DEVICE TREE"
          echo "========================================"

          git -C device/motorola/cebu rev-parse --short HEAD

          echo
          echo "========================================"
          echo "COMMON TREE"
          echo "========================================"

          git -C device/motorola/sm6225-common rev-parse --short HEAD

          echo
          echo "========================================"
          echo "CHECKING DEFCONFIG"
          echo "========================================"

          test -f \
            kernel/arch/arm64/configs/vendor/bengal-perf_defconfig

          echo "vendor/bengal-perf_defconfig: FOUND"

          echo
          echo "========================================"
          echo "CHECKING QCOM TRACE HEADER"
          echo "========================================"

          test -f \
            kernel/drivers/clk/qcom/trace.h

          echo "drivers/clk/qcom/trace.h: FOUND"

          echo
          echo "========================================"
          echo "CEBU KERNEL CONFIG REFERENCE"
          echo "========================================"

          grep -n \
            "TARGET_KERNEL_CONFIG" \
            device/motorola/cebu/BoardConfig.mk || true

      # =========================================================
      # 7. Clean kernel
      # =========================================================
      - name: Clean kernel source
        working-directory: kernel
        run: |
          make mrproper

          rm -rf out

          echo "Kernel source cleaned."

          test ! -f .config
          test ! -d include/config

      # =========================================================
      # 8. Locate cebu-specific configuration
      # =========================================================
      - name: Locate cebu kernel configuration
        run: |
          echo "Searching for cebu-default.config..."

          find . \
            -type f \
            -name "cebu-default.config" \
            -print

          CEBU_CONFIG="$(find . \
            -type f \
            -name "cebu-default.config" \
            -print -quit)"

          if [ -n "$CEBU_CONFIG" ]; then
            echo "CEBU_CONFIG=$CEBU_CONFIG" >> "$GITHUB_ENV"
            echo "Found: $CEBU_CONFIG"
          else
            echo "CEBU_CONFIG=" >> "$GITHUB_ENV"
            echo "WARNING: cebu-default.config was not found."
            echo "The build will continue using the base Bengal configuration."
          fi

      # =========================================================
      # 9. Create NetHunter configuration
      # =========================================================
      - name: Create NetHunter config
        working-directory: kernel
        run: |
          cat > nethunter.config <<'EOF'

          #
          # Bluetooth
          #
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y

          #
          # USB Gadget
          #
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y

          #
          # USB networking
          #
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_F_FS=y

          #
          # HID / input
          #
          CONFIG_INPUT_EVDEV=y
          CONFIG_INPUT_UINPUT=y
          CONFIG_UHID=y
          CONFIG_HIDRAW=y

          #
          # Networking
          #
          CONFIG_PACKET=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_TUN=y
          CONFIG_VETH=y

          #
          # Wireless framework
          #
          CONFIG_CFG80211=y
          CONFIG_RFKILL=y

          EOF

          echo "NetHunter configuration created."

      # =========================================================
      # 10. Create base configuration
      # =========================================================
      - name: Configure base kernel
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          test -f out/.config

          echo "Base Bengal configuration created."

      # =========================================================
      # 11. Apply cebu configuration if available
      # =========================================================
      - name: Apply cebu configuration
        working-directory: kernel
        run: |
          if [ -n "$CEBU_CONFIG" ]; then

            echo "Applying:"
            echo "$CEBU_CONFIG"

            scripts/kconfig/merge_config.sh \
              -m \
              out/.config \
              "$GITHUB_WORKSPACE/$CEBU_CONFIG"

          else

            echo "No cebu-default.config found."
            echo "Continuing with Bengal base configuration."

          fi

      # =========================================================
      # 12. Apply NetHunter configuration
      # =========================================================
      - name: Apply NetHunter configuration
        working-directory: kernel
        run: |
          scripts/kconfig/merge_config.sh \
            -m \
            out/.config \
            nethunter.config

          echo "NetHunter options merged."

      # =========================================================
      # 13. Finalize configuration
      # =========================================================
      - name: Finalize kernel configuration
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          test -f out/.config

          echo "Final configuration ready."

      # =========================================================
      # 14. Verify configuration
      # =========================================================
      - name: Verify configuration
        working-directory: kernel
        run: |

          echo "========================================"
          echo "BLUETOOTH"
          echo "========================================"

          grep -E \
            'CONFIG_BT=|CONFIG_BT_BREDR=|CONFIG_BT_RFCOMM=|CONFIG_BT_HIDP=|CONFIG_BT_HCIVHCI=|CONFIG_BT_HCIUART=' \
            out/.config || true

          echo
          echo "========================================"
          echo "USB HID"
          echo "========================================"

          grep -E \
            'CONFIG_USB_GADGET=|CONFIG_USB_CONFIGFS=|CONFIG_USB_CONFIGFS_F_HID=' \
            out/.config || true

          echo
          echo "========================================"
          echo "NETWORKING"
          echo "========================================"

          grep -E \
            'CONFIG_PACKET=|CONFIG_NETFILTER=|CONFIG_NF_CONNTRACK=|CONFIG_TUN=|CONFIG_VETH=' \
            out/.config || true

          echo
          echo "========================================"
          echo "WIRELESS"
          echo "========================================"

          grep -E \
            'CONFIG_CFG80211=|CONFIG_RFKILL=' \
            out/.config || true

      # =========================================================
      # 15. Build ONLY Image + modules
      #
      # IMPORTANT:
      # We deliberately DO NOT request "dtbs".
      # =========================================================
      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |

          echo "========================================"
          echo "BUILDING KERNEL IMAGE"
          echo "========================================"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

          echo
          echo "========================================"
          echo "BUILDING KERNEL MODULES"
          echo "========================================"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules

          echo
          echo "========================================"
          echo "VERIFYING IMAGE"
          echo "========================================"

          test -f out/arch/arm64/boot/Image

          ls -lh out/arch/arm64/boot/Image

      # =========================================================
      # 16. Collect artifacts
      # =========================================================
      - name: Collect artifacts
        run: |

          mkdir -p artifacts

          echo "Copying Image..."

          cp \
            kernel/out/arch/arm64/boot/Image \
            artifacts/Image

          echo
          echo "Copying kernel configuration..."

          cp \
            kernel/out/.config \
            artifacts/kernel.config

          echo
          echo "Copying NetHunter configuration..."

          cp \
            kernel/nethunter.config \
            artifacts/nethunter.config

          echo
          echo "Collecting modules..."

          mkdir -p artifacts/modules

          find kernel/out \
            -type f \
            -name "*.ko" \
            -exec cp {} artifacts/modules/ \; || true

          echo
          echo "========================================"
          echo "FINAL ARTIFACTS"
          echo "========================================"

          find artifacts \
            -type f \
            -printf "%p %k KB\n"

      # =========================================================
      # 17. Upload
      # =========================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          path: artifacts/
          if-no-files-found: error
