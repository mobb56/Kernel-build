      - name: Verify kernel release
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          BUILT_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          echo "Expected release:"
          echo "${CLEAN_RELEASE}"

          echo "Built release:"
          echo "${BUILT_RELEASE}"

          test "${BUILT_RELEASE}" = "${CLEAN_RELEASE}"

          case "${BUILT_RELEASE}" in
            *+*)
              echo "ERROR: unwanted '+' detected in release."
              exit 1
              ;;
            *-dirty)
              echo "ERROR: dirty release detected."
              exit 1
              ;;
          esac

          echo "Kernel release verification passed."

