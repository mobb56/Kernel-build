          stat -c '%s bytes' "${STOCK_VERSIONS}"

          echo
          echo "=== Extract custom __versions ==="

          rm -f "${CUSTOM_VERSIONS}"

          "${LLVM_BIN}/llvm-objcopy" \
            --dump-section "__versions=${CUSTOM_VERSIONS}" \
            "${CUSTOM_WLAN}"

          test -s "${CUSTOM_VERSIONS}"

          echo "Custom __versions:"
          stat -c '%s bytes' "${CUSTOM_VERSIONS}"

          echo
          echo "=== Direct stock/custom CRC comparison ==="

          STOCK_VERSIONS="${STOCK_VERSIONS}" \
          CUSTOM_VERSIONS="${CUSTOM_VERSIONS}" \
          SYMVERS="${SYMVERS}" \
          REPORT="${REPORT}" \
          python3 - <<'PY'
          import os
          import struct
          import sys

          stock_path = os.environ["STOCK_VERSIONS"]
          custom_path = os.environ["CUSTOM_VERSIONS"]
          symvers_path = os.environ["SYMVERS"]
          report_path = os.environ["REPORT"]

          REQUIRED = {
              "module_layout",
              "cfg80211_unlink_bss",
              "cfg80211_get_bss",
              "cfg80211_inform_bss_frame_data",
              "cfg80211_sched_scan_results",
          }

          RECORD_SIZE = 64
          NAME_OFFSET = 8
          NAME_SIZE = 56

          def parse_versions(path):
              with open(path, "rb") as f:
                  data = f.read()

              if not data:
                  raise RuntimeError(
                      f"{path}: empty __versions section"
                  )

              if len(data) % RECORD_SIZE != 0:
                  raise RuntimeError(
                      f"{path}: {len(data)} bytes is not "
                      f"divisible by {RECORD_SIZE}"
                  )

              result = {}

              for offset in range(
                  0,
                  len(data),
                  RECORD_SIZE
              ):
                  crc = struct.unpack_from(
                      "<Q",
                      data,
                      offset
                  )[0] & 0xffffffff

                  raw_name = data[
                      offset + NAME_OFFSET:
                      offset + NAME_OFFSET + NAME_SIZE
                  ]

                  name = raw_name.split(
                      b"\0",
                      1
                  )[0].decode(
                      "ascii",
                      errors="strict"
                  )

                  if name:
                      result[name] = crc

              return result, len(data)

          def parse_symvers(path):
              result = {}

              with open(
                  path,
                  "r",
                  encoding="utf-8",
                  errors="replace"
              ) as f:
                  for line in f:
                      fields = line.rstrip("\n").split()

                      if len(fields) < 2:
                          continue

                      try:
                          crc = int(
                              fields[0],
                              16
                          ) & 0xffffffff
                      except ValueError:
                          continue

                      result[fields[1]] = crc

              return result

          stock, stock_size = parse_versions(
              stock_path
          )

          custom, custom_size = parse_versions(
              custom_path
          )

          symvers = parse_symvers(
              symvers_path
          )

          print()
          print("=" * 78)
          print("QCACLD3 DIRECT STOCK VS CUSTOM ABI")
          print("=" * 78)

          print(
              f"Stock __versions : {stock_size} bytes"
          )

          print(
              f"Custom __versions: {custom_size} bytes"
          )

          print(
              f"Stock symbols    : {len(stock)}"
          )

          print(
              f"Custom symbols   : {len(custom)}"
          )

          print(
              f"Module.symvers   : {len(symvers)}"
          )

          failed = False

          print()
          print("-" * 78)
          print("REQUIRED SYMBOLS")
          print("-" * 78)

          report = []

          for symbol in sorted(REQUIRED):

              s = stock.get(symbol)
              c = custom.get(symbol)
              v = symvers.get(symbol)

              if s is None:
                  print(
                      f"{symbol:42} "
                      "STOCK MISSING"
                  )
                  failed = True
                  continue

              if c is None:
                  print(
                      f"{symbol:42} "
                      "CUSTOM MISSING"
                  )
                  failed = True
                  continue

              s_text = f"0x{s:08x}"
              c_text = f"0x{c:08x}"

              v_text = (
                  f"0x{v:08x}"
                  if v is not None
                  else "MISSING"
              )

              print(
                  f"{symbol:42} "
                  f"stock={s_text} "
                  f"custom={c_text} "
                  f"symvers={v_text}"
              )

              if s != c:
                  print(
                      "  ERROR: STOCK != CUSTOM"
                  )
                  failed = True

              if v is None:
                  print(
                      "  ERROR: missing from Module.symvers"
                  )
                  failed = True

              elif c != v:
                  print(
                      "  ERROR: CUSTOM != Module.symvers"
                  )
                  failed = True

              if s == c and v == c:
                  print(
                      "  PASS: all three match"
                  )

              report.append(
                  (
                      symbol,
                      s,
                      c,
                      v
                  )
              )

          print()
          print("-" * 78)
          print("FULL COMMON-SYMBOL COMPARISON")
          print("-" * 78)

          common = (
              set(stock)
              & set(custom)
          )

          common_matches = 0
          common_mismatches = 0

          for symbol in sorted(common):

              s = stock[symbol]
              c = custom[symbol]

              if s == c:
                  common_matches += 1
              else:
                  common_mismatches += 1

                  print(
                      f"CRC MISMATCH: "
                      f"{symbol}: "
                      f"stock=0x{s:08x} "
                      f"custom=0x{c:08x}"
                  )

          print()
          print(
              f"Common symbols    : {len(common)}"
          )

          print(
              f"Common matches    : {common_matches}"
          )

          print(
              f"Common mismatches : {common_mismatches}"
          )

          with open(
              report_path,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "QCACLD3 DIRECT STOCK VS CUSTOM ABI REPORT\n"
              )

              f.write(
                  "=" * 78 + "\n"
              )

              f.write(
                  f"Stock __versions: {stock_size}\n"
              )

              f.write(
                  f"Custom __versions: {custom_size}\n"
              )

              f.write(
                  f"Stock symbols: {len(stock)}\n"
              )

              f.write(
                  f"Custom symbols: {len(custom)}\n"
              )

              f.write(
                  f"Common symbols: {len(common)}\n"
              )

              f.write(
                  f"Common matches: {common_matches}\n"
              )

              f.write(
                  f"Common mismatches: {common_mismatches}\n"
              )

              f.write("\nREQUIRED SYMBOLS\n")
              f.write("-" * 78 + "\n")

              for symbol, s, c, v in report:

                  f.write(
                      f"{symbol}: "
                      f"stock=0x{s:08x} "
                      f"custom=0x{c:08x} "
                  )

                  if v is None:
                      f.write(
                          "symvers=MISSING\n"
                      )
