    - name: Fix QCACLD3 module lifecycle cleanup
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        MAIN_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"

        test -f "${MAIN_C}"

        echo "=== Applying REAL QCACLD3 lifecycle fix ==="

        python3 - "${MAIN_C}" <<'PY'
        from pathlib import Path
        import re
        import sys

        path = Path(sys.argv[1])
        text = path.read_text()

        DESTROY = "wlan_hdd_state_ctrl_param_destroy();"
        UNLOAD = "hdd_driver_unload();"

        # --------------------------------------------------------
        # Safety checks
        # --------------------------------------------------------

        destroy_count = text.count(DESTROY)
        unload_count = text.count(UNLOAD)

        print(f"Existing destroy calls: {destroy_count}")
        print(f"hdd_driver_unload() calls: {unload_count}")

        if destroy_count != 1:
            raise SystemExit(
                "ERROR: expected exactly ONE existing "
                "wlan_hdd_state_ctrl_param_destroy(); call."
            )

        if unload_count != 1:
            raise SystemExit(
                "ERROR: expected exactly ONE hdd_driver_unload(); "
                "call. Refusing to modify source."
            )

        # Make sure this really is a module.
        if "module_exit(" not in text:
            raise SystemExit(
                "ERROR: module_exit() registration was not found. "
                "Refusing to modify source."
            )

        # --------------------------------------------------------
        # Remove the existing standalone destroy call.
        #
        # Only one exists, so this is deterministic.
        # --------------------------------------------------------

        destroy_line = re.compile(
            r'(?m)^[ \t]*'
            r'wlan_hdd_state_ctrl_param_destroy\(\);'
            r'[ \t]*\n?'
        )

        new_text, removed = destroy_line.subn(
            "",
            text,
            count=1
        )

        if removed != 1:
            raise SystemExit(
                "ERROR: could not safely remove the existing "
                "destroy call."
            )

        # --------------------------------------------------------
        # Locate the one and only hdd_driver_unload().
        # --------------------------------------------------------

        unload_pos = new_text.find(UNLOAD)

        if unload_pos < 0:
            raise SystemExit(
                "ERROR: hdd_driver_unload() disappeared unexpectedly."
            )

        # --------------------------------------------------------
        # Insert destroy immediately after hdd_driver_unload().
        # --------------------------------------------------------

        line_end = new_text.find("\n", unload_pos)

        if line_end < 0:
            line_end = len(new_text)

        insertion = (
            "\n"
            "    wlan_hdd_state_ctrl_param_destroy();"
        )

        new_text = (
            new_text[:line_end]
            + insertion
            + new_text[line_end:]
        )

        path.write_text(new_text)

        # --------------------------------------------------------
        # FINAL SAFETY VERIFICATION
        # --------------------------------------------------------

        final = path.read_text()

        final_destroy_count = final.count(DESTROY)
        final_unload_count = final.count(UNLOAD)

        if final_destroy_count != 1:
            raise SystemExit(
                "ERROR: final source does not contain exactly "
                "one destroy call."
            )

        if final_unload_count != 1:
            raise SystemExit(
                "ERROR: final source does not contain exactly "
                "one hdd_driver_unload() call."
            )

        final_unload = final.find(UNLOAD)
        final_destroy = final.find(DESTROY)

        if final_destroy <= final_unload:
            raise SystemExit(
                "ERROR: destroy call is not after "
                "hdd_driver_unload()."
            )

        print()
        print("PASS: Existing destroy call removed.")
        print("PASS: Destroy call inserted after hdd_driver_unload().")
        print("PASS: Exactly one destroy call remains.")
        print("PASS: Exactly one hdd_driver_unload() remains.")
        print()
        print("=== FINAL SOURCE ORDER ===")

        start = max(0, final_unload - 200)
        end = min(len(final), final_destroy + 200)

        print(final[start:end])
        PY

        echo
        echo "=== VERIFY FINAL LIFECYCLE FIX ==="

        grep -n \
          -A5 \
          -B5 \
          'hdd_driver_unload' \
          "${MAIN_C}"

        echo
        echo "=== VERIFY DESTROY CALL ==="

        grep -nF \
          'wlan_hdd_state_ctrl_param_destroy();' \
          "${MAIN_C}"

        echo
        echo "QCACLD3 lifecycle source fix PASSED."

        
