name: Build cebu NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # -------------------------------------------------------
      # Checkout the BUILD repository
      # -------------------------------------------------------
      - name: Checkout build repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Checkout the actual Motorola kernel source
      # -------------------------------------------------------
      - name: Checkout Motorola kernel source
        uses: actions/checkout@v4
        with:
          repository: mobb56/Moto-g9-kernel
          path: kernel
          fetch-depth: 1
          submodules: recursive

      # -------------------------------------------------------
      # Dependencies
      # -------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            gcc-aarch64-linux-gnu \
            clang \
            llvm \
            lld \
            make \
            cpio \
            kmod \
            rsync \
            python3 \
            zip \
            unzip

      # -------------------------------------------------------
      # Inspect kernel source
      # -------------------------------------------------------
      - name: Inspect kernel source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "KERNEL SOURCE"
          echo "======================================"

          cd "$GITHUB_WORKSPACE/kernel"

          pwd
          ls -la

          echo
          echo "Kernel Makefile:"
          test -f Makefile && echo "FOUND" || echo "MISSING"

          echo
          echo "Architecture:"
          ls -la arch/arm64 2>/dev/null || true

          echo
          echo "ARM64 configs:"
          ls -la arch/arm64/configs 2>/dev/null || true

          echo
          echo "Searching for cebu:"
          find . \
            -type f \
            -iname '*cebu*' \
            -not -path './.git/*' \
            -print | head -100

      # -------------------------------------------------------
      # Find cebu configuration
      # -------------------------------------------------------
      - name: Find cebu configuration
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel"

          echo "Searching for cebu defconfig..."

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -iname '*cebu*' \
            -print || true

          echo
          echo "All Motorola-related configs:"

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            \( \
              -iname '*motorola*' \
              -o -iname '*sm6125*' \
              -o -iname '*cebu*' \
            \) \
            -print || true

      # -------------------------------------------------------
      # Create NetHunter configuration
      # -------------------------------------------------------
      - name: Create NetHunter configuration
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          mkdir -p build

          cat > build/nethunter.config <<'EOF'

          # Bluetooth
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HCIVHCI=y

          # Bluetooth HCI UART
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y

          # USB Gadget
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y

          # USB networking
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_RNDIS=y

          # Wireless framework
          CONFIG_WLAN=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y

          # Packet sockets
          CONFIG_PACKET=y

          # Netfilter
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NF_CONNTRACK=y

          EOF

          echo "NetHunter configuration created."

      # -------------------------------------------------------
      # Configure kernel
      # -------------------------------------------------------
      - name: Configure kernel
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export LLVM=1

          mkdir -p out

          echo "Searching Makefile for defconfig targets..."

          grep -Rni \
            "cebu_defconfig\|sm6125_defconfig\|motorola_defconfig" \
            arch/arm64/configs \
            2>/dev/null || true

          echo
          echo "Available configuration files:"
          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Attempting cebu_defconfig..."

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            cebu_defconfig

          echo
          echo "Merging NetHunter configuration..."

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/.config \
            build/nethunter.config

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            olddefconfig

      # -------------------------------------------------------
      # Verify configuration
      # -------------------------------------------------------
      - name: Verify configuration
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          echo "========== Bluetooth =========="

          grep -E \
            'CONFIG_BT=|CONFIG_BT_HIDP=|CONFIG_BT_HCIVHCI=|CONFIG_BT_HCIUART=|CONFIG_BT_HCIUART_H4=' \
            out/.config || true

          echo
          echo "========== USB HID =========="

          grep -E \
            'CONFIG_USB_GADGET=|CONFIG_USB_CONFIGFS=|CONFIG_USB_CONFIGFS_F_HID=' \
            out/.config || true

          echo
          echo "========== Wireless =========="

          grep -E \
            'CONFIG_WLAN=|CONFIG_CFG80211=|CONFIG_MAC80211=' \
            out/.config || true

      # -------------------------------------------------------
      # Build
      # -------------------------------------------------------
      - name: Build kernel
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export LLVM=1

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            Image \
            dtbs

      # -------------------------------------------------------
      # Collect output
      # -------------------------------------------------------
      - name: Collect kernel
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel"

          mkdir -p artifacts

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image artifacts/
          fi

          find out/arch/arm64/boot \
            -type f \
            -name '*.dtb' \
            -exec cp {} artifacts/ \; || true

          find out/arch/arm64/boot \
            -type f \
            -name '*.dtbo' \
            -exec cp {} artifacts/ \; || true

          cp out/.config artifacts/kernel.config

          echo
          echo "========== ARTIFACTS =========="

          ls -lh artifacts

      # -------------------------------------------------------
      # Upload
      # -------------------------------------------------------
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cebu-nethunter-kernel
          path: kernel/artifacts/*
