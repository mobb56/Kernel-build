      - name: Fix monitor VDEV policy-manager lookup
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          PM="drivers/staging/qcacld-3.0/components/cmn_services/policy_mgr/src/wlan_policy_mgr_action.c"

          test -f "$PM"

          echo "=== Locate policy_mgr_update_connection_info() ==="
          grep -n -A55 -B5 \
            'QDF_STATUS policy_mgr_update_connection_info' \
            "$PM"

          echo
          echo "=== Ensure VDEV object API header is available ==="

          if ! grep -q \
            '#include <wlan_objmgr_vdev_obj.h>' \
            "$PM"; then

            awk '
            BEGIN { done=0 }

            /^#include/ && !done {
              print
              print "#include <wlan_objmgr_vdev_obj.h>"
              done=1
              next
            }

            { print }
            ' "$PM" > "$PM.tmp"

            mv "$PM.tmp" "$PM"
          fi

          echo
          echo "=== Patch monitor VDEV missing-list handling ==="

          awk '
          BEGIN {
            in_func=0
            in_missing=0
            patched=0
          }

          /QDF_STATUS policy_mgr_update_connection_info[[:space:]]*\(/ {
            in_func=1
          }

          in_func &&
          /if[[:space:]]*\(!found\)[[:space:]]*\{/ &&
          !patched {

            print
            print "\t\t/*"
            print "\t\t * Monitor VDEVs are intentionally not represented"
            print "\t\t * in pm_conc_connection_list.  Do not reject the"
            print "\t\t * monitor VDEV merely because it has no"
            print "\t\t * concurrency-list entry."
            print "\t\t */"
            print "\t\t{"
            print "\t\t\tstruct wlan_objmgr_vdev *monitor_vdev;"
            print "\t\t\tenum QDF_OPMODE monitor_opmode;"
            print ""
            print "\t\t\tmonitor_vdev = wlan_objmgr_get_vdev_by_id_from_psoc("
            print "\t\t\t\tpsoc, vdev_id, WLAN_LEGACY_MAC_ID);"
            print ""
            print "\t\t\tif (monitor_vdev) {"
            print "\t\t\t\tmonitor_opmode = wlan_vdev_mlme_get_opmode("
            print "\t\t\t\t\tmonitor_vdev);"
            print ""
            print "\t\t\t\twlan_objmgr_vdev_release_ref("
            print "\t\t\t\t\tmonitor_vdev, WLAN_LEGACY_MAC_ID);"
            print ""
            print "\t\t\t\tif (monitor_opmode == QDF_MONITOR_MODE) {"
            print "\t\t\t\t\tpolicy_mgr_debug("
            print "\t\t\t\t\t\t\"Skipping concurrency-list lookup for monitor vdev_id %d\","
            print "\t\t\t\t\t\tvdev_id);"
            print "\t\t\t\t\treturn QDF_STATUS_SUCCESS;"
            print "\t\t\t\t}"
            print "\t\t\t}"
            print "\t\t}"
            print ""

            patched=1
            in_missing=1
            next
          }

          in_func && patched && in_missing &&
          /^[[:space:]]*return status;/ {
            in_missing=0
            print
            next
          }

          in_func &&
          /^[[:space:]]*}[[:space:]]*$/ &&
          patched {
            in_func=0
          }

          { print }
          ' "$PM" > "$PM.tmp"

          mv "$PM.tmp" "$PM"

          echo
          echo "=== Verify patch ==="

          grep -n -A55 -B5 \
            'QDF_STATUS policy_mgr_update_connection_info' \
            "$PM"

          grep -q \
            'Skipping concurrency-list lookup for monitor vdev_id' \
            "$PM"

          grep -q \
            'QDF_MONITOR_MODE' \
            "$PM"

          grep -q \
            'wlan_objmgr_get_vdev_by_id_from_psoc' \
            "$PM"

          echo
          echo "PASS: monitor VDEV policy-manager exception inserted."







      - name: Fix policy-manager PCL lock boundary
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          PM="drivers/staging/qcacld-3.0/components/cmn_services/policy_mgr/src/wlan_policy_mgr_pcl.c"

          test -f "$PM"

          python3 - "$PM" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          target = re.compile(
              r'(?ms)'
              r'(?P<indent>[ \t]*)'
              r'qdf_mutex_acquire\(&pm_ctx->qdf_conc_list_lock\);'
              r'\n'
              r'(?P<store>[ \t]*policy_mgr_store_and_del_conn_info_by_vdev_id'
              r'\s*\(\s*psoc\s*,\s*sap_vdev_id\s*,'
              r'.*?\);)'
          )

          matches = list(target.finditer(text))

          if len(matches) != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one SAP PCL lock/store sequence; "
                  f"found {len(matches)}"
              )

          m = matches[0]

          indent = m.group("indent")
          store_end = m.end("store")

          # The original release belongs after restore. We want:
          #
          # acquire
          # store/delete
          # release
          #
          # ... PCL calculation ...
          #
          # acquire
          # restore
          # release

          after_store = text[store_end:]

          # Find the restore call after the SAP store/delete.
          restore = re.search(
              r'(?ms)'
              r'(?P<indent>[ \t]*)'
              r'policy_mgr_restore_deleted_conn_info'
              r'\s*\(\s*psoc\s*,\s*&info\s*,\s*num_cxn_del\s*\);',
              after_store
          )

          if not restore:
              raise SystemExit(
                  "ERROR: Could not locate SAP restore call after store/delete"
              )

          restore_start = store_end + restore.start()
          restore_end = store_end + restore.end()

          # Find the existing release after restore.
          release = re.search(
              r'(?m)'
              r'^[ \t]*qdf_mutex_release\(&pm_ctx->qdf_conc_list_lock\);',
              text[restore_end:]
          )

          if not release:
              raise SystemExit(
                  "ERROR: Could not locate existing PCL mutex release"
              )

          release_start = restore_end + release.start()
          release_end = restore_end + release.end()

          # Refuse to patch an already-fixed source.
          between_store_restore = text[store_end:restore_start]

          if "qdf_mutex_release(&pm_ctx->qdf_conc_list_lock)" in between_store_restore:
              raise SystemExit(
                  "ERROR: SAP PCL lock boundary already appears patched"
              )

          # Move the existing release so the connection-table helper is not
          # called while holding qdf_conc_list_lock.
          release_line = text[release_start:release_end]

          text = (
              text[:store_end]
              + "\n"
              + indent
              + "qdf_mutex_release(&pm_ctx->qdf_conc_list_lock);"
              + text[store_end:release_start]
              + indent
              + "qdf_mutex_acquire(&pm_ctx->qdf_conc_list_lock);"
              + text[release_start:release_end]
              + text[release_end:]
          )

          path.write_text(text)

          print("PASS: SAP PCL lock boundary patched.")
          PY

          echo
          echo "=== VERIFY SAP PCL PATH ==="

          grep -n -B5 -A25 \
            'policy_mgr_store_and_del_conn_info_by_vdev_id(psoc, sap_vdev_id' \
            "$PM"

          echo
          echo "=== VERIFY LOCKS ==="

          grep -n -B2 -A2 \
            'qdf_mutex_\(acquire\|release\)(&pm_ctx->qdf_conc_list_lock)' \
            "$PM"

          echo
          echo "PASS: policy-manager PCL patch completed."





