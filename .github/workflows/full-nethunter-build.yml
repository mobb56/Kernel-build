name: Moto G9 Power cebu NetHunter

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  KERNEL_BRANCH: lineage-23.2

  NETHUNTER_REPO: https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git
  NETHUNTER_BRANCH: nethunter-lineage-23.2

  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_BRANCH: master

  LLVM_DIR: /usr/lib/llvm-14
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out

jobs:
  build:
    name: Moto G9 Power cebu NetHunter
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang-14 \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            zip

          echo "Installed compiler versions:"
          clang-14 --version
          ld.lld-14 --version
          aarch64-linux-gnu-gcc --version
          make --version

      # ============================================================
      # 3. PREPARE LLVM TOOL NAMES
      #
      # Ubuntu may install llvm-ar-14 rather than llvm-ar.
      # Create a private tool directory so LLVM=1 always finds the
      # expected unversioned LLVM tool names.
      # ============================================================

      - name: Prepare LLVM toolchain
        shell: bash
        run: |
          set -euxo pipefail

          LLVM_BIN="${RUNNER_TEMP}/llvm-bin"

          rm -rf "${LLVM_BIN}"
          mkdir -p "${LLVM_BIN}"

          link_tool() {
            local target="$1"
            local name="$2"

            if [ -x "${target}" ]; then
              ln -sf "${target}" "${LLVM_BIN}/${name}"
              return 0
            fi

            echo "ERROR: LLVM tool not found: ${target}"
            exit 1
          }

          link_tool /usr/bin/clang-14 clang
          link_tool /usr/bin/clang++-14 clang++

          link_tool /usr/bin/ld.lld-14 ld.lld

          link_tool /usr/bin/llvm-ar-14 llvm-ar
          link_tool /usr/bin/llvm-nm-14 llvm-nm
          link_tool /usr/bin/llvm-objcopy-14 llvm-objcopy
          link_tool /usr/bin/llvm-objdump-14 llvm-objdump
          link_tool /usr/bin/llvm-strip-14 llvm-strip
          link_tool /usr/bin/llvm-readelf-14 llvm-readelf
          link_tool /usr/bin/llvm-size-14 llvm-size
          link_tool /usr/bin/llvm-ranlib-14 llvm-ranlib
          link_tool /usr/bin/llvm-as-14 llvm-as

          # Make the tools available BOTH:
          # 1. immediately in this shell
          # 2. to all subsequent GitHub Actions steps
          export PATH="${LLVM_BIN}:${PATH}"
          echo "${LLVM_BIN}" >> "${GITHUB_PATH}"

          echo "LLVM_BIN=${LLVM_BIN}" >> "${GITHUB_ENV}"

          echo "LLVM tools:"
          command -v clang
          command -v clang++
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-objdump
          command -v llvm-strip
          command -v llvm-readelf
          command -v llvm-size
          command -v llvm-ranlib
          command -v llvm-as

          echo
          echo "Resolved LLVM toolchain:"
          clang --version
          ld.lld --version
          llvm-ar --version

      # ============================================================
      # 4. CLONE MOTOROLA KERNEL
      # ============================================================

      - name: Clone Motorola kernel
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          git -C kernel rev-parse HEAD
          git -C kernel status --short

      # ============================================================
      # 5. CLONE NETHUNTER QCACLD3 REFERENCE
      # ============================================================

      - name: Clone NetHunter QCACLD3 reference
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${NETHUNTER_BRANCH}" \
            "${NETHUNTER_REPO}" \
            nethunter-reference

          R="nethunter-reference/drivers/staging/qcacld-3.0"

          test -f \
            "${R}/core/hdd/src/wlan_hdd_frame_inject.c"

          test -f \
            "${R}/core/hdd/src/wlan_hdd_frame_validate.c"

          test -f \
            "${R}/core/hdd/src/wlan_hdd_inject_security.c"

          test -f \
            "${R}/core/hdd/src/wlan_hdd_frame_inject_debug.c"

          test -f \
            "${R}/core/wma/src/wma_frame_inject.c"

          test -f \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject.h"

          test -f \
            "${R}/core/hdd/inc/wlan_hdd_frame_validate.h"

          test -f \
            "${R}/core/hdd/inc/wlan_hdd_inject_security.h"

          test -f \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject_debug.h"

          test -f \
            "${R}/core/wma/inc/wma_frame_inject.h"

          echo "NetHunter QCACLD3 reference verified."

      # ============================================================
      # 6. CLONE ANYKERNEL3
      # ============================================================

      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${ANYKERNEL_BRANCH}" \
            "${ANYKERNEL_REPO}" \
            AnyKernel3

          test -f AnyKernel3/anykernel.sh
          test -f AnyKernel3/tools/ak3-core.sh

      # ============================================================
      # 7. VERIFY SOURCE TREE
      # ============================================================

      - name: Verify source trees
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            kernel/arch/arm64/configs/vendor/bengal-perf_defconfig

          test -f \
            kernel/drivers/staging/qcacld-3.0/Kbuild

          test -f \
            kernel/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h

          test -f \
            kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c

          echo "Kernel source tree verified."

      # ============================================================
      # 8. PREPARE OUTPUT
      # ============================================================

      - name: Prepare output
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

      # ============================================================
      # 9. GENERATE CLEAN BASE CONFIG
      # ============================================================

      - name: Generate base configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            vendor/bengal-perf_defconfig

          CLEAN_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          test -n "${CLEAN_RELEASE}"

          case "${CLEAN_RELEASE}" in
            *-dirty)
              echo "ERROR: base release is already dirty."
              exit 1
              ;;
          esac

          echo "CLEAN_RELEASE=${CLEAN_RELEASE}" >> "${GITHUB_ENV}"

          echo "Clean kernel release:"
          echo "${CLEAN_RELEASE}"

      # ============================================================
      # 10. CREATE NETHUNTER CONFIG
      #
      # IMPORTANT:
      # Do NOT put CONFIG_FEATURE_FRAME_INJECTION_SUPPORT or
      # CONFIG_FEATURE_MONITOR_MODE_SUPPORT here.
      # Those are QCACLD3 Kbuild variables.
      # ============================================================

      - name: Create NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p kernel/nethunter-config

          cat > kernel/nethunter-config/cebu-nethunter.config <<'EOF'
          # ============================================================
          # Moto G9 Power cebu NetHunter configuration
          # ============================================================

          # ------------------------------------------------------------
          # HID
          # ------------------------------------------------------------

          CONFIG_HIDRAW=y
          CONFIG_UHID=y

          # ------------------------------------------------------------
          # Bluetooth
          # ------------------------------------------------------------

          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y

          CONFIG_BT_RFCOMM=m
          CONFIG_BT_RFCOMM_TTY=y

          CONFIG_BT_BNEP=m
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y

          CONFIG_BT_HIDP=m

          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIUART_BCM=y
          CONFIG_BT_HCIUART_RTL=y

          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y

          CONFIG_BT_HCIVHCI=m

          # ------------------------------------------------------------
          # USB gadget
          # ------------------------------------------------------------

          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y

          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_EEM=y

          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y

          # ------------------------------------------------------------
          # USB serial / network
          #
          # USB_SERIAL_GENERIC is boolean in this tree, so use y.
          # CDC Ethernet can resolve to y through Kconfig dependencies.
          # ------------------------------------------------------------

          CONFIG_USB_ACM=m
          CONFIG_USB_SERIAL=m
          CONFIG_USB_SERIAL_GENERIC=y

          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=y
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_NET_RNDIS_HOST=m

          CONFIG_USB_RTL8150=m
          CONFIG_USB_RTL8152=m

          # ------------------------------------------------------------
          # Sensors
          # ------------------------------------------------------------

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m

          # ------------------------------------------------------------
          # Qualcomm WLAN
          # ------------------------------------------------------------

          CONFIG_QCA_CLD_WLAN=m

          # ------------------------------------------------------------
          # Basic networking
          # ------------------------------------------------------------

          CONFIG_PACKET=y

          EOF

          test -s \
            kernel/nethunter-config/cebu-nethunter.config

          cat \
            kernel/nethunter-config/cebu-nethunter.config

      # ============================================================
      # 11. MERGE CONFIG
      #
      # olddefconfig happens BEFORE LOCALVERSION_AUTO is disabled.
      # There is deliberately no olddefconfig afterward.
      # ============================================================

      - name: Merge NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          scripts/kconfig/merge_config.sh \
            -m \
            -O "${OUT_DIR}" \
            "${OUT_DIR}/.config" \
            nethunter-config/cebu-nethunter.config

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig

          BASE_VERSION="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelversion
          )"

          RELEASE_SUFFIX="${CLEAN_RELEASE#${BASE_VERSION}}"

          echo "Base version:   ${BASE_VERSION}"
          echo "Clean release:  ${CLEAN_RELEASE}"
          echo "Release suffix: ${RELEASE_SUFFIX}"

          # IMPORTANT:
          # These are AFTER olddefconfig.
          scripts/config \
            --file "${OUT_DIR}/.config" \
            --disable LOCALVERSION_AUTO

          scripts/config \
            --file "${OUT_DIR}/.config" \
            --set-str LOCALVERSION "${RELEASE_SUFFIX}"

          # Do NOT call olddefconfig here.

          LOCALVERSION_AUTO_STATE="$(
            scripts/config \
              --file "${OUT_DIR}/.config" \
              --state LOCALVERSION_AUTO
          )"

          echo "LOCALVERSION_AUTO state: ${LOCALVERSION_AUTO_STATE}"

          test "${LOCALVERSION_AUTO_STATE}" = "n"

          CONFIG_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          echo "Configured release: ${CONFIG_RELEASE}"

          test "${CONFIG_RELEASE}" = "${CLEAN_RELEASE}"

      # ============================================================
      # 12. VERIFY KERNEL CONFIG
      #
      # For tristate options, accept either y or m when both are
      # valid. Do not incorrectly reject Kconfig dependency results.
      # ============================================================

      - name: Verify important configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          get_state() {
            scripts/config \
              --file "${CONFIG}" \
              --state "$1"
          }

          require_exact() {
            local symbol="$1"
            local expected="$2"
            local actual

            actual="$(get_state "${symbol}")"

            echo "${symbol}: ${actual}"

            test "${actual}" = "${expected}" || {
              echo "ERROR: ${symbol} expected ${expected}, got ${actual}"
              exit 1
            }
          }

          require_enabled() {
            local symbol="$1"
            local actual

            actual="$(get_state "${symbol}")"

            echo "${symbol}: ${actual}"

            case "${actual}" in
              y|m)
                ;;
              *)
                echo "ERROR: ${symbol} is disabled."
                exit 1
                ;;
            esac
          }

          require_exact HIDRAW y
          require_exact UHID y

          require_exact BT y
          require_exact BT_BREDR y
          require_exact BT_LE y

          require_enabled BT_RFCOMM
          require_enabled BT_BNEP
          require_enabled BT_HIDP
          require_enabled BT_HCIUART
          require_enabled BT_HCIVHCI

          require_exact USB_GADGET y
          require_exact USB_CONFIGFS y
          require_exact USB_CONFIGFS_NCM y
          require_exact USB_CONFIGFS_RNDIS y
          require_exact USB_CONFIGFS_ECM y
          require_exact USB_CONFIGFS_EEM y
          require_exact USB_CONFIGFS_F_HID y

          require_enabled USB_ACM
          require_enabled USB_SERIAL
          require_exact USB_SERIAL_GENERIC y
          require_exact USB_USBNET y
          require_enabled USB_NET_CDCETHER
          require_enabled USB_NET_CDC_NCM
          require_enabled USB_NET_RNDIS_HOST

          require_enabled USB_RTL8150
          require_enabled USB_RTL8152

          require_exact SENSORS_SSC y
          require_enabled SENSORS_CLASS

          require_enabled QCA_CLD_WLAN

          require_exact LOCALVERSION_AUTO n

          # These must not be kernel .config symbols.
          if grep -Eq \
            '^CONFIG_FEATURE_(FRAME_INJECTION_SUPPORT|MONITOR_MODE_SUPPORT)=' \
            "${CONFIG}"; then

            echo "ERROR: QCACLD3 feature variable incorrectly present in .config."
            exit 1
          fi

          echo "Kernel configuration verification passed."

      # ============================================================
      # 13. IMPORT QCACLD3 INJECTION SOURCES
      # ============================================================

      - name: Import QCACLD3 injection framework
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0"
          R="nethunter-reference/drivers/staging/qcacld-3.0"

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_inject.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_validate.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_inject_security.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/wma/src/wma_frame_inject.c" \
            "${K}/core/wma/src/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_validate.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_inject_security.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject_debug.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/wma/inc/wma_frame_inject.h" \
            "${K}/core/wma/inc/"

          echo "QCACLD3 injection sources imported."

      # ============================================================
      # 14. ADD INJECTION CONTEXT
      # ============================================================

      - name: Add injection context to Motorola HDD
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/core/hdd/inc/"
              "wlan_hdd_main.h"
          )

          text = path.read_text()

          if "struct hdd_injection_ctx;" not in text:
              marker = "struct hdd_adapter {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: struct hdd_adapter marker not found."
                  )

              text = text.replace(
                  marker,
                  "struct hdd_injection_ctx;\n\n" + marker,
                  1
              )

          if "struct hdd_injection_ctx *injection_ctx;" not in text:
              marker = (
                  "\tqdf_atomic_t net_dev_hold_ref_count"
                  "[NET_DEV_HOLD_ID_MAX];\n"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: injection-context anchor not found."
                  )

              replacement = """\tqdf_atomic_t net_dev_hold_ref_count[NET_DEV_HOLD_ID_MAX];

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              struct hdd_injection_ctx *injection_ctx;
          #endif
          """

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          path.write_text(text)

          print("Injection context added.")
          PY

      # ============================================================
      # 15. FIX 4.19 CREDENTIAL COMPATIBILITY
      #
      # Replace the complete function using brace matching rather
      # than fragile text matching.
      # ============================================================

      - name: Fix 4.19 credential compatibility
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/core/hdd/src/"
              "wlan_hdd_inject_security.c"
          )

          text = path.read_text()

          signature = re.compile(
              r"QDF_STATUS\s+"
              r"hdd_check_injection_capability\s*"
              r"\(\s*struct\s+task_struct\s*\*\s*task\s*\)"
              r"\s*\{"
          )

          match = signature.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: hdd_check_injection_capability() "
                  "signature not found."
              )

          brace_start = text.find("{", match.start())

          if brace_start < 0:
              raise SystemExit(
                  "ERROR: function opening brace not found."
              )

          depth = 0
          brace_end = None

          for index in range(brace_start, len(text)):
              char = text[index]

              if char == "{":
                  depth += 1
              elif char == "}":
                  depth -= 1

                  if depth == 0:
                      brace_end = index + 1
                      break

          if brace_end is None:
              raise SystemExit(
                  "ERROR: function closing brace not found."
              )

          replacement = """QDF_STATUS hdd_check_injection_capability(
              struct task_struct *task)
          {
              bool has_capability;

              hdd_security_debug(
                  "Checking injection capabilities");

              if (!task)
                  task = current;

              has_capability = capable(CAP_NET_RAW);

              if (!has_capability) {
                  hdd_security_warn(
                      "Process lacks CAP_NET_RAW capability");

                  return QDF_STATUS_E_PERM;
              }

              hdd_security_debug(
                  "Process has CAP_NET_RAW capability");

              return QDF_STATUS_SUCCESS;
          }"""

          new_text = (
              text[:match.start()]
              + replacement
              + text[brace_end:]
          )

          path.write_text(new_text)

          print("Credential compatibility function replaced.")
          PY

          SRC="kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c"

          # Only real code identifiers count here.
          if grep -nE \
            '^[[:space:]]*(const[[:space:]]+struct[[:space:]]+cred|put_cred|get_task_cred)[[:space:]]*(\(|;)' \
            "${SRC}"; then

            echo "ERROR: incompatible credential code remains."
            exit 1
          fi

          grep -Fq \
            "capable(CAP_NET_RAW)" \
            "${SRC}" || {
              echo "ERROR: CAP_NET_RAW authorization check missing."
              exit 1
            }

          echo "4.19 credential compatibility verified."

      # ============================================================
      # 16. INTEGRATE INJECTION LIFECYCLE
      # ============================================================

      - name: Integrate injection lifecycle
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/core/hdd/src/"
              "wlan_hdd_main.c"
          )

          text = path.read_text()

          # ----------------------------------------------------------
          # Include
          # ----------------------------------------------------------

          include_marker = '#include "wlan_hdd_rx_monitor.h"\n'

          if '#include "wlan_hdd_frame_inject.h"' not in text:
              if include_marker not in text:
                  raise SystemExit(
                      "ERROR: RX monitor include marker not found."
                  )

              replacement = (
                  '#include "wlan_hdd_rx_monitor.h"\n'
                  '#ifdef FEATURE_FRAME_INJECTION_SUPPORT\n'
                  '#include "wlan_hdd_frame_inject.h"\n'
                  '#endif\n'
              )

              text = text.replace(
                  include_marker,
                  replacement,
                  1
              )

          # ----------------------------------------------------------
          # Init
          # ----------------------------------------------------------

          if "hdd_init_frame_injection(adapter)" not in text:
              marker = (
                  "\thdd_periodic_sta_stats_init(adapter);\n"
                  "\n"
                  "\treturn adapter;"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: adapter initialization marker not found."
                  )

              replacement = """\thdd_periodic_sta_stats_init(adapter);

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              if (QDF_STATUS_SUCCESS !=
                  hdd_init_frame_injection(adapter)) {
                  hdd_err(
                      "Failed to initialize frame injection for adapter");
                  /* Continue without frame injection support */
              }
          #endif

              return adapter;"""

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          # ----------------------------------------------------------
          # Cleanup
          # ----------------------------------------------------------

          if "hdd_deinit_frame_injection(adapter)" not in text:
              marker = (
                  "\thdd_adapter_feature_update_work_deinit(adapter);\n"
                  "\thdd_cleanup_adapter(hdd_ctx, adapter, rtnl_held);"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: adapter cleanup marker not found."
                  )

              replacement = """\thdd_adapter_feature_update_work_deinit(adapter);

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              hdd_deinit_frame_injection(adapter);
          #endif

              hdd_cleanup_adapter(hdd_ctx, adapter, rtnl_held);"""

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          path.write_text(text)

          print("Injection lifecycle integrated.")
          PY

      # ============================================================
      # 17. PATCH QCACLD3 KBUILD
      #
      # Feature variables are defined at the TOP of Kbuild so the
      # later monitor-mode and frame-injection conditionals actually
      # see them.
      # ============================================================
      - name: Patch QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/Kbuild"
          )

          text = path.read_text()

          # ----------------------------------------------------------
          # Define QCACLD3 feature variables early enough for all
          # later Kbuild conditionals.
          # ----------------------------------------------------------

          feature_defs = """# NetHunter QCACLD3 frame injection support
          CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y
          CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y

          """

          if "CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y" not in text:
              marker = "TARGET_BUILD_VARIANT := user\n"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: top Kbuild insertion marker not found."
                  )

              text = text.replace(
                  marker,
                  marker + "\n" + feature_defs,
                  1
              )

          # ----------------------------------------------------------
          # IMPORTANT:
          #
          # This Motorola Kbuild defines HDD_INC, but the final INCS
          # list does not include it.
          #
          # Our new frame-injection headers live in:
          #
          #   core/hdd/inc/
          #
          # Therefore add the existing HDD_INC and WMA_INC variables to INCS.
          # ----------------------------------------------------------

          if "$(HDD_INC)" not in text or "$(WMA_INC)" not in text:
              inc_marker = (
                  "INCS := -I $(srctree)/$(WLAN_ROOT)/inc \\"
              )

              if inc_marker not in text:
                  raise SystemExit(
                      "ERROR: QCACLD3 INCS anchor not found."
                  )

              text = text.replace(
            inc_marker,
             "INCS := $(HDD_INC) \\\n"
          "        $(WMA_INC) \\\n"
          "        -I $(srctree)/$(WLAN_ROOT)/inc \\",
                 1
                )
          # ----------------------------------------------------------
          # HDD objects
          # ----------------------------------------------------------

          if "wlan_hdd_frame_inject.o" not in text:
              anchor = (
                  "ifeq ($(CONFIG_LITHIUM), y)\n"
                  "HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_rx_monitor.o\n"
                  "endif\n"
              )

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: HDD insertion anchor not found."
                  )

              addition = anchor + """ifeq ($(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT), y)
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o
          endif

          """

              text = text.replace(
                  anchor,
                  addition,
                  1
              )

          # ----------------------------------------------------------
          # WMA object
          # ----------------------------------------------------------

          if "wma_frame_inject.o" not in text:
              anchor = "\t\t$(WMA_NDP_OBJS)\n"

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: WMA insertion anchor not found."
                  )

              addition = anchor + """ifeq ($(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT), y)
          WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o
          endif
          """

              text = text.replace(
                  anchor,
                  addition,
                  1
              )

          # ----------------------------------------------------------
          # Frame-injection preprocessor define
          # ----------------------------------------------------------

          if "cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT" not in text:
              monitor_block = """ifeq ($(CONFIG_FEATURE_MONITOR_MODE_SUPPORT), y)
          cppflags-y += -DFEATURE_MONITOR_MODE_SUPPORT
          else
          cppflags-y += -DDISABLE_MON_CONFIG
          endif
          """

              if monitor_block not in text:
                  raise SystemExit(
                      "ERROR: monitor-mode Kbuild block not found."
                  )

              addition = monitor_block + """ifeq ($(CONFIG_FEATURE_FRAME_INJECTION_SUPPORT), y)
          cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT
          endif
          """

              text = text.replace(
                  monitor_block,
                  addition,
                  1
              )

          path.write_text(text)

          print("QCACLD3 Kbuild patched.")
          PY

      # ============================================================
      # 18. VERIFY KBUILD
      # ============================================================

      - name: Verify QCACLD3 Kbuild
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0/Kbuild"

                   grep -Fq \
            'INCS := $(HDD_INC)' \
            "${K}" || {
              echo "ERROR: HDD_INC is not included in QCACLD3 include paths."
              exit 1
            }

              grep -Fq \
          '$(WMA_INC)' \
          "${K}" || {
          echo "ERROR: WMA_INC is not included in QCACLD3 include paths."
          exit 1
          }

          grep -Fq \
            'CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y' \
            "${K}"

          grep -Fq \
            'CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y' \
            "${K}"

          grep -Fq \
            'wlan_hdd_frame_inject.o' \
            "${K}"

          grep -Fq \
            'wlan_hdd_frame_validate.o' \
            "${K}"

          grep -Fq \
            'wlan_hdd_inject_security.o' \
            "${K}"

          grep -Fq \
            'wlan_hdd_frame_inject_debug.o' \
            "${K}"

          grep -Fq \
            'wma_frame_inject.o' \
            "${K}"

          grep -Fq \
            'cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT' \
            "${K}"

          grep -Fq \
            'cppflags-y += -DFEATURE_MONITOR_MODE_SUPPORT' \
            "${K}"

          echo "QCACLD3 Kbuild verification passed."

      # ============================================================
      # 19. VERIFY SOURCE ADAPTATION
      # ============================================================

      - name: Verify source adaptation
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0"

          test -f "${K}/core/hdd/src/wlan_hdd_frame_inject.c"
          test -f "${K}/core/hdd/src/wlan_hdd_frame_validate.c"
          test -f "${K}/core/hdd/src/wlan_hdd_inject_security.c"
          test -f "${K}/core/hdd/src/wlan_hdd_frame_inject_debug.c"
          test -f "${K}/core/wma/src/wma_frame_inject.c"

          test -f "${K}/core/hdd/inc/wlan_hdd_frame_inject.h"
          test -f "${K}/core/hdd/inc/wlan_hdd_frame_validate.h"
          test -f "${K}/core/hdd/inc/wlan_hdd_inject_security.h"
          test -f "${K}/core/hdd/inc/wlan_hdd_frame_inject_debug.h"
          test -f "${K}/core/wma/inc/wma_frame_inject.h"

          grep -Fq \
            'struct hdd_injection_ctx *injection_ctx;' \
            "${K}/core/hdd/inc/wlan_hdd_main.h"

          grep -Fq \
            'hdd_init_frame_injection(adapter)' \
            "${K}/core/hdd/src/wlan_hdd_main.c"

          grep -Fq \
            'hdd_deinit_frame_injection(adapter)' \
            "${K}/core/hdd/src/wlan_hdd_main.c"

          grep -Fq \
            'capable(CAP_NET_RAW)' \
            "${K}/core/hdd/src/wlan_hdd_inject_security.c"

          echo "Source adaptation verification passed."

      # ============================================================
      # 20. BUILD KERNEL + MODULES
      # ============================================================

      - name: Build kernel and modules
        id: kernel_build
        shell: bash
        run: |
          set -o pipefail

          cd kernel

          BUILD_LOG="${GITHUB_WORKSPACE}/kernel-build.log"

          make -j2 \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            Image \
            modules \
            2>&1 | tee "${BUILD_LOG}"

          status="${PIPESTATUS[0]}"

          if [ "${status}" -ne 0 ]; then
            echo "Kernel build failed."
            exit "${status}"
          fi

      # ============================================================
      # 21. FAILURE DIAGNOSTICS
      #
      # If a genuine compiler failure occurs, expose the useful
      # portion instead of only showing "Makefile:153 Error 2".
      # ============================================================

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "BUILD FAILURE DIAGNOSTICS"
          echo "============================================================"

          if [ -f kernel-build.log ]; then
            echo
            echo "First likely compiler/linker errors:"
            grep -nEi \
              '(^|[[:space:]])(error:|fatal error:|undefined reference|undefined!|No such file|not found)' \
              kernel-build.log |
              head -n 80 || true

            echo
            echo "Last 250 build-log lines:"
            tail -n 250 kernel-build.log
          else
            echo "kernel-build.log does not exist."
          fi

      # ============================================================
      # 22. VERIFY RELEASE
      # ============================================================

      - name: Verify kernel release
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          BUILT_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          echo "Expected release:"
          echo "${CLEAN_RELEASE}"

          echo "Built release:"
          echo "${BUILT_RELEASE}"

          test "${BUILT_RELEASE}" = "${CLEAN_RELEASE}"

          case "${BUILT_RELEASE}" in
            *-dirty)
              echo "ERROR: dirty release detected."
              exit 1
              ;;
          esac

          echo "Kernel release verification passed."

      # ============================================================
      # 23. VERIFY IMAGE
      # ============================================================

      - name: Verify Image
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="kernel/out/arch/arm64/boot/Image"

          test -f "${IMAGE}"

          SIZE="$(stat -c%s "${IMAGE}")"

          echo "Image size: ${SIZE}"

          test "${SIZE}" -gt 10000000

          file "${IMAGE}"

      # ============================================================
      # 24. INSTALL MODULES
      # ============================================================

      - name: Install modules
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          rm -rf "${GITHUB_WORKSPACE}/module-install"

          mkdir -p \
            "${GITHUB_WORKSPACE}/module-install"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            INSTALL_MOD_PATH="${GITHUB_WORKSPACE}/module-install" \
            modules_install

          find \
            "${GITHUB_WORKSPACE}/module-install" \
            -type f \
            -name '*.ko' \
            -print

      # ============================================================
      # 25. VERIFY WLAN MODULE
      # ============================================================

      - name: Verify wlan.ko
        shell: bash
        run: |
          set -euxo pipefail

          WLAN_MODULE="$(
            find module-install \
              -type f \
              -name 'wlan.ko' \
              -print -quit
          )"

          test -n "${WLAN_MODULE}"

          echo "WLAN module:"
          echo "${WLAN_MODULE}"

          VERMAGIC="$(
            modinfo \
              -F vermagic \
              "${WLAN_MODULE}"
          )"

          echo "WLAN vermagic:"
          echo "${VERMAGIC}"

          echo "${VERMAGIC}" | \
            grep -Fq "${CLEAN_RELEASE}"

      # ============================================================
      # 26. VERIFY NETHUNTER MODULES
      # ============================================================

      - name: Verify NetHunter modules
        shell: bash
        run: |
          set -euxo pipefail

          required_modules=(
            hci_vhci.ko
            hci_uart.ko
            hidp.ko
            rfcomm.ko
            bnep.ko
          )

          for module in "${required_modules[@]}"; do

            found="$(
              find module-install \
                -type f \
                -name "${module}" \
                -print -quit
            )"

            if [ -z "${found}" ]; then
              echo "ERROR: missing ${module}"
              exit 1
            fi

            echo "Found ${module}: ${found}"
          done

      # ============================================================
      # 27. CHECK MODPOST
      # ============================================================

      - name: Check WLAN undefined symbols
        shell: bash
        run: |
          set -euxo pipefail

          if grep -E \
            'ERROR: "[^"]+" \[[^]]*wlan\.ko\] undefined!' \
            kernel-build.log; then

            echo "ERROR: wlan.ko has undefined symbols."
            exit 1
          fi

          if grep -E \
            'undefined!$' \
            kernel-build.log; then

            echo "ERROR: undefined kernel symbols detected."
            exit 1
          fi

          grep -Fq \
            'LD [M] drivers/staging/qcacld-3.0/wlan.ko' \
            kernel-build.log || {

            echo "ERROR: wlan.ko was not linked."
            exit 1
          }

          echo "WLAN MODPOST verification passed."

      # ============================================================
      # 28. STAGE FINAL MODULES
      # ============================================================

      - name: Prepare NetHunter modules
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf module-stage

          mkdir -p \
            module-stage/vendor/lib/modules

          WLAN_MODULE="$(
            find module-install \
              -type f \
              -name 'wlan.ko' \
              -print -quit
          )"

          test -n "${WLAN_MODULE}"

          # Match the cebu vendor module filename.
          cp \
            "${WLAN_MODULE}" \
            module-stage/vendor/lib/modules/qca_cld3_wlan.ko

          # ----------------------------------------------------------
          # Bluetooth / HID
          # ----------------------------------------------------------

          for name in \
            bluetooth.ko \
            hci_uart.ko \
            hci_vhci.ko \
            hid.ko \
            hid_generic.ko \
            hidp.ko \
            rfcomm.ko \
            bnep.ko
          do

            found="$(
              find module-install \
                -type f \
                -name "${name}" \
                -print -quit
            )"

            if [ -n "${found}" ]; then
              cp \
                "${found}" \
                module-stage/vendor/lib/modules/
            fi
          done

          # ----------------------------------------------------------
          # USB / network
          # ----------------------------------------------------------

          for name in \
            cdc_acm.ko \
            usbserial.ko \
            cdc_ether.ko \
            cdc_ncm.ko \
            rndis_host.ko \
            r8150.ko \
            r8152.ko \
            usb_f_ncm.ko \
            usb_f_rndis.ko \
            usb_f_ecm.ko \
            usb_f_eem.ko \
            usb_f_hid.ko \
            usb_f_mass_storage.ko
          do

            found="$(
              find module-install \
                -type f \
                -name "${name}" \
                -print -quit
            )"

            if [ -n "${found}" ]; then
              cp \
                "${found}" \
                module-stage/vendor/lib/modules/
            fi
          done

          # ----------------------------------------------------------
          # Sensors
          # ----------------------------------------------------------

          found="$(
            find module-install \
              -type f \
              -name 'sensors_class.ko' \
              -print -quit
          )"

          if [ -n "${found}" ]; then
            cp \
              "${found}" \
              module-stage/vendor/lib/modules/
          fi

          # ----------------------------------------------------------
          # Minimum required files
          # ----------------------------------------------------------

          test -f \
            module-stage/vendor/lib/modules/qca_cld3_wlan.ko

          test -f \
            module-stage/vendor/lib/modules/hci_vhci.ko

          test -f \
            module-stage/vendor/lib/modules/hidp.ko

          echo "Final staged modules:"
          find \
            module-stage/vendor/lib/modules \
            -type f \
            -name '*.ko' \
            -printf '%f\n' |
            sort

      # ============================================================
      # 29. SAVE BUILD INFORMATION
      # ============================================================

      - name: Save build information
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            kernel/out/.config \
            final-kernel.config

          cp \
            kernel/nethunter-config/cebu-nethunter.config \
            nethunter-config-used.config

          cat > build-manifest.txt <<EOF
          Device: Motorola Moto G9 Power
          Codename: cebu
          ROM: LineageOS 23.2
          Kernel branch: ${KERNEL_BRANCH}
          Kernel release: ${CLEAN_RELEASE}
          Architecture: ${ARCH}
          LLVM: 14
          HID/HIDRAW/UHID: enabled
          Bluetooth HIDP/RFCOMM/BNEP/VHCI: enabled
          USB gadget/configfs: enabled
          USB networking/serial: enabled
          Qualcomm WLAN module: enabled
          QCACLD3 injection framework: imported
          QCACLD3 injection Kbuild: enabled
          Sensor compatibility: enabled
          EOF

          cat build-manifest.txt

      # ============================================================
      # 30. PREPARE ANYKERNEL3
      # ============================================================

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            kernel/out/arch/arm64/boot/Image \
            AnyKernel3/Image

          rm -rf \
            AnyKernel3/modules

          mkdir -p \
            AnyKernel3/modules

          cp -a \
            module-stage/vendor \
            AnyKernel3/modules/

          test -f \
            AnyKernel3/Image

          test -f \
            AnyKernel3/modules/vendor/lib/modules/qca_cld3_wlan.ko

      # ============================================================
      # 31. CONFIGURE ANYKERNEL3
      # ============================================================

      - name: Configure AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          cat > AnyKernel3/anykernel.sh <<'EOF'
          #!/sbin/sh

          properties() { '
          kernel.string=Moto G9 Power cebu NetHunter
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=cebu
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          attributes() {
          set_perm_recursive 0 0 755 644 $ramdisk/*;
          }

          block=/dev/block/bootdevice/by-name/boot;

          is_slot_device=1;

          ramdisk_compression=auto;

          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh && attributes;

          dump_boot;

          write_boot;
          EOF

          chmod 0755 \
            AnyKernel3/anykernel.sh

          grep -Fq \
            'device.name1=cebu' \
            AnyKernel3/anykernel.sh

          grep -Fq \
            'is_slot_device=1' \
            AnyKernel3/anykernel.sh

      # ============================================================
      # 32. BUILD ANYKERNEL ZIP
      # ============================================================

      - name: Build AnyKernel3 ZIP
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          cd AnyKernel3

          rm -f \
            ../artifacts/moto-g9-power-cebu-nethunter-flashable.zip

          zip -r9 \
            ../artifacts/moto-g9-power-cebu-nethunter-flashable.zip \
            . \
            -x ".git/*" \
            -x "README.md" \
            -x "*placeholder"

          cd ..

          test -s \
            artifacts/moto-g9-power-cebu-nethunter-flashable.zip

          unzip -t \
            artifacts/moto-g9-power-cebu-nethunter-flashable.zip

      # ============================================================
      # 33. VERIFY FINAL ZIP
      # ============================================================

      - name: Verify final package
        shell: bash
        run: |
          set -euxo pipefail

          ZIP="artifacts/moto-g9-power-cebu-nethunter-flashable.zip"

          unzip -l "${ZIP}"

          unzip -l "${ZIP}" | \
            grep -Fq 'Image'

          unzip -l "${ZIP}" | \
            grep -Fq \
            'modules/vendor/lib/modules/qca_cld3_wlan.ko'

          unzip -l "${ZIP}" | \
            grep -Fq \
            'modules/vendor/lib/modules/hci_vhci.ko'

          unzip -l "${ZIP}" | \
            grep -Fq \
            'modules/vendor/lib/modules/hidp.ko'

          echo "Final package verification passed."

      # ============================================================
      # 34. CHECKSUMS
      # ============================================================

      - name: Generate checksums
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum \
            artifacts/moto-g9-power-cebu-nethunter-flashable.zip \
            kernel/out/arch/arm64/boot/Image \
            final-kernel.config \
            nethunter-config-used.config \
            > artifacts/SHA256SUMS.txt

          cat artifacts/SHA256SUMS.txt

      # ============================================================
      # 35. PREPARE ARTIFACTS
      # ============================================================

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            kernel/out/arch/arm64/boot/Image \
            artifacts/Image

          cp \
            final-kernel.config \
            artifacts/final-kernel.config

          cp \
            nethunter-config-used.config \
            artifacts/nethunter-config-used.config

          cp \
            kernel-build.log \
            artifacts/kernel-build.log

          cp \
            build-manifest.txt \
            artifacts/build-manifest.txt

      # ============================================================
      # 36. UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 37. COMPLETE
      # ============================================================

      - name: Complete build
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "MOTO G9 POWER CEBU NETHUNTER BUILD COMPLETE"
          echo "============================================================"
          echo
          echo "Kernel release:"
          echo "${CLEAN_RELEASE}"
          echo
          echo "ZIP:"
          echo "moto-g9-power-cebu-nethunter-flashable.zip"
          echo
          echo "Artifacts:"
          echo "moto-g9-power-cebu-nethunter"
          echo
          echo "============================================================"
