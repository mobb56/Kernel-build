          check_same CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI_MMI
          check_same CONFIG_INPUT_TOUCHSCREEN_FOCALTECH_0FLASH_MMI
          check_same CONFIG_TOUCHSCREEN_CHIPONE_TDDI
          check_same CONFIG_INPUT_MISC_FPC1020
          check_same CONFIG_I2C_QCOM_GENI
          check_same CONFIG_SPI_QCOM_GENI
          check_same CONFIG_WLAN
          check_same CONFIG_QCA_CLD_WLAN
          check_same CONFIG_RMNET
          check_same CONFIG_IPA3
          check_same CONFIG_RMNET_IPA3

          echo
          echo "Critical cebu hardware settings preserved."

      # ============================================================
      # 41. VERIFY STOCK USB FOUNDATION
      #
      # These are foundational settings rather than the optional
      # NetHunter gadget additions.
      # ============================================================

      - name: Verify stock USB foundation
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          STOCK="${GITHUB_WORKSPACE}/cebu-stock.config"
          FINAL="${OUT_DIR}/.config"

          check_same() {
            local symbol="$1"

            local stock_value
            local final_value

            stock_value="$(
              grep -E "^${symbol}=" "${STOCK}" |
                head -n1 || true
            )"

            final_value="$(
              grep -E "^${symbol}=" "${FINAL}" |
                head -n1 || true
            )"

            if [ "${stock_value}" != "${final_value}" ]; then
