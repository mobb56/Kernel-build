    - name: Enable QCACLD3 injection Kbuild features
      working-directory: kernel
      shell: bash
      run: |
          set -euo pipefail

          KBUILD_FILE="drivers/staging/qcacld-3.0/Kbuild"

          test -f "${KBUILD_FILE}"

          echo "=== Enable QCACLD3 injection Kbuild features ==="

          # ------------------------------------------------------------
          # Remove previous custom registrations from earlier workflow
          # attempts. Do not touch the original QCACLD3 object lists.
          # ------------------------------------------------------------

          sed -i \
            '\|HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|ccflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT|d' \
            "${KBUILD_FILE}"

          sed -i \
            '\|ccflags-y += -DFEATURE_MONITOR_MODE_SUPPORT|d' \
            "${KBUILD_FILE}"

          # ------------------------------------------------------------
          # Add the QCACLD3 feature variables and compiler defines near
          # the beginning of the Kbuild file.
          # ------------------------------------------------------------

          sed -i '1i\
          CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y\
          CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y\
          ccflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT\
          ccflags-y += -DFEATURE_MONITOR_MODE_SUPPORT\
          ' "${KBUILD_FILE}"

          echo
          echo "=== Verify QCACLD3 feature definitions ==="

          grep -nF \
            'CONFIG_FEATURE_FRAME_INJECTION_SUPPORT := y' \
            "${KBUILD_FILE}"

          grep -nF \
            'CONFIG_FEATURE_MONITOR_MODE_SUPPORT := y' \
            "${KBUILD_FILE}"

          grep -nF \
            'ccflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT' \
            "${KBUILD_FILE}"

          grep -nF \
            'ccflags-y += -DFEATURE_MONITOR_MODE_SUPPORT' \
            "${KBUILD_FILE}"

          # ------------------------------------------------------------
          # Register HDD frame injection objects.
          #
          # The existing Kbuild uses:
          #
          #     OBJS := $(HDD_OBJS)
          #
          # Insert the custom HDD objects immediately before the
          # aggregation point.
          # ------------------------------------------------------------

          echo
          echo "=== Register HDD frame injection objects ==="

          echo "Locating HDD OBJS aggregation point..."

          if ! grep -Eq \
            '^[[:space:]]*OBJS[[:space:]]*:=[[:space:]]*\$\(HDD_OBJS\)' \
            "${KBUILD_FILE}"; then
            echo "ERROR: HDD OBJS aggregation point was not found."
            grep -n -E 'OBJS.*HDD_OBJS' \
              "${KBUILD_FILE}" || true
            exit 1
          fi

          TMP_KBUILD="${KBUILD_FILE}.tmp"

          awk '
          BEGIN {
            inserted = 0
          }

          !inserted &&
          $0 ~ /^[[:space:]]*OBJS[[:space:]]*:=[[:space:]]*\$\(HDD_OBJS\)/ {
            print "HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o"
            print "HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o"
            print "HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o"
            print "HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o"
            inserted = 1
          }

          {
            print
          }

          END {
            if (!inserted)
              exit 1
          }
          ' "${KBUILD_FILE}" > "${TMP_KBUILD}"

          mv "${TMP_KBUILD}" "${KBUILD_FILE}"

          echo
          echo "=== Verify HDD injection object registration ==="

          for obj in \
            wlan_hdd_frame_inject.o \
            wlan_hdd_frame_validate.o \
            wlan_hdd_inject_security.o \
            wlan_hdd_frame_inject_debug.o
          do
            if ! grep -Fq \
              "HDD_OBJS += \$(HDD_SRC_DIR)/${obj}" \
              "${KBUILD_FILE}"; then
              echo "ERROR: Missing HDD injection object: ${obj}"
              exit 1
            fi
          done

          echo
          echo "=== HDD injection placement ==="

          grep -n -B5 -A8 \
            -E '^[[:space:]]*OBJS[[:space:]]*:=[[:space:]]*\$\(HDD_OBJS\)' \
            "${KBUILD_FILE}"

          echo
          echo "=== Register WMA frame injection object ==="

          # ------------------------------------------------------------
          # Register WMA frame injection object immediately before the
          # existing WMA_OBJS aggregation.
          # ------------------------------------------------------------

          WMA_OBJS_LINE="$(
            awk '
              index($0, "$(WMA_OBJS)") {
                print NR
                exit
              }
            ' "${KBUILD_FILE}"
          )"

          if [ -z "${WMA_OBJS_LINE}" ]; then
            echo "ERROR: WMA OBJS aggregation point was not found."
            grep -nF \
              '$(WMA_OBJS)' \
              "${KBUILD_FILE}" || true
            exit 1
          fi

          echo "WMA OBJS aggregation line: ${WMA_OBJS_LINE}"

          sed -i \
            "${WMA_OBJS_LINE}i WMA_OBJS += \$(WMA_SRC_DIR)/wma_frame_inject.o" \
            "${KBUILD_FILE}"

          echo
          echo "=== Verify WMA injection object registration ==="

          if ! grep -Fq \
            'WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o' \
            "${KBUILD_FILE}"; then
            echo "ERROR: WMA injection object was not registered."
            exit 1
          fi

          # ------------------------------------------------------------
          # Verify every custom injection object exists exactly once.
          # ------------------------------------------------------------

          echo
          echo "=== Verify injection object registration counts ==="

          HDD_FRAME_COUNT="$(
            grep -Fc \
              'HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o' \
              "${KBUILD_FILE}"
          )"

          HDD_VALIDATE_COUNT="$(
            grep -Fc \
              'HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o' \
              "${KBUILD_FILE}"
          )"

          HDD_SECURITY_COUNT="$(
            grep -Fc \
              'HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o' \
              "${KBUILD_FILE}"
          )"

          HDD_DEBUG_COUNT="$(
            grep -Fc \
              'HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o' \
              "${KBUILD_FILE}"
          )"

          WMA_INJECT_COUNT="$(
            grep -Fc \
              'WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o' \
              "${KBUILD_FILE}"
          )"

          if [ "${HDD_FRAME_COUNT}" -ne 1 ]; then
            echo "ERROR: wlan_hdd_frame_inject.o count = ${HDD_FRAME_COUNT}"
            exit 1
          fi

          if [ "${HDD_VALIDATE_COUNT}" -ne 1 ]; then
            echo "ERROR: wlan_hdd_frame_validate.o count = ${HDD_VALIDATE_COUNT}"
            exit 1
          fi

          if [ "${HDD_SECURITY_COUNT}" -ne 1 ]; then
            echo "ERROR: wlan_hdd_inject_security.o count = ${HDD_SECURITY_COUNT}"
            exit 1
          fi

          if [ "${HDD_DEBUG_COUNT}" -ne 1 ]; then
            echo "ERROR: wlan_hdd_frame_inject_debug.o count = ${HDD_DEBUG_COUNT}"
            exit 1
          fi

          if [ "${WMA_INJECT_COUNT}" -ne 1 ]; then
            echo "ERROR: wma_frame_inject.o count = ${WMA_INJECT_COUNT}"
            exit 1
          fi

          echo
          echo "All injection objects are registered exactly once."

          # ------------------------------------------------------------
          # Final placement diagnostics.
          # ------------------------------------------------------------

          echo
          echo "=== HDD injection placement ==="

          grep -n -B3 -A3 \
            -F 'HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o' \
            "${KBUILD_FILE}"

          echo
          echo "=== HDD validation placement ==="

          grep -n -B3 -A3 \
            -F 'HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o' \
            "${KBUILD_FILE}"

          echo
          echo "=== HDD security placement ==="

          grep -n -B3 -A3 \
            -F 'HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o' \
            "${KBUILD_FILE}"

          echo
          echo "=== HDD debug placement ==="

          grep -n -B3 -A3 \
            -F 'HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject_debug.o' \
            "${KBUILD_FILE}"

          echo
          echo "=== WMA injection placement ==="

          grep -n -B3 -A3 \
            -F 'WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o' \
            "${KBUILD_FILE}"

          # ------------------------------------------------------------
          # Final QCACLD3 Kbuild verification.
          # ------------------------------------------------------------

          echo
          echo "=== Final QCACLD3 injection Kbuild configuration ==="

          grep -n -E \
            'CONFIG_FEATURE_(FRAME_INJECTION|MONITOR_MODE)_SUPPORT|wlan_hdd_(frame_inject|frame_validate|inject_security|frame_inject_debug)\.o|wma_frame_inject\.o|FEATURE_(FRAME_INJECTION|MONITOR_MODE)_SUPPORT' \
            "${KBUILD_FILE}"

