        check_grep \
          "WMA_INJECTION_DESC_ID_BASE 0x2000" \
          "$WMA_INJECT_H"

        echo
        echo "=== INJECTION SYMBOL LOCATION DEBUG ==="

        grep -nE \
          'WMA_IS_INJECTION_DESC_ID|wma_handle_injection_fw_response|WMA_INJECTION_DESC_ID_BASE' \
          "$WMA_MGMT" "$WMA_INJECT" "$WMA_INJECT_H" || true

        echo
        echo "=== FORBIDDEN DEBUG CONFIG CHECK ==="

        if [ -f "${OUT_DIR}/.config" ]; then
          if grep -Eq '^CONFIG_DEBUG_FS=y' "${OUT_DIR}/.config"; then
            echo "FAIL: CONFIG_DEBUG_FS=y is forbidden."
            fail=1
          else
