      - name: Verify stock ABI CRCs against custom kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DIRECT STOCK -> CUSTOM QCACLD3 ABI CRC CHECK"
          echo "============================================================"

          CONFIG="${OUT_DIR}/.config"
          SYMVERS="${OUT_DIR}/Module.symvers"
          CUSTOM_WLAN="${OUT_DIR}/drivers/staging/qcacld-3.0/wlan.ko"

          STOCK_WLAN="${GITHUB_WORKSPACE}/stock-qca_cld3_wlan.ko"
          STOCK_VERSIONS="${OUT_DIR}/stock-versions.bin"
          CUSTOM_VERSIONS="${OUT_DIR}/custom-versions.bin"
          REPORT="${OUT_DIR}/qca-crc-report.txt"

          echo
          echo "=== Required files ==="

          test -s "${CONFIG}" || {
            echo "ERROR: final .config is missing."
            exit 1
          }

          test -s "${SYMVERS}" || {
            echo "ERROR: Module.symvers is missing."
            exit 1
          }

          test -s "${CUSTOM_WLAN}" || {
            echo "ERROR: custom wlan.ko is missing."
            exit 1
          }

          test -s "${STOCK_WLAN}" || {
            echo
            echo "ERROR: stock-qca_cld3_wlan.ko is missing."
            echo
            echo "Place the ACTUAL stock module at:"
            echo "${GITHUB_WORKSPACE}/stock-qca_cld3_wlan.ko"
            echo
            echo "Source:"
            echo "/vendor/lib/modules/qca_cld3_wlan.ko"
            exit 1
          }

          echo "PASS: all required files exist."

          echo
          echo "=== CONFIG_MODVERSIONS ==="

          grep -Fxq \
            "CONFIG_MODVERSIONS=y" \
            "${CONFIG}"

          echo "PASS: CONFIG_MODVERSIONS=y"

          echo
          echo "=== Stock module ==="

          echo "Stock module:"
          ls -lh "${STOCK_WLAN}"

          echo
          echo "Custom module:"
          ls -lh "${CUSTOM_WLAN}"

          echo
          echo "=== Verify stock module ELF ==="

          "${LLVM_BIN}/llvm-readelf" -h "${STOCK_WLAN}" |
            grep -E 'Class:|Data:|Machine:|Type:'

          echo
          echo "=== Verify custom module ELF ==="

          "${LLVM_BIN}/llvm-readelf" -h "${CUSTOM_WLAN}" |
            grep -E 'Class:|Data:|Machine:|Type:'

          echo
          echo "=== Verify stock __versions section ==="

          if ! "${LLVM_BIN}/llvm-readelf" -S -W "${STOCK_WLAN}" |
            grep -q '[[:space:]]__versions[[:space:]]'; then
            echo "ERROR: stock qca_cld3_wlan.ko has no __versions section."
            exit 1
          fi

          echo "PASS: stock module contains __versions."

          echo
          echo "=== Verify custom __versions section ==="

          if ! "${LLVM_BIN}/llvm-readelf" -S -W "${CUSTOM_WLAN}" |
            grep -q '[[:space:]]__versions[[:space:]]'; then
            echo "ERROR: custom wlan.ko has no __versions section."
            exit 1
          fi

          echo "PASS: custom module contains __versions."

          echo
          echo "=== Extract stock __versions ==="

          rm -f "${STOCK_VERSIONS}"

          "${LLVM_BIN}/llvm-objcopy" \
            --dump-section "__versions=${STOCK_VERSIONS}" \
            "${STOCK_WLAN}"

          test -s "${STOCK_VERSIONS}"

          echo "Stock __versions:"
          stat -c '%s bytes' "${STOCK_VERSIONS}"

          echo
          echo "=== Extract custom __versions ==="

          rm -f "${CUSTOM_VERSIONS}"

          "${LLVM_BIN}/llvm-objcopy" \
            --dump-section "__versions=${CUSTOM_VERSIONS}" \
            "${CUSTOM_WLAN}"

          test -s "${CUSTOM_VERSIONS}"

          echo "Custom __versions:"
          stat -c '%s bytes' "${CUSTOM_VERSIONS}"

          echo
          echo "=== Direct stock/custom CRC comparison ==="

          STOCK_VERSIONS="${STOCK_VERSIONS}" \
          CUSTOM_VERSIONS="${CUSTOM_VERSIONS}" \
          SYMVERS="${SYMVERS}" \
          REPORT="${REPORT}" \
          python3 - <<'PY'
          import os
          import struct
          import sys

          stock_path = os.environ["STOCK_VERSIONS"]
          custom_path = os.environ["CUSTOM_VERSIONS"]
          symvers_path = os.environ["SYMVERS"]
          report_path = os.environ["REPORT"]

          REQUIRED = {
              "module_layout",
              "cfg80211_unlink_bss",
              "cfg80211_get_bss",
              "cfg80211_inform_bss_frame_data",
              "cfg80211_sched_scan_results",
          }

          RECORD_SIZE = 64
          NAME_OFFSET = 8
          NAME_SIZE = 56

          def parse_versions(path):
              with open(path, "rb") as f:
                  data = f.read()

              if not data:
                  raise RuntimeError(
                      f"{path}: empty __versions section"
                  )

              if len(data) % RECORD_SIZE != 0:
                  raise RuntimeError(
                      f"{path}: {len(data)} bytes is not "
                      f"divisible by {RECORD_SIZE}"
                  )

              result = {}

              for offset in range(
                  0,
                  len(data),
                  RECORD_SIZE
              ):
                  crc = struct.unpack_from(
                      "<Q",
                      data,
                      offset
                  )[0] & 0xffffffff

                  raw_name = data[
                      offset + NAME_OFFSET:
                      offset + NAME_OFFSET + NAME_SIZE
                  ]

                  name = raw_name.split(
                      b"\0",
                      1
                  )[0].decode(
                      "ascii",
                      errors="strict"
                  )

                  if name:
                      result[name] = crc

              return result, len(data)

          def parse_symvers(path):
              result = {}

              with open(
                  path,
                  "r",
                  encoding="utf-8",
                  errors="replace"
              ) as f:
                  for line in f:
                      fields = line.rstrip("\n").split()

                      if len(fields) < 2:
                          continue

                      try:
                          crc = int(
                              fields[0],
                              16
                          ) & 0xffffffff
                      except ValueError:
                          continue

                      result[fields[1]] = crc

              return result

          stock, stock_size = parse_versions(
              stock_path
          )

          custom, custom_size = parse_versions(
              custom_path
          )

          symvers = parse_symvers(
              symvers_path
          )

          print()
          print("=" * 78)
          print("QCACLD3 DIRECT STOCK VS CUSTOM ABI")
          print("=" * 78)

          print(
              f"Stock __versions : {stock_size} bytes"
          )

          print(
              f"Custom __versions: {custom_size} bytes"
          )

          print(
              f"Stock symbols    : {len(stock)}"
          )

          print(
              f"Custom symbols   : {len(custom)}"
          )

          print(
