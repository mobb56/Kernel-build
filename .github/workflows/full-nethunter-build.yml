          echo "CONFIG_USB_SERIAL=y means USB serial core is built into the kernel."

          echo
          echo "=== Prepare Android vendor runtime module tree ==="

          rm -rf "${RUNTIME_DIR}"

          mkdir -p "${VENDOR_MODULE_DIR}"

          echo "Runtime directory:"
          echo "${VENDOR_MODULE_DIR}"

          echo
          echo "=== Install runtime NetHunter modules ==="

          install_runtime_module() {
            local relative="$1"
            local source="${OUT_DIR}/${relative}"
            local destination_name="$2"

            if [ ! -s "${source}" ]; then
              echo "ERROR: runtime module source missing:"
              echo "${source}"
              exit 1
            fi

            cp -f \
              "${source}" \
              "${VENDOR_MODULE_DIR}/${destination_name}"

            test -s "${VENDOR_MODULE_DIR}/${destination_name}"

            echo "Installed: ${destination_name}"
          }

          install_runtime_module \
            "net/bluetooth/bnep/bnep.ko" \
            "bnep.ko"

          install_runtime_module \
            "net/bluetooth/hidp/hidp.ko" \
            "hidp.ko"

          install_runtime_module \
            "drivers/bluetooth/hci_uart.ko" \
            "hci_uart.ko"

          install_runtime_module \
            "drivers/bluetooth/hci_vhci.ko" \
            "hci_vhci.ko"

          install_runtime_module \
            "drivers/usb/class/cdc-acm.ko" \
            "cdc-acm.ko"

          install_runtime_module \
            "drivers/net/usb/usbnet.ko" \
            "usbnet.ko"

          install_runtime_module \
            "drivers/net/usb/cdc_ether.ko" \
            "cdc_ether.ko"

          install_runtime_module \
            "drivers/net/usb/cdc_ncm.ko" \
            "cdc_ncm.ko"

          echo
          echo "=== Install custom QCACLD3 WLAN ==="

          CUSTOM_WLAN="${OUT_DIR}/drivers/staging/qcacld-3.0/wlan.ko"
          RUNTIME_WLAN="${VENDOR_MODULE_DIR}/qca_cld3_wlan.ko"

          test -s "${CUSTOM_WLAN}"

          cp -f \
            "${CUSTOM_WLAN}" \
            "${RUNTIME_WLAN}"

          test -s "${RUNTIME_WLAN}"

          echo "PASS: custom QCACLD3 WLAN installed"
          echo "Runtime filename: qca_cld3_wlan.ko"

          echo
          echo "=== Verify runtime module ELF format ==="

          for MODULE in "${VENDOR_MODULE_DIR}"/*.ko; do
            test -s "${MODULE}"

            "${LLVM_BIN}/llvm-readelf" -h "${MODULE}" >/dev/null

            echo "PASS: $(basename "${MODULE}")"
          done

          echo
          echo "=== Verify custom WLAN checksum ==="

          BUILD_WLAN_SHA256="$(
            sha256sum "${CUSTOM_WLAN}" |
              awk '{print $1}'
          )"

          RUNTIME_WLAN_SHA256="$(
            sha256sum "${RUNTIME_WLAN}" |
              awk '{print $1}'
          )"

          echo "Built WLAN SHA256:   ${BUILD_WLAN_SHA256}"
          echo "Runtime WLAN SHA256: ${RUNTIME_WLAN_SHA256}"

          test "${BUILD_WLAN_SHA256}" = "${RUNTIME_WLAN_SHA256}"

          echo "PASS: runtime WLAN exactly matches built WLAN"

          echo
          echo "=== Generate clean dependency metadata ==="

          DEPMOD_ROOT="${ARTIFACT_DIR}/.depmod-root"
          DEPMOD_MODULE_DIR="${DEPMOD_ROOT}/lib/modules/${EXPECTED_RELEASE}"

          rm -rf "${DEPMOD_ROOT}"

          mkdir -p "${DEPMOD_MODULE_DIR}"

          cp -f \
            "${VENDOR_MODULE_DIR}"/*.ko \
            "${DEPMOD_MODULE_DIR}/"

          # depmod expects these files to exist in the module tree.
          # They are metadata inputs, not loadable modules.
          : > "${DEPMOD_MODULE_DIR}/modules.order"
          : > "${DEPMOD_MODULE_DIR}/modules.builtin"

          depmod \
            -b "${DEPMOD_ROOT}" \
            "${EXPECTED_RELEASE}"

          test -s "${DEPMOD_MODULE_DIR}/modules.dep"
          test -s "${DEPMOD_MODULE_DIR}/modules.alias"
          test -s "${DEPMOD_MODULE_DIR}/modules.softdep"

          if [ -f "${DEPMOD_MODULE_DIR}/modules.symbols" ]; then
            cp -f \
              "${DEPMOD_MODULE_DIR}/modules.symbols" \
              "${VENDOR_MODULE_DIR}/modules.symbols"
          fi

          cp -f \
            "${DEPMOD_MODULE_DIR}/modules.dep" \
            "${VENDOR_MODULE_DIR}/modules.dep"

          cp -f \
            "${DEPMOD_MODULE_DIR}/modules.alias" \
            "${VENDOR_MODULE_DIR}/modules.alias"

          cp -f \
            "${DEPMOD_MODULE_DIR}/modules.softdep" \
            "${VENDOR_MODULE_DIR}/modules.softdep"

          echo "PASS: modules.dep"
          echo "PASS: modules.alias"
          echo "PASS: modules.softdep"

          echo
          echo "=== Verify dependency metadata ==="

          DEP_FILE="${VENDOR_MODULE_DIR}/modules.dep"

          for MODULE_NAME in \
            "bnep.ko" \
            "hidp.ko" \
            "hci_uart.ko" \
            "hci_vhci.ko" \
            "cdc-acm.ko" \
            "usbnet.ko" \
            "cdc_ether.ko" \
            "cdc_ncm.ko" \
            "qca_cld3_wlan.ko"
          do
            if grep -qF "${MODULE_NAME}:" "${DEP_FILE}"; then
              echo "PASS: modules.dep contains ${MODULE_NAME}"
            else
              echo "ERROR: modules.dep does not contain ${MODULE_NAME}"
              exit 1
            fi
          done

          echo
          echo "=== Verify VHCI specifically ==="

          test -s "${VENDOR_MODULE_DIR}/hci_vhci.ko"

          grep -qF "hci_vhci.ko:" \
            "${VENDOR_MODULE_DIR}/modules.dep"

          "${LLVM_BIN}/llvm-readelf" -S \
            "${VENDOR_MODULE_DIR}/hci_vhci.ko" \
            | grep -q "__versions"

          echo "PASS: hci_vhci.ko exists"
          echo "PASS: hci_vhci.ko has MODVERSIONS data"
          echo "PASS: hci_vhci.ko is present in modules.dep"

          echo
          echo "=== Runtime module inventory ==="

          find "${VENDOR_MODULE_DIR}" \
            -maxdepth 1 \
            -type f \
            -name '*.ko' \
            -printf '%f\n' \
            | sort

          RUNTIME_MODULE_COUNT="$(
            find "${VENDOR_MODULE_DIR}" \
              -maxdepth 1 \
              -type f \
              -name '*.ko' \
              | wc -l
          )"

          test "${RUNTIME_MODULE_COUNT}" -eq 9

          echo
          echo "PASS: exactly ${RUNTIME_MODULE_COUNT} runtime NetHunter modules prepared"

          echo
          echo "=== Generate runtime module manifest ==="

          find "${VENDOR_MODULE_DIR}" \
            -maxdepth 1 \
            -type f \
            -name '*.ko' \
            -printf '%f\n' \
            | sort \
            > "${RUNTIME_DIR}/vendor-modules.list"

          test -s "${RUNTIME_DIR}/vendor-modules.list"

          echo
          echo "=== Generate runtime module checksums ==="

          (
            cd "${VENDOR_MODULE_DIR}"

            find . \
              -maxdepth 1 \
              -type f \
              -name '*.ko' \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > "${RUNTIME_DIR}/vendor-modules.sha256"

          test -s "${RUNTIME_DIR}/vendor-modules.sha256"

          echo
          echo "=== Copy verification reports ==="

          test -s "${SOURCE_AUDIT_DIR}/part7-result.txt"
          test -s "${SOURCE_AUDIT_DIR}/qcacld3-symbols.txt"

          cp -f \
            "${SOURCE_AUDIT_DIR}/part7-result.txt" \
            "${ARTIFACT_DIR}/part7-result.txt"

          cp -f \
            "${SOURCE_AUDIT_DIR}/qcacld3-symbols.txt" \
            "${ARTIFACT_DIR}/qcacld3-symbols.txt"

          echo
          echo "=== Package ABI evidence ==="

          for ABI_FILE in \
            "${OUT_DIR}/Module.symvers" \
            "${OUT_DIR}/System.map" \
            "${OUT_DIR}/qca-crc-report.txt" \
            "${OUT_DIR}/.config"
          do
            if [ ! -s "${ABI_FILE}" ]; then
              echo "ERROR: required ABI evidence is missing:"
              echo "${ABI_FILE}"
              exit 1
            fi
          done

          STOCK_CONFIG="${OUT_DIR}/stock-before-nethunter.config"
          FINAL_CONFIG="${OUT_DIR}/.config"
          CONFIG_DIFF="${ARTIFACT_DIR}/abi/stock-vs-final.config.diff"

          test -s "${STOCK_CONFIG}"

          if diff -u \
              "${STOCK_CONFIG}" \
              "${FINAL_CONFIG}" \
              > "${CONFIG_DIFF}"
          then
            :
          else
            DIFF_STATUS=$?

            if [ "${DIFF_STATUS}" -ne 1 ]; then
              echo "ERROR: unable to generate configuration diff."
              exit 1
            fi
          fi

          test -s "${CONFIG_DIFF}"

          cp -f \
            "${OUT_DIR}/Module.symvers" \
            "${ARTIFACT_DIR}/abi/Module.symvers"

          cp -f \
            "${OUT_DIR}/System.map" \
            "${ARTIFACT_DIR}/abi/System.map"

          cp -f \
            "${OUT_DIR}/qca-crc-report.txt" \
            "${ARTIFACT_DIR}/abi/qca-crc-report.txt"

          cp -f \
            "${OUT_DIR}/.config" \
            "${ARTIFACT_DIR}/abi/final.config"

          test -s "${ARTIFACT_DIR}/abi/Module.symvers"
          test -s "${ARTIFACT_DIR}/abi/System.map"
          test -s "${ARTIFACT_DIR}/abi/qca-crc-report.txt"
          test -s "${ARTIFACT_DIR}/abi/stock-vs-final.config.diff"
          test -s "${ARTIFACT_DIR}/abi/final.config"

          echo "PASS: ABI evidence packaged"

          echo
          echo "=== Generate built module manifest ==="

          find "${OUT_DIR}" \
            -type f \
            -name '*.ko' \
            -print \
            | sed "s#^${OUT_DIR}/##" \
            | sort \
            > "${SOURCE_AUDIT_DIR}/built-modules.txt"

          test -s "${SOURCE_AUDIT_DIR}/built-modules.txt"

          cp -f \
            "${SOURCE_AUDIT_DIR}/built-modules.txt" \
            "${ARTIFACT_DIR}/built-modules.txt"

          echo
          echo "=== Generate kernel checksum ==="

          sha256sum \
            "${ARTIFACT_DIR}/Image" \
            > "${ARTIFACT_DIR}/kernel-Image.sha256"

          test -s "${ARTIFACT_DIR}/kernel-Image.sha256"

          echo
          echo "=== Generate artifact checksums ==="

          (
            cd "${ARTIFACT_DIR}"

            find . \
              -type f \
              ! -name 'SHA256SUMS' \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum

          ) > "${ARTIFACT_DIR}/SHA256SUMS"

          test -s "${ARTIFACT_DIR}/SHA256SUMS"

          echo
          echo "=== Generate artifact manifest ==="

          {
            echo "Device: Motorola Moto G9 Power (cebu)"
            echo "ROM: LineageOS 23.2 / Android 16"
            echo "Kernel base: Linux 4.19.325"
            echo "Architecture: arm64"
            echo "Kernel release: ${EXPECTED_RELEASE}"
            echo "Artifact type: verified kernel build output"
            echo "Flashable boot image: NO"
            echo "AnyKernel3: NO"
            echo "Flashing performed by workflow: NO"
            echo "Reboot performed by workflow: NO"
            echo "Compiled modules: ${MODULE_COUNT}"
            echo "Runtime NetHunter modules: ${RUNTIME_MODULE_COUNT}"
            echo
            echo "Kernel SHA256:"
            sha256sum "${ARTIFACT_DIR}/Image"
            echo
            echo "Runtime modules:"
            cat "${RUNTIME_DIR}/vendor-modules.list"
            echo
            echo "Contents:"
            find "${ARTIFACT_DIR}" \
              -type f \
              -printf '%P\n' \
              | sort

          } > "${ARTIFACT_DIR}/MANIFEST.txt"

          test -s "${ARTIFACT_DIR}/MANIFEST.txt"

          echo
          echo "=== Final artifact verification ==="

          test -s "${ARTIFACT_DIR}/Image"
          test -s "${ARTIFACT_DIR}/SHA256SUMS"
          test -s "${ARTIFACT_DIR}/MANIFEST.txt"

          test -s "${VENDOR_MODULE_DIR}/hci_vhci.ko"
          test -s "${VENDOR_MODULE_DIR}/qca_cld3_wlan.ko"
          test -s "${VENDOR_MODULE_DIR}/modules.dep"
          test -s "${VENDOR_MODULE_DIR}/modules.alias"
          test -s "${VENDOR_MODULE_DIR}/modules.softdep"

          echo
          echo "=== Static flashing safety audit ==="

          if find "${ARTIFACT_DIR}" \
              -type f \
              \( -name 'boot.img' -o -name 'vendor_boot.img' \) \
              -print \
              | grep -q .
          then
            echo "ERROR: unexpected flashable boot image found."
            exit 1
          fi

          if find "${ARTIFACT_DIR}" \
              -type d \
              -iname '*AnyKernel*' \
              -print \
              | grep -q .
          then
            echo "ERROR: AnyKernel3 content found."
            exit 1
          fi

          echo "PASS: no flashable boot image"
          echo "PASS: no AnyKernel3 content"

          echo
          echo "========================================"
          echo " PART 8 PASSED"
          echo "========================================"

          echo "Verified kernel artifacts packaged successfully."
          echo "VHCI module packaged and verified."
          echo "QCACLD3 WLAN module packaged and verified."
          echo "Module dependency metadata generated."
          echo "No flashing performed."
          echo "No reboot performed."

   
          
         
      - name: Upload verified kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cebu-nethunter-verified-kernel
          path: artifacts/nethunter-cebu
          if-no-files-found: error
          retention-days: 30

       
          
           




           
