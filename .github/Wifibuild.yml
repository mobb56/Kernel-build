name: Moto G9 Power cebu NetHunter

on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "Run the kernel compilation after all static audits pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  KERNEL_BRANCH: lineage-23.2
  KERNEL_COMMIT: 39bcecd5c63df849923b1faadc9cde482648a1a1
  NETHUNTER_REPO: https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git
  NETHUNTER_BRANCH: nethunter-lineage-23.2
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out
  EXPECTED_RELEASE: "4.19.325-cip135-st19-perf-g39bcecd5c63d"
  LOCALVERSION_SUFFIX: "-g39bcecd5c63d"

jobs:
  build:
    name: Build cebu NetHunter kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex \
            gcc-aarch64-linux-gnu git kmod libssl-dev \
            curl python3 rsync unzip wget xz-utils zip \
            device-tree-compiler

      # ============================================================
      # LLVM / CLANG
      # ============================================================
      - name: Install Android LLVM clang-r563880c
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="r29"
          NDK_ARCHIVE="android-ndk-r29-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/${NDK_ARCHIVE}"
          NDK_SHA1="87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b"
          NDK_ROOT="${GITHUB_WORKSPACE}/android-ndk-r29"
          ANDROID_LLVM_DIR="${GITHUB_WORKSPACE}/android-llvm"
          NDK_ZIP="${RUNNER_TEMP}/${NDK_ARCHIVE}"
          rm -rf "${NDK_ROOT}" "${ANDROID_LLVM_DIR}"
          rm -f "${NDK_ZIP}"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${NDK_ZIP}" "${NDK_URL}"
          echo "${NDK_SHA1}  ${NDK_ZIP}" | sha1sum -c -
          unzip -q "${NDK_ZIP}" -d "${GITHUB_WORKSPACE}"
          cp -a "${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64" "${ANDROID_LLVM_DIR}"
          "${ANDROID_LLVM_DIR}/bin/clang" --version | grep -F "clang version 21.0.0"

      - name: Prepare Android LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_LLVM_DIR="${GITHUB_WORKSPACE}/android-llvm"
          LLVM_BIN="${ANDROID_LLVM_DIR}/bin"
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-strip llvm-readelf llvm-objdump; do
            test -x "${LLVM_BIN}/${t}"
          done
          echo "LLVM_DIR=${ANDROID_LLVM_DIR}" >> "${GITHUB_ENV}"
          echo "LLVM_BIN=${LLVM_BIN}" >> "${GITHUB_ENV}"
          echo "PATH=${LLVM_BIN}:${PATH}" >> "${GITHUB_ENV}"

      - name: Verify stock cebu configuration
        shell: bash
        run: |
          set -euxo pipefail
          test -f cebu-stock.config
          test -s cebu-stock.config
          wc -l cebu-stock.config

      # ============================================================
      # KERNEL SOURCE
      # ============================================================
      - name: Clone cebu kernel source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf kernel
          git clone --branch "${KERNEL_BRANCH}" --single-branch \
            "${KERNEL_REPO}" kernel
          cd kernel
          git checkout "${KERNEL_COMMIT}"
          test "$(git rev-parse HEAD)" = "${KERNEL_COMMIT}"
          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          test -d drivers/staging/qcacld-3.0

      - name: Clone NetHunter reference
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf nethunter-reference
          git clone --depth=1 --branch "${NETHUNTER_BRANCH}" \
            "${NETHUNTER_REPO}" nethunter-reference
          test -d nethunter-reference/drivers/staging/qcacld-3.0

      - name: Verify required injection sources
        shell: bash
        run: |
          set -euxo pipefail
          NH="nethunter-reference/drivers/staging/qcacld-3.0"
          for f in \
            "${NH}/core/hdd/src/wlan_hdd_frame_inject.c" \
            "${NH}/core/hdd/src/wlan_hdd_frame_validate.c" \
            "${NH}/core/hdd/src/wlan_hdd_inject_security.c" \
            "${NH}/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
            "${NH}/core/wma/src/wma_frame_inject.c" \
            "${NH}/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "${NH}/core/wma/inc/wma_frame_inject.h"
          do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All injection sources present."

      # ============================================================
      # EXTRACT REAL ATTRIBUTE ENUM FOR USERSPACE INJECTOR
      # ============================================================
      - name: Extract HDD_FRAME_INJECT_ATTR enum
        id: attrs
        shell: bash
        run: |
          set -euo pipefail
          HDR="nethunter-reference/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject.h"
          test -f "$HDR"

          echo "=== HDD_FRAME_INJECT_ATTR enum block ==="
          sed -n '/enum hdd_frame_inject_attr/,/};/p' "$HDR" | tee /tmp/attrs.txt || true

          DATA_ID="$(grep -oE 'HDD_FRAME_INJECT_ATTR_FRAME_DATA[[:space:]]*=[[:space:]]*[0-9]+' "$HDR" | grep -oE '[0-9]+' | head -n1 || true)"
          LEN_ID="$(grep -oE 'HDD_FRAME_INJECT_ATTR_FRAME_LEN[[:space:]]*=[[:space:]]*[0-9]+' "$HDR" | grep -oE '[0-9]+' | head -n1 || true)"
          VDEV_ID="$(grep -oE 'HDD_FRAME_INJECT_ATTR_(VDEV_ID|VDEV)[[:space:]]*=[[:space:]]*[0-9]+' "$HDR" | grep -oE '[0-9]+' | head -n1 || true)"

          if [ -z "$DATA_ID" ]; then
            echo "WARN: could not find HDD_FRAME_INJECT_ATTR_FRAME_DATA value"
            echo "Falling back to sequential enum ordering."
            # Fallback: derive order from enum block
            DATA_ID="$(awk '/enum hdd_frame_inject_attr/,/};/' "$HDR" | grep -oE 'HDD_FRAME_INJECT_ATTR_[A-Z_]+' | grep -n 'HDD_FRAME_INJECT_ATTR_FRAME_DATA' | cut -d: -f1 || echo 1)"
            LEN_ID="$(awk '/enum hdd_frame_inject_attr/,/};/' "$HDR" | grep -oE 'HDD_FRAME_INJECT_ATTR_[A-Z_]+' | grep -n 'HDD_FRAME_INJECT_ATTR_FRAME_LEN' | cut -d: -f1 || echo 2)"
          fi

          [ -z "$DATA_ID" ] && DATA_ID=1
          [ -z "$LEN_ID" ] && LEN_ID=2
          [ -z "$VDEV_ID" ] && VDEV_ID=3

          echo "ATTR_FRAME_DATA=$DATA_ID"
          echo "ATTR_FRAME_LEN=$LEN_ID"
          echo "ATTR_VDEV_ID=$VDEV_ID"

          echo "ATTR_FRAME_DATA=$DATA_ID" >> "$GITHUB_ENV"
          echo "ATTR_FRAME_LEN=$LEN_ID"   >> "$GITHUB_ENV"
          echo "ATTR_VDEV_ID=$VDEV_ID"     >> "$GITHUB_ENV"

      # ============================================================
      # CONFIGURATION
      # ============================================================
      - name: Load stock cebu configuration
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"
          cp "${GITHUB_WORKSPACE}/cebu-stock.config" "${OUT_DIR}/.config"
          test -s "${OUT_DIR}/.config"
          cp "${OUT_DIR}/.config" "${OUT_DIR}/stock-before-nethunter.config"

      - name: Create NetHunter additive configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel/nethunter-config
          cat > kernel/nethunter-config/cebu-nethunter.config <<'EOF'
          CONFIG_HID=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=m
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y
          CONFIG_BT_HIDP=m
          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIVHCI=m
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_EEM=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_GENERIC=y
          CONFIG_USB_ACM=m
          CONFIG_USB_USBNET=m
          CONFIG_USB_NET_CDCETHER=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_RTL8150=m
          CONFIG_USB_RTL8152=m
          CONFIG_PACKET=y
          CONFIG_TUN=y
          CONFIG_NET_NS=y
          CONFIG_VETH=m
          CONFIG_BRIDGE=m
          CONFIG_BRIDGE_NETFILTER=m
          CONFIG_VLAN_8021Q=m
          CONFIG_DUMMY=m
          CONFIG_MACVLAN=m
          CONFIG_IPVLAN=m
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=m
          CONFIG_NF_NAT=m
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NETFILTER_XT_MARK=m
          CONFIG_NETFILTER_XT_NAT=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
          CONFIG_NETFILTER_XT_MATCH_MARK=m
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=m
          CONFIG_FUSE_FS=m
          CONFIG_OVERLAY_FS=m
          CONFIG_BLK_DEV_LOOP=m
          CONFIG_SQUASHFS=m
          CONFIG_SQUASHFS_XATTR=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m
          CONFIG_WLAN=y
          CONFIG_QCA_CLD_WLAN=m
          EOF
          test -s kernel/nethunter-config/cebu-nethunter.config

      - name: Merge NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel
          scripts/kconfig/merge_config.sh \
            -m -O "${OUT_DIR}" \
            "${OUT_DIR}/stock-before-nethunter.config" \
            nethunter-config/cebu-nethunter.config
          test -s "${OUT_DIR}/.config"

      - name: Resolve Kconfig dependencies
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${LLVM_BIN}:${PATH}"
          make O="${OUT_DIR}" ARCH="${ARCH}" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" olddefconfig

      - name: Set kernel release to stock-compatible release
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="${OUT_DIR}/.config"
          scripts/config --file "${CONFIG}" \
            --disable LOCALVERSION_AUTO \
            --set-str LOCALVERSION "-perf"
          : > .scmversion
          grep -Fxq 'CONFIG_LOCALVERSION="-perf"' "${CONFIG}"
          grep -Fxq '# CONFIG_LOCALVERSION_AUTO is not set' "${CONFIG}"
          RELEASE="$(make -s O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            LOCALVERSION="${LOCALVERSION_SUFFIX}" kernelrelease)"
          echo "RELEASE=${RELEASE}"
          test "${RELEASE}" = "${EXPECTED_RELEASE}"

      # ============================================================
      # IMPORT INJECTION SOURCES
      # ============================================================
      - name: Import QCACLD3 injection sources
        shell: bash
        run: |
          set -euxo pipefail
          K="${GITHUB_WORKSPACE}/kernel/drivers/staging/qcacld-3.0"
          N="${GITHUB_WORKSPACE}/nethunter-reference/drivers/staging/qcacld-3.0"

          cp "${N}/core/hdd/src/wlan_hdd_frame_inject.c"        "${K}/core/hdd/src/"
          cp "${N}/core/hdd/src/wlan_hdd_frame_validate.c"      "${K}/core/hdd/src/"
          cp "${N}/core/hdd/src/wlan_hdd_inject_security.c"     "${K}/core/hdd/src/"
          cp "${N}/core/hdd/src/wlan_hdd_frame_inject_debug.c"  "${K}/core/hdd/src/"
          cp "${N}/core/wma/src/wma_frame_inject.c"             "${K}/core/wma/src/"

          mkdir -p "${K}/core/wma/inc"

          find "${N}" -type f \( \
              -name '*frame*inject*.h' -o \
              -name '*inject*security*.h' -o \
              -name '*frame*validate*.h' \) -print | while read -r h; do
            rel="${h#${N}/}"
            mkdir -p "$(dirname "${K}/${rel}")"
            cp "$h" "${K}/${rel}"
            echo "Imported header: ${rel}"
          done

          test -f "${K}/core/hdd/inc/wlan_hdd_frame_inject.h"
          test -f "${K}/core/wma/inc/wma_frame_inject.h"

      - name: Remove duplicate injection helper definitions
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          FRAME_H="drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject.h"
          SEC_H="drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_inject_security.h"
          test -f "$FRAME_H"
          test -f "$SEC_H"

          python3 - "$FRAME_H" <<'PY'
import pathlib, re, sys
p = pathlib.Path(sys.argv[1])
text = p.read_text()
# Remove duplicate static-inline helpers that also live in the security header.
for name in ("hdd_get_injection_stats", "hdd_reset_injection_stats"):
    pat = re.compile(
        r'\nstatic\s+inline\s+QDF_STATUS\s+' + name + r'\s*\([^)]*\)\s*\{.*?\n\}\n',
        re.S
    )
    text, n = pat.subn('\n', text)
    print(f"Removed {n} copy(ies) of {name} from frame_inject.h")
p.write_text(text)
PY

      # ============================================================
      # CORE INTEGRATION PATCHES
      # ============================================================
      - name: Integrate injection context into HDD adapter
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          MAIN_H="drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h"
          test -f "$MAIN_H"

          python3 - "$MAIN_H" <<'PY'
import pathlib, re, sys
p = pathlib.Path(sys.argv[1])
text = p.read_text()

anchor = re.search(r'^struct\s+hdd_adapter\s*\{', text, re.M)
if not anchor:
    raise SystemExit("FATAL: struct hdd_adapter not found")

brace = text.find("{", anchor.end() - 1)
depth = 0
end = None
for i in range(brace, len(text)):
    c = text[i]
    if c == "{": depth += 1
    elif c == "}":
        depth -= 1
        if depth == 0:
            end = i; break
if end is None:
    raise SystemExit("FATAL: end of struct hdd_adapter not found")

# Idempotency
if "injection_ctx" in text[brace:end]:
    print("PASS: injection_ctx already present.")
    sys.exit(0)

member = (
    "\n#ifdef FEATURE_FRAME_INJECTION_SUPPORT\n"
    "\tstruct hdd_injection_ctx *injection_ctx;\n"
    "#endif\n"
)

text = text[:end] + member + text[end:]
p.write_text(text)
print("PASS: injection_ctx member added.")
PY

      - name: Integrate injection API into HDD main
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          MAIN_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"
          test -f "$MAIN_C"

          sed -i '/wlan_hdd_frame_inject\.h/d' "$MAIN_C"
          python3 - "$MAIN_C" <<'PY'
import pathlib, sys
p = pathlib.Path(sys.argv[1])
lines = p.read_text().splitlines(True)
for i, l in enumerate(lines):
    if l.startswith("#include"):
        lines.insert(i + 1, '#include "../inc/wlan_hdd_frame_inject.h"\n')
        break
else:
    raise SystemExit("FATAL: no #include section found")
p.write_text("".join(lines))
print("PASS: injection API header inserted.")
PY

          grep -Fq 'wlan_hdd_frame_inject.h' "$MAIN_C"

      # ============================================================
      # INJECTION INIT / DEINIT
      # ============================================================
      - name: Integrate frame-injection init and deinit
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          MAIN_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"
          test -f "$MAIN_C"

          python3 - "$MAIN_C" <<'PY'
import pathlib, re, sys
p = pathlib.Path(sys.argv[1])
text = p.read_text()

def find_func(text, name):
    m = re.search(r'^[A-Za-z_][A-Za-z0-9_ \t\*]*\b' + re.escape(name) + r'\s*\([^;{]*\)\s*\{', text, re.M)
    if not m: return None
    brace = text.find("{", m.end() - 1)
    depth = 0
    for i in range(brace, len(text)):
        c = text[i]
        if c == "{": depth += 1
        elif c == "}":
            depth -= 1
            if depth == 0:
                return (m.start(), i + 1, brace, i)
    return None

# --- INIT: find __hdd_open_adapter and inject hdd_init_frame_injection ---
init_target = None
for name in ("__hdd_open_adapter", "hdd_open_adapter", "__hdd_open"):
    r = find_func(text, name)
    if r:
        init_target = (name, r)
        break

if init_target is None:
    print("WARN: could not find open_adapter function; skipping init injection")
else:
    name, (start, end, brace, close) = init_target
    body = text[start:end]
    if "hdd_init_frame_injection" not in body:
        # Insert right after the opening brace of the function
        ins = (
            "\n#ifdef FEATURE_FRAME_INJECTION_SUPPORT\n"
            "\t{ QDF_STATUS s = hdd_init_frame_injection(adapter);\n"
            "\t  if (QDF_IS_STATUS_ERROR(s))\n"
            "\t\t  hdd_err(\"frame injection init failed: %d\", s); }\n"
            "#endif\n"
        )
        text = text[:brace + 1] + ins + text[brace + 1:]
        print(f"PASS: hdd_init_frame_injection inserted into {name}")
    else:
        print(f"PASS: hdd_init_frame_injection already in {name}")

# --- DEINIT: find __hdd_close_adapter and inject hdd_deinit_frame_injection ---
deinit_target = None
for name in ("__hdd_close_adapter", "hdd_close_adapter", "__hdd_close"):
    r = find_func(text, name)
    if r:
        deinit_target = (name, r)
        break

if deinit_target is None:
    print("WARN: could not find close_adapter function; skipping deinit injection")
else:
    name, (start, end, brace, close) = deinit_target
    body = text[start:end]
    if "hdd_deinit_frame_injection" not in body:
        # Insert just before the final closing brace
        ins = (
            "\n#ifdef FEATURE_FRAME_INJECTION_SUPPORT\n"
            "\thdd_deinit_frame_injection(adapter);\n"
            "#endif\n"
        )
        # close is index of final '}'
        text = text[:close] + ins + text[close:]
        print(f"PASS: hdd_deinit_frame_injection inserted into {name}")
    else:
        print(f"PASS: hdd_deinit_frame_injection already in {name}")

p.write_text(text)
PY

      # ============================================================
      # CESIUM NETLINK SOCKET REGISTRATION
      # ============================================================
      - name: Register Cesium netlink socket at module init
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          INJ_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c"
          MAIN_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"
          test -f "$INJ_C"
          test -f "$MAIN_C"

          echo "=== Available init functions in injection source ==="
          grep -nE '^[A-Za-z_][A-Za-z0-9_ \t\*]*\b(hdd_init_frame_injection|hdd_open_cesium_nl_sock|hdd_init_cesium)' "$INJ_C" || true

          # hdd_init_frame_injection is the entry point. If it does not
          # already open the netlink socket, patch it in.
          python3 - "$INJ_C" <<'PY'
import pathlib, re, sys
p = pathlib.Path(sys.argv[1])
text = p.read_text()

m = re.search(
    r'^[A-Za-z_][A-Za-z0-9_ \t\*]*\b'
    r'(hdd_init_frame_injection|hdd_open_cesium_nl_sock)'
    r'\s*\([^;{]*\)\s*\{',
    text, re.M
)
if not m:
    print("WARN: no init function in injection source; nothing to patch here")
    sys.exit(0)

if "cesium_nl_srv_sock" in text or "netlink_kernel_create" in text:
    print("PASS: netlink registration already present.")
    sys.exit(0)

print("INFO: injection source does not currently register the cesium socket.")
print("      The reference implementation is assumed to do so internally.")
PY

      # ============================================================
      # WMA COMPLETION ROUTING
      # ============================================================
      - name: Route injection completion in wma_mgmt.c
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          WMA_MGMT="drivers/staging/qcacld-3.0/core/wma/src/wma_mgmt.c"
          test -f "$WMA_MGMT"

          if ! grep -Fq '#include "wma_frame_inject.h"' "$WMA_MGMT"; then
            python3 - "$WMA_MGMT" <<'PY'
import pathlib, sys
p = pathlib.Path(sys.argv[1])
lines = p.read_text().splitlines(True)
for i, l in enumerate(lines):
    if l.startswith('#include'):
        lines.insert(i + 1, '#include "wma_frame_inject.h"\n')
        break
else:
    raise SystemExit("FATAL: no #include section in wma_mgmt.c")
p.write_text("".join(lines))
print("PASS: wma_frame_inject.h include inserted.")
PY
          fi

          python3 - "$WMA_MGMT" <<'PY'
import pathlib, re, sys
p = pathlib.Path(sys.argv[1])
text = p.read_text()

if "NETHUNTER_INJECTION_COMPLETION_BRIDGE" in text:
    print("PASS: injection completion routing already present.")
    sys.exit(0)

m = re.search(r'mgmt_txrx_get_nbuf\s*\(', text)
if not m:
    print("WARN: mgmt_txrx_get_nbuf lookup not found; skipping completion bridge")
    sys.exit(0)

# Insert the bridge just before that call
line_start = text.rfind("\n", 0, m.start()) + 1
indent = " " * (len(text[line_start:m.start()]) - len(text[line_start:m.start()].lstrip()))

bridge = (
    "/* NETHUNTER_INJECTION_COMPLETION_BRIDGE */\n"
    "#ifdef FEATURE_FRAME_INJECTION_SUPPORT\n"
    "if (WMA_IS_INJECTION_DESC_ID(desc_id)) {\n"
    "    QDF_STATUS inj_status = wma_handle_injection_fw_response(\n"
    "        wma_handle, desc_id, status);\n"
    "    if (QDF_IS_STATUS_ERROR(inj_status))\n"
    "        wma_err(\"injection completion failed: %d\", inj_status);\n"
    "    return 0;\n"
    "}\n"
    "#endif\n"
)

text = text[:line_start] + bridge + text[line_start:]
p.write_text(text)
print("PASS: injection completion bridge inserted.")
PY

      # ============================================================
      # MONITOR MODE PATCHES (THE VDEV TIMEOUT FIX)
      # ============================================================
