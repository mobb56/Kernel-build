          echo
          echo "=== HDD injection API integration passed ==="
      # ============================================================
      # 31. INTEGRATE FRAME-INJECTION INITIALIZATION
      # ============================================================

      - name: Integrate frame-injection initialization
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          MAIN_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"

          grep -n \
            "hdd_periodic_sta_stats_init(adapter)" \
            "${MAIN_C}" \
            | head -n 5

          if grep -Fq \
            "hdd_init_frame_injection(adapter);" \
            "${MAIN_C}"; then

            echo "Frame-injection initialization already integrated."

          else

            python3 - "${MAIN_C}" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          anchor = "hdd_periodic_sta_stats_init(adapter);"
          call = """
          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
                  hdd_init_frame_injection(adapter);
          #endif
          """

          if call.strip() in text:
              raise SystemExit(0)

          count = text.count(anchor)

          if count != 1:
              raise SystemExit(
                  f"ERROR: expected exactly one initialization anchor, found {count}"
              )

          text = text.replace(
              anchor,
              anchor + call,
              1
          )

          path.write_text(text)
          PY

          fi

          grep -n \
            -A5 \
            -B3 \
            "hdd_init_frame_injection" \
            "${MAIN_C}"

      # ============================================================
      # 32. INTEGRATE FRAME-INJECTION DEINITIALIZATION
      # ============================================================
      - name: Integrate frame-injection deinitialization
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          MAIN_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c"

          test -f "${MAIN_C}"

