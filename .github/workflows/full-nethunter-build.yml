            fi

            echo "FOUND: ${file}"
          done

          echo
          echo "All required injection sources are present."

      # ============================================================
      # 13. CREATE ARTIFACT DIRECTORY
      # ============================================================

      - name: Prepare audit directories
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            artifacts \
            artifacts/source-audit

          echo "Audit directories ready."

      # ============================================================
      # 14. RECORD SOURCE COMMITS
      # ============================================================

      - name: Record source versions
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "============================================================"
            echo "CEBU NETHUNTER SOURCE MANIFEST"
            echo "============================================================"
            echo
            echo "Kernel repository:"
            echo "${KERNEL_REPO}"
            echo
            echo "Kernel branch:"
            echo "${KERNEL_BRANCH}"
            echo
            echo "Kernel commit:"
            git -C kernel rev-parse HEAD
            echo
            echo "NetHunter repository:"
            echo "${NETHUNTER_REPO}"
            echo
            echo "NetHunter branch:"
            echo "${NETHUNTER_BRANCH}"
            echo
            echo "NetHunter commit:"
            git -C nethunter-reference rev-parse HEAD
            echo
            echo "Architecture:"
            echo "${ARCH}"
            echo
            echo "Cross compiler:"
            echo "${CROSS_COMPILE}"
            echo
            echo "LLVM:"
            echo "${LLVM_DIR}"
          } > artifacts/source-audit/source-manifest.txt

          cat artifacts/source-audit/source-manifest.txt

      # ============================================================
      # 15. SAVE STOCK CONFIGURATION HASH
      # ============================================================

      - name: Record stock configuration hash
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum \
            cebu-stock.config \
            > artifacts/source-audit/stock-config.sha256

          cat artifacts/source-audit/stock-config.sha256


      # ============================================================
      # 16. PREPARE KERNEL OUTPUT DIRECTORY
      # ============================================================

      - name: Prepare kernel output directory
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          echo "Kernel output directory:"
          echo "${OUT_DIR}"

      # ============================================================
      # 17. LOAD THE VERIFIED STOCK CEBU CONFIGURATION
      #
      # IMPORTANT:
      # We deliberately start from the real configuration extracted
      # from the running stock kernel.
      # ============================================================

      - name: Load stock cebu configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          cp \
            "${GITHUB_WORKSPACE}/cebu-stock.config" \
            "${OUT_DIR}/.config"

          test -s "${OUT_DIR}/.config"

          echo "Loaded stock cebu configuration."

          echo
          echo "Configuration:"
          wc -l "${OUT_DIR}/.config"

          sha256sum "${OUT_DIR}/.config"

      # ============================================================
      # 18. VERIFY CRITICAL STOCK HARDWARE CONFIGURATION
      # ============================================================

      



      - name: Verify critical stock build configuration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${OUT_DIR}/.config"

          test -s "${CONFIG}"

          echo "============================================================"
          echo " CRITICAL STOCK CONFIGURATION CHECK"
          echo "============================================================"

          REQUIRED=(
            "CONFIG_LTO=y"
            "CONFIG_THINLTO=y"
            "CONFIG_LTO_CLANG=y"
            "CONFIG_CFI=y"
            "CONFIG_CFI_CLANG=y"
            "CONFIG_CFI_CLANG_SHADOW=y"
            "CONFIG_SHADOW_CALL_STACK=y"
            "CONFIG_INIT_STACK_ALL_ZERO=y"
            "CONFIG_DEBUG_INFO=y"
            "CONFIG_MODVERSIONS=y"
            "CONFIG_HZ_300=y"
            "CONFIG_HZ=300"
            "CONFIG_INPUT_TOUCHSCREEN=y"
            "CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI_MMI=m"
            "CONFIG_INPUT_TOUCHSCREEN_FOCALTECH_0FLASH_MMI=m"
            "CONFIG_TOUCHSCREEN_CHIPONE_TDDI=m"
            "CONFIG_INPUT_MISC_FPC1020=m"
            "CONFIG_I2C_QCOM_GENI=y"
            "CONFIG_SPI_QCOM_GENI=y"
            "CONFIG_WLAN=y"
            "CONFIG_QCA_CLD_WLAN=m"
            "CONFIG_RMNET=y"
            "CONFIG_IPA3=y"
            "CONFIG_RMNET_IPA3=y"
            "CONFIG_USB_GADGET=y"
            "CONFIG_USB_CONFIGFS=y"
            "CONFIG_HIDRAW=y"
            "CONFIG_UHID=y"
          )

          for expected in "${REQUIRED[@]}"; do
            if ! grep -Fxq "${expected}" "${CONFIG}"; then
              echo
              echo "ERROR: Critical stock configuration mismatch:"
              echo "  ${expected}"
              echo
              echo "The final kernel configuration is NOT stock-compatible."
              exit 1
            fi

            echo "OK: ${expected}"
          done

          echo
          echo "============================================================"
          echo " CRITICAL STOCK CONFIGURATION PASSED"
          echo "============================================================"

      # ============================================================
      # 19. VERIFY STOCK COMPILER METADATA
      #
      # The real stock config records Clang/AS/LLD 21.
      # ============================================================

      - name: Verify stock compiler configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          echo "Stock compiler metadata:"

          grep -E \
            '^CONFIG_(CLANG_VERSION|AS_VERSION|LLD_VERSION)=' \
            "${CONFIG}"

          test \
            "$(sed -n 's/^CONFIG_CLANG_VERSION=//p' "${CONFIG}")" \
            = "210000"

          test \
            "$(sed -n 's/^CONFIG_AS_VERSION=//p' "${CONFIG}")" \
            = "210000"

          test \
            "$(sed -n 's/^CONFIG_LLD_VERSION=//p' "${CONFIG}")" \
            = "210000"

          echo
          echo "Stock compiler metadata verified."




      # ============================================================
      # CREATE COMPLETE NETHUNTER CONFIGURATION
      # ============================================================

      - name: Create complete NetHunter configuration
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p kernel/nethunter-config

          cat > kernel/nethunter-config/cebu-nethunter.config <<'EOF'
          # ============================================================
          # Moto G9 Power cebu - NetHunter additive configuration
          #
          # IMPORTANT:
          # This is merged into the verified stock cebu configuration.
          #
          # Do NOT put:
          #   CONFIG_LTO
          #   CONFIG_CFI
          #   CONFIG_SHADOW_CALL_STACK
          #   CONFIG_MODVERSIONS
          #   CONFIG_DEBUG_INFO
          # etc. here.
          #
          # Those ABI/security/compiler settings come from stock.
          #
          # QCACLD3 FEATURE_* variables are Kbuild variables and do
          # NOT belong in this file.
          # ============================================================

          # ============================================================
          # HID
          # ============================================================

          CONFIG_HID=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y


          # ============================================================
          # BLUETOOTH
          # ============================================================

          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y

          # RFCOMM deliberately built into kernel.
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y

          # NetHunter Bluetooth PAN.
          CONFIG_BT_BNEP=m
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y

          # Bluetooth HID.
          CONFIG_BT_HIDP=m

          # Bluetooth HCI UART.
          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y

          # Bluetooth VHCI.
          CONFIG_BT_HCIVHCI=m


          # ============================================================
          # USB GADGET / CONFIGFS
          # ============================================================

          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y

          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_EEM=y

          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y


          # ============================================================
          # USB SERIAL
          # ============================================================

          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_GENERIC=y

          CONFIG_USB_ACM=m


          # ============================================================
          # USB NETWORKING
          # ============================================================

          CONFIG_USB_USBNET=m
          CONFIG_USB_NET_CDCETHER=m
          CONFIG_USB_NET_CDC_NCM=m


          # ============================================================
          # USB ETHERNET ADAPTERS
          # ============================================================

          CONFIG_USB_RTL8150=m
          CONFIG_USB_RTL8152=m


          # ============================================================
          # PACKET SOCKETS
          # ============================================================

          CONFIG_PACKET=y


          # ============================================================
          # SENSORS
          # ============================================================

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m


          # ============================================================
          # QUALCOMM WLAN
          # ============================================================

          CONFIG_WLAN=y
          CONFIG_QCA_CLD_WLAN=m


          # ============================================================
          # END
          # ============================================================
          EOF

          test -s kernel/nethunter-config/cebu-nethunter.config

          echo
          echo "=== COMPLETE NETHUNTER CONFIGURATION ==="
          cat kernel/nethunter-config/cebu-nethunter.config
    

      # ============================================================
      # 21. VERIFY FORBIDDEN FEATURE SYMBOLS ARE ABSENT
      # ============================================================

      - name: Verify injection feature symbols are not config symbols
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          FRAGMENT="nethunter-config/cebu-nethunter.config"

          if grep -Eq \
            '^CONFIG_(FEATURE_FRAME_INJECTION_SUPPORT|FEATURE_MONITOR_MODE_SUPPORT)(=| is not set)' \
            "${FRAGMENT}"; then

            echo "ERROR: QCACLD3 FEATURE_* variable was incorrectly added"
            echo "to the kernel configuration fragment."

            exit 1
          fi

          echo
          echo "QCACLD3 FEATURE_* variables correctly absent."

      # ============================================================
      # 22. MERGE NETHUNTER FRAGMENT
      # ============================================================

      - name: Merge NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG_BEFORE="${OUT_DIR}/stock-before-nethunter.config"

          cp \
            "${OUT_DIR}/.config" \
            "${CONFIG_BEFORE}"

          scripts/kconfig/merge_config.sh \
          -m \
          -O "${OUT_DIR}" \
          "${CONFIG_BEFORE}" \
           nethunter-config/cebu-nethunter.config

          test -s "${OUT_DIR}/.config"

          echo
          echo "NetHunter fragment merged."



      - name: Audit CFI/LTO before olddefconfig
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${OUT_DIR}/.config"

          echo "============================================================"
          echo "CFI/LTO CONFIG BEFORE OLDDEFCONFIG"
          echo "============================================================"

          for SYMBOL in \
            LTO \
            THINLTO \
            LTO_CLANG \
            LTO_NONE \
            CFI \
            CFI_CLANG \
            CFI_CLANG_SHADOW \
            SHADOW_CALL_STACK \
            INIT_STACK_ALL_ZERO \
            DEBUG_INFO \
            MODVERSIONS
          do
            echo -n "${SYMBOL}: "
            scripts/config --file "${CONFIG}" --state "${SYMBOL}" || true
          done

          echo
          echo "Relevant raw config lines:"
          grep -E \
            '^(CONFIG_(LTO|THINLTO|LTO_CLANG|LTO_NONE|CFI|CFI_CLANG|CFI_CLANG_SHADOW|SHADOW_CALL_STACK|INIT_STACK_ALL_ZERO|DEBUG_INFO|MODVERSIONS)=|# CONFIG_(LTO|THINLTO|LTO_CLANG|LTO_NONE|CFI|CFI_CLANG|CFI_CLANG_SHADOW|SHADOW_CALL_STACK|INIT_STACK_ALL_ZERO|DEBUG_INFO|MODVERSIONS) is not set)' \
            "${CONFIG}" || true

      # ============================================================
      # 23. RESOLVE KCONFIG DEPENDENCIES
      #
      # olddefconfig is allowed here because we will audit every
      # resulting difference later.
      - name: Resolve Kconfig dependencies
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "KCONFIG RESOLUTION / ABI SAFETY CHECK"
          echo "============================================================"

          CONFIG="${OUT_DIR}/.config"
          STOCK_CONFIG="${GITHUB_WORKSPACE}/cebu-stock.config"
          PREMERGE_CONFIG="${OUT_DIR}/stock-before-nethunter.config"

          test -s "${CONFIG}"
          test -s "${STOCK_CONFIG}"
          test -s "${PREMERGE_CONFIG}"

          test -x "${LLVM_BIN}/clang"
          test -x "${LLVM_BIN}/ld.lld"

          export PATH="${LLVM_BIN}:${PATH}"

          echo
          echo "=== Verify Android Clang ==="
          clang --version
          ld.lld --version

          echo
          echo "=== Verify exact stock config before Kconfig resolution ==="

          STOCK_SHA="$(sha256sum "${STOCK_CONFIG}" | awk '{print $1}')"
          PREMERGE_SHA="$(sha256sum "${PREMERGE_CONFIG}" | awk '{print $1}')"

          echo "Stock config:    ${STOCK_SHA}"
          echo "Pre-merge copy:  ${PREMERGE_SHA}"

          test "${STOCK_SHA}" = "${PREMERGE_SHA}"

          echo
          echo "=== Critical settings BEFORE olddefconfig ==="

          REQUIRED=(
            "LTO=y"
            "THINLTO=y"
            "LTO_CLANG=y"
            "CFI=y"
            "CFI_CLANG=y"
            "CFI_CLANG_SHADOW=y"
            "SHADOW_CALL_STACK=y"
            "INIT_STACK_ALL_ZERO=y"
            "DEBUG_INFO=y"
            "MODVERSIONS=y"
            "HZ_300=y"
          )

          for item in "${REQUIRED[@]}"; do
            symbol="${item%%=*}"
            expected="${item#*=}"

            actual="$(
              scripts/config \
                --file "${CONFIG}" \
                --state "${symbol}"
            )"

            echo "${symbol}: ${actual}"

            test "${actual}" = "${expected}"
          done

          echo
          echo "=== Running olddefconfig ==="

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig



          echo
          echo "=========================================================="
          echo "KCONFIG DELTA AFTER OLDDEFCONFIG"
          echo "============================================================"

          FINAL_CONFIG="${OUT_DIR}/.config"
          PREMERGE_CONFIG="${OUT_DIR}/stock-before-nethunter.config"

          awk '
            /^[#] CONFIG_[A-Za-z0-9_]+ is not set$/ {
              print $2 "=n"
              next
            }

            /^CONFIG_[A-Za-z0-9_]+=/ {
              line=$0
              sub(/^CONFIG_/, "", line)
              split(line, a, "=")
              print "CONFIG_" a[1] "=" a[2]
            }
          ' "${PREMERGE_CONFIG}" | sort > "${OUT_DIR}/premerge.normalized"

          awk '
            /^[#] CONFIG_[A-Za-z0-9_]+ is not set$/ {
              print $2 "=n"
              next
            }

            /^CONFIG_[A-Za-z0-9_]+=/ {
              line=$0
              sub(/^CONFIG_/, "", line)
              split(line, a, "=")
              print "CONFIG_" a[1] "=" a[2]
            }
          ' "${FINAL_CONFIG}" | sort > "${OUT_DIR}/final.normalized"

          echo
          echo "=== Changes introduced by NetHunter merge + olddefconfig ==="

          comm -3 \
            "${OUT_DIR}/premerge.normalized" \
            "${OUT_DIR}/final.normalized" \
            > "${OUT_DIR}/kconfig-full-delta.txt"

          cat "${OUT_DIR}/kconfig-full-delta.txt"

          echo
          echo "=== DEBUG_FS dependency-related symbols ==="

          grep -E \
            '(^|[[:space:]])CONFIG_(DEBUG_FS|DEBUG_KERNEL|DEBUG_MISC|DEBUG_INFO|STACKTRACE|KALLSYMS|KALLSYMS_ALL|LOCKDEP|FTRACE|FUNCTION_TRACER|TRACING|KGDB|PROFILING)=' \
            "${FINAL_CONFIG}" \
            || true

          echo
          echo "=== Critical settings AFTER olddefconfig ==="

          for item in "${REQUIRED[@]}"; do
            symbol="${item%%=*}"
            expected="${item#*=}"

            actual="$(
              scripts/config \
                --file "${CONFIG}" \
                --state "${symbol}"
            )"

            echo "${symbol}: ${actual}"

            if [ "${actual}" != "${expected}" ]; then
              echo
              echo "ERROR: olddefconfig changed a stock ABI/security setting."
              echo "  Symbol:   ${symbol}"
              echo "  Expected: ${expected}"
              echo "  Actual:   ${actual}"
              echo
              echo "This proves the problem occurs during Kconfig resolution."
              exit 1
            fi
          done

          echo
          echo "============================================================"
          echo "KCONFIG RESOLUTION PASSED"
          echo "All required stock ABI/security settings survived."
          echo "============================================================"






      # ============================================================
      # ABI-SENSITIVE CONFIGURATION AUDIT
      #
      # The failing symbols include module_layout and cfg80211 APIs.
      # Audit every CONFIG_* symbol referenced by the kernel module
      # and cfg80211 public headers.
      #
      # A NetHunter feature is not allowed to silently alter one of
      # these configuration conditions.
      # ============================================================

      - name: Audit ABI-sensitive configuration
        working-directory: kernel
        shell: bash
        run: |
           set -euo pipefail
           
           STOCK_CONFIG="${GITHUB_WORKSPACE}/cebu-stock.config"
           FINAL_CONFIG="${OUT_DIR}/.config"

            test -s "${STOCK_CONFIG}"
            test -s "${FINAL_CONFIG}"

            echo "============================================================"
            echo "ABI-SENSITIVE CONFIGURATION AUDIT"
            echo "============================================================"

             FAILED=0

              for HEADER in \
              include/linux/module.h \
              include/net/cfg80211.h
             do
            echo
            echo "------------------------------------------------------------"
            echo "Header: ${HEADER}"
            echo "------------------------------------------------------------"

               while read -r SYMBOL; do

