              raise SystemExit(
                  "FAIL: state-device destroy is not after "
                  "hdd_driver_unload()."
              )

          print("PASS: module_exit() exists.")
          print("PASS: exactly one hdd_driver_unload().")
          print("PASS: exactly one state-device destroy.")
          print("PASS: destroy occurs after hdd_driver_unload().")
          print()
          print("QCACLD3 module lifecycle verification PASSED.")
          PY

      # ============================================================
      # 33. APPLY 4.19 CAP_NET_RAW COMPATIBILITY
      #
      # The older injection security implementation can use credential
      # APIs that are inappropriate for this 4.19 kernel.
      #
      # Only make the replacement if the expected function exists.
      # ============================================================

      - name: Apply 4.19 injection capability compatibility
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          SECURITY_C="drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c"

          test -f "${SECURITY_C}"

          echo "Relevant capability code:"

          grep -n \
            -A15 \
            -B5 \
            "hdd_check_injection_capability" \
            "${SECURITY_C}" \
            || true

          if grep -Fq \
            "capable(CAP_NET_RAW)" \
            "${SECURITY_C}"; then

            echo "CAP_NET_RAW compatibility already present."

          elif grep -Fq \
            "hdd_check_injection_capability" \
            "${SECURITY_C}"; then

            python3 - "${SECURITY_C}" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          pattern = re.compile(
              r"""
              hdd_check_injection_capability
              \s*\(
              [^)]*
              \)
              \s*\{
              .*?
              \n\}
              """,
              re.S | re.X
          )

          match = pattern.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: could not safely locate "
                  "hdd_check_injection_capability body"
              )

          replacement = """hdd_check_injection_capability(struct task_struct *task)
          {
                  return capable(CAP_NET_RAW);
          }"""

          text = text[:match.start()] + replacement + text[match.end():]

          path.write_text(text)
          PY

          else
            echo "ERROR: expected injection capability function was not found."
            exit 1
          fi

          echo
          echo "Final capability implementation:"

          grep -n \
            -A8 \
            -B3 \
            "hdd_check_injection_capability" \
            "${SECURITY_C}"

          grep -Fq \
            "capable(CAP_NET_RAW)" \
            "${SECURITY_C}"




            

