name: Build Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang-14 \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Setup LLVM environment
        run: |
          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

          echo "LLVM:"
          /usr/lib/llvm-14/bin/clang --version

          echo
          echo "LLD:"
          /usr/lib/llvm-14/bin/ld.lld --version

      - name: Checkout LineageOS kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6225
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      - name: Checkout cebu device tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_cebu
          ref: lineage-23.2
          path: device/motorola/cebu
          fetch-depth: 1

      - name: Checkout SM6225 common tree
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_device_motorola_sm6225-common
          ref: lineage-23.2
          path: device/motorola/sm6225-common
          fetch-depth: 1

      - name: Verify source
        run: |
          echo "===== Kernel ====="
          git -C kernel rev-parse --short HEAD

          echo
          echo "===== Cebu device tree ====="
          git -C device/motorola/cebu rev-parse --short HEAD

          echo
          echo "===== Common tree ====="
          git -C device/motorola/sm6225-common rev-parse --short HEAD

          echo
          echo "===== Defconfig ====="
          test -f kernel/arch/arm64/configs/vendor/bengal-perf_defconfig
          echo "vendor/bengal-perf_defconfig found"

          echo
          echo "===== Cebu BoardConfig ====="
          grep -n "TARGET_KERNEL_CONFIG" \
            device/motorola/cebu/BoardConfig.mk || true

      - name: Create NetHunter config
        run: |
          cat > kernel/nethunter.config <<'EOF'

          #
          # Bluetooth
          #
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y

          #
          # USB Gadget / HID
          #
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y

          #
          # USB networking
          #
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_F_FS=y

          #
          # HID / input
          #
          CONFIG_INPUT_EVDEV=y
          CONFIG_INPUT_UINPUT=y
          CONFIG_UHID=y
          CONFIG_HIDRAW=y

          #
          # Networking
          #
          CONFIG_PACKET=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_TUN=y
          CONFIG_VETH=y

          #
          # Wireless framework
          #
          CONFIG_CFG80211=y
          CONFIG_RFKILL=y

          EOF

      - name: Configure kernel
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          echo "Using:"
          which clang
          which ld.lld
          clang --version
          ld.lld --version

          echo
          echo "Creating base configuration..."

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          echo
          echo "Merging NetHunter configuration..."

          scripts/kconfig/merge_config.sh \
            -m \
            out/.config \
            nethunter.config

          echo
          echo "Finalizing configuration..."

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      - name: Verify kernel configuration
        working-directory: kernel
        run: |
          echo "===== Bluetooth ====="
          grep -E \
            'CONFIG_BT=|CONFIG_BT_BREDR=|CONFIG_BT_RFCOMM=|CONFIG_BT_HIDP=|CONFIG_BT_HCIVHCI=' \
            out/.config || true

          echo
          echo "===== USB HID ====="
          grep -E \
            'CONFIG_USB_GADGET=|CONFIG_USB_CONFIGFS=|CONFIG_USB_CONFIGFS_F_HID=' \
            out/.config || true

          echo
          echo "===== Networking ====="
          grep -E \
            'CONFIG_PACKET=|CONFIG_NETFILTER=|CONFIG_TUN=|CONFIG_VETH=' \
            out/.config || true

          echo
          echo "===== Wireless ====="
          grep -E \
            'CONFIG_CFG80211=|CONFIG_RFKILL=' \
            out/.config || true

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image \
            dtbs \
            modules

      - name: Collect kernel artifacts
        run: |
          mkdir -p artifacts

          cp kernel/out/arch/arm64/boot/Image \
            artifacts/Image

          find kernel/out/arch/arm64/boot/dts \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp {} artifacts/ \; || true

          cp kernel/out/.config \
            artifacts/kernel.config

          cp kernel/nethunter.config \
            artifacts/nethunter.config

          echo
          echo "===== BUILD OUTPUT ====="
          ls -lh artifacts

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          path: artifacts/
          if-no-files-found: error
