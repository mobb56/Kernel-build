          FINAL="${OUT_DIR}/.config"

          check_same() {
            local symbol="$1"

            local stock_value
            local final_value

            stock_value="$(
              grep -E "^${symbol}=" "${STOCK}" |
                head -n1 || true
            )"

            final_value="$(
              grep -E "^${symbol}=" "${FINAL}" |
                head -n1 || true
            )"

            if [ -z "${stock_value}" ]; then
              echo "ERROR: stock symbol not found: ${symbol}"
              exit 1
            fi

            if [ "${stock_value}" != "${final_value}" ]; then
              echo
              echo "ERROR: STOCK CONFIGURATION CHANGED"
              echo "Symbol: ${symbol}"
              echo "Stock:  ${stock_value}"
              echo "Final:  ${final_value}"
              exit 1
            fi

            echo "UNCHANGED: ${stock_value}"
          }

