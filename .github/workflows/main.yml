name: Build Moto G9 Power NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      OUT_DIR: ${{ github.workspace }}/kernel-out
      ANYKERNEL_DIR: ${{ github.workspace }}/AnyKernel3

    steps:

      # ============================================================
      # 1. Checkout workflow repository
      # ============================================================
      - name: Set up job
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            zip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          sudo apt-get install -y llvm-14 lld-14

          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

          echo "Toolchain:"
          clang-14 --version
          ld.lld-14 --version
          aarch64-linux-gnu-gcc --version

      # ============================================================
      # 3. Clone official LineageOS SM6225 kernel
      # ============================================================
      - name: Clone LineageOS kernel
        run: |
          set -e

          rm -rf "$KERNEL_DIR"
          rm -rf "$OUT_DIR"

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo "Remote:"
          git remote -v

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

      # ============================================================
      # 4. Prepare clean OUT directory
      # ============================================================
      - name: Prepare build directories
        run: |
          set -e

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          echo "KERNEL_DIR=$KERNEL_DIR"
          echo "OUT_DIR=$OUT_DIR"

      # ============================================================
      # 5. Verify base defconfig
      # ============================================================
      - name: Verify Bengal base configuration
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          CONFIG_FILE="arch/arm64/configs/vendor/bengal-perf_defconfig"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: $CONFIG_FILE not found."
            exit 1
          fi

          echo "Base configuration found:"
          ls -lh "$CONFIG_FILE"

      # ============================================================
      # 6. Create NetHunter configuration OUTSIDE kernel tree
      # ============================================================
      - name: Create NetHunter configuration
        run: |
          set -e

          NH_CONFIG="$GITHUB_WORKSPACE/nethunter.config"

          rm -f "$NH_CONFIG"

          cat > "$NH_CONFIG" <<'EOF'
          # ==========================================================
          # Bluetooth
          # ==========================================================

          CONFIG_BT=y
          CONFIG_BT_BREDR=y

          CONFIG_BT_RFCOMM=m
          CONFIG_BT_RFCOMM_TTY=y

          CONFIG_BT_HIDP=m

          CONFIG_BT_HCIVHCI=m

          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y


          # ==========================================================
          # USB gadget / HID
          # ==========================================================

          CONFIG_USB_GADGET=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_CONFIGFS=y

          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_NCM=y


          # ==========================================================
          # Userspace input
          # ==========================================================

          CONFIG_INPUT_UINPUT=y


          # ==========================================================
          # Networking
          # ==========================================================

          CONFIG_TUN=y
          CONFIG_VETH=y


          # ==========================================================
          # Wireless framework
          # ==========================================================

          CONFIG_CFG80211=y
          CONFIG_RFKILL=y

          CONFIG_NL80211_TESTMODE=y


          # ==========================================================
          # Motorola sensor dependency
          # ==========================================================

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m
          EOF

          echo "NetHunter configuration:"
          cat "$NH_CONFIG"

      # ============================================================
      # 7. Configure kernel
      # ============================================================
      - name: Configure kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          rm -f "$OUT_DIR/.config"

          echo "Generating Bengal base configuration..."

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/bengal-perf_defconfig

          echo
          echo "Merging NetHunter configuration..."

          scripts/kconfig/merge_config.sh \
            -m \
            -O "$OUT_DIR" \
            "$OUT_DIR/.config" \
            "$GITHUB_WORKSPACE/nethunter.config"

          echo
          echo "Running olddefconfig..."

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      # ============================================================
      # 8. Verify NetHunter configuration
      # ============================================================
      - name: Verify NetHunter configuration
        run: |
          set -e

          CONFIG="$OUT_DIR/.config"

          check_config() {
            SYMBOL="$1"

            VALUE="$(grep -E "^${SYMBOL}=" "$CONFIG" || true)"

            if [ -z "$VALUE" ]; then
              echo "ERROR: $SYMBOL is missing"
              exit 1
            fi

            case "$VALUE" in
              "$SYMBOL=y"|"$SYMBOL=m")
                echo "OK: $VALUE"
                ;;
              *)
                echo "ERROR: $VALUE"
                exit 1
                ;;
            esac
          }

          echo "Checking required configuration..."
          echo

          check_config CONFIG_BT
          check_config CONFIG_BT_BREDR
          check_config CONFIG_BT_RFCOMM
          check_config CONFIG_BT_HIDP
          check_config CONFIG_BT_HCIVHCI
          check_config CONFIG_BT_HCIUART
          check_config CONFIG_USB_GADGET
          check_config CONFIG_USB_LIBCOMPOSITE
          check_config CONFIG_USB_CONFIGFS
          check_config CONFIG_USB_CONFIGFS_F_HID
          check_config CONFIG_USB_CONFIGFS_NCM
          check_config CONFIG_INPUT_UINPUT
          check_config CONFIG_TUN
          check_config CONFIG_VETH
          check_config CONFIG_CFG80211
          check_config CONFIG_RFKILL
          check_config CONFIG_NL80211_TESTMODE
          check_config CONFIG_SENSORS_SSC
          check_config CONFIG_SENSORS_CLASS

          echo
          echo "Configuration verification passed."

      # ============================================================
      # 9. Verify source tree is clean
      # ============================================================
      - name: Verify clean kernel source
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          echo "Git status:"
          git status --short

          if [ -n "$(git status --porcelain)" ]; then
            echo
            echo "ERROR: Kernel source tree is dirty."
            exit 1
          fi

          echo
          echo "Kernel source tree is clean."

      # ============================================================
      # 10. Get release directly from Kbuild
      # ============================================================
      - name: Verify kernel release
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          BUILT_RELEASE="$(
            make -s \
              O="$OUT_DIR" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              kernelrelease
          )"

          echo "=========================================="
          echo "KERNEL RELEASE"
          echo "=========================================="
          echo "$BUILT_RELEASE"
          echo "=========================================="

          if [ -z "$BUILT_RELEASE" ]; then
            echo "ERROR: kernelrelease is empty."
            exit 1
          fi

          case "$BUILT_RELEASE" in
            *-dirty)
              echo "ERROR: kernel release contains -dirty."
              exit 1
              ;;
          esac

          printf '%s\n' "$BUILT_RELEASE" \
            > "$GITHUB_WORKSPACE/kernel-release.txt"

          echo "Kernel release accepted."

      # ============================================================
      # 11. Save configuration
      # ============================================================
      - name: Save final kernel config
        run: |
          set -e

          cp \
            "$OUT_DIR/.config" \
            "$GITHUB_WORKSPACE/kernel.config"

          cp \
            "$GITHUB_WORKSPACE/nethunter.config" \
            "$GITHUB_WORKSPACE/nethunter-final.config"

          echo "Saved final configuration files."

      # ============================================================
      # 12. Build kernel Image
      # ============================================================
      - name: Build kernel Image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

      # ============================================================
      # 13. Verify Image
      # ============================================================
      - name: Verify kernel Image
        run: |
          set -e

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image was not produced."
            exit 1
          fi

          echo "Kernel Image:"
          ls -lh "$IMAGE"

      # ============================================================
      # 14. Build modules
      # ============================================================
      - name: Build kernel modules
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules

      # ============================================================
      # 15. Install modules into staging directory
      # ============================================================
      - name: Install kernel modules
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e

          MODULE_STAGE="$GITHUB_WORKSPACE/module-stage"

          rm -rf "$MODULE_STAGE"
          mkdir -p "$MODULE_STAGE"

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_install \
            INSTALL_MOD_PATH="$MODULE_STAGE" \
            INSTALL_MOD_STRIP=1

          RELEASE="$(cat "$GITHUB_WORKSPACE/kernel-release.txt")"

          MODULE_DIR="$MODULE_STAGE/lib/modules/$RELEASE"

          echo "Expected module directory:"
          echo "$MODULE_DIR"

          if [ ! -d "$MODULE_DIR" ]; then
            echo "ERROR: Module directory was not created."
            find "$MODULE_STAGE" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo
          echo "Installed modules:"
          find "$MODULE_DIR" \
            -type f \
            -name '*.ko' \
            -printf '%f\n' \
            | sort

      # ============================================================
      # 16. Prepare vendor/lib/modules tree
      # ============================================================
      - name: Prepare vendor modules
        run: |
          set -e

          RELEASE="$(cat "$GITHUB_WORKSPACE/kernel-release.txt")"

          MODULE_DIR="$GITHUB_WORKSPACE/module-stage/lib/modules/$RELEASE"

          AK_MODULE_DIR="$GITHUB_WORKSPACE/ak-modules/vendor/lib/modules"

          rm -rf "$GITHUB_WORKSPACE/ak-modules"

          mkdir -p "$AK_MODULE_DIR"

          find "$MODULE_DIR" \
            -type f \
            -name '*.ko' \
            -exec cp -f {} "$AK_MODULE_DIR/" \;

          MODULE_COUNT="$(
            find "$AK_MODULE_DIR" \
              -type f \
              -name '*.ko' \
              | wc -l
          )"

          echo "Module count: $MODULE_COUNT"

          if [ "$MODULE_COUNT" -eq 0 ]; then
            echo "ERROR: No .ko modules found."
            exit 1
          fi

          echo
          echo "Modules:"
          find "$AK_MODULE_DIR" \
            -type f \
            -name '*.ko' \
            -printf '%f\n' \
            | sort

      # ============================================================
      # 17. Verify sensors_class
      # ============================================================
      - name: Verify sensors_class module
        run: |
          set -e

          SENSOR="$GITHUB_WORKSPACE/ak-modules/vendor/lib/modules/sensors_class.ko"

          if [ ! -f "$SENSOR" ]; then
            echo "ERROR: sensors_class.ko missing."
            exit 1
          fi

          echo "sensors_class.ko:"
          ls -lh "$SENSOR"

          echo
          echo "Module information:"
          modinfo "$SENSOR" 2>/dev/null \
            | grep -E '^(filename|version|vermagic|depends):' \
            || true

      # ============================================================
      # 18. Verify every module vermagic
      # ============================================================
      - name: Verify module vermagic
        run: |
          set -e

          RELEASE="$(cat "$GITHUB_WORKSPACE/kernel-release.txt")"

          echo "Expected release:"
          echo "$RELEASE"

          FAILED=0

          while IFS= read -r MODULE; do

            VERMAGIC="$(
              modinfo "$MODULE" 2>/dev/null \
                | sed -n 's/^vermagic: //p'
            )"

            MODULE_RELEASE="$(printf '%s\n' "$VERMAGIC" | awk '{print $1}')"

            echo
            echo "Module: $(basename "$MODULE")"
            echo "Vermagic: $VERMAGIC"

            if [ "$MODULE_RELEASE" != "$RELEASE" ]; then
              echo "ERROR: Release mismatch."
              echo "Expected: $RELEASE"
              echo "Actual:   $MODULE_RELEASE"
              FAILED=1
            else
              echo "OK"
            fi

          done < <(
            find "$GITHUB_WORKSPACE/ak-modules" \
              -type f \
              -name '*.ko' \
              | sort
          )

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "ERROR: One or more modules have incorrect vermagic."
            exit 1
          fi

          echo
          echo "All module vermagic values match."

      # ============================================================
      # 19. Clone AnyKernel3
      # ============================================================
      - name: Prepare AnyKernel3
        run: |
          set -e

          rm -rf "$ANYKERNEL_DIR"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            "$ANYKERNEL_DIR"

          rm -rf \
            "$ANYKERNEL_DIR/.git" \
            "$ANYKERNEL_DIR/.github"

          echo "AnyKernel3 prepared."

      # ============================================================
      # 20. Configure AnyKernel3
      # ============================================================
      - name: Configure AnyKernel3
        run: |
          set -e

          cd "$ANYKERNEL_DIR"

          cat > anykernel.sh <<'EOF'
          #!/bin/sh

          properties() { '
          kernel.string=Moto G9 Power cebu NetHunter Kernel

          do.devicecheck=1
          do.modules=1
          do.systemless=0

          do.cleanup=1
          do.cleanuponabort=0

          device.name1=cebu
          device.name2=

          supported.versions=16
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot
          IS_SLOT_DEVICE=auto

          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto

          . tools/ak3-core.sh

          dump_boot
          write_boot
          EOF

          chmod +x anykernel.sh

          echo "AnyKernel script:"
          cat anykernel.sh

      # ============================================================
      # 21. Put Image + modules into AnyKernel3
      # ============================================================
      - name: Prepare AnyKernel kernel files
        run: |
          set -e

          cp \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$ANYKERNEL_DIR/Image"

          mkdir -p \
            "$ANYKERNEL_DIR/modules/vendor/lib/modules"

          cp \
            "$GITHUB_WORKSPACE/ak-modules/vendor/lib/modules/"*.ko \
            "$ANYKERNEL_DIR/modules/vendor/lib/modules/"

          cp \
            "$GITHUB_WORKSPACE/kernel-release.txt" \
            "$ANYKERNEL_DIR/kernel-release.txt"

          cp \
            "$GITHUB_WORKSPACE/kernel.config" \
            "$ANYKERNEL_DIR/kernel.config"

          cp \
            "$GITHUB_WORKSPACE/nethunter-final.config" \
            "$ANYKERNEL_DIR/nethunter.config"

          echo "AnyKernel kernel files prepared."

      # ============================================================
      # 22. Verify files BEFORE ZIP creation
      # ============================================================
      - name: Verify AnyKernel package
        run: |
          set -e

          test -f "$ANYKERNEL_DIR/Image"
          test -f "$ANYKERNEL_DIR/anykernel.sh"
          test -f \
            "$ANYKERNEL_DIR/modules/vendor/lib/modules/sensors_class.ko"

          echo "Image:"
          ls -lh "$ANYKERNEL_DIR/Image"

          echo
          echo "AnyKernel modules:"
          find "$ANYKERNEL_DIR/modules" \
            -type f \
            -name '*.ko' \
            -printf '%p\n' \
            | sort

          echo
          echo "AnyKernel package structure verified."

      # ============================================================
      # 23. Create flashable ZIP
      # ============================================================
      - name: Create flashable ZIP
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/moto-g9-power-cebu-
