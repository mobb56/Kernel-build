    - name: Verify source tree syntax before compile
      working-directory: kernel
      shell: bash
      run: |
        set -euo pipefail

        echo "=== BASIC SOURCE TREE SYNTAX CHECKS ==="

        for file in \
          drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject.c \
          drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_validate.c \
          drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c \
          drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_frame_inject_debug.c \
          drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c
        do
          test -s "$file"
          echo "OK: $file"
        done

        echo
        echo "=== Checking brace balance in modified C files ==="

        for file in \
          drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c \
          drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_ioctl.c \
          drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_inject_security.c \
          drivers/staging/qcacld-3.0/core/wma/src/wma_mgmt.c \
          drivers/staging/qcacld-3.0/core/wma/src/wma_main.c \
          drivers/staging/qcacld-3.0/core/wma/src/wma_frame_inject.c
        do
          python3 - "$file" <<'PY'
        import pathlib
        import sys

        path = pathlib.Path(sys.argv[1])
        text = path.read_text()

        # Strip simple comments/strings only enough to perform a
        # conservative brace-balance sanity check.
        depth = 0
        in_block_comment = False
        in_string = False
        escaped = False

        i = 0

        while i < len(text):
            c = text[i]
            n = text[i + 1] if i + 1 < len(text) else ""

            if in_block_comment:
                if c == "*" and n == "/":
                    in_block_comment = False
                    i += 2
                    continue
                i += 1
                continue

            if in_string:
                if escaped:
                    escaped = False
                elif c == "\\":
                    escaped = True
                elif c == '"':
                    in_string = False
                i += 1
                continue

            if c == "/" and n == "*":
                in_block_comment = True
                i += 2
                continue

            if c == '"':
                in_string = True
                i += 1
                continue

            if c == "{":
                depth += 1
            elif c == "}":
                depth -= 1

                if depth < 0:
                    raise SystemExit(
                        f"FAIL: brace underflow in {path}"
                    )

            i += 1

        if in_block_comment:
            raise SystemExit(
                f"FAIL: unterminated block comment in {path}"
            )

        if in_string:
            raise SystemExit(
                f"FAIL: unterminated string literal in {path}"
            )

        if depth != 0:
            raise SystemExit(
                f"FAIL: brace imbalance in {path}: {depth}"
            )

        print(f"PASS: brace balance {path}")
        PY
        done

        echo
        echo "Source syntax sanity checks PASSED."


