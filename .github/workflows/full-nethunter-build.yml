          FRAME_H="drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_frame_inject.h"
          SECURITY_H="drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_inject_security.h"

          test -f "${FRAME_H}"
          test -f "${SECURITY_H}"

          echo "=== Verifying expected duplicate helper locations ==="

          sed -n '682,691p' "${FRAME_H}"

          grep -q \
