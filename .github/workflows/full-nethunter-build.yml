      # ============================================================
      # 42. VERIFY STOCK LOCALVERSION SETTINGS
      # ============================================================

      - name: Verify kernel release configuration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${OUT_DIR}/.config"

          test -s "${CONFIG}"

          echo "=== Verify final kernel release configuration ==="

          grep -Fxq 'CONFIG_LOCALVERSION="-perf-g39bcecd5c63d"' "${CONFIG}"
          grep -Fxq '# CONFIG_LOCALVERSION_AUTO is not set' "${CONFIG}"

          test "$(scripts/config --file "${CONFIG}" --state LOCALVERSION)" = '-perf-g39bcecd5c63d'
          test "$(scripts/config --file "${CONFIG}" --state LOCALVERSION_AUTO)" = 'n'

          echo
          echo "CONFIG_LOCALVERSION=-perf-g39bcecd5c63d"
          echo "CONFIG_LOCALVERSION_AUTO=n"
          echo
          echo "Kernel release configuration PASSED."
          echo "Expected release: 4.19.325-cip135-st19-perf-g39bcecd5c63d"
      # ============================================================
      # 43. VERIFY MODVERSIONS
      #
      # Module ABI compatibility is important because the phone uses
      # vendor modules such as qca_cld3_wlan.ko.
      # ============================================================

      - name: Verify module ABI configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          grep -Fxq \
            "CONFIG_MODVERSIONS=y" \
