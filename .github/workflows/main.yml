name: Build cebu NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout Motorola kernel source
        uses: actions/checkout@v4
        with:
          repository: mobb56/Moto-g9-kernel
          token: ${{ secrets.KERNEL_BUILD }}
          path: kernel
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex \
            libssl-dev libelf-dev libdw-dev \
            gcc-aarch64-linux-gnu \
            clang llvm lld \
            make cpio kmod rsync \
            python3 zip unzip

      - name: Inspect kernel tree
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"

          echo "Kernel source:"
          pwd

          echo
          echo "Top-level files:"
          ls -la

          echo
          echo "ARM64 directory:"
          ls -la arch/arm64 || true

          echo
          echo "Available configurations:"
          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' 2>/dev/null | sort || true

          echo
          echo "cebu-related files:"
          find . \
            -type f \
            -iname '*cebu*' \
            -not -path './.git/*' \
            -print | head -100

      - name: Locate cebu defconfig
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"

          echo "Searching for cebu defconfig..."

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            \( \
              -iname '*cebu*' \
              -o -iname '*motorola*' \
              -o -iname '*sm6125*' \
            \) \
            -print || true

      - name: Create NetHunter configuration
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          mkdir -p build

          cat > build/nethunter.config <<'EOF'
          # Bluetooth
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HCIVHCI=y

          # Bluetooth HCI UART
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y

          # USB gadget / HID
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y

          # USB networking
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_RNDIS=y

          # Wireless framework
          CONFIG_WLAN=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y

          # Packet sockets
          CONFIG_PACKET=y

          # Netfilter
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NF_CONNTRACK=y
          EOF

      - name: Configure kernel
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export LLVM=1

          mkdir -p out

          echo "Available defconfigs:"
          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' | sort

          echo
          echo "Attempting cebu_defconfig..."

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            cebu_defconfig

          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/.config \
            build/nethunter.config

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            olddefconfig

      - name: Verify NetHunter configuration
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          echo "===== Bluetooth ====="
          grep -E \
            'CONFIG_BT=|CONFIG_BT_HIDP=|CONFIG_BT_HCIVHCI=|CONFIG_BT_HCIUART=|CONFIG_BT_HCIUART_H4=' \
            out/.config || true

          echo
          echo "===== USB HID ====="
          grep -E \
            'CONFIG_USB_GADGET=|CONFIG_USB_CONFIGFS=|CONFIG_USB_CONFIGFS_F_HID=' \
            out/.config || true

          echo
          echo "===== Wireless ====="
          grep -E \
            'CONFIG_WLAN=|CONFIG_CFG80211=|CONFIG_MAC80211=' \
            out/.config || true

      - name: Build kernel
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"

          export ARCH=arm64
          export LLVM=1

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            Image \
            dtbs

      - name: Collect artifacts
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"

          rm -rf artifacts
          mkdir -p artifacts

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image artifacts/
          fi

          find out/arch/arm64/boot \
            -type f \
            -name '*.dtb' \
            -exec cp {} artifacts/ \; || true

          find out/arch/arm64/boot \
            -type f \
            -name '*.dtbo' \
            -exec cp {} artifacts/ \; || true

          cp out/.config artifacts/kernel.config

          echo "===== BUILD ARTIFACTS ====="
          ls -lh artifacts/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cebu-nethunter-kernel
          path: kernel/artifacts/*
