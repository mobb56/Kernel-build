name: QCACLD3 In-Tree Injection Prototype v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            python3 \
            rsync \
            ripgrep

      - name: Clone LineageOS SM6225 kernel
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            kernel

      - name: Clone NetHunter reference
        run: |
          git clone --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            reference

      - name: Verify integrated WLAN source
        run: |
          set -e

          test -d kernel/drivers/staging/qcacld-3.0
          test -d kernel/drivers/staging/qca-wifi-host-cmn
          test -d kernel/drivers/staging/fw-api

          test -f \
            kernel/drivers/staging/qca-wifi-host-cmn/qdf/inc/qdf_nbuf.h

          test -f \
            kernel/drivers/staging/fw-api/fw/athdefs.h

          echo "QCACLD3 source: OK"
          echo "QDF source: OK"
          echo "FW API: OK"

      - name: Prepare output
        run: |
          set -e
          rm -rf out report
          mkdir -p out report

      - name: Generate kernel configuration
        run: |
          set -e

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

      - name: Synchronize configuration
        run: |
          set -e

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      - name: Prepare kernel
        run: |
          set -e

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            prepare

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules_prepare

      - name: Verify kernel configuration
        run: |
          set -e

          test -f out/include/config/auto.conf
          test -f out/include/config/auto.conf.cmd

          echo "auto.conf: OK"
          echo "auto.conf.cmd: OK"

      - name: Copy prototype source
        run: |
          set -e

          K="$PWD/kernel/drivers/staging/qcacld-3.0"
          R="$PWD/reference/drivers/staging/qcacld-3.0"

          cp \
            "$R/core/wma/inc/wma_frame_inject.h" \
            "$K/core/wma/inc/"

          cp \
            "$R/core/wma/src/wma_frame_inject.c" \
            "$K/core/wma/src/"

          cp \
            "$R/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "$K/core/hdd/inc/"

          cp \
            "$R/core/hdd/src/wlan_hdd_frame_inject.c" \
            "$K/core/hdd/src/"

          cp \
            "$R/core/hdd/inc/wlan_hdd_frame_validate.h" \
            "$K/core/hdd/inc/"

          cp \
            "$R/core/hdd/src/wlan_hdd_frame_validate.c" \
            "$K/core/hdd/src/"

      - name: Verify prototype source
        run: |
          set -e

          K="kernel/drivers/staging/qcacld-3.0"

          for f in \
            core/wma/inc/wma_frame_inject.h \
            core/wma/src/wma_frame_inject.c \
            core/hdd/inc/wlan_hdd_frame_inject.h \
            core/hdd/src/wlan_hdd_frame_inject.c \
            core/hdd/inc/wlan_hdd_frame_validate.h \
            core/hdd/src/wlan_hdd_frame_validate.c
          do
            test -f "$K/$f"
            echo "FOUND: $f"
          done

      - name: Safely add prototype objects to Kbuild
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "kernel/drivers/staging/qcacld-3.0/Kbuild"
          )

          text = p.read_text()

          # Never insert into an existing recipe or backslash continuation.
          # Add independent Kbuild assignments immediately before INCS.
          marker = "INCS := -I $(srctree)/$(WLAN_ROOT)/inc"

          if marker not in text:
              raise SystemExit(
                  "Could not find safe Kbuild insertion point"
              )

          additions = """
          # NetHunter injection prototype
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          HDD_OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o

          WMA_OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o

          cppflags-y += -DCONFIG_FEATURE_FRAME_INJECTION_SUPPORT

          """

          if "wlan_hdd_frame_inject.o" not in text:
              text = text.replace(
                  marker,
                  additions + marker,
                  1
              )

          p.write_text(text)
          PY

      - name: Validate Kbuild syntax
        run: |
          set -e

          K="kernel/drivers/staging/qcacld-3.0/Kbuild"

          echo "=== Prototype assignments ==="

          grep -n \
            -E \
            'wlan_hdd_frame_inject\.o|wlan_hdd_frame_validate\.o|wma_frame_inject\.o|CONFIG_FEATURE_FRAME_INJECTION_SUPPORT' \
            "$K"

          echo
          echo "=== Kbuild surrounding insertion ==="

          LINE=$(grep -n \
            "wlan_hdd_frame_inject.o" \
            "$K" \
            | head -n1 \
            | cut -d: -f1)

          START=$((LINE - 8))
          END=$((LINE + 12))

          sed -n "${START},${END}p" "$K"

      - name: Compile QCACLD3 in-tree
        id: qcacld_build
        continue-on-error: true
        run: |
          set -o pipefail

          make -C kernel \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            M=drivers/staging/qcacld-3.0 \
            V=1 \
            modules \
            2>&1 | tee report/qcacld3-build.log

      - name: Capture compiler diagnostics
        if: always()
        run: |
          {
            echo "=== Fatal errors ==="

            grep -n -C 6 \
              "fatal error" \
              report/qcacld3-build.log || true

            echo
            echo "=== Compiler errors ==="

            grep -n -C 5 \
              "error:" \
              report/qcacld3-build.log || true

            echo
            echo "=== Missing headers ==="

            grep -n \
              "file not found" \
              report/qcacld3-build.log || true

            echo
            echo "=== Undefined symbols ==="

            grep -n -E \
              "undefined|UNDEFINED" \
              report/qcacld3-build.log || true

            echo
            echo "=== Kbuild errors ==="

            grep -n \
              "Kbuild:" \
              report/qcacld3-build.log || true

          } > report/compiler-diagnostics.txt

      - name: Find generated objects
        if: always()
        run: |
          {
            echo "=== Injection objects ==="

            find kernel out \
              -type f \
              \( \
                -name 'wma_frame_inject.o' \
                -o -name 'wlan_hdd_frame_inject.o' \
                -o -name 'wlan_hdd_frame_validate.o' \
              \) \
              -print || true

          } > report/injection-objects.txt

      - name: Find generated WLAN modules
        if: always()
        run: |
          {
            echo "=== qca_cld3_wlan.ko ==="

            find kernel out \
              -type f \
              -name 'qca_cld3_wlan.ko' \
              -print || true

            echo
            echo "=== wlan.ko ==="

            find kernel out \
              -type f \
              -name 'wlan.ko' \
              -print || true

            echo
            echo "=== all .ko files ==="

            find kernel out \
              -type f \
              -name '*.ko' \
              -print || true

          } > report/generated-modules.txt

      - name: Inspect injection symbols
        if: always()
        run: |
          {
            echo "=== Injection symbols ==="

            for obj in $(find kernel out \
              -type f \
              \( \
                -name 'wma_frame_inject.o' \
                -o -name 'wlan_hdd_frame_inject.o' \
                -o -name 'wlan_hdd_frame_validate.o' \
              \)); do

              echo
              echo "===== $obj ====="

              llvm-nm -n "$obj" 2>/dev/null || true
            done

          } > report/injection-symbols.txt

      - name: Final conclusion
        if: always()
        run: |
          {
            echo "=== QCACLD3 In-Tree Injection Prototype v3 ==="
            echo

            if find kernel out \
              -type f \
              -name 'qca_cld3_wlan.ko' \
              | grep -q .; then

              echo "RESULT: QCACLD3 MODULE GENERATED"

            elif find kernel out \
              -type f \
              -name 'wlan.ko' \
              | grep -q .; then

              echo "RESULT: WLAN MODULE GENERATED"

            elif find kernel out \
              -type f \
              \( \
                -name 'wma_frame_inject.o' \
                -o -name 'wlan_hdd_frame_inject.o' \
                -o -name 'wlan_hdd_frame_validate.o' \
              \) \
              | grep -q .; then

              echo "RESULT: INJECTION OBJECTS COMPILED"

            else

              echo "RESULT: INJECTION OBJECTS NOT COMPILED"

            fi

            echo
            echo "=== Configuration ==="

            test -f out/include/config/auto.conf \
              && echo "auto.conf: PRESENT" \
              || echo "auto.conf: MISSING"

            echo
            echo "=== Injection objects ==="

            find kernel out \
              -type f \
              \( \
                -name 'wma_frame_inject.o' \
                -o -name 'wlan_hdd_frame_inject.o' \
                -o -name 'wlan_hdd_frame_validate.o' \
              \) \
              -print || true

          } > report/CONCLUSION.txt

      - name: Package report
        if: always()
        run: |
          mkdir -p artifact

          cp -r report artifact/

          cd artifact
          zip -r ../qcacld3-in-tree-injection-v3.zip .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-in-tree-injection-v3
          path: qcacld3-in-tree-injection-v3.zip
          if-no-files-found: error
