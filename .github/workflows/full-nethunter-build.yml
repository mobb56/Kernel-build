name: Moto G9 Power cebu NetHunter Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  KERNEL_BRANCH: lineage-23.2
  LLVM_DIR: /usr/lib/llvm-14
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out

jobs:
  build:
    name: Moto G9 Power cebu NetHunter
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang-14 \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            zip

          clang-14 --version
          ld.lld-14 --version
          aarch64-linux-gnu-gcc --version

      - name: Clone Motorola kernel
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          git -C kernel rev-parse HEAD

          test -f \
            kernel/arch/arm64/configs/vendor/bengal-perf_defconfig

      - name: Configure LLVM 14
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="${LLVM_DIR}/bin:${PATH}"

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy

      - name: Prepare output
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

      # ------------------------------------------------------------
      # USE THE EXISTING WORKING KERNEL CONFIGURATION.
      # NO SOURCE PATCHING.
      # ------------------------------------------------------------

      - name: Generate kernel configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            vendor/bengal-perf_defconfig

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig

          echo "Kernel configuration generated."

      # ------------------------------------------------------------
      # CAPTURE RELEASE WITHOUT MODIFYING SOURCE
      # ------------------------------------------------------------

      - name: Get kernel release
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          echo "KERNEL_RELEASE=${RELEASE}" >> "${GITHUB_ENV}"

          echo "Kernel release:"
          echo "${RELEASE}"

      # ------------------------------------------------------------
      # BUILD THE WORKING KERNEL
      #
      # NO QCACLD3 SOURCE PATCHES.
      # NO C-SOURCE MODIFICATIONS.
      # ------------------------------------------------------------

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          make -j2 \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            Image \
            2>&1 | tee "${GITHUB_WORKSPACE}/kernel-build.log"

          status="${PIPESTATUS[0]}"

          if [ "${status}" -ne 0 ]; then
            echo
            echo "=================================================="
            echo "KERNEL BUILD FAILED"
            echo "=================================================="
            exit "${status}"
          fi

      # ------------------------------------------------------------
      # BUILD MODULES SEPARATELY
      #
      # This makes a module failure distinguishable from an
      # Image/kernel failure.
      # ------------------------------------------------------------

      - name: Build kernel modules
        shell: bash
        run: |
          set -o pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          make -j2 \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            modules \
            2>&1 | tee "${GITHUB_WORKSPACE}/modules-build.log"

          status="${PIPESTATUS[0]}"

          if [ "${status}" -ne 0 ]; then
            echo
            echo "=================================================="
            echo "MODULE BUILD FAILED"
            echo "=================================================="
            echo
            echo "The kernel Image itself completed successfully."
            echo "The failure is isolated to modules."
            echo
            exit "${status}"
          fi

      # ------------------------------------------------------------
      # VERIFY IMAGE
      # ------------------------------------------------------------

      - name: Verify kernel Image
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="kernel/${OUT_DIR}/arch/arm64/boot/Image"

          test -f "${IMAGE}"

          SIZE="$(stat -c%s "${IMAGE}")"

          echo "Image:"
          echo "${IMAGE}"

          echo "Size:"
          echo "${SIZE}"

          test "${SIZE}" -gt 10000000

          file "${IMAGE}"

      # ------------------------------------------------------------
      # INSTALL MODULES
      # ------------------------------------------------------------

      - name: Install modules
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          rm -rf "${GITHUB_WORKSPACE}/module-install"

          mkdir -p \
            "${GITHUB_WORKSPACE}/module-install"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            INSTALL_MOD_PATH="${GITHUB_WORKSPACE}/module-install" \
            modules_install

          find \
            "${GITHUB_WORKSPACE}/module-install" \
            -type f \
            -name '*.ko' \
            -print

      # ------------------------------------------------------------
      # VERIFY WLAN MODULE IF PRESENT
      # ------------------------------------------------------------

      - name: Verify WLAN module
        shell: bash
        run: |
          set -euxo pipefail

          WLAN="$(
            find module-install \
              -type f \
              -name 'wlan.ko' \
              -print -quit
          )"

          if [ -n "${WLAN}" ]; then
            echo "WLAN module found:"
            echo "${WLAN}"

            modinfo "${WLAN}" || true

            VERMAGIC="$(
              modinfo -F vermagic "${WLAN}" || true
            )

            echo "WLAN vermagic:"
            echo "${VERMAGIC}"
          else
            echo "No standalone wlan.ko found."
            echo "The build may contain WLAN support differently."
          fi

      # ------------------------------------------------------------
      # SHOW MODULES
      # ------------------------------------------------------------

      - name: Verify NetHunter modules
        shell: bash
        run: |
          set -euxo pipefail

          echo "Available modules:"
          echo

          find \
            module-install \
            -type f \
            -name '*.ko' \
            -printf '%P\n' \
            | sort

      # ------------------------------------------------------------
      # VERIFY RELEASE
      # ------------------------------------------------------------

      - name: Verify kernel release
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          BUILT_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          echo "Expected:"
          echo "${KERNEL_RELEASE}"

          echo "Built:"
          echo "${BUILT_RELEASE}"

          test "${BUILT_RELEASE}" = "${KERNEL_RELEASE}"

      # ------------------------------------------------------------
      # CHECK FOR UNDEFINED SYMBOLS
      # ------------------------------------------------------------

      - name: Check build errors
        shell: bash
        run: |
          set -euxo pipefail

          if grep -E \
            'undefined!$|undefined reference|Error [0-9]+$' \
            kernel-build.log \
            modules-build.log 2>/dev/null; then

            echo "Potential linker/build errors detected."
            exit 1
          fi

          echo "No undefined-symbol errors detected."

      # ------------------------------------------------------------
      # PREPARE PACKAGE
      # ------------------------------------------------------------

      - name: Prepare kernel package
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf package

          mkdir -p \
            package/boot \
            package/modules

          cp \
            kernel/${OUT_DIR}/arch/arm64/boot/Image \
            package/boot/Image

          cp \
            kernel/.config \
            package/kernel.config 2>/dev/null || \
          cp \
            kernel/${OUT_DIR}/.config \
            package/kernel.config

          cp \
            kernel-build.log \
            package/kernel-build.log

          if [ -f modules-build.log ]; then
            cp \
              modules-build.log \
              package/modules-build.log
          fi

          cp \
            -r module-install/. \
            package/modules/ 2>/dev/null || true

          cat > package/build-info.txt <<EOF
          Device: Motorola Moto G9 Power
          Codename: cebu
          Kernel branch: ${KERNEL_BRANCH}
          Kernel release: ${KERNEL_RELEASE}
          Architecture: ${ARCH}
          Build system: GitHub Actions
          Source modifications: NONE
          QCACLD3 source modifications: NONE
          EOF

      # ------------------------------------------------------------
      # ZIP THE BUILD
      # ------------------------------------------------------------

      - name: Create kernel artifact
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          cd package

          zip -r \
            "../artifacts/moto-g9-power-cebu-nethunter-kernel.zip" \
            .

          cd ..

          unzip -t \
            artifacts/moto-g9-power-cebu-nethunter-kernel.zip

      # ------------------------------------------------------------
      # CHECKSUM
      # ------------------------------------------------------------

      - name: Generate checksum
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum \
            artifacts/moto-g9-power-cebu-nethunter-kernel.zip \
            > artifacts/SHA256SUMS.txt

          cat artifacts/SHA256SUMS.txt

      # ------------------------------------------------------------
      # UPLOAD
      # ------------------------------------------------------------

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-g9-power-cebu-nethunter-kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Complete
        shell: bash
        run: |
          echo "=========================================="
          echo "Moto G9 Power cebu kernel build complete"
          echo "=========================================="
          echo "Kernel release: ${KERNEL_RELEASE}"
          echo
          echo "No kernel source modifications were made."
          echo "=========================================="
