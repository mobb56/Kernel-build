name: QCACLD3 Injection Prototype v11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      REF_DIR: ${{ github.workspace }}/reference
      OUT_DIR: ${{ github.workspace }}/kernel-out

    steps:

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync

      # ============================================================
      # SOURCE
      # ============================================================

      - name: Clone Motorola SM6225 kernel
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm6225.git \
            "$KERNEL_DIR"

      - name: Clone NetHunter reference
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch nethunter-lineage-23.2 \
            https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git \
            "$REF_DIR"

      # ============================================================
      # REPORTS
      # ============================================================

      - name: Initialize reports
        run: |
          mkdir -p reports

          touch \
            reports/build.log \
            reports/compiler-errors.txt \
            reports/injection-compile-commands.txt \
            reports/injection-symbols.txt \
            reports/final-module-symbols.txt \
            reports/undefined-symbols.txt \
            reports/source-inventory.txt \
            reports/header-closure.txt \
            reports/missing-reference-files.txt

      # ============================================================
      # SHOW SOURCE VERSIONS
      # ============================================================

      - name: Show source revisions
        run: |
          echo "=== MOTOROLA KERNEL ==="
          git -C "$KERNEL_DIR" log -1 --oneline

          echo
          echo "=== NETHUNTER REFERENCE ==="
          git -C "$REF_DIR" log -1 --oneline

      # ============================================================
      # COPY PRODUCTION INJECTION IMPLEMENTATION
      #
      # We deliberately copy the production implementation files
      # plus their directly referenced injection-specific headers.
      #
      # We do NOT copy the entire QCACLD3 tree.
      # ============================================================

      - name: Import injection implementation
        run: |
          set -eux

          DST="$KERNEL_DIR/drivers/staging/qcacld-3.0"
          SRC="$REF_DIR/drivers/staging/qcacld-3.0"

          mkdir -p \
            "$DST/core/hdd/inc" \
            "$DST/core/hdd/src" \
            "$DST/core/wma/inc" \
            "$DST/core/wma/src"

          # --------------------------------------------------------
          # Production injection headers
          # --------------------------------------------------------

          INJECTION_HEADERS="

          core/hdd/inc/wlan_hdd_frame_inject.h
          core/hdd/inc/wlan_hdd_frame_inject_debug.h
          core/hdd/inc/wlan_hdd_frame_inject_integration.h
          core/hdd/inc/wlan_hdd_frame_inject_security_test.h
          core/hdd/inc/wlan_hdd_frame_inject_test.h
          core/hdd/inc/wlan_hdd_frame_validate.h
          core/hdd/inc/wlan_hdd_frame_validate_test.h

          core/wma/inc/wma_frame_inject.h
          "

          for f in $INJECTION_HEADERS; do

            if [ -f "$SRC/$f" ]; then
              mkdir -p "$DST/$(dirname "$f")"
              cp "$SRC/$f" "$DST/$f"
              echo "$f" >> reports/header-closure.txt
            fi

          done

          # --------------------------------------------------------
          # Production implementation
          # --------------------------------------------------------

          INJECTION_SOURCES="

          core/hdd/src/wlan_hdd_frame_inject.c
          core/hdd/src/wlan_hdd_frame_inject_debug.c
          core/hdd/src/wlan_hdd_frame_inject_integration.c
          core/hdd/src/wlan_hdd_frame_validate.c
          core/hdd/src/wlan_hdd_inject_security.c

          core/wma/src/wma_frame_inject.c
          "

          for f in $INJECTION_SOURCES; do

            if [ -f "$SRC/$f" ]; then
              mkdir -p "$DST/$(dirname "$f")"
              cp "$SRC/$f" "$DST/$f"
              echo "$f" >> reports/source-inventory.txt
            fi

          done

          # --------------------------------------------------------
          # The main production files must exist.
          # --------------------------------------------------------

          for f in \
            core/hdd/inc/wlan_hdd_frame_inject.h \
            core/hdd/inc/wlan_hdd_frame_validate.h \
            core/hdd/inc/wlan_hdd_inject_security.h \
            core/wma/inc/wma_frame_inject.h \
            core/hdd/src/wlan_hdd_frame_inject.c \
            core/hdd/src/wlan_hdd_frame_validate.c \
            core/hdd/src/wlan_hdd_inject_security.c \
            core/wma/src/wma_frame_inject.c
          do

            if [ ! -f "$DST/$f" ]; then
              echo "Missing required file: $f"
              exit 1
            fi

          done

          echo
          echo "=== IMPORTED INJECTION FILES ==="

          cat reports/source-inventory.txt

          echo
          echo "=== IMPORTED INJECTION HEADERS ==="

          cat reports/header-closure.txt

      # ============================================================
      # AUTOMATIC DIRECT HEADER DEPENDENCY AUDIT
      # ============================================================

      - name: Audit imported header dependencies
        run: |
          set -eux

          DST="$KERNEL_DIR/drivers/staging/qcacld-3.0"
          SRC="$REF_DIR/drivers/staging/qcacld-3.0"

          echo "=== DIRECT QUOTED INCLUDES ==="

          grep -RhoE \
            '#include[[:space:]]+"[^"]+"' \
            "$DST/core/hdd/src/wlan_hdd_frame_inject.c" \
            "$DST/core/hdd/src/wlan_hdd_frame_validate.c" \
            "$DST/core/hdd/src/wlan_hdd_inject_security.c" \
            "$DST/core/wma/src/wma_frame_inject.c" \
            | sort -u \
            | tee reports/direct-includes.txt

          echo
          echo "=== CHECKING REFERENCE HEADERS ==="

          : > reports/missing-reference-files.txt

          while read -r line; do

            name="$(printf '%s' "$line" | sed -E 's/.*"([^"]+)".*/\1/')"

            found=""

            for base in \
              "$DST/core/hdd/inc" \
              "$DST/core/hdd/src" \
              "$DST/core/wma/inc" \
              "$DST/core/wma/src" \
              "$DST"

            do

              if [ -f "$base/$name" ]; then
                found="yes"
                break
              fi

            done

            if [ -z "$found" ]; then

              echo "Missing local header: $name"

              # Search reference tree.
              ref_found="$(find "$SRC" \
                -name "$name" \
                -type f \
                -print \
                -quit)"

              if [ -n "$ref_found" ]; then
                echo "  Reference copy: $ref_found"
              else
                echo "  Reference copy: NOT FOUND"
              fi

              echo "$name" \
                >> reports/missing-reference-files.txt

            fi

          done < reports/direct-includes.txt

          echo
          echo "=== MISSING HEADERS ==="

          cat reports/missing-reference-files.txt || true

      # ============================================================
      # CONFIGURE
      # ============================================================

      - name: Configure kernel
        run: |
          set -eux

          mkdir -p "$OUT_DIR"

          cd "$KERNEL_DIR"

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

          ./scripts/config \
            --file "$OUT_DIR/.config" \
            --module CONFIG_QCA_CLD_WLAN

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            prepare \
            modules_prepare

          grep \
            '^CONFIG_QCA_CLD_WLAN=' \
            "$OUT_DIR/.config"

          test \
            -f "$OUT_DIR/include/config/auto.conf"

      # ============================================================
      # BACKUP KBUILD
      # ============================================================

      - name: Backup Kbuild
        run: |
          set -eux

          KBUILD="$KERNEL_DIR/drivers/staging/qcacld-3.0/Kbuild"

          cp \
            "$KBUILD" \
            "$KBUILD.v11-original"

      # ============================================================
      # PATCH KBUILD
      # ============================================================

      - name: Patch QCACLD3 Kbuild
        run: |
          set -eux

          KBUILD="$KERNEL_DIR/drivers/staging/qcacld-3.0/Kbuild"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "kernel/drivers/staging/qcacld-3.0/Kbuild"
          )

          s = p.read_text()

          if "NETHUNTER_INJECTION_V11" in s:
              raise SystemExit(
                  "v11 patch already present"
              )

          # We deliberately insert just before the existing
          # ccflags-y += $(INCS) line.

          marker = "ccflags-y += $(INCS)"

          if marker not in s:
              raise SystemExit(
                  "Could not find ccflags-y += $(INCS)"
              )

          patch = r'''
          #
          # ==========================================================
          # NETHUNTER_INJECTION_V11
          # ==========================================================
          #

          cppflags-y += -DFEATURE_FRAME_INJECTION_SUPPORT

          #
          # Injection composite objects.
          #
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o
          OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o
          OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o

          #
          # Reference injection headers.
          #
          ccflags-y += -I$(src)/core/hdd/inc
          ccflags-y += -I$(src)/core/hdd/src
          ccflags-y += -I$(src)/core/wma/inc

          #
          # ==========================================================
          # END NETHUNTER_INJECTION_V11
          # ==========================================================
          #
          '''

          s = s.replace(
              marker,
              patch + "\n" + marker,
              1
          )

          p.write_text(s)

          PY

          echo "=== PATCHED KBUILD ==="

          grep -n -A30 -B5 \
            "NETHUNTER_INJECTION_V11" \
            "$KBUILD"

      # ============================================================
      # VERIFY KBUILD
      # ============================================================

      - name: Verify Kbuild
        run: |
          set -eux

          KBUILD="$KERNEL_DIR/drivers/staging/qcacld-3.0/Kbuild"

          grep -F \
            'OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_inject.o' \
            "$KBUILD"

          grep -F \
            'OBJS += $(HDD_SRC_DIR)/wlan_hdd_frame_validate.o' \
            "$KBUILD"

          grep -F \
            'OBJS += $(HDD_SRC_DIR)/wlan_hdd_inject_security.o' \
            "$KBUILD"

          grep -F \
            'OBJS += $(WMA_SRC_DIR)/wma_frame_inject.o' \
            "$KBUILD"

          grep -F \
            'FEATURE_FRAME_INJECTION_SUPPORT' \
            "$KBUILD"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build QCACLD3
        id: build_qcacld
        run: |
          set -o pipefail

          cd "$KERNEL_DIR"

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            M=drivers/staging/qcacld-3.0 \
            V=1 \
            modules \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/reports/build.log"

      # ============================================================
      # EXTRACT ACTUAL INJECTION COMPILATION
      # ============================================================

      - name: Extract injection compile commands
        if: always()
        run: |
          set -eux

          LOG="reports/build.log"

          : > reports/injection-compile-commands.txt

          if [ -f "$LOG" ]; then

            grep -E \
              'wlan_hdd_frame_inject\.o|wlan_hdd_frame_validate\.o|wlan_hdd_inject_security\.o|wma_frame_inject\.o' \
              "$LOG" \
              > reports/injection-compile-commands.txt \
              || true

          fi

          echo "=== ACTUAL COMPILATION ==="

          cat reports/injection-compile-commands.txt

      # ============================================================
      # VERIFY OBJECT COMPILATION
      # ============================================================

      - name: Verify injection objects
        if: success()
        run: |
          set -eux

          FILE="reports/injection-compile-commands.txt"

          for obj in \
            wlan_hdd_frame_inject.o \
            wlan_hdd_frame_validate.o \
            wlan_hdd_inject_security.o \
            wma_frame_inject.o
          do

            if ! grep -F "$obj" "$FILE" >/dev/null; then
              echo "ERROR: $obj was not compiled."
              exit 1
            fi

          done

          echo "All injection objects compiled."

      # ============================================================
      # OUTPUT
      # ============================================================

      - name: Inspect wlan module
        if: always()
        run: |
          set -eux

          OBJ="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.o"
          MOD="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.ko"

          if [ -f "$OBJ" ]; then
            ls -lh "$OBJ"
          fi

          if [ -f "$MOD" ]; then
            ls -lh "$MOD"
          fi

      # ============================================================
      # SYMBOLS
      # ============================================================

      - name: Inspect injection symbols
        if: always()
        run: |
          set -eux

          OBJ="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.o"
          MOD="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.ko"

          : > reports/injection-symbols.txt
          : > reports/final-module-symbols.txt

          if [ -f "$OBJ" ]; then

            llvm-nm "$OBJ" \
              | grep -E \
                'wlan_hdd_frame_inject|wlan_hdd_frame_validate|wlan_hdd_inject_security|wma_frame_inject' \
              > reports/injection-symbols.txt \
              || true

          fi

          if [ -f "$MOD" ]; then

            llvm-nm "$MOD" \
              | grep -E \
                'wlan_hdd_frame_inject|wlan_hdd_frame_validate|wlan_hdd_inject_security|wma_frame_inject' \
              > reports/final-module-symbols.txt \
              || true

          fi

          echo "=== wlan.o ==="
          cat reports/injection-symbols.txt

          echo
          echo "=== wlan.ko ==="
          cat reports/final-module-symbols.txt

      # ============================================================
      # UNDEFINED SYMBOLS
      # ============================================================

      - name: Inspect undefined symbols
        if: always()
        run: |
          set -eux

          MOD="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.ko"

          : > reports/undefined-symbols.txt

          if [ -f "$MOD" ]; then

            llvm-nm -u "$MOD" \
              > reports/undefined-symbols.txt \
              || true

          fi

          cat reports/undefined-symbols.txt

      # ============================================================
      # COMPILER ERRORS
      # ============================================================

      - name: Extract compiler errors
        if: always()
        run: |
          set -eux

          : > reports/compiler-errors.txt

          if [ -f reports/build.log ]; then

            grep -E \
              'error:|fatal error:|undefined reference|No rule to make target' \
              reports/build.log \
              > reports/compiler-errors.txt \
              || true

          fi

          echo "=== COMPILER ERRORS ==="
          cat reports/compiler-errors.txt

      # ============================================================
      # SAVE CONFIG
      # ============================================================

      - name: Save kernel config
        if: always()
        run: |
          if [ -f "$OUT_DIR/.config" ]; then
            cp \
              "$OUT_DIR/.config" \
              reports/kernel.config
          fi

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package v11 report
        if: always()
        run: |
          set -eux

          rm -rf qcacld3-v11-report

          mkdir -p qcacld3-v11-report

          cp -a \
            reports/. \
            qcacld3-v11-report/

          KBUILD="$KERNEL_DIR/drivers/staging/qcacld-3.0/Kbuild"

          if [ -f "$KBUILD" ]; then
            cp "$KBUILD" \
              qcacld3-v11-report/Kbuild.modified
          fi

          if [ -f "$KBUILD.v11-original" ]; then
            cp "$KBUILD.v11-original" \
              qcacld3-v11-report/Kbuild.original
          fi

          OBJ="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.o"
          MOD="$OUT_DIR/drivers/staging/qcacld-3.0/wlan.ko"

          if [ -f "$OBJ" ]; then
            cp "$OBJ" qcacld3-v11-report/
          fi

          if [ -f "$MOD" ]; then
            cp "$MOD" qcacld3-v11-report/
          fi

          tar \
            -czf \
            qcacld3-injection-v11-report.tar.gz \
            qcacld3-v11-report

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload v11 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-injection-v11-report
          path: qcacld3-injection-v11-report.tar.gz
          if-no-files-found: error

      # ============================================================
      # FINAL
      # ============================================================

      - name: Final result
        if: always()
        run: |
          echo
          echo "=============================================="
          echo "QCACLD3 INJECTION PROTOTYPE V11"
          echo "=============================================="

          echo
          echo "=== MISSING REFERENCE HEADERS ==="
          cat reports/missing-reference-files.txt || true

          echo
          echo "=== INJECTION COMPILATION ==="
          cat reports/injection-compile-commands.txt || true

          echo
          echo "=== SYMBOLS ==="
          cat reports/injection-symbols.txt || true

          echo
          echo "=== ERRORS ==="
          cat reports/compiler-errors.txt || true
