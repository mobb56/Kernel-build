name: QCACLD3 History Investigation

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            ripgrep \
            jq \
            unzip \
            xz-utils

      - name: Clone Motorola QCACLD3 repository
        run: |
          git clone \
            --filter=blob:none \
            --no-checkout \
            https://github.com/MotorolaMobilityLLC/vendor-qcom-opensource-wlan-qcacld-3.0.git \
            motorola-qcacld3

          cd motorola-qcacld3

          git config remote.origin.tagOpt --no-tags

          echo "=== REMOTES ==="
          git remote -v

          echo "=== REMOTE BRANCHES ==="
          git ls-remote --heads origin | tee ../motorola-branches.txt

          echo "=== REMOTE TAGS ==="
          git ls-remote --tags origin | tee ../motorola-tags.txt

          echo "=== FETCHING HISTORY ==="
          git fetch origin --prune --tags

          echo "=== FETCH COMPLETE ==="
          git rev-parse --is-shallow-repository
          git rev-parse HEAD || true

      - name: Analyze Motorola branches and tags
        run: |
          cd motorola-qcacld3

          {
            echo "========================================"
            echo "MOTOROLA QCACLD3 BRANCHES"
            echo "========================================"

            git branch -a

            echo
            echo "========================================"
            echo "MOTOROLA TAGS CONTAINING WLAN/CLD3"
            echo "========================================"

            git tag -l | grep -Ei \
              'wlan|qcacld|cld3|wifi|qca' \
              | sort -V || true

            echo
            echo "========================================"
            echo "REMOTE REFS CONTAINING 2.0"
            echo "========================================"

            grep -Ei \
              '2\.0|r[0-9]+.*rel' \
              ../motorola-branches.txt \
              ../motorola-tags.txt \
              || true

          } | tee ../motorola-ref-analysis.txt

      - name: Search Motorola history for packet capture and injection
        run: |
          cd motorola-qcacld3

          {
            echo "========================================"
            echo "COMMIT SUBJECT SEARCH"
            echo "========================================"

            git log --all \
              --date=short \
              --format='%h %ad %s' \
              --regexp-ignore-case \
              --grep='packet capture' \
              --grep='pkt capture' \
              --grep='frame injection' \
              --grep='packet injection' \
              --grep='monitor mode' \
              --grep='radiotap' \
              --grep='monitor TX' \
              --grep='injection' \
              || true

            echo
            echo "========================================"
            echo "2.0 / R60 / R61 HISTORY"
            echo "========================================"

            git log --all \
              --date=short \
              --format='%h %ad %s' \
              --regexp-ignore-case \
              --grep='wlan-cld3.driver.lnx.2.0' \
              --grep='r60' \
              --grep='r61' \
              || true

          } | tee ../motorola-commit-search.txt

      - name: Search Motorola history for packet-capture paths
        run: |
          cd motorola-qcacld3

          {
            echo "========================================"
            echo "CURRENT TREE: PKT_CAPTURE"
            echo "========================================"

            git ls-tree -r --name-only HEAD \
              | grep -Ei \
              'pkt.?capture|radiotap|monitor' \
              || true

            echo
            echo "========================================"
            echo "ALL HISTORY: PKT_CAPTURE PATHS"
            echo "========================================"

            git log --all \
              --name-only \
              --pretty=format: \
              -- \
              '*pkt_capture*' \
              '*radiotap*' \
              '*monitor*' \
              | sed '/^$/d' \
              | sort -u \
              | tee ../motorola-history-pkt-paths.txt

          } | tee ../motorola-pkt-path-analysis.txt

      - name: Search Motorola history for injection symbols
        run: |
          cd motorola-qcacld3

          {
            echo "========================================"
            echo "INJECTION SYMBOL SEARCH"
            echo "========================================"

            for pattern in \
              "wlan_hdd_frame_inject" \
              "wlan_hdd_frame_validate" \
              "wlan_hdd_inject_security" \
              "wma_frame_inject" \
              "wma_init_injection_queue" \
              "wma_queue_injection_frame" \
              "wma_send_injection_frame_to_fw" \
              "FRAME_INJECTION_SUPPORT" \
              "ndo_start_xmit" \
              "radiotap" \
              "pkt_capture"
            do
              echo
              echo "----- $pattern -----"

              git log --all \
                -S"$pattern" \
                --date=short \
                --format='%h %ad %s' \
                -- \
                '*.c' '*.h' '*.mk' 'Kconfig' 'Kbuild' \
                | head -100 || true
            done

          } | tee ../motorola-injection-history.txt

      - name: Locate historical commits that introduced relevant files
        run: |
          cd motorola-qcacld3

          {
            echo "========================================"
            echo "FILE HISTORY"
            echo "========================================"

            for path in \
              core/hdd \
              core/wma \
              core/dp \
              components \
              Kconfig \
              Kbuild
            do
              echo
              echo "========== $path =========="

              git log --all \
                --follow \
                --date=short \
                --format='%h %ad %s' \
                -- "$path" \
                | head -100 || true
            done

          } | tee ../motorola-file-history.txt

      - name: Search every historical commit for radiotap
        run: |
          cd motorola-qcacld3

          echo "Searching commit history for radiotap..."

          git log --all \
            --full-history \
            -S'radiotap' \
            --date=short \
            --format='%H|%ad|%s' \
            -- '*.c' '*.h' \
            | tee ../radiotap-commits.txt

      - name: Search every historical commit for packet capture
        run: |
          cd motorola-qcacld3

          echo "Searching commit history for pkt_capture..."

          git log --all \
            --full-history \
            -S'pkt_capture' \
            --date=short \
            --format='%H|%ad|%s' \
            -- '*.c' '*.h' \
            | tee ../pkt-capture-commits.txt

      - name: Search every historical commit for frame injection
        run: |
          cd motorola-qcacld3

          echo "Searching commit history for frame injection..."

          git log --all \
            --full-history \
            -S'FRAME_INJECTION_SUPPORT' \
            --date=short \
            --format='%H|%ad|%s' \
            -- '*.c' '*.h' \
            | tee ../frame-injection-commits.txt

      - name: Inspect promising commits
        run: |
          cd motorola-qcacld3

          {
            echo "========================================"
            echo "PROMISING COMMITS"
            echo "========================================"

            for file in \
              ../radiotap-commits.txt \
              ../pkt-capture-commits.txt \
              ../frame-injection-commits.txt
            do
              if [ -s "$file" ]; then
                cat "$file"
              fi
            done

          } | sort -u | tee ../promising-commits.txt

      - name: Compare Motorola current source against known Qualcomm 2.0 branch
        run: |
          mkdir -p comparison

          echo "Fetching Qualcomm CodeLinaro branch..."

          if git clone \
              --filter=blob:none \
              --no-checkout \
              --branch wlan-cld3.driver.lnx.2.0.r60-rel \
              https://git.codelinaro.org/clo/la/platform/vendor/qcom-opensource/wlan/qcacld-3.0.git \
              comparison/qualcomm-r60; then

            cd comparison/qualcomm-r60

            git checkout --force \
              wlan-cld3.driver.lnx.2.0.r60-rel

            echo "QUALCOMM R60 COMMIT:"
            git rev-parse HEAD | tee ../../qualcomm-r60-commit.txt

            echo
            echo "QUALCOMM R60 PKT_CAPTURE FILES:"
            git ls-tree -r --name-only HEAD \
              | grep -Ei \
              'pkt_capture|radiotap|monitor' \
              | tee ../../qualcomm-r60-pkt-files.txt

          else
            echo "CodeLinaro R60 clone unavailable."
            echo "The investigation will continue using Motorola history."
          fi

      - name: Compare directory structures
        run: |
          mkdir -p comparison-results

          if [ -d comparison/qualcomm-r60 ]; then

            cd comparison/qualcomm-r60

            git ls-tree -r --name-only HEAD \
              | sort \
              > ../../qualcomm-r60-files.txt

            cd ../../motorola-qcacld3

            git ls-tree -r --name-only HEAD \
              | sort \
              > ../motorola-current-files.txt

            cd ..

            comm -12 \
              motorola-current-files.txt \
              qualcomm-r60-files.txt \
              > comparison-results/common-files.txt

            comm -13 \
              motorola-current-files.txt \
              qualcomm-r60-files.txt \
              > comparison-results/r60-files-missing-from-motorola.txt

            comm -23 \
              motorola-current-files.txt \
              qualcomm-r60-files.txt \
              > comparison-results/motorola-only-files.txt

            echo "=== Files present in R60 but absent from current Motorola tree ==="
            cat comparison-results/r60-files-missing-from-motorola.txt

          fi

      - name: Generate injection candidate report
        run: |
          {
            echo "=============================================="
            echo "CEBU QCACLD3 HISTORY INVESTIGATION REPORT"
            echo "=============================================="
            echo
            echo "Purpose:"
            echo "Identify whether Motorola's QCACLD3 history contains"
            echo "an intermediate packet-capture/monitor-TX/injection"
            echo "implementation that can be ported safely."
            echo
            echo "=============================================="
            echo "MOTOROLA REFS"
            echo "=============================================="
            cat motorola-ref-analysis.txt || true
            echo
            echo "=============================================="
            echo "PACKET CAPTURE COMMITS"
            echo "=============================================="
            cat pkt-capture-commits.txt || true
            echo
            echo "=============================================="
            echo "RADIOTAP COMMITS"
            echo "=============================================="
            cat radiotap-commits.txt || true
            echo
            echo "=============================================="
            echo "FRAME INJECTION COMMITS"
            echo "=============================================="
            cat frame-injection-commits.txt || true
            echo
            echo "=============================================="
            echo "PROMISING COMMITS"
            echo "=============================================="
            cat promising-commits.txt || true
            echo
            echo "=============================================="
            echo "MOTOROLA INJECTION HISTORY"
            echo "=============================================="
            cat motorola-injection-history.txt || true
            echo
            echo "=============================================="
            echo "MOTOROLA PKT PATHS"
            echo "=============================================="
            cat motorola-history-pkt-paths.txt || true
            echo
            echo "=============================================="
            echo "QUALCOMM R60 FILES MISSING FROM MOTOROLA"
            echo "=============================================="
            cat comparison-results/r60-files-missing-from-motorola.txt || true

          } | tee cebu-qcacld3-history-report.txt

      - name: Package investigation results
        run: |
          mkdir -p investigation-output

          cp \
            motorola-branches.txt \
            motorola-tags.txt \
            motorola-ref-analysis.txt \
            motorola-commit-search.txt \
            motorola-pkt-path-analysis.txt \
            motorola-injection-history.txt \
            motorola-file-history.txt \
            radiotap-commits.txt \
            pkt-capture-commits.txt \
            frame-injection-commits.txt \
            promising-commits.txt \
            cebu-qcacld3-history-report.txt \
            investigation-output/ 2>/dev/null || true

          cp \
            qualcomm-r60-commit.txt \
            qualcomm-r60-pkt-files.txt \
            investigation-output/ 2>/dev/null || true

          cp \
            comparison-results/*.txt \
            investigation-output/ 2>/dev/null || true

          echo "=== OUTPUT FILES ==="
          find investigation-output -type f -maxdepth 1 -print | sort

      - name: Upload investigation results
        uses: actions/upload-artifact@v4
        with:
          name: cebu-qcacld3-history-investigation
          path: investigation-output/
          if-no-files-found: error
          retention-days: 14

      - name: Final summary
        run: |
          echo
          echo "=========================================="
          echo "QCACLD3 HISTORY INVESTIGATION COMPLETE"
          echo "=========================================="
          echo
          echo "Download:"
          echo "cebu-qcacld3-history-investigation"
          echo
          echo "Important files:"
          echo "  cebu-qcacld3-history-report.txt"
          echo "  promising-commits.txt"
          echo "  pkt-capture-commits.txt"
          echo "  radiotap-commits.txt"
          echo "  frame-injection-commits.txt"
          echo "  r60-files-missing-from-motorola.txt"
          echo
