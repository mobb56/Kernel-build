name: Moto G9 Power cebu NetHunter

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm6225.git
  KERNEL_BRANCH: lineage-23.2

  NETHUNTER_REPO: https://github.com/V0lk3n/nethunter_kernel_oneplus_sm8150.git
  NETHUNTER_BRANCH: nethunter-lineage-23.2

  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_BRANCH: master

  LLVM_DIR: /usr/lib/llvm-14
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out

jobs:
  build:
    name: Moto G9 Power cebu NetHunter
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang-14 \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            kmod \
            libssl-dev \
            lld-14 \
            llvm-14 \
            python3 \
            rsync \
            unzip \
            wget \
            zip

          clang-14 --version
          ld.lld-14 --version
          aarch64-linux-gnu-gcc --version
          make --version

      # ============================================================
      # MOTOROLA / LINEAGE KERNEL
      # ============================================================

      - name: Clone Motorola kernel
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel

          git -C kernel rev-parse HEAD
          git -C kernel status --short

      # ============================================================
      # NETHUNTER QCACLD3 REFERENCE
      # ============================================================

      - name: Clone NetHunter QCACLD3 reference
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${NETHUNTER_BRANCH}" \
            "${NETHUNTER_REPO}" \
            nethunter-reference

          R="nethunter-reference/drivers/staging/qcacld-3.0"

          test -f "${R}/core/hdd/src/wlan_hdd_frame_inject.c"
          test -f "${R}/core/hdd/src/wlan_hdd_frame_validate.c"
          test -f "${R}/core/hdd/src/wlan_hdd_inject_security.c"
          test -f "${R}/core/hdd/src/wlan_hdd_frame_inject_debug.c"
          test -f "${R}/core/wma/src/wma_frame_inject.c"

          test -f "${R}/core/hdd/inc/wlan_hdd_frame_inject.h"
          test -f "${R}/core/hdd/inc/wlan_hdd_frame_validate.h"
          test -f "${R}/core/hdd/inc/wlan_hdd_inject_security.h"
          test -f "${R}/core/hdd/inc/wlan_hdd_frame_inject_debug.h"
          test -f "${R}/core/wma/inc/wma_frame_inject.h"

          echo "QCACLD3 reference verified."

      # ============================================================
      # ANYKERNEL3
      # ============================================================

      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${ANYKERNEL_BRANCH}" \
            "${ANYKERNEL_REPO}" \
            AnyKernel3

          test -f AnyKernel3/anykernel.sh
          test -f AnyKernel3/tools/ak3-core.sh

      # ============================================================
      # SOURCE VERIFICATION
      # ============================================================

      - name: Verify source trees
        shell: bash
        run: |
          set -euxo pipefail

          test -f \
            kernel/arch/arm64/configs/vendor/bengal-perf_defconfig

          test -f \
            kernel/drivers/staging/qcacld-3.0/Kbuild

          test -f \
            kernel/drivers/staging/qcacld-3.0/core/hdd/inc/wlan_hdd_main.h

          test -f \
            kernel/drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c

          echo "Motorola kernel source verified."

      # ============================================================
      # LLVM
      # ============================================================

      - name: Configure LLVM 14
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="${LLVM_DIR}/bin:${PATH}"

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy

          clang --version
          ld.lld --version

      # ============================================================
      # OUTPUT
      # ============================================================

      - name: Prepare output
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          rm -rf "${OUT_DIR}"

          mkdir -p "${OUT_DIR}"

      # ============================================================
      # BASE DEFCONFIG
      #
      # IMPORTANT:
      # Capture the clean release BEFORE modifying kernel sources.
      # ============================================================

      - name: Generate base configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            vendor/bengal-perf_defconfig

          CLEAN_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          test -n "${CLEAN_RELEASE}"

          case "${CLEAN_RELEASE}" in
            *-dirty)
              echo "ERROR: base kernel is already dirty."
              exit 1
              ;;
          esac

          echo "CLEAN_RELEASE=${CLEAN_RELEASE}" >> "${GITHUB_ENV}"

          echo "Clean release:"
          echo "${CLEAN_RELEASE}"

      # ============================================================
      # NETHUNTER KERNEL CONFIGURATION
      #
      # NOTE:
      # There is deliberately NO:
      #
      # CONFIG_FEATURE_MONITOR_MODE_SUPPORT=y
      # CONFIG_FEATURE_FRAME_INJECTION_SUPPORT=y
      #
      # Those are handled by QCACLD3 Kbuild below.
      # ============================================================

      - name: Create NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p kernel/nethunter-config

          cat > kernel/nethunter-config/cebu-nethunter.config <<'EOF'
          # ============================================================
          # Moto G9 Power cebu NetHunter
          # ============================================================

          # ------------------------------------------------------------
          # HID
          # ------------------------------------------------------------

          CONFIG_HIDRAW=y
          CONFIG_UHID=y

          # ------------------------------------------------------------
          # Bluetooth
          # ------------------------------------------------------------

          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y

          CONFIG_BT_RFCOMM=m
          CONFIG_BT_RFCOMM_TTY=y

          CONFIG_BT_BNEP=m
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y

          CONFIG_BT_HIDP=m

          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIUART_BCM=y
          CONFIG_BT_HCIUART_RTL=y

          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y

          CONFIG_BT_HCIVHCI=m

          # ------------------------------------------------------------
          # USB gadget
          # ------------------------------------------------------------

          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y

          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_EEM=y

          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y

          # ------------------------------------------------------------
          # USB serial / networking
          # ------------------------------------------------------------

          CONFIG_USB_ACM=m
          CONFIG_USB_SERIAL=m
          CONFIG_USB_SERIAL_GENERIC=m

          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_NET_RNDIS_HOST=m

          CONFIG_USB_RTL8150=m
          CONFIG_USB_RTL8152=m

          # ------------------------------------------------------------
          # Sensors
          # ------------------------------------------------------------

          CONFIG_SENSORS_SSC=y
          CONFIG_SENSORS_CLASS=m

          # ------------------------------------------------------------
          # Qualcomm WLAN
          # ------------------------------------------------------------

          CONFIG_QCA_CLD_WLAN=m

          # ------------------------------------------------------------
          # Networking
          # ------------------------------------------------------------

          CONFIG_PACKET=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y

          EOF

          test -s kernel/nethunter-config/cebu-nethunter.config

          cat kernel/nethunter-config/cebu-nethunter.config

      # ============================================================
      # MERGE CONFIG
      # ============================================================

      - name: Merge NetHunter configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          export PATH="${LLVM_DIR}/bin:${PATH}"

          scripts/kconfig/merge_config.sh \
            -m \
            -O "${OUT_DIR}" \
            "${OUT_DIR}/.config" \
            nethunter-config/cebu-nethunter.config

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig

          # ----------------------------------------------------------
          # Preserve the original clean release.
          # ----------------------------------------------------------

          BASE_VERSION="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelversion
          )"

          RELEASE_SUFFIX="${CLEAN_RELEASE#${BASE_VERSION}}"

          echo "Base version:    ${BASE_VERSION}"
          echo "Clean release:  ${CLEAN_RELEASE}"
          echo "Release suffix: ${RELEASE_SUFFIX}"

          scripts/config \
            --file "${OUT_DIR}/.config" \
            --disable LOCALVERSION_AUTO

          scripts/config \
            --file "${OUT_DIR}/.config" \
            --set-str LOCALVERSION "${RELEASE_SUFFIX}"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            olddefconfig

          CONFIG_RELEASE="$(
            make -s \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE="${CROSS_COMPILE}" \
              kernelrelease
          )"

          echo "Configured release: ${CONFIG_RELEASE}"

          test "${CONFIG_RELEASE}" = "${CLEAN_RELEASE}"

      # ============================================================
      # VERIFY REAL KERNEL CONFIG
      # ============================================================

      - name: Verify important configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel

          CONFIG="${OUT_DIR}/.config"

          required=(
            "CONFIG_HIDRAW=y"
            "CONFIG_UHID=y"

            "CONFIG_BT=y"
            "CONFIG_BT_BREDR=y"
            "CONFIG_BT_LE=y"
            "CONFIG_BT_RFCOMM=m"
            "CONFIG_BT_BNEP=m"
            "CONFIG_BT_HIDP=m"
            "CONFIG_BT_HCIUART=m"
            "CONFIG_BT_HCIVHCI=m"

            "CONFIG_USB_GADGET=y"
            "CONFIG_USB_CONFIGFS=y"
            "CONFIG_USB_CONFIGFS_NCM=y"
            "CONFIG_USB_CONFIGFS_RNDIS=y"
            "CONFIG_USB_CONFIGFS_ECM=y"
            "CONFIG_USB_CONFIGFS_EEM=y"
            "CONFIG_USB_CONFIGFS_F_HID=y"

            "CONFIG_USB_ACM=m"
            "CONFIG_USB_SERIAL=m"
            "CONFIG_USB_USBNET=y"

            "CONFIG_SENSORS_SSC=y"
            "CONFIG_SENSORS_CLASS=m"

            "CONFIG_QCA_CLD_WLAN=m"
          )

          for item in "${required[@]}"; do
            grep -Fxq "${item}" "${CONFIG}" || {
              echo "ERROR: missing configuration: ${item}"
              exit 1
            }
          done

          grep -Fxq \
            "CONFIG_LOCALVERSION_AUTO=n" \
            "${CONFIG}" || {
              echo "ERROR: LOCALVERSION_AUTO is enabled."
              exit 1
            }

          # These MUST NOT be treated as kernel .config options.
          if grep -Eq \
            '^CONFIG_FEATURE_(MONITOR_MODE_SUPPORT|FRAME_INJECTION_SUPPORT)=' \
            "${CONFIG}"; then

            echo "ERROR: QCACLD3 feature variable incorrectly placed in kernel .config."
            exit 1
          fi

          echo "Kernel configuration verification passed."

      # ============================================================
      # IMPORT QCACLD3 INJECTION FRAMEWORK
      # ============================================================

      - name: Import QCACLD3 injection framework
        shell: bash
        run: |
          set -euxo pipefail

          K="kernel/drivers/staging/qcacld-3.0"
          R="nethunter-reference/drivers/staging/qcacld-3.0"

          # ----------------------------------------------------------
          # HDD sources
          # ----------------------------------------------------------

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_inject.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_validate.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_inject_security.c" \
            "${K}/core/hdd/src/"

          cp \
            "${R}/core/hdd/src/wlan_hdd_frame_inject_debug.c" \
            "${K}/core/hdd/src/"

          # ----------------------------------------------------------
          # WMA source
          # ----------------------------------------------------------

          cp \
            "${R}/core/wma/src/wma_frame_inject.c" \
            "${K}/core/wma/src/"

          # ----------------------------------------------------------
          # HDD headers
          # ----------------------------------------------------------

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_validate.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_inject_security.h" \
            "${K}/core/hdd/inc/"

          cp \
            "${R}/core/hdd/inc/wlan_hdd_frame_inject_debug.h" \
            "${K}/core/hdd/inc/"

          # ----------------------------------------------------------
          # WMA header
          # ----------------------------------------------------------

          cp \
            "${R}/core/wma/inc/wma_frame_inject.h" \
            "${K}/core/wma/inc/"

          echo "QCACLD3 injection framework imported."

      # ============================================================
      # ADD INJECTION CONTEXT
      # ============================================================

      - name: Add injection context to Motorola HDD
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/core/hdd/inc/"
              "wlan_hdd_main.h"
          )

          text = path.read_text()

          # Forward declaration.
          if "struct hdd_injection_ctx;" not in text:
              marker = "struct hdd_adapter {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: struct hdd_adapter marker not found"
                  )

              text = text.replace(
                  marker,
                  "struct hdd_injection_ctx;\n\n" + marker,
                  1
              )

          # Adapter context.
          if "struct hdd_injection_ctx *injection_ctx;" not in text:
              marker = (
                  "\tqdf_atomic_t net_dev_hold_ref_count"
                  "[NET_DEV_HOLD_ID_MAX];\n"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: adapter injection context anchor not found"
                  )

              addition = """\tqdf_atomic_t net_dev_hold_ref_count[NET_DEV_HOLD_ID_MAX];

          #ifdef FEATURE_FRAME_INJECTION_SUPPORT
              struct hdd_injection_ctx *injection_ctx;
          #endif
          """

              text = text.replace(
                  marker,
                  addition,
                  1
              )

          path.write_text(text)

          print("Injection context added.")
          PY

      # ============================================================
      # 4.19 CREDENTIAL COMPATIBILITY
      #
      # Do NOT use get_task_cred(), because the Motorola 4.19
      # kernel does not export it for the wlan module.
      #
      # Keep the CAP_NET_RAW authorization check.
      # ============================================================

      - name: Fix 4.19 credential compatibility
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "kernel/drivers/staging/qcacld-3.0/core/hdd/src/"
              "wlan_hdd_inject_security.c"
          )

          text = path.read_text()

          pattern = re.compile(
              r"""
              QDF_STATUS
              \s+
              hdd_check_injection_capability
              \s*
              \(
                  \s*struct\s+task_struct\s*\*\s*task\s*
              \)
              \s*
              \{
              .*?
              \n\}
              """,
              re.S | re.X,
          )

          replacement = r'''QDF_STATUS hdd_check_injection_capability(
              struct task_struct *task)
          {
              bool has_capability;

              hdd_security_debug(
                  "Checking injection capabilities");

              /*
               * Motorola's 4.19 kernel does not export
               * get_task_cred() to loadable modules.
               *
               * Retain the required CAP_NET_RAW authorization
               * check using the current task.
               */
              if (!task
